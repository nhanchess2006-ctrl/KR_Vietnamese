l_english:

### Generic Faction Joining ###
 generic_events.10.t: "Liên minh với [FROM.GetNonIdeologyNameDef]?"
 generic_events.10.d: "Quan hệ quốc tế thường linh hoạt, với các thỏa thuận và liên kết nhanh chóng thay đổi từ thế hệ này sang thế hệ khác. Đôi khi ngay cả trong cùng một thế hệ, các hiệp ước được ký kết rồi bị gạt bỏ khi lợi ích thay đổi. Sự bất ổn sau Thứ Hai Đen và những diễn biến chính trị khác trên khắp thế giới đã làm gia tăng nỗi sợ hãi ở nhiều quốc gia yếu rằng khi các cường quốc giao chiến, họ sẽ bị kẹt trong làn đạn.\n\nTrong khi một số nước quay sang chủ nghĩa biệt lập vì hỗn loạn nội bộ hoặc với hy vọng rằng sự trung lập sẽ khiến họ không đáng để các cường quốc nhòm ngó, [FROM.GetNameDefCap] đã chọn con đường ngược lại. Với mọi vấn đề nội bộ giờ đây đã được giải quyết, người dân ở [FROM.GetNameDefCap] đang hướng ra bên ngoài với hy vọng tìm được sự bảo vệ mà các liên minh mang lại. Có lẽ nhờ điều kiện địa lý vượt trội, sức mạnh quân sự hay sự nhất quán về hệ tư tưởng, chúng ta là lựa chọn đồng minh của [ROOT.GetFactionName].\n\nCâu hỏi còn lại là, chúng ta có chấp nhận họ không? Một đồng minh nữa trong khối của chúng ta đồng nghĩa với việc đóng góp thêm nguồn lực cho lực lượng chung, dù mọi nguy hiểm bổ sung mà họ mang lại cho phe của chúng ta sẽ được chia sẻ chung. Mọi yêu sách cạnh tranh cần được xem xét, và mọi bất hòa họ có thể gây ra giữa các thành viên phe phái. Quyết định của chúng ta nên là gì?"
 generic_events.10.srd: "Một công hàm mới đầy thú vị đã đến với chúng ta từ [ITA.GetNonIdeologyNameDef]: thấy cuộc chiến chung hiện tại chống lại Chủ nghĩa Xã hội và mục tiêu chung là cải thiện tổ quốc, họ đã chọn đề xuất nâng Vua Amedeo lên làm nguyên thủ quốc gia, thực chất là hợp nhất hai nước chúng ta. Dù [ITA_GetNatPopLeader] sẽ vẫn là người đứng đầu Chính phủ, thủ tướng của chúng ta đã được đề nghị tư cách thành viên cấp cao trong ANI và ảnh hưởng đáng kể đối với các chính sách quân sự."
 generic_events.10.a: "Cùng nhau mạnh mẽ hơn!"
 generic_events.10.b: "Một đề xuất hay, hãy chuyển nó cho [ROOT.FactionLeader.GetNonIdeologyNameDef]!"
 generic_events.10.c: "Nghĩ lại thì, không..."

 generic_events.11.t: "[FROM.GetNonIdeologyNameDefCap] Đã Chấp nhận!"
 generic_events.11.d: "Sau khi nghe yêu cầu gia nhập liên minh của họ, [FROM.GetNameDef] đã chấp nhận đơn của chúng ta và giờ chúng ta sẽ trở thành thành viên của [FROM.GetFactionName]. Điều này hy vọng sẽ tăng cường an toàn của chúng ta trong thời kỳ khó khăn này, khi chúng ta nỗ lực đảm bảo an toàn cho người dân trước các thế lực bên ngoài và sự can thiệp của nước ngoài.\n\nTuy nhiên, điều đó không có nghĩa là thỏa thuận này miễn phí. Giờ đây chúng ta có những kỳ vọng nhất định đặt lên vai để đóng góp vào nền phòng thủ chung của các quốc gia trong [FROM.GetFactionName] và có khả năng bị kéo vào các cuộc xung đột liên quan đến khối này. Điều này bao gồm khả năng bị lôi kéo vào các cuộc chiến do các thành viên của khối này khởi xướng.\n\nGiờ chúng ta bước vào tương lai cùng nhau, vận mệnh của chúng ta giờ đây gắn bó cả bằng lời nói lẫn vũ lực. Với chút may mắn, chúng ta sẽ thu được nhiều hơn từ thỏa thuận này so với những gì đã mất về quyền tự chủ."
 generic_events.11.a: "Tuyệt vời!"

 generic_events.12.t: "[negotiator.GetNonIdeologyNameDefCap] Đề xuất Liên minh với [potential_ally.GetNonIdeologyNameDef]"
 generic_events.12.d: "Một thông báo khẩn vừa đến từ bộ ngoại giao: [negotiator.GetNonIdeologyNameDef] đã yêu cầu chúng ta xem xét đưa [potential_ally.GetNonIdeologyNameDef] vào liên minh quân sự của chúng ta. Có vẻ như [potential_ally.GetNonIdeologyNameDef] ban đầu đã đề xuất ý tưởng này với [negotiator.GetNonIdeologyNameDef], người tin rằng ý tưởng này đủ giá trị để chuyển đến chúng ta.\n\nLợi ích khá rõ ràng. Về chiến lược, có thêm lực lượng sẵn có hầu như luôn là điều tốt, và [potential_ally.GetNonIdeologyNameDef] đã thừa nhận rằng họ có khả năng sẽ buộc phải tham gia vào tất cả các cuộc xung đột mà chúng ta có thể dính líu, bất kể nguồn gốc của chúng. Tuy nhiên, ý tưởng này không phải không có rủi ro — chúng ta cũng sẽ được kỳ vọng tham gia vào các cuộc chiến của [potential_ally.GetNonIdeologyNameDef], và việc lập liên minh với họ có thể trái với mục tiêu chiến lược hiện có của chúng ta. Những câu hỏi như vậy luôn phải được cân nhắc khi có một liên minh mới trên bàn.\n\nTất cả những điều đó nói lên rằng, quyết định của chúng ta là gì?"
 generic_events.12.a: "Hãy để họ tham gia."
 generic_events.12.b: "Chúng ta không muốn họ."

 generic_events.13.t: "[FROM.GetNonIdeologyNameDefCap] Đã Chấp nhận!"
 generic_events.13.d: "Tin tốt! Sau khi xem xét đề xuất của [negotiator.GetNonIdeologyNameDef], [FROM.GetNonIdeologyNameDef] đã chấp nhận yêu cầu gia nhập liên minh của chúng ta. Với những người bạn như thế này, chắc chắn chúng ta sẽ ngủ ngon hơn nhiều."
 generic_events.13.a: "Tuyệt vời."

 generic_events.14.t: "[FROM.GetNonIdeologyNameDefCap] Đã Chấp nhận!"
 generic_events.14.d: "Tin tốt! Sau khi xem xét đề xuất của chúng ta, [FROM.GetNonIdeologyNameDef] đã đồng ý cho [potential_ally.GetNonIdeologyNameDef] vào liên minh. Cả hai chúng ta chắc chắn sẽ hưởng lợi từ thỏa thuận này."
 generic_events.14.a: "Tuyệt vời."

 generic_events.15.t: "[FROM.GetNonIdeologyNameDefCap] Đã Từ chối!"
 generic_events.15.d: "Tin không vui: bất chấp sự bảo trợ của [negotiator.GetNonIdeologyNameDef], [FROM.GetNonIdeologyNameDef] đã từ chối đề nghị gia nhập liên minh của chúng ta. Có vẻ như mục tiêu của họ không ăn khớp như chúng ta từng nghĩ."
 generic_events.15.a: "Tổn thất của họ."

 generic_events.16.t: "[FROM.GetNonIdeologyNameDefCap] Đã Từ chối!"
 generic_events.16.d: "Tin gây sốc: bất chấp việc chúng ta lập luận thay cho họ, [FROM.GetNonIdeologyNameDef] đã từ chối cho [potential_ally.GetNonIdeologyNameDef] vào liên minh. Bộ ngoại giao của chúng ta hoàn toàn bị bất ngờ bởi diễn biến này — họ tin rằng tư duy chiến lược của chúng ta gần gũi hơn nhiều so với vẻ ngoài."
 generic_events.16.a: "Cái gì?"

 generic_events.17.t: "[FROM.GetNonIdeologyNameDefCap] Đã Từ chối!"
 generic_events.17.d: "Bất chấp những lời kêu gọi thuyết phục của chúng ta rằng chúng ta có thể là một người đóng góp và thành viên hiệu quả của liên minh của họ, trước sự thất vọng của chúng ta, [FROM.GetNameDef] đã từ chối yêu cầu gia nhập [FROM.GetFactionName] của chúng ta. Theo một số cách, điều này có thể đoán trước được: các liên minh thường mong manh và đầy nguy hiểm, và một số thận trọng là điều dễ hiểu khi lập chúng. Tuy nhiên, sự từ chối này khiến chúng ta ở vào tình thế khó khăn. Hoặc họ không có ý định bảo vệ chúng ta, hoặc một cách hoài nghi hơn, họ coi chúng ta là mục tiêu tương lai trên chiến trường.\n\nVậy chúng ta phải nhanh chóng tìm ra một phương tiện hữu hiệu để bảo đảm an ninh quốc gia. Dù điều này có nghĩa là tìm một liên minh khác để che chắn chúng ta khỏi xâm lược, kêu gọi nhiều phe phái như một người hòa giải trung lập nhân từ, hay quay vào trong để phòng thủ vũ trang, chúng ta cần đảm bảo an ninh cho người dân. [FROM.GetFactionName] có thể hối tiếc hoặc không về việc từ chối chúng ta, nhưng điều thiết yếu là chúng ta không hối tiếc về kết quả này."
 generic_events.17.a: "Tổn thất của họ."

 generic_events.18.t: "Liên minh với [FROM.GetFactionName]?"
 generic_events.18.d.generic: "Quan hệ quốc tế thường linh hoạt, với các thỏa thuận và liên kết nhanh chóng thay đổi từ thế hệ này sang thế hệ khác. Đôi khi ngay cả trong cùng một thế hệ, các hiệp ước được ký kết rồi bị gạt bỏ khi lợi ích thay đổi. Sự bất ổn sau Thứ Hai Đen và những diễn biến chính trị khác trên khắp thế giới đã làm gia tăng nỗi sợ hãi ở nhiều quốc gia yếu rằng khi các cường quốc giao chiến, họ sẽ bị kẹt ở giữa.\n\nTrong nỗ lực theo đuổi lợi ích chung, [FROM.GetFactionName] đã tập hợp lại thành một liên minh quân sự toàn diện. Họ đã tìm kiếm tư cách thành viên của chúng ta, đề nghị tiềm năng bảo vệ thêm (dù khỏi mối đe dọa bên ngoài hay từ chính họ), và để đổi lấy quan hệ quân sự và kinh tế sâu sắc hơn, chúng ta sẽ trở thành một phần của một khối mạnh mẽ và thống nhất hơn.\n\nTuy nhiên, việc gia nhập không phải không có rủi ro. Chúng ta có khả năng bị kéo vào bất kỳ xung đột nào phát sinh liên quan đến liên minh này, và có thể những đóng góp của chúng ta sẽ lớn hơn lợi ích chúng ta nhận được từ tư cách thành viên. Điều thiết yếu là với tư cách một quốc gia, chúng ta phải cân nhắc cẩn thận chi phí và lợi ích của một thỏa thuận như vậy."
 generic_events.18.d.INT: "Quốc tế Cộng sản, liên minh quân sự của các cường quốc xã hội chủ nghĩa hàng đầu thế giới, đã kín đáo tiếp cận chúng ta với lời đề nghị gia nhập hàng ngũ của họ, coi liên minh với quốc gia chúng ta là vì lợi ích của tất cả và là một bước tiến lớn trong cuộc đấu tranh lâu dài hướng tới giải phóng giai cấp vô sản quốc tế. Lời đề nghị này đi kèm với những lợi ích không thể phủ nhận, chúng ta chắc chắn có thể mong đợi một lượng lớn hỗ trợ: giúp đỡ chống lại kẻ thù và hướng tới hiện thực hóa các mục tiêu quân sự của chúng ta, bảo vệ nếu cần, và quan trọng không kém, hỗ trợ phát triển lực lượng vũ trang và thậm chí cả nền kinh tế của chúng ta thông qua chương trình Phalanstère. Tuy nhiên, nó đi kèm với những nghĩa vụ có lẽ đáng sợ, đặt chúng ta vào con đường xung đột cuối cùng nhưng chắc chắn với Kaiser và các đồng minh của ông ta. Chúng ta nên phản hồi lời đề nghị của họ như thế nào?"
 generic_events.18.a: "Cùng nhau mạnh mẽ hơn!"
 generic_events.18.b: "Nghĩ lại thì, không..."

 generic_events.19.t: "[FROM.GetNonIdeologyNameDefCap] Đã Chấp nhận!"
 generic_events.19.d.generic: "Sau một số thảo luận, [FROM.GetNameDefCap] đã chấp nhận lời mời gia nhập [ROOT.GetFactionName] của chúng ta, như chúng ta hằng mong mỏi. Một thành viên mới của liên minh thường được hoan nghênh, mang lại an toàn hơn cho nhau và ít nhất đảm bảo hòa bình giữa các thành viên trong đó. Những đóng góp về lực lượng quân sự, tài chính và trọng lượng ngoại giao của họ hy vọng sẽ thúc đẩy lợi ích chung của [ROOT.GetFactionName], nhưng có một số lo ngại phía trước.\n\nMột đồng minh nữa trong khối của chúng ta đồng nghĩa với việc đóng góp thêm nguồn lực cho lực lượng chung, dù mọi nguy hiểm bổ sung mà họ mang lại cho phe của chúng ta sẽ được chia sẻ chung. Mọi yêu sách cạnh tranh cần được xem xét, và mọi bất hòa họ có thể gây ra giữa các thành viên phe phái.\n\nChúng ta sẽ cần làm việc siêng năng để đảm bảo những vấn đề này được giải quyết êm thấm, để liên minh này có lợi cho mọi người (hoặc ít nhất là chính chúng ta). Tuy nhiên, điều này không nên làm lu mờ chiến thắng ngoại giao mà chúng ta đã giành được hôm nay cho tất cả người dân của chúng ta."
 generic_events.19.d.INT: "Đã đến lúc vui mừng! [From.GetNameDefCap] đã chấp nhận lời đề nghị gia nhập liên minh quân sự của chúng ta, như chúng ta hằng mong mỏi. Với quyết định này, họ đã được đảm bảo sự hỗ trợ bất diệt của chúng ta như những đồng minh trong cuộc đấu tranh toàn cầu vì giải phóng giai cấp công nhân, và chúng ta đã có được một đồng minh quý giá chống lại những kẻ thù hùng mạnh không thể phủ nhận của chúng ta. Chẳng mấy chốc, nhiều người khác sẽ theo họ: “Quốc tế Cộng sản sẽ là loài người”!"
 generic_events.19.a: "Tuyệt vời!"

 generic_events.20.t: "[FROM.GetNonIdeologyNameDefCap] Đã Từ chối!"
 generic_events.20.d.generic: "Sau một số thảo luận, trước sự thất vọng của chúng ta, [FROM.GetNameDef] đã từ chối lời mời gia nhập [ROOT.GetFactionName] của chúng ta. Thật không may, đây không phải là chuyện hiếm khi xây dựng liên minh. Một số quốc gia sợ mất đi sự linh hoạt ngoại giao mà một cam kết chính thức sẽ tạo ra, hy vọng tránh bị kéo vào một cuộc xung đột thất bại hoặc muốn gia nhập một liên minh phù hợp hơn. Cũng có thể họ có những toan tính loại trừ lẫn nhau với mục tiêu của chúng ta, dù hy vọng không phải theo cách thù địch.\n\nDù thế nào đi nữa, [FROM.GetNameDef] sẽ không tạo nên hay phá vỡ liên minh của chúng ta. Hoặc ít nhất đó phải là trường hợp nếu phe của chúng ta có trọng lượng. Chúng ta sẽ tiếp tục đạt được mục tiêu bằng cách này hay cách khác, và nếu họ may mắn, [FROM.GetNameDef] sẽ không hối tiếc quá nhiều về quyết định tồi tệ của mình."
 generic_events.20.d.INT: "Trước sự thất vọng của chúng ta, [From.GetNameDef] đã từ chối lời đề nghị gia nhập liên minh quân sự của chúng ta. Có lẽ quá sợ hãi trước sức mạnh không thể phủ nhận của kẻ thù, hoặc đơn giản là chưa đủ cam kết với cuộc chiến vì giải phóng giai cấp vô sản. Dù thế nào, dù đây chắc chắn là kết quả đáng tiếc từ nỗ lực ngoại giao của chúng ta, nhiều người khác sẽ cùng chúng ta trong cuộc đấu tranh này: “Quốc tế Cộng sản sẽ là loài người”!"
 generic_events.20.a: "Tổn thất của họ."

### Incoming War-ning ###
 generic_events.30.t: "Chuẩn bị cho Chiến tranh!"
 generic_events.30.d: "Chúng ta đã nhận được nhiều báo cáo rằng quân đội [From.GetAdjective] hiện đang tập trung, và một lượng lớn trinh sát đang diễn ra dọc biên giới [Root.GetAdjective]. Các quan chức quân sự nói rõ ràng [From.GetNameDef] đang lên kế hoạch xâm lược [Root.GetNameDef], một cuộc xâm lược có thể bắt đầu bất cứ lúc nào trong vài tuần tới."
 generic_events.30.a: "Chúng ta phải sẵn sàng!"
 generic_events.31.d: "Chúng ta đã nhận được tin báo động từ [From.GetNameDef] rằng quân đội [From.From.GetAdjective] hiện đang tập trung, và một lượng lớn trinh sát đang diễn ra dọc biên giới [From.GetAdjective]. Các quan chức quân sự nói rõ ràng [From.From.GetNameDef] đang lên kế hoạch xâm lược [From.GetNameDef], một cuộc xâm lược có thể bắt đầu bất cứ lúc nào trong vài tuần tới."
