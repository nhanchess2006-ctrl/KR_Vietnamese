### Subtype Descriptions ###
 totalist_subtype_desc: "Toàn trị chủ nghĩa là một cách gọi khái quát cho các chính phủ lấy cảm hứng từ các nhánh toàn trị, tiên phong hoặc cực kỳ độc tài của chủ nghĩa xã hội. Được đặt tên theo các đảng xã hội chủ nghĩa dân tộc khác nhau đã cùng nhau ký Hiến chương Toàn trị, nhiều phong trào xã hội chủ nghĩa độc tài khác trên toàn cầu đã được liên kết với họ, đôi khi khiến họ bực bội."
 syndicalist_subtype_desc: "Công đoàn chủ nghĩa là hệ tư tưởng cách mạng hàng đầu trên thế giới, một sự tiến hóa của các dòng xã hội chủ nghĩa tập trung vào công đoàn cũ đã đi từ một hình thức hành động trực tiếp nổi dậy đến một hệ thống chính phủ. Thường kết hợp chủ nghĩa xã hội công nghiệp và tự do nguyện, nhiều chính phủ công đoàn chủ nghĩa hiện đại lấy cảm hứng từ các hệ thống tiên phong ở Pháp và Anh, dù nhiều nước đưa vào những ý tưởng mới hoặc địa phương của riêng mình."
 radical_socialist_subtype_desc: "Xã hội chủ nghĩa Cấp tiến bao gồm một loạt các chính phủ cánh tả cách mạng, và các phe phái này bác bỏ chủ nghĩa cải cách chính trị trong các cấu trúc phản động như phương tiện tối thượng để thay đổi hiện trạng. Các dòng đa dạng của Xã hội chủ nghĩa Cấp tiến có thể khác nhau đáng kể về niềm tin, nhưng chia sẻ mong muốn chung là thấy một tương lai khác biệt hoàn toàn so với những gì trật tự cũ mang lại."
 social_democrat_subtype_desc: "Dân chủ Xã hội đại diện cho các chính phủ khác nhau do các nhóm cánh tả cải cách lãnh đạo, những người bác bỏ nhu cầu cố hữu về đấu tranh giai cấp bạo lực để đạt được mục tiêu của họ, đôi khi xung đột với các đồng nghiệp cấp tiến hơn trong quá trình đó. Nhiều người thay vào đó kêu gọi thay đổi thông qua lá phiếu, dù nếu bị dồn ép, những nhà cách mạng kiểu này không phải là không có."
 social_liberal_subtype_desc: "Tự do Xã hội phản ánh nhiều phong cách cai trị của truyền thống tự do tiến bộ, thường thúc đẩy thay đổi trong khế ước xã hội để đáp ứng nhu cầu ngày càng tăng của người dân. Các chính phủ này có xu hướng tập trung vào việc mở rộng hoặc bảo vệ các quyền tự do dân sự thông qua cả cải cách chính trị và kinh tế, dù mục tiêu của họ khác nhau giữa các quốc gia."
 market_liberal_subtype_desc: "Các chính phủ Tự do Thị trường bắt nguồn từ chủ nghĩa tự do cổ điển, và có gốc rễ trong nhiều triết lý Khai sáng. Đề cao tính thiêng liêng của tự do cá nhân và thường ủng hộ chính phủ đại diện và doanh nghiệp tự do, loại này đại diện cho một loạt các nhóm bao gồm những người tự do thị trường tự do, những người tự do quốc gia và những người tự do bảo thủ."
 social_conservative_subtype_desc: "Bảo thủ Xã hội bao gồm nhiều chính phủ dân chủ tìm cách bảo tồn, duy trì hoặc củng cố các giá trị truyền thống của người dân trước những hoàn cảnh thay đổi. Những người theo đuổi nó không phải là phản động cứng nhắc, thường ủng hộ pháp quyền và dân chủ, và sẵn sàng tìm kiếm những thay đổi có chừng mực, gia tăng phù hợp với đạo đức của họ trong các hệ thống chính trị mà họ sống."
 authoritarian_democrat_subtype_desc: "Dân chủ Độc tài mô tả một loạt rộng các hệ thống chính phủ bán đại diện được đặc trưng bởi những nhân vật và nhóm lợi ích quyền lực cai trị thông qua vẻ ngoài của cơ quan lập pháp tự do. Đôi khi là sản phẩm của niềm tin hệ tư tưởng hoặc chủ nghĩa thực dụng thuần túy, những lần khác cấu trúc chính trị này xuất hiện do các thể chế dân cử yếu hoặc chuyển tiếp."
 paternal_autocrat_subtype_desc: "Chuyên chế Gia trưởng thường là một tư duy hơn là một hệ tư tưởng, và các chính phủ chuyên chế gia trưởng đôi khi công khai tố cáo đảng phái hệ tư tưởng. Thường kêu gọi một nhà lãnh đạo mạnh mẽ, khôn ngoan như một Vị Vua, Tướng lĩnh hoặc Giáo sĩ để bảo vệ và hướng dẫn người dân, bản chất độc đoán của nó đã không ngăn cản những người thực hành nắm giữ ảnh hưởng đối với quần chúng."
 national_populist_subtype_desc: "Dân túy Quốc gia là sản phẩm của sự hội tụ của các phong trào dân tộc cực đoan cánh hữu nảy sinh trong một thế giới đang thay đổi và mô tả các chính phủ tìm cách khai thác năng lượng của người dân cho những mục tiêu thường là cấp tiến. Thường mang mối khinh miệt đối với nền dân chủ truyền thống và khai thác sự bất mãn của quần chúng với cơ sở, nhiều người quay sang những nguồn cảm hứng chiết trung để giải quyết các vấn đề hàng đầu."

