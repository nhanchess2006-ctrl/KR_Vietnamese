### Decisions ###
 generic_raise_stability: "[generic_raise_stability_text]"
 generic_raise_stability_desc: "[generic_raise_stability_desc_text]"

 generic_raise_stability_socialist: "Cải thiện Điều kiện Công nhân"
 generic_raise_stability_socialist_desc: "Công việc nhà máy vất vả và đầy rẫy nhiều nguy hiểm. Cải thiện điều kiện cho công nhân nhà máy của chúng ta sẽ giảm sản lượng trong ngắn hạn, nhưng lợi ích dài hạn là xứng đáng."

 generic_raise_stability_liberal: "Lập pháp các Quyền tự do"
 generic_raise_stability_liberal_desc: "Có lẽ cách dễ nhất để cải thiện sự ổn định của đất nước là cho người dân những gì họ muốn. Nó sẽ bao gồm một số thỏa hiệp không thoải mái, nhưng lý tưởng nhất, những biện pháp này chỉ là tạm thời và được thiết kế để xoa dịu họ cho đến khi trật tự có thể được khôi phục đúng cách."

 generic_raise_stability_conservative: "Đàn áp của Cảnh sát"
 generic_raise_stability_conservative_desc: "Tình trạng mất trật tự đã trở nên tràn lan. Chúng ta phải nới lỏng các hạn chế đối với lực lượng cảnh sát, và cho họ quyền tự do làm công việc của mình trong việc bắt giữ những kẻ phạm tội tồi tệ nhất."

 generic_raise_stability_authoritarian: "Điều Quân đội"
 generic_raise_stability_authoritarian_desc: "Cách đối phó với tình trạng mất trật tự trong quốc gia là điều quân đội và đàn áp hoàn toàn. Không phải ai cũng sẽ hài lòng về điều đó, đúng vậy, nhưng đôi khi thiết quân luật là lựa chọn duy nhất."

 generic_raise_support: "[generic_raise_support_text]"
 generic_raise_support_desc: "[generic_raise_support_desc_text]"

 rally_public_support: "Tập hợp Ủng hộ Công chúng"
 rally_public_support_desc: "Với một chút quyền lực chính trị và một số hỗ trợ công nghiệp, chúng ta sẽ tập hợp những người ủng hộ về phía mình. Dù điều này sẽ mất thời gian và nguồn lực, nó sẽ cải thiện vị thế chính trị của chúng ta về lâu dài."

 solidify_control: "Củng cố Kiểm soát"
 solidify_control_desc: "Một chút sử dụng khéo léo quyền lực chính trị ở đây và một số nguồn lực ở kia và chúng ta sẽ loại bỏ các trở ngại chính trị; chúng ta có thể không loại bỏ được tất cả, nhưng ngay cả việc loại bỏ một số sẽ mở đường và cải thiện quyền lực chính trị của chúng ta về lâu dài."

 restructure_supply_system: "Tổ chức lại Hệ thống Đường sắt"
 restructure_supply_system_desc: "Bằng cách chuyển hướng vật liệu xây dựng và công nhân đường sắt, chúng ta có thể nhanh chóng tạo ra một số lượng nhỏ kho tiếp tế tạm thời dọc theo một số tuyến đường sắt của chúng ta. Tuy nhiên, điều này không bền vững.\n\n§RQuyết định này chỉ có thể được thực hiện một lần. Phần thưởng sẽ biến mất nếu bạn xây dựng thêm hơn 3 trung tâm tiếp tế.§!"

 debug_decisions: "Quyết định Gỡ lỗi"
 turn_off_plpc_debug: "Tắt Hội nghị do Người chơi Dẫn dắt"
