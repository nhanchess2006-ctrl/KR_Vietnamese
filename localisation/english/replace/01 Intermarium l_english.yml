 MIE_transferable_armored_division_tt: "Sư đoàn thiết giáp này sẽ được chuyển giao giữa các quốc gia Đông Âu bất cứ khi nào quốc gia chịu trách nhiệm phân phối nguồn lực thay đổi."

 intermarium_events.11.t: "Hợp tác Đông Âu"
 intermarium_events.11.d: "[MIE_leader.GetNameDefCap] đã chọn đầu tư một phần quỹ hợp tác phòng thủ chung của chúng ta bằng cách thành lập một sư đoàn thiết giáp quốc tế gồm các tình nguyện viên từ mọi quốc gia Đông Âu. Mặc dù [MIE_leader.GetNameDef] sẽ tích hợp nó vào cấu trúc quân đội của mình, nó sẽ được chuyển từ quốc gia này sang quốc gia khác khi họ đầu hàng."
 intermarium_events.11.a: "Tuyệt!"

 intermarium_events.12.t: "Mối đe dọa từ Nga đã được Vô hiệu hóa"
 intermarium_events.12.d: "Nga đã thất thủ trước sức mạnh của Reichspakt, và không cần tiếp tục dự án Hợp tác nữa - nó đã hoàn thành mục đích chính của mình. Giờ đây chúng ta có thể yên tâm nghỉ ngơi, biết rằng Nga sẽ không đe dọa nền độc lập của chúng ta một lần nữa."
 intermarium_events.12.a: "Một ngày trọng đại."

 intermarium_events.13.t: "Đức Quyên góp Thiết bị"
 intermarium_events.13.d: "Bộ Chiến tranh Đức đã có một khoản quyên góp hào phóng các thiết bị quân sự cũ cho chương trình EEDC. Những khẩu Mauser cũ nhưng đáng tin cậy này sẽ được sử dụng tốt trong tay những người yêu nước Baltic và Slav đang bảo vệ nhà cửa chống lại mối đe dọa Nga."
 intermarium_events.13.a: "Deutschland über alles."

 intermarium_events.14.t: "Baltische Feldgendarmerie Đến"
 intermarium_events.14.d: "Một đơn vị cảnh sát quân sự chống nổi dậy được huấn luyện đặc biệt đã đến từ Kaiserreich để củng cố lực lượng an ninh của chúng ta. Với kinh nghiệm lâu năm trong việc đối phó với các lực lượng du kích như Forest Brothers, những người này chắc chắn sẽ tỏ ra hữu ích trong việc kiềm chế cuộc nổi loạn ở các vùng đất Baltic."
 intermarium_events.14.a: "Chỉ đạo họ đến Latvia."
 intermarium_events.14.b: "Chỉ đạo họ đến Estonia."

 intermarium_events.15.t: "Đức Đề nghị Hỗ trợ Thực thi Pháp luật"
 intermarium_events.15.d: "Berlin đề xuất với chúng ta một chiến dịch chung chống lại những kẻ khủng bố của Mặt trận Hoạt động. Họ sẵn sàng điều động một số đơn vị cảnh sát quân sự từ Đông Phổ đến phía biên giới Litva, và phối hợp các cuộc đột kích chung chống lại LAF. Với lực lượng kết hợp của chúng ta, chúng ta chắc chắn sẽ gây áp lực mạnh lên LAF."
 intermarium_events.15.a: "Tốt."

 intermarium_events.17.t: "Đảo chính Thân Đức tại Belarus!"
 intermarium_events.17.d: "Có vẻ như các cơ quan tình báo Đức đã phát hiện ra âm mưu của chúng ta với chính phủ Belarus và đã hành động quyết đoán. Theo lệnh của Đức, các phần tử phản động trong quân đội Belarus đã nắm quyền kiểm soát Minsk và bắt giữ Chủ tịch Taraškievič với cáo buộc phản quốc. Ngay khi chúng ta nói, những người xã hội chủ nghĩa đang bị bắt giữ ở Belarus khi quân đội tư sản đang dập tắt tự do của người dân Belarus. Giờ đây họ không thể tham gia cuộc đấu tranh của chúng ta khi chiến tranh bắt đầu - nhưng sẽ làm hết sức mình để gây tổn hại cho những nỗ lực của chính phủ quân sự nhằm chống lại chúng ta. Giờ đây là nghĩa vụ anh em của chúng ta để giải phóng người Belarus khỏi áp bức Phổ!"
 intermarium_events.17.a: "Đến Minsk!"
 GER_coup_BLR: "Đảo chính Thân Đức tại White Ruthenia"

 intermarium_events.18.t: "Thỏa thuận Cứu trợ của Đức"
 intermarium_events.18.d: "Bạn bè của chúng ta ở Berlin đã không bỏ mặc chúng ta! Bất chấp tình trạng hỗn loạn kinh tế của chính họ, chính phủ Đức sẵn lòng cấp cho các mặt hàng xuất khẩu ngũ cốc của chúng ta một số miễn trừ bất chấp các chính sách bảo hộ gia tăng của họ để bảo vệ ngành nông nghiệp của chính họ. Ngoài ra, họ sẵn lòng tái cơ cấu một phần nợ quốc gia của chúng ta mà chúng ta nợ các ngân hàng Đức, giảm bớt đáng kể gánh nặng tài chính mà chúng ta đang đối mặt. Những miễn trừ này sẽ phần nào giảm bớt các vấn đề ở vùng nông thôn."
 intermarium_events.18.a: "Thật là những đồng minh duyên dáng mà chúng ta có."

 intermarium_events.19.t: "Giờ Khắc Đã Đến"
 intermarium_events.19.d: "Các đơn vị trinh sát của chúng ta đã phát hiện một tập hợp lớn lực lượng Nga ở biên giới. Sau nhiều năm căng thẳng gia tăng, [RUS.GetNameDef] dường như có ý định tái chinh phục phần lớn Đông Âu và phá hủy nền độc lập của chúng ta. Hợp tác Phòng thủ Đông Âu đã từ từ xây dựng năng lực quân sự của chúng ta và các đồng minh, ngoài những nỗ lực của chính chúng ta, vì vậy chúng ta đã chuẩn bị tốt nhất có thể. Đức đã tuyên bố rằng họ muốn chúng ta có thể duy trì phòng thủ chống lại Nga đủ lâu cho đến khi họ có thể loại bỏ Quốc tế Cộng sản ở phía tây, và rằng việc chuyển hướng lực lượng của họ sang phía đông một cách cưỡng bức sẽ chỉ khiến cuộc chiến hai mặt trận trở nên khó khăn hơn."
 intermarium_events.19.a: "Bạn điên à? Chúng ta không thể đối mặt với Nga một mình."
 intermarium_events.19.b: "Chúng ta sẵn sàng bảo vệ bản thân và các nước láng giềng!"
 intermarium_events.19.c: "Chúng ta sẵn sàng bảo vệ bản thân!"
 intermarium_events.19.b.tt: "Cho đến khi §H[FRA.GetNameDef]§! đầu hàng, §H[GER.GetNameDef]§! và các đồng minh của họ sẽ không gửi bất kỳ sư đoàn nào đến biên giới của chúng ta, và chúng ta sẽ đối mặt với người Nga một mình.\nCác quốc gia trong §HHợp tác Phòng thủ Đông Âu§! vẫn sẽ có thể bảo vệ chúng ta và lẫn nhau.\n\n§RCẢNH BÁO: Điều này sẽ khiến cuộc chiến với Nga khó khăn hơn một chút.§!"
 intermarium_events.19.c.tt: "Cho đến khi §H[FRA.GetNameDef]§! đầu hàng, §H[GER.GetNameDef]§! và các đồng minh của họ sẽ không gửi bất kỳ sư đoàn nào đến bất kỳ ai trong §HHợp tác Phòng thủ Đông Âu§!.\n\n§RCẢNH BÁO: Điều này sẽ khiến cuộc chiến với Nga khó khăn hơn, và họ sẽ nhận thêm $infantry_equipment$.§!"