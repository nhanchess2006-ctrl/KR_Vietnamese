 intermarium_events.2.t: "Hợp tác Đông Âu"
 intermarium_events.2.d: "[MIE_leader.GetNameDefCap] đã chọn đầu tư một phần quỹ hợp tác phòng thủ chung của chúng ta bằng cách tổ chức một cuộc tập trận quân sự chung giữa các quốc gia Đông Âu. Tại đây, các tướng lĩnh thiên về tấn công và thiết giáp đã mô phỏng một cuộc phản công chống lại lực lượng địch, và trao đổi mẹo và lời khuyên với nhau."
