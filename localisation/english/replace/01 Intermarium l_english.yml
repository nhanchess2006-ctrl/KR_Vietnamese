l_english:

### EE Cooperation Mechanics ###
 intermarium_events.0.t: "Mối đe dọa từ Nga"
 intermarium_events.0.d: "Thời kỳ suy thoái kéo dài hàng thập kỷ của Nga đã kết thúc, và giờ đây người Nga đang tái thiết - họ đã đang đưa ra yêu sách đối với các lãnh thổ đế quốc cũ của mình, và các quốc gia Đông Âu chắc chắn sẽ là một trong những mục tiêu của họ.\n\nĐể đảm bảo mối đe dọa từ Nga được kiềm chế và các quốc gia Đông Âu có thể bảo vệ chủ quyền của mình, các nhà lãnh đạo và tướng lĩnh của Oststaaten đã tụ họp tại [MIE_leader.Capital.GetCapitalVictoryPointName] để thảo luận về một chương trình hợp tác lẫn nhau. Một quỹ phòng thủ quân sự chung đã được thành lập và [MIE_leader.GetNameDef] đã được giao phó việc quản lý nó để tài trợ cho các dự án phòng thủ chung của khu vực."
 intermarium_events.0.a: "Tuyệt!"

 MIE_decisions: "Hợp tác Phòng thủ Đông Âu"
 MIE_decisions_desc: "[?global.russia.GetNameDefCap] đang hồi sinh, và an ninh của khu vực Đông Âu đang bị đe dọa. Khi Đại Chiến Thế Giới lần thứ hai bắt đầu, chúng ta sẽ phải chuẩn bị đối mặt với cơn bão Nga - và trừ khi chúng ta hợp tác, chúng ta sẽ bị tiêu diệt từng người một.\n\nSau khi [?global.russia.GetNameDef] kích hoạt cây chính sách đối ngoại của mình, tất cả các thành viên phía đông của Reichspakt sẽ mở khóa khả năng §Ygóp chung nguồn lực§! và phân phối chúng giữa các quốc gia thành viên để loại bỏ bất kỳ mắt xích yếu nào. Quốc gia chịu trách nhiệm phân phối nguồn lực chung có thể đầu tư vào các quốc gia thành viên khác để §Yxây dựng công sự§!, §Ytăng sư đoàn§!, và cung cấp các §YTinh thần Quốc gia§! có lợi.\n\nNguồn lực chung hiện tại:\n    £rifle_texticon  $infantry_equipment$: §Y[?global.MIE_infantry_equipment]§!\n    £support_texticon  $support_equipment$: §Y[?global.MIE_support_equipment]§!\n    £unit_artillery_icon_small  $artillery_equipment$: §Y[?global.MIE_artillery_equipment]§!\n\n[MIE_leader.GetNameWithFlag] hiện đang chịu trách nhiệm phân phối nguồn lực chung."
 MIE_intermarium_active: "§YHợp tác Phòng thủ Đông Âu§! đang hoạt động."
 MIE_intermarium_formed: "Chương trình Hợp tác Phòng thủ Đông Âu đã bắt đầu."
 MIE_member: "Là thành viên của §YHợp tác Phòng thủ Đông Âu§!."

 MIE_decisions_GER: "Ostpolitik"
 MIE_decisions_GER_desc: "Đế quốc của chúng ta ở phía đông trải dài từ Baltic đến Biển Đen. Oststaaten là một sự pha trộn thực dụng của các quốc gia chư hầu trên thực tế, được giữ vững hàng ngũ nhờ nỗi sợ Nga cũng như sức mạnh của chúng ta. Chúng ta liên tục theo dõi các diễn biến chính trị của họ và phản ứng khi cần thiết.\n\n[POL_in_RP]"

 POL_in_RP_yes: "Ba Lan có thể là một trong những chư hầu trung thành nhất của chúng ta hiện tại, nhưng không có gì đảm bảo rằng điều này sẽ tiếp tục như vậy. Chúng ta phải cân nhắc cẩn thận các khoản đầu tư của mình vào Ba Lan để đảm bảo lòng trung thành và hợp tác kinh tế của họ.\n\n[POL_GER_polish_loyalty]\n"

 POL_early: "Kết quả bầu cử dự đoán cho những người ủng hộ August IV: [POL_circle_chance]"
 POL_status_stable: "§GBa Lan trung thành và ổn định.§!"
 POL_status_restless: "§YBa Lan ổn định, dù tình hình có thể thay đổi.§!"
 POL_status_uprising_ready: "§YBa Lan bất ổn, và những thất bại quân sự có thể kích hoạt một cuộc nổi dậy.§!"
 POL_status_uprising_imminent: "Một cuộc nổi dậy ở Ba Lan đang đến gần!"
 POL_status_rebellious: "§RBa Lan đang nổi loạn!§!"

 GER_sponsor_MIE: "Tài trợ EEDC"
 GER_sponsor_MIE_desc: "Hợp tác Phòng thủ Đông Âu được thành lập để điều phối việc xây dựng quân đội của các đội quân Oststaat. Tổ hợp công nghiệp-quân sự của chúng ta đã tham gia vào nó, dù sự hỗ trợ trực tiếp hơn từ chính phủ có thể củng cố chương trình hơn nữa."
 GER_fight_forest_brothers: "Thành lập Baltische Feldgendarmerie"
 GER_fight_forest_brothers_desc: "Việc điều động một lực lượng cảnh sát quân sự tạm thời đến Công quốc Baltic Thống nhất có thể là cần thiết để giúp họ trong cuộc chiến chống lại những người ly khai Baltic."
 GER_fight_LAF: "Tăng cường Cảnh sát Litva"
 GER_fight_LAF_desc: "Chính phủ Litva đang bận rộn với cái được cho là Mặt trận Hoạt động Litva do Nga tài trợ, một tổ chức khủng bố chịu trách nhiệm cho nhiều hành vi tàn bạo. Chúng ta có thể điều động cho họ một số lực lượng chuyên biệt từ Phổ để đối phó với phiến quân."
 GER_BLR_coup: "Loại bỏ Chính phủ BSDP"
 GER_BLR_coup_desc: "Chúng ta đã khoan dung với những thử nghiệm của White Ruthenia với nền dân chủ cánh tả, nhưng rõ ràng đây là một sai lầm. Các nguồn tin tình báo của chúng ta đã thông báo rằng họ đã thành lập một hiệp ước bí mật với Moscow, cùng với các kế hoạch phản bội chúng ta. Điều này không thể được phép xảy ra."

 POL_GER_buy: "Đầu tư vào Ba Lan"
 POL_GER_buy_desc: "Tăng cường kiểm soát kinh tế của chúng ta đối với Ba Lan sẽ củng cố sự kìm kẹp của chúng ta đối với họ, và đảm bảo rằng chính sách đối ngoại tương lai của họ sẽ phục vụ tốt lợi ích kinh doanh của chúng ta."
 POL_GER_sell: "Bán Tài sản tại Ba Lan"
 POL_GER_sell_desc: "Một số dự án kinh doanh của chúng ta ở Ba Lan không hữu ích như chúng ta hy vọng. May mắn thay, có rất nhiều doanh nhân Áo, Séc và Ba Lan sẵn sàng mua lại chúng từ chúng ta để đổi lấy tiền mặt."
 POL_GER_lobby: "Chiến dịch Ủng hộ Quân chủ tại Ba Lan"
 POL_GER_lobby_desc: "[POL.GetLeader] chưa bao giờ là vị vua nổi tiếng nhất, nhưng đó không phải là điều mà một chút công tác PR của Đức không thể khắc phục."

 POL_GER_promises: "Hứa Tự trị cho Ba Lan"
 POL_promise_tt: "§CLòng trung thành của Ba Lan sẽ tăng đáng kể.§!"
 POL_GER_agricultural_exports: "Chuyển hướng Nông sản"
 POL_promises1: "Đã hứa độc lập cho Ba Lan"

 POL_GER_recruit_poland: "Tăng Cường Tuyển mộ tại Ba Lan"
 POL_GER_recruit_poland_reduce: "Giảm Cường Tuyển mộ tại Ba Lan"
 POL_GER_recruitment: "Tuyển mộ Công nhân Ba Lan"

 POL_invest_tt: "Bằng cách tài trợ cho những người ủng hộ August IV, chúng ta sẽ đảm bảo lòng trung thành của Ba Lan."
 POL_exploit_tt: "Các chính sách bóc lột đối với Ba Lan sẽ củng cố tình cảm chống Đức và cách mạng ở Ba Lan."

 MIE_refuse_equipment_shipments: "Từ chối Các lô Hàng Thiết bị"
 MIE_refuse_equipment_shipments_desc: "Vì lý do của riêng mình, chúng ta phải nói với các đồng minh rằng hiện tại chúng ta không cần bất kỳ lô hàng thiết bị nào, và do đó nguồn lực nên được sử dụng ở nơi khác."
 MIE_allow_equipment_shipments: "Cho phép Các lô Hàng Thiết bị"
 MIE_allow_equipment_shipments_desc: "Mặc dù trước đó chúng ta đã nói với các đồng minh không gửi bất kỳ thiết bị nào, chúng ta có thể hủy bỏ quyết định này bất cứ lúc nào."

