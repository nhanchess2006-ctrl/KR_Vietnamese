 intermarium_events.9.t: "Hợp tác Đông Âu"
 intermarium_events.9.d: "[MIE_leader.GetNameDefCap] đã chọn đầu tư một phần quỹ hợp tác phòng thủ chung của chúng ta bằng cách thành lập một Bộ Chỉ huy Phòng không Đông Âu Chung chính thức. Điều này sẽ tích hợp các phi đội không quân của tất cả các quốc gia tham gia vào một cấu trúc bao trùm, cho phép hợp tác không quân và kiểm soát bầu trời tốt hơn."
