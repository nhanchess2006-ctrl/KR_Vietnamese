 intermarium_events.10.t: "Hợp tác Đông Âu"
 intermarium_events.10.d: "[MIE_leader.GetNameDefCap] đã chọn đầu tư một phần quỹ hợp tác phòng thủ chung của chúng ta bằng cách thiết lập các cải cách quan trọng cho Bộ Chỉ huy Phòng không Đông Âu Chung. Với việc tích hợp thành công các điều phối viên không quân đa ngôn ngữ và hợp tác chặt chẽ hơn nữa của lực lượng không quân, hiệu quả của không quân chúng ta chắc chắn sẽ tăng lên."
