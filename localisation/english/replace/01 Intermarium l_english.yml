 MIE_contributions: "Đóng góp Quốc phòng Đông Âu"
 MIE_contributions_desc: "Quốc gia này đang trả một phần ngân sách của mình vào ngân sách quốc phòng chung của Đông Âu để mua súng và thiết bị quân sự khác."
 MIE_defense_contributions_tt: "Mỗi quốc gia thành viên đóng góp sẽ thêm £rifle_texticon  §H20§! £support_texticon  §H10§! £unit_artillery_icon_small  §H10§! vào quỹ vũ khí hàng tháng."

 intermarium_events.4.t: "Hợp tác Đông Âu"
 intermarium_events.4.d: "[MIE_leader.GetNameDefCap] đã đề nghị làm sâu sắc thêm hợp tác giữa các quốc gia Đông Âu bằng cách thực hiện một hệ thống đóng góp quốc phòng. Nếu chúng ta tham gia hệ thống, chúng ta sẽ trả một phần ngân sách của mình vào ngân sách quốc phòng chung của Đông Âu, mà [MIE_leader.GetName] sẽ có thể sử dụng để mua thiết bị cho quỹ vũ khí."
 intermarium_events.4.a: "Chúng ta sẽ đăng ký."
 intermarium_events.4.b: "Chúng ta từ chối."
