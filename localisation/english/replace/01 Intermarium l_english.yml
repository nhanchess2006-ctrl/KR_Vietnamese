 intermarium_events.8.t: "Hợp tác Đông Âu"
 intermarium_events.8.d: "[MIE_leader.GetNameDefCap] đã chọn đầu tư một phần quỹ hợp tác phòng thủ chung của chúng ta bằng cách thiết lập cơ sở hạ tầng cho một bộ chỉ huy phòng không chung giữa các quốc gia Đông Âu. Điều này bao gồm việc xây dựng các căn cứ không quân mới và cung cấp máy bay tiêm kích cho tất cả các bên tham gia hệ thống."
