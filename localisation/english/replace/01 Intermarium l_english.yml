 intermarium_events.3.t: "Hợp tác Đông Âu"
 intermarium_events.3.d: "[MIE_leader.GetNameDefCap] đã chọn đầu tư một phần quỹ hợp tác phòng thủ chung của chúng ta bằng cách tổ chức các cuộc diễn tập chiến tranh giữa các bộ tham mưu quân đội của các quốc gia Đông Âu. Tại đây, các tướng lĩnh của chúng ta đã thảo luận về một cuộc xâm lược toàn diện vào khu vực, phân chia vai trò giữa các quốc gia, và tham gia vào việc hoạch định đại chiến lược để ngăn chặn cuộc tấn công."
 intermarium_events.3.a: "Tuyệt!"
