 ACW_federal_deadline_looms: "Hạn chót của Liên bang đang đến gần"
 ACW_federal_deadline_looms_desc: "Yêu cầu của Tổng thống rất rõ ràng: những kẻ nổi loạn phải hạ vũ khí và giải giáp trong vòng một tháng, nếu không lực lượng Liên bang sẽ buộc họ phải làm vậy - bất kể hậu quả. Nước Mỹ chờ đợi trong im lặng khi ngày tháng trôi qua mà không bên nào có vẻ sẵn sàng nhượng bộ. Rõ ràng những ngày của ngoại giao đã qua từ lâu..."

