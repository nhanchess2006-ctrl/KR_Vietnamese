american_civil_war_events.611.t: "Thiết bị từ [From.GetAdjective] đến"
american_civil_war_events.611.d: "Bạn bè của chúng ta ở [From.GetNameDef] đã gửi cho chúng ta một lô thiết bị bộ binh để hỗ trợ cuộc đấu tranh."
american_civil_war_events.611.a: "Rất cần thiết!"

american_civil_war_events.615.t: "Triệu tập lực lượng dự bị khẩn cấp"
american_civil_war_events.615.d: "Với việc [From.GetNameDef] tuyên chiến với [Root.GetNameDef], các cựu binh nội chiến đã nhanh chóng nhập ngũ vào lực lượng dự bị quốc gia - thôi thúc bởi cảm giác rằng chính phủ [From.GetAdjective] đang săn đuổi chúng ta vào lúc yếu nhất. Dù các quân đoàn mới được triển khai khắp đất nước, họ sẵn sàng và háo hức chiến đấu chống kẻ thù!"
american_civil_war_events.615.a: "Chúng ta sẽ bảo vệ đất nước!"
american_civil_war_events.615.b: "Điều này không cần thiết."

american_civil_war_events.616.t: "Giải ngũ lực lượng dự bị"
american_civil_war_events.616.d: "Dù lực lượng dự bị khẩn cấp được triệu tập cho chiến tranh, nay khi nó kết thúc, họ đã được giải ngũ và trở về nhà - kiệt sức sau quá nhiều trận chiến."
american_civil_war_events.616.a: "Đến lúc nghỉ ngơi, các cựu binh thân yêu"

### MacArthur's War ###
american_civil_war_events.700.t: "Kế hoạch chiến tranh của MacArthur"
american_civil_war_events.700.d: "Tướng MacArthur từ lâu đã chuẩn bị kế hoạch chống bất ổn dân sự. Kế hoạch Chiến tranh Trắng ban đầu từ đầu thập niên '20 khăng khăng tôn trọng các quy định của Hiến pháp về quyền các bang. Nó nói rằng chỉ thống đốc mới có thể yêu cầu quân liên bang trấn áp nổi loạn. Tình hình quốc gia hiện nay, thật không may, đòi hỏi hành động mạnh mẽ hơn. Với thời hạn ân xá 30 ngày của Tổng thống MacArthur mang lại ít kết quả, có vẻ Hoa Kỳ cần chuẩn bị cho chiến tranh.\n\nCó ba kế hoạch được đề xuất lên nội các và các tham mưu trưởng quân đội:\n\n1. Kế hoạch Chiến tranh Trắng: Yorktown đề nghị từ bỏ nhiều căn cứ quân sự ở Bờ Tây, dãy Rockies, Đồng bằng Lớn và Trung Tây. Với việc rút quân Liên bang về phía đông sông Mississippi, kế hoạch hy vọng việc tập trung quân Liên bang ở bờ biển phía đông sẽ có thể nghiền nát các cuộc nổi loạn ở Pennsylvania, Carolinas, New England và Georgia.\n\n2. Kế hoạch Chiến tranh Trắng: San Jacinto kêu gọi di dời chính phủ đến Đồng bằng Lớn, cùng phần lớn quân đội, để nghiền nát kháng cự ở các bang Bờ Tây. Nếu thực hiện đúng, điều này sẽ cho phép chúng ta chiếm lại Hạm đội Thái Bình Dương đang binh biến.\n\n3. Cuối cùng, Kế hoạch Chiến tranh Trắng ban đầu của MacArthur, soạn cuối năm ngoái, kêu gọi giữ một hành lang từ Virginia đến bất kỳ bang nào còn trung thành ở Trung Tây. Chúng ta hy vọng tổ chức và khả năng cơ động vượt trội có thể nhanh chóng nghiền nát các cuộc nổi loạn trước khi chúng liên kết hoặc bắt đầu sản xuất chiến tranh. Ta nên chọn gì?"
american_civil_war_events.700.a: "Từ bỏ Đồng bằng."
american_civil_war_events.700.b: "Washington quá dễ tổn thương, rút về Denver."
american_civil_war_events.700.c: "Chúng ta sẽ không nhượng thêm một tấc nào cho lũ phản bội!"

american_civil_war_events.701.t: "Sơ tán dãy Rocky Mountains"
american_civil_war_events.701.d: "Các bang Arizona, New Mexico, Idaho và Utah từ lâu được coi là vùng trung tâm thực sự của nước Mỹ, nơi kẻ xâm lược hiếm khi chạm tới. Vì vậy, có ít căn cứ hoặc bộ chỉ huy quân sự trong vùng, và ít kho hoặc căn cứ để sơ tán. Ở Nevada, thật không may, Kho quân đội Hawthorne đã từ chối lệnh chuyển vật tư về phía đông. Tuy nhiên, các bang New Mexico và Arizona thì khác. Ở đây, Pháo đài Yuma và Huachuca, được xây từ thế kỷ trước để bảo vệ chống các cuộc tập kích của người da đỏ và cướp Mexico, vẫn vững mạnh. May mắn thay, họ cũng vẫn trung thành, và binh lính ở đó đang chở hàng về phía bắc và đông nhanh nhất có thể. Công dân các bang này đang thận trọng tuân theo chỉ dẫn của thống đốc để ở nguyên tại chỗ cho đến khi có quyết định cấp vùng."
american_civil_war_events.701.a: "Có lẽ người Navajo sẽ lại xuất hiện, giờ khi quân Liên bang đã đi."

american_civil_war_events.702.t: "Sơ tán Đồng bằng Lớn phía Bắc"
american_civil_war_events.702.d: "Giống như phần còn lại của miền Tây cũ, các căn cứ quân sự duy nhất ở phía bắc Đồng bằng Lớn được thành lập trong các cuộc Chiến tranh Da đỏ cuối cùng để bình định vùng này. Pháo đài Russel ở Wyoming, Pháo đài Missoula ở Montana và Trại Grafton ở Bắc Dakota nay là những căn cứ được trang bị khá kém, chưa từng đánh trận hay chạm trán nào từ thập niên 1880. Việc thiếu hoạt động dân sự thù địch khiến cuộc sơ tán tương đối suôn sẻ, và quân đội đã rút về phía nam đến Colorado và Missouri."
american_civil_war_events.702.a: "Để người Canada canh biên giới, chúng ta đi về phía đông."

american_civil_war_events.703.t: "Rút khỏi Denver"
american_civil_war_events.703.d: "Đồng bằng trung tâm, đặc biệt là Denver, đã trở thành điểm tập hợp cho quân đội và dân quân ở Đồng bằng và miền Tây, cùng nhau tổ chức, huấn luyện và chiến đấu chống nổi loạn. Vì Tổng thống đã quyết định từ bỏ Đồng bằng cho đến khi có thể chiếm Chicago và Baton Rouge, những quân này đã được gửi khỏi Denver về phía đông đến Missouri, để gặp dân quân trung thành đang tập trung ở St. Louis. Thống đốc Colorado đã cầu xin quân ta ở lại bảo vệ bang khỏi quân nổi loạn cấp tiến, nhưng họ đã có lệnh. Miền Tây đã bị bỏ mặc cho chết."
american_civil_war_events.703.a: "Thổi kèn rút lui."

american_civil_war_events.704.t: "Vượt sông Mississippi"
american_civil_war_events.704.d: "Khi quân ta đến Missouri, rắc rối cuối cùng bắt đầu ập đến với binh lính. Thống đốc Stark của Missouri, một chính trị gia thuộc bộ máy Pendergast, là người ngưỡng mộ Thống đốc Long và là đồng minh của ông. Ông từ chối cho quân ta vượt Mississippi mà không kiểm tra giấy tờ từng đơn vị qua Washington bằng điện tín. Quân ta có vẻ đã hơi chán ngấy điều này, và xông qua cầu ở Cairo vào Kentucky. Thật không may, cầu chỉ chịu được bấy nhiêu người, và cầu sớm sụp, khiến hàng ngàn người bị mắc kẹt ở bờ bên kia. Phà sớm được tổ chức để đưa họ qua, nhưng những phát súng đầu tiên chống quân đội đã xuất hiện khi những người cuối cùng của ta rời St. Louis, dân quân của Long bắn vào quân ta đang rút."
american_civil_war_events.704.a: "Chạy đi, chạy vì mạng sống!"

american_civil_war_events.705.t: "Các thống đốc miền Tây đào ngũ sang ACC"
american_civil_war_events.705.d: "Khi quân Liên bang rút khỏi vùng dãy Rocky Mountains, ban đầu có phản ứng chia rẽ. Thống đốc Nevada, Richard Kirman Sr., từ chối cho quân Liên bang sơ tán hoặc bỏ thiết bị, nhưng thống đốc Arizona, Idaho và Utah sẵn lòng hỗ trợ Tổng thống hơn. Tuy nhiên, một hội nghị cấp vùng gần đây của bốn thống đốc ở Salt Lake City đã dẫn đến quyết định cùng dựa vào chính phủ lâm thời ở California để được bảo vệ và hỗ trợ. Có vẻ hầu hết trong số họ bị dẫn đến điều này bởi việc bị chính phủ Washington bỏ rơi rõ ràng. Họ đã lên án việc MacArthur tiếp quản về hình thức và chính phủ Sacramento đã cử binh lính và phi công của mình đến chiếm các căn cứ bị bỏ hoang ở miền Tây."
american_civil_war_events.705.a: "Nước Mỹ chân chính ngày càng mạnh!"
american_civil_war_events.705.b: "Kẻ phản bội thực dụng vẫn là kẻ phản bội."

american_civil_war_events.706.t: "New Mexico rơi vào tay chính phủ Huey Long"
american_civil_war_events.706.d: "Khi binh lính và lính thủy đánh bộ Liên bang rời Arizona và New Mexico, họ mang theo hầu hết dân quân và Vệ binh Quốc gia, hứa sẽ đưa họ về nhà qua Baton Rouge trước cuối năm. Thật không may cho chính phủ MacArthur, việc tước hết lực lượng phòng thủ của New Mexico khiến nó dễ bị chiếm từ các vùng lân cận. Tiến lên sông Pecos và phóng theo các con đường đến Albuquerque và Santa Fe, Minutemen và Vệ binh Quốc gia trung thành với Huey Long đã chiếm phần lớn New Mexico trước khi cảnh sát biết chuyện gì đang xảy ra. Chẳng bao lâu, thống đốc cấp tiến Tingley đầu hàng bang qua radio trước khi chạy về phía tây sang ACC, mang theo phần lớn bộ máy hành chính của bang."
american_civil_war_events.706.a: "Cảm ơn, người Texas!"
american_civil_war_events.706.b: "Quốc gia càng lún sâu vào hỗn loạn."

american_civil_war_events.707.t: "Lực lượng Xã hội chủ nghĩa chiếm Minnesota"
american_civil_war_events.707.d: "Khi quân Liên bang rời Minnesota, người bạn cũ của Floyd Olson là Thống đốc Peterson nhận ra bang của mình sẽ bị xé nát trừ khi ông đầu hàng chế độ Chicago của John Reed. Dù có một số phản đối, việc bang đã bỏ phiếu cho Nông dân-Lao động trong bầu cử '36 giúp thuyết phục người dân Minnesota theo thống đốc vào vòng tay phe xã hội chủ nghĩa."
american_civil_war_events.707.a: "Điều đó không thể tránh khỏi."
american_civil_war_events.707.b: "Chết tiệt bọn chúng!"

american_civil_war_events.708.t: "Iowa đầu hàng"
american_civil_war_events.708.d: "Công nhân đình công ở Des Moines và Cedar Rapids hôm nay được dân quân mới đến của WCA do Reed nay công khai tuyên bố tham gia. Cảnh sát cố bảo vệ Điện Capitol Bang Iowa bị đám đông thảm sát khi trụ sở cơ quan lập pháp bị công nhân xâm chiếm. Thống đốc Kraschel, có lẽ thấy được xu hướng thủy triều, đã quyết định đầu hàng bang cho chính phủ Chicago như một bang mới của WCA."
american_civil_war_events.708.a: "Đôi khi cách mạng phải được mang đến bằng vũ lực."
american_civil_war_events.708.b: "Kinh khủng!"

american_civil_war_events.709.t: "Chiếm đóng dãy Rocky Mountains phía Bắc"
american_civil_war_events.709.d: "Binh lính và dân quân của Chính phủ Lâm thời Miền Tây cuối cùng đã vượt dãy Rocky Mountains qua một số kháng cự nhỏ, và hôm nay cả Cheyenne và Helena đều rơi vào tay chính phủ Sacramento. Quan điểm về việc chiếm đóng ở Wyoming và Montana rất chia rẽ, và nhiều người từ các thành phố đã chạy đến bạn bè hoặc người thân ở vùng nông thôn. Tuy vậy, có đủ tân binh từ vùng Rockies phía bắc để bổ sung cho các sư đoàn California, nay đang phóng về Dakota để cố chiếm Bismarck trước WCA."
american_civil_war_events.709.a: "Chúng ta sẽ sớm ở Bismarck!"
american_civil_war_events.709.b: "Để họ có những tảng đá, nếu họ muốn."

american_civil_war_events.710.t.WCA: "Chiếm Bắc và Nam Dakota"
american_civil_war_events.710.t.ACC: "Trận Bismarck"
american_civil_war_events.710.d.WCA: "Dù dân quân miền Tây hy vọng tiếp tục cuộc đua về Trung Tây và Ngũ Đại Hồ, có vẻ dân quân và binh lính của [WCA.GetNameDef] cuối cùng đã tự tổ chức đủ để bao vây có phương pháp cả Pierre và Bismarck và buộc cả hai thành phố đầu hàng. Lực lượng California đã bị đẩy lui khỏi Quốc lộ 5 trên biên giới Nam Dakota và Wyoming, và có vẻ cuộc đua chiếm miền Tây đã kết thúc. Nay sẽ có những cuộc đấu tranh khó khăn hơn giữa phe xã hội chủ nghĩa và chính phủ lâm thời."
american_civil_war_events.710.d.ACC: "Dù Tướng Butler nay đã nắm đủ quyền kiểm soát trong [WCA.GetNameDef] để tổ chức một chiến dịch thực sự vào Bắc và Nam Dakota, quân miền Tây đã đến Bismarck đủ nhanh để ngăn bao vây hoàn toàn. Thống đốc độc lập Bắc Dakota William Langer, trước đây liên kết với Thống đốc Long, đã hỗ trợ quân miền Tây trong cuộc chiến đẩy lính xã hội chủ nghĩa khỏi bang. Liên minh này đủ mạnh để tạm thời chặn cuộc tấn công phía tây của Tướng Butler."
american_civil_war_events.710.a: "Làm tốt lắm, các chàng trai!"
american_civil_war_events.710.b: "Chúng ta sẽ sớm trở lại!"
american_civil_war_events.710.c: "Một trận chiến đáng để đánh."
american_civil_war_events.710.d: "Chúng ta sẽ trở lại!"
american_civil_war_events.710.e: "Tin đáng lo ngại."

american_civil_war_events.711.t.ACC: "Nghị quyết Denver vì Dân chủ"
american_civil_war_events.711.t.APG: "Hội nghị Denver quyết định theo Long"
american_civil_war_events.711.d.ACC: "Sau khi quân Liên bang rút khỏi vùng Đồng bằng hạ, Thống đốc Đảng Cộng hòa Carr của Colorado đã triệu tập cuộc họp các thống đốc Kansas, Colorado và Nebraska tại Denver. Dù thống đốc Colorado và Nebraska là những nhân vật thuộc cơ sở, Thống đốc Ketchum của Kansas là một Dân chủ thân Long. Điều này cho phép linh hoạt hơn trong việc chọn phe trong cuộc xung đột quốc gia đang nhanh chóng chìm vào chiến tranh. Cuối cùng, sau vài ngày căng thẳng, các thống đốc quyết định rằng phe duy nhất thực sự quan tâm bảo vệ Hiến pháp là chính phủ lâm thời ở Sacramento, và ba bang của họ đã mời quân nổi dậy vào giữ hòa bình."
american_civil_war_events.711.d.APG: "Sau khi quân Liên bang rút khỏi vùng Đồng bằng hạ, Thống đốc Đảng Cộng hòa Carr của Colorado đã triệu tập cuộc họp các thống đốc Kansas, Colorado và Nebraska tại Denver. Dù thống đốc Colorado và Nebraska là những nhân vật thuộc cơ sở, Thống đốc Ketchum của Kansas là một Dân chủ thân Long. Điều này cho phép linh hoạt hơn trong việc chọn phe trong cuộc xung đột quốc gia đang nhanh chóng chìm vào chiến tranh. Cuối cùng, sau vài ngày căng thẳng, các thống đốc quyết định rằng phe duy nhất thực sự quan tâm giúp đỡ nhân dân Mỹ là chính phủ Huey Long ở Louisiana, và ba bang của họ đã mời Minutemen, cùng đội quân đang phát triển trung thành với Tổng thống Long, vào giữ hòa bình trong các bang."
american_civil_war_events.711.a: "Những người yêu nước Mỹ chân chính, tất cả các bạn!"
american_civil_war_events.711.b: "Họ đã chọn... tồi tệ."
american_civil_war_events.711.c: "Tiến về Đại Tây Dương!"
american_civil_war_events.711.d: "Dù sao chúng ta cũng cần ổn định mặt trận."
american_civil_war_events.711.e: "Một quyết định tồi."

american_civil_war_events.712.t: "Trận cầu Eads"
american_civil_war_events.712.d.WCA: "Dù quân Liên bang đã rời Missouri vài ngày trước, Thống đốc Stark vẫn chưa tuyên bố theo chính phủ đối địch nào. Trong nỗ lực giành vị thế thuận lợi nhất ở Trung Tây, Tướng Butler đã cử dân quân chiếm St. Louis qua sông Missouri từ Illinois. Họ gặp Vệ binh Quốc gia của Thống đốc Stark tại cầu Eads trên biên giới, và giao tranh nổ ra, khi dân quân hai bên cố vượt sông quanh các cây cầu mà không thành công. Cuối cùng, dân quân xã hội chủ nghĩa xoay xở phá vỡ phòng thủ quanh các cây cầu và tràn vào St. Louis và tấn công, nơi một 'chính phủ nhân dân' được thành lập. Thống đốc Stark đã chạy về phía nam đến Baton Rouge, nhưng Missouri nằm trong tay SPA."
american_civil_war_events.712.d.APG: "Dù quân Liên bang đã rời Missouri vài ngày trước, Thống đốc Stark vẫn chưa tuyên bố theo chính phủ đối địch nào. Trong nỗ lực giành vị thế thuận lợi nhất ở Trung Tây, Tướng Butler đã cử dân quân chiếm St. Louis qua sông Missouri từ Illinois. Họ gặp Vệ binh Quốc gia của Thống đốc Stark tại cầu Eads trên biên giới, và giao tranh nổ ra, khi dân quân hai bên cố vượt sông quanh các cây cầu mà không thành công. Cuối cùng, một nhóm Minutemen Illinois phản loạn từ phía bắc đến và bắt đầu tấn công lực lượng WCA từ phía sau, cho phép Vệ binh Quốc gia của Thống đốc Stark tiến lên và buộc dân quân WCA đầu hàng. Thống đốc Stark nay đã tuyên bố Huey Long là Tổng thống hợp hiến, và quân Liên minh đã vào bang để canh biên giới."
american_civil_war_events.712.a: "Cách mạng ngày càng mạnh!"
american_civil_war_events.712.b: "Chết tiệt bọn phản bội!"
american_civil_war_events.712.c: "Con sông đã chặn chúng."
american_civil_war_events.712.d: "Cướp, tội phạm, phản bội!"
american_civil_war_events.712.e: "Chết tiệt bọn chúng!"

american_civil_war_events.713.t: "Viện binh đến miền Đông"
american_civil_war_events.713.d: "Dù miền Tây có thể đã bị quân nổi loạn chiếm nhanh hơn MacArthur tưởng, miền Đông nay có thể bảo đảm hơn, với hàng chục ngàn quân Liên bang đã đến Virginia, cùng nhiều tình nguyện viên từ miền Tây đổ về nhập ngũ ở miền Đông. Quân ta ngày càng mạnh."
american_civil_war_events.713.a: "Những người yêu nước, hãy cầm vũ khí!"

american_civil_war_events.714.t.USA: "Thắng lợi của Liên bang ở Tennessee"
american_civil_war_events.714.t.APG: "Thắng lợi của Long ở Tennessee"
american_civil_war_events.714.d.USA: "Hôm nay, lúc 8 giờ 45 phút sáng, dân quân Long tấn công phòng thủ Liên bang ở Nashville, nhưng họ không địch nổi một đội quân chuyên nghiệp, có tổ chức. Quân Liên bang dễ dàng đẩy lui họ, và bắt đầu truy lùng du kích địa phương trong bang. Với thắng lợi này, quyền kiểm soát Tennessee của MacArthur hiện không bị thách thức."
american_civil_war_events.714.d.APG: "Hôm nay, lúc 8 giờ 45 phút sáng, dân quân Long tấn công phòng thủ Liên bang ở Nashville khi họ vẫn đang tổ chức lại sau cuộc rút về phía đông. Vệ binh Quốc gia mất tổ chức và số ít đơn vị quân đội có mặt nhanh chóng bị bao vây và buộc đầu hàng, và chẳng bao lâu thành phố Nashville đã đầu hàng lực lượng của Tổng thống Long. Khắp bang, Minutemen địa phương và những người đồng tình Long đã bảo đảm vùng nông thôn và hầu hết thị trấn, và hầu hết đồng ý quyền kiểm soát Tennessee của Huey Long không bị thách thức."
american_civil_war_events.714.a: "Dễ hơn mong đợi."
american_civil_war_events.714.b: "Sao lại xảy ra vậy?"
american_civil_war_events.714.c: "Điều đó cho thấy sự bất tài của lũ liên bang tham nhũng."
american_civil_war_events.714.d: "Không quan trọng, chúng ta sẽ chiếm nó, sớm hay muộn."
american_civil_war_events.714.e: "Không phải việc của chúng ta."

american_civil_war_events.715.t.WCA: "Liên bang bị đánh tan ở Kentucky"
american_civil_war_events.715.t.APG: "Liên bang bị đánh tan ở Kentucky"
american_civil_war_events.715.d.WCA: "Sau khi mất Tennessee, Kentucky trở nên không thể phòng thủ với quân Liên bang. Vì vậy, Tướng MacArthur quyết định rút về phía đông và từ bỏ bang, hy vọng chiếm lại càng sớm càng tốt. Hiện tại, Quốc hội chỉ có thể nhìn dân quân Long và Công đoàn phủ máu các đường phố Louisville và Frankfort, một cuộc tắm máu sớm chuyển sang phe Công đoàn. Dân quân của họ xoay xở bao vây Frankfort sau khi Louisville thất thủ, và sớm chiếm phần còn lại của bang."
american_civil_war_events.715.d.APG: "Sau khi mất Tennessee, Kentucky trở nên không thể phòng thủ với quân Liên bang. Vì vậy, Tướng MacArthur quyết định rút về phía đông và từ bỏ bang, hy vọng chiếm lại càng sớm càng tốt. Tuy nhiên, hiện tại có vẻ lực lượng của Long đã đẩy dân quân và binh lính Công đoàn khỏi Kentucky, sau một trận đánh ngắn ở Louisville kết thúc với việc phá hủy các cây cầu qua sông Ohio và đánh tan dân quân của Reed."
american_civil_war_events.715.a: "Chúng ta đã đuổi gã từ Louisiana khỏi Louisville!"
american_civil_war_events.715.b: "Chúng ta sẽ sớm trở lại bên kia sông."
american_civil_war_events.715.c: "Một thắng lợi lớn!"
american_civil_war_events.715.d: "Sao chúng ta có thể làm hỏng chuyện đó?"
american_civil_war_events.715.e: "Tất cả những gì có thể làm lúc này là chờ..."
american_civil_war_events.715.f: "Đáng lo ngại."

american_civil_war_events.716.t.USA: "Lực lượng Long bị đẩy lui khỏi Bắc Carolina"
american_civil_war_events.716.d.USA: "Với hầu hết lực lượng Long tiến ở miền Tây, giữ Bắc Carolina không khó chút nào. Quân Liên bang dễ dàng đẩy lui số ít dân quân Long tấn công Charlotte, và có thể giả định rằng có lẽ cũng có ít phòng thủ của Long ở Nam Carolina."
american_civil_war_events.716.t.APG: "Bắc Carolina rơi vào tay chính phủ Baton Rouge"
american_civil_war_events.716.d.APG: "Dù nhiều nguồn lực của Long đã bị chuyển về miền Tây, chính phủ Baton Rouge rõ ràng vẫn có đủ dân quân để bao vây thành phố Charlotte ở Bắc Carolina, và sau giao tranh đường phố ngắn, chiếm nó. Khắp bang, dân quân Bắc Carolina tuân lệnh thống đốc bù nhìn mới của họ đầu hàng lực lượng Huey Long."
american_civil_war_events.716.a: "Không bất ngờ."
american_civil_war_events.716.b: "Chết tiệt!"
american_civil_war_events.716.c: "Sẵn sàng ở biên giới Virginia!"
american_civil_war_events.716.d: "Chúng ta đã sập bẫy!"
american_civil_war_events.716.e: "Phe Long đã bị đẩy lui."
american_civil_war_events.716.f: "Chính phủ Liên bang có vẻ chao đảo."

american_civil_war_events.717.t.USA: "Chiếm Charleston"
american_civil_war_events.717.t.APG: "Xâm nhập của Liên bang bị đánh bại ở Nam Carolina"
american_civil_war_events.717.d.USA: "Đúng khi cho rằng quân Long vẫn mất tổ chức và không thể đẩy lui một cuộc tấn công quyết tâm, quân USMC điều từ Arizona đã thực hiện thành công cuộc đổ bộ hải quân vào Charleston với sự hợp tác của dân quân địa phương. Vệ binh Quốc gia của Tổng thống Long trong thành phố bị bối rối bởi các báo cáo trái chiều và sớm bị áp đảo, cuối cùng đầu hàng sau một trận đánh ngắn. Động thái của Tổng thống MacArthur được hoan nghênh ở Washington như một hành động thiên tài quân sự, trong khi các báo cáo từ Sacramento và Baton Rouge tuyên bố đây là một cuộc tấn công công khai vào nhân dân Hoa Kỳ."
american_civil_war_events.717.d.APG: "Sai khi cho rằng quân Long vẫn quá mất tổ chức để phòng thủ Charleston, Tướng MacArthur phát động cuộc tấn công phối hợp hải quân và du kích vào Charleston. Thật không may, tàu đổ bộ USMC bị thổi lệch hướng trong thuyền tạm bợ trước khi bị tuần dương hạm Long bắn phá trong cảng Charleston, trong khi du kích quanh thành phố bị trấn áp và buộc phải ẩn náu mà không có tiếp tế mới. Nam Carolina nay càng nằm chắc trong tay chính phủ Huey Long."
american_civil_war_events.717.a: "Tướng MacArthur đã làm được!"
american_civil_war_events.717.b: "Dù sao đó cũng là một canh bạc."
american_civil_war_events.717.c: "Một thắng lợi tự nhiên."
american_civil_war_events.717.d: "Chúng ta sẽ trở lại!"
american_civil_war_events.717.e: "Chiến đấu có hại cho mọi người."

american_civil_war_events.718.t: "Vây hãm thành phố New York"
american_civil_war_events.718.d: "Có vẻ các phần tử kích động nước ngoài đã hoạt động ở Mỹ, khi các gián điệp và kẻ khiêu khích Pháp và Anh đã xúi giục các khu nghèo của thành phố New York nổi dậy. Nhiều doanh nhân không thoát được đã bị treo cổ, nhưng bạo lực đám đông đã dịu đi nhờ sự xuất hiện của các nhà tổ chức được huấn luyện, cả dân sự và quân sự, từ Anh và Pháp. Vệ binh Quốc gia đã bao vây thành phố trong một vòng vây lỏng lẻo từ Newark đến Yonkers, ngăn dân quân xã hội chủ nghĩa vào hoặc ra khỏi thành phố, nhưng chưa thử tấn công Manhattan."
american_civil_war_events.718.a: "Giữ cảng mở!"
american_civil_war_events.718.b: "Chúng ta có thể chờ."
american_civil_war_events.718.c: "Một số phận buồn cho một thành phố vĩ đại."

american_civil_war_events.719.t.USA: "Cuộc đình công ở Philadelphia"
american_civil_war_events.719.t.WCA: "Trận Philadelphia"
american_civil_war_events.719.d.USA: "Tướng MacArthur biết, như Lee và Howe trước ông, rằng Philadelphia là chìa khóa của vùng Trung Đại Tây Dương. Các đơn vị của Sư đoàn Bộ binh 3 đã vào Pennsylvania đầu tuần này qua West Chester, và phối hợp với các trung đoàn khác tập hợp ở Camden và Vệ binh Quốc gia tập hợp ở Havertown bắt đầu tấn công trung tâm Philadelphia, thành công vượt cả sông Schuylkill và Delaware trong nỗ lực chiếm Tòa án Liên bang và Xưởng vũ khí Frankford trước khi kháng cự đường phố địa phương có thể tập hợp để chặn họ. Chiến dịch thành công rực rỡ, nhưng một cuộc phản công xã hội chủ nghĩa sớm được cảm nhận khi quân Liên bang chiếm được thành phố và tiến dọc xa lộ Ship-to-Shore về phía tây bắc. Một trận đánh ác liệt bắt đầu giữa lực lượng của Tướng Butler, đóng ở Allentown, và Tướng Bowley ở Philadelphia gần Lansdale. Các nỗ lực sơ tán dân thường đã được thực hiện, nhưng chẳng bao lâu hàng ngàn người chết sau khi pháo kích bắt đầu, và rõ ràng việc tái chiếm Pennsylvania sẽ không dễ dàng.\n\nKhắp quốc gia rạn nứt và tan vỡ, các phe phái nhỏ đã thấy cơ hội bắt đầu các chiến dịch tấn công chống mọi chính phủ đối địch, và từ Minnesota đến Bắc Carolina, từ thành phố New York đến New Mexico, giao tranh và bất ổn dân sự cuối cùng đã leo thang thành các trận chiến. Mọi người đều rõ Nội chiến Mỹ lần thứ hai đã bắt đầu."
american_civil_war_events.719.d.WCA: "Tướng MacArthur biết, như Lee và Howe trước ông, rằng Philadelphia là chìa khóa của vùng Trung Đại Tây Dương. Các đơn vị của Sư đoàn Bộ binh 3 đã vào Pennsylvania đầu tuần này qua West Chester, và phối hợp với các trung đoàn khác tập hợp ở Camden và Vệ binh Quốc gia tập hợp ở Havertown bắt đầu tấn công trung tâm Philadelphia. Thành viên công đoàn chuẩn bị các đại lộ đông-tây chính, với các tuyến lui tới tận Broad Street, cắt các cây cầu qua Delaware và Schuylkill, và gọi điện cho lực lượng của Tướng Butler ở Allentown để phối hợp phản công. Dù cuộc tấn công ban đầu của Liên bang tiến dọc Main Line với ít trở ngại, các nỗ lực vượt sông của Liên bang gần cầu Market Street bị gián đoạn mạnh bởi hoạt động địa phương của phe Công đoàn, và chẳng bao lâu pháo tầm xa của Tướng Butler, được sơ tán khỏi Xưởng vũ khí Frankford tuần trước, đã gây hỗn loạn trong tuyến tiếp tế Liên bang. Tổng thống MacArthur bực tức đã xóa bỏ mọi hạn chế với quân mình trong vùng, và giao tranh ngày càng lộn xộn. Tuy vậy, quân Liên bang phần lớn bị đẩy lui qua biên giới về Maryland.\n\nKhắp quốc gia rạn nứt và tan vỡ, các phe phái nhỏ đã thấy cơ hội bắt đầu các chiến dịch tấn công chống mọi chính phủ đối địch, và từ Minnesota đến Bắc Carolina, từ thành phố New York đến New Mexico, giao tranh và bất ổn dân sự cuối cùng đã leo thang thành các trận chiến. Mọi người đều rõ Nội chiến Mỹ lần thứ hai đã bắt đầu."
#USA wins:
american_civil_war_events.719.a: "Bây giờ hoặc không bao giờ! Ra trận, vì nước Mỹ!"
#USA loses:
american_civil_war_events.719.b: "Chúng ta sẽ trở lại! Không còn hạn chế, chúng ta đang chiến tranh!"
#WCA wins:
american_civil_war_events.719.c: "Phát huy lợi thế! Ra trận!"
#WCA loses:
american_civil_war_events.719.d: "Chúng ta cần đến New York, và sớm! Ra trận!"
american_civil_war_events.719.e: "Đây là thời điểm để tấn công! Cầm vũ khí!"

american_civil_war_events.720.t: "Tướng MacArthur động binh chống New England"
american_civil_war_events.720.d: "Dù Hoàng gia Anh trước đây từ chối can thiệp vào Mỹ, các thống đốc Maine, Vermont, New Hampshire, Massachusetts, Rhode Island, New York và Connecticut đã gia hạn yêu cầu bảo vệ sau tối hậu thư của Tổng thống MacArthur với các thống đốc New England, yêu cầu cho quân Liên bang vào bang của họ để chiến đấu với phiến quân công đoàn ở phía bắc. Dù hỗ trợ chính phủ Liên bang là kế hoạch ban đầu của chúng ta, có thể chính phủ MacArthur không ổn định như chúng ta tưởng. Ta có nên đưa ra tối hậu thư đối kháng?"
american_civil_war_events.720.a: "MacArthur có thể làm như ông ta muốn."
american_civil_war_events.720.b: "Chúng ta phải bảo vệ New England!"

american_civil_war_events.721.t: "Canada chiếm New England"
american_civil_war_events.721.d: "Tin đáng lo từ mặt trận phía bắc! Canada chiếm và chiếm đóng New England khi quân Liên bang vẫn đang tổ chức lại sau cuộc rút về phía đông. Đây không phải động thái đáng ngạc nhiên vì các thống đốc New England đã yêu cầu Canada làm vậy, nhưng không có New England, vị thế Liên bang bị suy yếu nghiêm trọng."
american_civil_war_events.721.a: "Hiện tại chúng ta cần tập trung vào bọn phản bội."
american_civil_war_events.721.b: "Khi chiến tranh kết thúc, chúng ta sẽ lấy lại!"

american_civil_war_events.722.t: "Thảm bại Newark"
american_civil_war_events.722.d: "Sau khi mất New England, quân Liên bang cũng bị đẩy lui khỏi New Jersey. Phiến quân công đoàn từ New York phá vây và tràn qua lực lượng của Tướng MacArthur ở Newark, và nhận viện binh của Tướng Smedley Butler từ Pennsylvania, người sau đó tiến chiếm nửa phía đông bang đó. Tuy nhiên, Tướng MacArthur cũng đã gửi viện binh đến New Jersey, và khi họ cố vượt Delaware, họ gặp kháng cự xã hội chủ nghĩa mạnh ở Camden. Nhanh chóng chiếm vị trí dưới quyền Trung úy Daniel Daly, hai bên bắt đầu cuộc đấu súng quy mô lớn, và khi thêm viện binh vào vùng, một xung đột biên giới nhỏ cuối cùng đã nở thành trận chiến toàn diện.\n\nKhắp quốc gia rạn nứt, các phe phái nhỏ đã thấy cơ hội bắt đầu các chiến dịch tấn công chống mọi chính phủ đối địch, và từ Minnesota đến Bắc Carolina, từ thành phố New York đến New Mexico, giao tranh và bất ổn dân sự đã leo thang thành các trận chiến toàn diện. Mọi người đều rõ Nội chiến Mỹ lần thứ hai đã bắt đầu."
american_civil_war_events.722.a: "Chúng ta không thể mất lợi thế! Ra trận!"
american_civil_war_events.722.b: "'Tiến lên, lũ khốn, các người muốn sống mãi sao?!'"
american_civil_war_events.722.c: "Đây là thời điểm để tấn công! Cầm vũ khí!"

american_civil_war_events.723.t: "New England quy phục MacArthur"
american_civil_war_events.723.d: "Chúng ta nhận tin các thống đốc New England đã yêu cầu Canada bảo vệ, nhưng chính phủ Ottawa từ chối. Không có bảo vệ Canada, các thống đốc đã yêu cầu Tướng MacArthur bảo vệ khỏi lực lượng công đoàn. Dù các bang có thể không hoàn toàn ủng hộ MacArthur, ít nhất họ quyết tâm coi ông là cơ hội tốt nhất để tránh chiến tranh."
american_civil_war_events.723.a: "Với New England đã bảo đảm, nay chúng ta có thể tập trung vây hãm New York."
american_civil_war_events.723.b: "Điều này không tốt..."
american_civil_war_events.723.c: "Chết tiệt."

american_civil_war_events.724.t: "Du kích WCA ở Buffalo"
american_civil_war_events.724.d.macarthur: "Dù quân của Tổng thống MacArthur đã buộc Thống đốc Lehman của New York ở Albany phải phục tùng và trung thành, có vẻ nhiều phần của bang hơn cả thành phố New York đã tuột khỏi tay ông. Những công nhân đình công còn lại từ các cuộc bất ổn gần đây ở Rochester và Buffalo đã được du kích của chính phủ Reed ở Chicago tham gia, những người đã hợp nhất để lật đổ chính quyền thành phố và mời binh lính WCA bảo vệ bang. Nhận thấy cơ hội đến gần thành phố New York, Tướng Butler đã lệnh tiến lên nguồn sông Susquehanna và thác Niagara."
american_civil_war_events.724.d.canada: "Dù chính phủ Anh-Canada đã chấp nhận yêu cầu của thống đốc New York để bảo đảm trung lập cho bang, ở phía tây bang, quân Anh-Canada đến quá chậm để ngăn binh lính WCA của Tướng Butler tiến vào các thành phố Buffalo và Rochester, gặp du kích thân xã hội chủ nghĩa ở đó, và tiến đến một tuyến phòng thủ từ cửa sông Susquehanna đến thác Niagara. WCA đã lập chính quyền bang riêng ở Buffalo, và có vẻ bang sẽ bị chia cắt cho đến khi WCA hoặc Canada chiếm phần còn lại trong chiến tranh."
american_civil_war_events.724.a: "Tuyệt!"
american_civil_war_events.724.b: "Ít nhất chúng ta vẫn bao vây thành phố New York."
american_civil_war_events.724.c: "Kinh khủng."

american_civil_war_events.725.t: "Nổi dậy của Long bị trấn áp ở New Jersey"
american_civil_war_events.725.d: "Ngay cả khi Charles Lindbergh chạy sang Baton Rouge, một nỗ lực của Long nhằm chiếm Newark và bờ biển phía bắc Jersey làm căn cứ cầm cự cho đến khi viện binh từ phía nam đến vẫn đủ mạnh để chuyển hướng quân Liên bang khỏi vây hãm New York. Tuy vậy, nó đã bị dập tắt, và dù kháng cự dữ dội trên đường phố Newark, quân của MacArthur đã tái lập kiểm soát. Những quân này nay đã trở về Yonkers và Philadelphia, và các cuộc tấn công có tổ chức vào các bang nổi loạn đang được lên kế hoạch."
american_civil_war_events.725.a: "Chúng ta đã làm điều phải làm."
american_civil_war_events.725.b: "Chúng ta sẽ sớm trả thù cho họ!"
american_civil_war_events.725.c: "Chúng ta sẽ tự nghiền nát bạo chúa!"

american_civil_war_events.750.t: "Quốc hội dời đến Denver"
american_civil_war_events.750.d: "Việc sơ tán bờ biển phía đông bắt đầu hôm qua khi Tướng MacArthur, nội các, Chủ tịch Hạ viện tạm quyền và nhiều nghị sĩ lên máy bay đến Denver, thủ đô tạm thời của Hoa Kỳ. Nhiều thành viên chính phủ cấp dưới, bị bỏ lại hiện tại, không rõ phản ứng thế nào với tình hình, một số đốt tài liệu mật từ các bộ và cả Thư viện Quốc hội, nơi Hiến pháp gốc được đưa đến Denver. Người biểu tình trên đường vẫn bị cảnh sát địa phương trấn áp, nhưng hầu hết Vệ binh Quốc gia và Lục quân đã lên tàu hướng về phía tây. Sáng nay Tướng MacArthur phát biểu trước Quốc hội còn lại trong phiên họp chung bí mật, phác thảo kế hoạch trấn áp bất ổn dân sự ở miền Tây trước khi đánh bại Reed và Long ở miền Đông."
american_civil_war_events.750.a: "Ta sẽ trở lại!"

american_civil_war_events.751.t: "Con đường dài về phía Tây"
american_civil_war_events.751.d: "Tướng MacArthur đã quyết định từ bỏ chỗ ngồi quyền lực cũ ở bờ biển phía đông, nghĩa là chuyển mọi thứ đến Denver - toàn bộ lực lượng vũ trang, toàn bộ đạn dược, mọi thứ có thể di chuyển bằng đường bộ. Chúng ta chỉ có thể hy vọng mọi thứ sẽ diễn ra theo kế hoạch bí mật của Tướng MacArthur, và bọn phản bội ở phía bắc và nam sẽ không tấn công quân ta trong cuộc rút về phía tây."
american_civil_war_events.751.a: "Không thể quay đầu lại nữa."

american_civil_war_events.752.t: "Giao tranh Vệ binh Quốc gia gia tăng"
american_civil_war_events.752.d.USA: "Sự thống nhất của nước Mỹ đang nhanh chóng tan vỡ khi Tổng thống MacArthur tái củng cố ở miền Tây. Bạo loạn ở vùng Trung Đại Tây Dương và Appalachian đang lan không kiểm soát, và miền Đông có thể rơi vào tay phiến quân trước khi chúng ta trấn áp bất đồng ở miền Tây. Trong khi đó, bất ổn ở Bờ Đông che giấu việc tái triển khai về phía tây khỏi truyền thông thù địch, và các phe nổi loạn ở miền Tây và Đồng bằng đang đối mặt với bất ổn nội bộ riêng: công nhân đình công ở Oregon và Washington đụng độ với Vệ binh Quốc gia, một số trung thành với Denver, số khác theo thống đốc công nhận phiến loạn Sacramento, trong khi dân quân trung thành Texas tập hợp ở San Antonio."
american_civil_war_events.752.d.APG: "Sự thống nhất của nước Mỹ đang nhanh chóng tan vỡ khi chế độ độc tài của Tướng MacArthur xa lánh ngày càng nhiều công dân. Chúng ta có cơ hội vàng ở miền Đông để chiếm Tennessee, Kentucky và Virginia từ chính phủ Liên bang đang chao đảo, với Tướng Patton đề nghị một cuộc tiến công mạnh mẽ. Tuy nhiên, báo cáo cho thấy kháng cự của Liên bang ở Texas và Oklahoma đang tăng cường, nên tiến về phía đông có thể khiến chúng ta bị tấn công ở phía tây."
american_civil_war_events.752.d.ACC: "Sự thống nhất của nước Mỹ đang nhanh chóng tan vỡ khi chế độ độc tài của Tướng MacArthur xa lánh ngày càng nhiều công dân. Có vẻ chúng ta là mục tiêu đầu tiên của quân ông ta đang tập hợp ở Đồng bằng Lớn, và kháng cự phổ biến đã nổi lên chống quyết định của các thống đốc chúng ta liên kết với Sacramento ở Oregon và Washington. Một số đại diện bang của [ACC.GetNameDef] được cho là hối hận về quyết định tuyên bố chính phủ đối địch. Liên minh của chúng ta đang bị đe dọa lớn."
american_civil_war_events.752.d.WCA: "Sự thống nhất của nước Mỹ đang nhanh chóng tan vỡ khi các phong trào quần chúng tìm cách lật đổ kẻ áp bức ở Washington, Denver, Sacramento và Baton Rouge. Quân Liên bang có vẻ không có động thái tấn công ở miền Đông chống công nhân đình công, nhưng khó xác định chính xác kế hoạch hành động. Tướng Smedley Butler mới đào ngũ đề nghị một cuộc tấn công để bảo đảm thủ đô cũ và Virginia, trước khi chiếm New England và Kentucky. Những nơi này được coi là chiến lợi phẩm giá trị hơn Trung Tây, cũng như đe dọa nhất nếu bạo chúa Long chiếm chúng trước chúng ta."
american_civil_war_events.752.a: "Có lẽ là tin tốt?"
american_civil_war_events.752.b: "Chúng ta phải tiến về đông bắc trước."
american_civil_war_events.752.c: "Kẻ phản bội dân chủ ngay giữa chúng ta!"
american_civil_war_events.752.d: "Chúng ta phải chiếm D.C.!"

american_civil_war_events.753.t: "Đi qua Chattanooga"
american_civil_war_events.753.d: "Các sư đoàn Liên bang đi qua thành phố Chattanooga, Tennessee, bằng tàu để đến Denver. Dù thành phố nằm trên biên giới với Mississippi, hiện do bọn phản bội miền nam kiểm soát, quân ta đến Missouri mà không bắn một phát nào. Điều này khả thi nhờ bộ tham mưu phe Long đang chuẩn bị tấn công Bắc Carolina, coi đó là khu vực yếu hơn và có giá trị hơn để bảo đảm. Vì vậy, quân ta đi về phía tây với không thương vong."
american_civil_war_events.753.a: "Tất cả theo kế hoạch."

american_civil_war_events.754.t: "Dân quân Liên bang chiếm Nam Texas"
american_civil_war_events.754.d: "Dù Texas đã dứt khoát tuyên bố trung thành với Huey Long, lực lượng trung thành với chính phủ Liên bang đã tranh giành quyết liệt quyền kiểm soát và đến nay giành thắng lợi khắp các vùng phía nam của bang. Thống đốc James Allred bị các thị trưởng miền nam tuyên bố là kẻ phản bội, những người có vẻ quyết tâm đối đầu với đồng bào ở phần còn lại của bang nếu nội chiến leo thang."
american_civil_war_events.754.a: "Chắc chắn là bất ngờ, nhưng đáng hoan nghênh."
american_civil_war_events.754.b: "Phản bội khắp nơi!"
american_civil_war_events.754.c: "Sự nghiệp của Long có vẻ đang mất ủng hộ."

american_civil_war_events.755.t: "Chiến dịch sông Arkansas"
american_civil_war_events.755.d: "Sau khi Nam Texas thất thủ, Arkansas và Oklahoma cũng bị dân quân Liên bang tràn qua, dù thống đốc các bang đã tuyên bố ủng hộ Huey Long. Với các bang này và San Antonio nằm chắc trong tay Liên bang, Houston và Austin có lẽ sẽ sớm thất thủ, và MacArthur sẽ có quyền tiếp cận các mỏ dầu Texas cho quân đội."
american_civil_war_events.755.a: "Chúng ta cần di chuyển nhanh trước khi Patton củng cố vị trí."
american_civil_war_events.755.b: "Họ mong đạt được gì với việc đó?"

american_civil_war_events.756.t: "Quân Liên bang vượt sông Mississippi"
american_civil_war_events.756.d: "Dù Thống đốc Stark của Missouri đã liên kết với Huey Long trong hai cuộc bầu cử qua, trước viễn cảnh một đội quân dân quân và binh lính Liên bang tràn vào bang để tỏa về phía tây, ông đã lên án chính phủ Baton Rouge vì mưu đồ độc tài, và khẳng định trung thành với Tổng thống MacArthur. Với gần như toàn bộ đất phía tây sông Mississippi ở phía bắc Texas đã bảo đảm, quân Liên bang nay sẵn sàng bao vây Texas và tấn công qua dãy Rockies chống Sacramento. Vị thế của chúng ta ở miền Tây có vẻ vững chắc."
american_civil_war_events.756.a: "Cuộc tiến công bắt đầu từ đây!"

american_civil_war_events.757.t: "Houston thất thủ"
american_civil_war_events.757.d: "Đúng như dự đoán, dân quân trung thành từ San Antonio và Oklahoma đã tràn qua dân quân Long mất tổ chức ở Houston và Austin trước khi Tướng Danford có thể củng cố vị trí. Dallas thất thủ ngay sau đó, và với sự thất thủ của ba thành phố then chốt này, toàn bộ Texas nằm chắc trong tay Liên bang, và Thống đốc James Allred bị bắt trước khi kịp trốn thoát."
american_civil_war_events.757.a: "Baton Rouge đã gần."
american_civil_war_events.757.b: "Không quan trọng; họ sẽ không kiểm soát các mỏ dầu đó lâu."

american_civil_war_events.758.t: "Hỗn loạn ở miền Đông"
american_civil_war_events.758.d: "Khi quân ta rời đi, mọi thứ về phía đông đến Saint Louis đã sụp đổ thành hỗn loạn hoàn toàn, và chúng ta dự kiến dân quân Long và Công đoàn sẽ chia chiến lợi phẩm ở miền Đông. Tuy nhiên, điều đó có nghĩa họ sẽ bận đánh nhau ở đó, và chúng ta nay có thể tập trung hoàn toàn vào việc đối phó phiến quân Lập hiến."
american_civil_war_events.758.a: "Chúng ta sẽ sớm chiếm California."

american_civil_war_events.759.t: "Bắc Carolina tuyên bố theo Huey Long"
american_civil_war_events.759.d: "Thống đốc mới đắc cử Bắc Carolina Clyde Hoey, sau khi thấy quân Liên bang rời bờ biển phía đông, đã cam kết ủng hộ chính phủ Huey Long, tìm cả sự bảo vệ khỏi lực lượng Công đoàn ở phía bắc và khỏi bạo loạn đã hoành hành bang từ khi quân Tướng MacArthur rút. Tuy nhiên, theo cách này, quân của Tướng Patton rất gần thành phố chiến lược Norfolk, và nay cuộc đua chiếm Virginia trước đã bắt đầu."
american_civil_war_events.759.a: "Trạm tiếp theo: Virginia!"
american_civil_war_events.759.b: "Cuộc đua giành Virginia đã bắt đầu."

american_civil_war_events.760.t: "Cuộc đua giành Virginia"
american_civil_war_events.760.d.WCA: "Sau khi vượt Bắc Carolina, quân của Tướng Patton gặp điều họ không ngờ - quân của Tướng Butler ở Richmond. Có vẻ họ hội quân từ Tây Virginia và chiếm Virginia không kháng cự trước khi Tướng Patton kịp hành động. Patton đã rút qua biên giới, để lại một đội cảnh vệ nhỏ ở Norfolk."
american_civil_war_events.760.d.APG: "Sáng sớm nay, quân của Tướng Butler bị quân của Tướng Patton đẩy lui khỏi Richmond, sau khi vượt một khoảng cách lớn bất ngờ trong thời gian ngắn, so với lực lượng công đoàn. Với thắng lợi này, Virginia nằm chắc trong tay Huey Long, hiện tại."
american_civil_war_events.760.a: "Làm tốt lắm, Tướng Butler."
american_civil_war_events.760.b: "Lần sau chúng ta cần nhanh hơn."
american_civil_war_events.760.c: "Làm tốt lắm, Tướng Patton."
american_civil_war_events.760.d: "Sao cũng được; nghĩa là chúng ta sẽ trở lại lấy nó sau."
american_civil_war_events.760.e: "Không phải việc của chúng ta."

american_civil_war_events.761.t: "Tranh giành hành lang"
american_civil_war_events.761.d.WCA: "Sau giao tranh ác liệt, lực lượng Công đoàn chiếm quyền kiểm soát Tennessee và Kentucky, giành được thắng lợi quan trọng trước lực lượng Long. Với diễn biến mới này, lực lượng thù địch với Tướng MacArthur nay kiểm soát mọi thứ phía đông sông Mississippi."
american_civil_war_events.761.d.APG: "Sau giao tranh ác liệt, lực lượng Long chiếm quyền kiểm soát Tennessee và Kentucky, giành được thắng lợi quan trọng trước lực lượng Công đoàn. Với diễn biến mới này, lực lượng thù địch với Tướng MacArthur nay kiểm soát mọi thứ phía đông sông Mississippi."
american_civil_war_events.761.a: "Một bước gần hơn đến giải phóng toàn bộ công nhân nước Mỹ!"
american_civil_war_events.761.b: "Chúng ta cần sớm đẩy lui bạo chúa tham nhũng đó!"
american_civil_war_events.761.c: "Một bước gần hơn đến phá hủy chế độ tham nhũng cũ!"
american_civil_war_events.761.d: "Chúng ta cần sớm đẩy lui lũ công đoàn vô thần đó!"
american_civil_war_events.761.e: "Sông Mississippi sẽ lại nhuốm máu."

american_civil_war_events.762.t: "Cờ đỏ trên Washington"
american_civil_war_events.762.d: "Khi lực lượng xã hội chủ nghĩa và Long giao chiến ở biên giới Virginia, dân quân liên kết SPA cuối cùng đã đến thủ đô bị bỏ hoang. Thành phố, không có bất kỳ hiện diện quân sự nào, bị chiếm dễ dàng, với các di tích lịch sử và các con sông qua Potomac đến Alexandria được dân quân bảo đảm trước. Vì có vẻ không có dấu hiệu phản công, dân quân sớm bắt đầu biến đổi National Mall và các địa điểm khác, với sự chú ý nhất dành cho Điện Capitol. Kéo lá cờ cũ khỏi nơi ở của Quốc hội đã bỏ chạy, binh lính dừng lại chụp ảnh và phỏng vấn với báo chí xã hội chủ nghĩa và địa phương trước khi tập hợp reo hò khi lá cờ WCA cuối cùng được kéo lên trên D.C."
american_civil_war_events.762.a: "Quốc hội sẽ không còn áp bức công nhân!"
american_civil_war_events.762.b: "Thủ đô phải sớm được giải phóng!"

american_civil_war_events.763.t: "MacArthur đẩy lui tấn công WCA ở Minnesota"
american_civil_war_events.763.d: "Dù SPA chiếm cơ quan lập pháp bang Minnesota trong bầu cử 1936, họ không thể thực hiện lời hứa về một Minnesota xã hội chủ nghĩa, khi Thống đốc Peterson của Đảng Nông dân-Lao động dùng Vệ binh Quốc gia bang cầm cự ở Minneapolis đủ lâu để binh lính MacArthur đến bang, đẩy lui dân quân từ Wisconsin và nghiền nát công nhân đình công ở Minnesota. Đại hội Công nhân đã bị chặn trong cuộc tiến về phía tây, và bộ tham mưu mới thành lập được cho là đang cân nhắc các cuộc tấn công phía nam và đông thay vào đó, để phát huy lợi thế trước lực lượng Huey Long."
american_civil_war_events.763.a: "Tiếp theo: Chicago!"
american_civil_war_events.763.b: "Tin xấu."

american_civil_war_events.764.t: "New England trong tình thế tuyệt vọng"
american_civil_war_events.764.d: "Dù Hoàng gia trước đây đã từ chối yêu cầu của các thống đốc New England để bảo đảm trung lập, vì nội các cho rằng gây nguy hiểm thêm cho vị thế quân sự của chính phủ Liên bang là không khôn ngoan, yêu cầu gia hạn đêm qua đã mang lại phản ứng khác. Với lựa chọn duy nhất thay cho can thiệp của Anh-Canada trong vùng là bị lực lượng [WCA.GetNameDef] chiếm đóng, ngay cả những người thân Mỹ trong nội các và Hội đồng Cơ mật cũng đã ấm lòng với ý tưởng can thiệp. Chính phủ Anh-Canada có nên hành động?"
american_civil_war_events.764.a: "Chúng ta phải giữ trung lập."
american_civil_war_events.764.b: "Người dân New England cần chúng ta; chúng ta phải giúp họ!"

american_civil_war_events.765.t: "Canada chiếm New England"
american_civil_war_events.765.d.WCA: "Cuộc tiến công vào D.C. có vẻ đã khiến Đế quốc Anh ở phía bắc chúng ta nghĩ rằng chúng ta là mối đe dọa. Họ đã chấp nhận yêu cầu bảo vệ của các thống đốc phản bội New England. Lực lượng của chúng ta không thể tiến được ở Đông Bắc trước khi gặp quân Canada. Tuy nhiên, New Jersey đã rơi vào tay dân quân và đồng minh Quốc tế ở thành phố New York trước khi lực lượng Entente có thể tăng viện."
american_civil_war_events.765.d.others: "Cuộc tiến công của phe xã hội chủ nghĩa vào D.C. có vẻ đã khiến Đế quốc Anh ở phía bắc chúng ta nghĩ rằng họ là mối đe dọa thực sự. Họ đã chấp nhận yêu cầu bảo vệ của các thống đốc New England, và nay đang để mắt đến phe xã hội chủ nghĩa bên kia biên giới. Lực lượng WCA không thể tiến trước khi gặp quân Canada. Tuy nhiên, bang New Jersey đã rơi vào tay dân quân và đồng minh Quốc tế ở thành phố New York trước khi chúng ta có thể tăng viện."
american_civil_war_events.765.a: "Người Anh đã trở lại Boston!"
american_civil_war_events.765.b: "Ít nhất phe xã hội chủ nghĩa không chiếm Boston."

american_civil_war_events.766.t: "Phe xã hội chủ nghĩa tiến vào New England"
american_civil_war_events.766.d: "Dân quân và binh lính xã hội chủ nghĩa đã nhanh chóng chiếm New England sau cuộc tấn công vào Washington, D.C. Dù có ít kháng cự, rõ ràng có ít bạn của chế độ mới ở vùng trung tâm lịch sử của Đảng Cộng hòa, và nhiều người vẫn hy vọng Canada sẽ cứu họ. Tuy nhiên, hiện tại WCA kiểm soát hoàn toàn New England."
american_civil_war_events.766.a: "Tuyệt!"
american_civil_war_events.766.b: "Chúng ta sẽ sớm trở lại vì họ!"
american_civil_war_events.766.c: "Phe xã hội chủ nghĩa ngày càng mạnh."

american_civil_war_events.767.t: "Chiến tranh bắt đầu ở Oregon"
american_civil_war_events.767.d.USA: "Với việc chính phủ Liên bang rút về phía tây, rõ ràng Tướng MacArthur định tấn công [ACC.GetNameDef] trước, coi họ là mối đe dọa cô lập nhất. Vượt dãy Rocky Mountains với những trận tuyết cuối đông, Sư đoàn Lục quân 2 và 14 bắt đầu cuộc tấn công có tổ chức vào Oregon và phần phía nam Washington. Vệ binh Quốc gia ở các bang đó hoặc theo Tổng thống MacArthur hoặc bị buộc đầu hàng. Lực lượng chính phủ Denver sớm chiếm Portland và Yakima, và thống đốc Washington và Oregon đầu hàng để tránh bất ổn công đoàn và chiến tranh. Sư đoàn 3, 2 và 14 nay đang chuẩn bị chiếm California, nhưng người California đã bắt đầu phản công, đúng lúc phe Long lại tấn công Arkansas, và WCA tiến vào Bắc Carolina.\n\nKhắp quốc gia rạn nứt và tan vỡ, các phe phái nhỏ đã thấy cơ hội bắt đầu các chiến dịch tấn công chống mọi chính phủ đối địch, và từ Minnesota đến Bắc Carolina, từ thành phố New York đến New Mexico, giao tranh và bất ổn dân sự cuối cùng đã leo thang thành các trận chiến. Mọi người đều rõ Nội chiến Mỹ lần thứ hai đã bắt đầu."
american_civil_war_events.767.d.ACC: "Với việc chính phủ Liên bang rút về phía tây, rõ ràng Tướng MacArthur định tấn công [ACC.GetNameDef] trước, coi họ là mối đe dọa cô lập nhất. Vượt dãy Rocky Mountains với những trận tuyết cuối đông, Sư đoàn Lục quân 2 bắt đầu cuộc tấn công có tổ chức vào Oregon và phần phía nam Washington. May mắn cho quân phòng thủ, cảnh báo sớm qua dân quân ở Oregon đã đánh thức Vệ binh California ra bảo vệ La Grande, xoay xở đẩy quân đội khỏi bang. Sư đoàn 3, 2 và 14 nay đang chuẩn bị phòng thủ ở Idaho và Nevada, nhưng người California đã bắt đầu phản công, đúng lúc phe Long lại tấn công Arkansas, và WCA tiến vào Bắc Carolina.\n\nKhắp quốc gia rạn nứt và tan vỡ, các phe phái nhỏ đã thấy cơ hội bắt đầu các chiến dịch tấn công chống mọi chính phủ đối địch, và từ Minnesota đến Bắc Carolina, từ thành phố New York đến New Mexico, giao tranh và bất ổn dân sự cuối cùng đã leo thang thành các trận chiến. Mọi người đều rõ Nội chiến Mỹ lần thứ hai đã bắt đầu."
american_civil_war_events.767.a: "California không thể chống lại chúng ta một mình."
american_civil_war_events.767.b: "Chúng ta phải tấn công Portland!"
american_civil_war_events.767.c: "Chúng ta đã cho họ thấy!"
american_civil_war_events.767.d: "Phản bội khắp nơi!"
american_civil_war_events.767.e: "Ra trận!"

american_civil_war_events.768.t: "Xét xử Bộ tham mưu New England"
american_civil_war_events.768.d: "Với cuộc nổi loạn của New England chống lại sự cai trị của chúng ta bị nghiền nát, chúng ta đã bảo đảm vùng ly khai tìm nơi ẩn náu dưới cánh tay Canada năm 1937. Hai tướng lĩnh nổi bật của phe đối lập là Leslie Groves và Mark Clark của New England. Khi họ chờ số phận, nhiều người bắt đầu tự hỏi liệu những người này có đơn giản bị người Canada, những kẻ không muốn thấy phần nước Mỹ của họ trở về nhà, buộc phải chiến đấu chống chúng ta không. Không có bằng chứng nào cho thấy tội ác nghiêm trọng nào do hai người phạm trong việc bảo vệ New England. Hơn nữa, cả hai hứa sẽ trung thành phục vụ lá cờ [ROOT.GetNameDef] nếu nhận được ân xá chính thức từ chính phủ."
american_civil_war_events.768.a: "Ban ân xá cho họ"
american_civil_war_events.768.b: "Họ không thể tin được"

# ACW Desertions
ACW_unit_desertion_tt: "Một phần nhỏ quân đội sẽ đào ngũ sang [FROM.GetNameDef]!\n\n§gĐiều này sẽ dẫn đến giảm 25% tổ chức và 5% sức mạnh trên toàn mặt trận. Chúng ta cần tiến vào đất địch để tránh đào ngũ lặp lại trong tương lai!§!"
ACW_state_desertion_tooltip: "Một phần nhỏ quân đội sẽ đào ngũ sang [FROM.GetNameDef]!\n\n§gĐiều này sẽ dẫn đến giảm 25% tổ chức và 10% sức mạnh cho các đơn vị ở [acw_state_control_changed.GetName]. Chúng ta cần ngăn địch chiếm thủ phủ các bang để tránh đào ngũ lặp lại trong tương lai!§!"

american_civil_war_events.801.t: "Đào ngũ ở mặt trận"
american_civil_war_events.801.d: "Với việc [acw_state_control_changed.GetName] gần đây rơi vào tay [acw_new_controller.GetNameDef], tinh thần quân [acw_old_controller.GetAdjective] đã xuống mức thấp mới. Thậm chí có báo cáo rằng một số nhỏ quân đã bắt đầu đào ngũ khỏi quân đội [acw_old_controller.GetAdjective] và vượt qua chiến tuyến [acw_new_controller.GetAdjective] để chiến đấu cùng [acw_new_controller.GetNameDef]."
american_civil_war_events.801.a: "Chúng ta cần củng cố tinh thần!"

american_civil_war_events.802.t: "Đào ngũ ở mặt trận"
american_civil_war_events.802.d: "Với việc [acw_state_control_changed.GetName] gần đây rơi vào tay [acw_new_controller.GetNameDef], tinh thần quân [acw_old_controller.GetAdjective] đã xuống mức thấp mới. Thậm chí có báo cáo rằng một số nhỏ quân đã bắt đầu đào ngũ khỏi quân đội [acw_old_controller.GetAdjective] và vượt qua chiến tuyến [acw_new_controller.GetAdjective] để chiến đấu cùng [acw_new_controller.GetNameDef]."
american_civil_war_events.802.a: "Chào mừng đến với giải phóng!"

american_civil_war_events.805.t: "Đào ngũ gia tăng trên tiền tuyến"
american_civil_war_events.805.d: "Dù ban đầu họ có thể nuôi ý tưởng hão huyền về thắng lợi, quân đội [acw_losing_side.GetNameDef] đã chịu các vấn đề hậu cần và tinh thần do mất kiểm soát lãnh thổ gần đây. Kết quả là, tình báo của chúng ta báo cáo rằng dù tuyên truyền của họ tuyên bố thắng lợi toàn diện cuối cùng, hậu phương và tiền tuyến của họ bị tê liệt bởi tinh thần kém và chủ nghĩa thất bại.\n\nKhi nội chiến kéo dài, và người Mỹ đánh người Mỹ - một số nhỏ lực lượng vũ trang của họ đã bắt đầu lén vượt chiến trường vào chiến tuyến của chúng ta để đào ngũ sang lực lượng ta. Coi sự nghiệp của chúng ta là chính nghĩa và có lẽ muốn kết thúc ở phía đúng của lịch sử, họ đã dâng hiến phục vụ cho lực lượng vũ trang [acw_winning_side.GetNameDef], cam kết trung thành với chính phủ chính đáng của nước Mỹ!"
american_civil_war_events.805.a: "Sự nghiệp của chúng ta là chính nghĩa!"

american_civil_war_events.806.t: "Quân ta đào ngũ!"
american_civil_war_events.806.d: "Khi chúng ta tham chiến, chúng ta hiểu khó khăn và thử thách phía trước với tư cách phe yếu hơn trong Nội chiến Mỹ. Bất chấp nỗ lực tốt nhất của bộ tham mưu quân sự và ngành công nghiệp dân sự, lực lượng ta đã chịu thất bại liên tiếp trên tiền tuyến, và dân thường bắt đầu trải nghiệm gian khổ chiến tranh. Kết quả là, sĩ quan tiền tuyến báo cáo ngày càng nhiều vấn đề hậu cần và tinh thần lên bộ tham mưu quân sự.\n\nĐáng buồn thay, điều này cũng bao gồm nhiều đơn vị lực lượng vũ trang của ta đã coi sự nghiệp của chúng ta là mất và bắt đầu đào ngũ sang [acw_winning_side.GetNameDef]. Khi người Mỹ đánh người Mỹ trong nội chiến, họ thấy vị thế của chúng ta là không thể thắng và quyết định gia nhập phe họ tin là phía đúng của lịch sử. Dù chúng ta sẽ ban hành lệnh nghiêm khắc để thực thi kỷ luật, tình hình của chúng ta ngày càng vô vọng."
american_civil_war_events.806.a: "Chúng ta sẽ không dung thứ phản bội trên tiền tuyến!"