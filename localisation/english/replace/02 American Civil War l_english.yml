 american_civil_war_events.2.t.president: "Tổng thống Long Tuyên bố Chính phủ Đối thủ tại Baton Rouge"
 american_civil_war_events.2.t.revolt: "Huey Long Tuyên bố Chính phủ Đối thủ tại Baton Rouge"

 american_civil_war_events.2.d.body.intro: "Các sự kiện ở Trung Tây trong tuần qua đã đẩy miền Nam phản động vào cơn điên cuồng. Lo sợ cuộc nổi dậy Đỏ trong tầng lớp người Mỹ gốc Phi, và đã mất hoàn toàn niềm tin vào khả năng của Chính phủ Liên bang trong việc xử lý khủng hoảng, nhiều bang miền Nam đã bắt đầu vũ trang dân quân và động viên lực lượng vệ binh quốc gia, để bảo vệ tài sản và thể chế chính trị của họ khỏi các mối đe dọa Đỏ cả trong lẫn ngoài miền Nam."
 american_civil_war_events.2.d.body.revolt.generic: "Tìm kiếm một nhà lãnh đạo mạnh mẽ và có sức lôi cuốn để bảo vệ họ khỏi chủ nghĩa công đoàn, các thống đốc miền Nam đã tập hợp dưới ngọn cờ của Huey Long. Long, người đã trong một liên minh chính trị với các lực lượng miền Nam khác nhau trong hai năm nay, đã kêu gọi sự hội tụ của \"những người Mỹ yêu nước\" và \"các thành viên trung thành của Quốc hội\" tại Baton Rouge, tố cáo cả \"Đại hội Công nhân\" tự xưng và chính phủ liên bang là \"kẻ thù của Nhân dân Mỹ\"."
 american_civil_war_events.2.d.body.revolt.macarthur: "Tìm kiếm một nhà lãnh đạo mạnh mẽ và có sức lôi cuốn để bảo vệ họ khỏi chủ nghĩa công đoàn, các thống đốc miền Nam đã tập hợp dưới ngọn cờ của Huey Long. Long, người đã trong một liên minh chính trị với các lực lượng miền Nam khác nhau trong hai năm nay, đã kêu gọi sự hội tụ của \"những người Mỹ yêu nước\" và \"các thành viên trung thành của Quốc hội\" tại Baton Rouge, tố cáo cả \"Đại hội Công nhân\" tự xưng và chính phủ quân sự liên bang của Douglas MacArthur là \"kẻ thù của Nhân dân Mỹ\"."
 american_civil_war_events.2.d.body.revolt.landon: "Tìm kiếm một nhà lãnh đạo mạnh mẽ và có sức lôi cuốn để bảo vệ họ khỏi chủ nghĩa công đoàn, các thống đốc miền Nam đã tập hợp dưới ngọn cờ của Huey Long. Long, người đã trong một liên minh chính trị với các lực lượng miền Nam khác nhau trong hai năm nay, đã kêu gọi sự hội tụ của \"những người Mỹ yêu nước\" và \"các thành viên trung thành của Quốc hội\" tại Baton Rouge, tố cáo cả \"Đại hội Công nhân\" tự xưng và chính phủ liên bang kém hiệu quả của Alf Landon là \"kẻ thù của Nhân dân Mỹ\"."
 american_civil_war_events.2.d.body.president: "Tìm kiếm một nhà lãnh đạo mạnh mẽ và có sức lôi cuốn để bảo vệ họ khỏi chủ nghĩa công đoàn, các thống đốc miền Nam đã tập hợp dưới ngọn cờ của Tổng thống Huey Long. Long, người đã trốn thoát khỏi sự bắt giữ của lực lượng MacArthur sau cuộc đảo chính ở Washington và thành công chạy trốn đến Louisiana, đã kêu gọi sự hội tụ của \"những người Mỹ yêu nước\" và \"các thành viên trung thành của Quốc hội\" tại Baton Rouge, tố cáo cả \"Đại hội Công nhân\" tự xưng và chính phủ liên bang kém hiệu quả của Alf Landon là \"kẻ thù của Nhân dân Mỹ\"."
 american_civil_war_events.2.d.body.outro.rebel: "Một phần đáng kể của quân đội Mỹ đã đồng ý với đánh giá của Long. Các Tướng Fox Conner và George Van Horn Moseley, cả hai đều đóng tại miền Nam, đã cam kết ủng hộ Long, làm sâu sắc thêm sự sụp đổ kỷ luật đang diễn ra trong quân đội bị chia rẽ. Với các lực lượng này, phần lớn miền Nam trên thực tế đã ly khai khỏi liên bang, giờ đây được cai trị bởi Long và các đồng minh địa phương của ông.\n\nLong đã chính thức hóa thỏa thuận này bằng cách mở một Quốc hội đối thủ tại Baton Rouge, mà đến lượt nó, đã tuyên bố ông là Tổng thống được bầu một cách chính đáng. \"Chính phủ Nhân dân\" của Long giờ đây cai trị từ Texas đến Nam Carolina, và chuẩn bị đòi lại đất nước từ những người công đoàn chủ nghĩa và giới tinh hoa đã đẩy nó đến bờ vực."
 american_civil_war_events.2.d.body.outro.president: "Một phần đáng kể của quân đội Mỹ đã hưởng ứng lời kêu gọi của Tổng thống hợp hiến. Các Tướng Fox Conner và George Van Horn Moseley, cả hai đều đóng tại miền Nam, đã cam kết ủng hộ Long, làm sâu sắc thêm sự sụp đổ kỷ luật đang diễn ra trong quân đội bị chia rẽ. Với các lực lượng này, phần lớn miền Nam trên thực tế đã ly khai khỏi liên bang, giờ đây được cai trị bởi Long và các đồng minh địa phương của ông.\n\nLong đã chính thức hóa thỏa thuận này bằng cách mở một Quốc hội đối thủ tại Baton Rouge, mà đến lượt nó, đã tái khẳng định vị trí Tổng thống của ông. \"Chính phủ Nhân dân\" của Long giờ đây cai trị từ Texas đến Nam Carolina, và chuẩn bị đòi lại đất nước từ những người công đoàn chủ nghĩa và giới tinh hoa đã đẩy nó đến bờ vực."

