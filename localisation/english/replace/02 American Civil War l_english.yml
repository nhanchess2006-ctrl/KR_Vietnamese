### Set Up Events ###
 american_civil_war_events.1.t: "Đại hội Công nhân Họp tại Chicago"

 american_civil_war_events.1.d.body.intro: "Với lời kêu gọi Tổng đình công được IWW, CIO và thậm chí cả các phần tử của AFL hưởng ứng, nhiệt huyết cách mạng đang lớn dần trong vành đai thép đã đạt đến đỉnh điểm. Những người xã hội chủ nghĩa đã nắm quyền kiểm soát cơ sở hạ tầng quan trọng và chính quyền các bang khắp nơi, tuyên bố thành lập các công xã địa phương và tự phát trưng thu công nghiệp tư nhân, đồng thời dựng rào chắn ở các khu vực trọng yếu của các thành phố công nghiệp lớn. Các lực lượng cánh hữu trong khu vực đã hoàn toàn bị đánh bại, khi Hồng vệ binh bảo vệ vùng nông thôn và các tuyến đường sắt nối các trung tâm ủng hộ Đỏ lại với nhau."
 american_civil_war_events.1.d.body.coup: "Mặc dù cuộc nổi loạn này là tình trạng bất ổn nghiêm trọng nhất kể từ Nội chiến, nó sẽ tương đối đơn giản (dù bạo lực và đẫm máu) để dập tắt nếu không vì một yếu tố then chốt: lòng trung thành của quân đội. Mặc dù quân đội thông thường là một lực lượng phi chính trị kiên định, việc Tướng MacArthur đơn phương ban hành Kế hoạch Chiến tranh White và cướp chính quyền ở Washington đã phá vỡ truyền thống không can thiệp vào công việc dân sự, và đã làm rạn nứt lòng trung thành của chính quân đội. Sau cuộc đảo chính của MacArthur, nỗ lực phản đảo chính của Tướng Smedley Butler, và các cuộc thanh trừng thất bại sau đó nhằm loại bỏ các sĩ quan \"bất trung\" khỏi hàng ngũ, Butler và Tướng James K. Parsons, cùng với các sĩ quan tiến bộ và Trung Tây nổi bật khác, đã gặp John Reed và cam kết ủng hộ cuộc nổi dậy của công nhân đang lớn mạnh."
 american_civil_war_events.1.d.body.republican: "Mặc dù cuộc nổi loạn này là tình trạng bất ổn nghiêm trọng nhất kể từ Nội chiến, nó sẽ tương đối đơn giản (dù bạo lực và đẫm máu) để dập tắt nếu không vì một yếu tố then chốt: lòng trung thành của quân đội. Mặc dù quân đội thông thường là một lực lượng phi chính trị kiên định, việc Tướng MacArthur đơn phương ban hành Kế hoạch Chiến tranh White đã phá vỡ truyền thống không can thiệp vào công việc dân sự, và đã làm rạn nứt lòng trung thành của chính quân đội. Sau cuộc cướp chính quyền ngắn ngủi của MacArthur ở Washington, nỗ lực phản đảo chính của Tướng Smedley Butler, và các cuộc thanh trừng thất bại sau đó nhằm loại bỏ các sĩ quan \"bất trung\" khỏi hàng ngũ, Butler và Tướng James K. Parsons, cùng với các sĩ quan tiến bộ và Trung Tây nổi bật khác, đã gặp John Reed và cam kết ủng hộ cuộc nổi dậy của công nhân đang lớn mạnh."
 american_civil_war_events.1.d.body.hull: "Mặc dù cuộc nổi loạn này là tình trạng bất ổn nghiêm trọng nhất kể từ Nội chiến, nó sẽ tương đối đơn giản (dù bạo lực và đẫm máu) để dập tắt nếu không vì một yếu tố then chốt: lòng trung thành của quân đội. Mặc dù quân đội thông thường là một lực lượng phi chính trị kiên định, việc Tướng MacArthur đơn phương ban hành Kế hoạch Chiến tranh White và nắm quyền hành pháp đã phá vỡ truyền thống không can thiệp vào công việc dân sự, và đã làm rạn nứt lòng trung thành của chính quân đội. Sau cuộc cướp chính quyền của MacArthur ở Washington, nỗ lực phản đảo chính của Tướng Smedley Butler, và các cuộc thanh trừng thất bại sau đó nhằm loại bỏ các sĩ quan \"bất trung\" khỏi hàng ngũ, Butler và Tướng James K. Parsons, cùng với các sĩ quan tiến bộ và Trung Tây nổi bật khác, đã gặp John Reed và cam kết ủng hộ cuộc nổi dậy của công nhân đang lớn mạnh."
 american_civil_war_events.1.d.body.outro: "Với lực lượng quân sự liên bang không còn là trở ngại cho cách mạng, SPA đã mời tất cả các lực lượng chính trị cách mạng họp tại Chicago. Các nghị sĩ xã hội chủ nghĩa, đại diện công đoàn IWW và CIO, và các chính trị gia tiến bộ cách mạng khác đã tụ họp và ký một tuyên bố tự xưng là \"Đại hội Công nhân Lâm thời Mỹ\", về cơ bản là tuyên bố một chính phủ Đỏ đối thủ. Như một phần của tuyên bố, họ tố cáo tính chính danh của bất kỳ chính phủ \"phản động\" nào ở Hoa Kỳ, và bầu John Reed làm Tổng thống lâm thời của họ.\n\nKhi các chính quyền bang khác nhau tuyên bố trung thành với chính phủ cách mạng mới, có vẻ như con xúc xắc đã được gieo. Cách mạng đã bắt đầu."

