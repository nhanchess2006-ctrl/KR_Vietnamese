 ACC_deal_with_devil_desc: "Chúng ta đang thua trong nội chiến... một cách tồi tệ. Hy vọng duy nhất của chúng ta là thiết lập một thỏa thuận ngừng bắn tạm thời với [From.GetNameDef], để chúng ta có thể hợp lực chống lại kẻ thù thực sự của mình. Đề xuất của chúng ta là thỏa thuận ngừng bắn sẽ kéo dài 90 ngày, nhưng hy vọng lâu hơn nếu cả hai bên sẵn lòng."

