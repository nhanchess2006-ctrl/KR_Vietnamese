 american_civil_war_events.3.t.president: "Các Thống đốc Thái Bình Dương Ủng hộ Roosevelt"
 american_civil_war_events.3.t.revolt: "Quentin Roosevelt Nhận Chức Tổng thống Lâm thời tại Sacramento"

 american_civil_war_events.3.d.body.intro.nolong: "Việc Tướng MacArthur cướp chính quyền ở phía đông đã để lại một khoảng trống quyền lực rộng lớn trên khắp đất nước. Các lực lượng chính trị trung thành với dân chủ và hiến pháp đã kinh hoàng chứng kiến phía đông rơi vào hỗn loạn cách mạng và phi hiến pháp. Cuộc đảo chính của MacArthur chỉ là sự xúc phạm đầu tiên: tuyên bố của Reed ở Chicago và việc Long cướp chính quyền ở miền Nam đã càng củng cố ý niệm rằng trật tự pháp lý và hiến pháp ở Hoa Kỳ đang có nguy cơ bị dập tắt bởi những kẻ cấp tiến và bạo chúa."
 american_civil_war_events.3.d.body.intro.long: "Việc Tướng MacArthur cướp chính quyền ở phía đông đã để lại một khoảng trống quyền lực rộng lớn trên khắp đất nước. Các lực lượng chính trị trung thành với dân chủ và hiến pháp đã kinh hoàng chứng kiến phía đông rơi vào hỗn loạn cách mạng và phi hiến pháp. Cuộc đảo chính của MacArthur chỉ là sự xúc phạm đầu tiên: tuyên bố của Reed ở Chicago và việc Long cướp chính quyền ở miền Nam (mà không tham khảo ý kiến Quốc hội hợp hiến) đã càng củng cố ý niệm rằng trật tự pháp lý và hiến pháp ở Hoa Kỳ đang có nguy cơ bị dập tắt bởi những kẻ cấp tiến và bạo chúa."

 american_civil_war_events.3.d.body.middle1.normal: "Bờ biển phía tây, may mắn thay, cho đến nay đã được tha khỏi phần lớn sự hỗn loạn. Ngoại trừ một cuộc nổi dậy Đỏ thất bại ở Seattle, chính phủ hiến pháp nói chung đã được duy trì ở California, Oregon và Washington. Do đó, nhiều chính trị gia theo chủ nghĩa hiến pháp từ cả hai đảng lớn và Farmer-Labor đã chọn chạy trốn đến thành trì dân chủ mới. Trong số đó có Phó Tổng thống Quentin Roosevelt, người đã ở bờ biển phía tây trước cuộc đảo chính của MacArthur."
 american_civil_war_events.3.d.body.middle1.olson: "Bờ biển phía tây, may mắn thay, cho đến nay đã được tha khỏi phần lớn sự hỗn loạn. Ngoại trừ một cuộc nổi dậy Đỏ thất bại ở Seattle, chính phủ hiến pháp nói chung đã được duy trì ở California, Oregon và Washington. Do đó, nhiều chính trị gia theo chủ nghĩa hiến pháp từ cả hai đảng lớn và Farmer-Labor đã chọn chạy trốn đến thành trì dân chủ mới. Trong số đó có Tổng thống lâm thời Quentin Roosevelt, người đã thoát khỏi sự bắt giữ của lực lượng MacArthur và thành công chạy trốn đến Sacramento."
 american_civil_war_events.3.d.body.middle1.hull: "Bờ biển phía tây, may mắn thay, cho đến nay đã được tha khỏi phần lớn sự hỗn loạn. Ngoại trừ một cuộc nổi dậy Đỏ thất bại ở Seattle, chính phủ hiến pháp nói chung đã được duy trì ở California, Oregon và Washington. Do đó, nhiều chính trị gia theo chủ nghĩa hiến pháp từ cả hai đảng lớn và Farmer-Labor đã chọn chạy trốn đến thành trì dân chủ mới. Trong số đó có Cựu Thống đốc New York và ứng viên Phó Tổng thống của GOP Quentin Roosevelt, người đã ở bờ biển phía tây trước cuộc đảo chính của MacArthur."

 american_civil_war_events.3.d.body.middle2.normal: "Với sự ủng hộ của các thống đốc bờ biển phía tây và Phó Tổng thống Roosevelt, nhiều nghị sĩ đã tụ họp tại Sacramento. Tuyên bố những thành viên Quốc hội đã theo các chính phủ đối thủ đã mất ghế của họ, họ tuyên bố mình có đủ túc số với tư cách là Quốc hội hợp hiến của Hoa Kỳ. Với tư cách đó, họ tuyên bố Tổng thống, dưới sự giam giữ của lực lượng MacArthur, không thể phục vụ, và tuyên bố Roosevelt là Tổng thống lâm thời, tạo ra một chính phủ đối thủ khác."
 american_civil_war_events.3.d.body.middle2.long: "Với sự ủng hộ của các thống đốc bờ biển phía tây và Phó Tổng thống Roosevelt, nhiều nghị sĩ đã tụ họp tại Sacramento. Tuyên bố những thành viên Quốc hội đã theo các chính phủ đối thủ đã mất ghế của họ, họ tuyên bố mình có đủ túc số với tư cách là Quốc hội hợp hiến của Hoa Kỳ. Với tư cách đó, họ tuyên bố Tổng thống Long, đã phạm tội phản quốc bằng cách tuyên bố chính phủ của riêng mình, không thể phục vụ, và tuyên bố Roosevelt là Tổng thống lâm thời, tạo ra một chính phủ đối thủ khác."
 american_civil_war_events.3.d.body.middle2.olson: "Với sự ủng hộ của các thống đốc bờ biển phía tây và Tổng thống lâm thời Roosevelt, nhiều nghị sĩ đã tụ họp tại Sacramento. Tuyên bố những thành viên Quốc hội đã theo các chính phủ đối thủ đã mất ghế của họ, họ tuyên bố mình có đủ túc số với tư cách là Quốc hội hợp hiến của Hoa Kỳ. Với tư cách đó, họ tuyên bố rằng Tổng thống, vẫn đang hôn mê và được coi là khó có thể hồi phục, không thể phục vụ, và tái khẳng định Roosevelt là Tổng thống lâm thời, tạo ra một chính phủ đối thủ khác."
 american_civil_war_events.3.d.body.middle2.hull: "Với sự ủng hộ của các thống đốc bờ biển phía tây và Quentin Roosevelt, nhiều nghị sĩ đã tụ họp tại Sacramento. Tuyên bố những thành viên Quốc hội đã theo các chính phủ đối thủ đã mất ghế của họ, họ tuyên bố mình có đủ túc số với tư cách là Quốc hội hợp hiến của Hoa Kỳ. Với tư cách đó, họ cuối cùng đã bầu danh sách ứng cử viên của Đảng Cộng hòa trong một cuộc bầu cử tổng thống dự phòng. Vì ứng viên Tổng thống của Đảng Cộng hòa đã bị lực lượng MacArthur bắt giữ, họ tuyên bố Roosevelt là Tổng thống lâm thời, tạo ra một chính phủ đối thủ khác."

 american_civil_war_events.3.d.body.outro: "\"Liên minh hiến pháp\" này đã giành được sự ủng hộ của nhiều sĩ quan quân đội không muốn theo MacArthur, Reed hay Long. Tướng George Marshall đã đề nghị phục vụ chính phủ Sacramento, nơi giờ đây chuẩn bị cho một cuộc hành quân dài về phía đông để khôi phục chính quyền hiến pháp cho Hoa Kỳ."

