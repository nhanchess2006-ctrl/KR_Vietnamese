### Other Stuff

 RKT_wang_jingwei_advisor_desc: "§YSinh:§! §gNgày 4 tháng 5 năm 1883, tại Tam Thủy, tỉnh Quảng Đông, Đại Thanh§!\n§YPhe phái:§! §gRCA§!\n§YTiểu sử:§! §L Thời trẻ, Uông Tinh Vệ say mê cuộc đời Saigo Takamori và Katsu Kaishu, coi họ là hình mẫu đã biến Nhật Bản lạc hậu thành nước công nghiệp. Tự hỏi vì sao Trung Quốc trì trệ, ông tìm đến tác phẩm Lương Khải Siêu và Tôn Trung Sơn. Ở Tôn, ông thấy người thầy kính yêu; trong Đồng minh Hội, ông nổi danh toàn quốc khi mưu sát Nhiếp chính Tải Phong, cha vua Phổ Nghi, dù thất bại và bị cầm tù.\n\nCách mạng Tân Hợi nổ ra, Uông được thả nhưng từ chối thề trung thành với Tôn đang vỡ mộng vì bị chính trường và quân phiệt gạt sang bên. Ông sang Pháp, rồi trở về không lâu sau khi Tôn khải hoàn về Quảng Châu năm 1921 để tham gia chính phủ cách mạng của Quốc dân đảng mới thành lập. Uông dự cuộc cải tổ đảng năm 1924, dần đại diện cánh tả đang lớn mạnh, dù không tự coi mình là nhà tư tưởng xã hội chủ nghĩa. Khi Tôn mất năm 1925, Uông có mặt bên giường bệnh và giúp viết di chúc.\n\nBộ ba Hồ Hán Dân, Tưởng Giới Thạch và Uông Tinh Vệ nhanh chóng bước vào cuộc tranh quyền cay đắng nhất nhì trong đảng. Uông chiến thắng sau khi Hồ lưu vong sang Moskva, còn Tưởng bị ám sát sau thất bại Bắc phạt. Nhưng cuộc viễn chinh sụp đổ buộc Uông cùng đồng minh chính trị chạy sang châu Âu, hy vọng ngày trở về thực hiện cách mạng của Tôn.\n\nTrong lưu vong, ông củng cố vị trí lãnh đạo Ủy ban Trung ương cánh tả, cạnh tranh với Ủy ban cánh hữu của Hồ. Nhờ Quốc tế và cuộc nổi dậy Mân-Cám hỗ trợ, ông mong giành chức Chủ tịch Quốc dân đảng.\n\nSố phận không chiều ý; phong trào sụp đổ, Uông dùng tài sinh tồn chính trị để chuyển từ đại diện chủ nghĩa xã hội sang một người dân tộc chủ nghĩa cánh tả đơn thuần, mong tìm chỗ đứng trong Quốc dân đảng của đối thủ.§!"

 CHI_song_qingling_advisor_desc: "§YSinh:§! Ngày 27 tháng 1 năm 1893, tại Thượng Hải, Khu tô giới Quốc tế Thượng Hải\n§YPhe phái:§! §gPAC§!\n§YTiểu sử:§! §L Nổi loạn từ trẻ, Tống Khánh Linh thách thức cha mẹ phản đối cuộc hôn nhân với Tôn Trung Sơn, thậm chí bỏ nhà để cưới nhà cách mạng. Được giáo dục phương Tây, thông thạo Anh và Trung, duyên dáng, thanh lịch và nhân hậu, bà thể hiện lòng trung thành tuyệt đối khi bảo Tôn trốn trước trận pháo kích của quân phiệt Trần Quýnh Minh, dù theo ghi chép bà bị sảy thai và không thể sinh con nữa.\n\nLuôn bên chồng, bà có mặt khi Tôn đồng ý hợp tác Quốc tế thứ Ba và ở giường bệnh khi di chúc cuối cùng được đọc. Rồi Bắc phạt diễn ra; bà tham gia với vị thế góa phụ Tôn tiên sinh khiến không ai trong đảng dám đụng đến hay thách thức. Khi viễn chinh thất bại, bà không xem đó là thất bại cách mạng. Bà cùng tướng cánh tả chạy về khu nổi dậy Mân-Cám, thường xuyên đi lại giữa căn cứ và Thượng Hải để tìm viện trợ cho chiến tranh du kích chống quân phiệt Trực Lệ đáng khinh.\n\nSát cánh cùng bà là người bạn thân Đặng Diễn Đạt. Gắn bó từ những ngày tươi đẹp của chính phủ cách mạng Quảng Châu, họ trở thành anh em trong đấu tranh. Cả hai lập Ủy ban Hành động Lâm thời, tin mình phải hoàn thành giấc mơ Tôn tiên sinh.\n\nNhưng người thực hiện di nguyện chồng bà lại không phải họ. Dù tiếp tục chống Quốc dân đảng của Hồ Hán Dân, lời khẩn cầu của Trần Hữu Nhân và em trai Tống Tử Văn khiến bà miễn cưỡng ủng hộ chính phủ mới; Đặng Diễn Đạt cũng làm theo.§!"

 KMT_lead_the_liberation_of_asia: "Lãnh đạo công cuộc giải phóng châu Á"
 KMT_lead_the_liberation_of_asia_desc: "Cách mạng Quốc dân Trung Quốc phát triển thành cách mạng lớn hơn cho các dân tộc châu Á bị áp bức chống tai họa đế quốc là tiến trình tự nhiên. Những năm qua, chúng ta chứng minh với thế giới phương pháp của mình mang tự do và giải phóng, rằng Tam Dân sẽ giải phóng mọi người lắng nghe."

 KMT_demand_concessions_return: "Yêu cầu hoàn trả các tô giới"
 KMT_demand_concessions_return_desc: "Chúng ta từng đau đớn vì nỗi nhục bán đứng đồng bào cho đế quốc. Không quên anh chị em Thượng Hải nhiều năm dẫn dắt tinh thần cách mạng chống thế lực phản động. Nay ta lãnh đạo Trung Quốc mới, cuối cùng có thể đứng lên chống chế độ ủy trị Sứ quán nhục nhã. Chúng ta sẽ giải phóng đồng bào, bằng hòa bình hay vũ lực."

 KMT_consolidate_the_frontiers: "Củng cố biên cương"
 KMT_consolidate_the_frontiers_desc: "Ưu tiên là khẳng định Tây Tạng, Mông Cổ và Tân Cương vốn thuộc quốc gia Trung Hoa vĩ đại. Đồng bào các dân tộc đã bị đế quốc áp bức quá lâu, vẫn mong ta dẫn đến Cách mạng Quốc dân. Như cố Tôn tiên sinh dạy, khi đoàn kết và dẫn dắt họ, đất nước, nền văn minh sẽ lại vĩ đại."

 KMT_beyond_macmahon_line: "Vượt đường MacMahon"
 KMT_beyond_macmahon_line_desc: "Đường MacMahon bị Anh vạch bất công, cưỡng ép nhượng Tawang cho Tây Tạng ly khai. Quyết định không có sự chấp thuận của ta là nỗi phẫn nộ quốc gia, sỉ nhục quyền can thiệp công việc của chính mình, bởi việc Tây Tạng là việc Trung Quốc. Nay đất nước hùng mạnh trở lại, ta sẽ tiến lên khôi phục danh dự và toàn vẹn lãnh thổ."

 KMT_secure_the_northern_frontier: "Bảo đảm biên giới phía Bắc"
 KMT_secure_the_northern_frontier_desc: "Vị trí gần cùng chế độ phản động của Nga luôn nhắc ta rằng đế quốc không chỉ đe dọa từ Tây mà cả Bắc. Nga tham lam nhòm ngó yêu sách Mông Cổ của ta; đừng quên Ngoại Mãn Châu từng thuộc Trung Quốc rộng lớn. Muốn giữ biên giới, phải bất ngờ đánh Gấu Nga bằng sức mạnh lớn."

 KMT_liberate_southeast_asia: "Giải phóng Đông Nam Á"
 KMT_liberate_southeast_asia_desc: "Nam Hải từ thời Đại Minh nằm trong ảnh hưởng văn hóa, xã hội, kinh tế và chính trị Trung Quốc. Đông Nam Á từ lâu có cả đồng chí lẫn đế quốc, cùng đồng bào hải ngoại mong mỏi, ủng hộ giải phóng. Nay cuối cùng có thể đáp lại, dùng sức mạnh Trung Quốc đoàn kết tất cả."

 KMT_we_will_liberate_taiwan: "Chúng ta sẽ giải phóng Đài Loan!"
 KMT_we_will_liberate_taiwan_desc: "Không bi kịch nào lớn hơn việc bán đứng đồng bào cho đế quốc Nhật khi nhượng đảo Đài Loan. Nay Trung Quốc mạnh trở lại, đoàn tụ với đồng bào Đài Loan là nghĩa vụ quốc gia. Anh chị em Đài Loan mong giải phóng; ta sẽ phá xiềng xích cho họ, thống nhất đất nước lần nữa."

 KMT_two_suns_in_sky: "Hai mặt trời trên bầu trời"
 KMT_two_suns_in_sky_desc: "Có lẽ không nước đế quốc nào man rợ hơn Nhật Bản. Nhân dân ta chịu bất công trắng trợn từ Nhật, kẻ luôn muốn lợi dụng nền văn minh Trung Quốc. Nhiều đồng bào còn nhớ sự tàn phá trong Chiến tranh Kháng chiến. Nay quốc gia hồi sinh, đã đến lúc ngăn chúng lợi dụng lần nữa."

 KMT_strike_german_east_asia: "Tấn công Đông Á thuộc Đức"
 KMT_strike_german_east_asia_desc: "Quốc gia phản động tư bản [GER.GetNameDef] chỉ muốn bóc lột nhân dân, đất nước Trung Quốc. Chính lúc Bắc phạt cao trào, đòn đánh sau lưng của Đức khiến sự nghiệp cứu nước sụp đổ. Chừng nào đế quốc ấy còn ở châu Á, nhân dân châu Á chưa thể tự do. Cứu họ là nghĩa vụ của ta."

 KMT_secure_the_southern_seas: "Bảo đảm các vùng biển phương Nam"
 KMT_secure_the_southern_seas_desc: "Biển Đông và vùng xa hơn từ lâu chịu quyền kiểm soát hàng hải Trung Quốc; dưới ảnh hưởng Trung Quốc, các vùng ấy trở thành quốc gia phồn thịnh. Chừng nào nhà nước phản động [AST.GetNameDef] còn tồn tại, hòa bình chưa thể đến và tài nguyên biển không thể chia sẻ với Trung Quốc cùng đồng minh. Ta phải chủ động giành quyền bảo đảm các vùng biển."

 KMT_ensure_pacific_security: "Bảo đảm an ninh Thái Bình Dương"
 KMT_ensure_pacific_security_desc: "Một số người trong chính phủ xuất thân Hawaii; Quốc dân đảng có hiện diện đáng kể trong cộng đồng Hoa kiều trên đảo. Họ cũng tận mắt thấy sự man rợ của đế quốc khi Hoa Kỳ cưỡng chiếm Hawaii. Trung Quốc phải bảo đảm Thái Bình Dương thoát âm mưu của Mỹ, Nhật và mọi kẻ muốn thống trị, trở thành người bảo vệ đại dương."

 KMT_imperialism_crushed_forevermore: "Đế quốc bị nghiền nát vĩnh viễn"
 KMT_imperialism_crushed_forevermore_desc: "Cuối cùng đã hoàn thành. Bằng sức mạnh tự nhiên vẻ vang, ta đuổi hết tàn dư đế quốc ngoại bang khỏi châu Á và Thái Bình Dương. Các dân tộc châu Á cuối cùng sống hòa hợp, đoàn kết, hòa bình, hợp tác, không bị phương Tây hay Nhật can thiệp. Đế quốc ngoại bang sẽ không bao giờ đe dọa nhân dân Trung Quốc nữa."

#The Internationale of the East Focus Tree
 KMT_chinese_expeditionary_force: "Quân Viễn chinh Trung Quốc"
 KMT_chinese_expeditionary_force_desc: "Chúng ta từng ở lâu với đồng chí châu Âu thân yêu, không bao giờ quên họ hào phóng cho Ủy ban Trung ương lưu vong tại các nước công đoàn chủ nghĩa tự do. Nay khi họ cần, phái người và tài nguyên giúp anh chị em xã hội chủ nghĩa là hoàn toàn xứng đáng."

 KMT_extend_the_mmic: "[KMT_extend_mmic_loc]"
 KMT_extend_the_mmic_desc: "[KMT_extend_mmic_desc_loc]"
 KMT_extend_the_mmic_alive_desc: "Phái bộ Quân sự Quốc tế tại Trung Quốc giữ vai trò then chốt trong thắng lợi cách mạng những năm qua. Dù đã thống nhất và thắng Kháng chiến, viện trợ của họ vẫn quý giá cho phát triển lực lượng vũ trang. Hãy đề nghị kéo dài lưu trú để tiếp tục hiện đại hóa quân đội."
 KMT_extend_the_mmic_dead_desc: "Quốc tế thứ Ba sụp đổ, số phận trớ trêu khiến hàng nghìn người tị nạn từ các thủ đô cũ Paris, Luân Đôn nay đến Trung Quốc để giữ tinh thần cách mạng. Phản động hiện diện và thống trị thế giới, ta phải đoàn kết người xã hội chủ nghĩa toàn cầu cùng tiêu diệt tư bản vĩnh viễn."
 KMT_extend_mmic_int_alive: "Gia hạn lưu trú của MMIC"
 KMT_extend_mmic_int_dead: "Tuyển người lưu vong từ Quốc tế"

 KMT_reach_out_to_the_overseas_community: "Tiếp cận cộng đồng hải ngoại"
 KMT_reach_out_to_the_overseas_community_desc: "Ngay trong Ủy ban Trung ương, một số thành viên như Trần Bích Quân xuất thân cộng đồng Hoa kiều. Hãy dùng mạng lưới, quan hệ của Ủy ban Hoa kiều trước đây để mở ảnh hưởng các nhóm như RCA trong cộng đồng người Hoa quốc tế, tăng ủng hộ chế độ hiện tại."

 KMT_encourage_foreign_investment: "Khuyến khích đầu tư nước ngoài"
 KMT_encourage_foreign_investment_desc: "Trung Quốc rộng lớn, giàu tài nguyên và vật liệu thiết yếu cho thế giới hiện đại. Để tạo vốn, tăng trưởng kinh tế, hãy khuyến khích doanh nghiệp nước ngoài kinh doanh, đầu tư tại đây, vừa phát triển kinh tế quốc gia vừa xây quan hệ với các nước. Cùng nhau, ta đạt nhiều hơn khi hướng tới hợp tác hòa bình."

 KMT_the_dongfeng_project: "Dự án Đông Phong"
 KMT_the_dongfeng_project_desc: "Nhiều thế kỷ qua, Trung Quốc tụt xa thế giới về công nghệ; chỉ nhà khoa học, kỹ sư tham vọng nhất mới dám mơ chương trình tên lửa đạn đạo đúng nghĩa. Lấy cảm hứng Dự án Damocles của Quốc tế, ta sẽ tái lập thành công bằng dự án \"Đông Phong\" riêng, chuẩn bị quốc phòng cho tương lai."

#The Asia-Pacific Friendship Association Focus Tree
 KMT_coordinate_the_afro_asian_conference: "Tổ chức Hội nghị Á-Phi"
 KMT_coordinate_the_afro_asian_conference_desc: "Nhân dân châu Phi, châu Á từ lâu bị phương Tây áp bức. Cách mạng Trung Quốc thành công thoát đế quốc truyền cảm hứng cho họ; tài nguyên Trung Quốc sẽ giúp họ phát triển, tái thiết sau tổn thương thuộc địa. Ta sẽ triệu tập hội nghị các nước tự do của thế giới đang phát triển để cùng thảo luận tương lai."

 KMT_joint_pan_asian_military_cooperation: "Hợp tác quân sự Liên Á"
 KMT_joint_pan_asian_military_cooperation_desc: "Các tướng và sĩ quan kỳ cựu Quốc dân Cách mệnh quân có lẽ giỏi nhất châu Á nhờ kinh nghiệm chiến đấu dày dạn vì cách mạng. Hãy tổ chức huấn luyện quân sự chung, gửi cố vấn lục, hải, không quân đến các đồng chí châu Á để họ hiện đại hóa, củng cố quân đội."

 KMT_aid_the_developing_world: "Viện trợ thế giới đang phát triển"
 KMT_aid_the_developing_world_desc: "Sức mạnh kinh tế hồi sinh và tài nguyên dồi dào của Trung Quốc nên phục vụ đồng chí cách mạng khắp thế giới đang phát triển. Họ đã chịu khổ, đói khát lâu năm dưới gót đế quốc. Trung Quốc phải dẫn đầu giúp họ phát triển, tái thiết, chữa lành nhiều thế kỷ bị làm nhục."

 KMT_five_principles_of_peaceful_coexistence: "Năm nguyên tắc chung sống hòa bình"
 KMT_five_principles_of_peaceful_coexistence_desc: "Nhiều đồng chí Quốc dân đảng thừa nhận cuộc đấu tranh giải phóng của nhân dân Ấn Độ chống đế quốc Anh. Hợp tác tốt hơn tự đánh nhau, suy yếu trước đế quốc. Ta sẽ gặp chính phủ Ấn Độ giải quyết Aksai Chin và Tawang, cùng chiến đấu với tư cách hai quốc gia cách mạng trẻ."

 KMT_coordinate_the_afro_asian_conference_tt: "§YChúng ta sẽ tổ chức Hội nghị Á-Phi để vận động ủng hộ các dự án đầu tư tại thế giới đang phát triển. Các cường quốc xã hội chủ nghĩa tham gia sẽ mở quyết định đầu tư vào các nước xã hội chủ nghĩa hậu thuộc địa tại Đông Á, tiểu lục địa Ấn Độ, Trung Đông, châu Đại Dương và châu Phi.§!"

 KMT_aid_the_developing_world_trigger_tt: "§YĐể chọn tiêu điểm này, phải đầu tư vào ít nhất 10 quốc gia khác nhau, chứng minh cam kết lãnh đạo sự nghiệp chống thực dân.§!"

 KMT_aid_the_developing_world_effect_tt: "§GĐã chứng minh tận tâm cải thiện đời sống các nước hậu thuộc địa, các khoản đầu tư tiếp theo sẽ tốn ít quyền lực chính trị hơn.§!"

 KMT_five_principles_of_peaceful_coexistence_tt: "§RMọi yêu sách Trung Quốc còn lại tại lãnh thổ tranh chấp [858.GetName] và [897.GetName] sẽ được rút bỏ, giải quyết vấn đề từ phía ta.§!\n§GĐiều này mở đường mời các nước Ấn Độ độc lập, xã hội chủ nghĩa vào phe.§!"

#Asian Peoples' Anti-Imperialism League Focus Tree
 KMT_never_another_humiliation: "Không bao giờ chịu nhục nữa"
 KMT_never_another_humiliation_desc: "Đây là thế giới sinh tồn. Cường quốc chỉ muốn phô sức mạnh, mở rộng dân tộc ra toàn cầu; Trung Quốc phải noi mô hình ấy để sống còn. Ta đã thấy đế quốc làm gì với đất nước, biết lòng tham sẽ đưa chúng trở lại chia cắt quốc gia vĩ đại và làm nhục dân tộc. Hãy tăng ngân sách lục, hải quân để lời đe dọa được hậu thuẫn bằng thực lực."

 KMT_summer_border_service_corps: "Đoàn Phục vụ Biên cương Mùa hè"
 KMT_summer_border_service_corps_desc: "Bồi dưỡng ý thức quốc gia là nghĩa vụ, kể cả ở biên cương nghèo và thường bất trị. Ta sẽ đưa thanh niên tình nguyện xây trường, đường và công trình vệ sinh mùa hè, đồng thời dạy dân kỹ năng lao động, văn hóa hiện đại, huấn luyện nghiêm để chống xâm lược. Như vậy sẽ nâng đời sống, gắn các vùng biên vĩnh viễn với quốc gia Trung Hoa."

 KMT_fanatical_militarism: "Chủ nghĩa quân phiệt cuồng tín"
 KMT_fanatical_militarism_desc: "Cá nhân chỉ là bánh răng trong cỗ máy đấu tranh quốc gia. Nam nữ Trung Quốc phải thành con người mới, đặt ý chí và phúc lợi cá nhân dưới sự tận tụy quân sự. Chết trận sẽ được coi là hy sinh anh hùng; ta khuyến khích mọi công dân chuẩn bị hiến mạng vì quốc phòng."

 KMT_entrenching_isolation: "Củng cố sự biệt lập"
 KMT_entrenching_isolation_desc: "Nhiều năm giao thiệp ngoại quốc chỉ mang nhục nhã, rõ ràng tiếp tục cũng chẳng được gì. Từ thời Đại Minh, vai trò Trung Quốc là duy trì hòa bình, thịnh vượng, an ninh châu Á; trở lại vị thế thành trì và ngọn đuốc ưu thế văn hóa trong vùng là chính đáng. Vì vậy, hãy tập trung điều thực sự thuộc công việc Trung Quốc."

 KMT_repudiate_the_catastrophe: "Xóa nỗi nhục thảm họa 1927"
 KMT_repudiate_the_catastrophe_desc: "Mọi người Trung Quốc sẽ nhớ năm 1927 là năm đế quốc Đức kéo hạm đội tới phá Cách mạng Quốc dân, đưa Hán gian Phổ Nghi lên ngôi lần nữa, đẩy quốc gia sâu hơn vào quân phiệt. Nay sức mạnh hồi phục, quyền lực không ai thách thức, đã đến lúc xóa nỗi nhục 1927. Cuối cùng Đức sẽ biết mất tất cả là thế nào."

 KMT_building_infrastructure_in_northwest_tt: "Các vùng biên cương sẽ được phát triển để hỗ trợ chiến dịch quân sự tương lai!"

 KMT_repudiate_the_catastrophe_tt: "Trong cuộc thánh chiến vẻ vang khôi phục lãnh thổ Trung Quốc rộng lớn nhất, ta có thể §Rđòi chủ quyền§! tại Ngoại Mãn Châu, Sakhalin, quần đảo Kuril, Singapore và Bhutan."

# The People's Internationale
 KMT_revolutionary_diplomacy: "Ngoại giao cách mạng"
 KMT_revolutionary_diplomacy_desc: "Chỉ Trung Quốc và nhân dân Trung Quốc thích hợp tiến hành cách mạng Đông Á. Hoàn cảnh đặc biệt, vị thế ngọn đuốc văn hóa chính trị trong vùng và cách mạng thành công là lý do để theo đường ngoại giao mới. Ngoại giao cách mạng sẽ thúc đẩy hợp tác với nhân dân châu Á, hướng tới chủ nghĩa Liên Á xã hội chủ nghĩa lớn mạnh hơn."

 KMT_establish_peoples_livelihood_countries: "Thành lập các quốc gia Dân sinh"
 KMT_establish_peoples_livelihood_countries_desc: "Trung Quốc là thị trường quan trọng nhất phương Đông, nên tài nguyên bị nhòm ngó thời đế quốc. Vừa giành độc lập quốc gia, Trung Quốc có nghĩa vụ giúp các dân tộc thuộc địa đang đấu tranh cho tự do kinh tế lập các quốc gia \"Dân sinh\", không thành nước công đoàn chủ nghĩa hay tư bản mà hợp tác với Trung Quốc xây Dân sinh tại quê hương."

 KMT_uniting_anticolonial_minds: "Đoàn kết trí thức chống thực dân"
 KMT_uniting_anticolonial_minds_desc: "Khắp châu Á và Thái Bình Dương, biết bao người kêu gọi tự do, giấc mơ bị đế quốc cùng tay sai đè bẹp. Tác phẩm bị kiểm duyệt, tư tưởng bị giam cầm, họ mòn mỏi lưu vong hay trong lớp học bụi bặm. Nếu tập hợp dưới ánh sáng giải phóng, những trí tuệ ấy có thể soi tương lai mới cho mọi dân tộc thoát xiềng xích các đế quốc suy tàn."

 KMT_the_inevitable_demise_of_capitalism: "Sự diệt vong tất yếu của chủ nghĩa tư bản"
 KMT_the_inevitable_demise_of_capitalism_desc: "Không nhà nước nào tà ác hơn Đế quốc Đức. Đức từ lâu áp bức các dân tộc Đông Âu, những người khao khát tự do, độc lập khỏi thể chế Mitteleuropa đáng khinh. Ta không quên Đức can thiệp Bắc phạt và áp đặt quân phiệt tư bản ở nước mình. Nay Trung Quốc tái sinh, quyền lực không thể nghi ngờ, đã đến lúc hủy diệt gốc rễ mọi chủ nghĩa tư bản."

# New Asia Alliance
 KMT_promoting_pan_asian_solidarity: "Thúc đẩy đoàn kết Liên Á"
 KMT_promoting_pan_asian_solidarity_desc: "Đoàn kết mọi dân tộc châu Á tự do để chấm dứt đế quốc châu Âu là nghĩa vụ của ta. Khác Nhật xây chủ nghĩa Liên Á bằng cướp bóc và \"tàn sát phân biệt chủng tộc đê hèn\" của đế quốc phương Tây, chủ nghĩa Liên Á Trung Quốc dựa trên \"Vương đạo\", chăm sóc nhân từ người yếu thế. Ta sẽ tự xây mạnh trước rồi dùng sức nâng đỡ \"em nhỏ\" châu Á."

 KMT_build_a_first_rate_army: "Xây quân đội hàng đầu"
 KMT_build_a_first_rate_army_desc: "Nguy cơ Nhật tái vũ trang và bành trướng rất đáng lo. Để ngăn xâm lược từ Nhật hay cường quốc khác, ta phải xây quân đội mạnh vượt trội cả số lượng, chất lượng, huấn luyện, tinh thần. Việc này tiến hành trong năm năm tới; nếu làm đúng, ta sẽ thành cường quốc dù không quân, hải quân có thể không vượt Nhật, Nga hay Đức."

 KMT_post_colonial_cultural_exchange: "Giao lưu văn hóa hậu thuộc địa"
 KMT_post_colonial_cultural_exchange_desc: "Thực dân cướp cả của cải lẫn bản sắc quốc gia. Khác người Marxist và chủ nghĩa quốc tế, Tân Á Xã cùng người kế thừa bác bỏ chủ nghĩa duy vật ảm đạm của cả xã hội chủ nghĩa lẫn tư bản, thay bằng đoàn kết trí thức châu Á, chia sẻ văn hóa. Nhờ vậy khi giải phóng, các dân tộc có điều để mong chờ ngoài việc bị lạnh lùng hy sinh trong cách mạng toàn cầu của Paris."

 KMT_balance_the_great_powers: "Cân bằng các cường quốc"
 KMT_balance_the_great_powers_desc: "Thực dụng là thiết yếu trong thế giới mới. Đồng minh hôm qua có thể là kẻ thù ngày mai; kẻ thù cay đắng hôm qua có thể thành đồng minh cơ hội ngay lúc này. Cường quốc từng lần lượt tàn phá lục địa và sẵn sàng hợp tác để làm vậy. Ta cũng phải sẵn sàng liên kết kiềm chế bành trướng ngoại bang cùng mọi đe dọa hòa bình khu vực."

# Events
 china_events.800.t: "Cứu nước bằng nghệ thuật"
 china_events.800.d: "Cơ quan tuyên truyền đảng phần lớn do nhà tư tưởng cách mạng, cán bộ hay sĩ quan tình báo lãnh đạo, nhưng trường hợp trí thức, nghệ sĩ tham gia tuyên truyền Quốc dân đảng đáng chú ý nhất là Lương Đỉnh Minh. Sinh tại Thượng Hải năm 1898, ông vào Trường Trắc địa và Bản đồ Nam Dương năm 1915, học phối cảnh cùng hội họa tại Học viện Mỹ thuật Thượng Hải. Khi bán chân dung ở Hạ Môn, ông giành giải nhì cuộc thi tranh lịch của công ty địa phương, rồi vào bộ phận quảng cáo Công ty Thuốc lá Anh-Mỹ Thượng Hải. Anh cả Lương Địch Trung sang Pháp học mỹ thuật, gửi tập tranh về để ba em, gồm Đỉnh Minh, học hỏi.\n\nNghỉ việc năm 1925, Lương đến Quảng Đông bắt đầu sự nghiệp cách mạng, thành tổng biên tập Họa báo Cách mạng năm 1926. Cùng năm, ông mở xưởng mỹ thuật hương Tuệ Thạch tại Đại Thạch Đầu, hoàn thành tranh Sa Cơ đẫm máu và ghi lại đấu tranh người lính bằng tranh chiến tranh khổ lớn. Từ 1926, ông làm trung tá trưởng ban mỹ thuật Chính trị bộ Tổng hành dinh Quốc dân Cách mệnh quân, Bát Lộ quân và Tổng cục Chiến tranh Chính trị.\n\nTheo lệnh Ủy ban Chấp hành Trung ương ở Moskva, Lương đến Nga, Bỉ, Đức, Áo học mỹ thuật, trở về năm 1930 lập Nhà Tưởng niệm Quốc dân Cách mệnh quân ở Quý Châu cùng xưởng tranh lịch sử. Năm 1934 ông làm giáo quan chính trị Ban Huấn luyện Chính trị Quý Châu; năm 1937 thành viện trưởng Học viện Mỹ thuật. Khi Quốc dân đảng cánh hữu thống nhất đất nước, nhiều tác phẩm của Lương được chú ý trở lại vì vai trò nâng tinh thần dân thường và binh sĩ."
 china_events.800.a: "Một bậc thầy thời hiện đại!"

 china_events.801.t: "Độc Nhãn Long"
 china_events.801.d: "Cách mạng Quốc dân cuối cùng lại tiến lên sau một thập kỷ bị Trực Lệ phản động đàn áp; Trùng Khánh, trái tim Tứ Xuyên, đã được lực lượng Bạch Nhật giải phóng. Thời loạn sinh nhiều anh hùng Tứ Xuyên: Chu Đức, nhà chiến lược lớn từ Trường Quân sự Côn Minh từng chống quân chủ Bắc Dương Hồng Hiến bạo ngược; và Đặng Tiểu Bình bí ẩn, nhà cách mạng thổi lửa Tây Bắc, đều quê đất Thục.\n\nTứ Xuyên còn có anh hùng Lưu Bá Thừa. Sinh trong gia đình nông dân gần Trùng Khánh, Lưu tham gia đấu tranh chống Viên Thế Khải. Những năm sau, ông đánh bại nhiều đối thủ, gồm cả Chu Đức khi còn là sĩ quan quân phiệt trong một chiến dịch Vân Nam tại Tứ Xuyên.\n\nTrong một cuộc chiến, Lưu mất mắt phải nhưng được biệt danh \"Độc Nhãn Long\", minh chứng tài quân sự và ý chí sắt đá. Ông rất đồng tình với Quốc dân trong Bắc phạt; tiếc thay Trực Lệ không chỉ đẩy lùi cách mạng, Quảng Châu cũng rơi vào hỗn loạn.\n\nBị cắt khỏi cách mạng, Lưu vẫn đấu tranh lâu dài với quân phiệt cơ hội Tứ Xuyên, dẫn nhóm nhỏ chiến sĩ giải phóng nông dân. Nay Tứ Xuyên thuộc Quốc dân đảng, ông ra khỏi nơi ẩn náu, nguyện phục vụ đảng. Dù rõ ràng thuộc cánh tả, Lưu khó tham gia tranh chấp phe phái lớn, nhưng có thể phàn nàn khi Ủy ban Chấp hành Trung ương can thiệp quá sâu quân sự."
 china_events.801.a: "Cách mạng chào đón anh hùng như ông!"
 china_events.801.b: "Kẻ gây rối nổi tiếng; không thể dung thứ thái độ phá hoại ấy."

 china_events.802.t: "Ngọn lửa trong Tứ Xuyên mới"
 china_events.802.d: "Cách mạng Quốc dân được hồi sinh nhờ hành động anh hùng của chính quyền quân sự Quý Châu; lực lượng Quốc dân đảng chiến thắng trên phố Thành Đô, đuổi Trực Lệ đáng ghê tởm sau một thập kỷ bóc lột, cho vay nặng lãi. Tứ Xuyên, trái tim cách mạng từ lâu, cuối cùng sẽ có hòa bình, thịnh vượng dưới sự dẫn dắt của đảng. Lữ Siêu hiểu hơn mọi người con Tứ Xuyên về máu đã đổ để giành một Tứ Xuyên tự do.\n\nLà cựu binh từng làm việc với Trần Kỳ Mỹ, Lý Thạch Tăng và Uông Tinh Vệ thời Tân Hợi, Lữ chống Bắc Dương từ Cách mạng lần hai. Ông cùng Hùng Khắc Vũ anh dũng tham gia chiến tranh Hộ quốc chống mộng xưng đế của Viên Thế Khải. Khi Hùng lộ là kẻ cơ hội địa phương thân liên bang, Lữ tự giành Tứ Xuyên cho Tôn Trung Sơn và cách mạng, nhưng không phá được phản động đất Thục nên chạy về với Tôn.\n\nLữ trở lại Tứ Xuyên thời Bắc phạt để lật Dương Sâm, dũng cảm ở lại ngay khi những kẻ ăn bám trong Ủy ban Chấp hành Trung ương Uông Tinh Vệ chạy sang Pháp. Kiên quyết chống Dương suốt thập kỷ, Lữ bền bỉ làm thành trì chống áp bức quân phiệt. Nay Tứ Xuyên thuộc Quốc dân đảng, ông ra khỏi nơi ẩn náu và nguyện phục vụ. Dù rõ ràng thuộc cánh hữu, thiên hướng phe phái cụ thể vẫn mơ hồ; có tin ông liên lạc với Lý Tông Nhân từ những ngày đầu quân đội lưu vong tại chính quyền quân sự Quý Châu."
 china_events.802.a: "Lời tán dương của Quốc phụ có thể dời núi!"
 china_events.802.b: "Lý đã đủ bạn rồi. Cảm ơn, người tiếp theo."
