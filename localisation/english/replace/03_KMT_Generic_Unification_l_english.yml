 RKT_low_zeal_mechanic_warning_tt: "§RChủ nghĩa hiện thực cách mạng đang trỗi dậy trong Quốc dân đảng, đại diện cho chủ nghĩa dân tộc cuồng tín, sự tàn nhẫn cách mạng và tình đồng đội quân ngũ. Điều này chủ yếu có lợi cho phe quân sự của đảng, dù ngay cả các phe quân sự cũng cần chút nhiệt huyết để duy trì đà cách mạng. Tuy nhiên, càng phát triển thì càng khó ngăn chặn; nếu lên quá cao, chúng ta sẽ chẳng khác gì quân phiệt.§!"

 RKT_high_zeal_mechanic_warning_tt: "§GChủ nghĩa lý tưởng cách mạng đang trỗi dậy trong Quốc dân đảng, đại diện cho lòng yêu nước nhiệt thành, tinh thần cách mạng và tình đồng chí trong đảng. Điều này chủ yếu có lợi cho phe dân sự, dù mọi phe đều cần chút nhiệt huyết để duy trì động lực của đảng. Tuy nhiên, càng phát triển thì càng khó kiểm soát, nhất là khi cấp dưới bắt đầu chống lại hệ thống cấp bậc trong đảng.§!"

