#Ideas
 KR_RKMT_popular_support_loc: "Vì chúng ta không phải Ủy ban Trung ương Quốc dân đảng đã chạy ra nước ngoài và được quốc tế công nhận, người dân Trung Quốc và thế giới không xem chúng ta là Quốc dân đảng chính thống. Chúng ta phải nỗ lực củng cố hình ảnh quốc gia và tính chính danh của mình với tư cách người kế thừa thực sự cuộc cách mạng của Tôn tiên sinh."
