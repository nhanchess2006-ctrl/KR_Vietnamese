 KR_minsheng_partnership_name_leader: "Lãnh đạo §H$KMT_minsheng_partnership_full_name$§!"
 KR_minsheng_partnership_name: "Thành viên §H$KMT_minsheng_partnership_full_name$§!"

 KR_minsheng_partnership_desc_CHI: "Sứ mệnh Cách mạng Quốc dân là đưa Trung Quốc, quốc gia thấm nhuần tinh thần dân tộc mạnh mẽ, vào vị trí thuận lợi nhất phương Đông để chống đế quốc. Kinh tế và lịch sử các dân tộc bị áp bức phương Đông giống Trung Quốc. Họ không nên phát triển thành quốc gia tư bản hay thuần công đoàn chủ nghĩa, mà nên noi mô hình Trung Quốc, lập \"các quốc gia Dân sinh\" thông qua §H$KMT_minsheng_partnership_full_name$§!.\n\nVì vậy, thắng lợi cách mạng buộc Trung Quốc mở kỷ nguyên mới cho nhân dân phương Đông, truyền cảm hứng lập liên minh chống đế quốc vững mạnh. Là trung tâm phong trào, Trung Quốc nên đoàn kết nhân dân phương Đông, lập cộng đồng dân tộc và kinh tế Đông Á rộng lớn. Khi tái lập bá quyền tại châu Á-Thái Bình Dương, Trung Quốc trở thành trung tâm trật tự kinh tế phương Đông mới và hưởng nhiều lợi ích từ đó."

 KR_minsheng_partnership_desc: "Sứ mệnh Cách mạng Quốc dân là đưa Trung Quốc, quốc gia thấm nhuần tinh thần dân tộc mạnh mẽ, vào vị trí thuận lợi nhất phương Đông để chống đế quốc. Kinh tế và lịch sử các dân tộc bị áp bức phương Đông giống Trung Quốc. Họ không nên phát triển thành quốc gia tư bản hay thuần công đoàn chủ nghĩa, mà nên noi mô hình Trung Quốc, lập \"các quốc gia Dân sinh Nhân dân\" thông qua §H$KMT_minsheng_partnership_full_name$§!.\n\nLà thành viên trật tự kinh tế phương Đông mới, khi rồng Trung Hoa tái lập bá quyền tại châu Á-Thái Bình Dương, kinh tế ta hưởng một số lợi ích nhờ tăng thương mại, đầu tư và phát triển khu vực. Tuy nhiên, ai cũng nhận thấy cơ chế chủ yếu có lợi cho Trung Quốc: hàng xuất khẩu các thuộc địa mới giải phóng chuyển từ mẫu quốc cũ sang Quảng Châu và Thượng Hải. Chúng ta chỉ có thể hy vọng những người \"giải phóng\" đồng ý một thỏa thuận công bằng hơn trong tương lai; hiện họ tự cho quyền hưởng phần thưởng với tư cách \"người thầy\" trong thời kỳ huấn chính của ta."

 KR_minsheng_partnership_effects_CHI: "Hiệu suất khai thác tài nguyên: [?KMT_minsheng_local_resources_var|+=%]\n$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: [?KMT_minsheng_construction_var|+=%]\n$MODIFIER_CONSUMER_GOODS_FACTOR$: [?KMT_minsheng_consumer_goods_var|Y%]\nHệ số quan hệ trong thỏa thuận thương mại: [?KMT_minsheng_trade_opinion_var|Y%]\n$MODIFIER_RESEARCH_SPEED_FACTOR$: [?KMT_minsheng_research_speed_var|+=%]"
