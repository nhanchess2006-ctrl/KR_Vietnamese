#Zeal Events
 RKT.zealmechanic.001.t: "Tam Dân bị sửa đổi tại [FROM.GetNameDef]!"
 RKT.zealmechanic.001.d: "Các tác phẩm về kiến quốc của Tôn Trung Sơn, đặc biệt bài giảng Tam Dân và ba giai đoạn cách mạng, luôn là trung tâm tư tưởng Quốc dân đảng. Gần như kinh thánh với đảng viên trung thành, mọi lệch lạc khỏi chính thống đều bị nghi ngờ, còn cố tình bóp méo để tư lợi bị khinh miệt sâu sắc.\n\nThế nhưng quan chức [FROM.GetNameDef] dường như đang làm đúng điều ấy, xuyên tạc lời Tổng lý vĩnh viễn dưới danh nghĩa \"dung hòa\" với chính sách [FROM.GetAdjective] hiện có. Khi bị chất vấn, [FROM.GetLeader] khăng khăng đó là nhu cầu thực tế và truyền thống chính trị [FROM.GetAdjective] đòi hỏi sửa đổi Tam Dân phần nào để tiếp nhận.\n\nLời viện dẫn lợi ích chung dường như che giấu sự thiếu niềm tin vào tầm nhìn Quốc dân đảng, có lẽ cả sự bất trung với [ROOT.GetLeader]. Dù vậy, việc đã rồi, sửa sai chính quyền tỉnh sẽ không rẻ. Nhưng đôi khi phải trả giá đắt để giữ tư tưởng người sáng lập đảng trong sạch."
 RKT.zealmechanic.001.a: "Phải thực thi đường lối chính thống của đảng!"
 RKT.zealmechanic.001.b: "Linh hoạt một chút cũng chẳng hại gì..."

 RKT.zealmechanic.002.t: "Sự trung thành của [FROM.GetAdjective] với Tam Dân"
 RKT.zealmechanic.002.d: "Chủ nghĩa Tam Dân của Tôn tiên sinh luôn sâu sắc, đi thẳng vào các thách thức Trung Quốc đối mặt. Lời lẽ ấy có sức nặng cả ở nơi quyền lực trung ương chưa vươn tới. Dù xa [ROOT.Capital.GetCapitalVictoryPointName], chính quyền [FROM.GetNameDef] đã chăm chỉ thu hẹp khoảng cách bằng cách \"đảng hóa\" bộ máy.\n\nViệc gần đây tuân thủ chỉ thị trung ương và loại bỏ tư tưởng cạnh tranh với học thuyết đảng làm [ROOT.GetLeader] cùng cộng sự hài lòng, báo hiệu [FROM.GetAdjective] ngày càng phục tùng. Không nên diễn giải quá mức; trên thực tế họ vẫn ngoan cố giữ tự chủ hành chính.\n\nTuy vậy, cách tận dụng xu hướng này vẫn chưa được quyết định. Dù [FROM.GetLeader] có lẽ muốn nâng tinh thần đảng, ta cũng có thể dùng cơ hội kéo ông gần mình hơn."
 RKT.zealmechanic.002.a: "Cơ hội đưa họ vào hàng ngũ."
 RKT.zealmechanic.002.b: "Tấm gương cho mọi người trung thành!"

 RKT.zealmechanic.003.t: "Địa phương bất tuân tại [FROM.GetNameDef]!"
 RKT.zealmechanic.003.d: "Việc [FROM.GetLeader] được cho là quy phục trung ương không ngăn họ khăng khăng giữ đặc quyền địa phương. Dù đồng ý để họ tự quyết phần nào khi huấn chính trong tỉnh, thỏa thuận ngầm cho phép quan chức [ROOT.GetAdjective] giám sát công việc địa phương.\n\nNhưng nỗ lực thực thi quyền hạn chính đáng chỉ gặp phá hoại và nghi kỵ từ quan chức [FROM.GetAdjective]. Ngày càng rõ đây là hành động cố ý của [FROM.GetLeader] nhằm ngăn quá trình đưa [FROM.GetNameDef] vào quyền cai trị của ta.\n\nỞ bất cứ nước nào khác, sự xấc xược ấy không thể dung thứ; nhưng giữa khủng hoảng, lựa chọn không dễ. Cưỡng chế sẽ gây bất ổn thỏa thuận chính trị khi đoàn kết hiếm hoi. Tuy nhiên, bất trung lại sinh bất trung; dung túng địa phương chủ nghĩa sẽ khiến người ta nghi ngờ khả năng kiểm soát quân phiệt của ta."
 RKT.zealmechanic.003.a: "Phải bắt họ phục tùng."
 RKT.zealmechanic.003.b: "Cuối cùng tất cả sẽ quy phục."

 RKT.zealmechanic.004.t: "[FROM.GetAdjective] ủng hộ sự nghiệp quốc gia!"
 RKT.zealmechanic.004.d: "Trung thành với sự nghiệp quốc gia đi kèm trách nhiệm đạo đức. Cách mạng xây bằng tình yêu và hy sinh; cũng như binh sĩ, liệt sĩ hiến mạng vì đất nước, các tỉnh phải đóng góp của cải, sức lực, tài nguyên vì lợi ích chung.\n\n[FROM.GetLeader] dường như hiểu rất rõ bài học này, thể hiện qua lượng đóng góp từ [FROM.GetNameDef] cho trung ương tăng lên, dù có lẽ tạm thời. Một trường hợp vị tha hiếm có thời quân phiệt; niềm tin vào lãnh đạo ta là diễn biến đáng mừng.\n\nDù vậy, người trao niềm tin cũng mong được đáp lại. Thực tế đáng buồn là lãnh đạo phải sẵn sàng quyết định khó khăn. Ta có thể dùng nguồn lực này củng cố vị thế, ổn định cai trị dù tổn hại cách mạng chung; hoặc dùng nguồn thu tăng để hỗ trợ mọi mặt trận, tăng nhiệt tình với chương trình quốc gia của Quốc dân đảng."
 RKT.zealmechanic.004.a: "Thực tế là [ROOT.Capital.GetCapitalVictoryPointName] phải được ưu tiên."
 RKT.zealmechanic.004.b: "Sự anh hùng của họ giúp mọi người yêu nước."

 RKT.zealmechanic.005.t: "Tính chính danh của đảng bị chiếm dụng tại [FROM.GetNameDef]!"
 RKT.zealmechanic.005.d: "Uy tín Quốc dân đảng vẫn bền bỉ qua nhiều năm và nhiều thất bại nặng nề. Thông điệp Tôn tiên sinh thực sự chạm tới lòng dân, mang hy vọng giữa loạn lạc. Nhưng với nhiều quân phiệt, chân lý ấy dễ bị bóp méo thành bất cứ điều gì phục vụ tư lợi, một sự xuyên tạc cố ý và tàn nhẫn đối với lời hiệu triệu giải phóng.\n\nMọi quân phiệt đều làm ít nhiều, nhưng gần đây [FROM.GetLeader] và phe cánh đặc biệt trơ trẽn, khoác hình thức Quốc dân đảng lên quyền cai trị và tự nhận ngang hàng trong việc kế thừa đảng.\n\nSự đánh cắp tính chính danh đầy vụ lợi này khiến những người lý tưởng cay đắng, kéo theo chỉ trích toàn bộ cách mạng. Trấn an họ về lòng trung thành của ta và bắt [FROM.GetLeader] phục tùng sẽ không dễ, nhưng có lẽ cần thiết để tránh nhiệt tình suy giảm rộng hơn."
 RKT.zealmechanic.005.a: "Phải bảo đảm với nhân dân rằng ta tốt hơn chúng."
 RKT.zealmechanic.005.b: "Nhân dân sẽ tự nhìn thấu trò bịp của chúng."

 RKT.zealmechanic.006.t: "Những người yêu nước [FROM.GetAdjective] tập hợp!"
 RKT.zealmechanic.006.d: "Quốc dân đảng vượt qua bao thử thách suốt nhiều thập kỷ bởi dù đối thủ có bao nhiêu súng hay ngoại bang đổ bao nhiêu vàng, lời giải phóng vẫn thực sự chinh phục lòng dân.\n\nTuy nhiên, giữa quân phiệt và chia rẽ luôn có kẻ đặt tư lợi trên nhu cầu quốc gia. Vì vậy hiếm khi thấy chính quyền địa phương ưu tiên ta hơn họ, thực thi quyền đảng quốc chống phản động, dập tắt bất đồng từ những người thích sự tham nhũng của trật tự cũ.\n\nHành động này mang lại nhiều lời khen cho [FROM.GetLeader], giúp ta huy động nhiều người chiến đấu. Câu hỏi giờ là hướng làn sóng đấu tranh ấy vào kẻ thù bên trong hay bên ngoài."
 RKT.zealmechanic.006.a: "Quân phiệt và phản động run rẩy trước chúng ta!"
 RKT.zealmechanic.006.b: "Đế quốc ngoại bang sẽ sợ cơn thịnh nộ của ta!"
###Focus
 KMT_white_sun: "Bạch Nhật trên Trung Hoa"
 KMT_white_sun_desc: "Dù gian nan, cuối cùng chúng ta đã củng cố quyền cai trị cả nước và có thể chính thức thành lập nền cộng hòa mới dưới Bạch Nhật. Nay phải đặt nền móng cho giai đoạn cách mạng tiếp theo, hợp nhất mọi tỉnh vào các cơ quan chính quyền."

 KMT_tridemism: "Học thuyết Tam Dân"
 KMT_tridemism_desc: "Chủ nghĩa Tam Dân là nền tảng triết lý chính trị Tôn Trung Sơn và Quốc dân đảng. Ba nguyên tắc dẫn dắt chính sách, quyết định của chính phủ; nhân dân phải hiểu tầm quan trọng của chúng trong cuộc đấu tranh sắp tới."

 KMT_organic_law: "Luật Tổ chức của nền Cộng hòa"
 KMT_organic_law_desc: "Trong khi huấn chính tiếp tục và hiến pháp cuối cùng đang soạn thảo, Luật Tổ chức Chính phủ Quốc dân đã được ban hành. Luật tổ chức lại chính phủ thành năm viện và củng cố việc Quốc dân đảng thực thi chủ quyền trong thời kỳ huấn chính."

 KMT_minzu_focus: "Dân tộc"
 KMT_minzu_focus_desc: "Dân tộc là một trong ba nguyên tắc của Tôn Trung Sơn, xoay quanh đời sống, ngôn ngữ, tôn giáo, phong tục chung và quan trọng nhất là chung huyết thống. Đoàn kết quốc gia là tối quan trọng để thành công, giúp Trung Quốc thắng các nước khác trong cuộc tranh giành ưu thế."

 KMT_minquan_focus: "Dân quyền"
 KMT_minquan_focus_desc: "Dân quyền, hay dân chủ, là nguyên tắc thứ hai của Tôn Trung Sơn. Xây dựng thể chế dân chủ và chuẩn bị cho nhân dân sử dụng là mục tiêu quan trọng hàng đầu của Cách mạng Quốc dân; về lâu dài sẽ chứng minh đảng là lựa chọn tốt nhất cho Trung Quốc."

 KMT_legislature: "Viện Lập pháp"
 KMT_legislature_desc: "Dù Trung Quốc chưa sẵn sàng bầu cử đầy đủ, Chính phủ Quốc dân cần bắt đầu lập các thể chế mà một ngày dân chủ sẽ dùng để thể hiện ý chí. Viện Lập pháp, gồm đại diện Quốc dân đảng từ cả vùng kiểm soát và tranh chấp, sẽ tiếp nhận trách nhiệm lập pháp từ Ủy ban Trung ương."

 KMT_land_reform: "Cải cách ruộng đất Quốc dân"
 KMT_land_reform_desc: "Nông dân chiếm đại đa số dân số nhưng ít người sở hữu đất mình cày, khiến cơ hội tiến bộ kinh tế-xã hội bị dập tắt. Cải cách ruộng đất là cần thiết để cải thiện sinh kế, giảm căng thẳng xã hội. Chừng nào nông dân còn thuê đất của địa chủ tham nhũng thay vì sở hữu, họ chưa thể tự do."

 KMT_rent_control: "Thuế giá trị đất"
 KMT_rent_control_desc: "Tôn Trung Sơn thúc đẩy áp dụng thuế giá trị đất để cải thiện tài chính quốc gia, hỗ trợ cải cách ruộng đất và tạo hệ thống kinh tế, thuế công bằng hơn. Chúng ta phải thực hiện tầm nhìn ấy để hiện đại hóa đất nước và cải thiện kinh tế."

 KMT_minsheng: "Dân sinh"
 KMT_minsheng_desc: "Dân sinh, thường hiểu là phúc lợi nhân dân, là nguyên tắc cuối cùng của Tôn Trung Sơn. Sau khi áp dụng thuế giá trị đất, các chương trình xã hội sẽ được lập và mở rộng, giúp công nông nâng chất lượng sống thông qua trợ cấp thực phẩm, quần áo và nhà ở."

 KMT_revive_china: "Chương trình Chấn hưng Trung Hoa"
 KMT_revive_china_desc: "Không có Quốc dân đảng sẽ không có Trung Quốc mới. Cần chương trình quy hoạch và sáng kiến nhà nước sâu rộng để đưa Trung Quốc ngang tầm phương Tây và cứu nền kinh tế bị tàn phá."

 KMT_national_mausoleum: "Xây Quốc lăng"
 KMT_national_mausoleum_desc: "Đã quá muộn để tôn vinh những người hy sinh vì nền dân chủ Trung Quốc. Một quốc lăng sẽ được xây ngoài [Root.Capital.GetCapitalVictoryPointName] để an táng Tôn Trung Sơn và các nhà cách mạng nổi bật khác."

 KMT_civil_service: "Mở rộng nền công vụ"
 KMT_civil_service_desc: "Để bền vững lâu dài, Chính phủ Quốc dân phải vượt lên trên một phe quân phiệt hay đảng quốc. Cần bắt đầu xây dựng nền công vụ độc lập với cả bộ máy Quốc dân đảng lẫn quân đội."

 KMT_academia_sinica: "Viện Nghiên cứu Trung ương"
 KMT_academia_sinica_desc: "Để thúc đẩy năng lực khoa học nội địa, Quốc dân đảng phải cam kết thành lập và tài trợ các cơ sở nghiên cứu học thuật riêng. Viện Nghiên cứu Trung ương, được đề xuất từ lâu nhưng chưa thực hiện, sẽ là trung tâm nỗ lực này khi thành lập đầy đủ."

 KMT_national_reconstruction_commission: "Ủy ban Kiến thiết Quốc gia"
 KMT_national_reconstruction_commission_desc: "Lấy cảm hứng từ đề xuất của Trương Tĩnh Giang, Chính phủ Quốc dân nên lập Ủy ban Kiến thiết Quốc gia do trung ương chỉ đạo, quy hoạch chương trình đầu tư vốn và tiêu chuẩn hóa toàn quốc. Chương trình gồm nhiều nỗ lực có quy mô phát triển độc lập, tập trung quanh các trung tâm dân cư lớn."

 KMT_bopomofo: "B, P, M, F..."
 KMT_bopomofo_desc: "Cách Latinh hóa tiếng Quan thoại và cả cách dạy chữ Hán hiện tại rất bất cập với trẻ em và người bình thường. Cần lập chuẩn ký âm mới tương tự bảng Hiragana Nhật Bản, phổ biến khắp hệ thống giáo dục để chuẩn hóa phương ngữ Trung Quốc và mở rộng giao lưu với phương Tây."

 KMT_triumphant_revolution: "Cách mạng toàn thắng"
 KMT_triumphant_revolution_desc: "Trung Quốc cuối cùng thống nhất dưới Thanh Thiên, Bạch Nhật, Mãn Địa Hồng của Quốc dân đảng. Dù còn xa mới hồi phục sau Thế kỷ Quốc nhục, chúng ta đã thực hiện giấc mơ của cố Tôn tiên sinh."

 KMT_renovate_whampoa: "Mở rộng Trường Quân sự Hoàng Phố"
 KMT_renovate_whampoa_desc: "Trường Quân sự Quốc dân đảng do Tôn Trung Sơn lập năm 1924 tại Hoàng Phố gần Quảng Châu, đào tạo đội ngũ sĩ quan có ý thức chính trị. Trước đây chỉ khôi phục là đủ, nhưng biến Quốc dân Cách mệnh quân thành quân đội quốc gia thực sự đòi hỏi mở rộng Hoàng Phố để cung cấp sĩ quan vừa có năng lực vừa đáng tin chính trị."

 KMT_central_military_academy: "Thành lập Trường Quân sự Trung ương"
 KMT_central_military_academy_desc: "Cách mạng đã nắm vững Trung Quốc, không cần giữ Hoàng Phố tại Quảng Châu nữa. Trường danh tiếng sẽ chuyển đến thủ đô để tạo học viện quân sự tập trung, hỗ trợ cơ cấu chỉ huy trung ương và khuyến khích tân binh khắp nước học từ các sĩ quan giỏi nhất."

 KMT_standardised_arsenals: "Tiêu chuẩn hóa xưởng quân giới"
 KMT_standardised_arsenals_desc: "Suốt nhiều thập kỷ, xưởng quân giới Trung Quốc nằm dưới các chính quyền tỉnh và trung ương khác nhau, phần lớn độc lập. Nay nhiều xưởng thuộc quyền ta, vấn đề hậu cần do mỗi xưởng sản xuất vũ khí, cỡ đạn khác nhau cho cùng một quân đội rất nghiêm trọng và cần sớm khắc phục."

 KMT_small_arms_development: "Phát triển vũ khí bộ binh"
 KMT_small_arms_development_desc: "Dù nhiều chính quyền trung ương và tỉnh cố nâng cấp, súng trường phổ biến nhất vẫn là Mẫu 88 lâu đời, rất lạc hậu. Biến tiêu chuẩn hóa bằng súng trường hiện đại mới thành thực tế thay vì kế hoạch giấy là ưu tiên hàng đầu để cải thiện năng lực quân sự yếu kém so với quân đội hiện đại."

 KMT_artillery_modernisation: "Hiện đại hóa pháo binh"
 KMT_artillery_modernisation_desc: "Pháo binh là vua chiến trường; pháo hiện đại từng là xa xỉ thời quân phiệt. Với khả năng của Trung Quốc thống nhất, chúng ta có thể hiện đại hóa pháo và đưa hỏa lực gần chuẩn thế giới hơn."

 KMT_tank_arsenal: "Chiến tranh thiết giáp"
 KMT_tank_arsenal_desc: "Trung Quốc đã chú ý sự phát triển chiến tranh thiết giáp, nhưng phát triển và sử dụng nó trong nước từng chỉ là giấc mơ. Nay thống nhất, mạnh hơn bao giờ hết, đã đến lúc nghiên cứu công nghệ tiên tiến này như bước đệm quan trọng của hiện đại hóa."

 KMT_new_model_army: "Quân đội kiểu mới"
 KMT_new_model_army_desc: "Quân đội tình nguyện chuyên nghiệp sẽ là tương lai quân đội Trung Quốc: quy mô nhỏ hơn, tận tụy với Tam Dân và Cách mạng Quốc dân, coi trọng chất lượng hơn số lượng. Điều này tạo tinh thần đồng đội và kỷ luật cao hơn, đào tạo binh sĩ giỏi có thể hoàn thành nhiệm vụ khó và chấp hành mệnh lệnh khó khăn."

 KMT_professionalisation: "Rèn kỷ luật quân đội"
 KMT_professionalisation_desc: "Quân đội mới sẽ chuyên nghiệp, tập trung toàn thời gian huấn luyện, đề cao kỷ luật và kỹ năng. Tấm gương Thiết quân sẽ thành hình mẫu quân đội chuyên nghiệp hiện đại, sánh với bất kỳ cường quốc phương Tây nào."

 KMT_peoples_army: "Quân đội Nhân dân"
 KMT_peoples_army_desc: "Quân đội Trung Quốc nên tận dụng nhân lực và quy mô để chiến đấu. Đó phải là quân đội nhân dân, đại diện và bảo vệ nhân dân, trụ cột thống nhất quốc gia thay vì áp bức, đàn áp."

 KMT_conscription: "Đoàn kết qua quân ngũ"
 KMT_conscription_desc: "Nghĩa vụ quân sự rộng rãi đưa người nhiều vùng lại với nhau, cho trải nghiệm chung và giúp họ coi nhau như anh em: minh chứng cụ thể, chân thực về tình đồng bào thay vì khái niệm quốc gia mơ hồ. Đoàn kết quốc gia sẽ được củng cố."

 KMT_NRA: "Quốc dân Cách mệnh quân hồi sinh"
 KMT_NRA_desc: "Dù quân đội gặp nhiều vấn đề sau thống nhất, chúng ta đã cải cách thành công để hiện đại hóa và trang bị cho xung đột tương lai. Mỗi ngày có tân binh háo hức chờ được cựu binh dạn dày huấn luyện. Là quân đội chân chính của nền Cộng hòa Trung Hoa, lực lượng vũ trang sẽ chứng minh thành công hiện đại hóa cho các thế hệ sau. Quốc dân Cách mệnh quân muôn năm, Trung Quốc Quốc dân đảng muôn năm!"

 KMT_aviation_school: "Chính quy hóa trường hàng không"
 KMT_aviation_school_desc: "Trung Quốc có trường phi công nhưng ít và khá vô tổ chức. Chính quy hóa trường học, lập giáo trình phù hợp cho phi công và đội bảo dưỡng sẽ giúp xây lực lượng không quân đúng nghĩa."

 KMT_new_aircraft_factories: "Các nhà máy máy bay mới"
 KMT_new_aircraft_factories_desc: "Miền Nam có một số xưởng máy bay nhỏ được lập trong một, hai thập kỷ qua, nhưng chỉ đủ sửa số ít máy bay hiện có. Xây nhà máy đúng nghĩa là bước tiếp theo để phát triển ngành hàng không non trẻ, một trụ cột của thời hiện đại."

 KMT_native_fighter_design: "Thiết kế tiêm kích nội địa"
 KMT_native_fighter_design_desc: "Đã có nhiều nỗ lực chế tạo máy bay Trung Quốc, chủ yếu dựa mẫu nước ngoài. Với chuyên gia ngoại quốc hỗ trợ và đội ngũ kỹ thuật trong nước tăng lên, ta nay có khả năng phát triển mẫu riêng hơn bao giờ hết, xây không quân hiện đại bảo vệ bầu trời."

 KMT_naval_bomber: "Dự án máy bay ném bom hải quân"
 KMT_naval_bomber_desc: "Ban đầu bị xem nhẹ, máy bay mang ngư lôi và bom xuyên giáp nhanh chóng thành đe dọa nghiêm trọng với cả chiến hạm lớn nhất. Công nghệ này có thể đúng thứ Trung Quốc cần: cách tiết kiệm chi phí để tiêu diệt hạm đội địch lớn hơn nhiều đang đe dọa bờ biển."

 KMT_medium_bomber: "Phi đội ném bom chiến thuật"
 KMT_medium_bomber_desc: "Máy bay ném bom chiến thuật hạng trung mang lại tính linh hoạt cho không quân với khả năng làm nhiều nhiệm vụ. Tất nhiên, thiết kế máy bay lớn như vậy là điều chưa từng có với chúng ta và chắc chắn đầy thách thức."

 KMT_light_bomber: "Yểm trợ đường không cho lục quân"
 KMT_light_bomber_desc: "Máy bay ném bom nhẹ đóng vai trò pháo binh bay là cách tốt nhất để không quân hỗ trợ tác chiến mặt đất. Tập trung máy bay yểm trợ gần là hợp lý khi xây không quân hiện đại."

 KMT_expand_dockyard: "Mở rộng xưởng tàu Cộng hòa"
 KMT_expand_dockyard_desc: "Thống nhất quốc gia hoàn tất, tầm nhìn Tôn tiên sinh thành hiện thực, nay cần biến các lực lượng hải quân tỉnh non trẻ thành hải quân quốc gia mới. Hãy hồi sinh Hải quân Trung Hoa Dân quốc dưới cờ Bạch Nhật, khuyến khích xây xưởng tàu khắp bờ biển để đáp ứng nhu cầu tàu tăng lên."

 KMT_incorporate_beiyang_fleet: "Hợp nhất Hạm đội Bắc Dương"
 KMT_incorporate_beiyang_fleet_desc: "Sau chiến tranh thống nhất, một số đô đốc và sĩ quan hải quân giỏi nhất Trung Quốc lại thất nghiệp. Chúng ta sẽ ân xá hoàn toàn để họ huấn luyện, dẫn dắt thế hệ thủy thủ tiếp theo trên biển lớn trong hải quân cách mạng mới."

 KMT_destroyers: "Hải đội khu trục hiện đại"
 KMT_destroyers_desc: "Tàu khu trục là xương sống mọi hải quân hiện đại, nhất là lực lượng non trẻ như Trung Quốc. Chúng sẽ bảo vệ bờ biển, tuyến hàng hải và chiến hạm lớn trước tàu ngầm, tàu tấn công nhỏ."

 KMT_submarines: "Phát triển tàu ngầm"
 KMT_submarines_desc: "Tàu ngầm đang chứng minh vai trò không thể thiếu trong hải chiến hiện đại. Với hải quân hạn chế như ta, chúng có thể là cứu tinh, cho phép đánh đối thủ mạnh hơn nhiều bằng cách tập kích vận tải và quấy rối hạm đội lớn."

 KMT_cruisers: "Tàu tuần dương cho hạm đội"
 KMT_cruisers_desc: "Tàu tuần dương quan trọng cho trinh sát và hộ vệ; thực tế có thể là chiến hạm lớn nhất ta đủ khả năng đóng lúc này."

 KMT_coastal_defence: "Tập trung phòng thủ bờ biển"
 KMT_coastal_defence_desc: "Lập kế hoạch hạm đội lớn cạnh tranh cường quốc hải quân là điên rồ. Vì vậy, ta phải tập trung hải quân linh hoạt hơn, đủ bảo vệ bờ biển dài và lợi ích tại Thái Bình Dương."

 KMT_grand_fleet: "Đại hạm đội"
 KMT_grand_fleet_desc: "Muốn Trung Quốc được coi là cường quốc đúng vị thế, hải quân là không thể thiếu. Dù chắc chắn là kế hoạch rất dài hạn, hải quân hùng mạnh phải bắt đầu từ đâu đó, và phải bắt đầu ngay."

