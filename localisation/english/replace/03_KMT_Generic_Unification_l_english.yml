 GXC_rkmt_revolution: "Cách mạng Quốc dân Trung Quốc"
 GXC_rkmt_revolution_desc: "Như âm và dương, vũ trụ vận hành trong sự cân bằng và xã hội cũng phải được tổ chức như vậy. Từ người ăn xin khạc nhổ nơi góc phố đến người lính bộ binh Quốc dân Cách mệnh quân đầy kiêu hãnh, toàn thể Trung Quốc phải học con đường đúng đắn của trật tự để hiện thực hóa tư tưởng Dân sinh."

 GXC_rkmt_revolution2: "Cách mạng Quốc dân Trung Quốc"
 GXC_rkmt_revolution2_desc: "Như âm và dương, vũ trụ vận hành trong sự cân bằng và xã hội cũng phải được tổ chức như vậy. Từ người ăn xin khạc nhổ nơi góc phố đến người lính bộ binh Quốc dân Cách mệnh quân đầy kiêu hãnh, toàn thể Trung Quốc phải học con đường đúng đắn của trật tự để hiện thực hóa tư tưởng Dân sinh."

 GXC_rkmt_revolution3: "Phong trào Đời sống mới"
 GXC_rkmt_revolution3_desc: "Phải có sự phục tùng, hy sinh, nghiêm khắc, sạch sẽ, chính xác, nhanh nhẹn, siêng năng, bí mật... và tất cả phải kiên định, dũng cảm hy sinh mọi thứ vì tập thể và quốc gia. Chúng ta sẽ quân sự hóa triệt để đời sống công dân cả nước để họ rèn luyện lòng dũng cảm, sự nhanh nhẹn, sức chịu đựng gian khổ và tinh thần lao động cần cù."

 GXC_kmt_demobilisation: "Hội nghị Giải ngũ Toàn quốc"
 GXC_kmt_demobilisation_desc: "Cồng kềnh và tốn kém, Quốc dân Cách mệnh quân sau thống nhất dù đã mệt mỏi vì chiến trận vẫn cần được cải cách. Hãy giảm bớt tổn thất của quá trình thống nhất và thực sự biến lực lượng này thành quân đội của nền Cộng hòa Trung Hoa."

#Decisions
 RKT_zeal_decision_category: "Nhiệt huyết cách mạng của Quốc dân đảng"
 RKT_zeal_decision_category_desc: "\"Chìa khóa thành công là hành động, và điều cốt yếu trong hành động là sự kiên trì.\"\n-Tôn Trung Sơn\n\nCuộc cách mạng của Quốc dân đảng được duy trì nhờ sự tận tụy cuồng nhiệt của binh sĩ và lòng yêu nước của cán bộ. Dù chủ nghĩa thực dụng có lợi, về lâu dài lãnh đạo đảng phải tăng §cNhiệt huyết cách mạng§! để tránh rơi trở lại vào chia rẽ phe phái nhỏ nhen.\n\nCó thể hình dung §cNhiệt huyết cách mạng§! được cất trong một tài khoản chung trên toàn Trung Quốc. Các thế lực địa phương có thể §Rrút§! hoặc §Ggửi§! nguồn năng lượng dân tộc này, còn chính quyền trung ương có thể §Gbù đắp thiếu hụt§! hoặc §Rbiển thủ phần dư§!. Sự tương tác này cho phép phân bổ nguồn lực đến nơi cần thiết, nhưng vận mệnh cuối cùng của cách mạng có thể bị quyết định bởi nhiệt huyết ấy.\n\n§cNhiệt huyết cách mạng§! hiện ở mức [?global.RKT_revolutionary_zeal_var|c%] trên toàn quốc."

 LKT_decision_category: "Đấu đá trong Cách mạng Nhân dân"
 LKT_decision_category_desc: "Cánh tả Trung Quốc tuyên bố chiến đấu vì nhân dân và sự giải phóng của họ, nhưng ngay cả trong giờ phút đen tối nhất, sự đoàn kết giữa những người xã hội chủ nghĩa, dân tộc chủ nghĩa và cách mạng cũng rất mong manh. Nay cách mạng lại dâng cao, chia rẽ vẫn tồn tại.\n\nCánh tả Quốc dân đảng chia thành hai liên minh lớn. §RHội Đồng chí Cải tổ§! và người đứng đầu §RUông Tinh Vệ§! đang giằng co quyết liệt để tranh ảnh hưởng với §SỦy ban Hành động Lâm thời của Tống Khánh Linh§!.\n§YTình hình hiện tại có thể được mô tả là§! [CHI_bop_status_loc].\n\nQuá trình cực đoan hóa đã làm lung lay quyền kiểm soát của giới lãnh đạo đối với phong trào, mở đường cho các phe bên lề như §lRCF tự do§!, §rLCS nổi dậy§! và §oCRS cuồng tín§!.\n§YChủ nghĩa cấp tiến cách mạng hiện ở mức§! [?CHI.CHI_radicalism_var|o%]\n\nCán cân quyền lực và mức độ cấp tiến cách mạng được cho là sẽ quyết định kết quả cuối cùng của cuộc tranh giành quyền lực trong Quốc dân đảng. Đấu đá tại các tỉnh xa cũng có thể ảnh hưởng đến vận mệnh cuộc cách mạng Trung Quốc khó kiểm soát. Biết đâu một người ngoài lại có cơ hội nắm quyền. Điều chắc chắn là nhân dân đã lên tiếng, và họ đòi một Trung Quốc mới!"

 #National Reconstruction
 KMT_national_reconstruction_category: "Công cuộc Kiến quốc của Quốc dân đảng"
 KMT_national_reconstruction_category_desc: "Ủy ban Kiến thiết Quốc gia là ý tưởng của cố Tôn Trung Sơn, người cho rằng trong giai đoạn huấn chính cần có những bước đi bảo đảm đất nước hiện đại hóa và dân chủ hóa thành công. Muốn trở lại thành cường quốc thế giới, Trung Quốc phải được xây dựng từ nền móng với sự giúp đỡ của Quốc dân đảng.\n\nDù công cuộc kiến quốc bị hai cuộc Bắc phạt cản trở đáng kể, thắng lợi của cuộc Bắc phạt lần hai cuối cùng đã cho đảng cơ hội hoàn thành mục tiêu \"kiến thiết\" của Cách mạng Tân Hợi năm 1911. Nay có thể rời giai đoạn tuyên truyền và quân sự, theo nguyên tắc của vị Tổng lý vĩnh viễn vĩ đại, chúng ta phải bước vào giai đoạn tái thiết chính trị và kinh tế của Cách mạng Quốc dân. Từng bước, từng nhà máy, từng nông trại, chúng ta sẽ xây lại nền tảng kinh tế và chính trị vững mạnh để Trung Quốc mãi chống được đế quốc ngoại bang và trở lại vĩ đại."

 KMT_national_reconstruction_mission: "£civ_factory_output  Hoàn thành công cuộc Kiến quốc"
 KMT_national_reconstruction_mission_desc: "Dự án lớn của đảng đã được triển khai đầy đủ và nhận được toàn bộ sự ủng hộ nội bộ. Dù các phe thống nhất thực hiện công cuộc Kiến quốc, thất bại có thể khiến một phe mất quyền lực chính trị và phe khác giành được quyền lực."
 KMT_factory_goals_tt: "Có tổng cộng hơn §Y[?KMT_factory_goals]§! nhà máy"

 KMT_NRC_heavy_industry_decisions_tt: "§CTiêu điểm này mở thêm các quyết định §YCông nghiệp nặng§! trong nhóm quyết định §Y$KMT_national_reconstruction_category$§!.§!"
 KMT_NRC_autarky_decisions_tt: "§CTiêu điểm này mở thêm các quyết định §YThương mại và Tự cung tự cấp§! trong nhóm quyết định §Y$KMT_national_reconstruction_category$§!.§!"
 KMT_NRC_resource_decisions_tt: "§CTiêu điểm này mở thêm các quyết định §YThăm dò tài nguyên§! trong nhóm quyết định §Y$KMT_national_reconstruction_category$§!.§!"
 KMT_NRC_railroad_decisions_flag: "§CTiêu điểm này mở thêm các quyết định §YXây dựng đường sắt§! trong nhóm quyết định §Y$KMT_national_reconstruction_category$§!.§!"

 KMT_delay_the_reconstruction_project: "Trì hoãn dự án tái thiết"
 KMT_delay_the_reconstruction_project_desc: "Dù đã hết sức cố gắng, các kỹ sư và công nhân vẫn khó hoàn thành đúng hạn. Chúng ta phải đề nghị NEC gia hạn thời gian hoàn thành dự án."

 KMT_nationalise_nanjing_electrical_works: "Quốc hữu hóa Nhà máy Điện Nam Kinh"
 KMT_nationalise_nanjing_electrical_works_desc: "[KMT_nationalise_nanjing_electrical_works_desc_scripted_loc]"

 KMT_nationalise_nanjing_electrical_works_lkmt_desc_key: "Lấy cảm hứng từ sự phát triển tại Luân Đôn và Paris, dự án Nhà máy Điện Nam Kinh nhằm thắp sáng thủ đô tráng lệ của Trung Hoa Quốc dân. Cơ quan này là một trong những nơi đầu tiên phải xử lý sự mơ hồ trong tư tưởng kinh tế của cố Tôn tiên sinh về ranh giới giữa khu vực công và tư. Vì vậy, quốc hữu hóa và tổ chức lại nhà máy điện sẽ mang điện đến hàng nghìn người đang sống trong bóng tối tại Nam Kinh."
 KMT_nationalise_nanjing_electrical_works_rkmt_desc_key: "Lấy cảm hứng từ sự phát triển tại Moskva, dự án Nhà máy Điện Nam Kinh nhằm thắp sáng thủ đô tráng lệ của Trung Hoa Quốc dân. Cơ quan này là một trong những nơi đầu tiên phải xử lý sự mơ hồ trong tư tưởng kinh tế của cố Tôn tiên sinh về ranh giới giữa khu vực công và tư. Vì vậy, quốc hữu hóa và tổ chức lại nhà máy điện sẽ mang điện đến hàng nghìn người đang sống trong bóng tối tại Nam Kinh."

 KMT_establish_the_yongli_chemical_plant: "Thành lập Nhà máy Hóa chất Vĩnh Lợi"
 KMT_establish_the_yongli_chemical_plant_desc: "[KMT_establish_the_yongli_chemical_plant_scripted_loc]"

 KMT_establish_the_yongli_chemical_plant_lkmt_desc_key: "Là quốc gia sống dựa vào đất đai, Trung Quốc thiếu phương tiện và ngành công nghiệp sản xuất phân bón hiện đại để tăng sản lượng nông nghiệp. Dưới sự lãnh đạo của Phạm Húc Đông, dự án Vĩnh Lợi nhằm xây dựng nhà máy phân bón đầu tiên của Trung Quốc, phát triển sản xuất axit sulfuric, amoniac tổng hợp và axit nitric trong nước. Các cố vấn Anh và Pháp cũng tham gia, với mục tiêu sản xuất hàng tấn amoniac, axit và sulfat mỗi ngày."

 KMT_establish_the_yongli_chemical_plant_rkmt_desc_key: "Là quốc gia sống dựa vào đất đai, Trung Quốc thiếu phương tiện và ngành công nghiệp sản xuất phân bón hiện đại để tăng sản lượng nông nghiệp. Dưới sự lãnh đạo của Phạm Húc Đông, dự án Vĩnh Lợi nhằm xây dựng nhà máy phân bón đầu tiên của Trung Quốc, phát triển sản xuất axit sulfuric, amoniac tổng hợp và axit nitric trong nước. Các cố vấn Nga cũng tham gia, với mục tiêu sản xuất hàng tấn amoniac, axit và sulfat mỗi ngày."

 KMT_renovate_shanghai_arsenal: "Cải tạo Xưởng quân giới Thượng Hải"
 KMT_renovate_shanghai_arsenal_desc: "[KMT_renovate_shanghai_arsenal_desc_scripted_loc]"

 KMT_renovate_shanghai_arsenal_lkmt_desc_key: "Thời gian ở Anh và Pháp đã dạy chúng ta tầm quan trọng của chiến tranh thiết giáp và cơ giới. Dù còn lâu mới phát triển được công nghệ thiết giáp tiên tiến như phương Tây, Xưởng quân giới Thượng Hải sẽ được cải tạo để sản xuất xe bọc thép tương tự loại Quân đoàn Tình nguyện Thượng Hải sử dụng."
 KMT_renovate_shanghai_arsenal_rkmt_desc_key: "Thời gian ở Nga đã dạy chúng ta tầm quan trọng của chiến tranh thiết giáp và cơ giới. Dù còn lâu mới phát triển được công nghệ thiết giáp tiên tiến như phương Tây, Xưởng quân giới Thượng Hải sẽ được cải tạo để sản xuất xe bọc thép tương tự loại Quân đoàn Tình nguyện Thượng Hải sử dụng."

 KMT_create_nez_in_shanghai: "Thành lập khu kinh tế mới tại Thượng Hải"
 KMT_create_nez_in_guangzhou: "Thành lập khu kinh tế mới tại Quảng Châu"
 KMT_create_nez_in_beijing: "Thành lập khu kinh tế mới tại Bắc Kinh"
 KMT_create_nez_in_hangzhou: "Thành lập khu kinh tế mới tại Hàng Châu"
 KMT_create_nez_in_xiamen: "Thành lập khu kinh tế mới tại Hạ Môn"

 KMT_state_capitalism_plan: "Khu vực Chính sách Kinh tế mới"

 KMT_state_capitalism_tt: "§YCác thành phố Nam Kinh, Hàng Châu, Hạ Môn và Bắc Kinh§! sẽ nhận hiệu ứng §YKhu vực Chính sách Kinh tế mới§!, mang lại\n      $MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!\n $MODIFIER_LOCAL_BUILDING_SLOTS$: §G+2§!\n\n"

 KMT_create_nez_in_shanghai_desc: "[KMT_create_nez_in_shanghai_desc_scripted_loc]"
 KMT_create_nez_in_shanghai_lkmt_desc_key: "Cả Trần Công Bác và Tống Tử Văn, hai nhân vật lớn của công cuộc Kiến quốc, đều tin rằng kinh tế công nghiệp ven biển Trung Quốc là nền tảng của nền cộng hòa mới. Vì vậy, các khu vực được chỉ định đặc biệt tại những thành phố ven biển sẽ giúp tạo vốn quốc gia dưới sự giám sát chặt chẽ của nhà nước."
 KMT_create_nez_in_shanghai_rkmt_desc_key: "Mọi phe trong Quốc dân đảng cánh hữu đều tin rằng kinh tế công nghiệp ven biển Trung Quốc là nền tảng của nền cộng hòa mới. Vì vậy, các khu vực được chỉ định đặc biệt tại những thành phố ven biển sẽ giúp tạo vốn quốc gia dưới sự giám sát chặt chẽ của nhà nước."

 KMT_create_nez_in_guangzhou_desc: "[KMT_create_nez_in_shanghai_desc_scripted_loc]"
 KMT_create_nez_in_beijing_desc: "[KMT_create_nez_in_shanghai_desc_scripted_loc]"
 KMT_create_nez_in_hangzhou_desc: "[KMT_create_nez_in_shanghai_desc_scripted_loc]"
 KMT_create_nez_in_xiamen_desc: "[KMT_create_nez_in_shanghai_desc_scripted_loc]"

 KMT_anhui_industrial_plan: "Kế hoạch Công nghiệp An Huy"
 KMT_anhui_industrial_plan_desc: "Dưới sự chỉ đạo của Ủy ban Tài nguyên và Bộ Công nghiệp trong Kế hoạch Kiến quốc, việc xây dựng Nhà máy Thép Trung ương Mã An Sơn sẽ phát triển sản xuất thép và than tại An Huy. Dù tài nguyên dồi dào, sản lượng thép Trung Quốc vẫn rất thấp, còn cơ sở lớn nhất tại An Sơn thuộc sở hữu Nhật Bản. Thành lập một cơ sở thép trung ương quốc hữu sẽ giảm ảnh hưởng đế quốc trong kinh tế và phát huy tiềm năng sản xuất thép. Chúng ta cũng phải phát triển hạ tầng địa phương để vận chuyển than hiệu quả."

 KMT_mining_operations_in_five_provinces: "Khai mỏ tại Ngũ tỉnh"
 KMT_mining_operations_in_five_provinces_desc: "Ngũ tỉnh miền Đông Trung Quốc giàu có và trù phú từ lâu bị quân phiệt, địa chủ tham nhũng khai thác, làm suy thoái đất đai và tài nguyên. Lãnh đạo đảng sẽ khắc phục điều này và hiện đại hóa toàn diện khu vực. Ủy ban Tài nguyên sẽ tận dụng than và vonfram tại vùng từng thuộc Liên minh Bát tỉnh để công nghiệp hóa đất nước."

 KMT_mine_yaogangxian_mining_area: "Khuyến khích khai thác mỏ Dao Cương Tiên"
 KMT_mine_yaogangxian_mining_area_desc: "Mỏ vonfram đầu tiên tại Hồ Nam là mỏ Tây Xung, được phát hiện ở huyện Đào Giang năm 1901. Chính phủ Quốc dân dự định tiếp tục phát triển công nghiệp Hồ Nam bằng việc khai thác khu mỏ Dao Cương Tiên. Điều này vừa cải thiện hạ tầng vừa mang lại nhiều việc làm và cơ hội cho tỉnh chủ yếu sống bằng nông nghiệp này."

 KMT_central_machinery_factory: "Thành lập Nhà máy Cơ khí Trung ương"
 KMT_central_machinery_factory_desc: "Hồ Nam vẫn là một trong những tỉnh nông nghiệp và nông thôn nhất miền Nam Trung Quốc. Chính phủ Quốc dân hy vọng thay đổi tình hình bằng việc thành lập Nhà máy Cơ khí Trung ương với sự giúp đỡ của Bộ Nội vụ. Nhà máy dự kiến sản xuất máy móc và thiết bị hiện đại như ô tô, tua-bin hơi nước và điện thoại."

 KMT_xiangtan_steel_work: "Thành lập Nhà máy Thép Tương Đàm"
 KMT_xiangtan_steel_work_desc: "[KMT_xiangtan_steel_work_scripted_loc]"

 KMT_xiangtan_steel_work_lkmt_desc_key: "Tương Đàm có vai trò quan trọng nhờ công nghiệp hiện đại và giao thông đường bộ, đường thủy thuận tiện. Do ngành than và sắt nặng tập trung ở vùng Đông Bắc xa xôi, Ủy ban Tài nguyên của Chính phủ Quốc dân muốn xây dựng nhà máy thép tại Hồ Nam với sự hỗ trợ của cố vấn Pháp."
 KMT_xiangtan_steel_work_rkmt_desc_key: "Tương Đàm có vai trò quan trọng nhờ công nghiệp hiện đại và giao thông đường bộ, đường thủy thuận tiện. Do ngành than và sắt nặng tập trung ở vùng Đông Bắc xa xôi, Ủy ban Tài nguyên của Chính phủ Quốc dân muốn xây dựng nhà máy thép tại Hồ Nam với sự hỗ trợ của cố vấn Nga."

 KMT_developing_hunans_industrial_capacity: "Phát triển năng lực công nghiệp Hồ Nam"
 KMT_developing_hunans_industrial_capacity_desc: "Nhờ vị trí địa lý, Hồ Nam là một trong những vựa lúa và nơi tập trung nông dân đông nhất Trung Quốc. Để huy động sức mạnh công nghiệp quốc gia, chúng ta phải xây dựng kế hoạch công nghiệp hóa tại các thành phố như Trường Sa nhằm thúc đẩy hiện đại hóa."

 KMT_construct_yuehan_railway: "Hoàn thành đường sắt Việt-Hán"
 KMT_construct_yuehan_railway_desc: "Đường sắt Quảng Đông-Hán Khẩu khởi công năm 1896 dưới triều Thanh nhưng đến nay vẫn chưa hoàn thành. Nội chiến và sự quản lý yếu kém của quân phiệt đã cản trở nghiêm trọng tiến độ. Dưới sự chỉ đạo của Bộ Đường sắt, Chính phủ Quốc dân đã thuê Lăng Hồng Huân hoàn thành đoạn Chu-Shao."

 KMT_modernise_yellow_river_levees: "Hiện đại hóa đê Hoàng Hà"
 KMT_modernise_yellow_river_levees_desc: "Dòng Hoàng Hà cổ xưa đã nuôi sống người Hán qua bao thế hệ. Hệ thống đê ở hạ lưu dần hình thành từ thời Xuân Thu. Từ thời Minh và Thanh, dòng sông liên tục được trị thủy để tránh lũ lụt thảm khốc, nhưng đê điều và đường thủy ngày càng lỗi thời. Chính phủ Quốc dân sẽ hiện đại hóa chúng để đáp ứng nhu cầu thế kỷ 20."

 KMT_nationalise_beijing_steel: "Quốc hữu hóa ngành thép Bắc Kinh"
 KMT_nationalise_beijing_steel_desc: "Các nhà máy luyện thép Thạch Cảnh Sơn được giới doanh nghiệp và chính quyền Bắc Dương cùng thành lập năm 1919. Một công ty Mỹ thiết kế nhà máy ở chân núi Thạch Cảnh Sơn, nhưng chiến tranh liên miên khiến xây dựng trì trệ. Chính quyền Trực Lệ cuối cùng hoàn thành với viện trợ Đức rồi bán cho Siemens. Khi quyền lực Trực Lệ sụp đổ, Chính phủ Quốc dân quốc hữu hóa, đưa các nhà máy trở lại quyền kiểm soát của Trung Quốc."

 KMT_nationalise_german_mines_zibo: "Quốc hữu hóa các mỏ Đức tại Truy Bác"
 KMT_nationalise_german_mines_zibo_desc: "[KMT_nationalise_german_mines_zibo_desc_scripted_loc]"

 KMT_nationalise_german_mines_zibo_lkmt_desc_key: "Vùng Truy Bác trên bán đảo Sơn Đông bị đế quốc phương Tây nhòm ngó vì nguồn than dồi dào. Đức chiếm vùng này sau hiệp ước năm 1898 và giữ nó như một phần Đông Á thuộc Đức. Người Đức tiếp tục bóc lột dân ta làm lao động giá rẻ, trong khi chúng ta có quan hệ chặt chẽ với công đoàn thợ mỏ do Vương Tẫn Mỹ, thành viên LCS, lãnh đạo. Để củng cố công nghiệp nội địa và giải phóng nhân dân khỏi xiềng xích đế quốc, chúng ta nên quốc hữu hóa các mỏ bị Đức chiếm tại Truy Bác."
 KMT_nationalise_german_mines_zibo_rkmt_desc_key: "Vùng Truy Bác trên bán đảo Sơn Đông bị đế quốc phương Tây nhòm ngó vì nguồn than dồi dào. Đức chiếm vùng này sau hiệp ước năm 1898 và giữ nó như một phần Đông Á thuộc Đức. Người Đức tiếp tục bóc lột dân ta làm lao động giá rẻ, trong khi chúng ta có quan hệ chặt chẽ với công nhân trong các công đoàn thợ mỏ. Để củng cố công nghiệp nội địa và giải phóng nhân dân khỏi xiềng xích đế quốc, chúng ta nên quốc hữu hóa các mỏ bị Đức chiếm tại Truy Bác."

 KMT_complete_the_tongpu_railway: "Hoàn thành đường sắt Đồng-Bồ"
 KMT_complete_the_tongpu_railway_desc: "Đường sắt Đồng-Bồ khởi công trong giai đoạn cải cách của vua Quang Tự. Tuyến đi qua trung tâm Sơn Tây, qua Thái Nguyên đến ga Hoa Sơn ở Thiểm Tây. Quân phiệt Diêm Tích Sơn bắt đầu xây dựng nhưng bất ổn Trung Nguyên làm đình trệ tiến độ. Bộ Đường sắt vì thế hợp tác với cố vấn Anh để hoàn thành tuyến, giúp đi lại dễ dàng qua hai tỉnh nhiều núi."

 KMT_revive_jinan_arsenal: "Khôi phục Xưởng quân giới Tế Nam"
 KMT_revive_jinan_arsenal_desc: "Xưởng quân giới Tế Nam bắt nguồn từ Cục Cơ khí Sơn Đông năm 1875, từng sản xuất thuốc súng, dược phẩm nhẹ và vật dụng làm bánh. Năm 1894, khi chiến tranh Trung-Nhật nổ ra, cơ sở mở rộng để sản xuất vũ khí nhẹ. Dưới các quân phiệt cũ, xưởng trang bị cho phe Sơn Đông trước khi rơi vào tay Quốc dân Cách mệnh quân. Bộ Quân sự muốn tận dụng cơ sở hiện đại để sản xuất đạn, lựu đạn và ngòi nổ bom máy bay."

 KMT_refurbish_taiyuan_arsenal: "Tân trang Xưởng quân giới Thái Nguyên"
 KMT_refurbish_taiyuan_arsenal_desc: "Xưởng quân giới Thái Nguyên được xây theo lệnh Diêm Tích Sơn để sản xuất vũ khí nội địa. Các cải cách của ông giúp xưởng sản xuất cả súng cối và pháo ngoài vũ khí nhẹ. Chất lượng xưởng cao so với mặt bằng Trung Quốc; nhiều bản sao súng trường và pháo đã được bán cho Mã gia quân ở phía Tây và Tân Quế hệ ở phía Nam. Bộ Quân sự muốn tận dụng máy móc, dây chuyền hiện đại để trang bị Quốc dân Cách mệnh quân. Chúng ta cũng sẽ hiện đại hóa Xưởng quân giới Hoa Âm tại Thiểm Tây, nổi tiếng về súng cối và pháo nhẹ."

 KMT_improve_han_river_infrastructure: "Cải thiện hạ tầng sông Hàn"
 KMT_improve_han_river_infrastructure_desc: "Dài hơn 400 kilômét, sông Hàn là sông lớn thứ hai Quảng Đông, chỉ sau Châu Giang. Tuy nhiên, sông thường xuyên gây lũ; nhiều cơ sở hạ tầng đã lỗi thời hoặc hư hại sau nhiều năm chiến tranh. Chính phủ Quốc dân quyết định triển khai dự án đập đầy tham vọng để tăng việc làm ở Quảng Đông và kiểm soát dòng nước tốt hơn."

 KMT_wuzhou_vegetable_oil_company: "Tân trang Công ty Dầu thực vật Ngô Châu"
 KMT_wuzhou_vegetable_oil_company_desc: "Dầu trẩu, hay \"dầu gỗ Trung Quốc\", là dầu khô ép từ hạt cây trẩu, được ghi chép sử dụng từ thời Khổng Tử khoảng năm 400 trước Công nguyên. Dầu chủ yếu dùng hoàn thiện và bảo vệ gỗ, có thể củng cố công nghiệp nội địa. Chính phủ Quốc dân đã dành đất tại Quảng Tây để chế biến dầu trẩu; Ngô Châu rất phù hợp nhờ vị trí địa lý và nền tảng công nghiệp sẵn có."

 KMT_nanning_grain_storage: "Xây kho lương thực tại Nam Ninh"
 KMT_nanning_grain_storage_desc: "Lương thực từ lâu là hàng hóa chủ chốt của Quảng Tây, tỉnh nổi tiếng với lúa gạo chất lượng cao. Ban Thủy lợi thuộc Ủy ban Kiến thiết Quốc gia quyết định bảo quản mùa màng hằng năm bằng cách xây kho lương ở Nam Ninh, qua đó dự trữ ngũ cốc cho người khó khăn và các tỉnh bị nạn đói."

 KMT_green_gold_in_qiongya: "Vàng xanh tại Quỳnh Nhai"
 KMT_green_gold_in_qiongya_desc: "Cao su là chìa khóa trang bị và tiếp tế cho mọi quân đội hiện đại; may thay Quỳnh Nhai có nguồn cao su tự nhiên phong phú. Khí hậu nhiệt đới ấm áp giúp cao su phát triển mạnh, đến mức dân địa phương gọi là \"vàng xanh\". Ủy ban Tài nguyên sẽ biến Quỳnh Nhai thành vùng trồng cao su của Trung Quốc, hỗ trợ sản xuất nội địa và ngoại thương có kiểm soát."

 KMT_encourage_oil_extraction_in_yanchang: "Khuyến khích khai thác dầu tại Diên Trường"
 KMT_encourage_oil_extraction_in_yanchang_desc: "Diên Trường là một trong số ít mỏ dầu tự nhiên được phát hiện trong nước. Năm 1907, chính quyền Thanh lập giếng dầu đầu tiên của Trung Quốc tại đây và xây nhà máy lọc dầu vào năm sau. Ủy ban Tài nguyên muốn tiếp tục khai thác, đồng thời tìm nguồn dầu mới trong vùng đề phòng các mỏ hiện tại cạn kiệt."

 KMT_chongqing_electric_steel_mill: "Khôi phục Nhà máy Thép điện Trùng Khánh"
 KMT_chongqing_electric_steel_mill_desc: "Do quân phiệt cộng hòa Hùng Khắc Vũ thành lập năm 1919, Nhà máy Thép điện Trùng Khánh ban đầu phục vụ tham vọng và công nghiệp vũ khí của ông. Về sau nhà máy lần lượt chịu sự chi phối của các quân phiệt khác tàn phá Tứ Xuyên. Khi Chính phủ Quốc dân lập lại trật tự, nhà máy đã nằm trong tay nhà nước. Chúng ta sẽ mở rộng và hiện đại hóa để nhân dân cuối cùng được hưởng thành quả thay cho quân phiệt."

 KMT_chongqing_weapon_plant: "Tân trang Nhà máy Vũ khí Trùng Khánh"
 KMT_chongqing_weapon_plant_desc: "Nhà máy Sửa chữa Vũ khí Trùng Khánh ban đầu do Dương Sâm và Lưu Tương xây dựng. Dù hai quân phiệt đẩy Tứ Xuyên vào hỗn loạn và nạn đói, không thể phủ nhận đóng góp của họ trong việc hiện đại hóa nhà máy. Tuy nhiên, cơ sở vẫn cần cải thiện, nhất là tình trạng thiếu máy móc. Chính phủ Quốc dân và Bộ Nội vụ đề xuất cải tạo nhà máy theo tiêu chuẩn hiện đại."

 KMT_tap_into_sichuans_natural_reserves: "Khai thác trữ lượng tự nhiên Tứ Xuyên"
 KMT_tap_into_sichuans_natural_reserves_desc: "Trải rộng hơn 180.000 km, bồn địa Tứ Xuyên chứa khí đốt và dầu mỏ. Chính phủ Quốc dân giao Ủy ban Tài nguyên giám sát các cơ quan địa phương khai thác nguồn dự trữ này để đáp ứng nhu cầu dầu trong nước và giảm nhập khẩu."

 KMT_bauxite_extraction_in_guizhou: "Khai thác bô-xít tại Quý Châu"
 KMT_bauxite_extraction_in_guizhou_desc: "Quý Châu có một số mỏ bô-xít lớn nhất Trung Quốc. Chính phủ Quốc dân muốn hiện đại hóa miền Nam để đạt tiêu chuẩn khai thác bô-xít của miền Bắc. Ủy ban Tài nguyên sẽ giám sát, chỉ đạo chính quyền địa phương tham gia khai mỏ và khai thác bô-xít."

 KMT_expand_tin_production_in_gejiu: "Mở rộng sản xuất thiếc tại Cá Cựu"
 KMT_expand_tin_production_in_gejiu_desc: "Cá Cựu nổi tiếng cả nước về sản xuất thiếc, với lịch sử từ thời Hán. Khai thác và chế biến thiếc bắt đầu từ cuối thời Thanh; ngành thiếc Cá Cựu hiện chiếm gần 90% sản lượng Vân Nam. Để tập trung quản lý và duy trì chất lượng chế biến, Bộ Tài chính cùng Ủy ban Tài nguyên đang hợp tác với doanh nghiệp địa phương, sáp nhập thành một Công ty Công nghiệp Thiếc Vân Nam thống nhất."

 KMT_refurbish_gongxian_arsenal: "Tân trang Xưởng quân giới Củng Huyện"
 KMT_refurbish_gongxian_arsenal_desc: "Xưởng quân giới Củng Huyện nằm ở Hà Nam, tỉnh giàu tài nguyên và từng ở gần chính quyền trung ương thời Bắc Dương. Xưởng sản xuất súng ngắn, súng trường cùng vũ khí nặng như pháo. Sau đó xưởng bị quân phiệt Trực Lệ sử dụng, dù hưởng lợi lớn từ đầu tư Đức. Nay đã kiểm soát vững Hà Nam, chúng ta sẽ cải tạo xưởng theo nhu cầu Quốc dân Cách mệnh quân."

 KMT_kaifeng_mines: "Quốc hữu hóa các mỏ Khai Phong"
 KMT_kaifeng_mines_desc: "Các mỏ than hiện đại đầu tiên do công ty Anh thiết kế và sở hữu, vận hành bằng cách bóc lột lao động Trung Quốc. Sau Cách mạng Anh, chúng vẫn tồn tại và được quân phiệt Trực Lệ dung túng; các mỏ Tiêu Tác đóng góp đáng kể vào sản lượng than quốc gia. Trong cuộc chiến chống đế quốc, Chính phủ Quốc dân có nghĩa vụ quốc hữu hóa các cơ sở này và cải thiện điều kiện lao động tàn khốc mà ngoại quốc áp đặt lên công nhân."

 KMT_revitalise_hanyang_industry: "Khôi phục công nghiệp Hán Dương"
 KMT_revitalise_hanyang_industry_desc: "Nhờ gần Vũ Hán, công nghiệp Hán Dương từ lâu tương đối phát triển so với phần còn lại của Trung Quốc. Vùng có Xưởng quân giới Hán Dương và Nhà máy Gang thép Hán Dương nay đã suy tàn, từng chiếm gần 90% sản lượng thép cả nước. Công nghiệp nơi đây còn mang tinh thần cách mạng: một khẩu súng trường Hán Dương đã nổ phát súng đầu tiên châm ngòi Cách mạng Tân Hợi."

 KMT_revive_gansu_machine_works: "Khôi phục Nhà máy Cơ khí Cam Túc"
 KMT_revive_gansu_machine_works_desc: "Tiền thân là Cục Chế tạo Máy Cam Túc thành lập năm 1872, đây là cơ sở công nghiệp quân sự kiểu phương Tây đầu tiên ở Tây Bắc Trung Quốc. Khi miền Tây rơi vào bất ổn, nhà máy bị bỏ mặc, phần lớn máy móc bị quân phiệt lấy đi. Chính phủ Quốc dân muốn khôi phục nhà máy nhằm tạo việc làm và hiện đại hóa Tây Bắc."

 KMT_qinghai_cultivation_programme: "Khởi động chương trình canh tác Thanh Hải"
 KMT_qinghai_cultivation_programme_desc: "Từ lâu tách biệt với tinh thần cách mạng Phúc Kiến và Quảng Châu, Thanh Hải có rất ít sự hiện diện của Quốc dân đảng. Khi chúng ta mở rộng ảnh hưởng và quyền lực sang miền Tây, Bộ Nội vụ thúc đẩy chương trình phát triển nông nghiệp Thanh Hải. Kế hoạch sẽ đưa kỹ thuật, phân bón hiện đại vào sử dụng, đồng thời tích hợp cơ cấu và cơ quan Quốc dân đảng vào chính quyền địa phương."

 KMT_jinghui_irrigation_canal: "Xây kênh tưới Kính Huệ"
 KMT_jinghui_irrigation_canal_desc: "Thiểm Tây khô cằn, dễ hạn hán, thường xuyên gây khốn khó cho người dân. Kỹ sư thủy lợi bản địa Lý Nghi Chỉ có thiện cảm với Chính phủ Quốc dân, đặc biệt phe Hawaii, đã đề nghị Ban Thủy lợi triển khai chương trình bảo tồn nguồn nước. Sau nhiều đợt khảo sát, ông đề xuất xây kênh tưới và đập để quản lý, giữ nước và cải thiện sinh kế người dân Thiểm Tây."

 KMT_minsheng_irrigation_canal: "Xây kênh tưới Dân Sinh"
 KMT_minsheng_irrigation_canal_desc: "Như cố Tôn tiên sinh từng viết, Dân sinh là nguyên tắc cải thiện đời sống người Trung Quốc. Ủy ban Kiến thiết Quốc gia vì thế muốn triển khai dự án mới tại Tuy Viễn ở phía Bắc. Khu vực này chưa mấy ủng hộ sự nghiệp của ta. Ban Tài nguyên Nước đề nghị cấp vốn xây kênh dài 75 kilômét để tưới các trang trại khô hạn. Nhằm tôn vinh chủ nghĩa Tam Dân, kênh sẽ mang tên \"Dân Sinh\", thể hiện quyết tâm giúp đỡ nhân dân."

 KMT_complete_the_longhai_railway: "Hoàn thành đường sắt Lũng Hải"
 KMT_complete_the_longhai_railway_desc: "Những đèo núi Thiểm Tây khiến việc đi xuyên tỉnh khó khăn và tốn thời gian. Từ thời Thanh, tuyến đường sắt từ Lạc Dương đến Cam Túc đã bắt đầu xây dựng nhưng thường đình trệ vì bất ổn quân phiệt. Bộ Đường sắt của Chính phủ Quốc dân đã giao dự án mới để hoàn thành tuyến. Mục tiêu cuối cùng là tuyến dài hơn 1.700 kilômét, do kỹ sư Lăng Hồng Huân chỉ đạo."

 KMT_create_the_lanxin_railway: "Xây đường sắt Lan-Tân" #兰新铁路
 KMT_create_the_lanxin_railway_desc: "Để cải thiện liên lạc, tiếp tế và hành trình giữa Lan Châu ở Cam Túc với biên viễn Tân Cương, Bộ Đường sắt chính thức phê duyệt dự án đường sắt Lan Châu-Tân Cương, nối Cam Túc qua hành lang Hà Tây đến Địch Hóa, dự kiến dài hơn 1.904 km. Tuyến thứ hai sẽ nối Cáp Mật với Hòa Điền, cải thiện liên lạc tại cực Tây Trung Quốc."

 KMT_appropriate_shenyang_arsenal: "Tiếp quản Xưởng quân giới Thẩm Dương"
 KMT_appropriate_shenyang_arsenal_desc: "Xưởng quân giới Thẩm Dương nổi tiếng cả nước về tay nghề chế tạo. Do quân phiệt Phụng Thiên Trương Tác Lâm lập năm 1921, xưởng sản xuất súng, pháo, đạn, thuốc nổ và máy móc. Có lúc đây là xưởng quân giới lớn nhất Trung Quốc, thường xuyên đón cố vấn và sĩ quan Nhật. Nay kiểm soát Đông Bắc đã vững chắc, Bộ Quân sự quyết định tiếp quản xưởng để trang bị Quốc dân Cách mệnh quân."

 KMT_finish_fengman_hydroelectric_dam: "Hoàn thành đập thủy điện Phong Mãn"
 KMT_finish_fengman_hydroelectric_dam_desc: "Dưới thời Phụng Thiên, phe Giao thông bắt đầu xây đập thủy điện cấp điện cho Cát Lâm với sự hỗ trợ của cố vấn Nhật. Sau chiến thắng vẻ vang trước Phụng Thiên và việc đưa Mãn Châu trở về với nhân dân Trung Quốc, chúng ta có một đập còn dang dở có thể mang lại lợi ích lớn cho dân Cát Lâm. Bộ Nội vụ đã giao dự án hoàn thành đập Phong Mãn và tăng việc làm."

 KMT_nationalising_manchurian_iron_industry: "Quốc hữu hóa ngành sắt Mãn Châu"
 KMT_nationalising_manchurian_iron_industry_desc: "Các mỏ sắt An Sơn và Công ty Than Sắt Bản Khê Hồ từng thuộc sở hữu chung của Phụng Thiên và Nhật Bản, lời nhắc đáng buồn về ảnh hưởng sâu rộng của Nhật thông qua Mantetsu. Nhờ nguồn than dồi dào, công ty cung cấp thép rẻ cho Nhật bằng cách bóc lột lao động Trung Quốc. Suốt thời chiếm đóng, thợ mỏ bị đối xử tàn bạo; nay chúng ta có cơ hội giải phóng họ. Khi Đông Bắc đã được kiểm soát vững chắc, chúng ta có thể quốc hữu hóa hoàn toàn các mỏ và công ty để tài nguyên chỉ phục vụ nhân dân Trung Quốc."

 KMT_add_research_slot_decision: "Tăng cường nỗ lực giáo dục"
 KMT_add_research_slot_decision_desc: "Dù đã nỗ lực phổ cập biết chữ, năng lực nghiên cứu và giáo dục cả nước vẫn tụt xa các đối thủ. Hãy thúc đẩy phát triển tri thức và cải cách giáo dục nhanh chóng để bắt kịp thế giới."

 RKT_is_interacting_with_zeal_flag: "Đang tương tác với một quyết định §cNhiệt huyết cách mạng§! khác."

