 #RKMT Satellite Decisions
 RKT_challenge_the_RKMT_decision: "Thách thức ban lãnh đạo đảng"
 RKT_challenge_the_RKMT_decision_desc: "Lãnh đạo hiện tại của Cách mạng Quốc dân đã chứng tỏ không xứng đáng kế thừa di sản Tôn tiên sinh. Là người trung thành với chủ nghĩa Tam Dân, chúng ta đã thể hiện nhiệt huyết lớn hơn với sự nghiệp chung. Có lẽ đã đến lúc cân nhắc thay đổi lãnh đạo..."

 RKT_eliminate_RKMT_pretenders_decision: "Loại bỏ những kẻ tiếm danh [RKT.GetNonIdeologyAdjective]"
 RKT_eliminate_RKMT_pretenders_decision_desc: "Một đối thủ tranh quyền lãnh đạo đảng cách mạng đã xuất hiện tại [RKT.Capital.GetCapitalVictoryPointName], đòi cán bộ trung thành cả nước quy phục. Dù mang biểu tượng Bạch Nhật, chúng chẳng phải đồng chí trung thành hay người kế thừa xứng đáng của Tôn tiên sinh. Chúng ta sẽ lật đổ chúng khỏi bục cao, qua đó cứu cả đảng lẫn quốc gia."

 RKT_revising_the_three_principles_decision: "Điều chỉnh chủ nghĩa Tam Dân"
 RKT_revising_the_three_principles_decision_desc: "Chủ nghĩa Tam Dân của Tôn tiên sinh tuy sâu sắc nhưng còn nhiều khoảng trống để diễn giải, lớn hơn nhiều so với điều phe chính thống muốn chúng ta tin. Để thích nghi với tình hình địa phương, chúng ta phải sẵn lòng kết hợp những tư tưởng ấy với chương trình hiện có."

 RKT_implementing_the_three_principles_decision: "Thực hiện chủ nghĩa Tam Dân"
 RKT_implementing_the_three_principles_decision_desc: "Chủ nghĩa Tam Dân của Tôn tiên sinh gần như thiêng liêng trong Quốc dân đảng. Chúng ta phải bắt đầu \"đảng hóa\" bộ máy hành chính, thực hiện chỉ thị của trung ương và loại bỏ những tư tưởng trái với sự cai trị của đảng quốc."

 RKT_decision_cost_stb_05: "£GFX_stability_texticon §Y5%§!"
 RKT_decision_cost_stb_05_blocked: "£GFX_stability_texticon  §R5%§!"
 RKT_decision_cost_stb_05_tooltip: "Cần £GFX_stability_texticon  §Y5%§! để thực hiện quyết định"

 RKT_defend_our_autonomy_decision: "Bảo vệ quyền tự trị"
 RKT_defend_our_autonomy_decision_desc: "Việc quy phục chính quyền trung ương Quốc dân đảng không cho họ quyền chi phối đặc quyền địa phương [ROOT.GetAdjective]. Dù hứa để chính quyền [ROOT.GetLeader] tự thực hiện huấn chính trong tỉnh, trung ương vẫn gửi gián điệp và quan chức đến [ROOT.Capital.GetCapitalVictoryPointName] để phá hoại quyền lực của ta và hút tài nguyên cho cách mạng. Phải chấm dứt sự hai mặt ấy."

 RKT_express_our_loyalty_decision: "Thể hiện lòng trung thành"
 RKT_express_our_loyalty_decision_desc: "Trung thành với cách mạng Quốc dân đảng đi kèm trách nhiệm đạo đức. Cách mạng được dựng nên bằng tình yêu và hy sinh; cũng như binh sĩ, liệt sĩ hiến mạng vì đất nước, các tỉnh phải đóng góp của cải, sức lực, tài nguyên vì lợi ích quốc gia. Chúng ta sẽ huy động mọi phần dư có thể, thậm chí hơn thế, vì cách mạng để một ngày toàn Trung Quốc cùng hưởng tương lai sung túc."

 RKT_decision_cost_ws_05: "£GFX_war_support_texticon §Y5%§!"
 RKT_decision_cost_ws_05_blocked: "£GFX_war_support_texticon  §R5%§!"
 RKT_decision_cost_ws_05_tooltip: "Cần £GFX_war_support_texticon  §Y5%§! để thực hiện quyết định"

 RKT_coopt_kuomintang_legitimacy_decision: "Tận dụng tính chính danh của Quốc dân đảng"
 RKT_coopt_kuomintang_legitimacy_decision_desc: "Uy tín Quốc dân đảng vẫn bền bỉ qua nhiều năm dù chịu nhiều thất bại nặng nề. Có lẽ thông điệp của Tôn tiên sinh thực sự chạm đến nhân dân, mang hy vọng giữa loạn lạc; hoặc nó dễ được diễn giải thành bất cứ điều gì người nghe muốn. Dù sao, khoác lên quyền cai trị hình thức Quốc dân đảng sẽ giúp nó dễ được chấp nhận hơn. Dù Tổng lý vĩnh viễn che bóng lên nhiều người, ngôi sao [ROOT.GetLeader] càng sáng khi đứng cạnh ông. Chúng ta sẽ tự khẳng định là người kế thừa chân chính và tập hợp nhân dân quanh mình."

 RKT_exhort_national_unity_decision: "Kêu gọi đoàn kết quốc gia"
 RKT_exhort_national_unity_decision_desc: "Quốc dân đảng vượt qua bao thử thách vì dù đối thủ có bao nhiêu súng hay ngoại bang đổ bao nhiêu vàng chống lại, lời giải phóng vẫn chinh phục lòng dân. Tuy vậy, giữa quân phiệt và chia rẽ, luôn có kẻ đặt tư lợi trên nhu cầu quốc gia. Chúng ta phải thực thi quyền lực đảng quốc chống phản động, dập tắt bất đồng nội bộ. Chỉ như vậy mới có thể huy động đất nước chống kẻ thù."

 RKT_secure_overseas_donations_decision: "Đảm bảo quyên góp từ hải ngoại"
 RKT_secure_overseas_donations_decision_desc: "Sau cuộc Bắc phạt thất bại, hàng trăm đảng viên lưu vong, lập căn cứ khắp châu Á và xa hơn. Dù là hậu quả đáng tiếc, đồng chí hải ngoại vẫn giữ tài sản và quan hệ. Ngay thời Tôn tiên sinh, ông đã tìm sự ủng hộ từ cộng đồng Hoa kiều. Nay đảng lại có chỗ đứng trên đại lục, hãy kêu gọi đồng chí trở về giúp tái thiết sức mạnh công nghiệp Trung Quốc."

 RKT_encourage_intellectuals_decision: "Khuyến khích giới trí thức"
 RKT_encourage_intellectuals_decision_desc: "Cách mạng không thể thắng chỉ bằng binh sĩ và đạn dược, mà còn nhờ tiến bộ của các ủy ban nghiên cứu. Thiếu tiến bộ, chúng ta sẽ nhanh chóng tụt sau đối thủ muốn kiểm soát Trung Quốc. Vì vậy, giữ vị trí tiên tiến về công nghệ chiến tranh quan trọng hơn bao giờ hết. Hãy tìm sự hỗ trợ từ trí thức trong và ngoài nước để biến quân đội thành lực lượng hiện đại nhất Trung Quốc."

 RKT_further_militarisation_decision: "Đẩy mạnh quân sự hóa"
 RKT_further_militarisation_decision_desc: "Quân số đông đến đâu cũng vô ích nếu không được trang bị đầy đủ. Trước khi kiểm soát toàn đại lục, ưu tiên cao nhất là mở rộng tổ hợp công nghiệp quân sự. Chúng ta phải phân bổ nguồn vốn mới để xây thêm nhà máy vũ khí."

 RKT_foster_regionalist_tendencies_decision: "Thúc đẩy khuynh hướng địa phương"
 RKT_foster_regionalist_tendencies_decision_desc: "Dù muốn thừa nhận hay không, Quốc dân đảng hiện phân tán khắp Trung Quốc, phụ thuộc nặng vào các thống đốc mang tham vọng lớn. Tuy đáng tiếc, trước mắt có thể biến chủ nghĩa địa phương thành lợi ích tạm thời. Khuyến khích xu hướng ấy và tạm bảo đảm sĩ quan địa phương giữ chức sẽ giúp giành lòng trung thành của họ."

 RKT_expand_national_reconstruction_decision: "Mở rộng công cuộc Kiến quốc"
 RKT_expand_national_reconstruction_decision_desc: "Dù sự nghiệp phục hưng quốc gia là chính nghĩa, đừng bỏ quên các tỉnh ta kiểm soát. Thổ phỉ, quân phiệt và tham nhũng đã tàn phá Trung Quốc từng hùng mạnh; các nhà máy một thời nhộn nhịp nay đổ nát vì chiến tranh. Đã củng cố quyền lực trên phần lớn đất nước, hãy hướng vào trong và tập trung khôi phục công nghiệp."

 RKT_embrace_human_elan: "Phát huy nhuệ khí con người"
 RKT_embrace_human_elan_desc: "Có lẽ sức mạnh và đức tính lớn nhất của con người là nhuệ khí: tinh thần cao đẹp và sinh lực. Muốn cứu đất nước, chúng ta phải dùng hết sức lực tinh thần lẫn thể chất, sẵn sàng đổ máu chống sức mạnh máy móc và vượt qua trang bị vật chất ưu thế của địch."

 RKT_political_terror: "Nền cai trị khủng bố chính trị"
 RKT_political_terror_desc: "Nhìn đâu, đi đâu, đảng cũng bị kẻ thù bao vây. Chúng đe dọa Cách mạng Quốc dân và chính sự tồn tại của công cuộc cứu dân. Chúng âm mưu lật đổ ta, và ta cũng có thể làm vậy. Hãy săn lùng những kẻ tôn sùng tự do, chống đảng quốc và \"Hội Dân quyền Trung Quốc\" phản trắc. Tất cả sẽ khuất phục trước làn sóng khủng bố."

 RKT_mobilising_the_youth: "Huy động thanh niên"
 RKT_mobilising_the_youth_desc: "Phần lớn cơ quan chính quyền bỏ mặc thanh niên nghèo lạc lối. Không được người có thẩm quyền hướng dẫn, họ sống vô định, lang thang, làm thổ phỉ hoặc chịu cảnh nghèo khổ, nô dịch triền miên. Một số ít may mắn là trí thức, con cháu quan chức có thể thoát. Với những người còn lại, đảng và quân đội sẽ trao mục đích mới: mang ngọn đuốc tương lai của chính họ."

 RKT_reform_the_administration: "Cải cách bộ máy hành chính"
 RKT_reform_the_administration_desc: "Bộ máy Quốc dân đảng là một khối khổng lồ, quan liêu chồng chất chỉ vì quan liêu, kém hiệu quả và bị giới kỹ trị Câu lạc bộ Trung ương cùng phe quân sự Hoàng Phố chi phối. Là những chuyên gia hành chính thực sự mang bản chất dân sự, chúng ta có thể tinh giản đảng quốc, vì đất nước tồn tại nhờ khả năng vận hành hằng ngày."

 RKT_shanghai_connections: "Các mối quan hệ Thượng Hải"
 RKT_shanghai_connections_desc: "Bị phần lớn đảng lên án, thế giới ngầm Trung Quốc đang phát triển bị các phe như Hoàng Phố và Chính học xem là rác rưởi, sâu bọ. Nhưng sự thiển cận cuối cùng sẽ hại họ. Giữ liên lạc với những người như Đỗ Nguyệt Sênh, một người rất thông minh và tài giỏi, sẽ giúp ta có thêm nguồn tài trợ... kém trong sạch hơn."

 RKT_spiritual_warfare: "Tiến hành chiến tranh tinh thần"
 RKT_spiritual_warfare_desc: "Thông qua \"Đề cương Giáo dục Đạo đức Tổng quát\" cung cấp cho mọi cấp học, chúng ta tạo phương tiện tái thiết tinh thần Trung Hoa. Đánh giá lại và kết hợp bốn đức tính Nho giáo, ta có thể cổ vũ tự giác, phụng sự đất nước và vận dụng chúng để mưu sinh. \"Tin mình đồng thời tin đạo; trị mình đồng thời trị việc; dạy mình đồng thời dạy người; bảo vệ mình đồng thời bảo vệ đất nước.\""

 #GXC LKMT Decisions
 GXC_coax_the_reluctant_decision: "Thuyết phục những người do dự"
 GXC_coax_the_reluctant_decision_desc: "Giai cấp tiểu tư sản luôn có quan hệ khó xử với cách mạng. Họ thường là đối thủ cứng đầu nhất của chủ nghĩa xã hội, nhưng nhiều lãnh đạo xã hội chủ nghĩa lại xuất thân từ giai cấp này. Cần nhượng bộ đôi chút, và có lao động lành nghề, trí thức đứng về phía mình luôn có lợi."

 GXC_court_peasant_activists_decision: "Tranh thủ các nhà hoạt động nông dân"
 GXC_court_peasant_activists_decision_desc: "Nông hội bắt đầu củng cố ảnh hưởng tại nông thôn, rất có lợi chừng nào ta giữ được lòng trung thành của họ. Điều đó không dễ. Nông dân chịu khổ lâu năm đòi thay đổi kinh tế, chính trị và cả xã hội; chúng ta phải nhanh chóng đáp ứng!"

 GXC_bolster_iron_army_decision: "Củng cố Thiết quân"
 GXC_bolster_iron_army_decision_desc: "Đệ Tứ quân là niềm tự hào Quảng Đông, có lịch sử vẻ vang chống quân phiệt và chiến đấu anh dũng trong Bắc phạt. Nhiều người Quảng Đông từng phục vụ trong các đơn vị tại tỉnh, tạo nguồn binh sĩ ổn định cho cả chiến đấu lẫn hỗ trợ. Bảo đảm tiếp tế cho quân đội này là thiết yếu để tiếp tục thắng lợi."

 GXC_win_over_unions_decision: "Tranh thủ các công đoàn"
 GXC_win_over_unions_decision_desc: "Hoạt động công đoàn tại Lưỡng Quảng rất đa dạng, từ công nghiệp truyền thống, xưởng tàu đến lao động trên Châu Giang. Dù ảnh hưởng Thứ Hai Đen đã dịu bớt, nhiều người vẫn cần giúp đỡ, nhất là khi đầu tư nước ngoài rút khỏi vùng."

 GXC_reinvigorate_the_party_decision: "Tiếp sức cho đảng"
 GXC_reinvigorate_the_party_decision_desc: "Có lẽ phần được chờ đợi nhất trong cương lĩnh cách mạng là công cuộc Kiến quốc, kế hoạch kinh tế lớn nhưng còn mơ hồ, làm nền tảng cho thay đổi xã hội và chính trị lâu dài. Cán bộ mong cơ hội chứng tỏ mình bằng cách giám sát các dự án lớn có thể quyết định cả sự nghiệp."

 #YUN Satellite Decisions
 YUN_appease_the_radicals: "Xoa dịu phe cấp tiến"
 YUN_appease_the_radicals_desc: "Bị đồng đảng cả tả lẫn hữu đòi một chính quyền \"cách mạng\" hơn vây ép, Đệ Tam quân phải đi trên sợi dây rất hẹp. Ảnh hưởng cánh tả nội bộ đòi lập tức giải quyết khổ cực, nhu cầu công nông; tàn dư Hoàng Phố lại khẳng định họ ưu việt hơn trong lãnh đạo cách mạng. Chính quyền chịu nhiều căng thẳng. Để tránh nội chiến, hãy tìm tiếng nói chung với đồng đảng vì chủ nghĩa dân tộc chung của chúng ta."

 YUN_embrace_sanminism: "Tiếp nhận chủ nghĩa Tam Dân"
 YUN_embrace_sanminism_desc: "Với người nhiệt thành và tận tụy, Tam Dân chính là những nguyên tắc mà cuộc đấu tranh cách mạng chiến đấu và đổ máu vì chúng. Nhưng khắp đất nước, tư tưởng Tôn Trung Sơn cùng cách diễn giải của người trung thành đã bị bôi nhọ. Dù đảng thập niên trước không đạt tham vọng lớn, đảng hiện tại tiến lên không còn bất định ấy. Thuần khiết về tư tưởng và tinh thần, nhân dân phải hiểu đảng chiến đấu vì điều gì."

 YUN_publicise_landlord_transgressions: "Công khai sai phạm của địa chủ"
 YUN_publicise_landlord_transgressions_desc: "Quá lâu rồi những \"lãnh chúa\" nhỏ ở nông thôn, từ thân hào đến địa chủ, cai trị gần như không ai đụng tới. Người lao động cày ruộng trong cảnh gần như nông nô khiến đảng đau lòng. Muốn cứu giai cấp vô sản và người bị áp bức, chúng ta phải phát động chiến dịch chính nghĩa chống kẻ ngược đãi người khác và lạm dụng địa vị."

 YUN_hold_mass_rallies: "Tổ chức mít tinh quần chúng"
 YUN_hold_mass_rallies_desc: "Khắp Trung Quốc, cộng đồng và tổ chức nông dân tiếp tục bị chủ bóc lột. Nhiều tiểu tư sản đô thị, xương sống trí thức của chủ nghĩa xã hội Trung Quốc, cũng vẫn xa lạ với Cách mạng Quốc dân. Để mừng kỷ nguyên mới thay đổi chính trị, kinh tế, xã hội, chúng ta phải truyền bá rộng rãi thông điệp đảng. Quân phiệt, đế quốc, thân hào và ác bá sẽ không còn chi phối các bạn!"

 YUN_rally_the_whampoa_cliques: "Tập hợp các phe Hoàng Phố"
 YUN_rally_the_whampoa_cliques_desc: "Dù phe ôn hòa Đệ Tam quân và các phe Hoàng Phố xuất thân Đệ Nhất quân thù địch, tình anh em cách mạng vẫn còn. Các phe Hoàng Phố sinh ra từ cái nôi cách mạng, ủng hộ Cách mạng Quốc dân hơn ai hết và tận tụy tuyệt đối. Dù tham vọng, mưu mô, họ vẫn chia rẽ nội bộ. Hãy rung chuông cách mạng, đoàn kết các phe khác biệt trong Quốc dân Cách mệnh quân."

 YUN_invigorate_the_youth_leagues: "Tiếp sức các đoàn thanh niên"
 YUN_invigorate_the_youth_leagues_desc: "Thanh niên là nguồn cấp tiến và cách mạng dồi dào nhưng bị phần lớn cơ quan chính quyền bỏ mặc. Không mục đích, hướng dẫn hay phương hướng, họ chấp nhận an phận, đầu hàng số phận hoặc trở thành thổ phỉ. Con em gia đình có thế lực may mắn thoát cảnh ấy từ lúc sinh ra. Với người bị bỏ lại, cứu cánh gần như duy nhất là các đoàn thanh niên của đảng."

 YUN_promoting_reformist_continuity: "Duy trì đường lối cải cách"
 YUN_promoting_reformist_continuity_desc: "Không chỉ các đảng cách mạng như Quốc dân đảng hay Đảng Công đoàn Trung Quốc muốn hiện đại hóa đất nước. Luôn có bàn tay thận trọng, khôn ngoan của những người hiện đại hóa ổn định thường bị lãng quên. Vân Nam luôn được hun đúc từ khát vọng một quốc gia mới, hiện đại, dựa trên phẩm chất và giá trị cộng hòa. Hãy nhắc dân chúng rằng trụ cột cải cách nằm ở những người kế thừa các anh hùng Trùng Cửu."

 YUN_cultivate_business_ties: "Vun đắp quan hệ doanh nghiệp"
 YUN_cultivate_business_ties_desc: "Dựa vào lý tưởng rất tốt, nhưng sức mạnh và mục tiêu quân sự chỉ đạt được khi có vật chất hỗ trợ. Không có sản xuất kinh tế và nhà máy phát triển, binh sĩ sẽ thiếu súng, đạn và đạn pháo cần cho thống nhất. Hãy thương lượng với các nhà sản xuất vũ khí, tài phiệt Trung Quốc để đạt thỏa thuận có lợi, bất kể giá nào."

 YUN_harkening_back_to_our_legacy: "Trở về di sản của chúng ta"
 YUN_harkening_back_to_our_legacy_desc: "Quá lâu rồi Quốc dân đảng bị dẫn vào tư tưởng cực đoan cuồng nhiệt, khát máu. Tự cô lập trong thất bại thập niên 1920, đảng chà đạp hy sinh của anh hùng các cuộc cách mạng trước chỉ để áp đặt khủng bố lên nhân dân. Chúng ta phải nhắc cả đảng và dân rằng Quốc dân đảng sinh ra từ sự tham gia dân chủ trong một cuộc cách mạng dân chủ, kẻo Trung Quốc rơi vào bạo quyền được lát đường bằng thiện ý."

 YUN_rallying_the_veterans_of_revolution: "Triệu tập các cựu binh cách mạng"
 YUN_rallying_the_veterans_of_revolution_desc: "\"Niềm tin được gây dựng bằng nhiều việc làm, nhưng chỉ một việc cũng đủ đánh mất.\"\nĐảng có thể chê bai ảnh hưởng phe Chính học trong công việc thường ngày, nhưng không ai phủ nhận sự tận tâm gìn giữ lý tưởng chân chính Tân Hợi của họ. Gồm các cựu binh đấu tranh lâu dài chống quân phiệt và bạo chúa, phe Chính học vẫn tồn tại trên chính trường khi đảng chính thống mục ruỗng trong cảnh gần như lưu vong. Hãy báo hiệu sự trở lại xứng đáng của những người lý tưởng thực sự trong Quốc dân đảng, những người không bị chủ nghĩa chuyên chế dẫn lạc đường."

 #CHI Puppet Decisions
 LKT_challenge_the_LKMT_decision: "Thách thức Ủy ban Trung ương"
 LKT_challenge_the_LKMT_decision_desc: "Ủy ban Trung ương đã chứng tỏ không phù hợp lãnh đạo Cách mạng Quốc dân. Là cán bộ trung thành, chúng ta thể hiện cam kết chân thành hơn với Tam Dân và phải chuẩn bị khả năng thay thế lãnh đạo hiện tại."

 LKT_eliminate_LKMT_pretenders_decision: "Loại bỏ những kẻ tiếm danh [LKT.GetNonIdeologyAdjective]"
 LKT_eliminate_LKMT_pretenders_decision_desc: "Ủy ban Trung ương cũ đã sụp đổ, từ tro tàn lại mọc lên một nhóm xét lại mới. Hàng triệu người Trung Quốc lần nữa có nguy cơ bị dẫn xa giáo huấn chân chính của Tôn tiên sinh, điều mà những môn đệ trung thành của cánh tả như chúng ta không thể chấp nhận."

 LKT_promote_rca_chapters_decision: "Thúc đẩy các chi hội RCA"
 LKT_promote_rca_chapters_decision_desc: "Hội Đồng chí Cải tổ Quốc dân đảng là hội kín do chính phủ lưu vong lập ban đầu để bảo đảm kỷ luật cách mạng, nghiên cứu kỹ Tam Dân và trên hết trung thành với sự lãnh đạo Uông Tinh Vệ. Dù cấp cao RCA nhiều bất đồng, các chi hội địa phương nổi tiếng với hạt nhân xã hội chủ nghĩa gắn bó và lòng trung thành cứng rắn với Chủ tịch. Khuyến khích họ liên kết với quan chức và cán bộ [ROOT.GetAdjective] sẽ giúp ngăn mọi thách thức đối với quyền lực của Uông."

 LKT_assist_pac_opposition_decision: "Hỗ trợ phe đối lập PAC"
 LKT_assist_pac_opposition_decision_desc: "Ủy ban Hành động Lâm thời Quốc dân đảng hình thành đầu cuộc nổi dậy Mân-Cám để lập cơ cấu lãnh đạo tự chủ với chính phủ lưu vong xa xôi. Liên minh với các nhóm đối lập dân sự và Hội Đồng học Cách mạng Trường Quân sự Hoàng Phố, PAC ủng hộ Tống Khánh Linh, góa phụ Tôn Trung Sơn, tranh lãnh đạo đảng. Liên minh ít ai ngờ này tìm sự hỗ trợ của ta để ngăn chế độ độc tài Uông Tinh Vệ; nhưng thắng rồi họ tồn tại cùng nhau bao lâu lại là chuyện khác."

 LKT_embrace_crs_fanaticism_decision: "Tiếp nhận sự cuồng tín của CRS"
 LKT_embrace_crs_fanaticism_decision_desc: "Trung Hoa Phục hưng Xã là nhóm bí mật gồm sĩ quan cực đoan dân tộc chủ nghĩa, toàn trị tập hợp quanh tướng Hồ Tông Nam. Kết hợp các hội anh em từ tình đồng đội Hoàng Phố, CRS là biểu hiện rõ nhất của nhiệt tình cách mạng do cánh quân sự Quốc dân đảng tạo ra. Đưa tinh thần này vào lực lượng địa phương sẽ có hệ quả, nhưng có thể quyết định sự sống còn của cách mạng."

 LKT_tolerate_lcs_agitation_decision: "Dung thứ hoạt động vận động của LCS"
 LKT_tolerate_lcs_agitation_decision_desc: "Liên đoàn Công đoàn chủ nghĩa Trung Quốc do những người xã hội chủ nghĩa ngoài Quốc dân đảng thành lập để tạo đối trọng cánh tả với đảng quốc. Do Đảng Công đoàn Trung Quốc dẫn đầu, cùng sự hỗ trợ miễn cưỡng của Thế giới Xã (mới) theo chủ nghĩa vô chính phủ và các nhóm độc lập, Liên đoàn thiếu ổn định, dễ đấu đá nội bộ. Tuy vậy, nhờ chủ nghĩa công đoàn hoặc các hình thức mô phỏng chiếm ưu thế trong phong trào xã hội chủ nghĩa thế giới, LCS có vai trò lớn trong huy động dân chúng ủng hộ cách mạng. Cho họ đặt chân tại [ROOT.Capital.GetCapitalVictoryPointName] sẽ giảm ủng hộ của giới quyền lực địa phương, nhưng làm dấy hy vọng ở [CHI.Capital.GetCapitalVictoryPointName] và nơi khác về một ngày mới đầy đấu tranh."

 LKT_engage_rcf_dialogue_decision: "Đối thoại với RCF"
 LKT_engage_rcf_dialogue_decision_desc: "Phe Tái thiết do Tôn Khoa và những người ủng hộ lưu vong còn lại lập tại Hawaii. Dựa vào mạng lưới ủng hộ cũ của cha ông trong cộng đồng Hoa kiều Đông Nam Á, họ dùng nguồn tài chính để đưa giá trị tự do theo cảm hứng phương Tây vào phong trào. Việc thường tranh thủ người ngoài đảng và những người tự do chống hiện trạng địa phương khiến cả phe xã hội chủ nghĩa lẫn quân phiệt xa lánh, nhưng có thể cải thiện hình ảnh đảng trong nước và quốc tế."

#Liberation of Asia

 KMT_liberation_of_asia_category: "Giải phóng châu Á"
 KMT_liberation_of_asia_category_desc: "Người Trung Quốc không phải nạn nhân duy nhất của đế quốc. Khắp lục địa, sự bành trướng tham lam của các đế quốc châu Âu nuốt chửng quốc gia tự do, đẩy hàng triệu người dưới ách thuộc địa tàn bạo. Ở phía Đông, Nhật Bản cũng nhập hội áp bức, đua cắm cờ trên đất ngoại bang.\n\nVới tư cách người bảo vệ tự nhiên của châu Á, chúng ta có nghĩa vụ giải phóng mọi dân tộc. Bằng tinh thần, máu và nếu cần cả mưu lược, chúng ta sẽ phá ách đế quốc trong lẫn ngoài nước. Trước mắt, chúng ta sẽ nâng cao ý thức dân tộc của nhân dân châu Á, giúp họ cùng hưởng vinh quang chủ nghĩa xã hội Liên Á."

 KMT_found_our_faction_decision: "Khẳng định vị thế trên thế giới"
 KMT_found_our_faction_decision_desc: "Tầm nhìn Tôn Trung Sơn là Trung Quốc có vị thế xứng đáng tại Đông Á và thế giới, dùng tài nguyên và nhân lực hùng hậu để thúc đẩy thiện chí, hợp tác quốc tế. Cách mạng Quốc dân thành công, bước tiếp theo hợp lý là tái khẳng định ảnh hưởng và truyền bá lý tưởng cách mạng để Trung Quốc không bao giờ lại thành nạn nhân đế quốc."

 KMT_invite_countries_to_faction: "Mời [FROM.GetNameDef] gia nhập [ROOT.GetFactionName]"
 KMT_invite_countries_to_faction_desc: "Cuộc Cách mạng Quốc dân Tôn tiên sinh thiết kế cho Trung Quốc nên là hình mẫu cho nhiều dân tộc khác; Tam Dân có thể dẫn đường cho trật tự châu Á mới tự do. Hãy đoàn kết thành những quốc gia trẻ đang vươn lên chống bạo quyền đế quốc ngoại bang, bảo đảm hòa bình và thiện chí bền vững qua nhiều thế hệ châu Á."

 KMT_invite_countries_to_faction_tt: "§YKhả năng chấp nhận tùy thuộc thái độ của §Y[FROM.GetAdjective]§! đối với chúng ta.§!"
 KMT_invite_countries_to_faction_peace_requirement_tt: "Chúng ta và nước được mời đều phải hòa bình hoặc có chung kẻ thù, đồng thời không sắp bước vào một cuộc chiến tiềm tàng, ngoại trừ Hawaii."

 KMT_invite_into_economic_sphere: "Mời [FROM.GetNameDef] tham gia $KMT_minsheng_partnership_full_name$"
 KMT_invite_into_economic_sphere_desc: "Sứ mệnh Cách mạng Quốc dân là đưa Trung Quốc, quốc gia thấm nhuần tinh thần dân tộc mạnh mẽ, vào vị trí thuận lợi nhất phương Đông để chống đế quốc. Lịch sử và kinh tế các dân tộc bị áp bức phương Đông giống Trung Quốc. Họ cũng không nên phát triển thành hệ thống tư bản hay thuần công đoàn chủ nghĩa, mà nên noi mô hình Trung Quốc, lập \"các quốc gia Dân sinh Nhân dân\".\n\nVì vậy, thành công cách mạng buộc Trung Quốc mở kỷ nguyên mới cho các dân tộc phương Đông, truyền cảm hứng hình thành liên minh chống đế quốc vững mạnh. Là trung tâm phong trào chống đế quốc, Trung Quốc nên đoàn kết nhân dân phương Đông, xây dựng cộng đồng dân tộc và kinh tế Đông Á rộng lớn."
 KMT_withdraws_from_sphere: "[THIS.GetNameDefCap] bị loại khỏi $KMT_minsheng_partnership_full_name$"

 KMT_liberation_war_decision: "Chuẩn bị chiến tranh giải phóng chống [FROM.GetNameDef]"
 KMT_liberation_war_decision_desc: "Vị thế đặc biệt của Trung Quốc ở châu Á bắt nguồn từ hàng thế kỷ ưu thế văn hóa và chính trị trong vùng. Là một trong những nền văn minh vĩ đại, lâu đời nhất thế giới, Trung Quốc nay hồi sinh xứng đáng có khả năng tiến hành cách mạng thế giới. Dùng sức mạnh công nghiệp và quân sự to lớn, chúng ta sẽ phá bỏ chế độ phản động và giải phóng đồng chí châu Á để họ cuối cùng cũng được cứu rỗi."

 KMT_freed_core_tt: "Các khu vực thiết yếu nhất với lợi ích chiến lược Trung Quốc do chính quyền ngoại quốc thân thiện, đồng minh hoặc chư hầu, cai trị, gồm §YTriều Tiên§!, §YNhật Bản§!, §YPhilippines§! và §Ycác nước Đông Dương§!\nCác cảng §Y[408.GetName]§! và §Y[336.GetName]§! phải do Trung Quốc hoặc đồng minh nắm giữ."
 LKT_freed_india_tt: "Toàn bộ tiểu lục địa Ấn Độ, gồm §Y[321.GetName]§!, §Y[818.GetName]§!, §Y[422.GetName]§!, §Y[323.GetName]§!, §Y[324.GetName]§!, do các chính quyền §RXã hội chủ nghĩa§! cai trị."
 LKT_freed_SEA_tt: "Toàn bộ Đông Nam Á do các chính quyền §RXã hội chủ nghĩa§! cai trị và các thuộc địa châu Âu §Y[GEA.GetName]§!, §Y[DEI.GetName]§!, §Y[721.GetName]§! đã bị xóa bỏ."
 LKT_freed_CEA_tt: "Toàn bộ Trung Á, gồm §Y[AFG.GetName]§!, do các chính quyền §RXã hội chủ nghĩa§! cai trị."
 LKT_freed_AST_tt: "Toàn bộ châu Đại Dương do các chính quyền §RXã hội chủ nghĩa§! cai trị."
 LKT_freed_HAW_tt: "Tự do vang khắp Thái Bình Dương; cả những đảo xa như §YHawaii§! cũng do các chính quyền §RXã hội chủ nghĩa§! có trách nhiệm cai trị."
 RKT_freed_india_tt: "Toàn bộ tiểu lục địa Ấn Độ, gồm §Y[321.GetName]§!, §Y[818.GetName]§!, §Y[422.GetName]§!, §Y[323.GetName]§!, §Y[324.GetName]§!, do các chính quyền §CCùng phe§! cai trị."
 RKT_freed_SEA_tt: "Toàn bộ Đông Nam Á do các chính quyền §CCùng phe§! cai trị và các thuộc địa châu Âu §Y[GEA.GetName]§!, §Y[DEI.GetName]§!, §Y[721.GetName]§! đã bị xóa bỏ."
 RKT_freed_CEA_tt: "Toàn bộ Trung Á, gồm §Y[AFG.GetName]§!, do các chính quyền §CCùng phe§! cai trị."
 RKT_freed_AST_tt: "Toàn bộ châu Đại Dương do các chính quyền §CCùng phe§! cai trị."
 RKT_freed_HAW_tt: "Tự do vang khắp Thái Bình Dương; cả những đảo xa như §YHawaii§! cũng do các chính quyền §CCùng phe§! có trách nhiệm cai trị."

#Afro-Asian Conference

 KMT_afro_asian_conference_category: "Hội nghị Á-Phi"
 KMT_afro_asian_conference_category_desc: "Kể từ khi [Root.GetLeader] tổ chức Hội nghị Á-Phi sau khi Quốc dân đảng thống nhất Trung Quốc, phong trào thúc đẩy các cường quốc xã hội chủ nghĩa đầu tư vào thế giới đang phát triển mạnh lên. Đầu tư này không chỉ để giành thiện cảm; những người tổ chức hội nghị đặt tham vọng xây dựng nền kinh tế toàn cầu mới thoát khỏi bóc lột tư bản."

 KMT_invest_in_third_world_decision: "Đầu tư vào [FROM.GetNameDef]"
 KMT_invest_in_third_world_decision_desc: "Nhân dân [FROM.GetNameDef] đã phá bỏ xiềng xích thực dân; chính phủ xã hội chủ nghĩa non trẻ có lẽ cần hỗ trợ bên ngoài để chuyển tiếp hậu thuộc địa thuận lợi. Điều này đòi hỏi chương trình toàn diện phát triển đô thị, hiện đại hóa nông nghiệp, xây dựng thể chế, đầu tư giáo dục và xóa tham nhũng, kéo dài hàng thập kỷ. Nhiều lĩnh vực chỉ dân địa phương mới xây được tương lai thịnh vượng, nhưng chút hào phóng của ta có thể giúp khởi động tiến trình."

#People's Minsheng Cooperative Economic Partnership

 minsheng_partnership_research_name: "Đối tác Hợp tác Công nghệ Dân sinh Nhân dân"
 minsheng_partnership_research_desc: "Ngoài hợp tác kinh tế, Đối tác Dân sinh còn thúc đẩy hợp tác công nghệ giữa các thành viên, với hy vọng châu Á cùng bước vào thời hiện đại."

