### Section 1 - Starting Event Chain and determinants of ANQ, LEP and QIE paths ###
 league_collapse_events.1.t: "Tôn Truyền Phương hội kiến các Đốc quân"
 league_collapse_events.1.d: "Tụ họp tại Nam Kinh ngày hôm nay là những nhân vật cốt cán và quan trọng bậc nhất của Liên minh Bát tỉnh thuộc Trực hệ phương Nam. Được triệu tập về Nam Kinh bởi \"Tiếu Diện Hổ\" đại tài, những buổi gặp mặt như thế này vốn là thông lệ trong việc điều hành Liên minh Bát tỉnh. Trùng với thời điểm bài phát biểu mừng Tết Nguyên Đán của Tổng thống Tào Côn, bản thân Liên minh lại không có chỗ cho những trò phù phiếm như ở Bắc Kinh. Diễn ra bên trong Phủ Soái, Tôn Truyền Phương thường tổ chức các cuộc họp này để bàn thảo chính sách chung, phân công nhiệm vụ cho các Đốc quân và củng cố vững chắc vị thế của mình tại các tỉnh.\n\nTham dự cuộc họp có Đốc quân Giang Tô Tề Tạ Nguyên, có lẽ vừa là đồng minh lớn nhất mà cũng vừa là đối thủ đáng gờm nhất của Tôn bên trong Liên minh. Tích tụ nhiều tai tiếng suốt những năm qua kể từ khi tái gia nhập Nam Trực Lệ, Tề là người ủng hộ nhiệt thành nhất chính sách nhượng địa độc hại này trong hội đồng. Hoàn toàn trái ngược về cả vị trí bàn hội nghị lẫn quan điểm chính sách là Đốc quân Trần Điều Nguyên, người cai quản các công việc tại tỉnh An Huy. Dù mới gia nhập gần đây, Trần luôn định vị mình là người theo phe phản đối nhượng địa và công khai đối đầu với Tề.\n\nDĩ nhiên còn có các Đốc quân khác hiện diện, như Đốc quân tàn bạo Chu Âm Nhân của Phúc Kiến — người hiếm hoi rời khỏi vị trí chỉ huy các chiến dịch bao vây chống lại cuộc Khởi nghĩa Mân Cám. Tương tự là Đốc quân Đặng Như Trác của Giang Tây, và Đốc quân Trần Nghi của Chiết Giang vốn chịu nhiều điều tiếng. Đáng ngại hơn, hưởng ứng phong trào tẩy chay Trực hệ, Đốc quân Triệu Hằng Dịch và Tổng đốc Lục Dụ Quang hầu như chẳng gửi bất kỳ đại diện nào, thậm chí không có lấy một bức điện tín báo vắng; dẫu vậy Đốc quân Thẩm có gửi một bức điện mang tính tượng trưng để bày tỏ quan điểm.\n\nNhưng không sao, đây là một năm mới thịnh vượng của Liên minh. Dù vậy, các Đốc quân Trần Nghi, Tề Tạ Nguyên và Trần Điều Nguyên rõ ràng cảm thấy bất an trước sự hiện diện của những tâm phúc thân tín nhất bên cạnh Soái phủ Liên minh như Tạ Hồng Huân, Mạnh Chiêu Nguyệt và Lý Bảo Chương. Có lẽ là để đánh hơi ra những kẻ phản bội trong hàng ngũ Đốc quân, bởi tiếng tăm đa nghi tột độ của Tôn đã khiến những kẻ cận kề ông nhất vừa là bạn, vừa là thù, và cả những kẻ thù đang giả vờ làm bạn."
 league_collapse_events.1.a: "Dao găm giấu sau lưng trong hang cọp."

 league_collapse_events.2.t: "Tuyến đường sắt Chiết Cám"
 league_collapse_events.2.d: "Hôm nay đánh dấu lễ khánh thành được mong đợi từ lâu của tuyến Đường sắt Chiết Cám — một dự án liên doanh giữa Soái phủ Liên minh, các Đốc quân Trần Nghi, Đặng Như Trác và Ủy ban Giám sát Tổng quản Đông Á (AOG). Nhằm đẩy mạnh công nghiệp hóa và kết nối các mạng lưới đường sắt phân tán giữa các ranh giới tỉnh, tuyến Chiết Cám vốn bắt nguồn từ nỗ lực thời nhà Thanh. Ban đầu được xây dựng dưới tên Đường sắt Chu Châu - Bình Hương vào năm 1899, phải mất sáu năm để hoàn thành vào năm 1905.\n\nNăm 1908, Công ty Đường sắt Chiết Giang bắt đầu khảo sát tuyến từ Chiết Giang đến Giang Tây, hợp tác với những đơn vị như Công ty Đường sắt Giang Tây. Tuy nhiên, do dư chấn của Cách mạng Tân Hợi, dự án đã bị đình trệ vô thời hạn. Mãi đến năm 1929 dưới sự bảo trợ của Soái phủ Liên minh, chính quyền tỉnh Chiết Giang do Trần Nghi đứng đầu mới quyết định tự gây quỹ để hiện đại hóa huyện Giang Sơn, nằm trên ranh giới giữa Chiết Giang và Giang Tây. Nhờ nỗ lực đó, một tuyến nhánh nhỏ là Đường sắt Hàng Giang đã được xây dựng.\n\nNhận thấy lợi ích kinh tế to lớn mà tuyến Hàng Giang mang lại, hội đồng kết luận rằng việc tiếp tục sửa chữa tuyến kết nối Chiết Giang và Giang Tây là một mệnh lệnh cấp thiết. Khởi công năm 1932 và hoàn thành một năm sau đó, chính quyền tỉnh đã hiện đại hóa đường ray, cải tạo 68 cây cầu và gia cố 16 cây cầu khác, đồng thời xây dựng Ga và Trạm bảo dưỡng Ngọc Sơn.\n\nCuối cùng, các Đốc quân Trần và Đặng đã giám sát dự án liên doanh kết nối một loạt tuyến đường sắt nhỏ, nối liền Nam Xương trực tiếp với Thượng Hải. Dù cái giá phải trả rất đắt với hơn 2.000 công nhân thiệt mạng trong quá trình thi công, tuyến đường sắt Chiết Cám hoàn thiện đã trở thành một biểu tượng tuyên truyền đáng giá cho lòng yêu nước của người Trung Hoa. Dù được AOG tài trợ nặng nề nhưng do các kỹ sư người Hoa thiết kế, Hội Cảnh Tinh đã ca ngợi đây là một thành công vang dội.\n\nTuy nhiên, những người kém lạc quan hơn đã nhanh chóng chỉ ra việc AOG có thêm quyền tiếp cận các mỏ khoáng sản trù phú cũng như gốm sứ Cảnh Đức Trấn — mặt hàng được cho là có giá rất cao tại Berlin. Dẫu sao, bất chấp những lo ngại, buổi lễ khai trương đã diễn ra an toàn mà không có cuộc tấn công nào từ Quốc dân Đảng."
 league_collapse_events.2.a: "Đường sắt mang lại sự thịnh vượng!"

 league_collapse_events.3.t: "Một thông báo bất ngờ"
 league_collapse_events.3.d: "Hít thở bầu không khí trong lành của Nam Kinh, Soái phủ Liên minh không khỏi tự hỏi cuộc đời mình sẽ ra sao nếu như không dấn thân vào việc củng cố Nam Trực Lệ. Liệu sẽ là một tướng lĩnh dưới trướng Ngô Bội Phu? Hay thậm chí là một nhà sư Phật giáo? Những suy nghĩ vẩn vơ ấy cứ lướt qua tâm trí ông. Làm Thống soái Liên minh chưa bao giờ là việc dễ dàng, nhất là khi kẻ thù lại nằm ngay trong chính doanh trại của mình. Mở tờ báo sáng, một cái cau mày lập tức hằn sâu trên gương mặt của Tiếu Diện Hổ. Dòng chữ in hoa to tướng, đậm nét: KẺ PHẢN BỘI. Phía dưới là hình ảnh của chính Thống soái Liên minh.\n\nChưa kịp định hình sự việc, sự tĩnh lặng của ông đã bị phá vỡ bởi một người tên Tiền Tông Trạch cùng toán lính đi kèm. Là một chỉ huy cấp dưới trong đoàn tùy tùng phụ trách an ninh đường sắt Chiết Giang và các nỗ lực cảnh sát cấp tỉnh, việc ông ta có mặt tại Phủ Soái là một cảnh tượng vô cùng kỳ lạ, chưa nói đến việc thảo luận theo cách đường đột thế này. Trước khi Tôn kịp gặng hỏi, Tiền đã vội lên tiếng.\n\n\"Thưa Tôn Soái, tôi vô cùng tạ lỗi, tôi đã tức tốc đến đây nhanh nhất có thể. Tôi không thể mạo hiểm để tin tức này lọt qua các bức điện tín. Đốc quân Tề đã vượt quá quyền hạn của mình, tự ý đàm phán một thỏa thuận với AOG để công khai mua lại và hợp nhất hàng loạt tuyến đường sắt phía đông dưới danh nghĩa Công ty Đường sắt Sơn Đông (Schantung-Eisenbahn-Gesellschaft) thuộc tập đoàn của họ. Bao gồm cả tuyến Chiết Cám vừa mới hoàn thành.\"\n\nNét mặt Thống soái càng lúc càng sa sầm, ông xua tay ra hiệu cho Tiền im lặng rồi quay lại đọc tờ báo. Đọc kỹ nội dung, nó tường thuật chi tiết thỏa thuận giữa Đốc quân Tề, sự ủng hộ công khai của ông ta đối với thương vụ này, và đòn trả đũa dữ dội từ Đốc quân Trần Điều Nguyên. Lên án Tề — và quy chụp cả Tôn — là những kẻ phản quốc bán đứng dân tộc, Trần đã tập hợp và phát động phong trào phản đối nhượng địa. Đổ thêm dầu vào lửa, hành động của Tề gần như đã dập tắt mọi hy vọng của những ai từng tin rằng tuyến đường sắt mới có thể đại diện cho một tương lai bình đẳng hơn giữa người Đức và người Hoa.\n\nQuát vang những mệnh lệnh, Mãnh Hổ rảo bước rời khỏi hang. Trong những ngày tiếp theo, nhiều cơ quan chức năng trong Liên minh bắt đầu cắt đứt liên lạc với cả Đốc quân Tề lẫn Đốc quân Trần. Tương tự, phản ứng của cảnh sát trước các cuộc biểu tình phản đối nhượng địa cũng chậm chạp hơn bình thường. Chắc chắn rằng, cả Tề và Trần sẽ phải gánh chịu hậu quả từ những gì chúng đã gieo rắc. Tôn Soái sẽ đảm bảo điều đó."
 league_collapse_events.3.a: "Có một điều Mãnh Hổ không bao giờ tha thứ: Bị gọi là kẻ bán nước."

 league_collapse_events.4.t: "Bất ổn lan rộng"
 league_collapse_events.4.d: "Không có gì đáng ngạc nhiên, việc công khai sáp nhập Đường sắt Trung Hoa vào sự quản lý của AOG cùng cơn bão truyền thông do Trần Điều Nguyên và phong trào Phản đối Nhượng địa thổi bùng lên đã vấp phải sự chỉ trích dữ dội khắp nơi. Giới trí thức thuộc Phong trào Tự trị Chiết Giang, Tổng hội Cứu quốc, Trung Quốc Thanh niên Đảng và thậm chí cả Nỗ Lực Xã đều đồng thanh lên án Thống soái Liên minh và Đốc quân Tề là những kẻ bán nước, phản trắc không biết liêm sỉ. Lời lẽ hùng hồn của họ được in đậm trên các tờ báo quốc nội, được các ấn phẩm Anh-Mỹ danh tiếng tại Thượng Hải tiếp sóng, và vang vọng khắp các bản tin của Đảng Nghiệp đoàn Trung Quốc dưới các sàn xưởng nhà máy. Tệ hơn nữa, dường như sự thật đã bị nhấn chìm hoàn toàn bởi cơn thịnh nộ của quần chúng.\n\nBị vơ đũa cả nắm cùng tên đê tiện Đốc quân Tề, Tôn Truyền Phương đã phải hứng chịu sự lên án từ Hiệp hội Thương nhân Hạ lưu Trường Giang, và thậm chí cả sự phản đối nửa vời từ chính những người bạn của ông trong Hội Cảnh Tinh. Tin tức lan truyền với tốc độ chóng mặt qua truyền miệng, thổi bùng lên một làn sóng phẫn nộ dữ dội đến mức kinh ngạc. Tiếu Diện Hổ vốn dĩ tài ba thao lược cuối cùng cũng đã bị dồn vào chân tường.\n\nNhững lời đồn thổi dân gian giờ đây thêu dệt nên những mạng lưới âm mưu chằng chịt, sự mất tích của những nhân vật dám lên tiếng chỉ trích, và việc hàng triệu Nhân dân tệ được cho là đã chảy thẳng vào túi Thống soái Liên minh. Đương nhiên, công chúng phản ứng với sự giận dữ tột cùng, và các cuộc biểu tình đã nhanh chóng lan rộng từ Chiết Giang, Giang Tây đến các thành phố ven biển lớn, thậm chí tràn vào cả các khu tô giới nước ngoài.\n\nThế nhưng, bên trong dinh thự của Tôn lại là một con người suy sụp. Sau tất cả những gì đã cống hiến, liệu đây có phải là hồi kết cho đế chế của ông? Không thể nào, ông tài giỏi hơn thế này nhiều. Chẳng lẽ lại như vậy sao? Bị phản bội không chỉ bởi những người nông dân mà ông hằng chăm sóc như bậc cha mẹ, mà đồng thời còn bởi cả những kẻ trí thức mà ông từng kính trọng. Lẽ dĩ nhiên ông không thể ngồi yên khoanh tay đứng nhìn! Tiếu Diện Hổ đã từng vượt qua những nghịch cảnh tồi tệ hơn nhiều, và tham vọng của ông còn lớn lao hơn thế này gấp bội. Dẫu vậy, ngay cả những cận thần thân tín nhất như Tạ Hồng Huân và Lưu Tông Kỷ cũng có thể nhìn thấy rõ sự mệt mỏi, rệu rã đang bào mòn vị Thống soái huyền thoại."
 league_collapse_events.4.a: "Sao họ không hiểu chứ? Ta cũng yêu mảnh đất này mà!"

 league_collapse_events.5.t: "Tấn công người ngoại quốc"
 league_collapse_events.5.d: "Bị đánh thức sau một giấc ngủ chập chờn, Thống soái Liên minh lại một lần nữa bị đội ngũ tình báo mẫn cán của mình quấy rầy. Liên tục theo dõi sát sao diễn biến tình hình dồn dập gần đây, một viễn cảnh còn rắc rối và đáng báo động hơn rất nhiều đang dần hiển hiện. Được dẫn đến bàn làm việc và trao tận tay một xấp điện tín dưới ánh bình minh hé rạng, một câu chuyện đầy bất an mở ra trước mắt ông.\n\nBắt đầu bằng những vụ hành hung nhắm vào các công dân và thương gia người Đức nổi tiếng, tình hình nhanh chóng biến tướng thành những vụ tấn công bừa bãi. Làn sóng tấn công người nước ngoài được tiếp tay bởi những công dân tự xưng là \"yêu nước\" đã bắt đầu bùng phát tại các tỉnh Phúc Kiến, Giang Tây và An Huy. Tệ hơn nữa, tâm lý phẫn nộ và khát máu của quần chúng đã khiến những hành động này lan truyền như cháy rừng, gần như nhấn chìm toàn bộ các huyện lỵ trong cơn thịnh nộ.\n\nĐể đáp trả, lãnh sự quán Đức tại Nam Kinh đã khuyến cáo thần dân của Kaiser tự vũ trang, và các chính phủ châu Âu khác cũng đưa ra khuyến cáo tương tự. Ban hành những cảnh báo rằng người nước ngoài chỉ nên di chuyển khi thực sự cần thiết, dường như ngay cả những đồng minh mà Thống soái Liên minh vốn chẳng mấy ưa chuộng này cũng đang bắt đầu quay lưng lại với ông.\n\nTác động toàn diện của các cuộc tấn công này đối với hoạt động kinh doanh và đầu tư vẫn chưa thể đo đếm hết, nhưng những bài học lịch sử gần đây cho thấy Sở Giao dịch Chứng khoán Thượng Hải chắc chắn sẽ không thể đứng ngoài vòng xoáy. Nền cai trị sáng suốt của ông đang bị vây hãm từ bốn phía. Mây đen đang vần vũ trên bầu trời Nam Kinh..."
 league_collapse_events.5.a: "Lâu đài cát bắt đầu sụp đổ."

 league_collapse_events.6.t: "Tẩy chay và Bắc Kinh"
 league_collapse_events.6.d: "Vẫn luôn là một kẻ tráo trở, cơ hội không đáng tin cậy, và có lẽ chính là ngọn nguồn của làn sóng phẫn nộ bị thổi phồng này, Đốc quân Trần Điều Nguyên đã bắt đầu kích động các cuộc thảo luận trong giới trí thức và nông dân về một cuộc tổng tẩy chay toàn bộ hàng hóa của Đức. Lời kêu gọi ấy nhanh chóng lan truyền và hòa cùng làn sóng biểu tình ngày một dâng cao khắp miền Đông Trung Hoa; chúng được các điệp viên Quốc dân Đảng của Đái Xuân Phong, giới trí thức và các nhà tư tưởng dân tộc chủ nghĩa đẩy xa hơn nữa, vượt khỏi thông điệp ban đầu của Đốc quân Trần để trở thành một cơn bão nổi loạn thực sự.\n\nĐáng lo ngại nhất là việc một số binh sĩ đồn trú địa phương tại An Huy, Chiết Giang và Giang Tô đã lùi bước, làm ngơ cho tình trạng bất ổn lan rộng vì không muốn chịu rủi ro bị gán mác \"Hán gian\". Tuy nhiên, với lòng trung thành tuyệt đối, các Đốc quân Đặng và Chu đã ủng hộ Thống soái Liên minh trong mọi vấn đề quốc gia, bởi họ hiểu rõ từ hậu trường sự căm ghét tột cùng mà Tôn dành cho các đặc quyền nhượng địa. Về phần mình, Tổng đốc Lục Dụ Quang và Đốc quân Thẩm Hồng Anh vẫn giữ im lặng trước diễn biến trước mắt, dù Tôn hiểu họ đủ rõ để nhận ra ít nhất là sự ngầm ủng hộ từ Thẩm.\n\nĐốc quân Triệu Hằng Dịch thì phát biểu ủng hộ cuộc tẩy chay trước Hội đồng Tỉnh Hồ Nam, nhưng đồng thời cũng đưa ra lời cam đoan rằng ông vẫn kiên định với lập trường trung lập của Hồ Nam. Tệ hơn nữa, dường như mớ hỗn độn đang diễn ra trong Liên minh đã không lọt qua được mắt của Ngọc Soái hay Bảo Định Vương. Tôn Soái đã nhận được tin báo rằng Bắc Trực Lệ có thể đang soạn thảo một cuộc điều tra chính thức. Những báo cáo sai lệch đã được gửi về Bắc Kinh, và rõ ràng là Ngọc Soái đang muốn gây áp lực buộc người học trò cũ của mình phải đưa ra một câu trả lời dứt khoát.\n\nĐể ngăn chặn sự can thiệp từ Bắc Kinh, các cố vấn trong Ủy ban Nam Kinh (Nanking-Kommission) cùng những người như Trịnh Tuấn Ngạn và Tạ Hồng Huân đã đề xuất Thống soái Liên minh tuyên bố công khai lẫn bí mật rằng tình hình vẫn hoàn toàn nằm trong tầm kiểm soát. Dù khiến chúng ta bị cô lập, điều này sẽ ngăn không cho Đốc quân Tiêu của Hồ Bắc hay Đốc quân Lý của Hà Nam điều động quân đội. Vốn dĩ im hơi lặng tiếng trước các biến cố, Đốc quân Trần Nghi cuối cùng đã chủ động liên lạc với Tôn, đề nghị triển khai các đơn vị thuộc một vài sư đoàn của ông đóng tại Nam Kinh và Chiết Giang đến các thành phố dọc hạ lưu Trường Giang, nơi các cuộc biểu tình đang diễn ra dữ dội nhất. Cùng lúc đó, các đồn binh cấp tỉnh cũng yêu cầu được bật đèn xanh để thực hiện mọi biện pháp cần thiết nhằm dập tắt sự chống đối công khai."
 league_collapse_events.6.a: "Mãnh Hổ biết khi nào cần phải giáng đòn sấm sét."
 league_collapse_events.6.b: "Nhưng ta cũng có trái tim, chỉ trừng phạt những kẻ bạo lực."

 league_collapse_events.7.t: "Đánh bom đường sắt"
 league_collapse_events.7.d: "Thêm nhiều tin tức đáng lo ngại lại vang lên khắp các vùng lãnh thổ của Liên minh. Dường như một loạt vụ nổ đã làm rung chuyển nhiều nhà ga và tuyến đường ray dự kiến sáp nhập vào Đường sắt Trung Hoa, trong đó một quả bom đã xé toạc toa tàu tại một nhà ga đông đúc ở Hàng Châu, khiến hàng chục người thiệt mạng và bị thương. Tin tức này đã làm chấn động sâu sắc giới công chức, quan chức cũng như các đốc quân; những cái chết và sự đình trệ đã đẩy nhiều gia đình vào cảnh tang thương. Nhìn một cách thực tế, những hành vi phá hoại vô chính phủ trắng trợn này cũng đã làm tê liệt phần lớn ngành giao thông vận tải ở nhiều khu vực, cản trở việc Thống soái Tôn nhanh chóng điều động thêm lực lượng nhằm dập tắt bất ổn đang leo thang và trừng trị các Đốc quân Trần và Tề.\n\nTrách nhiệm về các vụ tấn công đã bị đổ lỗi cho nhiều đối tượng khác nhau, trong khi các sĩ quan tình báo của Tôn không thể xâu chuỗi được gì từ mớ hỗn độn này. Thổ phỉ địa phương gây rối để thừa cơ cướp phá? Quốc dân Đảng nuôi hy vọng dọn đường cho một cuộc khởi nghĩa lớn hơn? Đốc quân Tề hay Trần muốn ngăn chặn đòn trừng phạt từ Nam Kinh? Hay thậm chí là người Nhật đang nhắm tới việc gieo rắc thêm mầm mống bất hòa? Một số kẻ theo thuyết âm mưu còn đặt dấu hỏi về sự dính líu của chính người Đức, cho rằng họ đang tự nhắm vào tài sản của mình để tạo cớ can thiệp quân sự."
 league_collapse_events.7.a: "Những người vô tội lại phải đổ máu..."

 league_collapse_events.8.t: "Báo cáo từ Bắc và Nam"
 league_collapse_events.8.d: "Dường như mỗi ngày mới đều mang theo những tin tức tồi tệ; năm Bính Tý này quả thực đang chứng minh là một tai họa khôn lường. Những báo cáo đáng ngại tiếp tục bay về Phủ Soái từ cả Từ Châu lẫn Tuyền Châu. Tại Vùng Khởi nghĩa Mân Cám, có vẻ như các đội du kích Quân Đội Cách Mạng Quốc Dân của Quốc dân Đảng đã tiến hành một loạt cuộc đột kích ngày càng táo bạo, đánh phá xung quanh các thành phố nội địa như Vĩnh Định và Long Nham. Đốc quân Chu Âm Nhân từ lâu đã phải vật lộn để duy trì quyền kiểm soát đối với tỉnh miền núi này, khi mà quyền lực thực tế của ông thường chỉ giới hạn ở dải ven biển và các thành phố lớn sâu trong đất liền.\n\nGiờ đây, trước sự kiên cường và liều lĩnh ngày một tăng của quân KMT, sự kìm kẹp bằng bàn tay sắt của Chu càng trở nên mong manh hơn bao giờ hết. Trong khi đó, tại biên giới phía bắc Giang Tô, Đốc quân Tề lại gửi về những báo cáo hết sức bất thường về tình trạng quấy nhiễu gia tăng của các toán thảo khấu nông thôn và việc các gia tộc này đánh chiếm các ngôi làng. Vốn không phải kẻ ngốc, Tôn Soái thừa hiểu những trò hề của Tề với cái gọi là \"gia tộc thổ phỉ\", mà thực chất chẳng phải ai khác ngoài chính binh lính của hắn ta. Vốn là điểm gây bức xúc và tranh cãi lâu năm giữa Đốc quân và Thống soái, sự dính líu trở lại của chúng rất có thể đang tiếp tay cho làn sóng nổi loạn ngày càng dâng cao.\n\nDù vậy, với tính cẩn trọng, Thống soái Tôn đã ra lệnh điều động một loạt sư đoàn vốn đang hỗ trợ duy trì trật tự ở Giang Tây và Phúc Kiến hành quân lên phía bắc, cân nhắc thiệt hơn và ưu tiên giữ cho vùng Giang Tô trù phú tiếp tục nằm dưới gót sắt thống trị. Tuy nhiên, một số người trong vòng thân cận lại rỉ tai nhau rằng Tiếu Diện Hổ đang thắt chặt chiếc thòng lọng hơn nữa quanh cổ hai Đốc quân Trần và Tề."
 league_collapse_events.8.a: "Tên khốn đó chắc chắn đang mưu tính điều gì!"

 league_collapse_events.9.t: "Điện tín từ Bắc Kinh"
 league_collapse_events.9.d: "Bất chấp những màn giả vờ và xua tay trấn an của chúng ta, Ngọc Soái và Bảo Định Vương kiên trì khôn cùng đã gửi liên tiếp những bức điện tín chất vấn tới Nam Kinh. Vốn là những nhà lãnh đạo trên danh nghĩa của đất nước kể từ sau Chiến tranh Trực - Phụng lần thứ ba, Thống chế Ngô Bội Phu và Tổng thống Tào Côn nắm giữ tầm ảnh hưởng cực lớn, ngay cả đối với Thống soái Liên minh. Bất chấp những bất hòa, cuộc chạy đua vũ trang âm thầm giữa Tiếu Diện Hổ và Ngọc Soái, cùng bức tranh đa cực giữa Bắc và Nam Trực Lệ, thì Ngô Bội Phu rốt cuộc vẫn là ân sư của Tôn, và điều đó mang theo một mối dây liên kết không thể phá vỡ. Tương tự, những người trong vòng thân tín của Tôn cũng vô cùng e sợ tài thao lược quân sự của Ngô, thủ đoạn chính trị của Tào và toàn bộ sức mạnh của Bắc Trực Lệ đổ ập xuống đầu họ.\n\nBức thông điệp yêu cầu một bản báo cáo chi tiết về tình hình hỗn loạn đang diễn ra tại các vùng lãnh thổ Đông Nam. Hùng hồn, kiên quyết và đầy tính áp đặt, bức điện được diễn đạt rõ ràng với ý đồ ép Thống soái Liên minh phải thừa nhận sự yếu kém hay khó khăn, coi đó như cái cớ để quân đội Trung ương tiến vào và \"tái lập trật tự\". Từng liên tục tìm cách can thiệp, kiểm soát và mở rộng ảnh hưởng xuống phía nam sau khi Liên minh được thành lập vào năm 1928, mọi nỗ lực của họ đều bị Tôn hóa giải một cách tài tình.\n\nVốn là một chính khách lão luyện, phản hồi của Tôn phải thật chừng mực, thận trọng, cân nhắc mọi yếu tố mà ông cần dung hòa: ân sư và đệ tử, miền Bắc và miền Nam, cùng sự ổn định của bờ cõi đối trọng với sự ổn định của cả quốc gia. Bàn bạc cùng cố vấn thân cận đầy mưu lược Ngụy Đạo Phong, vị Thống soái chắp bút viết..."
 league_collapse_events.9.a: "\"Mọi thứ vẫn trong tầm kiểm soát.\""

 league_collapse_events.10.t: "Sự biến Vu Hồ"
 league_collapse_events.10.d: "Thành phố Vu Hồ, tọa lạc tại ngoại vi Nam Kinh và trên danh nghĩa thuộc quyền tài phán của Đốc quân An Huy Trần Điều Nguyên, đã trở thành một điểm nóng đặc biệt gay gắt của phong trào phản kháng và bất ổn. Với việc Nam Kinh nằm dưới sự kiểm soát trực tiếp của Thống soái Liên minh, nơi đây vẫn tương đối yên bình và ổn định so với các ổ bạo loạn như Hạ Môn hay Từ Châu. Do đó, hầu hết những người bất đồng chính kiến tại Nam Kinh muốn tiếng nói của mình được lắng nghe đều đã đổ về tham gia biểu tình tại Vu Hồ, thay vì hành động công khai ngay dưới mũi Tôn Soái.\n\nNhờ sự bao che và làm ngơ của Đốc quân Trần, họ đã hoạt động tương đối tự do, dần đẩy tình trạng của thành phố rơi vào cảnh hỗn loạn vô chính phủ. Với sự suy sụp của kỷ cương chính quyền, việc sự cố mới nhất này xảy ra là điều không thể tránh khỏi. Trong một cuộc biểu tình theo lịch trình định kỳ diễn ra vào chiều hôm qua — một cảnh tượng giờ đây quá đỗi quen thuộc trong Liên minh — lượng người tham gia đã tăng vọt ngoài dự kiến. Được kích động bởi Đảng Nghiệp đoàn Trung Quốc, hàng loạt công nhân đình công từ các nhà máy do Đức sở hữu gần đó đã ùa ra củng cố các cuộc bạo động, nhanh chóng vượt khỏi tầm kiểm soát của cảnh sát.\n\nLực lượng đồn trú, được tăng viện bởi một bộ phận binh lính do Đức huấn luyện vừa đến từ Nam Kinh, đã cố gắng vãn hồi trật tự trong tuyệt vọng, nhưng giữa cuộc hỗn chiến hỗn loạn, một nhóm người đã nổ súng. Dù thủ phạm vẫn chưa được xác định, đống tro tàn để lại sau đó quả thực là một thảm họa. Chỉ trong vòng vài phút, cảnh sát, lính đồn trú và quân tiếp viện bắt đầu nổ súng vào đám đông, và bị bắn trả dữ dội. Hơn hai trăm người được xác nhận đã chết, với số người bị thương có thể gấp bốn lần con số đó, và làn sóng phẫn nộ bùng lên đã ngay lập tức châm ngòi cho các cuộc biểu tình ở khắp các vùng lân cận.\n\nTình hình càng trở nên tồi tệ hơn bởi sự hiện diện của một khu định cư nhỏ của người nước ngoài trong thành phố. Nhiều người đã lên tiếng tố cáo rằng vũ lực gây chết người chỉ được sử dụng nhằm bảo vệ những người ngoại quốc này, và các vụ tàn sát chắc chắn sẽ xuất hiện trên trang nhất của các tờ báo quốc tế vào sáng mai. Hơn nữa, Đốc quân Trần đã lợi dụng tình hình để chính thức yêu cầu toàn bộ binh lính của Liên minh Bát tỉnh phải rút khỏi địa phận An Huy, một động thái mở đường cho khả năng ly khai của ông ta. Những hành động này đã khiến Thống soái Liên minh và bộ sậu thân cận tin rằng Trần Điều Nguyên chính là kẻ chủ mưu đứng sau giật dây..."
 league_collapse_events.10.a: "Tên phản nghịch đó! Hắn làm vậy thì được cái gì chứ?!"

 league_collapse_events.11.t: "An Khánh từ chối tiếp tục hợp tác"
 league_collapse_events.11.d: "Tiếp nối yêu sách của mình, Đốc quân Trần đã công khai tuyên bố ly khai chính thức mà chẳng thèm đợi câu trả lời từ Thống soái Liên minh. Viện dẫn sự kiện đẫm máu tại Vu Hồ gần đây, yêu cầu của ông ta đã biến thành một tối hậu thư đòi hỏi sự rút quân hoàn toàn và tuyệt đối của mọi lực lượng không thuộc biên chế tỉnh khỏi An Huy, cũng như yêu cầu bàn giao ngay lập tức những sĩ quan chịu trách nhiệm cho Sự biến Vu Hồ. Khá mỉa mai, Trần còn đoan chắc với Thống soái Liên minh rằng binh lính của ông ta sẽ tiếp tục \"dẹp yên tình trạng bất ổn và hỗn loạn đang lan rộng\", cứ như thể bấy lâu nay ông ta từng mảy may làm điều đó vậy.\n\nTừ chối hợp tác hơn nữa với chính quyền Liên minh, ông ta còn kịch liệt lên án việc thành lập tuyến Đường sắt Trung Hoa, cáo buộc dự án này đã \"đẩy những công dân yêu nước đến bờ vực tuyệt vọng\". Vốn từ lâu đã là một cái gai trong mắt chúng ta, dường như \"Trần Ngốc Tử\" cuối cùng đã ngửa bài. Bằng việc tiếp tay và thổi bùng ngọn lửa phẫn nộ của công chúng chống lại Liên minh và Thống soái, quá rõ ràng rằng Trần chỉ đang viện cớ để tìm một lý do chính đáng hợp thức hóa nền độc lập của mình khỏi nanh vuốt của Tiếu Diện Hổ.\n\nTrong bất kỳ hoàn cảnh bình thường nào, hành vi này chắc chắn sẽ phải hứng chịu đòn trừng phạt tức khắc, mau lẹ và tàn bạo. Tuy nhiên, lập trường của Đốc quân Trần, các mối quan hệ mật thiết với phe chống nhượng địa và chiến dịch truyền thông biến ông ta thành một vị anh hùng dân tộc đã tạo nên sự e dè nhất định cho Thống soái Liên minh. Một hành động quyết liệt lúc này rất có thể sẽ càng xé toạc Liên minh vốn đã mong manh. Dẫu vậy, không phải là người chấp nhận ngồi yên chịu nhục, Thống soái Tôn đã chính thức lệnh cho những tướng lĩnh trung thành nhất của mình gồm Tạ Hồng Huân, Lưu Tông Kỷ, Mạnh Chiêu Nguyệt và Mã Ngọc Nhân chuẩn bị sẵn sàng quân sĩ cho một cuộc giao tranh tổng lực với Quân đội An Huy."
 league_collapse_events.11.a: "Ngày tàn của hắn sẽ đến, nhưng tiếc là chưa phải lúc này."
 league_collapse_events.11.b: "Hãy cùng gia nhập với Đốc quân Trần! (Chơi phe An Khánh)"

 league_collapse_events.12.t: "Mãng xà trong hang cọp"
 league_collapse_events.12.d: "Với những lời lẽ huênh hoang giả tạo cùng chiến dịch càn quét bài trừ nhượng địa của Trần Điều Nguyên ở phía tây, cộng với mớ hỗn loạn cướp bóc của Quốc dân Đảng ở phía nam, tầm quan trọng hàng đầu của tỉnh Giang Tô — vượt lên trên cả sự giàu có của nó — đã trở thành yếu tố sống còn mang tính chiến lược đối với sự tồn vong của Liên minh trong những cuộc xung đột sắp tới. Nằm ngay phía bắc Chiết Giang và là mắt xích then chốt trong tuyến hàng hải từ Singapore đến lãnh thổ của Tôn, việc giữ cho Giang Tô được ổn định trong thời kỳ hỗn loạn này là một mệnh lệnh tối thượng.\n\nNuôi dưỡng dã tâm từ lâu, Đốc quân Tề Tạ Nguyên từng là quân phiệt Trực hệ thống trị toàn bộ vùng Giang Nam, kiểm soát cả Giang Tô, Chiết Giang và An Huy vào thời kỳ đỉnh cao quyền lực của mình. Khi chính quyền Trực hệ ở Bắc Kinh sụp đổ trước liên quân phản trắc của Phùng Ngọc Tường và Phụng hệ, phần lớn tàn dư của Tân Bảo phái đã dạt về Giang Tô, khiến chính phủ Bắc Kinh mới phê chuẩn một cuộc xâm lược vào tỉnh này. Bị dồn ép phải chạy sang Chiết Giang láng giềng thân thiện, Tề cuối cùng đã quay trở lại nhưng nhận thấy quyền lực của mình tại Giang Tô đã bị lung lay dữ dội bởi sự trỗi dậy của Tôn ở Nam Kinh. Dù Tề vẫn luôn tỏ ra là một đồng minh trung kiên của Thống soái Liên minh, Tôn không thể không nghi ngờ tham vọng cháy bỏng của viên tướng này.\n\nĐể kiềm tỏa vị tướng dưới quyền số một của mình, Tôn đã phái Thượng Quan Vân Tương và Trịnh Tuấn Ngạn đến giám sát Tổng tư lệnh Giang Tô, đảm bảo ông ta sẽ tiếp tục ủng hộ vị thế tối thượng của Nam Kinh. Dù có vẻ như chính viên tướng thân cận khác của Tôn là Trần Điều Nguyên mới là kẻ chớp lấy thời cơ từ Thảm sát Vu Hồ, Tôn vẫn tin chắc rằng Tề Tạ Nguyên mới là mối đe dọa lớn hơn đối với quyền lực của mình. Tạm thời, Tôn chưa tìm thấy lý do cụ thể nào để nghi ngờ sự phản trắc từ Giang Tô, nhưng ông đủ khôn ngoan để biết rằng không bao giờ được phép để mắt rời khỏi Tề."
 league_collapse_events.12.a: "Ta biết chắc mẩm hắn đang mưu tính chuyện gì đó!"

 league_collapse_events.13.t: "Căng thẳng trên sông Trường Giang"
 league_collapse_events.13.d: "Làn sóng phẫn nộ vang vọng khắp các ngả đường An Huy — 'Đòi lại công lý cho Vu Hồ; quét sạch lũ ngoại bang!' Đốc quân Trần Điều Nguyên đã đứng lên đón đầu ngọn cờ thử thách, và những đặc vụ của chính quyền Nam Kinh đang bị trục xuất hàng loạt khỏi bờ cõi tỉnh. Gần như chỉ qua một đêm, Trần đã được tung hô như một người bảo hộ của nhân dân, nhưng giờ đây các lực lượng của ông đang rơi vào các cuộc đối đầu căng thẳng dọc khắp hạ lưu Trường Giang, và câu hỏi lớn được đặt ra là: bước tiếp theo sẽ là gì? Một số người kêu gọi lật đổ hoàn toàn chính quyền Nam Kinh, nhưng những tiếng nói thực tế hơn lại chỉ ra những cơ hội chiến lược ngàn vàng.\n\nTrần từ lâu đã nổi tiếng với khả năng tính toán rủi ro đầy chuẩn xác, và thời khắc này cũng không phải là ngoại lệ."
 league_collapse_events.13.a: "Đốc quân vạn tuế!"

 league_collapse_events.14.t: "Thỉnh cầu viện trợ từ Ngô Bội Phu?"
 league_collapse_events.14.d: "Khi ngọn lửa hỗn loạn bùng phát khắp Bát tỉnh, Trần nhận thức sâu sắc rằng vị thế của chính mình cũng có thể sớm bị đe dọa. Để tránh nguy cơ sụp đổ ngay lập tức hoặc phải hứng chịu một đòn quân sự mang tính quyết định từ kẻ thù, chúng ta buộc phải tìm kiếm đồng minh. Ngô Bội Phu, Ngọc Soái lừng lẫy và là người nắm thực quyền của chính phủ Bắc Dương, đang sở hữu lực lượng quân sự hùng mạnh nhất miền Đông Trung Hoa và có thể trở thành một chỗ dựa vững chắc; có những tin đồn rằng ông ta có thể đang che giấu lòng trung thành của mình và muốn giúp đỡ sự nghiệp chống nhượng địa của chúng ta. Sẽ là không khôn ngoan nếu ngay lập tức ngửa tay xin sự hậu thuẫn toàn diện, vì vậy, tốt nhất chúng ta chỉ nên đề nghị ông ấy hỗ trợ ngân sách cho binh lính của mình."
 league_collapse_events.14.a: "Gửi bức điện tín đi."

 league_collapse_events.15.t: "Trần Điều Nguyên gửi điện tín"
 league_collapse_events.15.d: "\"Kính gửi Đại Tổng thống Tào Côn tôn kính, và Thống chế Ngô Bội Phu,\n\nTôi, Đốc quân Trần Điều Nguyên, khẩn thiết kính xin được cấp thêm ngân sách quân nhu đặc biệt cho binh sĩ của mình. Như đã được quy định rõ trong hiến pháp của quốc gia vĩ đại chúng ta, chính phủ trung ương có trách nhiệm chu cấp ngân sách cho các đốc quân địa phương để dẹp yên bạo loạn. Trong bối cảnh tình hình của Thống soái Liên minh Tôn Truyền Phương tại Nam Kinh vẫn còn mập mờ bất định, tôi đã tự gánh vác trọng trách bảo vệ tỉnh An Huy trước sự quấy phá của thổ phỉ và các phần tử cánh tả kích động.\"\n\nĐược chuyển tới dưới dạng một bức điện tín gửi cho Tào Côn và chuyển tiếp tới Ngô Bội Phu vào sáng nay, giọng điệu bức điện đã khiến cả hai người bất ngờ vì sự táo bạo của nó, dường như đang đặt Ngọc Soái và Bảo Định Vương vào thế khó bằng cách viện dẫn các điều khoản của hiến pháp. Bằng việc vờ như đã vãn hồi trật tự cho tỉnh nhà, Trần rõ ràng đang đánh cược để tìm kiếm sự ủng hộ từ Chính phủ Trung ương nhằm bành trướng thế lực vượt ra ngoài phạm vi An Huy.\n\nĐứng trước một sự lựa chọn vô cùng nan giải: ủng hộ Trần có thể giúp họ loại bỏ một quân cờ bất kham khỏi bàn cờ, thay thế nó bằng một kẻ phải chịu ơn sự giúp đỡ của mình thay vì một Liên minh khó bảo. Tuy nhiên, mang theo gánh nặng từ phong trào phản đối nhượng địa kiên quyết của Trần, sự hậu thuẫn của Ngô và Tào có thể dẫn đến việc làm phật lòng nước Đức về lâu dài — một mối quan hệ mà Tào đã dày công vun đắp suốt nhiều năm qua. Đồng thời, việc đứng về phía những người chống nhượng địa sẽ cho phép Ngô và Tào một lần nữa xuôi theo ý chí của quần chúng nhân dân, cưỡi lên làn sóng ủng hộ tương tự như năm 1922."
 league_collapse_events.15.a: "Gửi viện trợ đi, nó sẽ bảo đảm lợi ích của chúng ta."
 league_collapse_events.15.b: "Từ chối. Không một xu nào cho bọn phản loạn!"

 league_collapse_events.16.t: "Ngô Soái chấp thuận yêu cầu của chúng ta"
 league_collapse_events.16.d: "Thống chế Ngô Bội Phu đã phúc đáp bức điện tín gần đây nhất của chúng ta, bày tỏ sự đồng cảm sâu sắc với nhân dân An Huy cùng lòng ngưỡng mộ trước sự cống hiến của họ cho chủ nghĩa dân tộc Trung Hoa. Tuy nhiên, trong bức thư hoa mỹ này, Thống chế Ngô chưa bao giờ tuyên bố một cách dứt khoát liệu Bắc Kinh có thực sự hành động để giúp đỡ An Khánh hay không. Đốc quân Trần bị đẩy vào một tình thế tiến thoái lưỡng nan khi thời gian để quyết định chẳng còn bao nhiêu. Liệu có đáng để tiếp tục kỳ kèo với Thống chế Ngô, hay những ngày hòa bình quý giá còn lại nên được dành cho một kế hoạch sinh tồn ngoại giao khác?"
 league_collapse_events.16.a: "Thấy chưa? Ta đã nói gì nào!"
 league_collapse_events.16.b: "Vô ích thôi. Lão ta chẳng qua chỉ là con chó săn của người Đức."

 league_collapse_events.17.t: "Thư cảm ơn từ Đốc quân Trần"
 league_collapse_events.17.d: "Bằng những nét thư pháp điêu luyện nhất cùng loại mực thượng hảo hạng, Đốc quân Trần đã gửi một bức thư bày tỏ lòng cảm kích chân thành tới Thống chế Ngô Bội Phu và Đại Tổng thống Tào, ca ngợi Nội các và các Bộ ngành vì sự tận tụy trong việc củng cố Tinh thần Đoàn kết Trung Hoa. Trấn an Bắc Kinh về ý định đặt ưu tiên hàng đầu vào việc bảo vệ chủ quyền quốc gia, ông tuyên bố chấm dứt sự can thiệp của phương Tây vào Thung lũng Trường Giang, đồng thời nhiệt liệt khẳng định niềm tin của chính phủ vào công cuộc thống nhất Trung Hoa và việc trục xuất các thế lực đế quốc thực dân ngoại bang mà họ đang phải đối mặt.\n\nPhản ứng khá dè dặt trong các cuộc gặp kín, Ngô và Tào cùng thở phào nhẹ nhõm trước sự ổn định bước đầu của tình hình. Với việc lôi kéo thành công một Đốc quân có uy tín trong các tỉnh thuộc Liên minh, có lẽ một kỷ nguyên thịnh vượng mới không còn bóng dáng của các thế lực đế quốc đã cận kề ngay trước mắt."
 league_collapse_events.17.a: "Khá khéo mồm khéo miệng đấy chứ."

 league_collapse_events.18.t: "Bị \"Kẻ Khờ\" phản bội"
 league_collapse_events.18.d: "Bất chấp những nỗ lực của Chính phủ Trung ương nhằm dỗ dành và lôi kéo Đốc quân Trần về với vòng tay Trực hệ thông qua các nước cờ ngoại giao của Tào Côn, viện trợ tài chính từ các ngân hàng của Vương Khắc Mẫn và hỗ trợ quân sự từ Ngọc Soái, có vẻ như Đốc quân Trần đã cự tuyệt mọi nỗ lực thương thuyết của chúng ta. Hắn ta ngày càng trở nên xa cách và vượt khỏi tầm với trong các cuộc liên lạc gần đây.\n\nMột trong những lính biên phòng của chúng ta đã phát hiện những người tị nạn tràn vào lãnh thổ mang theo truyền đơn của Hắc Long Hội — tổ chức bán quân sự khét tiếng của Nhật Bản. Giờ đây, giữa khoảng trống im lặng từ các nhà lãnh đạo An Khánh, những dấu hiệu đáng báo động hơn lại tiếp tục xuất hiện. Đốc quân Trần Nghi của Chiết Giang, kẻ tai tiếng với mối liên hệ với Hắc Long Hội, đã bị những người tị nạn khác bắt gặp xuất hiện tại An Khánh. Các điệp viên tình báo của chúng ta nghi ngờ cao độ rằng vị Đốc quân này không chỉ đang cố tình phản bội Đại Tổng thống Tào, Thống chế Ngô và Hoàng đế, mà còn phản bội cả dân tộc Trung Hoa khi bí mật thiết lập mối liên lạc với mạng lưới tình báo của Nhật Bản."
 league_collapse_events.18.a: "Lũ lùn Nhật Bản chết tiệt!"

 league_collapse_events.19.t: "Ngô Soái cự tuyệt yêu cầu của Trần Điều Nguyên"
 league_collapse_events.19.d: "Trong một bức thư khác do Thống chế Ngô gửi tới, dường như mọi tiếng nói chung giữa ông và Đốc quân Trần đã hoàn toàn đổ vỡ. Bức thư của Thống chế Ngô nghiêm khắc khiển trách Trần vì canh bạc liều lĩnh mà ông ta đang đặt lên lưng người dân An Huy, và cảnh báo về một kết cục không thể tránh khỏi là cái chết của Trần nếu không chịu quy phục Nam Kinh. Bước ngoặt này đã đẩy lùi hoàn toàn nỗ lực tìm kiếm sự ủng hộ từ Bắc Kinh của chúng ta, trong khi thời gian thì đang cạn kiệt từng ngày.\n\nTuy nhiên, một cơ hội thứ hai dường như đang mở ra dưới hình bóng của viên tướng đầy tai tiếng Trần Nghi — người có tin đồn nắm giữ các mối liên hệ với Hắc Long Hội, có thể giúp chúng ta tiếp cận được Đại sứ Nhật Bản tại Thiên Tân, và thông qua đó, bắc nhịp cầu tới Chính phủ Phụng Thiên. [ANQ.GetLeader] hoàn toàn ý thức được mối nguy hiểm mà việc cấu kết với Phụng Thiên có thể gây ra cho thanh danh của phong trào phản đối nhượng địa, nhưng trong bối cảnh Ngô Soái vẫn khăng khăng từ chối, chúng ta hầu như không còn sự lựa chọn nào khác."
 league_collapse_events.19.a: "Đã đến lúc phải đến Phụng Thiên."

 league_collapse_events.20.t: "Trần Điều Nguyên tiếp cận Trần Nghi"
 league_collapse_events.20.d: "Trần Nghi, Đốc quân của tỉnh Chiết Giang đầy quyền lực vẫn đang nằm trong Liên minh, đã chủ động tiếp cận Trần Điều Nguyên để bàn chuyện hợp tác. Hối thúc người đồng cấp rằng tương lai thực sự của Trung Hoa nằm ở Chính phủ Phụng Thiên chứ không phải triều đình Mãn Thanh, ông ta hứa rằng nếu Trần Điều Nguyên chịu cam kết trung thành với Trương Tác Lâm — thủ lĩnh Phụng Thiên, Trần Nghi sẽ dốc toàn lực ủng hộ trong cuộc chiến sắp tới.\n\nVị thế của Trần Nghi tại Chiết Giang mang lại cho ông một nguồn lực tài chính dồi dào cùng binh lực hùng hậu để bảo chứng cho những lời hứa này, và trong bối cảnh Ngô Bội Phu vẫn kiên quyết ủng hộ Nam Kinh, dường như chúng ta không còn cách nào khác ngoài việc nắm lấy cơ hội và cầu mong điều tốt đẹp nhất."
 league_collapse_events.20.a: "Chúng ta còn lựa chọn nào khác chứ?"

 league_collapse_events.21.t: "An Khánh thỉnh cầu sự ủng hộ của chúng ta"
 league_collapse_events.21.d: "Trần Điều Nguyên, Đốc quân tỉnh An Huy thuộc Liên minh Bát tỉnh, đã chính thức ngỏ lời xin sự ủng hộ của chúng ta trong cuộc chiến sắp tới chống lại triều đình Thanh và Liên minh. Dù Trần giữ lập trường bài trừ nhượng địa rất gay gắt và nhận được phần lớn sự ủng hộ từ phong trào này, ông ta cũng đủ tỉnh táo để nhận ra thế cờ hiểm nghèo mà mình đang mắc kẹt. Hoặc là ông ta khư khư giữ lấy lý tưởng để rồi mất sạch lãnh thổ, quân đội và nhiều khả năng là cả mạng sống, hoặc là phải mở lời gõ cửa chính phủ quốc gia duy nhất còn lại ở Trung Hoa, bất kể họ đang phải bắt tay với những thế lực ngoại bang nào. Được sự thúc giục từ Đốc quân Chiết Giang Trần Nghi trong việc thiết lập liên lạc với chúng ta, có vẻ như ông ta đã lựa chọn con đường thứ hai.\n\nĐiều này mang lại cho chúng ta một cơ hội tuyệt vời để bảo đảm một đồng minh tiềm năng đầy sức mạnh ở miền Đông Trung Hoa và giáng một đòn chí mạng vào sườn phía Nam trung tâm quyền lực của Thanh triều — một cơ hội mà chúng ta cần phải khai thác triệt để."
 league_collapse_events.21.a: "Một quân cờ mới đã bước lên bàn cờ."

 league_collapse_events.22.t: "Một đề nghị khác cho Trần?"
 league_collapse_events.22.d: "Sau khi chúng ta từ chối viện trợ cho Đốc quân An Huy Trần Điều Nguyên thuộc Quân phiệt An Khánh, những báo cáo đáng lo ngại bắt đầu nổi lên cho thấy ông ta đã vươn vòi tới Trương Tác Lâm — thủ lĩnh của chính quyền phản loạn Phụng Thiên ở vùng Đông Bắc. Đáng quan ngại hơn nữa là việc ông ta sử dụng một đầu mối trung gian người Nhật để dàn xếp cuộc gặp. Nhiều cố vấn của Ngô đang đề xuất Thống soái nên chủ động liên lạc lại với Trần cùng một lời đề nghị hỗ trợ trực tiếp cho cuộc nổi dậy của ông ta, để tránh nguy cơ rước một con chó săn của Nhật Bản về đóng ngay trước cửa nhà mình.\n\nKhông chỉ dừng lại ở nguy cơ Nhật Bản chống lưng cho Trần, việc khoanh tay đứng nhìn dường như còn có thể châm ngòi cho tình trạng bất ổn diện rộng trong nước. Rất nhiều phe phái trong các đảng phái đối lập và ngay cả trong nội bộ Trực hệ đang thèm khát cơ hội mở rộng tầm kiểm soát giữa đống tro tàn của sự sụp đổ, và những cuộc biểu tình nhỏ ủng hộ lập trường chống nhượng địa của Đốc quân Trần đã bắt đầu nổ ra khắp các đô thị. Việc tiếp tục giữ im lặng có thể khiến các cuộc biểu tình này leo thang, làm lung lay dữ dội hơn nữa chế độ vốn đã ngày càng bấp bênh của chúng ta."
 league_collapse_events.22.a: "Hãy xem hắn ta có gì để nói."
 league_collapse_events.22.b: "Việc này quá đỗi rủi ro."

 league_collapse_events.23.t: "Ngô Bội Phu xem xét lại lập trường"
 league_collapse_events.23.d: "Rất có thể sau khi nhận được tin tức về các mối liên hệ của chúng ta với Thẩm Dương và Tokyo, Ngô Bội Phu đã hủy bỏ yêu cầu ban đầu đòi chúng ta phải hạ vũ khí và đầu hàng Nam Kinh. Hiện tại, ông ta đưa ra lời đề nghị ủng hộ toàn diện và tán dương [ANQ.GetLeader] vì hành động quyết đoán trong giờ phút lâm nguy của đất nước. Để củng cố thêm cho lời nói của mình, ông ta cũng đã phê duyệt việc chuyển giao vàng bạc và vũ khí tới An Khánh, đồng thời hứa hẹn sẽ còn nhiều chuyến hàng hơn nữa nếu chúng ta chấp nhận đề nghị và cắt đứt mọi liên lạc với Chính phủ Phụng Thiên và Tokyo."
 league_collapse_events.23.a: "Ai dám chắc lão ta sẽ không đâm sau lưng chúng ta lần thứ hai?"
 league_collapse_events.23.b: "Chúng ta vô cùng cảm kích trước sự hỗ trợ của ngài."

 league_collapse_events.24.t1: "Trần Điều Nguyên cự tuyệt đề nghị của chúng ta"
 league_collapse_events.24.t2: "Trần Điều Nguyên xem xét lại lập trường"
 league_collapse_events.24.d1: "Rất có thể do uất ức trước sự bội ước trước đó của chúng ta, viên Đốc quân An Khánh đã từ chối đáp ứng các yêu cầu và tuyên bố dứt khoát rằng lợi ích của nhân dân ông ta gắn liền với Chính phủ Phụng Thiên. Để tăng thêm sức nặng cho lời tuyên bố, hắn thậm chí còn gạt phăng khoản tiền hối lộ mà chúng ta gửi tới để lôi kéo hắn về hàng ngũ, nhằm đảm bảo rằng mình không còn bất kỳ ràng buộc nào với triều đình Mãn Thanh."
 league_collapse_events.24.d2: "Bất chấp mọi toan tính bỏ mặc Đốc quân Trần cho bầy lang sói, dường như cú quay xe kịp thời của Trực hệ đã cứu vãn cục diện khỏi những âm mưu thâm độc nhất của Phụng Thiên bên trong Liên minh. Hoặc bị thuyết phục bởi những lời lẽ đầy sức nặng của Ngô Soái cùng viện trợ khí tài và ngân sách, hoặc vì gần một thập kỷ từng được bảo trợ và hậu thuẫn trước đây, Đốc quân Trần đã bật đèn xanh cho Đại Tổng thống Tào và Ngọc Soái để tiếp tục một thỏa thuận hợp tác.\n\nNgay sau đó, Trương Chí Đàm đã báo tin về Lạc Dương rằng các cố vấn Đông Bắc và sĩ quan Nhật Bản đã bắt đầu bị trục xuất khỏi An Huy hoặc bị bắt giữ, củng cố việc Trần đã quay trở lại trung thành với những người chủ thực sự của mình."
 league_collapse_events.24.a: "Thật là đáng tiếc."
 league_collapse_events.24.b: "Hãy chờ xem canh bạc này diễn biến ra sao."

 league_collapse_events.25.t: "Đề nghị từ Tề Soái"
 league_collapse_events.25.d1: "Trước việc bức điện của Đốc quân Trần bị cự tuyệt, dường như kẻ cơ hội đầy tham vọng Tề Tạ Nguyên đã đánh hơi được tin tức này. Gần như tiếm quyền vị thế của Tôn Truyền Phương trong Liên minh, Tề đã tự phong cho mình danh hiệu \"Thống soái Liên minh Bát tỉnh\" mới, bất chấp việc Tôn vẫn chưa được công bố là đã chết trước công chúng.\n\nGửi một bức thư hoa mỹ tới cả Tào và Ngô, hắn ta trực tiếp đề nghị viện trợ để dập tắt cái mà hắn gọi là \"một cuộc phản loạn quy mô nhỏ ở tỉnh An Huy\", bất chấp việc tình báo của chúng ta và bức điện của Trần đã chỉ ra điều hoàn toàn trái ngược. Khăng khăng cho rằng vì chúng ta là cơ quan quyền lực hợp pháp tại Chính phủ Trung ương, nên \"việc ủng hộ Thống soái chính danh của Liên minh là lẽ đương nhiên\".\n\nGiọng điệu trịch thượng đó khiến Ngô và Tào nghi ngờ lời thỉnh cầu của Tề, nhất là khi một tên quân phiệt mới nổi từng gây rối vào năm 1924 lại dám ra yêu sách với họ. Tệ hơn nữa, về mặt lý thuyết Tề hoàn toàn có thể dễ dàng đè bẹp An Huy và cuộc Khởi nghĩa của Quốc dân Đảng chỉ bằng viện trợ của Đức. Tuy nhiên, Tào Côn và các cố vấn của ông, trong đó có Cao Lăng Úy, vẫn cho rằng một Liên minh vững mạnh và mối quan hệ bền chặt với Đức mới là con đường đúng đắn cho sự phát triển."
 league_collapse_events.25.d2: "Với việc bức điện của Đốc quân Trần được chấp thuận, dường như kẻ cơ hội đầy tham vọng Tề Tạ Nguyên đã không kịp nắm bắt được thông tin về liên minh này. Gần như tiếm quyền vị thế của Tôn Truyền Phương trong Liên minh, Tề đã tự phong cho mình danh hiệu \"Thống soái Liên minh Bát tỉnh\" mới, bất chấp việc Tôn vẫn chưa được công bố là đã chết trước công chúng.\n\nGửi một bức thư hoa mỹ tới cả Tào và Ngô, hắn ta trực tiếp đề nghị viện trợ để dập tắt cái mà hắn gọi là \"một cuộc phản loạn quy mô nhỏ ở tỉnh An Huy\", bất chấp việc tình báo của chúng ta và bức điện của Trần đã chỉ ra điều hoàn toàn trái ngược. Khăng khăng cho rằng vì chúng ta là cơ quan quyền lực hợp pháp tại Chính phủ Trung ương, nên \"việc ủng hộ Thống soái chính danh của Liên minh là lẽ đương nhiên\".\n\nGiọng điệu trịch thượng đó khiến Ngô và Tào nghi ngờ lời thỉnh cầu của Tề, nhất là khi một tên quân phiệt mới nổi từng gây rối vào năm 1924 lại dám ra yêu sách với họ. Tệ hơn nữa, về mặt lý thuyết Tề hoàn toàn có thể dễ dàng đè bẹp An Huy và cuộc Khởi nghĩa của Quốc dân Đảng chỉ bằng viện trợ của Đức. Tuy nhiên, Tào Côn và các cố vấn của ông, trong đó có Cao Lăng Úy, vẫn cho rằng một Liên minh vững mạnh và mối quan hệ bền chặt với Đức mới là con đường đúng đắn cho sự phát triển."
 league_collapse_events.25.a: "Hãy lắng nghe hắn xem sao - chúng ta có thể giành được chút đòn bẩy ở đây."
 league_collapse_events.25.b: "Hắn có thể tự mình giải quyết mớ hỗn độn này."
 league_collapse_events.25.c: "Ván đã đóng thuyền rồi."

 league_collapse_events.26.t: "Ngô Soái chấp thuận!"
 league_collapse_events.26.d: "Có vẻ như lời khẩn cầu của chúng ta gửi tới Chính phủ Trung ương đã được hồi đáp bằng tin mừng! Chấp nhận lời đề nghị viện trợ — nói một cách khiêm tốn — của chúng ta, Ngô Bội Phu và Tào Côn đã gián tiếp công nhận quyền lực của chúng ta đối với Nam Kinh và phần còn lại của các tỉnh trong Liên minh. Với nguồn tài chính và vũ khí của họ, cuối cùng chúng ta cũng có thể tiến tới việc bảo đảm những vùng lãnh thổ rộng lớn hơn, và quét sạch bè lũ thảo khấu đội lốt đang chiếm đóng An Huy. Tuy nhiên, điều này đồng nghĩa với việc chúng ta phải cúi đầu trên danh nghĩa dưới sự bảo trợ của họ, dẫu cho quyền cai trị của chúng ta tại các tỉnh Liên minh giờ đây đã có được chỗ dựa hợp pháp."
 league_collapse_events.26.a: "Tuyệt hảo!"

 league_collapse_events.27.t: "Ngô Soái từ chối!"
 league_collapse_events.27.d: "Thật là đáng nguyền rủa, tên \"Ngọc Soái\" háo danh cùng gã \"Tổng thống Hối lộ\" đê tiện đó đã thẳng thừng gạt bỏ yêu cầu viện trợ của chúng ta. Từ chối giải quyết nhu cầu cấp thiết của chúng ta, chúng đã dồn chúng ta vào chân tường, và một lần nữa chúng ta buộc phải nương tựa vào các nhà bảo trợ người Đức. Quay lưng lại với Nam Trực Lệ chân chính, Chính phủ Trung ương rõ ràng đang mưu toan dựng lên một chính quyền \"ngoan ngoãn\" hơn bên trong lãnh thổ của Liên minh."
 league_collapse_events.27.a: "Chết tiệt!"

### Section 2 - Black Monday Event Chain and Start of the League War ###
 #Black Monday 2.3.36 February 3rd 1936
 league_collapse_events.50.t: "Thứ Hai Đen tối lan tới phương Đông"
 league_collapse_events.50.d: "Gắn kết chặt chẽ với cỗ máy kinh tế hùng mạnh toàn cầu của Đức kể từ cuộc can thiệp năm 1927 cùng những cuộc đàm phán sau đó giữa Tổng thống Tào Côn và các Phái viên Đức, Liên minh Bát tỉnh trên thực tế đã chọn cách đồng hành cùng Chính phủ Trung ương trong vấn đề nước Đức. Vốn là một người yêu nước và phản đối nhượng địa, Thống soái Liên minh Tôn chỉ chịu khuất phục trước bức tường thành của Đức sau năm 1928. Bởi lẽ sau sự gia tăng căng thẳng giữa Bắc và Nam Trực Lệ, Tiếu Diện Hổ đã đạt đến đỉnh cao quyền lực sau sự ra đời của Liên minh Bát tỉnh vào năm 1928, cùng sự bành trướng tiếp theo sang Quảng Đông, Quảng Tây và Hồ Nam vào năm sau đó. Phớt lờ các chỉ thị giải trừ quân bị từ Bắc Kinh, Tôn lại quay sang tăng cường quy mô quân đội của mình.\n\nĐiều này tất nhiên đã đẩy vị Thống soái Liên minh vào một thế tiến thoái lưỡng nan kỳ lạ. Kiên quyết phản đối việc áp thuế nặng nề lên tầng lớp nông dân, ông đã bị dồn vào chân tường. Tề Tạ Nguyên và Lý Lân Tư, hai người vừa mới trở về Trung Quốc, đã khuyên Thống soái Liên minh về lối thoát khả dĩ duy nhất cho tình thế này: Nhận những khoản vay khổng lồ được bảo đảm bằng các đặc quyền nhượng địa cho người Đức và các Công sứ đoàn, đổi lại ông sẽ có đủ nguồn tài chính cần thiết để xây dựng một đội quân đủ sức cạnh tranh với Ngọc Soái.\n\nCùng với việc gia tăng đàn áp quân phiến loạn xã hội chủ nghĩa và những nhà tư tưởng dân chủ, các biến động chính trị tại Quảng Đông, Quảng Tây và Hồ Nam đã chứng kiến sức mạnh của Liên minh ngày càng suy giảm. Và thế là, một Tôn Truyền Phương vốn căm ghét nhượng địa lại càng bị đẩy sâu hơn vào vòng tay của người Đức, trái ngược hoàn toàn với ý muốn cá nhân của ông.\n\nVà mặc dù khởi phát từ một nơi cách xa nửa vòng trái đất, dư chấn của ngày Thứ Hai Đen tối đã càn quét qua các thị trường Trung Hoa. Sàn Giao dịch Thượng Hải lao dốc không phanh trước khi đóng cửa ở những con số chưa từng thấy kể từ cuộc khủng hoảng tài chính năm 1925, và các tổ chức địa phương đang phải huy động mọi nguồn lực có thể để giảm thiểu thiệt hại. May mắn thay, người dân Trung Quốc bình thường cũng như toàn bộ đất nước khó có thể cảm nhận thấy bất kỳ tác động tức thì nào. Nhưng AOG, vốn đang lảo đảo dưới một cuộc tẩy chay trả đũa quy mô lớn, đang phải đối mặt với hoàn cảnh tài chính ngặt nghèo.\n\nCác thư ký của họ đã phát đi thông báo rằng AOG có thể không thể chi trả các khoản tiền thuê mặt bằng định kỳ cho các khu nhượng địa khác nhau bên trong các tỉnh thuộc Liên minh, và khoản thanh toán cuối cùng đã hứa cho tuyến Đường sắt Chiết Cám đã bị \"hoãn lại vô thời hạn\". Vị Thống soái vốn dĩ đã tuyệt vọng nay càng bị đẩy sâu hơn vào hố đen tăm tối, bởi nếu không có khoản doanh thu dự kiến này, việc cắt giảm ngân sách quy mô lớn là điều bắt buộc để duy trì sự sống còn. Thậm chí còn có tin tức cho rằng Đốc quân Trần đã bắt đầu điều động các lực lượng nhắm thẳng về phía Nam Kinh..."
 league_collapse_events.50.a: "\"Càng lún sâu, ta lại càng chìm nghỉm.\""

 league_collapse_events.51.t: "Mầm mống bất tuân trong quân ngũ"
 league_collapse_events.51.d: "Ngay giữa bầu không khí u ám thê lương này, tin tức đã lan truyền đi một cách nhanh chóng mặt. Dù Thống soái Liên minh chưa đưa ra bất kỳ biện pháp kinh tế trực tiếp nào để ngăn chặn sự đình trệ hoàn toàn các dự án kinh doanh của Tập đoàn Giang Nam, tin đồn về cái gọi là \"cắt giảm ngân sách\" và việc đình chỉ phát lương đã truyền tai nhau khắp các tầng lớp sĩ quan cấp dưới của Liên minh. Đúng như dự đoán, phản ứng của họ là vô cùng tiêu cực, nếu không muốn nói là phẫn nộ cùng cực.\n\nĐối với một số người, điều này báo hiệu sự chấm dứt của lối sống xa hoa trụy lạc của họ, ít nhất là trong thời điểm hiện tại; nhưng đối với nhiều binh lính bình thường, đó lại là ranh giới giữa sự sống và cái chết đói. Tương tự, những tin đồn lan rộng — có thể do chính các Đốc quân Tề, Trần và thậm chí cả Quốc dân Đảng tung ra — rằng sự cắt giảm lương bổng này sẽ diễn ra không đồng đều. Nhiều lời thì thầm khẳng định rằng các lực lượng tinh nhuệ trực thuộc Thống soái Liên minh dưới quyền chỉ huy của Lý Bảo Chương, Tạ Hồng Huân, Mã Ngọc Nhân, Mạnh Chiêu Nguyệt và Lưu Tông Kỷ sẽ giữ lại được phần lớn, nếu không muốn nói là toàn bộ tiền lương. Tương tự, người ta đồn rằng các sư đoàn do Đức huấn luyện của Tề Tạ Nguyên cũng nằm ngoài diện khó khăn này.\n\nSự cằn nhằn của các sĩ quan càng trở nên tồi tệ hơn bởi một nhóm sĩ quan trẻ theo chủ nghĩa dân tộc tuy nhỏ nhưng rất lớn tiếng, do nhóm cận vệ trẻ gồm Thang Ân Bá, Quách Sám, Lâm Vĩ và Cát Kính Ân dẫn đầu. Họ tụ họp và tranh luận rằng Liên minh đáng lẽ không bao giờ nên phụ thuộc vào các \"khoản bố thí\" của người Đức ngay từ đầu, mặc dù luận điệu của họ vấp phải sự phản bác từ những người như Đốc quân Tề, và ở mức độ thấp hơn là Lý Nhẫn Đào và Từ Bồi Căn. Dĩ nhiên trong thâm tâm, Thống soái Liên minh đồng tình với quan điểm của họ, nhưng quá nhiều thứ đã bị trói chặt vào người Đức khiến ông không thể đốt cây cầu này vào lúc này.\n\nTệ hơn nữa, những kẻ thù truyền kiếp của chúng ta trong Quân Đội Cách Mạng Quốc Dân và Hội Mười Người của Quốc dân Đảng vẫn tiếp tục ẩn nấp trong bóng tối, phát tán truyền đơn tuyên truyền và lên án sự \"cấu kết với đế quốc\". Chưa có biến cố cụ thể nào xảy ra từ những hoạt động này, nhưng những gì từng là sự bất ổn định kỳ giờ đây đang đe dọa làm xói mòn chính nền móng của Liên minh."
 league_collapse_events.51.a: "\"Ngọn lửa đang bùng cháy quanh ta...\""

 league_collapse_events.52.t: "Tội ác tày trời"
 league_collapse_events.52.d: "Tuổi trẻ của Tôn Truyền Phương là một chuỗi những ngày tháng đầy rẫy gian nan. Cha mất sớm ngay sau khi Tôn chào đời, gia đình ông bị người cô bạo hành, khiến Tôn cùng mẹ và ba chị em gái phải trốn chạy về Tế Nam để tìm kiếm chút hạnh phúc ít ỏi. Tôn và mẹ sau đó được Vương Anh Giai cưu mang. Nhờ đó, Tiếu Diện Hổ lần đầu tiên lộ nanh vuốt, thăng tiến vượt bậc qua các cấp bậc tại Trường Quân sự Bảo Định. Trong suốt sự nghiệp của mình, Tôn đã gặp gỡ và kết giao với đủ mọi hạng người, từ Diêm Tích Sơn cho đến Đặng Diễn Đạt.\n\nĐược nhiều người quý mến, nhưng Tiếu Diện Hổ rốt cuộc vẫn là một con hổ. Không ai hiểu rõ điều này hơn Thi Tùng Tân, cấp dưới của Trương Tông Xương. Trong cuộc xung đột với Phụng hệ năm 1925, Tạ Hồng Huân — thuộc hạ của Tôn — đã tiêu diệt hoàn toàn lực lượng của Thi. Khi đã là một ông già, Thi vẫn chào Tôn Truyền Phương khi Tiếu Diện Hổ đến gặp ông ta. Mặc dù vậy, Tôn vẫn hạ lệnh cho Lý Bảo Chương, tức \"Tướng quân Máy chém\", phải xử trảm Thi ngay lập tức để trừ hậu họa. Bị chặt đầu dã man và vứt xác thối rữa, Tôn từ lâu đã gạt bỏ sự kiện của một thập kỷ trước ra sau đầu. Nhưng có những kẻ thì không bao giờ quên.\n\nĐứng thị sát một buổi tập trận bên ngoài Phủ Soái, làn gió mát lành của Nam Kinh thổi qua vị Thống soái Liên minh. Xoa dịu đi những căng thẳng và mệt mỏi của những biến cố dồn dập gần đây, dẫu chỉ là trong giây lát. Đắm chìm trong dòng hoài niệm, ngước mắt nhìn lên bầu trời, tâm trí Tôn không khỏi trôi dạt về một nơi chốn mà ông hằng cất giấu sâu kín trong lòng.\n\nThời còn là thuộc hạ của Vương Chiêm Nguyên, Tôn đã hoàn toàn say đắm một cô hầu gái của vợ Vương, tên là Hà Khiết Tiên. Tôn khắc ghi hình bóng Khiết Tiên sâu sắc trong tim, và định mệnh đã cho họ nên duyên vợ chồng chỉ một năm sau đó.\n\nNhưng số phận trớ trêu thay lại là một thứ quá đỗi mong manh. Khiết Tiên đã mắc bệnh lao từ thuở còn làm người hầu, và cuộc đời hạnh phúc ngắn ngủi của phu nhân họ Tôn đã kết thúc chỉ một năm sau khi vừa chớm nở. Một lòng thủy chung son sắt với người tình duy nhất của đời mình, Tôn đã tự tay chôn cất nàng, và giữ mãi chiếc khăn tay màu trắng mà nàng yêu thích nhất trong túi áo ngực. Một biểu hiện công khai rằng ông sẽ mãi mãi ở bên người vợ yêu dấu.\n\nBị kéo giật trở lại với thực tại chỉ trong chớp mắt. Một cơn đau nhói xé toạc thân thể ông. Tiếng la hét, sự hỗn loạn. Ngoảnh đầu lại, ông chỉ kịp nhìn thấy người phụ nữ phục vụ cùng khẩu súng lục Luger trên tay ả. Các vệ sĩ lao vào khống chế và tống giam người đàn bà, nhưng thân thể Tôn đã đổ sụp xuống. Chiếc khăn tay của Hà Khiết Tiên. Kỷ vật cuối cùng của nàng, vẻ đẹp thuần khiết tinh khôi, sắc trắng rạng ngời mà ông nâng niu. Giờ đây đã bị nhuốm đỏ bởi dòng máu đỏ thẫm của Mãnh Hổ."
 league_collapse_events.52.a: "\"Anh đến với em đây, Khiết Tiên.\""

 league_collapse_events.53.t: "Điện tín từ Nam Kinh"
 league_collapse_events.53.d: "Vội vã chạy đến tư dinh của ông giữa đêm khuya, Ngô Bội Phu đã bị đánh thức bởi thư ký Bạch Kiên Vũ và Tham mưu trưởng Trương Kỳ Hoàng, kéo Ngọc Soái ra khỏi giấc ngủ chập chờn. Dẫn Ngô đến bàn làm việc, bộ đôi trượt một bản báo cáo điện tín khẩn cấp trước mặt vị Thống chế, chỉ dành riêng cho mắt ông. Khi hỏi liệu Đại Tổng thống Tào đã xem bức điện này chưa, ông được biết Vương Dục Giáp và Lưu Mộng Canh đã trực tiếp đến giải thích tình hình cho Tổng thống. Đưa mắt lướt qua tờ điện tín tuyệt mật, vẻ bàng hoàng hiện rõ trên khuôn mặt ông, bức điện viết:\n\n'Tôn Truyền Phương bị bắn lúc 8:55 sáng DỪNG\nHung thủ chưa rõ lai lịch DỪNG\nĐang hôn mê sâu DỪNG\nKhó có khả năng tỉnh lại DỪNG\nBạo loạn lan rộng khắp nơi DỪNG\nĐang di tản vàng bạc và tài liệu DỪNG'\n\nHai giờ sau, Lạc Dương biến thành một tổ ong náo loạn. Những tài liệu liên quan đến các thương vụ mờ ám của Tôn với Bắc Kinh bị tống vào lò thiêu rụi, trong khi các phe cánh Tân Bảo phái và Lạc Dương Trực hệ cãi vã nảy lửa về các mối liên hệ của Tiếu Diện Hổ. Trong một động thái chưa từng có tiền lệ, Tào Côn đã mời một số quý tộc Mãn Thanh, đặc biệt là Phổ Kiệt — em trai của Hoàng đế, có mặt để cùng soạn thảo một tuyên bố thống nhất nhằm đối phó với vụ ám sát, có lẽ là muốn xây dựng một mặt trận đoàn kết trong những thời khắc đầy giông bão này.\n\nVượt lên trên tất cả, Ngọc Soái không khỏi cảm thấy xót xa cho số phận nghiệt ngã đã giáng xuống đầu Tôn Truyền Phương. Người học trò cưng, người kế vị ban đầu của ông, dẫu cho họ có chia sẻ bao nhiêu về lý tưởng và kỷ niệm, lại phải chịu một kết cục bi thảm đến nhường này ư?"
 league_collapse_events.53.a: "\"Vĩnh biệt, Tôn đệ...\""

 league_collapse_events.54.t: "Sự bất tuân lan rộng"
 league_collapse_events.54.d: "Trước sự vắng mặt của Thống soái Liên minh, các bức điện tín đã bắt đầu đổ về dồn dập suốt buổi sáng, hòa cùng tiếng chuông điện thoại reo inh ỏi không dứt khắp Phủ Soái; tất cả cùng hợp lại tạo nên một bức tranh về tình hình đang xấu đi nhanh chóng trên khắp phần lớn lãnh thổ Liên minh. Với tin tức về việc cắt giảm hoặc không có lời hứa hẹn nào về tiền lương, binh lính tại Từ Châu, Nam Xương, Tuyền Châu và nhiều thành phố khác đang từ chối hành động hoặc công khai tham gia vào làn sóng bạo lực và cướp bóc đang lan tràn, trong khi cảnh sát và lực lượng đồn trú tại Hàng Châu và Vô Tích đã đồng loạt đình công.\n\nCác cuộc bạo loạn ở đó và khắp những nơi khác đang dần vượt khỏi mọi tầm kiểm soát, càng trở nên trầm trọng hơn bởi tình trạng hôn mê của Tôn Truyền Phương. Hơn nữa, Đốc quân Trần Nghi lại một lần nữa từ chối duy trì liên lạc với Nam Kinh, với việc các điệp viên tình báo của chúng ta báo cáo về sự gia tăng liên lạc giữa ông ta với Đốc quân Trần Điều Nguyên. Binh lính canh giữ các vùng tiếp giáp phía bắc Giang Tô đã bị gọi lùi về Nam Kinh, trong khi các Đốc quân Đặng và Chu báo cáo về các vụ đào tẩu hàng loạt của các đơn vị sang phía Quốc dân Đảng.\n\nĐáng lo ngại hơn, các đường dây điện tín phía nam Phúc Kiến dường như đã bị cắt đứt, khiến Liên minh hoàn toàn mù tịt về tình hình có thể đang ngày một tồi tệ hơn tại Quảng Châu và Quảng Tây. Đốc quân Triệu của Hồ Nam đã gửi những lời chia buồn có phần miễn cưỡng trước tai họa giáng xuống đầu Tôn Truyền Phương, nhưng kiên quyết từ chối đưa ra bất kỳ sự ủng hộ chính thức nào trong thời khắc rối ren này. Còn về bản thân Nam Kinh? Nơi đây thực tế đang chìm trong cơn co giật của một cuộc cách mạng bạo lực. Bộ sậu thân cận của Thống soái Liên minh đang cuống cuồng lập nên một hội đồng nhiếp chính, nhưng Đốc quân Tề dường như lại có những toan tính rất khác..."
 league_collapse_events.54.a: "Tôn Soái phải tỉnh lại sớm..."

 league_collapse_events.55.t: "Hải quân Hoàng gia chạy trốn lên phía Bắc!"
 league_collapse_events.55.d: "Với việc Sơn Đông rơi vào tay các thế lực thù địch tàn phá cảng Yên Đài, cùng với việc Thanh Đảo nằm dưới sự kiểm soát thực tế của dự án thuộc địa Đức, vùng đất do Chính phủ Trung ương trực tiếp kiểm soát hoàn toàn thiếu vắng bất kỳ bến cảng thực sự thích hợp nào để duy trì Hạm đội Bắc Dương. Trong tình cảnh trớ trêu như vậy, Hạm đội Bắc Dương đã buộc phải dời về Nam Thông, vốn dĩ nằm trong địa phận Liên minh, kể từ khi kết thúc các cuộc Chiến tranh Trực - Phụng.\n\nTrước tình trạng bạo loạn, bất ổn dân sự và sự hỗn loạn chung đang bao trùm thành phố do sự sụp đổ của Liên minh, Bộ trưởng Hải quân, Đô đốc Tát Trấn Băng, đã nhận lệnh điều động hạm đội tháo chạy khỏi thành phố, nhổ neo tiến lên phía bắc về các cảng nhỏ xung quanh đô thị Thiên Tân. Sự sụp đổ của các âu thuyền Nam Kinh đã biến một lực lượng hải quân trở thành kẻ không nhà, thiếu hụt năng lực đóng tàu để làm bất cứ điều gì hơn là duy trì hạm đội hiện có.\n\nBáo cáo trước Ngọc Soái, cả Tát Trấn Băng và Dương Thụ Trang đều nhấn mạnh rằng giới chỉ huy hải quân nhất thiết phải có được các cảng biển ở Sơn Đông, hoặc bằng không phải là ở Chiết Giang hay Phúc Kiến, nếu muốn bảo vệ vùng lãnh hải của Trung Hoa."
 league_collapse_events.55.a: "\"Việc đó sẽ phải chờ đã, thưa các quý ngài.\""

 league_collapse_events.56.t: "Bạo loạn tràn tới Phủ Soái"
 league_collapse_events.56.d: "Khi các tướng lĩnh cấp dưới của Thống soái Liên minh còn đang loay hoay chắp vá bất kỳ hình thức quyền lực nào đủ sức thay thế năng lực của Tôn Truyền Phương, nhiều chính quyền địa phương và cấp tỉnh đang khẩn thiết cầu xin Nam Kinh đưa ra một câu trả lời hay mệnh lệnh đã bị bỏ mặc trôi nổi và cô lập. Cảnh sát Nam Kinh, về phần mình, đã hoàn toàn bất lực trong việc kiềm chế các cuộc bạo loạn đang lan tràn khắp thủ phủ, khi các sĩ quan cấp tiến đào tẩu sang phe Đốc quân Trần Điều Nguyên hoặc ngồi im khoanh tay đứng nhìn, trong khi đám đông hiếu kỳ cũng hòa vào sự hỗn loạn; cướp bóc và đốt phá nhà cửa, cơ sở kinh doanh, và giờ đây là cả các công sở chính quyền.\n\nSự xuất hiện vội vã của các đơn vị quân đội tinh nhuệ do Đức huấn luyện dưới quyền chỉ huy của Đốc quân Tề Tạ Nguyên — kẻ vẫn luôn theo dõi sát sao tình hình — dường như đã cứu Phủ Soái khỏi việc trở thành mồi lửa cho những người cách mạng. Nhưng tiếng gầm thét của lửa đỏ và đám đông cuồng nộ có thể nghe thấy rõ ràng ngay cả từ bên trong căn phòng nơi Tôn Truyền Phương đang nằm mê man bất tỉnh. Nhận được những chuyến thăm viếng ngày đêm từ những thuộc hạ thân cận nhất, nhiều người đã không cầm được nước mắt trước tình cảnh bi đát này, nài xin thân thể bất động của Tôn hãy tỉnh lại để giải quyết tình hình như ông vẫn thường làm.\n\nTuy nhiên, đối với những kẻ kém trung thành hơn, những kẻ chỉ tham gia vì tư lợi cá nhân, chúng đã bắt đầu cuộc đào tẩu vĩ đại của mình. Như lũ chuột tháo chạy khỏi con tàu đắm, những quan chức vô lại bị bắt gặp đang lén lút lủi vào các con ngõ ngách phía sau, tay ôm đầy những đồng bạc trắng, giấy tờ và những bí mật quốc gia có thể dùng để tống tiền."
 league_collapse_events.56.a: "Chúng ta phải làm gì đây?"

 league_collapse_events.57.t: "Ảo tưởng về bá quyền Mãn Thanh tan vỡ"
 league_collapse_events.57.d1: "Vỏ bọc thống nhất của Trung Hoa, vốn được duy trì suốt gần một thập kỷ qua, đã bắt đầu rạn nứt.\n\nLàn sóng bất ổn dâng cao tại Liên minh Bát tỉnh, cú sốc kinh tế từ ngày Thứ Hai Đen tối báo hiệu sự thoái lui của người Đức, và sự bất lực"
 league_collapse_events.57.d2: "$league_collapse_events.57.d1$ của Chính phủ Quốc gia trong việc đưa ra phản ứng quyết đoán đối với cả hai cuộc khủng hoảng đã làm rõ một điều: Sự độc quyền quyền lực của Bắc Kinh đã hoàn toàn tan vỡ"
 league_collapse_events.57.d_qie: "$league_collapse_events.57.d1$ của chính phủ chúng ta trong việc đối phó hiệu quả với cuộc khủng hoảng đã làm rõ một điều: Sự độc quyền quyền lực của chúng ta đã hoàn toàn tan vỡ. Giờ đây chúng ta phải tự mình đối mặt với cơn hỗn loạn."
 league_collapse_events.57.d_fng: "$league_collapse_events.57.d2$.\n\nCơ hội để tiến đánh xuống phía nam chưa bao giờ rộng mở đến thế, nhưng liệu vùng Đông Bắc đã sẵn sàng?"
 league_collapse_events.57.d_anq: "$league_collapse_events.57.d2$.\n\nCó lẽ chúng ta có thể biến cơ hội này — vốn khởi đầu bằng việc kích động Bắc Kinh chống lại Nam Kinh — thành một điều gì đó lớn lao hơn thế nhiều. Đã đến lúc phải tung xúc xắc."
 league_collapse_events.57.d_shd: "$league_collapse_events.57.d2$.\n\nCó lẽ chúng ta có thể cứu rỗi nhân dân Trung Hoa từ mảnh đất Sơn Đông khiêm nhường này? Quân đội và các đội dân binh ở phương Nam chắc hẳn đã quá chán ngấy những kẻ lãnh đạo tráo trở của họ, và người dân Trung Hoa bình dị đang tha thiết kêu gào sự bảo bọc của chúng ta."
 league_collapse_events.57.d_szc: "$league_collapse_events.57.d2$.\n\nTrật tự cũ mà dựa vào đó chúng ta xây dựng nên liên minh các quân phiệt Tứ Xuyên đã sụp đổ, và tương lai thực sự vô cùng mịt mờ."
 league_collapse_events.57.d_sik: "$league_collapse_events.57.d2$.\n\nTuy nhiên, miễn là nền thống trị của chúng ta được đảm bảo an toàn, điều đó chẳng mấy quan trọng."
 league_collapse_events.57.d_tib: "$league_collapse_events.57.d2$.\n\nTương lai đầy bất định, nhưng thời khắc tìm kiếm Đức Đạt Lai Lạt Ma của chúng ta đang cận kề."
 league_collapse_events.57.d_mon: "$league_collapse_events.57.d2$.\n\nCó lẽ đã đến lúc phải hướng mắt về vùng đất gọi là 'Nội Mông', nơi nhiều người Mông Cổ vẫn đang phải sống dưới sự định đoạt của những kẻ cai trị người Hán."
 league_collapse_events.57.d_jap: "$league_collapse_events.57.d2$.\n\nTình hình trên đại lục đã chuyển biến một cách mang tính quyết định theo chiều hướng có lợi cho Đế quốc."
 league_collapse_events.57.d: "$league_collapse_events.57.d2$, và giờ đây tương lai là ván cược mở cho bất kỳ ai."
 league_collapse_events.57.a: "Chuyện này sẽ không có kết cục êm đẹp đâu..."
 league_collapse_events.57.b: "Trung Hoa cuối cùng đã bị chia cắt."
 league_collapse_events.57.c: "Hồi kết của một thời đại."

 league_collapse_events.58.t: "Khởi nghĩa bùng nổ tại Phúc Kiến!"
 league_collapse_events.58.d: "Vốn là một cái gai nhức nhối đối với sự quản lý của Liên minh, sự tồn tại dai dẳng của cái gọi là cuộc nổi dậy \"Mân Cám\" đã hết lần này đến lần khác chứng minh sự kiên cường đến khó chịu của nó. Ban đầu nảy sinh từ việc một viên tướng tên Đường Sinh Trí bị đánh bật trong cuộc Bắc phạt, với Quân đoàn 8 của ông ta sát nhập các tàn dư từ Quân đoàn 4 của Quân Đội Cách Mạng Quốc Dân, cuộc nổi dậy Mân Cám đã biến thành cơ quan quyền lực thực tế tại một số khu vực sau cuộc Khởi nghĩa Thượng Hải thất bại năm 1932.\n\nChứng kiến \"Napoleon Đỏ\" lừng danh Đặng Diễn Đạt và bà Tống Khánh Linh gia nhập cùng những người đồng chí của họ tại Phúc Kiến và Giang Tây. Đánh bại hoàn toàn các chiến dịch bao vây tiễu phỉ của chúng ta — vốn do người Đức cố vấn và được các Đốc quân Chu Âm Nhân cùng Đặng Như Trác trực tiếp thi hành, quân NRA đã chứng minh họ là một kẻ thù vô cùng đáng gờm.\n\nCác báo cáo đang dồn dập bay về Phủ Soái cho biết chính những phiến quân Quốc dân Đảng đó, chiến đấu vì giấc mơ của vị Bác sĩ Tôn Dật Tiên đáng kính của họ, đã phát động thành công một cuộc tổng khởi nghĩa và nổi dậy quy mô lớn tại tỉnh Phúc Kiến. Xuất quỷ nhập thần từ các dãy núi và căn cứ bí mật, họ đã đánh chiếm được hàng loạt ngôi làng ở vùng nội địa của tỉnh. Vùng Khởi nghĩa Mân Cám xưa nay luôn là một mối hiểm họa thường trực, nhưng trước đây nó bị cô lập và hoàn toàn đơn độc.\n\nTuy nhiên, giữa cơn hỗn loạn đang bóp nghẹt Liên minh hiện nay, hoàn toàn có khả năng họ sẽ mở được một con đường máu tiến thẳng ra bờ biển, dọn đường đón nhận viện trợ từ các đồng minh Nghiệp đoàn của họ, và sự trở về của Uông Triệu Minh sau những năm tháng lưu vong tại Paris. Hiện tại, Đốc quân Chu được biết là đang có một vài sư đoàn đóng quân trong và xung quanh Tuyền Châu, nhưng lực lượng này khó lòng đủ sức ngăn chặn làn sóng cách mạng. Cùng lúc đó, các cánh quân trung thành với Quốc dân Đảng đã nổi dậy dọc theo biên giới với Khu Tô giới Thượng Hải, đe dọa trực tiếp tới trung tâm quyền lực của chúng ta. Dù vậy, nhiều khả năng chúng sẽ sớm bị lực lượng của Đốc quân Tề tiêu diệt."
 league_collapse_events.58.a: "Lũ cặn bã Nghiệp đoàn!"
 league_collapse_events.58.b: "(Chơi phe Quốc dân Đảng)"

 league_collapse_events.59.t: "Đốc quân Tề nắm quyền kiểm soát"
 league_collapse_events.59.d: "Vẫn hoàn toàn thiếu vắng bất kỳ cơ quan quyền lực trung ương hợp pháp nào, Liên minh đang rơi vào một vòng xoáy sụp đổ không thể cứu vãn giữa các thành phần ly tán. Bị bỏ mặc tự sinh tự diệt mà không có sự chỉ đạo tập trung từ Nam Kinh, các báo cáo dồn dập về tình hình hỗn loạn dữ dội tại Phúc Kiến, Giang Tây, việc quân đội tập kết ngày một đông tại tỉnh An Huy, tình thế nan giải tại Sơn Đông và đủ mọi thứ nhiễu nhương khác. Đóng vai trò Thống soái Liên minh không chính thức sau cơn hôn mê của Tôn, Đốc quân Tề của Giang Tô đã nỗ lực hết sức để cầm máu cho vết thương đang rỉ máu nghiêm trọng của Liên minh. Tuy nhiên, do không thể ra lệnh cho các Đốc quân khác vì thiếu danh chính ngôn thuận, mọi hành động của ông ta đều bị cản trở.\n\nHọp kín sau những cánh cửa đóng chặt bên trong sự an toàn tương đối của Phủ Soái, Đốc quân Tề đã tập hợp các tướng lĩnh quân sự gồm Mã Ngọc Nhân, Tạ Hồng Huân, Trịnh Tuấn Ngạn, Mạnh Chiêu Nguyệt, Vương Hạo Cơ, Chu Phượng Kỳ, Lý Bảo Chương và Lưu Tông Kỷ. Đi sát phía sau là giới trí thức và quan chức gồm Thang Nhĩ Hòa, Lý Lân Tư, Đinh Văn Giang, Ngụy Đạo Phong, Dương Văn Khải, và dĩ nhiên không thể thiếu cánh tay phải của Tề là Điền Văn Bỉnh. Tập hợp tất cả những nhân vật quan trọng nhất — và còn có mặt — trong Liên minh vào chung một căn phòng họp, chính căn phòng mà các Đốc quân đã tề tựu cách đây chưa lâu, hầu như chẳng ai ảo tưởng về điều mà Đốc quân Tề chuẩn bị đưa ra.\n\nSoạn thảo một bản thỉnh nguyện chính thức gửi tới những người có mặt, thay cho một quy trình kế vị hợp thức, nhằm tuyên bố Tề là Quyền Thống soái Liên minh, Đốc quân Giang Tô cuối cùng đã ngửa con bài tẩy của mình. Ngay lập tức sự hỗn loạn bùng nổ trong phòng họp, khi các Tướng Tạ Hồng Huân, Lý Bảo Chương và Mạnh Chiêu Nguyệt chỉ thẳng mặt cáo buộc Tề là kẻ chủ mưu đứng sau vụ ám sát Tôn Truyền Phương. Tương tự, Dương Văn Khải đưa ra bằng chứng rằng kẻ ám sát mang theo một khẩu súng ngắn của Đức. Quay đầu nhìn Điền, viên thuộc hạ của Tề gật đầu rồi biến mất khỏi phòng họp trong giây lát. Khi ông ta nhanh chóng quay trở lại, áp sát hai bên là hàng loạt binh lính Trung Quốc trang bị toàn vũ khí và khí tài của Đức.\n\nBước ra khỏi cuộc họp để tự xưng là Quyền Thống soái Liên minh, Tề Tạ Nguyên đã phát đi thông điệp tuyên bố ý định lập lại trật tự cho một Liên minh đang rạn nứt. Các lực lượng của ông ta đã bắt đầu thiết lập quyền kiểm soát đối với kho vũ khí của Nam Kinh, sở chỉ huy quân sự và các trục đường huyết mạch, phát loa phóng thanh tuyên bố sự lên ngôi của ông và quét sạch đường phố bằng những loạt đạn súng trường đanh thép. Các thành phố dọc hạ lưu Trường Giang đã bắt đầu tuyên bố ủng hộ Tề, với việc các Đốc quân Đặng và Chu chấp nhận xuôi theo dòng nước. Dẫu vậy, Đốc quân Trần Nghi vẫn tỏ ra do dự trong việc tuyên bố ủng hộ, trong khi Thẩm Hồng Anh, Lục Dụ Quang và Triệu Hằng Dịch thẳng thừng từ chối công nhận tin tức này."
 league_collapse_events.59.a: "Một cuộc đảo chính trên thực tế?"

 league_collapse_events.60.t: "Do dự và bất động"
 league_collapse_events.60.d: "Với quyết định của Chính phủ Trung ương là không ủng hộ cả Liên minh lẫn Cuộc nổi dậy Chống Nhượng địa trong Chiến tranh Liên minh, cơn hỗn loạn vốn bóp nghẹt quần chúng nhân dân cả nước suốt những tuần qua đã biến tướng thành tình trạng gần như vô chính phủ. Trước sự im lặng ban đầu từ cả Thống chế lẫn Tổng thống, các cuộc biểu tình nhỏ bắt đầu xuất hiện tại các trung tâm đô thị, được kích động bởi giới ký giả và trí thức. Đòi hỏi một sự can thiệp chống nhượng địa, nhưng đáp lại vẫn là sự im lặng đến rợn người. Hậu quả là, từ vài cuộc tụ tập lẻ tẻ đã bùng phát thành những cuộc biểu tình rực lửa trên đường phố, những ngọn lửa phẫn nộ của quần chúng nhắm thẳng vào cảnh đầu rơi máu chảy trên sông Trường Giang.\n\nHọp kín suốt nhiều ngày liền, người ta quyết định rằng cần phải đưa ra một phản hồi nào đó. Ngồi tại bàn làm việc với chiếc micro chĩa thẳng vào mặt, cùng hàng trăm ngàn người dân trên khắp cả nước đang lắng nghe qua sóng phát thanh, Tổng thống Tào Côn đã — với vẻ miễn cưỡng lộ rõ — tuyên bố rằng Chính phủ sẽ không hạ mình ban phát bất kỳ sự ủng hộ nào cho cả Tề Tạ Nguyên lẫn Trần Điều Nguyên, viện dẫn sự bất mãn sâu sắc đối với cả hai người và hành vi của họ.\n\nKhi các cuộc biểu tình biến thành một lò lửa phản kháng, Bắc Kinh và các thành phố lớn khác đã bị nhấn chìm hoàn toàn trong bất ổn, tê liệt tuyệt đối. Khi cả người Đức lẫn nhân dân đều quay lưng lại với chính phủ, một cảm giác hoang mang tột độ đã bao trùm lấy Hội đồng. Sự lên án gần như tuyệt đối của toàn dân từng dẫn đến sự sụp đổ của chính phủ chúng ta một lần trong quá khứ, và hoàn toàn có khả năng điều đó sẽ lặp lại một lần nữa. Với việc hiến binh quân sự dưới quyền Vương Dục Giáp đã được phái đi để vãn hồi trật tự, có lẽ chỉ còn là vấn đề thời gian trước khi tình hình tụt dốc không phanh."
 league_collapse_events.60.a: "Và cứ ngỡ chúng ta đã rút ra được bài học cho mình..."

 league_collapse_events.61.t: "Giờ khắc của sự thật"
 league_collapse_events.61.d: "Khi căng thẳng leo thang đến điểm bùng nổ giữa Đốc quân Trần Điều Nguyên và Thống soái Tề Tạ Nguyên, một loạt các cuộc giao tranh thường kỳ đã phình to thành một trận chiến công khai dọc theo sông Trường Giang ở ngoại vi Nam Kinh. Với việc trận đánh mở màn kết thúc bằng chiến thắng của Quân đội Liên minh, Đốc quân Trần đã phát động một cuộc tổng tấn công quy mô lớn, phối hợp nhịp nhàng với các cuộc Khởi nghĩa tại vùng nổi dậy Mân Cám và viễn cảnh can thiệp từ tỉnh Sơn Đông.\n\nKhi Chiến tranh Liên minh đã bùng nổ toàn diện, thời khắc đã điểm để Ngọc Soái và Tổng thống Tào thực hiện những cam kết đã đưa ra với Thống soái Liên minh Tề Tạ Nguyên, và hỗ trợ công cuộc vãn hồi trật tự và uy quyền bên trong các Tỉnh thuộc Liên minh."
 league_collapse_events.61.a: "Chúng ta xuất quân để tái lập trật tự!"

 league_collapse_events.62.t: "Sóng gió tại Nghị viện"
 league_collapse_events.62.d: "Lắng nghe thỉnh cầu của Tào Côn và quyết định can thiệp vào Chiến tranh Liên minh để ủng hộ chính Liên minh, nhiều người trong Nghị viện và các giới thân cận Trực hệ thừa hiểu rằng một lựa chọn như vậy chắc chắn sẽ không được lòng dân chúng. Khi đại đa số dân chúng đã bị kích động bởi giới trí thức phản đối nhượng địa, sự thách thức của Trần Điều Nguyên và những làn sóng tư tưởng bài trừ đế quốc âm ỉ suốt nhiều năm qua, người ta dẫu vậy vẫn quyết định rằng cần phải cắn răng vượt qua giông bão để bảo tồn mối quan hệ đặc biệt với nước Đức.\n\nĐược giao trọng trách hoàn toàn không ai muốn là thông báo tin tức can thiệp quân sự trước Nghị viện, Tào Côn đã khá miễn cưỡng triệu tập một cuộc họp Nghị viện để chính thức công bố quyết định can thiệp bảo vệ Liên minh. Đứng cùng Bộ trưởng Cao Lăng Úy và Bộ trưởng Vương Khắc Mẫn bên cạnh, Tào bắt đầu: \"Thưa các bạn đồng viện quý mến của tôi, tôi tập hợp tất cả quý vị ở đây ngày hôm nay để truyền đạt một tin tức hết sức quan trọng liên quan đến quyết định của Chính phủ đối với tình hình bất ổn ở phương Nam\". Toàn thể nghị viện nín thở lắng nghe, ông nói tiếp: \"Thống chế Ngô, ban tham mưu của ngài cùng toàn thể nội các đã nhất trí ủng hộ Thống soái Liên minh Tề Tạ Nguyên trong cuộc đấu tranh chống lại tỉnh phản loạn An Huy cùng tên Đốc quân phản nghịch Trần Điều Nguyên của nó. Với chiến dịch can thiệp có giới hạn của chúng ta đang hành quân xuống phía nam vào lúc này, chúng ta kỳ vọng vào một thắng lợi nhanh chóng, quyết định và toàn di-\".\n\nTào Côn buộc phải ngừng bài phát biểu khi các thành viên của Trung Quốc Thanh niên Đảng đồng loạt đứng dậy và lặng lẽ rảo bước rời khỏi hội trường. Ngay sau đó, theo chân họ là các thành viên của Trung Hoa Đế quốc Cải cách Hội, các đại biểu Độc lập và thậm chí cả một số thành viên của Tông Xã Đảng. Vẻ mặt ảm đạm, Tào liếc nhìn số ít thành viên còn lại của Hiệp Hòa Hội và Thịnh Vượng Đồng Minh đang ngồi lẻ loi trong Nghị viện. Bàng hoàng, Tào Côn buông rơi xấp tài liệu trên tay."
 league_collapse_events.62.a: "Một gánh nặng đè trĩu lên lương tâm ông."

 league_collapse_events.63.t: "Món quà của Thịnh Vượng Đồng Minh"
 league_collapse_events.63.d: "Bước ra khỏi Hội trường Nghị viện với thần thái pha trộn giữa giận dữ và bẽ bàng, vị Tổng thống quát tháo những mệnh lệnh cho đám trợ lý và Bộ trưởng Cao, rõ ràng là đang muốn tìm cách trừng trị những chính khách đã biểu tình rời bỏ Nghị viện. Dẫu vậy, ngay khi vừa bước chân ra khỏi sảnh, ông đã bị vây kín bởi các phóng viên và các thành viên của Thịnh Vượng Đồng Minh.\n\nNhanh nhảu chúc mừng Tổng thống, họ mang ra đủ thứ xa xỉ phẩm từ Thế giới Kinh tế Đức: Rượu vang vùng Rhine, xì gà Cuba và những món cao lương mỹ vị ngoại quốc khác được dâng lên cho Tào Côn cùng các nghị sĩ của ông. Tuy nhiên, chỉ nhận lại những ánh nhìn xa xăm và thậm chí là khinh miệt, rất ít người hưởng ứng lòng tốt \"Thịnh vượng\" của họ.\n\nTrái ngược với những quý tộc Mãn Thanh mặt ủ mày chau thường ngày vẫn đón chào Tổng thống bên ngoài tòa nhà, các quan chức Đức và đại diện từ giới đầu sỏ Nam Trực Lệ đã nhiệt liệt chào đón Tổng thống, khoác trên mình những bộ âu phục thời thượng nhất của Berlin và hào phóng trao tặng những món quà thậm chí còn xa hoa hơn nữa cho các nhà lập pháp thuộc Hiệp Hòa Hội; những người như Vương Thành Bân cùng phe cánh của Tào trong quân đội đã phải nhanh chóng hộ tống đưa Tổng thống rời đi, giúp ông thoát khỏi cảnh ngượng ngùng."
 league_collapse_events.63.a: "Sự khinh miệt từ quốc gia, sự khinh miệt từ nhân dân."

 league_collapse_events.64.t: "Giờ khắc của sự thật"
 league_collapse_events.64.d: "Khi căng thẳng leo thang đến điểm bùng nổ giữa Đốc quân Trần Điều Nguyên và Thống soái Tề Tạ Nguyên, một loạt các cuộc giao tranh thường kỳ đã phình to thành một trận chiến công khai dọc theo sông Trường Giang ở ngoại vi Nam Kinh. Với việc trận đánh mở màn kết thúc bằng chiến thắng của Quân đội Liên minh, Đốc quân Trần đã phát động một cuộc tổng tấn công quy mô lớn, phối hợp nhịp nhàng với các cuộc Khởi nghĩa tại vùng nổi dậy Mân Cám và viễn cảnh can thiệp từ tỉnh Sơn Đông.\n\nKhi Chiến tranh Liên minh đã bùng nổ toàn diện, thời khắc đã điểm để Ngọc Soái và Tổng thống Tào thực hiện những cam kết đã đưa ra với Đốc quân Trần Điều Nguyên, và ủng hộ một cuộc can thiệp quân sự có giới hạn cho phong trào phản đối nhượng địa."
 league_collapse_events.64.a: "Quân đội ta hành quân xuống phía nam để bảo vệ Trung Hoa!"

 league_collapse_events.65.t: "Lòng dân ủng hộ Tổng thống và Thống chế"
 league_collapse_events.65.d: "Sau quyết định của Tổng thống Tào và Thống chế Ngô về việc tấn công Liên minh Bát tỉnh, đích thân Tào Côn đã chọn cách xuất hiện trước công chúng và đưa ra một tuyên bố chính thức về hành động cũng như ý định của Chính phủ đằng sau quyết định này. Mặc dù bản thân Tào vẫn còn những e dè nhất định về việc dứt khoát cắt đứt mọi cầu nối với nước Đức, ông dẫu vậy vẫn kiên định thực thi bổn phận của một vị Tổng thống.\n\nĐược phát đi từ một ban công trong Tử Cấm Thành tới đám đông đang tụ tập bên dưới, đứng bên cạnh Tào là Hoàng đế, em trai Hoàng đế là Phổ Kiệt, và chính bản thân Ngô Bội Phu. Đáng chú ý giữa muôn vàn bài phát biểu từng được tổ chức tại cùng một địa điểm, bài phát biểu đặc biệt này đã được truyền trực tiếp qua làn sóng phát thanh — một điều chưa từng có tiền lệ tại Trung Hoa.\n\nThể hiện một ý chí sắt đá kiên cường, Tổng thống Tào kêu gọi toàn thể công dân Trung Hoa đoàn kết lại một lòng: \"Suốt cả một thế kỷ tủi nhục, chúng ta đã phải chịu đựng và than khóc dưới ách áp bức của ngoại bang! Đã quá lâu rồi chúng ta phải làm những con chó săn ngoan ngoãn phục vụ cho những ý thích bất chợt của người Anh, người Nhật, người Pháp và người Đức! Nhưng không thể như thế mãi được nữa! Ngày hôm nay chúng ta đứng lên bất khuất, đập tan xiềng xích của lũ đế quốc thực dân bằng bước đi đầu tiên tiến vào nền độc lập thực sự! Chúng ta sẽ không bao giờ còn phải chịu sự kìm kẹp sắt máu của Kaiser! Chúng ta sẽ không bao giờ phải chịu nỗi nhục nhã này nữa, và người Trung Hoa sẽ không bao giờ còn là công dân hạng hai ngay trên chính quê hương bản quán của mình! Nhân danh điều này, ta tuyên bố một lần và mãi mãi: Trung Hoa đã hoàn toàn tự do!\"\n\nĐược đáp lại bằng những tràng pháo tay vang dội như sấm truyền, những tiếng reo hò và tiếng kèn xung trận, hình ảnh các trích đoạn bài phát biểu cùng chân dung của Tào và Ngô đã được dán khắp các mặt báo, truyền đơn và tạp chí trên toàn quốc. Tương tự, các hội đoàn trí thức và câu lạc bộ sách báo cũng đã lên tiếng bày tỏ sự ủng hộ tượng trưng cho chính quyền của chúng ta."
 league_collapse_events.65.a: "Một Trung Hoa tự do sạch bóng chủ nghĩa Đế quốc!"

 league_collapse_events.66.t: "Ủy ban Bắc Kinh rút lui khỏi thủ đô!"
 league_collapse_events.66.d: "Ngay sau bài phát biểu nảy lửa đầy kích động của Tổng thống Tào, những cột khói đen bắt đầu bốc lên từ các con phố bên ngoài đại sứ quán Đức và các văn phòng của Ủy ban Bắc Kinh (Peking-Kommission). Một đám đông khổng lồ đã vây kín cổng ra vào, hô vang các khẩu hiệu bài trừ nhượng địa và đốt phá quần áo, đồ đạc do Đức sản xuất, thậm chí thiêu rụi cả một hình nộm Kaiser được dựng lên vội vã.\n\nVới việc lực lượng hiến binh quân sự nhanh chóng có mặt để ngăn chặn hiện trường biến thành một vụ tranh chấp ngoại giao quy mô lớn, các quan chức Đức trong Ủy ban Bắc Kinh, thông qua tiếng nói của họ trong Thịnh Vượng Đồng Minh, đã tuyên bố trước Nghị viện về việc rút lui ngay lập tức của Ủy ban, cùng sự giải thể đáng tiếc của phần lớn các chương trình hỗ trợ dành cho Chính phủ.\n\nDù là một đòn giáng nặng nề giáng vào mối quan hệ của chúng ta với nước Đức, và là mối quan ngại sâu sắc đối với Tổng thống Tào cùng Bộ trưởng Cao Lăng Úy, sự kiện này đã giáng một đòn chí mạng hơn nữa vào chính Thịnh Vượng Đồng Minh trong Nghị viện. Khi khối liên minh chính trị này gần như mất sạch chỗ dựa lưng và nguồn tài trợ chính, một bộ phận lớn các nghị sĩ của họ đã đào tẩu sang Chính Học Hội, tạo nên sự hồi sinh mạnh mẽ cho các thành viên và sự ủng hộ tự do trung lưu, độc lập."
 league_collapse_events.66.a: "Một cái giá quá nhỏ để đánh đổi lấy sự Cứu vong Dân tộc."

 league_collapse_events.67.t: "[QIE.GetNameDefCap] cam kết ủng hộ"
 league_collapse_events.67.d: "Liên minh giờ đây đang nằm thoi thóp; những đống tro tàn đổ nát hiển hiện nơi những tên tài phiệt Đức từng chè chén say sưa với đám quan chức Nam Kinh mà giờ đây quân đội của chúng đang tan rã và cấu xé lẫn nhau. Không chỉ có lòng quả cảm và sự tận hiến của binh sĩ để đưa các mục tiêu của chúng ta đến thắng lợi cuối cùng, chúng ta còn có được sự ủng hộ của chính Ngô Bội Phu vĩ đại, và cùng với ông là cả Đội quân Hoàng gia. Mọi quân cờ đã được sắp đặt vào vị trí; thời khắc đã điểm để kết liễu sự tồn tại thảm hại của Liên minh. Như phượng hoàng tái sinh từ đống tro tàn, Trần Soái sẽ dõi theo sự hồi sinh vĩ đại của Trung Hoa!"
 league_collapse_events.67.a: "Tổng động viên quân đội!"

 league_collapse_events.68.t: "Hội kiến Phụng Thiên"
 league_collapse_events.68.d: "Hoạt động trong những căn phòng tối mờ ám và thông qua mạng lưới ngầm của Hắc Long Hội, [ANQ.GetLeader] đã thiết lập được liên lạc thành công với [FNG.GetNameDef]. Mặc dù tầm ảnh hưởng sâu rộng của người Nhật trong các công việc nội bộ của chính phủ họ đe dọa biến những lời thề chống nhượng địa của Trần thành một trò hề châm biếm, ông hoàn toàn nhận thức được rằng mình không có nhiều sự lựa chọn trong vấn đề này, và yêu cầu công nhận Phụng Thiên là chính phủ hợp pháp duy nhất của Trung Hoa từ phía họ là một cái giá quá đỗi hợp lý để đổi lấy sự hỗ trợ đang vô cùng cấp bách.\n\nGiờ đây, khi chuyến hàng đầu tiên chở đầy vàng thỏi và vũ khí bộ binh đã cập bến An Khánh, chứng minh rằng Phụng Thiên sẵn sàng giữ đúng lời hứa, cùng với việc quân đội Nam Kinh đang rầm rộ điều động cho một cuộc xâm lược vào lãnh thổ của chúng ta, có vẻ như thời gian chờ đợi đã hoàn toàn kết thúc. Chúng ta sẽ ra tay trước và giáng đòn thật mạnh, đảm bảo rằng lũ bù nhìn tay sai của Đức ở vùng duyên hải sẽ không còn khả năng áp bức Trung Hoa thêm một ngày nào nữa!"
 league_collapse_events.68.a: "Tuyên chiến với Liên minh!"

 league_collapse_events.69.t: "Trần ngả theo Phụng Thiên"
 league_collapse_events.69.d: "Sự sụp đổ của Liên minh Bát tỉnh dưới trướng Tôn Truyền Phương đã gây ra sự hỗn loạn to lớn khắp Trung Hoa, và với việc khu vực này đang nhanh chóng trượt dài vào một cuộc chiến tranh tổng lực, dường như [ANQ.GetLeader], người đứng đầu [ANQ.GetNameDef], đã buộc phải tìm kiếm sự trợ giúp từ bên ngoài Bắc Kinh. Quyết định công nhận Phụng Thiên là chính phủ hợp pháp của Trung Hoa của ông ta đã giáng một đòn nặng nề vào người Đức và đám tay sai Mãn Thanh của họ. Bằng việc liên minh với [FNG.GetLeader], [ANQ.GetLeader] đã trở thành đồng minh của chúng ta, dẫu vậy lập trường bài trừ nhượng địa gay gắt của Trần vẫn là một rào cản lớn đối với sự hợp tác và đặt ra dấu hỏi lớn về tính hữu dụng của ông ta như một con bài ủy nhiệm cho các lợi ích của Nhật Bản. Tuy nhiên, việc hỗ trợ kín đáo cho Trần sẽ làm suy yếu kẻ thù và củng cố đồng minh của chúng ta — một mục tiêu rất đáng để theo đuổi."
 league_collapse_events.69.a: "Chúng ta sẽ theo dõi sát sao với sự quan tâm đặc biệt"

### Section 3 - League War Defections AND beginnings and secessions of HNN and GXC ###

 #league_collapse_events.100 is a hidden event

 league_collapse_events.101.t: "Chiết Giang sát cánh cùng Giang Tô"
 league_collapse_events.101.d: "Dù Trần Nghi và Lư Hương Đình chưa bao giờ thực sự đồng thuận với Tề Tạ Nguyên, có vẻ như họ lại càng không mấy hào hứng trước cuộc nổi loạn của Trần Điều Nguyên ở phía tây. Tổng tư lệnh Quân đội Chiết Giang Lư Hương Đình đã vô cùng bàng hoàng khi nghe tin về cái chết của người bạn cũ, và Đốc quân Trần Nghi đã công khai lên án đó là hành vi phản trắc tột cùng của An Huy. Trong nỗi đau buồn chung, hai nhà lãnh đạo Chiết Giang đã tổng động viên lực lượng của mình để chuẩn bị cho cả chiến dịch tranh giành quyền bá chủ Liên minh của Trần Điều Nguyên lẫn mối đe dọa đang lơ lửng từ phương Nam.\n\nTrần Nghi có thể từng có cảm tình với Quốc dân Đảng trong cuộc Bắc phạt một thập kỷ trước, nhưng bóng ma kích động hỗn loạn của Chủ nghĩa Bolshevik sẽ chỉ phá hỏng toàn bộ những thành quả mà ông đã gầy dựng dưới một thập kỷ bá quyền của Trực hệ. Vốn là một người ủng hộ nhiệt thành của chủ nghĩa can thiệp kinh tế nhà nước, học thuyết chủ nghĩa xã hội nhà nước của Trần Nghi đã trở thành điểm tựa cho mô hình phát triển Đông Trung Hoa, tiếp thu nguồn cảm hứng từ nền kinh tế thời chiến của Đức, kế hoạch kinh tế Svobodnik của Nga và chủ nghĩa nhà nước của Nhật Bản.\n\nCuộc viễn chinh chống nhượng địa tự xưng là chính nghĩa của Trần Điều Nguyên sẽ chỉ mang lại sự bất ổn cho một vùng đất từng thịnh vượng của Trung Hoa, và Quốc dân Đảng sẽ thiêu rụi mô hình không tưởng của ông thành tro bụi để phục vụ cho việc mị dân công nông. Trong một bài phát biểu trước binh sĩ, Trần Nghi đã tuyên bố rằng Quân đội Chiết Giang xuất quân vì sự phồn vinh của thường dân, và vì sự bảo tồn của một nền quản trị Trung Hoa chuẩn mực trước những kẻ phản nghịch An Huy cùng lũ thổ phỉ cộng sản. Thống soái Tề có thể không chia sẻ tầm nhìn không tưởng của Trần về tương lai Trung Hoa, nhưng ông không khỏi cảm thấy biết ơn sâu sắc đối với người theo chủ nghĩa Liên bang Chiết Giang này."
 league_collapse_events.101.a: "Trần Nghi và Lư Hương Đình biết rõ phải trái đúng sai!"

 league_collapse_events.104.t: "\"Kẻ Khờ\" tuyên chiến"
 league_collapse_events.104.d: "Việc Đốc quân Tề bước lên cương vị Quyền Thống soái Liên minh đương nhiên không nhận được sự đồng thuận từ phần lớn mọi người. Với việc Bắc Kinh né tránh bình luận khi còn đang phải vật lộn giải quyết các vấn đề nội bộ, các tỉnh khác nhau đã có những phản ứng từ chối công nhận quyền lực của Tề cho đến thẳng thừng tuyên bố ông ta là kẻ phản bội và độc tài. Một số tạp chí và tờ báo đã bắt đầu liên hệ giữa việc Tề tiếp quản vị trí Thống soái Liên minh với việc ông ta lập tức kế vị Đốc quân Lý Thuần vào những năm 1920 sau \"vụ tự sát\" đầy bí ẩn của Lý.\n\nDẫu vậy, Tề không hề lãng phí thời gian mà lập tức vung gươm thị uy, đòi hỏi sự quy phục từ những Đốc quân chưa chính thức tuyên thệ trung thành. Đe dọa trừng phạt nhanh chóng đối với tất cả những ai bị ông ta coi là phản trắc, Tề yêu cầu sự công nhận từ Hồ Nam, Quảng Đông và Quảng Tây, nhưng chẳng thu được kết quả gì. Tương tự, ông ta trực tiếp đe dọa Trần Nghi bằng những bóng gió về một cuộc xâm lược nhằm đảm bảo sự trung thành bên trong Chiết Giang. Tuy nhiên, cấp bách nhất vẫn là những tối hậu thư gửi tới người Đốc quân ly khai Trần Điều Nguyên.\n\nLiên tục vũ trang hóa khu vực biên giới với Liên minh kể từ sau khi tuyên bố ly khai không chính thức, rất ít người hiểu được ý đồ thực sự của Trần là gì. Liệu ông ta đang chờ đợi để tấn công Nam Kinh khi cơ hội mở ra? Hay chỉ đơn thuần là bảo vệ lãnh địa của mình trước làn sóng hỗn loạn. Tuy nhiên, sau yêu cầu của Thống soái Liên minh Tề đòi Trần phải quy phục uy quyền của Liên minh, Trần đã đáp trả bằng một đòn tấn công phủ đầu của chính mình.\n\nKêu gọi các đốc quân đồng liêu và chính phủ trung ương cùng chung tay giúp sức, Trần Điều Nguyên đã lên án sự lên ngôi của Thống soái Tề là \"hoàn toàn bất hợp pháp\" và là một \"trò hề\", cáo buộc Tề đã lên kế hoạch ám sát Tôn và dàn dựng màn cướp đoạt quyền lực này từ rất lâu trước đó. Luận điểm này, vốn được nhiều cấp dưới mới và cấp trên cũ của Tề chia sẻ, đã nhanh chóng tỏ ra đầy sức thuyết phục. Hàng loạt sĩ quan trẻ đã bắt đầu đào ngũ và chạy sang hàng ngũ của ông ta. Kèm theo đó, một loạt các đơn vị thuộc quân đội An Huy đã bắt đầu tràn qua biên giới Giang Tây và Giang Tô, với dã tâm đặt Nam Kinh dưới sự thống trị của mình."
 league_collapse_events.104.a: "Thật là một lũ lợn không thể dung thứ!"

 league_collapse_events.105.t: "Lưỡng Quảng ly khai!"
 league_collapse_events.105.d: "Im lặng một cách đáng sợ sau những biến cố gần đây, vùng đất Lưỡng Quảng từ lâu đã luôn xa cách và mất kết nối với cấu trúc chung của Liên minh. Ban đầu, Nam Trực Lệ và Bắc Trực Lệ từng tranh giành gay gắt về việc cài cắm các đốc quân của riêng mình vào các tỉnh Quảng Tây và Quảng Đông. Với việc Cựu Quế hệ dưới trướng Lục Vinh Đình già nua miễn cưỡng được Bắc Kinh công nhận, chiếc ghế Đốc quân Quảng Đông là một cuộc hỗn chiến tự do giữa Lục, Trần Liêm Bá và Thẩm Hồng Anh. Sau khi các lực lượng của Liên minh rút khỏi các tỉnh Lưỡng Quảng sau cuộc Khởi nghĩa Thượng Hải năm 1932, Liên minh chưa bao giờ có thể mở rộng thêm bất kỳ ảnh hưởng đáng kể nào vào Quảng Đông hay Quảng Tây nữa, ngoại trừ sự phục tùng trên danh nghĩa và viên tay sai của họ, Thẩm Hồng Anh.\n\nTuy nhiên, sự im lặng từ phương Nam đã chính thức bị phá vỡ vào tối nay khi một cuộc tiến công của Quốc dân Đảng từ Quý Châu và Vùng Căn cứ Khởi nghĩa Mân Cám vào Quảng Tây và Quảng Đông đã đánh dấu sự ly khai trên thực tế của hai tỉnh này khỏi Liên minh Bát tỉnh. Cùng với cuộc tấn công của Quốc dân Đảng, tình hình căng thẳng vốn âm ỉ tại Lưỡng Quảng kể từ ngày Lục Vinh Đình qua đời đã bùng nổ thành một cuộc xung đột công khai giữa Việt quân của Diệp Cử, Cựu Quế hệ, Đoàn Bảo vệ Thương nhân và Quốc dân Đảng.\n\nVới việc Đốc quân Trần Điều Nguyên cùng quân đội An Huy của ông ta đã công khai giao chiến với Liên minh, bước ngoặt này thực sự là một thảm họa khôn lường, và trong hầu hết các trường hợp sẽ đòi hỏi một sự đáp trả ngay lập tức. Tuy nhiên, rõ ràng là Quyền Thống soái Liên minh Tề lúc này đang hoàn toàn bị trói chân trói tay."
 league_collapse_events.105.a: "Chúng ta sẽ sớm dập tắt ngọn lửa của chúng thôi."

 league_collapse_events.106.t: "Hồ Nam ly khai!"
 league_collapse_events.106.d: "Vốn là tỉnh tự trị nhất trong Liên minh, Hồ Nam đã nằm im chờ thời khi các sự kiện dồn dập nổ ra kể từ đầu năm nay. Được Ngô Bội Phu phục chức, Đốc quân Triệu Hằng Dịch ban đầu chỉ gia nhập Liên minh nhằm tìm kiếm sự hỗ trợ vật chất để tái lập trật tự tại Hồ Nam. Tỉnh này đã chủ động tạo khoảng cách rõ rệt vào năm 1932 sau một phen hoảng loạn ngắn, khi các lực lượng của Tướng Diệp Khai Tân tiến ra biên giới Giang Tây để ngăn chặn những người xã hội chủ nghĩa tràn vào Hồ Nam. Nhờ sự can thiệp của Ngọc Soái, Hồ Nam đã giành đủ quyền tự trị để giữ quân đội của chúng ta nằm ngoài bờ cõi tỉnh, và sự kìm kẹp của chúng ta đối với Hồ Nam kể từ đó chỉ ngày một suy yếu.\n\nNhưng trước sự kiện Lưỡng Quảng ly khai, Đốc quân Triệu đã quyết định rằng đã đến thời điểm phải hành động. Luôn đóng vai một nhà dân chủ, ông đã đệ trình một Dự luật lên Hội đồng Tỉnh để chính thức ly khai khỏi Liên minh. Tự mình đứng ra bảo trợ cho Dự luật, Triệu đã có một bài phát biểu nhấn mạnh rằng Hồ Nam không thể tiếp tục gắn mình với sự thối nát của Liên minh, rằng Liên minh đã hoàn toàn thất bại trong việc mang lại bất kỳ sự ổn định nào, và nếu họ không dứt khoát đoạn tuyệt với Liên minh, ngọn lửa chiến tranh sẽ thiêu rụi toàn bộ tỉnh nhà.\n\nHội đồng dường như đã bị lay động sâu sắc bởi những lời lẽ này, đại đa số đã bỏ phiếu áp đảo ủng hộ việc ly khai, và cùng với cuộc bỏ phiếu đó, Đốc quân Triệu đã chính thức tuyên bố mọi hiệp ước mà Hồ Nam từng ký kết với Thống soái Liên minh đều bị hủy bỏ và vô giá trị. Dù chúng ta rất muốn xuất quân thảo phạt Hồ Nam vì sự ngang bướng này, nhưng việc quân đội của Trần đã áp sát ngay trước cửa ngõ buộc chúng ta phải cắn răng nhẫn nhịn sự bất tuân từ Đốc quân Hồ Nam, ít nhất là trong thời điểm hiện tại."
 league_collapse_events.106.a: "Họ cứ việc tận hưởng nền tự trị của mình khi còn có thể đi."

### Section 4 - Flavour Events About the Collapse ###

 league_collapse_flavour_events.1.t: "Vụ bán tuyến Đường sắt Chiết Cám"
 league_collapse_flavour_events.1.d: "Vài tuần qua đã chứng kiến một làn sóng hoạt động kinh tế nhộn nhịp tại Liên minh Bát tỉnh — khối liên minh các tỉnh phương Nam do thuộc hạ danh nghĩa của chúng ta, Tôn Truyền Phương, cai trị. Chịu ảnh hưởng sâu sắc hơn chúng ta rất nhiều từ sự hỗ trợ kinh tế của Đức, Liên minh vừa hoàn thành việc xây dựng một tuyến đường sắt trọng điểm: tuyến Chiết Cám. Mặc dù do người Đức tài trợ vốn, tuyến đường phần lớn được xây dựng bằng mồ hôi nước mắt của công nhân Trung Hoa, thắp lên hy vọng cho nhiều người về một mối quan hệ bình đẳng hơn giữa người Đức và người Hoa trong Liên minh, ít nhất là trong các vấn đề kinh tế.\n\nThế nhưng vài ngày trước, trong một động thái gây kinh ngạc, AOG đã công khai tuyên bố kế hoạch mua lại và hợp nhất hàng loạt tuyến đường sắt phía đông dưới danh nghĩa tập đoàn con của họ là Công ty Đường sắt Sơn Đông — bao gồm cả tuyến Chiết Cám mới toanh này.\n\nĐộng thái này đã chọc giận rất nhiều người dân Trung Hoa bản địa trong Liên minh, những người từng nhìn nhận tuyến Chiết Cám như một viên gạch nền móng xây đắp mối quan hệ bình đẳng giữa người Âu và người Á. Các cuộc biểu tình quy mô lớn đã bùng phát, càng thêm rực lửa bởi những thuyết âm mưu về sự gian lận và biển thủ công quỹ của bè lũ tay chân thân tín dưới trướng Tôn."
 league_collapse_flavour_events.1.a: "Chúng ta cần phải để mắt kỹ chuyện này."

 league_collapse_flavour_events.2.t: "Làn sóng tấn công người ngoại quốc lan rộng"
 league_collapse_flavour_events.2.d: "Tiếp sau những bất ổn xung quanh tuyến đường sắt Chiết Cám, hàng loạt nhà đầu tư và thương nhân người Đức đã bị các đám đông bài ngoại cuồng loạn tấn công một cách dã man. Làm cho tình hình thêm tồi tệ, các cuộc tẩy chay hàng hóa Đức trên diện rộng đã bắt đầu bùng lên ở miền Nam, và sáng nay các báo cáo gửi về Bắc Kinh cho biết các nhà ga đường sắt tại Hàng Châu và các thành phố khác trên tuyến Đường sắt Trung Hoa đã bị đánh bom. Giao thông vận tải đã bị đình trệ hoàn toàn tại nhiều khu vực của Liên minh, và các du kích quân Quốc dân Đảng tại Mân Cám đã chớp lấy thời cơ này để tổ chức các cuộc tấn công ngày càng táo bạo vào các tiền đồn biệt lập của Liên minh.\n\nĐại sứ Đức tại Bắc Kinh đã đưa ra yêu cầu phải có người chịu trách nhiệm, và mặc dù Liên minh phần lớn tự trị ngoài tầm kiểm soát của chúng ta, về mặt danh nghĩa họ vẫn nằm dưới sự bảo trợ của triều đình. Vương Thành Bân cùng các quan chức Trực hệ khác từ lâu đã thúc đẩy việc áp đặt quyền kiểm soát lớn hơn đối với Liên minh, và đang hối thúc Ngô Bội Phu lợi dụng cuộc khủng hoảng này để tạo đòn bẩy gia tăng ảnh hưởng xuống phương Nam. Ngô Soái, người từ lâu đã tìm kiếm một cái cớ để kiềm tỏa Tôn, hiện đang soạn thảo một bức điện tín yêu cầu Tôn phải giải trình trách nhiệm và đề nghị hỗ trợ nếu ông ta cần. Dĩ nhiên, điều không được nói ra công khai chính là yêu cầu gia tăng quyền kiểm soát đối với các công việc nội bộ của Liên minh một khi Tôn chấp nhận sự giúp đỡ."
 league_collapse_flavour_events.2.a: "Hãy chờ xem Tôn có gì để giải thích..."

 league_collapse_flavour_events.3.t: "Sự biến Vu Hồ"
 league_collapse_flavour_events.3.d: "Những thông tin đầy bất an đã bay về Lạc Dương và Bắc Kinh vào sáng nay. Mặc dù các báo cáo có phần mâu thuẫn lẫn nhau, dường như đã xảy ra một vụ thảm sát người biểu tình hòa bình do quân đội Liên minh và binh lính Đức thực hiện tại thành phố Vu Hồ. Một số nguồn tin khẳng định lính Đức đơn giản là đã xả súng xối xả vào những người biểu tình, trong khi những nguồn khác lại quả quyết rằng một nhóm phần tử cấp tiến thuộc Quốc dân Đảng đã nổ súng tấn công quân Đức và lính Liên minh trước. Dù nguyên nhân thực sự là gì, thành phố đã rơi vào cảnh hỗn loạn vô chính phủ và các cuộc biểu tình đã bùng lên khắp các ngả đường Liên minh.\n\nMỉa mai thay, ngay tại thời điểm chúng ta nhận được thông tin này, chúng ta cũng nhận được một bản báo cáo từ Tôn Truyền Phương khẳng định rằng ông ta vẫn nắm giữ tình hình trong tầm kiểm soát. Một số tướng lĩnh Trực hệ như Thái Thành Huân đang thúc ép một cuộc can thiệp quân sự quy mô lớn xuống phía nam nếu tình hình xấu đi hơn nữa, nhưng Ngô Soái vẫn chưa đưa ra lập trường rõ ràng về vấn đề này, do lo ngại sự can thiệp từ phía Trương Tác Lâm.\n\nLàm trầm trọng thêm các rắc rối của chúng ta, Bạch Kiên Vũ đã báo cáo với Ngọc Soái rằng Trung Hoa Đế quốc Cải cách Hội bằng cách nào đó đã nắm được thông tin về vụ việc, có lẽ từ các mối liên hệ với những phần tử cấp tiến đang rải rác khắp các khu tô giới. Dường như họ đang lên kế hoạch tổ chức một bài phát biểu chỉ trích gay gắt tại phiên họp Nghị viện chiều nay, lên án sự bất động của Trực hệ. Các nghị sĩ thuộc Hiệp Hòa Hội của Tào Côn đang khẩn trương phối hợp cùng Tổng thống để chuẩn bị phương án đối phó, nhưng rõ ràng là chúng ta đã bị đánh úp hoàn toàn bất ngờ."
 league_collapse_events.3.a: "\"Trong tầm kiểm soát\" cái nỗi gì chứ..."

 league_collapse_flavour_events.4.t: "An Huy ly khai"
 league_collapse_flavour_events.4.d: "Tỉnh An Huy, từ lâu đã rên xiết dưới ách cai trị độc tài của Tôn Truyền Phương, về cơ bản đã tuyên bố độc lập khỏi Liên minh vào tuần này. Trong một bản truyền đơn được phát tán rộng rãi, Đốc quân Trần Điều Nguyên tuyên bố rằng sự biến Vu Hồ \"cho thấy Tôn hoàn toàn bất lực trong việc xử lý cuộc khủng hoảng này, và về bản chất đã tước bỏ mọi quyền hạn cũng như trách nhiệm của ông ta tại An Huy.\"\n\nTiêu Diệu Nam, Vương Thành Bân và Lý Kỷ Thần — các Đốc quân của Hồ Bắc, Trực Lệ và Hà Nam — đã đơn phương bắt đầu tổng động viên quân đội của họ để chống lại các \"cuộc xâm nhập tiềm tàng của Quốc dân Đảng\", dù Trương Kỳ Hoàng đã cảnh báo Ngô Soái rằng ý đồ thực sự của họ nhiều khả năng là nhằm ngăn chặn sự hỗn loạn tràn vào vùng Trung Nguyên, có nguy cơ làm leo thang xung đột với Trần, Tôn hoặc thậm chí là [SHD.GetLeader]. Nhằm dập tắt cơ hội để họ tự ý xuất binh và gây ra một cuộc chiến tranh thảm khốc khác tương tự như cuộc xung đột đã châm ngòi cho Chiến tranh Trực - Phụng lần thứ hai, sáng nay Ngô Soái đã ban bố \"tình trạng sẵn sàng chiến đấu toàn quốc\" trước toàn thể Bộ Tổng tham mưu Quân đội Bắc Dương quy tụ, hối thúc họ chuẩn bị sẵn sàng binh sĩ cho \"mọi cuộc xung đột vũ trang có thể xảy ra\", và đặt các đồn binh tại biên giới Thiểm Tây cùng Phụng Thiên trong tình trạng báo động cao độ. Các binh sĩ Trực hệ đầy hoang mang phần lớn đã phải chấp hành mệnh lệnh của Ngô, và mọi mưu toan tấn công sớm xuống phía nam đã bị dập tắt hiệu quả trước khi nó kịp bắt đầu."
 league_collapse_flavour_events.4.a: "Hy vọng điều này sẽ giữ chân được bọn họ"

 league_collapse_flavour_events.5.t: "Người tị nạn chạy trốn khỏi cơn hỗn loạn của Liên minh"
 league_collapse_flavour_events.5.d: "Trước tình trạng bất ổn diện rộng đang càn quét khắp Liên minh Bát tỉnh, Đốc quân Lý Kỷ Thần của Hà Nam và Tiêu Diệu Nam của Hồ Bắc đã gửi điện tín khẩn cho Tổng thống Tào và Thống chế Ngô, thông báo về làn sóng người tị nạn ngày càng đông đang tràn vào bờ cõi tỉnh của họ, khẩn thiết cầu xin bất kỳ phản ứng hoặc sự hỗ trợ khả dĩ nào từ chính phủ. Mặc dù ban đầu chỉ là một dòng người nhỏ giọt, nhưng chỉ trong vài ngày qua, dòng người đã tăng vọt một cách khủng khiếp, với toàn bộ các gia đình bồng bế nhau tháo chạy khỏi cơn bão bạo lực và thổ phỉ đang bùng nổ dữ dội.\n\nGửi tiếp những bức điện tín báo cáo sau đó, các Đốc quân đã báo cáo lên Nội các rằng sau khi cử người đến tổ chức phân loại và thẩm vấn người tị nạn, hóa ra quyền lực của chính quyền bên trong các tỉnh thuộc Liên minh đã sụp đổ nghiêm trọng hơn rất nhiều so với những gì người ta từng tưởng tượng trước đây. Hơn nữa, họ đã khẩn xin Bắc Kinh cấp thêm lương thực và quân nhu để xử lý số lượng người tị nạn khổng lồ này. Bị cản trở bởi sự kém hiệu quả của bộ máy quan liêu, chính quyền cấp tỉnh rệu rã và nguồn tài chính eo hẹp, bất kỳ sự hỗ trợ nào mà Nội các quyết định cung cấp sẽ là một gánh nặng chi phí vô cùng đắt đỏ, ngay cả khi đó là hành động nhân đạo duy nhất cần làm."
 league_collapse_flavour_events.5.a: "Tin tức thật tồi tệ. Hãy gửi hàng cứu trợ đi."
 league_collapse_flavour_events.5.b: "Với một trái tim trĩu nặng, chúng ta buộc phải từ chối."

 league_collapse_flavour_events.6.t: "Tắm máu trên sông Trường Giang!"
 league_collapse_flavour_events.6.d: "Bất chấp những nỗ lực tột cùng của họ, dòng người tị nạn tràn vào các tỉnh phía nam đã chứng minh là một gánh nặng quá sức chịu đựng. Bản thân các Đốc quân đã gửi hàng loạt bức điện tín tới Nội các và Tổng thống để khẩn cầu sự hỗ trợ tăng cường nhằm giảm tải cho bộ máy chính quyền đang oằn mình của họ. Sau một tuyên bố thiết quân luật trên toàn tỉnh được ban bố tại Hồ Bắc, Đốc quân Tiêu Diệu Nam đã ra lệnh cho quân đội của mình phong tỏa mọi cây cầu và các tuyến đường dẫn vào tỉnh từ lãnh thổ cũ của Liên minh, từ chối cho phép bất kỳ người tị nạn nào bước chân qua. Một lượng lớn người dân kiệt quế, mất nhà cửa và giận dữ đã bắt đầu tụ tập đông nghẹt tại một cây cầu bắc qua sông Trường Giang ở ngoại vi Vũ Hán.\n\nĐòi hỏi được quyền tiến vào trong tỉnh, sự việc ban đầu khởi phát như một cuộc biểu tình hòa bình, kêu gọi hành động có trách nhiệm từ phía chính quyền. Tuy nhiên, nó nhanh chóng biến tướng thành một cuộc bạo loạn gần như toàn diện khi những người tị nạn bắt đầu phản ứng dữ dội chống lại quân đội của Tiêu, ném đá tới tấp vào lính biên phòng. Cuối cùng, một nhóm người bằng cách nào đó đã tự trang bị được vũ khí cướp được — có lẽ do sự cẩu thả của chính binh lính dưới trướng Tiêu — bắt đầu nổ súng vào lính biên phòng; các binh sĩ lập tức đáp trả bằng cách khai hỏa, ban đầu là những phát súng cảnh cáo, và sau đó bắn thẳng vào các tay súng đối diện. Những người không tham gia vào cuộc đụng độ hoảng loạn tháo chạy, giẫm đạp lên những người tị nạn khác và bỏ mặc bạn bè hay người thân của mình nằm chết la liệt trên mặt cầu. Những cảnh tượng rùng rợn như vậy đã liên tục lặp lại dọc khắp biên giới của chúng ta với Liên minh, Tứ Xuyên và Sơn Đông, khi những đám đông tị nạn trốn chạy nội chiến và thống khổ lại đâm đầu vào một thảm kịch đẫm máu tàn khốc hơn nữa."
 league_collapse_flavour_events.6.a: "Một đại tai ương! Thật là kinh hoàng!"

 league_collapse_flavour_events.7.t: "Các Đốc quân phương Nam cắt đứt liên lạc"
 league_collapse_flavour_events.7.d: "Trước tình trạng bạo lực bên trong Liên minh leo thang từng ngày, các Đốc quân của Vân Nam và Quảng Đông, [YUN.GetLeader] và [GXC.GetLeader], gần như đã cắt đứt hoàn toàn việc hồi đáp các yêu cầu cung cấp thông tin và báo cáo tình hình chính thức từ chính phủ về các diễn biến đang diễn ra trong lãnh thổ của họ. Từ lâu họ đã căm ghét chính phủ của chúng ta, khi cả hai đều kịch liệt phản đối những gì họ coi là những tên Quân phiệt đê tiện lộng quyền quá trớn và đám quan chức mục nát quá đỗi ngu muội không chịu nhìn ra ánh sáng — thậm chí đến mức Đốc quân [YUN.GetLeader] từng phát động một cuộc chiến tranh liên minh với Phụng Thiên cách đây không lâu. Dù không phải là điều bất ngờ, và trên thực tế là hoàn toàn có thể lường trước được trong hoàn cảnh này, đây có lẽ là chiếc đinh cuối cùng đóng vào cỗ quan tài đại diện cho thái độ chính thức của họ đối với chính phủ chúng ta.\n\nNhiều người trong vòng thân cận của Trực hệ lo sợ rằng điều này báo hiệu sự sụp đổ hoàn toàn quyền lực của chúng ta, và tin tức từ tỉnh Sơn Tây càng củng cố thêm cho những nỗi sợ hãi đó. Kẻ phản trắc Phùng Ngọc Tường, người từng là một thành viên cốt cán của chính Trực hệ trước khi bị tước bỏ quyền kiểm soát tại Bắc Kinh vào năm 1926 và bị lưu đày sang Thiểm Tây một khi các Đốc quân họ Mã vùng Tây Bắc tỉnh ngộ, đã chính thức lên án các hành động của chính phủ chúng ta trong sự kiện mà quốc tế hiện đang gọi là \"Sự biến Trường Giang\" diễn ra hồi đầu tuần — ám chỉ những diễn biến đẫm máu gần đây xảy ra giữa các tỉnh Hồ Bắc, Hà Nam cùng vùng đất kiểm soát trên thực tế của chúng ta là Sơn Đông và Thiểm Tây.\n\nTuyên bố chính phủ của chúng ta hoàn toàn bất tài, \"không đủ tư cách để cai trị Trung Hoa\", người đồng minh trên danh nghĩa của ông ta tại Thái Nguyên là Đốc quân Diêm Tích Sơn xa cách của chúng ta đã lên án bạo lực chẳng khác nào hành vi dã man man rợ, nhưng khôn khéo dừng lại trước việc chỉ trích đích danh Nội các, Ngô Soái hay Tào Côn. Rõ ràng là ông ta không muốn đánh đổi lập trường trung lập của mình. Dẫu vậy, rõ ràng là trật tự quốc gia từng được gây dựng bằng bao xương máu đang trên đà sụp đổ hoàn toàn."
 league_collapse_flavour_events.7.a: "Biển lửa thịnh nộ khổng lồ đang nuốt chửng chúng ta."

 #league_collapse_flavour_events.8 uses loc from league_collapse_events.57

 league_collapse_flavour_events.9.t: "Tiếu Diện Hổ tàn hơi"
 league_collapse_flavour_events.9.d: "Bóng tối mịt mù từ lâu đã bao trùm lấy căn phòng của Thống soái Liên minh. Nằm đó một cách lặng lẽ và yếu ớt, Tôn Truyền Phương — người từng là nhân vật quyền lực thứ ba trên toàn cõi Trung Hoa — giờ đây chẳng khác nào một khối thịt bất động. Ít nhất, đó là những gì những kẻ gièm pha ông nghĩ. Nhưng đối với những người khác, đối với hàng ngàn người bạn tri kỷ của ông, nỗi đau buồn của họ là sâu sắc khôn nguôi, sự tiếc thương là vĩnh cửu, và những ký ức thì chẳng thể phai mờ. Căn phòng thường xuyên đón nhận những chuyến thăm viếng từ các cộng sự thân cận nhất, những người bằng hữu, và dĩ nhiên là cả những người con ruột thịt của ông. Khóc lóc thành những dòng sông nước mắt tang thương, họ chỉ biết nguyện cầu cho sự bình phục của Tôn, trong khi các bác sĩ người Đức làm việc thâu đêm suốt sáng để cứu vãn hơi thở của Mãnh Hổ, mong ông có thể một lần nữa nhe nanh giương vuốt.\n\nNgay giữa màn đêm tĩnh mịch của Nam Kinh, giữa tiếng súng giao tranh vọng lại, tiếng bom nổ chát chúa và những tiếng gào thét hỗn loạn, chỉ có một bóng hình duy nhất ngồi lặng lẽ trong phòng bệnh cùng Thống soái Liên minh Tôn. Nghịch chiếc bật lửa trên tay, ẩn mình trong những góc tối của căn phòng, Quyền Thống soái Liên minh Tề Tạ Nguyên lạnh lùng dõi nhìn thân xác đang hôn mê của Tôn Truyền Phương. Đội ngũ bác sĩ Đức dĩ nhiên đều nằm dưới quyền sai bảo của hắn. Hắn chính là kẻ đang nắm giữ chiếc chìa khóa duy trì sợi dây sinh mệnh mong manh của Tôn. Và hắn hoàn toàn có thể dập tắt nó dễ dàng như cách dập tắt ngọn lửa chiếc bật lửa trên tay.\n\nBật nắp, quẹt lửa, rồi lại đóng nắp lại. Tề lặp đi lặp lại động tác đó suốt hàng giờ đồng hồ như một kẻ vô hồn. Có quá nhiều suy nghĩ đang giằng xé tâm can viên Tướng quân. Tôn và Tề, họ thực sự từng là những đồng chí vào sinh ra tử. Cả hai đều sinh ra từ Nam Trực Lệ, cùng nhau chiến đấu ở miền Đông Nam suốt một thập kỷ ròng rã. Thế nhưng Tề chưa bao giờ tha thứ cho sự bất động của Tôn vào năm 1925. Khi Tề cần sự giúp đỡ nhất trên cương vị Đốc quân Chiết Giang, ông đã tha thiết cầu xin Tôn — khi đó là Đốc quân Phúc Kiến — đem quân ứng cứu. Cùng nhau, họ hoàn toàn có thể đứng vững trước cuộc tổng tấn công của Lư Vĩnh Tường và Trương Tông Xương. Vậy mà, Tôn lại chọn cách án binh bất động để tích lũy binh lực suốt một năm trời, thay vì lập tức phản công cứu viện.\n\nSự phản bội cay đắng đó đã khiến Tề phải trả một cái giá quá đắt! Chật vật tìm đường quay lại vũ đài quyền lực, ông đã được Tôn \"rộng lượng\" thu nạp sau khi Liên minh được thành lập. Bằng sự khôn khéo của mình, Tề đã làm mọi công việc bẩn thỉu nhất cho Tôn, và giờ đây cả hai đang ở đây: Một Tôn Truyền Phương hoàn toàn bất lực, và một Tề Tạ Nguyên nắm giữ mọi quyền sinh quyền sát trong tay. Liệu ai có thể ngăn cản hắn? Rút ống thở ra ư?\n\nTin tức đã tràn ngập các mặt báo vào sáng hôm sau: Tôn Truyền Phương cuối cùng đã trút hơi thở cuối cùng vì vết thương quá nặng, qua đời ngay giữa đêm khuya. Các tờ báo đã đăng tải những bài điếu văn tưởng nhớ ông với một góc nhìn đầy mâu thuẫn, ca ngợi tính cách \"chân thực\", lòng yêu nước nồng nàn nhưng đồng thời cũng lên án sự tàn bạo khét tiếng của ông. Một tang lễ trọng thể theo nghi thức nhà nước được cho là sẽ diễn ra ngay sau khi trật tự được tái lập tại Liên minh. Mặc dù cái chết của Tôn chiếm trọn trang nhất của các bản tin buổi sáng, nó lại bị vây quanh bởi những báo cáo dồn dập về sự di chuyển của các đoàn quân, các vụ thảm sát sinh viên, và sự sụp đổ tan tành của chính đế chế do ông gầy dựng."
 league_collapse_flavour_events.9.a: "\"Thà chết ngàn lần dưới tay đồng bào mình còn hơn sống như một kẻ bán nước.\""

### Section 5 - League War Events ###
 league_war_events.1.t: "Binh sĩ của chúng ta đào ngũ!"
 league_war_events.1.desc: "Từng ngày trôi qua, sĩ khí của chúng ta đang sụp đổ tan tành. Chúng ta không có chiến thắng nào để phô trương, chẳng có vinh quang nào để nắm giữ, và đã bị đẩy vào một vòng xoáy chết chóc mà từ đó có thể sẽ không bao giờ gượng dậy được nữa. Những tâm phúc thân cận của [THIS.GetLeader] đã tha thiết khuyên ông nên nhanh chóng trốn chạy đến nơi an toàn, nhưng trong khi ông cự tuyệt và vẫn cố bám víu lấy niềm tin vào thắng lợi cuối cùng, binh lính của chúng ta thì đã bắt đầu tan rã và tan biến dần..."
 league_war_events.1.a: "Chúng ta chỉ cần thêm chút thời gian thôi mà!"

 # league_war_events.2 (hidden event)

 league_war_events.3.t.good: "Binh sĩ hăng hái"
 league_war_events.3.t.bad: "Tình trạng đào ngũ gia tăng"
 league_war_events.3.desc.good: "Người ta thường nói, khi một người lính tin rằng chiến thắng đã cận kề trong tầm tay, anh ta sẽ chiến đấu kiên cường hơn và thiện chiến hơn gấp bội. Dù điều đó có đúng hay không, những chiến thắng vang dội trên chiến trường gần đây đã góp phần nâng cao sĩ khí quân đội rất nhiều, tạo ra hiệu ứng tích cực rõ rệt cho toàn bộ nỗ lực chiến tranh."
 league_war_events.3.desc.bad: "Một chuỗi những sai lầm ngớ ngẩn, những bước lùi liên tiếp và vận đen đơn thuần đã khiến các lực lượng của chúng ta hoàn toàn bất lực trong việc hoàn thành các mục tiêu chiến lược. Chúng ta đang thất bại trong việc tạo ra bất kỳ bước tiến đáng kể nào, và khi cuộc chiến ngày càng kéo dài lê thê, ngày càng có nhiều binh lính bắt đầu nghi ngờ tính chính nghĩa của sự nghiệp này, rủ nhau rời bỏ hàng ngũ quân đội để quay về quê hương hoặc biến thành những toán thổ phỉ."
 league_war_events.3.a: "Làm tốt lắm..."
 league_war_events.3.b: "Thật là kinh khủng..."

 league_war_events.4.t.good: "Chiếm được kho dự trữ của địch"
 league_war_events.4.t.bad: "Tổn thất trang thiết bị"
 league_war_events.4.desc.good: "Cùng với những thắng lợi giòn giã trên chiến trường gần đây, binh sĩ của chúng ta vừa qua đã đánh chiếm thành công một kho quân nhu ngập tràn vũ khí khí tài của kẻ thù! Mặc dù các lực lượng địch khi tháo lui đã cố gắng phá hủy sạch sẽ để không để lại bất cứ thứ gì cho chúng ta, tốc độ tiến công thần tốc của quân ta đã khiến chúng hoàn toàn bị đánh úp bất ngờ."
 league_war_events.4.desc.bad: "Trước một loạt thất bại nặng nề trên chiến trường, sĩ khí quân đội đã chạm đáy vực thẳm. Trong lúc rút lui trước bước tiến của quân địch, một nhóm binh lính được giao nhiệm vụ vận chuyển quân nhu lùi sâu về phía thủ phủ đã bất ngờ đào ngũ và ôm theo toàn bộ số nhu yếu phẩm đó trốn thoát. Điều này không chỉ thể hiện sự suy đồi nghiêm trọng về kỷ luật quân đội nói chung, mà còn là một tổn thất nặng nề giáng vào tình hình hậu cần tiếp tế của chúng ta."
 league_war_events.4.a.good: "Tuyệt hảo!"
 league_war_events.4.b.bad: "Lũ ăn cắp, toàn một giuộc với nhau cả"

 league_war_events.5.t.good: "[THIS.GetLeader] được ngợi ca"
 league_war_events.5.t.bad: "[THIS.GetLeader] bị công kích"
 league_war_events.5.desc.good: "Những bước tiến vũ bão trong cuộc chiến tranh gần đây đã củng cố vững chắc vị thế quyền lực của [THIS.GetLeader]. Những thành viên trong chính phủ từng một thời lớn tiếng chỉ trích sự lãnh đạo của ông giờ đây đã bắt đầu im hơi lặng tiếng, trong khi những tiếng nói ca ngợi ủng hộ lại ngày một lớn hơn. Nếu chiều hướng thuận lợi này tiếp tục được duy trì, cuộc chiến tranh sẽ sớm đi đến hồi kết thắng lợi."
 league_war_events.5.desc.bad: "Những bước lùi liên tiếp trong cuộc chiến tranh gần đây đã mang lại làn sóng chỉ trích ngày càng dữ dội nhắm vào sự lãnh đạo của [THIS.GetLeader]. Những tiếng nói chống đối sự cai trị của ông ngày một lớn hơn, cùng với những lời đồn đại về các âm mưu lật đổ ông đang được rỉ tai nhau khắp nơi, trong khi những thắng lợi từng được hứa hẹn dường như ngày càng tuột xa khỏi tầm tay. Nếu chiều hướng tồi tệ này tiếp tục tiếp diễn, [THIS.GetNameDef] có thể sẽ sụp đổ tan tành vì những chia rẽ sâu sắc từ nội bộ rất lâu trước khi một đội quân của kẻ thù kịp đặt chân đánh chiếm [THIS.Capital.GetCapitalVictoryPointName]."
 league_war_events.5.a: "Đó là lẽ đương nhiên thôi"
 league_war_events.5.b: "Lũ chúng nó không thể câm mồm lại được à?"

 league_war_events.6.t: "Những kẻ đào tẩu từ An Khánh"
 league_war_events.6.desc: "Dường như trước sự sụp đổ tan tành của Quân phiệt An Khánh, hàng loạt quân phiệt, tướng lĩnh và những kẻ bạo chúa địa phương từng nhúng chàm bởi mối quan hệ giữa Trần Điều Nguyên với người Nhật đã quyết định đặt cược canh bạc của mình vào [SHD.GetLeader] thay vì mạo hiểm đối mặt với sự trừng phạt tàn khốc từ Quốc dân Đảng. Tài năng quân sự của họ chắc chắn sẽ là một tài sản quý giá cho chúng ta."
 league_war_events.6.a: "Nhiệt liệt hoan nghênh!"

 league_war_events.10.t: "An Khánh đại thắng!"
 league_war_events.10.d: "Tin mừng vang dội đã được điện báo về cho Tổng thống Tào và Thống chế Ngô! Khi tiếng súng tại Nam Kinh phần lớn đã chịu im tiếng, dường như vị Đốc quân — nay là tân Thống soái Liên minh mới nhậm chức — Trần Điều Nguyên đã lật đổ thành công chính quyền tài phiệt thối nát của Tề Tạ Nguyên; các nhà đầu tư, thương nhân người Đức và những kẻ mị dân thuộc Nam Trực Lệ đã tháo chạy sang các Khu Tô giới, Đông Á thuộc Đức, hoặc chịu quy phục trước những chính quyền dễ dãi hơn.\n\nBảo đảm vững chắc quyền kiểm soát đối với các vùng lãnh thổ nằm ở ngoại vi tỉnh An Huy, sự hỗ trợ của chúng ta trong cuộc chiến tranh chắc chắn đóng vai trò tối quan trọng đem lại thắng lợi chớp nhoáng của Trần trước Liên minh. Mặc dù tình trạng bất ổn và chiến sự vẫn tiếp diễn ở những vùng lãnh thổ khác thuộc Liên minh cũ, Chính phủ Trung ương đã giành được cho mình một đồng minh kiên trung bên trong Trung Hoa, được tích hợp vững chắc vào vòng ảnh hưởng của chúng ta."
 league_war_events.10.a: "Làm tốt lắm, Trần Soái!"

 league_war_events.11.t: "Nam Kinh đại thắng!"
 league_war_events.11.d: "Tin mừng vang dội đã được điện báo về cho Tổng thống Tào và Thống chế Ngô! Khi tiếng súng tại Nam Kinh phần lớn đã chịu im tiếng, dường như Thống soái Liên minh Tề Tạ Nguyên đã lật đổ thành công chế độ hỗn loạn, bất hợp pháp và bấp bênh của Trần Điều Nguyên; những kẻ chống nhượng địa cuồng tín, những phần tử cấp tiến và giới trí thức trong chính quyền của Trần đã tháo chạy sang các tỉnh láng giềng, hoặc thậm chí đào tẩu sang Quốc dân Đảng.\n\nBảo đảm vững chắc quyền kiểm soát đối với các vùng lãnh thổ nằm ở ngoại vi tỉnh Nam Kinh, sự hỗ trợ của chúng ta trong cuộc chiến tranh chắc chắn đóng vai trò tối quan trọng đem lại thắng lợi chớp nhoáng của Tề trước những kẻ phản nghịch mới nổi. Mặc dù tình trạng bất ổn và chiến sự vẫn tiếp diễn ở những vùng lãnh thổ khác thuộc Liên minh cũ, Chính phủ Trung ương đã giành được cho mình một đồng minh kiên trung — dù có phần suy đồi về mặt hệ tư tưởng — bên trong Trung Hoa, được tích hợp vững chắc vào vòng ảnh hưởng của chúng ta."
 league_collapse_events.11.a: "Trật tự đã được đảm bảo dưới quyền Thống soái Liên minh!"

 league_war_events.12.t: "Nam Kinh đại bại!"
 league_war_events.12.d: "Gần như đã đem toàn bộ ngân khố chính phủ, uy tín quốc gia và tính danh chính ngôn thuận ra đánh cược dưới danh nghĩa ủng hộ sự tiếp nối và ổn định của một chính quyền đáng tin cậy bên trong Liên minh, dường như tất cả đã tan thành mây khói công cốc. Bất chấp sự hỗ trợ toàn diện mà Tề nhận được từ cả các đồng minh Đức cũ lẫn thực lực của chính chúng ta, hắn ta đã tự tay ném tất cả xuống vực thẳm của sự tuyệt vọng.\n\nKhi những âm mưu đằng sau con đường bước lên đỉnh cao quyền lực của hắn bị phơi bày ra ánh sáng, dường như chính dã tâm không đáy của Tề mới là nguyên nhân dẫn đến sự diệt vong cuối cùng của hắn. Khao khát thâu tóm toàn bộ Liên minh cho riêng mình, hắn đã vô tình đẩy không chỉ bản thân mà cả những binh sĩ kề vai sát cánh cùng hắn vào chỗ chết. Với việc đám thuộc hạ tài phiệt của hắn tháo chạy sang Liên minh hoặc tràn qua biên giới của chúng ta, bản thân Thống soái Liên minh hiện được báo cáo là đã mất tích, trốn chạy khỏi thủ phủ cùng với tất cả số của cải mà hắn và đoàn tùy tùng thân cận có thể vơ vét mang theo.\n\nKhông còn Thống soái Liên minh Tề để che chắn sườn và hồi sinh Nam Trực Lệ, Nam Kinh và các tỉnh thuộc Liên minh giờ đây hoàn toàn rơi vào tay những chế độ hung hãn và thù địch, tất cả bọn chúng đều đang nung nấu những mưu toan nhắm thẳng về phía Bắc Kinh."
 league_war_events.12.a: "Ngươi là một tên lưu manh, nhưng khốn nạn thay ngươi từng là tên lưu manh của chúng ta!"

 league_war_events.13.t: "An Khánh đại bại!"
 league_war_events.13.d: "Bất chấp niềm tin son sắt vào phong trào bài trừ nhượng địa, bất chấp lòng yêu nước nồng nàn, bất chấp sự quả cảm phi thường của họ, dường như các lực lượng quả cảm của Đốc quân Trần Điều Nguyên đã bị đè bẹp hoàn toàn và bị quét sạch khỏi quê hương bản quán của mình. Với việc chính quyền cấp tỉnh của ông ta gần như bị xóa sổ hoàn toàn, viên Tướng quân mang biệt danh \"Kẻ Khờ\" được đồn đại là đã tử trận trong các cuộc giao tranh dữ dội, hoặc đã trốn chạy vào bóng tối của thế giới ngầm đô thị, hay thậm chí nương náu ở bất kỳ chế độ nào chịu dung nạp ông ta.\n\nVề phần các bộ tướng và giới trí thức từng hết lòng hậu thuẫn ông, họ cũng phải chịu chung một số phận tương tự, tháo chạy sang Hồ Nam hoặc những nơi khác. Dù số phận của những con người này có ra sao đi chăng nữa, đây vẫn là một ngày đại tang đầy thảm họa cho chính phủ của chúng ta, bởi thắng lợi của phong trào chống nhượng địa từng là điều mà rất nhiều sĩ quan chỉ huy, chính khách và học giả hàng đầu của chúng ta đã đặt trọn vẹn niềm tin và kỳ vọng vào đó.\n\nKhông còn Trần, chúng ta chỉ còn lại những chế độ đầy tiềm tàng thù địch nắm quyền kiểm soát một số tỉnh trù phú và phát triển bậc nhất Trung Hoa, tạo nên một mối đe dọa an ninh sống còn ngay trước ngưỡng cửa của chúng ta."
 league_war_events.13.a: "Ngươi từng là một người dũng cảm đấy Trần à, chỉ tiếc là đã bị tham vọng đánh bại."

 league_war_events.14.t: "Đốc quân Trần đã bị tiêu diệt!"
 league_war_events.14.d: "Hôm nay là một ngày đại thắng vinh quang! Đốc quân Trần Điều Nguyên, hoàn toàn xứng đáng với biệt danh \"Kẻ Khờ\" của mình, cuối cùng đã bị tiêu diệt! Với việc Quân đội An Huy hoàn toàn bất lực trước đòn tấn công sấm sét của những đơn vị tinh nhuệ nhất Liên minh, lực lượng của hắn đã tan rã tơi bời và tháo chạy thảm hại về những vùng nông thôn hẻo lánh. Tìm kiếm sự nương tựa ở bất cứ nơi nào có thể. Tên Đốc quân phản nghịch đáng tiếc thay lại không thấy tăm hơi đâu, hắn đã bỏ trốn khỏi tỉnh An Huy ngay khi quân đội Liên minh vừa áp sát biên giới.\n\nDẫu vậy, ngọn nguồn của mọi tai họa, kẻ đã đổ thêm dầu vào lửa, kẻ chắc chắn đã dẫn đến việc ngã bệnh của Tôn Truyền Phương vĩ đại, rốt cuộc đã bị tống khứ vào sọt rác của lịch sử. Và cùng với hắn, phong trào chống nhượng địa chắc chắn cũng sẽ sớm lụi tàn theo. Tuy nhiên lúc này, chúng ta cần phải tiếp tục hướng mắt về phía chân trời xa, bởi Thống soái Liên minh Tề Tạ Nguyên vẫn còn rất nhiều đại nghiệp và tham vọng to lớn cần phải hoàn thành."
 league_war_events.14.a: "Quả thực là quá đỗi Khờ dại."

