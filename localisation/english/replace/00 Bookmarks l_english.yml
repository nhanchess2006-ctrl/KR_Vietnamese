 Debug_KR_gathering_storm_desc: "Nếu bạn thấy điều này, vui lòng tạo báo cáo lỗi"
 
 OTHER_KR_gathering_storm_desc: "Các quốc gia trên thế giới, lớn và nhỏ, đang chờ đợi đến lượt mình vươn lên thành một cường quốc chính của thế giới này. Từ các cường quốc đang cố gắng giữ vững đế chế của mình đến nhiều quốc gia đang cố gắng giành lại những gì họ đã mất trong Đại Chiến Thế Giới, tất cả đều sẽ phải đưa ra những quyết định khó khăn và cân bằng giữa lý tưởng với chủ nghĩa thực dụng để có thể tác động đến tương lai của thế giới..."