UPC_low_enthusiasm_mechanic_warning_tt: "§R$UPC_low_enthusiasm_side$ đang trỗi dậy trong Phong trào Liên bang, đại diện cho chủ nghĩa địa phương, chủ nghĩa mạnh mẽ cấp tỉnh và chủ nghĩa tinh hoa trí thức. Điều này chủ yếu mang lại lợi ích cho cánh bảo thủ của phong trào, mặc dù ngay cả các phe bảo thủ cũng cần một chút nhiệt huyết để giữ đà của phong trào. Tuy nhiên, hãy cảnh báo, nó càng lớn thì càng khó ngăn chặn, nếu nó tăng quá cao, chúng ta sẽ không thể phân biệt được với các quân phiệt.§!"

UPC_high_enthusiasm_mechanic_warning_tt: "§G$UPC_high_enthusiasm_side$ đang trỗi dậy trong Phong trào Liên bang, đại diện cho sự đoàn kết quốc gia, cảm xúc dân chủ đang lớn mạnh và cam kết với chủ nghĩa lập hiến. Điều này chủ yếu mang lại lợi ích cho cánh tiến bộ của phong trào, mặc dù tất cả các phe đều mong đợi một chút nhiệt huyết để giữ đà của phong trào. Tuy nhiên, hãy cảnh báo, nó càng lớn thì càng khó kiểm soát, đặc biệt là khi các cấp bậc thấp hơn bắt đầu chống lại hiện trạng.§!"