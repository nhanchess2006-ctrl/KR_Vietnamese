UPC_warlord_supports_GRA_decision: "Ủng hộ Liên minh Cộng hòa Lớn"
UPC_warlord_supports_GRA_decision_desc: "Có lẽ sẽ là... thận trọng, để phần nào ảnh hưởng đến chiến dịch bầu cử quốc gia theo hướng có lợi cho chúng ta. Xét cho cùng, vị thế của chúng ta chỉ mạnh bằng niềm tin chính trị và các liên minh của chúng ta. Bằng cách ủng hộ [UPC_GetGRAPartyLeader] và Liên minh Cộng hòa Lớn, chúng ta có thể vừa đảm bảo vị thế của mình trong quốc gia và chính phủ vừa duy trì một đường lối chính trị phù hợp nhất với [ROOT.GetLeader]."

UPC_warlord_supports_CDL_decision: "Ủng hộ Đồng minh Dân chủ Trung Quốc"
UPC_warlord_supports_CDL_decision_desc: "Liên minh Cộng hòa Lớn không có sự an toàn của quốc gia, hay nền dân chủ non trẻ của nó, trong tâm trí. Họ sẽ thấy dự án quốc gia của họ bị chia cắt vì một số ảo tưởng về sự vĩ đại dựa trên quả trứng vàng của Chủ nghĩa Liên bang. Chỉ có phe đối lập, Đồng minh Dân chủ Trung Quốc, di sản lâu dài của chủ nghĩa cải cách dân chủ trong quốc gia, mới có thể thấy nền dân chủ của Trung Quốc được duy trì, bảo vệ và tiến tới một tương lai tươi sáng hơn."

UPC_warlord_supports_liberals_decision: "Ủng hộ những Người Độc lập và Tự do"
UPC_warlord_supports_liberals_decision_desc: "Cả hai ứng cử viên chính trong cuộc bầu cử quốc gia đều không có lợi ích thực sự của quốc gia trong tâm trí. Đồng minh Dân chủ Trung Quốc sẽ thấy quốc gia bị chia cắt bởi chủ nghĩa cấp tiến, một sự biến chất và bóp méo lý tưởng của Lương Khải Siêu xoay quanh sự điên rồ của chủ nghĩa xã hội. Liên minh Cộng hòa Lớn không là gì ngoài sự thay thế của người miền Nam cho sự tham nhũng của Bắc Dương. Những kẻ kền kền lượn lờ quanh thần tượng giả của Chủ nghĩa Liên bang như giải pháp cho mọi phương tiện. Chỉ có những Người Độc lập thực sự, những công chức thực sự và những nhà dân chủ thực sự từ chối chủ nghĩa bộ lạc của chính trị mới có thể mang lại một tương lai mới cho Trung Quốc."

UPC_warlord_supports_regionalism_decision: "Ủng hộ Chủ nghĩa Địa phương"
UPC_warlord_supports_regionalism_decision_desc: "Hãy vứt bỏ tất cả! Đó là những gì Chính phủ Trung ương sẽ làm với dự án Liên bang của quốc gia nếu họ có cách của họ! Họ coi [ROOT.GetLeader] không là gì ngoài một 'quân phiệt', theo nghĩa ô nhục nhất. Không phải một chính khách, không, mà là một sự phủ nhận tiến bộ và phát triển của Trung Quốc. Và lời nói dối của họ rõ như ban ngày. Không có [ROOT.GetLeader], sẽ không có tương lai cho người dân của ông, tỉnh của ông, nó sẽ phải trả lời cho một số người đàn ông bội bạc ở thủ đô và nội các. Chỉ thông qua [ROOT.GetLeader], chúng ta mới có thể bảo vệ nền độc lập của mình, và quốc gia nên biết sự thật này."

UPC_warlord_embrace_radicalism_decision: "Đắm mình trong Chủ nghĩa Cấp tiến"
UPC_warlord_embrace_radicalism_decision_desc: "Quốc gia chỉ có thể được cứu rỗi thông qua sự hy sinh và đổ máu của chính nó. Những người cải cách, 'nền dân chủ' của họ, nó chưa sẵn sàng cũng không phải là ứng dụng đúng của hệ thống. Dưới lý tưởng của họ, quốc gia sẽ tự đâm vào thanh gươm của mình như đã xảy ra năm 1912, năm 1913, năm 1917, và từ năm 1920 trở đi đến năm 1933. Nếu chúng ta muốn tốt hơn Bắc Dương, thì một cuộc cách mạng, và chỉ một cuộc cách mạng, mới có thể đưa quốc gia vượt qua đống tro tàn. Đảng Thiếu niên Trung Quốc và Quốc dân Đảng, mặc dù có lẽ đối lập theo một nghĩa nào đó, là những người cầm cờ thực sự duy nhất cho sự thịnh vượng của Trung Quốc."

#Coalition Decisions
UPC_perils_of_a_minority_government_mission: "Hiểm họa của Chính phủ Thiểu số"
UPC_perils_of_a_minority_government_mission_desc: "[ROOT.GetLeader] có thể đã thắng chức Tổng thống, nhưng điều đó không có nghĩa là ông có thể cai trị bằng sắc lệnh (ít nhất là chừng nào nền dân chủ của chúng ta còn sống). Ngay cả khi [ROOT.GetRulingParty] đã giành được đa số ghế tuyệt đối (một thành tựu theo đúng nghĩa của nó), chúng ta sẽ cần chứng minh khả năng chỉ huy đa số cầm quyền bằng cách thành lập nội các. Cho đến lúc đó, một chính phủ tạm quyền với quyền hạn hạn chế sẽ phải cai trị, các cuộc đàm phán liên minh sẽ tiếp tục, và những lo ngại về bất ổn sẽ kéo dài."

UPC_form_a_government_decision: "Thành lập Chính phủ"
UPC_form_a_government_decision_desc: "Sau khi đã đảm bảo được số phiếu cần thiết cho đa số hoạt động, giờ chúng ta có thể tự tin thành lập chính phủ mà không phải lo lắng về việc các phiếu bầu quan trọng bị chặn trong cơ quan lập pháp. Điều này sẽ góp phần rất lớn vào việc ổn định sự cai trị của chúng ta."

UPC_annual_coalition_expectations_timer: "Kỳ vọng của Liên minh"
UPC_annual_coalition_expectations_timer_desc: "Mỗi năm, các đối tác liên minh của chúng ta sẽ mong đợi một số tiến bộ về những lời hứa mà chúng ta đã thực hiện. Điều này sẽ đòi hỏi chúng ta phải dành thời gian thông qua luật pháp có lợi cho họ, ngay cả khi chúng chưa hoàn thiện. Thành công sẽ củng cố niềm tin vào nền dân chủ của chúng ta, thất bại có thể gây nguy hiểm không chỉ cho chính phủ mà còn cho nền cộng hòa của chúng ta!"

UPC_coalition_with_the_KMT_decision: "Liên minh với §RQuốc dân Đảng§!"
UPC_coalition_with_the_KMT_decision_desc: "Quốc dân Đảng, còn được gọi là Đảng Dân tộc chủ nghĩa Trung Quốc, là một đảng tiên phong cách mạng được thành lập bởi cố Tôn Dật Tiên. Hệ tư tưởng cốt lõi của nó được xây dựng xung quanh Tam Dân Chủ nghĩa của Tiến sĩ Tôn, Ba giai đoạn Cách mạng của ông, và Kế hoạch Tái thiết Quốc gia của ông. Sự thất bại của cuộc cách mạng của họ đã đưa một số phe phái của đảng họ đến bàn đàm phán, nhưng đừng nhầm lẫn - ngay cả những 'người ôn hòa' của phong trào này cũng ở rìa cực đoan của chính trị Trung Quốc."

UPC_coalition_with_the_CDL_decision: "Thành lập Liên minh Lớn [UPC_GetGRAPartyName_nosub]-[UPC_GetCDLPartyName_nosub]"
UPC_coalition_with_the_CDL_decision_desc: "Đồng minh Dân chủ Trung Quốc là người kế thừa của Liên minh Xây dựng Quốc gia Thống nhất và Liên đoàn các Đảng Dân chủ Trung Quốc, một liên minh chủ yếu trung tả gồm các đảng tự do tiến bộ và trí thức nói chung. CDL tự nhận là một đảng theo đúng nghĩa của nó, nhưng trên thực tế vẫn là nhiều đảng nhỏ hơn hoạt động như một khối bầu cử. Một liên minh lớn giữa GRA và CDL có lẽ sẽ là lựa chọn tự nhiên."

UPC_coalition_with_the_GRA_decision: "Thành lập Liên minh Lớn [UPC_GetCDLPartyName_nosub]-[UPC_GetGRAPartyName_nosub]"
UPC_coalition_with_the_GRA_decision_desc: "Liên minh Cộng hòa Lớn được thành lập như một liên minh giữa Trần Quýnh Minh và Đoàn Kỳ Thụy khi lưu vong, tuy nhiên nó đã phát triển thành một liên minh lớn hơn gồm những người theo Chủ nghĩa Liên bang tự do và bảo thủ nói chung trên khắp đất nước. GRA thường gắn liền với các thể chế thành lập, dù là các Thống đốc quân phiệt hay hội đồng tỉnh đặc biệt ở miền Nam và cả các nhóm Hồng Môn trong cộng đồng hải ngoại. Một liên minh lớn giữa GRA và CDL có lẽ sẽ là lựa chọn tự nhiên."

UPC_coalition_with_the_REP_decision: "Tập hợp [UPC_GetREPPartyName]"
UPC_coalition_with_the_REP_decision_desc: "Hệ thống Bắc Dương truyền thống bao gồm nhiều Người Độc lập, những người thường tự hào về tinh thần tự do của họ. Điều đó không ngăn cản họ tập hợp thành các câu lạc bộ của riêng mình hoặc thậm chí thành lập các đảng nhỏ, mặc dù nhiều người miễn cưỡng từ bỏ quyền tự chủ chính trị của mình. Tuy nhiên, thời thế đang thay đổi, và những ngày của các hiệp hội không chính thức thống trị chính trị đã dần kết thúc trong một thời gian. Hầu hết những người độc lập này đã thề sẽ làm việc với bất kỳ chính phủ nào được thành lập (GRA hoặc CDL), và chúng ta có thể dễ dàng dụ dỗ những người còn lại bỏ phiếu với chúng ta."

UPC_coalition_with_the_DCP_decision: "Liên minh với [UPC_GetDCPPartyName_long]"
UPC_coalition_with_the_DCP_decision_desc: "[UPC_GetDCPPartyName_nocolour_long] là hậu duệ lớn nhất của phong trào Cải cách của Lương Khải Siêu. Nếu Tôn là cha đẻ của chính phủ Quảng Châu, thì Lương theo nhiều cách là cha đẻ của nền Cộng hòa Bắc Dương, với những ý tưởng của ông tiếp tục ảnh hưởng đến mọi người trên khắp phổ chính trị. Những người theo Chủ nghĩa Lập hiến của ông đặc biệt quan tâm đến việc tạo ra và thực thi sự nghiệp cùng tên của họ, đôi khi đặt nó lên trên cả dân chủ. Một đảng nói chung bảo thủ hơn (và có lẽ là một trong những đảng lâu đời nhất còn tồn tại của Trung Quốc), nó có niềm yêu thích đặc biệt với ngôi làng nông thôn."

UPC_coalition_with_the_STA_decision: "Liên minh với §g[UPC_GetSTAPartyName_long]§!"
UPC_coalition_with_the_STA_decision_desc: "Quân đội và Bộ máy quan liêu là hai cánh tay hùng mạnh của Chính phủ Trung ương và đôi khi biểu hiện như một lực lượng chính trị của riêng họ. Mặc dù phong trào Liên bang đã tìm cách vô hiệu hóa chế độ chuyên chế của Chính phủ Trung ương, họ không bao giờ có thể ngăn chặn hoàn toàn chủ nghĩa tập trung này nổi lên từ chính phủ của họ trên con đường thống nhất quốc gia. Một số nhà lãnh đạo đương nhiên thấm nhuần các lực lượng này, những người khác sẽ cần phải cầu xin và nài nỉ họ. Tất cả bọn họ sẽ phải cảnh giác khi giao dịch với họ, nếu không chính phủ sẽ cai trị Tổng thống thay vì ngược lại."

UPC_coalition_with_the_REG_decision: "Giao dịch với §PNhững Người Địa phương Độc lập§!"
UPC_coalition_with_the_REG_decision_desc: "Mặc dù Thời đại Quân phiệt đang đến gần, bản thân các quân phiệt đã chứng minh đủ thông minh để thích nghi thay vì chết dần. Khai thác các cơ hội mới và tận dụng ảnh hưởng của họ đối với chính trị địa phương, những người đàn ông này tiếp tục tìm cách để duy trì sự liên quan. Một số là cựu thành viên của các quân phiệt lớn như Trực Lệ, Phụng Thiên và An Huy, trong khi những người khác là khách hàng của các bộ máy chính trị địa phương nếu không phải là những kẻ mạnh. Tuy nhiên, sẽ là một sai lầm nếu cho rằng tất cả bọn họ đều là những bạo chúa địa phương ngu dốt và bị căm ghét. Nhiều người trong số họ có sự khéo léo dân túy và được giáo dục tốt, và một số thậm chí đã thành lập các đảng nhỏ của riêng mình để phục vụ lợi ích địa phương. Trong khi một số có hệ tư tưởng riêng, hầu hết sẽ bị hấp dẫn về phía trung tâm quyền lực của chúng ta."

UPC_coalition_with_the_YCP_decision: "Liên minh với §nĐảng Thiếu niên Trung Quốc§!"
UPC_coalition_with_the_YCP_decision_desc: "Đảng Thiếu niên Trung Quốc được thành lập bởi các sinh viên Trung Quốc du học. Lấy cảm hứng từ Những Người Thổ Nhĩ Kỳ Trẻ và những lời dạy của Lương Khải Siêu, họ đã biến đổi thành một tổ chức cực đoan dân tộc chủ nghĩa, quân phiệt chủ nghĩa, có xu hướng ghép vào các cấu trúc quân phiệt hiện có - cung cấp cho họ một chương trình tư tưởng dễ dàng, phục tùng có thể được sử dụng để truyền cảm hứng cho quần chúng. Bất chấp điều này, thành viên thực tế của họ có xu hướng là sinh viên, trí thức và doanh nhân - và họ có một mặt ôn hòa sẵn sàng làm việc với phong trào Liên bang. Tuy nhiên, một liên minh với họ có thể là một triển vọng nguy hiểm cho tương lai của nền dân chủ non trẻ của chúng ta."

UPC_appease_the_KMT_repeatable_decision: "Xoa dịu §RQuốc dân Đảng§!"
UPC_appease_the_KMT_repeatable_decision_desc: "Với chương trình nghị sự chính trị chính của Quốc dân Đảng đã cạn kiệt sau nhiều năm tham gia vào các chính phủ liên minh, họ đã trở thành một phần cố định trong nền Cộng hòa của chúng ta. Cương lĩnh của họ giờ đã được nướng vào chính nền tảng của chính trị Liên bang Trung Quốc, và tiếp tục xoa dịu họ sẽ đòi hỏi sự kết hợp của các công việc bảo trợ cho các nhà lãnh đạo cấp cao của họ, tài trợ cho các chương trình địa phương khác nhau mà họ đề xuất, và hỗ trợ cho các bài phát biểu của họ trên toàn quốc."

