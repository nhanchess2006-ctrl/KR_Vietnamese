UPC_election_mobilisation_law_impact_tt: "§YTrong thời bình, cử tri sẽ có xu hướng ôn hòa. Khi động viên kinh tế cao hơn, những người xã hội chủ nghĩa sẽ có đà. Với luật động viên hiện tại của chúng ta:§!"
UPC_election_trade_law_impact_tt: "§YXuất khẩu là một vấn đề chính trị nhạy cảm. Tiếp cận nhiều hơn với ý tưởng và vốn nước ngoài có xu hướng ủng hộ những người tự do và bảo hộ ủng hộ những người dân tộc chủ nghĩa. Thiếu kiểm soát nó sẽ động viên cả hai.§!"
UPC_election_conscription_impact_tt: "§YMột quân đội nhỏ hơn (nhưng không bị giải giáp) nói chung sẽ có lợi cho những người thống kê. Mức độ nghĩa vụ quân sự cao hơn buộc chúng ta phải dựa vào những người địa phương để được giúp đỡ.§!"

UPC_set_indirect_presidential_elections_effect_tt: "§YTổng thống sẽ được bầu bởi cơ quan lập pháp, cho phép người chơi quyết định kết quả bằng cách chi tiêu quyền lực chính trị và Nhiệt huyết Dân chủ.§!"
UPC_set_direct_presidential_elections_effect_tt: "§YTổng thống sẽ được bầu bằng phiếu bầu trực tiếp, tăng tác động của vận động tranh cử nhưng cũng khiến bầu cử được quyết định ngay lập tức vào ngày bầu cử.§!"
UPC_direct_presidential_elections_impact_tt: "§YVì Tổng thống được bầu trực tiếp, tác động của vận động tranh cử §Gđược tăng lên.§!§!"
UPC_indirect_presidential_elections_options_tt: "§YVì Tổng thống được bầu gián tiếp, chúng ta có thể tự do chọn người chiến thắng - trả quyền lực chính trị và Nhiệt huyết Dân chủ tỷ lệ với số ghế chúng ta cần cho đa số.§!"
UPC_direct_presidential_elections_options_tt: "§YVì Tổng thống được bầu trực tiếp, ứng cử viên có số phiếu cao hơn sẽ được bầu làm Tổng thống.§!"

