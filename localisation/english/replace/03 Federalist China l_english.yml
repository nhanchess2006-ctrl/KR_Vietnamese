UPC.chinademocraticleague.001.t: "Sự cố Thất Quân Tử"
UPC.chinademocraticleague.001.d: "Với việc làn sóng cuồng nhiệt chống nhượng địa có bước ngoặt cực đoan, sự phản kháng từ phe bảo thủ dường như là điều không thể tránh khỏi. Nhưng nhiều người đã bàng hoàng khi bảy thành viên cộm cán của Hội Cứu quốc Bị chính quyền Đoàn nhượng địa ở Thượng Hải đột ngột bắt giữ và dẫn độ về Bắc Kinh với cáo buộc phản quốc, nơi họ hiện vẫn bị giam giữ để chờ xét xử.\n\nDù Hội Cứu quốc đã tạo được tiếng vang trong những tháng gần đây nhờ tổ chức các cuộc biểu tình chống nhượng địa, việc bắt giữ họ cũng diễn ra trong bối cảnh rộng lớn hơn của phong trào dân chủ Trung Hoa. Tận dụng khoảng trống quyền lực của phe tả sau Chiến dịch Bắc phạt năm 1928, Hội Cứu quốc cùng với Đảng Hiến chính Trung Hoa, Hiệp hội Giáo dục Nghề nghiệp Trung Hoa, Liên minh Kiến thiết Nông thôn và nhiều nhân sĩ độc lập từ Hồ Thích đến những người xã hội chủ nghĩa như Trương Bác Quân và Đàm Bình Sơn đã thành lập Đồng minh Kiến quốc Thống nhất Quốc gia.\n\nSự xuất hiện của nhiều nhân vật thiên tả đã dấy lên sự nghi ngờ lớn, buộc Đồng minh phải xuất bản Bản tín điều 12 điểm, bao gồm kêu gọi đoàn kết, đàm phán hòa bình, kiến thiết, ban hành và thực thi hiến pháp, công nhận các đảng派 chính trị, chấm dứt quân đội can thiệp vào chính trị, chống tham nhũng và phi đảng phái. Dù được chính quyền Trực Hệ đón nhận tích cực trong quá trình chuẩn bị cho Cuộc bầu cử năm 1929, Cuộc khởi nghĩa Thượng Hải năm 1932 đã chứng kiến sự đàn áp dã man buộc Đồng minh phải rút vào hoạt động bí mật.\n\nSau cuộc thanh trừng của Trực Hệ, nhiều trí thức tự do và tiến bộ đã chạy khỏi Đồng minh về phía tây nam, nơi họ tìm thấy các chính quyền quân phiệt sẵn lòng dung thứ. Một liên minh mới được thành lập mang tên Đồng minh các Đảng派 Dân chủ Trung Hoa. Đồng minh hoạt động trong bí mật, dù đã tự thanh trừng các thành viên thiên tả gây quá nhiều chú ý như Trương và Đàm. Hội Cứu quốc ban đầu không được mời tham gia Đồng minh, nhưng cuối cùng đã được kết nạp lại. Năm 1936 đã mang lại cú hích cho Đồng minh nhưng phản ứng yếu ớt của cấp lãnh đạo đã khiến phong trào manh mún này bị rạn nứt."
UPC.chinademocraticleague.001.a: "Một lũ xúi giục xã hội chủ nghĩa nhận lấy kết cục đích đáng."
UPC.chinademocraticleague.001.b: "Một sự xúc phạm đến quyền công dân ở Trung Quốc!"
UPC.chinademocraticleague.001.c: "Bằng chứng cho thấy cải cách tư sản chẳng đi đến đâu."
UPC.chinademocraticleague.001.e: "Bắc Dương lại trượt dài vào chủ nghĩa chuyên chế."

UPC.chinademocraticleague.002.t: "Đảng Dân chủ Xã hội Trung Hoa"
UPC.chinademocraticleague.002.d: "Vụ bắt giữ Thất Quân Tử đã dấy lên làn sóng chấn động khắp Trung Quốc. Nhưng sự giận dữ dâng cao không chỉ chĩa vào chính quyền [QIE.GetAdjective]. Đồng minh các Đảng派 Dân chủ Trung Hoa đã chứng tỏ sự bất lực trong phản ứng trước khủng hoảng khi các đảng thành viên chia rẽ về cách ứng phó và giới lãnh đạo phần lớn chỉ kêu gọi bình tĩnh.\n\nĐặc biệt, Đảng Hiến chính Trung Hoa, thành tố lớn nhất của Đồng minh và là đảng chính trị chính thức duy nhất, đã bị cáo buộc là nhu nhược - quá sợ hãi việc mất đi ảnh hưởng trong Quốc hội. Phản ứng của Đồng minh chỉ dừng lại ở một tuyên bố lên án muộn màng và tài trợ luật sư cho các bị cáo.\n\nNhiều trí thức bất mãn trong Đồng minh ở miền Nam đã tập hợp tại Quảng Châu, nơi sau nhiều tuần thảo luận, họ đã tuyên bố thành lập Đảng Dân chủ Xã hội Trung Hoa. Lãnh đạo đảng là các cựu thành viên của Trung Hoa Phục hưng 社, một nhóm Liangist thiên tả trong Đảng Hiến chính do Trương Quân Mại và Trương Đông Tôn dẫn đầu. Một phe phái lớn khác là Phái Đại học Thanh Hoa thuộc Nguyệt Tân 社 do La Long Cơ, Văn Nhất Đa và Lương Thực Thu lãnh đạo.\n\nĐảng mới tuyên bố đại diện cho nền dân chủ nghị viện kiểu Tây phương, một hệ thống kinh tế hỗn hợp kết hợp giữa chủ nghĩa xã hội công đoàn và dân chủ xã hội, cùng quan điểm dân tộc chủ nghĩa đề cao chủng tộc là nguyên tắc quan trọng nhất trong xã hội. Bằng việc kêu gọi một hiến pháp mới, họ cũng yêu cầu một Kế hoạch 5 năm bất biến sau khi thống nhất, tập trung vào đoàn kết, hiệu quả và ổn định.\n\nCác lãnh đạo Đảng Dân chủ Xã hội có lịch sử hợp tác với các quân phiệt miền Nam như Tôn Truyền Phương, những người theo chủ nghĩa Liên bang như Triệu Hằng Tịch, Trần Quýnh Minh và Đường Kế Nghiêu, cùng các trí thức như Hồ Thích. Họ cũng có một số điểm giao thoa với Thanh niên Đảng Trung Hoa, một nhánh khác của Liangist. Dù chỉ có khoảng mười nghìn tín đồ vào thời điểm ban đầu, tờ báo Tuần báo Phục hưng đã ghi nhận lượng người đăng ký tăng lên đáng kể."
UPC.chinademocraticleague.002.a: "Bình minh của một con đường mới cho Trung Quốc!"
UPC.chinademocraticleague.002.b: "Bằng chứng cho thấy có một sự lựa chọn thay thế cho Trung Quốc!"
UPC.chinademocraticleague.002.c: "Liệu họ có thể thổi sức sống mới vào nền dân chủ miền Nam?"
UPC.chinademocraticleague.002.e: "Xét lại, tư sản và phản cách mạng!"
UPC.chinademocraticleague.002.f: "Lại một nhánh xã hội chủ nghĩa nữa ư? Thật sao?"

UPC.chinademocraticleague.003.t: "Phiên tòa xét xử Thất Quân Tử"
UPC.chinademocraticleague.003.d.manchu: "Đương nhiên, việc thiết lập triều đại Mãn Châu trên tàn dư của Việt Nam Bắc Dương sẽ lên án gay gắt từ công chúng và mối quan ngại về sự mất ổn định. Tuy nhiên, không phải bản thân chế độ quân chủ là nguồn gốc của những tranh cãi gần đây, mà là việc bắt giữ một nhóm trí thức thiên tả đa dạng. Đẩy giới chính trị dân chủ và trí thức vốn đã tức giận vào trạng thái phẫn nộ, họ đã bắt đầu bao vây chính phủ để đòi câu trả lời. Được huy động phần lớn bởi Hội Cứu quốc, Phấn Đấu 社, PSC, RRA, YCP và thậm chí cả các thành viên của Đảng Hiến chính vốn khá thụ động, nhiều người đã gửi một loạt lời lên án tới chính phủ đương nhiệm.\n\nKể từ khi Hội Cứu quốc thành lập, công chúng đã chú ý theo dõi hành vi của chính phủ liên quan đến các nhượng địa và dân chủ. Thứ Hai Đen tối, cùng với vụ bắt giữ Thất Quân Tử và bất ổn ở Thượng Hải, Đồng minh và những nơi khác đã dẫn đến một tình hình khá tồi tệ.\n\nBị dẫn độ về Bắc Kinh, Thất Quân Tử đã được chính quyền đối xử đặc biệt tốt. Mặc dù vậy, các nhà luật học hàng đầu được gia tộc Ái Tân Giác La hỗ trợ đã nộp bản cáo trạng. Cáo buộc Thất Quân Tử \"tổ chức một nhóm nhằm mục đích đe dọa Chính phủ Trung Hoa\", dẫn ra nhiều vi phạm pháp luật nhà nước Trung Hoa, họ đã buộc tội thành công.\n\nTuy nhiên sau bốn tháng bị giam cầm, Thất Quân Tử đã làm dấy lên một phong trào trí thức ngày càng tăng kêu gọi trả tự do cho họ, và một phần đóng vai trò làm bức bình phong cho các cuộc kêu gọi rộng lớn hơn về dân chủ, chấm dứt hòa bình nội chiến và đoàn kết chống ngoại xâm. Đằng sau những cánh cửa đóng kín, nhiều quý tộc cải cách và trí thức trong vòng thân cận đã gây áp lực lên [QIE.GetSecondInCommand] để đề xuất với Hoàng đế Tuyên Thống rằng ngài nên ân xá cho họ.\n\nỞ chiều ngược lại, những kẻ cứng rắn trong giới quý tộc như Hi Cáp, Phổ Kiệt, Phổ Nhậm, Tái Trấn và Tiên Khôi đã khăng khăng rằng Thất Quân Tử là những tên khủng bố xã hội chủ nghĩa, chỉ là những kẻ kích động chính trị thân Quốc dân đảng; bất kỳ sự nhượng bộ nào lúc này cũng sẽ khiến Chính phủ Hoàng gia trông yếu thế."
UPC.chinademocraticleague.003.d.zhili: "Khó có thể nói rằng sự thống trị của Trực Hệ ở Trung Quốc là một sự thống trị được toàn dân ủng hộ. Tranh cãi gần đây xung quanh vụ bắt giữ \"Thất Quân Tử\" đã đẩy các giới chính trị dân chủ và trí thức vốn đã tức giận vào trạng thái cực kỳ phẫn nộ khi họ vây hãm chính phủ để đòi câu trả lời. Được huy động phần lớn bởi Hội Cứu quốc, Phấn Đấu 社, PSC, RRA, YCP và thậm chí cả các thành viên của Đảng Hiến chính vốn khá thụ động, nhiều danh sĩ đã gửi một loạt lời lên án tới chính phủ đương nhiệm.\n\nKể từ khi Hội Cứu quốc thành lập, công chúng đã chú ý theo dõi hành vi của chính phủ đối với các nhượng địa và dân chủ. Thứ Hai Đen tối, cùng với vụ bắt giữ Thất Quân Tử và bất ổn ở Thượng Hải, Đồng minh và những nơi khác đã dẫn đến một tình hình khá tồi tệ.\n\nBị dẫn độ về Bắc Kinh, Thất Quân Tử được chính quyền đối xử đặc biệt tốt. Mặc dù vậy, các nhà luật học hàng đầu của Hòa Bình Hiệp Hội do Biện Shoujing thuộc Nhóm Thiên Tân - Bảo Định dẫn đầu đã nộp bản cáo trạng. Cáo buộc Thất Quân Tử \"tổ chức một nhóm nhằm mục đích đe dọa Chính phủ Trung Hoa\", và dẫn ra nhiều vi phạm pháp luật nhà nước Trung Hoa, họ đã dàn xếp một bản cáo trạng thành công.\n\nTuy nhiên sau bốn tháng bị giam cầm, Thất Quân Tử đã làm dấy lên một phong trào trí thức ngày càng tăng tập hợp đòi trả tự do cho họ, mặc dù đó chỉ là bức bình phong cho các cuộc kêu gọi rộng lớn hơn về dân chủ, chấm dứt hòa bình nội chiến và đoàn kết chống ngoại xâm. Đằng sau những cánh cửa đóng kín, Bạch Kiến Vũ, Tôn Đan Lâm và Bộ Chính vụ thuộc Phe Lạc Dương của họ đã kéo Ngọc Soái ra một góc, giục ông gây áp lực lên Chính phủ hủy bỏ các cáo buộc và trả tự do cho những người bị giam giữ.\n\nỞ chiều ngược lại, Nhóm Thiên Tân - Bảo Định và các nhánh Trực Hệ khác đã kiên quyết giữ lập trường, khăng khăng rằng Thất Quân Tử chỉ là những kẻ kích động chính trị thân Quốc dân đảng, rằng bất kỳ sự nhượng bộ nào lúc này cũng sẽ khiến Trực Hệ trông yếu thế. Đáng chú ý, Phe Bí thư của Trương Kỳ Hoàng và Tào Côn vẫn đứng ngoài cuộc tranh chấp, hạ mình ủng hộ bất cứ điều gì đa số quyết định."
UPC.chinademocraticleague.003.a.zhili: "Bạch Kiến Vũ và Tôn Đan Lâm thúc đẩy việc trả tự do cho họ!"
UPC.chinademocraticleague.003.b.zhili: "Nhóm Thiên Tân - Bảo Định tập hợp để tiếp tục giam giữ họ."
UPC.chinademocraticleague.003.a.manchu: "Áp lực từ quần chúng buộc Phe Hoàng gia phải nhượng bộ."
UPC.chinademocraticleague.003.b.manchu: "Ngươi khó có thể trông mong những kẻ xúi giục như vậy đứng ngoài rắc rối."

#GXC CDL Events (100-199):
UPC.chinademocraticleague.100.t: "Đồng minh Dân chủ Trung Hoa"
UPC.chinademocraticleague.100.d: "Khi quân đội [GXC.GetAdjective] tiếp cận Bắc Kinh, những lo ngại gia tăng về tương lai dân chủ của phong trào Liên bang. Dù Trần Quýnh Minh đã thề sẽ thực hiện một cuộc chuyển giao ổn định sang một cộng hòa liên bang dân chủ, điều này vẫn chưa làm hài lòng nhiều đồng minh tiến bộ cũ của ông, những người lo lắng về thế lực ngày càng giảm của họ khi ngày thống nhất đến gần.\n\nĐồng minh các Đảng派 Dân chủ Trung Hoa cũ đã đổi tên thành Đồng minh Dân chủ Trung Hoa, do Trương Quân Mại của Đảng Dân chủ Xã hội lãnh đạo. Họ đã tổ chức cái mà họ gọi là một sự đối lập hòa bình và yêu nước để yêu cầu thực thi dân chủ ngay lập tức. Cả quốc gia giờ đây hướng về Tổng thống Trần để chờ đợi phản ứng của ông."
UPC.chinademocraticleague.100.a: "Hãy xem liệu Trần có phải là nhà dân chủ như ông ta tự nhận hay không."
UPC.chinademocraticleague.100.b: "Lũ ngốc đang tranh cãi với những kẻ ngốc khác."
UPC.chinademocraticleague.100.c: "[FROM.Capital.GetCapitalVictoryPointName] đang ở ngã tư đường."

#YUN CDL Events (200-299):
UPC.chinademocraticleague.200.t: "Đồng minh Dân chủ Trung Hoa"
UPC.chinademocraticleague.200.d: "Tập hợp tại [UPC.Capital.GetCapitalVictoryPointName], lãnh đạo của nhiều đảng派 và nhóm cấu thành nên Đồng minh các Đảng派 Dân chủ Trung Hoa đã tụ họp để đưa ra một tuyên bố chấn động: kể từ nay họ sẽ được biết đến với tên gọi Đồng minh Dân chủ Trung Hoa. Đảng thống nhất này, hiện do trí thức La Long Cơ của Nguyệt Tân 社 lãnh đạo, đã xuất bản bản tuyên ngôn của họ, tìm kiếm con đường thứ ba giữa cách mạng và tiến hóa từng bước: cải cách có ý thức.\n\nTổng thống [ROOT.GetLeader] vẫn chưa đưa ra bất kỳ tuyên bố nào về vấn đề này, tuy nhiên rõ ràng là căng thẳng giữa cơ quan hành pháp và phe đối lập sẽ tiếp tục gia tăng. Cách thức giải quyết vấn đề này sẽ định hình tông giọng cho tương lai của phong trào Liên bang."
UPC.chinademocraticleague.200.a: "Chúng ta sẽ theo dõi chặt chẽ những diễn biến này."
UPC.chinademocraticleague.200.b: "Lại một ngày nữa, lại một loạt những điều vô lý."
UPC.chinademocraticleague.200.c: "Trung Quốc dường như lại đang ở một ngã tư đường khác."

#HNN CDL Events (300-399):

#SZC CDL Events (400-499):

#Enthusiasm Events
UPC.enthusiasmmechanic.001.t: "Chủ nghĩa Chuyên chế Gia tăng ở [FROM.GetNameDef]"
UPC.enthusiasmmechanic.001.d: "Phong trào Liên bang luôn mang tính chia rẽ, với nhiều giải thích khác nhau được đưa ra bởi các lãnh đạo địa phương do tính chất phân quyền của phong trào. Mặc dù đa số trong phong trào tin vào dân chủ và rằng nó đồng hành cùng chủ nghĩa Liên bang, vẫn có một số người có niềm tin lỏng lẻo hơn đối với việc thực thi dân chủ trong chính quyền tương ứng của họ, nhưng nhìn chung vẫn duy trì cam kết với hệ thống liên bang ở Trung Quốc.\n\nCó vẻ như Thống đốc [FROM.GetLeader] đã rơi vào nhóm đó, khi các báo cáo hạn chế cho thấy chủ nghĩa chuyên chế đang gia tăng ở [FROM.GetNameDef]. Dưới danh nghĩa duy trì trật tự và ổn định, chính quyền tỉnh tại [FROM.Capital.GetCapitalVictoryPointName] đã rơi vào sự kiểm soát nghiêm ngặt hơn của [FROM.GetLeader].\n\nMặc dù Chính phủ Liên bang không có quyền can thiệp vào công việc của tỉnh và quyết định cách họ quản lý, nhiều người vẫn khẩn tha [ROOT.GetLeader] bắt Thống đốc [FROM.GetLeader] phải chịu trách nhiệm về chủ nghĩa chuyên chế trắng trợn và sự thèm khát lợi ích chính trị của ông ta."
UPC.enthusiasmmechanic.001.a: "Chúng ta phải buộc họ chịu trách nhiệm và bảo vệ quyền công dân!"
UPC.enthusiasmmechanic.001.b: "Quyền lực của tỉnh không thể bị chà đạp..."

UPC.enthusiasmmechanic.002.t: "Thực thi Dân chủ ở [FROM.GetNameDef]"
UPC.enthusiasmmechanic.002.d: "Nền dân chủ hiến định từ lâu đã trập trùng ở Trung Quốc, khi chủ nghĩa quân phiệt chuyên chế đã lấn át ý chí chính trị của nhân dân, thay vào đó chèo lái đất nước hướng tới tham nhũng và chủ nghĩa thân hữu trắng trợn. Mặc dù vậy, phong trào Liên bang vẫn kiên trì cố gắng đưa dân chủ và chủ nghĩa hiến định trở lại Trung Quốc và hồi sinh lý tưởng của Cách mạng Tân Hợi, tránh xa nền dân chủ tập đoàn thân hữu bất minh ở miền Bắc và chế độ độc tài một đảng tiên phong cách mạng của Quốc dân đảng.\n\nSứ mệnh đó rõ ràng nhất tại [FROM.GetNameDef], khi các cải cách dân chủ đã được Thống đốc [FROM.GetLeader] đều đặn đưa vào. Biến [FROM.GetNameDef] thành một trong nhiều pháo đài của nền dân chủ hiến định tại Trung Quốc, [FROM.GetLeader] đã giành được sự tin tưởng của nhiều quan chức ở [ROOT.Capital.GetCapitalVictoryPointName].\n\nVới lời khen ngợi cao độ từ nhiều người, phong trào Liên bang đã tự tạo cho mình một \"Tỉnh Kiểu mẫu\", cho phần còn lại của Trung Quốc thấy một tỉnh nên được quản lý như thế nào, hoạt động theo nguyện vọng của nhân dân và vì phúc lợi của nhân dân."
UPC.enthusiasmmechanic.002.a: "Quyền công dân và thượng tôn pháp luật đã chiến thắng!"
UPC.enthusiasmmechanic.002.b: "Một tỉnh kiểu mẫu cho cả nước noi theo!"

UPC.enthusiasmmechanic.003.t: "[FROM.GetNameDef] Khẳng định lại Quyền của Tỉnh!"
UPC.enthusiasmmechanic.003.d: "Quyền tự trị của tỉnh luôn là nguyên tắc cốt lõi của tư tưởng Liên bang ở Trung Quốc, ngay cả khi nhiều người tranh cãi về bản chất cách thức thực thi. Khi quyền lực ở Trung Quốc bắt đầu phân quyền và chuyển dịch ngày càng nhiều về cấp tỉnh, chủ nghĩa địa phương cũng trở nên phổ biến hơn, khi nhiều người không tin tưởng vào khả năng giải quyết các vấn đề địa phương của Chính phủ Trung ương và thay vào đó tìm đến các quân phiệt địa phương để giải quyết.\n\nCó vẻ như mặc dù chúng ta có chung mối quan hệ thân thiết với sự nghiệp Liên bang, Thống đốc [FROM.GetLeader] đã tuyên bố cam kết duy trì quyền tự trị tỉnh của [FROM.GetNameDef], củng cố bằng các hành động âm thầm giữ lại thuế nợ Chính phủ Liên bang cùng với sự gián đoạn ngầm đối với sự giám sát vốn đã hạn chế của Liên bang đối với tỉnh.\n\nRõ ràng đây không gì khác ngoài một sự xúc phạm được che đậy vụng về, minh chứng cho sự bất mãn của [FROM.Capital.GetCapitalVictoryPointName] đối với Chính phủ Liên bang. Trong khi chúng ta chẳng thể làm gì ngoài việc giữ im lặng trước sự cố nhỏ này e rằng sẽ dấy lên những cáo buộc phản bội sự nghiệp Liên bang, các nghĩa vụ giữa chính phủ liên bang và tỉnh cũng cần phải được đáp ứng."
UPC.enthusiasmmechanic.003.a: "Họ không thấy gánh nặng của chính phủ sao?"
UPC.enthusiasmmechanic.003.b: "Họ nên hoàn thành nghĩa vụ với [ROOT.Capital.GetCapitalVictoryPointName] trước."

UPC.enthusiasmmechanic.004.t: "[FROM.GetNameDef] Khẳng định lại Sự ủng hộ đối với Chính sách Liên bang!"
UPC.enthusiasmmechanic.004.d: "Hệ thống liên bang phụ thuộc hoàn toàn vào sự tin tưởng lẫn nhau, vì các chính sách do Chính phủ Liên bang ban hành chỉ có thể hy vọng được các chính quyền tỉnh thực thi nếu chúng phục vụ lợi ích của tỉnh. Phản lại, Chính phủ Liên bang cũng phải tin tưởng các chính quyền tỉnh điều hành quản lý phù hợp với mong muốn của Liên bang, đồng thời đảm bảo không vượt quá ranh giới gây ra tổn hại không thể cứu vãn đối với sự tin tưởng.\n\nThống đốc [FROM.GetLeader] đã bày tỏ sự tin tưởng vào các chính sách của Chính phủ Liên bang, củng cố sự thống nhất chính trị giữa chính phủ liên bang và tỉnh. Mặc dù duy trì quyền tự trị chính trị của [FROM.GetNameDef] khỏi [ROOT.Capital.GetCapitalVictoryPointName], [FROM.GetLeader] đã cho thấy [FROM.GetNameDef] sẵn sàng hợp tác với Chính phủ Liên bang.\n\nHành động phục tùng này đã giành được lời khen ngợi từ các quan chức [ROOT.GetAdjective], những người coi đây là một bước tiến hướng tới việc củng cố quyết tâm và sự đoàn kết của phong trào Liên bang. Đối với [ROOT.GetLeader], đó là một sự gia tăng niềm tin về mặt chính trị vì sự công nhận quyền lực quốc gia của ông và chính phủ của ông cũng làm tăng tính hợp pháp của [ROOT.Capital.GetCapitalVictoryPointName] với tư cách là chính phủ chân chính của Trung Quốc."
UPC.enthusiasmmechanic.004.a: "Ý chí chính trị của [ROOT.Capital.GetCapitalVictoryPointName] ngày càng mạnh mẽ."
UPC.enthusiasmmechanic.004.b: "Chỉ thông qua sự thống nhất chính trị Trung Quốc mới có thể nguyên vẹn trở lại!"

UPC.enthusiasmmechanic.005.t: "Chủ nghĩa Hòa bình Gia tăng ở [FROM.GetNameDef]"
UPC.enthusiasmmechanic.005.d: "Trung Quốc đã chìm trong chiến tranh liên miên kể từ Cách mạng Tân Hợi, với người dân phải chịu đựng những điều kiện sống khắc nghiệt, từ việc đánh thuế cắt cổ của các thống đốc địa phương áp bức đến nạn trộm cướp hoành hành khắp nơi. Như vậy, chủ nghĩa hòa bình đã trở thành một xu hướng trong nhân dân, những người lên án sự mạo hiểm mang tính phá hoại của các quân phiệt.\n\nTrong [FROM.GetNameDef], xu hướng này đã thể hiện rõ ràng khi [FROM.GetLeader] cho thấy ông đã đứng về phe ủng hộ hòa bình, khẩn cầu Chính phủ Liên bang giữ gìn hòa bình và thúc đẩy \"Thống nhất bằng Đàm phán\". Mối quan ngại của Thống đốc [FROM.GetLeader] là có cơ sở, vì nhiều người không muốn đẩy Trung Quốc trở lại cuộc nội chiến. Bên cạnh đó, phong trào Liên bang về mặt lịch sử đã đoạn tuyệt với Quốc dân đảng về vấn đề này, khi KMT tìm cách thống nhất Trung Quốc bằng một cuộc Bắc phạt mà cuối cùng đã thất bại thảm hại.\n\nMặc dù điều này có thể hoãn lại bất kỳ quyết định thống nhất Trung Quốc bằng vũ lực nào, khi ý kiến chuyển sang chủ nghĩa hòa bình, [ROOT.GetLeader] phải quyết định làm theo yêu cầu của công chúng, hoặc tiếp tục quân sự hóa đi ngược lại tâm lý quần chúng."
UPC.enthusiasmmechanic.005.a: "Chiến tranh sẽ không được tìm kiếm cũng như không bị cưỡng ép lên người khác."
UPC.enthusiasmmechanic.005.b: "Mong muốn của họ đứng sau nhu cầu thống nhất quốc gia!"

UPC.enthusiasmmechanic.006.t: "[FROM.GetNameDef] Tập hợp vì sự Thống nhất Quốc gia!"
UPC.enthusiasmmechanic.006.d: "Kể từ Chiến tranh Hộ quốc, Trung Quốc đã sụp đổ vào cuộc nội chiến liên miên do tranh chấp nội bộ giữa các phe phái quân sự khác nhau cũng như các chính phủ đối đầu. Năm tháng trôi qua, nhiều chính phủ đã thành lập và sụp đổ, không có hồi kết, khi chiến tranh dần trở thành một điều bình thường ăn sâu vào tâm trí người dân.\n\nCác đợt nỗ lực đã được thực hiện trước đây để thống nhất đất nước, cho dù thông qua ngoại giao hay vũ lực. Cuộc chinh phạt của Đoạn Kỳ Thụy chống lại Phong trào Hộ pháp trong Thế chiến đã kết thúc trong thất bại và làm rạn nứt chính phủ Bắc Dương, trong khi cuộc Bắc phạt của Quốc dân đảng nhằm quét sạch các phe phái Bắc Dương ở miền Bắc đã sụp đổ và suýt làm tan rã đảng.\n\nTuy nhiên, thời thế đã thay đổi, khi nhiều người vẫn khao khao sự Thống nhất Quốc gia. Thống đốc [FROM.GetLeader] là một trong số họ, người đã tập hợp nhân dân [FROM.GetNameDef] ủng hộ Thống nhất Quốc gia dưới chính phủ của chúng ta. Sự ủng hộ của ông là một sự thể hiện niềm tin đối với [ROOT.GetLeader], người hiện được [FROM.GetNameDef] tin tưởng và ủng hộ để đạt được Thống nhất Quốc gia và thực hiện ước mơ của Cách mạng Tân Hợi."
UPC.enthusiasmmechanic.006.a: "Cuộc diễu hành hướng tới Thống nhất Quốc gia ngày càng đến gần!"
UPC.enthusiasmmechanic.006.b: "Chỉ có cùng nhau chúng ta mới có thể tiến tới Thống nhất Quốc gia!"

#Unification Tree Events
UPC.unificationtree.001.t: "Ngã tư Đường"
UPC.unificationtree.001.d: "Chừng nào Thời đại Quân phiệt còn tồn tại, Trung Quốc phần lớn bị chia rẽ theo trục Nam-Bắc. Như Tôn Truyền Phương đã nói một cách chính xác: \"Những người ăn lúa mì miền Bắc chúng ta sẽ không bao giờ hòa hợp với những người ăn cơm miền Nam\".\n\nSau cách mạng Tân Hợi và các tuyên bố độc lập tiếp theo từ các thống đốc miền Nam, quyền lực của Bắc Kinh đã bị cô lập chỉ còn lại những kẻ trung thành nằm ở Tây Nam. Việc phục hồi của Viên Thế Khải và việc phát động Chiến tranh Hộ quốc từ Vân Nam đã chứng kiến miền Tây Nam liên kết lại trong thời gian ngắn để thành lập chính phủ thất bại của riêng họ, về cơ bản là làm mất đoàn kết miền Nam và miền Bắc. Hơn nữa, Phong trào Hộ pháp đã kết thúc với các cuộc đàm phán thất bại giữa Lục-Sầm và Đoạn Kỳ Thụy.\n\nVà một lần nữa, các cuộc đàm phán lại thất bại, khi Trần Quýnh Minh cố gắng đàm phán với chính phủ Trực Hệ vào đầu những năm 1920, trong khi Tôn Trung Sơn cố gắng tranh thủ sự ủng hộ của Phái An Huy. Sau đó, Trần lại cố gắng đàm phán với miền Bắc, mặc dù cuối cùng đã từ chối hội nghị tái thống nhất năm 1925 của Đoạn Kỳ Thụy. Trong một nỗ lực cuối cùng, miền Nam sẽ phát động cuộc Bắc phạt để chứng kiến sự thống nhất bằng cách khuất phục, nhưng lại bị Trực Hệ lật ngược thế cờ.\n\nVới chiến thắng của Trực Hệ xác nhận sự thống nhất bằng cách khuất phục, cuối cùng là câu hỏi liệu miền Nam có thể tự dẫn dắt sự thống nhất của họ hay không, và liệu nó có đáng giá với cái giá không phổ biến trong nhân dân hay không. Lựa chọn khác tất nhiên là đàm phán với Bắc Kinh, và hy vọng họ sẽ nhận ra lý lẽ."
UPC.unificationtree.001.a: "Chúng ta sẽ là những kẻ ngốc nếu không thử lại ít nhất một lần nữa."
UPC.unificationtree.001.b: "Chỉ có thanh gươm mới có thể buộc kẻ khác phải nghe theo lý lẽ."

UPC.unificationtree.010.t: "Đại biểu Quảng Châu Đến"
UPC.unificationtree.010.d: "Chừng nào Thời đại Quân phiệt còn tồn tại, Trung Quốc phần lớn bị chia rẽ theo trục Nam-Bắc. Như Tôn Truyền Phương đã nói một cách chính xác: \"Những người ăn lúa mì miền Bắc chúng ta sẽ không bao giờ hòa hợp với những người ăn cơm miền Nam\".\n\nSau cách mạng Tân Hợi và các tuyên bố độc lập tiếp theo từ các thống đốc miền Nam, những nhà chính trị tráo trở này thấy thích hợp để cai trị các thái ấp cá nhân của họ một cách độc lập khỏi mong muốn của Bắc Kinh. Sau sai lầm của Viên Thế Khải, và việc phát động cả Phong trào Hộ quốc và Hộ pháp, miền Nam sẽ thử sức mình trong việc ép buộc vấn đề tái thống nhất đất nước.\n\nĐương nhiên, các nỗ lực của họ đã thất bại. Đầu tiên, thông qua một mặt trận bị đình trệ và một chính phủ thất bại, thứ hai tương tự thông qua sự yếu kém của chính phủ và đàm phán ngoại giao thất bại. Thứ ba, với việc Trần Quýnh Minh từ chối các dạm hỏi từ miền Bắc. Và cuối cùng, ép buộc vấn đề bằng cuộc Bắc phạt. Kết quả là, đất nước đã thống nhất, chỉ là không phải do miền Nam.\n\nVới việc Trực Hệ thống nhất đất nước, sự Khuất phục đã thấy sự xác nhận trong tâm trí các nhà chính trị của đất nước, càng được củng cố bởi các cuộc đàm phán hòa bình Trực-Phụng thất bại vào những năm 30. Nhắm đến việc thấy đất nước thống nhất, Quảng Châu đã gửi một phái đoàn đến Bắc Kinh để thực hiện các lời hứa thống nhất, bằng cách này hay cách khác. Chắc chắn, Đàm phán đã thấy sự trỗi dậy trở lại trong nhân dân, mặc dù các lãnh đạo quân sự miền Bắc không thấy có vấn đề gì trong việc dập tắt miền Nam một lần nữa."
UPC.unificationtree.010.a: "Chúng ta sẽ trở thành anh hùng nếu thành công. Nghênh đón các dạm hỏi của họ."
UPC.unificationtree.010.b: "Họ đưa ra yêu sách... với *chúng ta* sao?"

UPC.unificationtree.020.t: "Trả giá cho Hành động"
UPC.unificationtree.020.d: "Để xây dựng và duy trì một quân đội có khả năng chiến tranh quy mô lớn, sự hy sinh là bắt buộc trên con đường đã chọn. Nhưng các quân phiệt, những người tiến bộ và bảo thủ đều được hứa hẹn về hòa bình và ổn định, thay vì chiến tranh và đau khổ của những ngày đen tối trong thời đại quân phiệt. Không có sự giải phóng quân sự, chính phủ Liên bang sẽ luôn gặp nguy hiểm từ các đối thủ của mình. Nhưng những sự thỏa hiệp cần thiết cho nỗ lực chiến tranh rất có thể sẽ làm nguy hại đến những cải cách Liên bang quý giá đang được tiến hành.\n\nĐây là câu chuyện cũ đối với các Thống đốc Liên bang. Trong các nhiệm kỳ trước, Trần Quýnh Minh nổi tiếng với những nỗ lực triệt phá nạn buôn bán thuốc phiện, đốt hàng trăm nghìn đô la thuốc phiện buôn lậu công khai, và thậm chí trở thành Chủ tịch Nhánh Quảng Đông của Hiệp hội Chống Thuốc phiện Quốc tế. Tương tự, ông đã triệt phá nạn cờ bạc và các tệ nạn xã hội khác trước khi những thất bại quân sự (và sự tham lam) buộc các cấp dưới như Hồng Trác Lâm phải dỡ bỏ các hạn chế đó. Đường Kế Nghiêu cũng đã có lập trường cứng rắn chống lại thuốc phiện trong quá khứ, nhưng cuối cùng đã bị buộc phải khởi động lại việc sản xuất khi chi tiêu quân sự cao gấp đôi doanh thu của tỉnh.\n\nMột con đường khác để đảm bảo tài chính sẽ là cắt giảm chi tiêu dân sự. Đây luôn là một động thái gây tranh cãi - Hiến pháp Quảng Đông những năm 1920 đã cố gắng quy định rằng không quá 30% ngân sách được sử dụng cho mục đích quân sự và ít nhất 20% được sử dụng cho giáo dục để phản đối chi tiêu quân sự tràn lan của các chính quyền trước. Đề xuất của những người theo chủ nghĩa Liên bang Vân Nam về việc san bằng các trường học và tòa nhà chính phủ để bán vật liệu xây dựng đã thu hút những sự phản đối mạnh mẽ đến mức phải từ bỏ.\n\nMột lựa chọn cuối cùng sẽ là huy động tiền thông qua việc cưỡng chế đánh thuế giới sĩ紳 và thương nhân, cùng với việc làm mất giá đồng nội tệ. Điều này có nguy cơ kích hoạt sự bất ổn trong giới tinh hoa, siêu lạm phát và suy thoái kinh tế. Nhưng với chi phí tăng nhanh và chiến tranh đang đến gần, một điều gì đó phải nhượng bộ."
UPC.unificationtree.020.a: "Thuốc phiện thăng trầm theo nhu cầu của đất nước, chắc chắn rồi."
UPC.unificationtree.020.b: "Hiến pháp chỉ là giấy tờ..."
UPC.unificationtree.020.c: "Hậu quả kinh tế chẳng là gì so với khát vọng quốc gia."

UPC.unificationtree.021.t: "Gân máu của Chiến tranh"
UPC.unificationtree.021.d: "Để xây dựng và duy trì một quân đội có khả năng chiến tranh quy mô lớn, sự hy sinh là bắt buộc trên con đường đã chọn. Nhưng các quân phiệt, những người tiến bộ và bảo thủ đều được hứa hẹn về hòa bình và ổn định, thay vì chiến tranh và đau khổ của những ngày đen tối trong thời đại quân phiệt. Không có sự giải phóng quân sự, chính phủ Hộ quốc sẽ luôn gặp nguy hiểm từ các đối thủ của mình. Nhưng những sự thỏa hiệp cần thiết cho nỗ lực chiến tranh rất có thể sẽ làm nguy hại đến những cải cách quý giá đang được tiến hành.\n\nĐây khó có thể là một câu chuyện mới đối với miền Nam. Nhiều lãnh đạo khác nhau đã tìm cách triệt phá nạn buôn bán thuốc phiện và các tệ nạn xã hội khác, mặc dù nhiều người khác rất sẵn lòng đón nhận ngành thương mại béo bở này. Tương tự như vậy, việc nhắm mắt làm ngơ trước tội phạm có tổ chức, các bảo kê thu phí, và thậm chí cả việc cướp phá trắng trợn đã được các quân phiệt miền Nam sử dụng trong cuộc tìm kiếm tham lam để tài trợ cho các cuộc chiến tranh và lối sống đồi đụy của họ.\n\nCắt giảm giáo dục và tài trợ xã hội là một mục tiêu tiềm năng khác để nhanh chóng thu được số tiền cần thiết cho chiến tranh. Mặc dù giới trí thức kiên quyết chống lại điều đó và đã có một số nỗ lực để bảo vệ các dự án tâm huyết của họ, đặc biệt là trường học công lập, khi chiến tranh nổ ra, thực tế là nam thanh niên và quỹ trường học đều cần thiết ở mặt trận.\n\nMột lựa chọn cuối cùng sẽ là huy động tiền thông qua việc cưỡng chế đánh thuế giới sĩ紳 và thương nhân, cùng với việc làm mất giá đồng nội tệ. Điều này có nguy cơ kích hoạt sự bất ổn trong giới tinh hoa, siêu lạm phát và suy thoái kinh tế. Nhưng với chi phí tăng nhanh và chiến tranh đang đến gần, một điều gì đó phải nhượng bộ."
UPC.unificationtree.021.a: "Học sinh của Trường Rừng Xanh có thể sống nhờ vào đất đai."
UPC.unificationtree.021.b: "Chúng ta có thể mua sách khi chiến tranh kết thúc và Trung Quốc được tự do."
UPC.unificationtree.021.c: "Toàn bộ nền kinh tế phải hoạt động hướng tới chiến thắng!"

UPC.unificationtree.030.t: "Các Tỉnh Kiểu mẫu"
UPC.unificationtree.030.d: "Với một vài ngoại lệ, các lãnh đạo Liên bang đã nhất quán ủng hộ sự nghiệp đàm phán. Từ bỏ sự nghiệp đổ máu không cần thiết và sự tàn bạo đối với nhân dân đất nước, [ROOT.GetLeader] đã thấy phù hợp để biến các vùng dưới sự kiểm soát của họ thành các tỉnh hiện đại, và là một kiểu mẫu cho tất cả noi theo trong quốc gia.\n\nTiến bộ luôn giành được một cách công phu. Trần Quýnh Minh, Đường Kế Nghiêu, Triệu Hằng Tịch và Hùng Khắc Vũ đều đã có nhiều cuộc thâm nhập ngoại giao với các chính phủ đối thủ, đặc biệt là với Phe Trực Hệ và sự Hồi sinh An Huy ngắn ngủi vào giữa những năm 1920. Dù thông qua sự lựa chọn của chính họ, hay sự phản bội các lời hứa của đối tác, hoặc vì sự truất quyền lực của chính họ, những nỗ lực này đã thất bại cho đến khi Trực Hệ buộc Hồ Nam và Vân Nam phải phục tùng theo các điều khoản không bình đẳng.\n\nMặc dù vậy, với sự trở lại quyền lực của họ ở miền Nam, [UPC.GetLeader] đã vạch ra một con đường quen thuộc rộng lớn, mặc dù với những bài học rút ra từ quá khứ. Ngân sách quân sự phình to đã bị cắt giảm, cho phép chính phủ tái khởi động chi tiêu cho các chương trình xã hội - đặc biệt là giáo dục. Các tệ nạn như cờ bạc, thuốc phiện và mại dâm đã bị kiềm chế nếu không muốn nói là cấm hoàn toàn ở các tỉnh, vì các nguồn lực có thể được phân bổ để khôi phục trật tự xã hội. Trách nhiệm tài chính và việc vay nợ khôn khéo đã cho phép chính quyền Quảng Châu phát triển thịnh vượng dưới nhiệm kỳ tương đối ngắn của ông.\n\nVới không gian bổ sung để thực hiện các cải cách địa phương trong khi tìm kiếm không gian để thấy Bắc Kinh tỉnh ngộ, một tình huống tiến thoái lưỡng nan thú vị đã dấy lên. Điều gì làm cho Xã hội Kiểu mẫu của chúng ta trở nên đặc biệt? Có phải là sự hạn chế tệ nạn? Có lẽ là những nỗ lực giáo dục, và sự giảm chi tiêu quân sự phình to? Hay thậm chí có thể là sự ổn định tài chính của nó giữa một biển hỗn loạn?"
UPC.unificationtree.030.a: "Mạn phép hoan hô [UPC.GetLeader]! Người khuất phục Thuốc phiện!"
UPC.unificationtree.030.b: "Mạn phép hoan hô [UPC.GetLeader]! Người dập tắt Nạn mù chữ!"
UPC.unificationtree.030.c: "Mạn phép hoan hô [UPC.GetLeader]! Nhà Tài chính Cừ khôi!"

UPC.unificationtree.031.t: "Món quà của Hòa bình"
UPC.unificationtree.031.d: "Với một vài ngoại lệ, các lãnh đạo Chủ nghĩa Khu vực đã nhất quán ủng hộ sự nghiệp đàm phán. Từ bỏ sự nghiệp đổ máu không cần thiết và sự tàn bạo đối với nhân dân đất nước, [ROOT.GetLeader] và các lãnh đạo khu vực khác có thể trả giá để hướng sự chú ý của họ (ít nhất là tạm thời) vào các mục đích sản xuất.\n\nĐây chưa bao giờ là một quá trình dễ dàng. Lục Vinh Đình, Sầm Xuân Huyên, Trần Quýnh Minh, Đường Kế Nghiêu, Triệu Hằng Tịch và các lãnh đạo miền Nam khác đã cố gắng đàm phán với chính phủ Bắc Dương và chấm dứt nội chiến, với thành công hạn chế. Tuy nhiên, với sự nghỉ ngơi tạm thời khỏi chiến đấu này, các lực lượng an ninh có thể được triển khai để trấn áp nạn trộm cướp và cướp phá - bao gồm cả từ hàng ngũ của chính họ. Điều này cho phép trật tự được khôi phục, và nhân dân phát triển thịnh vượng trong sự hòa bình này.\n\nCác nỗ lực giáo dục cũng có thể thụ hưởng từ sự ổn định và khả năng tiếp cận nguồn vốn lớn hơn. Các nỗ lực bị đình trệ nhằm chống lại nạn mù chữ và các dự án khác nhằm cải thiện số phận của nhân dân và hồi sinh làng quê Trung Quốc có thể cất cánh.\n\nCuối cùng, sự hòa bình này đã cho phép các doanh nghiệp phát triển, quân nhân giải ngũ, và nhân dân đóng góp vào các nỗ lực từ thiện. Sự hòa bình này không thể kéo dài mãi mãi, nhưng trong khi nó còn tồn tại, chúng ta nên tận dụng tối đa."
UPC.unificationtree.031.a: "Hòa bình mang lại pháp luật và trật tự cho đất nước."
UPC.unificationtree.031.b: "Hòa bình mang lại kiến thức và sự hiểu biết cho nhân dân."
UPC.unificationtree.031.c: "Hòa bình mang lại sự thịnh vượng và phát triển cho quốc gia."

##UPC Digesting Other Factions Events

UPC.digestionevents.001.t: "Những người theo Chủ nghĩa Liên bang Triết Giang"
UPC.digestionevents.001.d: "Phong trào Liên bang những năm 1920 đã có những người ủng hộ ở Ngũ Tỉnh Miền Đông, nơi cuối cùng sẽ hình thành nên hạt nhân trong Liên minh của Tôn Truyền Phương. Quả thực, Nguyên soái Tôn ít nhất đã nói suông về ý tưởng Chủ nghĩa Liên bang trong thời kỳ cai trị của mình, mặc dù thương hiệu Chủ nghĩa Liên bang của ông phản động và chuyên chế hơn nhiều so với các phiên bản trước của phong trào. Sau khi chiếm được Nam Kinh và buộc Ngũ Tỉnh phải quy phục, các nhóm thân Liên bang địa phương đã có nhiều không gian để thở hơn.\n\nCó lẽ phe phái tương tự trực tiếp nhất là Phong trào Tự trị Triết Giang, hiện do Chử Phụ Thành lãnh đạo. Được thành lập bởi các Nhà Cải cách Đồng minh hội địa phương và nhiều trí thức khác nhau, họ đã phản ứng tích cực với Hiến pháp Liên bang của Hồ Nam, và cùng với các nhóm tương tự ở Giang Tây và Phúc Kiến, họ đã cố gắng thông qua các hiến pháp tỉnh của riêng mình. Mặc dù không đạt được thành công tương tự như Hồ Nam và Quảng Đông, họ chứng tỏ là những cộng sự sẵn lòng.\n\nMã Húc Lun là một nhà giáo dục đã làm việc với Trương Thái炎 trong quá khứ. Là một trí thức sinh ra ở Triết Giang, ông bị bám theo bởi các cáo buộc có cảm tình với Quốc dân đảng trong cuộc Bắc phạt nhưng đã quản lý để có một sự trở lại chính trị trong thời kỳ tự do hóa ngắn ngủi của Trực Hệ. Hội Xúc tiến Dân chủ Trung Hoa của ông phần lớn bị buộc phải rút vào hoạt động bí mật sau năm 1932, nhưng tương tự cũng có cảm tình với phong trào của chúng ta.\n\nCố gắng đi theo họ là nhiều quân phiệt, nhà dân tộc chủ nghĩa và nhà chủ nghĩa khu vực, những người đã bảo trợ họ trong thời kỳ Tôn cai trị và mong đợi sự bảo vệ đổi lại. Hầu hết họ thuộc phe Triết Giang của Trần Nghi, mặc dù một số là cựu thành viên của chính quyền An Huy của Trần Điệu Nguyên. Họ không nghi ngờ gì sẽ mong đợi các vị trí nổi bật bên cạnh quyền tự trị tỉnh nếu họ tham gia chính phủ của chúng ta."
UPC.digestionevents.001.a: "Dĩ nhiên, chúng ta có thể sử dụng tất cả sự trợ giúp mà chúng ta có thể nhận được!"
UPC.digestionevents.001.b: "Chúng ta phải chọn lọc về những người chúng ta cho phép vào phong trào."

UPC.digestionevents.002.t: "Pháo đài Dân chủ"
UPC.digestionevents.002.d: "Đôi khi được gọi là hòn đảo dân chủ của Trung Quốc, gần đây chúng ta đã đưa Hồ Nam vào tập hợp. Trong hơn một thập kỷ, Tỉnh đã được cai trị bởi Thống đốc Dân sự của nó, Triệu Hằng Tịch. Ngay sau khi nắm quyền vào cuối năm 1920, một trong những hành động đầu tiên của ông là thúc đẩy việc tạo ra và thực thi Hiến pháp Tỉnh Hồ Nam. Kể từ khi nó được thực thi vào ngày 1 tháng 1 năm 1922, Triệu đã là một cái tên nổi bật trong Phong trào Liên bang. Ngay cả khi là một phần của phe Trực Hệ, và không thể trực tiếp tham gia Liên minh Đại Cộng hòa, Triệu đã sử dụng vị trí của mình để làm dịu Trực Hệ chống lại GRA, đóng vai trò như một mặt trận hợp pháp cho chúng ta theo nhiều cách.\n\nTuy nhiên ông không phải là cái tên duy nhất của Hồ Nam trong phong trào. Nổi tiếng nhất vào năm 1932, Hoàng炎Bồi đã trốn khỏi Thượng Hải và thấy mình ở Trường Sa, và đã hoạt động từ đó trong vài năm qua. Và ở địa phương, FCDP có khả năng tự đứng vững một cách độc đáo, do Châu Thế Chiêu lãnh đạo, một người chỉ trích gay gắt Triệu, người muốn ông bị bãi nhiệm Thống đốc. Thập kỷ của Hồ Nam với tư cách là cuộc thử nghiệm Liên bang đã khiến nó phát triển một bộ máy dân sự khá mạnh mẽ, một bộ máy có thể giúp ích cho chúng ta.\n\nNhưng đó không phải là toàn bộ câu chuyện, Triệu vẫn là Thống đốc không chỉ nhờ bộ máy dân sự của ông, mà còn vì Quân đội Tương. Mặc dù không đến mức phi chính trị hay thiếu ý kiến, nó đã chấp nhận việc Triệu là một dân sự trước tiên và sự kiểm soát dân sự ngày càng tăng đối với quân đội địa phương. Mặc dù chỉ có một số ít chỉ huy thực sự là những người theo chủ nghĩa Liên bang, toàn bộ quân đội sẽ là một sự bổ sung tuyệt vời vào hàng ngũ của chúng ta, cho phép chúng ta ít phụ thuộc hơn vào các tướng lĩnh không mấy tốt đẹp của mình.\n\nTuy nhiên nguồn lực của chúng ta có hạn, và chúng ta không thể chiêu mộ tất cả mọi người, vì vậy chúng ta sẽ cần phải đưa ra lựa chọn giữa bộ máy dân sự của Hồ Nam hoặc các chỉ huy Quân đội Tương."
UPC.digestionevents.002.a: "Bộ máy dân sự của Hồ Nam là sức mạnh lớn nhất của nó, chúng ta nên sử dụng nó."
UPC.digestionevents.002.b: "Hồ Nam chỉ tồn tại lâu như vậy nhờ Quân đội Tương, chúng ta nên đền đáp họ tương ứng."

UPC.digestionevents.003.t: "Bước vào Lãnh địa của Nhà vua"
UPC.digestionevents.003.d: "Pháo đài của miền Tây Nam và vương quốc của những người Cộng hòa cuối cùng đã sụp đổ trước các đạo quân của [ROOT.GetNameDef]. Và cùng với đó, sự kế thừa của một cấu trúc chính trị đục ngầu và động lực chín mùi cho việc khai thác, hoặc làm suy yếu bất kỳ quyền cai trị ổn định nào trong tỉnh. Với sự sụp đổ của Đường Kế Nghiêu, một Hộp Pandora chính trị đã mở ra trước [ROOT.GetLeader] và chính quyền của ông, và điều quan trọng là một chính sách tỉnh ổn định phải được thực thi.\n\nBất chấp tất cả những lỗi lầm của mình, Đường Kế Nghiêu tự thể hiện mình như một kết luận đã rồi không hề ngượng ngùng. Trong bất kỳ tham vọng nào khác đối với dự án Liên bang trong Vân Nam, nó sẽ bị kết án thất bại nếu không có Đường gánh vác. Được cho là lãnh đạo Liên bang nổi bật nhất ở cấp quốc gia, tầm nhìn thực dụng hơn của ông về tư tưởng được viết cùng Trương Thái炎, một trong những nhà sáng lập trí thức của nó, đã thấy sự giải thích của ông là một sự bảo thủ nhưng tiến bộ. Bị hoen ố bởi một sự nghiệp chính trị hy sinh, ông dù sao cũng là một cái tên quá lớn để từ chối. Gắn liền với nhau, các nhà dân chủ kiểu mới địa phương là một sự bổ sung tự nhiên để tước vũ khí một số khuynh hướng chuyên chế của Đường.\n\nCâu hỏi thực sự là liệu có nên mở rộng chính quyền tỉnh để bao gồm một số người gièm pha Đường, hoặc kẻ thù của ông. Phe của Long Vân gồm các trợ lý và nhân viên Bắc Dương thân Quốc dân đảng, chẳng hạn, hoặc Hồ Nhược Ngô và sức hút của ông trong giới sĩ紳. Trong khi việc sáp nhập họ sẽ đặt ra một phong trào quốc gia mạnh mẽ hơn, nó sẽ mở ra cho chính trị Vân Nam trở thành một thùng thuốc súng mất ổn định khác."
UPC.digestionevents.003.a: "Chủ nghĩa Liên bang của Vân Nam là trò chơi của Đường, không phải của họ."
UPC.digestionevents.003.b: "Họ chỉ hành động vì lợi ích của tỉnh nhà."

UPC.digestionevents.004.t: "Tách Quý Châu khỏi Điền"
UPC.digestionevents.004.d: "Có lẽ là điểm đen của miền Tây Nam, chính trị nội địa của Quý Châu luôn kết hôn với chính trị của các xóm giềng mạnh hơn, giàu có hơn và có ảnh hưởng hơn: Hồ Nam, Vân Nam, Tứ Xuyên và Quảng Tây. Từng bị chi phối lâu dài bởi gia tộc Lưu, có trụ sở tại Hưng Nghĩa và được Phe Vân Nam hỗ trợ một cách lỏng lẻo, Quý Châu đã thấy mình bị cuốn vào quán tính hỗn loạn của Thời đại Quân phiệt, và cho đến gần đây đã de-facto bị chia đôi.\n\nBị đẩy vào sự hỗn loạn của Tân Hợi, bị Đường Kế Nghiêu xâm lược với sự giúp đỡ của Lưu顕世 (và thay mặt cho Thái Ngạc), sự cai trị tiếp theo của Lưu sẽ thấy cảnh chính trị Quý Châu lắng xuống trên các tuyến chiến trường trong phe Quý Châu. Phe Hưng Nghĩa Cũ, do gia đình Lưu lãnh đạo, và Phe Hưng Nghĩa Mới do Viên Tổ Minh lãnh đạo. Ngoài ra còn có Phe Đồng Nhân, giới sĩ紳, những người Hiến chính, Phe Quý Châu Mới đã chết về mặt chức năng, và những người khác.\n\nMặc dù Phe Quý Châu Cũ lắng nghe về thời đại của các nhà cải cách Tân Hợi, ít nhất là về tinh thần, một sự chia rẽ đã xảy ra trong nhiệm quyền chiếm đóng hiện tại về việc trao quyền cho nhà tuyển dụng quyền lực địa phương nào. Hiện tại trên sân chơi tồn tại Phe Hưng Nghĩa Mới chiết trung của Viên Tổ Minh với mối quan hệ nhạt nhẽo với Thanh niên Đảng Trung Hoa và dự án Liên bang, cùng với Phe Đồng Nhân thâm hiểm của Châu Tây Thành. Một lựa chọn khác là gia tộc Lưu dưới thời Lưu顕Chiêm, một ông lão cổ xưa có thù hằn với Viên, nhưng cuối cùng dự kiến sẽ không đạt được nhiều thành tựu. Hoặc lựa chọn giữa đường, những người Hiến chính dưới thời Nhậm Khắc Trừng, những người đã ngồi ở cánh sau của chính trị kể từ thời hoàng kim của họ ở Tân Hợi, nhưng có khả năng sẽ làm xáo trộn chính trị địa phương đến một mức độ căng thẳng."
UPC.digestionevents.004.a: "Nhà Yêu nước và Kẻ Hành quyết đảm bảo sự tiến bộ."
UPC.digestionevents.004.b: "Lưu顕Chiêm và gia tộc của ông dễ bị uốn nắn."
UPC.digestionevents.004.c: "Những người Hiến chính sẽ đảm bảo sự ưu tiên của dân sự."

UPC.digestionevents.005.t: "Cán bộ của Chủ nghĩa Liên bang ở Lưu vực Sông Hồng"
UPC.digestionevents.005.d: "Với sự sụp đổ của Trùng Khánh trong vài ngày qua, người ta đã khuyên rằng nên gửi các quan chức đến Tứ Xuyên để bắt đầu đặt nền móng cho việc tự quản. Việc chiếm được trung tâm này đã mang lại nhiều nhóm lợi ích và những người ủng hộ liên bang trong quá khứ đến với sự chú ý của chúng ta, người ủng hộ chính là phe sĩ quan của Hùng Khắc Vũ vừa bước ra khỏi bóng tối.\n\nHùng, về phần mình, đã ủng hộ chủ nghĩa liên bang ngay từ những năm 1920, mặc dù ảnh hưởng của ông đã phai nhạt cho đến nay do các thái độ đặc biệt thù địch đối với lý tưởng này trong những năm can thiệp. Cùng với Hùng còn có sự kết hợp của các nhà tư tưởng tiến bộ, những người đã mở lòng với mô hình liên bang, do Trương Lan đứng đầu. Đương nhiên, việc sáp nhập họ với tư cách là các diễn viên địa phương và quốc gia là một kết luận đã rồi.\n\nMối quan tâm cấp bách hơn là sự hiện diện của các nhân vật chính trị khác, những người ít tận tụy hơn với sự nghiệp của chủ nghĩa liên bang. Bản chất khét tiếng bị phân mảnh của Tứ Xuyên đã dẫn đến việc nhiều quân phiệt nhỏ lẻ cố thủ trong khu vực tài khoản của riêng họ, các đầu sỏ chính là các tướng Lưu Văn Huy, Đặng Tích Hầu và Lý Gia Dụ, những người gần đây đều nhằm mục đích thúc đẩy một chương trình nghị sự mở hơn đối với mục tiêu liên bang, mặc dù sự nghi ngờ vẫn còn về sự tận tụy của họ đối với toàn bộ phong trào. Với sự kết nối chính của họ với Thanh niên Đảng Trung Hoa, bản thân nó là một lực lượng cũ được thành lập ở Tứ Xuyên, những người đàn ông này có hiểu biết về sự nghiệp Liên bang, mặc dù lệch khỏi tư tưởng ở một số khía cạnh — để lại nhiều sự chia rẽ về việc chấp nhận họ vào chính phủ."
UPC.digestionevents.005.a: "Khoác lên mình bộ vest không rửa sạch được tội lỗi của ngươi."
UPC.digestionevents.005.b: "Sự định hướng lại của họ có thể đã cứu họ vừa kịp lúc."

UPC.digestionevents.006.t: "Ở Vùng đất của những Dòng sông và Thung lũng"
UPC.digestionevents.006.d: "Có lẽ chỉ có thể so sánh với Hồ Nam về danh tiếng quốc gia vì một văn hóa tỉnh quân sự hóa cao độ, cảnh quan và con người Quảng Tây đại diện bình đẳng cho lịch sử bị chiến tranh tàn phá của nó. Như câu nói phổ biến ở Quảng Tây: \"Ở Quảng Tây không có nơi nào không có núi; không có núi nào không có động; không có động nào không có cướp\". Bị xé rách giữa các thung lũng sông sâu và các đỉnh núi cao vút, với cướp bóc ở mọi cấp độ ở giữa, Quảng Tây là một tỉnh cực kỳ nghèo, về cơ bản chỉ có một thành phố đáng chú ý: thủ phủ tỉnh Nam Ninh.\n\nTương tự, do sự thống trị tuyệt đối của các Phe Quảng Tây Cũ và Mới, Chủ nghĩa Liên bang hầu như không có môi trường chín mùi để cắm rễ trong tỉnh. Dĩ nhiên, điều đó không có nghĩa là nó chưa từng được thử. Trong thời hoàng kim của Thời đại Anh hùng Quảng Tây những năm 1920, nhiều lựa chọn thay thế đã được đưa ra để làm đồng minh cho Trần Quýnh Minh, hoặc Đường Kế Nghiêu.\n\nChẳng hạn, Lưu Zhenhuan, mặc dù bề ngoài gắn liền với Phe Chính trị Học Cũ và Đồng minh Dân chủ Trung Hoa, đã thỉnh cầu Đường Kế Nghiêu vào những năm 1920 trợ giúp cuộc xâm lược của ông vào trước buổi dội của cuộc Bắc phạt, đổi lấy chức thống đốc Quảng Tây. Lâm Hổ, một thành viên của phe Quảng Tây Trẻ thuộc Phe Quảng Tây Cũ, là một đối thủ tiềm năng và đồng thời là đồng minh mạnh mẽ của Trần Quýnh Minh, và thậm chí chính Mã Tế cũng có mối quan hệ với Triệu Hằng Tịch ở Hồ Nam.\n\nNhư hiện tại, với triển vọng quốc gia ngày càng tăng của phong trào Liên bang, điều quan trọng là [ROOT.GetLeader] phải đảm bảo một liên minh với bất kỳ ai sẵn lòng chấp nhận trong khu vực. Nhưng các lựa chọn của ông khá hạn chế; lựa chọn luôn hiện diện là Lưu Zhenhuan, người mà sự can thiệp kiểu Machiavelli đã thấy ông được định vị như một \"nhà dân chủ\". Nhưng cũng có thể cân bằng tham vọng của ông, bằng cách thiết lập kết nối với Lâm Hổ, và Dương Hữu Minh; những đồng minh cũ manh mún của chính ông."
UPC.digestionevents.006.a: "Ngươi hiếm khi tìm thấy một người theo Chủ nghĩa Liên bang trung thực ở đây..."
UPC.digestionevents.006.b: "Chúng ta có thể hào phóng, nếu chỉ một chút."

UPC.digestionevents.007.t: "Đồng minh Cũ và Viên ngọc trên Vương miện"
UPC.digestionevents.007.d: "Và điều đó đã được thực hiện, chiến dịch lớn của quân đội đã giành được cho nó có lẽ là thành phố tuyệt vời nhất ở miền Tây Nam, ngoại trừ có lẽ là Hồng Kông. Ánh sáng Rực rỡ trên Đồng bằng Sông Châu Giang, Quảng Châu, từ lâu đã là trụ sở của tất cả các Chính phủ miền Nam lớn trong Thời đại Quân phiệt. Làm chủ nhà cho tất cả các loại quan chức trong sự phát triển đô thị của nó, chẳng hạn như Tôn Trung Sơn, Sầm Xuân Huyên, Trần Quýnh Minh, Đường Kế Nghiêu, Đường Thiệu Nghi, Hồ Hán Dân, Uông Tinh Vệ, và nhiều người khác. Được coi là tương đương ở miền Nam với Nam Kinh, hoặc Bắc Kinh, về mặt chiếu sức mạnh quốc gia, việc chiếm giữ nó bởi [ROOT.GetLeader] đã hầu như hợp pháp hóa quyền lực của ông ở miền Tây Nam.\n\nĐương nhiên tuy nhiên, với việc đưa Quảng Châu và các lãnh thổ xung quanh vào chính quyền của mình, [ROOT.GetLeader] đã được để lại với... những gì một số người sẽ coi là một sự kết hợp của những người bạn lỏng lẻo và những vết thương há miệng làm quen một lần nữa. Trên con đường tiến tới Chủ nghĩa Liên bang, có lẽ đã có ít một tập hợp những người bảo vệ kiên định các giá trị của nó, hoặc chân thành hơn, của Trần Quýnh Minh, hơn là của Việt Quân.\n\nDo Diệp Cử lãnh đạo và được nhân sự bởi các cá nhân gần gũi với Thủ lĩnh Cũ của họ, cụ thể là Phe Hải Phong, họ đã quản lý để tồn tại vĩnh viễn nhờ sự kiên cường, quyết tâm, một chút may mắn, và một vài giao dịch ít quang vinh hơn. Tuy nhiên, việc Phe và Quân đội Việt được sáp nhập vào chính quyền mới là điều tự nhiên.\n\nVề phần mình, Trần Quýnh Minh đã ra tín hiệu rằng ông không tìm kiếm lệnh chỉ huy trường, thay vào đó chọn giữ lại chính mình cho chính trị. Câu hỏi còn lại trên bàn là: chúng ta mở cửa rộng đến mức nào cho họ?"
UPC.digestionevents.007.a: "Chỉ những người thuần khiết, kiểm tra tất cả họ vì... tầm quan trọng."
UPC.digestionevents.007.b: "Toàn bộ Phe Việt là những chiến binh dũng cảm cho Chủ nghĩa Liên bang."

##UPC Federal Elections
UPC.federalelections.000.t: "Chiến dịch Bầu cử Bắt đầu"
UPC.federalelections.000.d: "Đã lâu rồi kể từ khi Trung Quốc tổ chức các cuộc bầu cử trên toàn quốc. Trong nửa năm tới (ở một số tỉnh sớm hơn thế), người dân Trung Quốc sẽ đến các điểm bỏ phiếu và bỏ phiếu ở các hội đồng địa phương, những người sau đó sẽ chọn các ứng cử viên ở các cấp chính phủ cao hơn. Ngay từ bây giờ, các nhà hoạt động chính trị và các nhà điều hành đã hạ cánh xuống các tỉnh, vận động bầu cử cho các hạt cạnh tranh để lôi kéo cho các ông chủ của họ. Tinh thần có vẻ cao, người dân tràn đầy năng lượng hơn - liệu chúng ta có dám hy vọng đây sẽ là cuộc bầu cử dân chủ nhất từ trước đến nay?\n\nCuộc đua về cơ bản sẽ tập trung nhiều hơn vào việc giành chiến thắng ở các hội đồng địa phương và bộ máy chính trị hơn là quần chúng bình dân, nhưng một sự ủy quyền phổ biến cũng không hại gì. Cả hai bên lớn đều không có cơ sở hạ tầng vận động bầu cử quốc gia phát triển đầy đủ và sẽ phụ thuộc vào các đảng địa phương và các nhóm dân sự để giúp họ vượt qua vạch đích. Các Ứng cử viên Tổng thống, [UPC_GetGRAPartyLeader] của Liên minh Đại Cộng hòa và [UPC_GetCDLPartyLeader] of Đồng minh Dân chủ Trung Hoa, không giống như những người tiền nhiệm của họ trong hệ thống Bắc Dương, sẽ chủ động hơn một chút trong việc vận động bầu cử - đi du hành khắp đất nước để đảm bảo các phiếu bầu họ cần.\n\nHọ khó có thể cô đơn trong cuộc đua này tuy nhiên. Nhiều đảng thứ ba đang tranh chấp các ghế địa phương và [UPC_GetDCPPartyName_nocolour] cùng YCP đã thành lập tốt dự kiến sẽ lĩnh xướng những kẻ thách thức lớn nhất đối với hệ thống hai đảng, cũng như những người xã hội chủ nghĩa bị phỉ báng, những người sẽ gây ra sự gián đoạn mặc dù bị áp bức. Một loạt các ứng cử viên độc lập con cưng địa phương cũng có thể chứng tỏ là khó bị lật đổ tại các trung tâm chính trị của họ. Treo lơ lửng trên cuộc đua là khả năng thụt lùi dân chủ, và các quan sát viên đang theo dõi chặt chẽ tại [UPC_GetSTAPartyName] để xem liệu họ có tôn trọng quá trình này hay không.\n\nVới một lượng lớn những người vận động chính trị lần đầu tiên, nhiều người trong số họ là sinh viên và trí thức, tâm trạng chính trị ở quốc gia có thể khó đo lường. Chậm mà chắc, nó trở nên rõ ràng rằng..."
UPC.federalelections.000.a: "...động lực đang ở về phía GRA!"
UPC.federalelections.000.b: "...CDL đang giành lấy sáng kiến!"

UPC.federalelections.001.t: "Khánh thành Quốc hội"
UPC.federalelections.001.d: "Các cuộc bầu cử quốc hội đã diễn ra theo đúng kế hoạch, và từ xa việc hoàn hảo, có vẻ như hệ thống phần lớn đã giữ vững. Các hội đồng địa phương đã gửi một đợt các nhà lập pháp mới đến [UPC.Capital.GetCapitalVictoryPointName], và mặc dù một số phiếu bầu tiếp tục bị tranh chấp tại tòa án, họ sẽ không làm gián đoạn các thủ tục. Chỉ riêng việc tổ chức các cuộc bầu cử được coi là tương đối công bằng đã là một chiến thắng đối với phong trào Liên bang, nhưng vẫn còn nhiều việc phải làm ở phía trước.\n\nSau khi các cuộc bầu cử Tổng thống kết thúc, một chính phủ mới sẽ cần phải được thành lập và một Thủ tướng được bổ nhiệm với sự ủng hộ của đa số lập pháp. Đây có thể không phải là nhiệm vụ dễ dàng nhất vì Trung Quốc đã trở nên rạn nứt như thế nào. Việc cơ quan lập pháp thất bại trong việc hợp tác với Tổng thống để hoàn thành chương trình nghị sự của ông trong một khung thời gian hợp lý có thể dẫn đến việc thụt lùi trở lại chủ nghĩa chuyên chế, như đã xảy ra nhiều lần trong quá khứ. Và sẽ luôn có những người nghi ngờ về tính đại diện chân chính của chính phủ.\n\nNhững gì tất cả đều biết là Tổng thống cuối cùng sẽ được chọn từ số những người chiến thắng trong các cuộc chiến thống nhất Trung Quốc - một nguồn cằn nhằn trong số những người thất bại và những người đến muộn. Và xét về lịch sử gần đây của Trung Quốc với chế độ chuyên quyền, điều đó có thể là cuộc bầu cử quan trọng hơn trong hai cuộc bầu cử?"
UPC.federalelections.001.a: "Và bây giờ là lúc cho việc thỏa thuận hậu trường bắt đầu."

UPC.federalelections.002.t: "Bầu cử Tổng thống Năm [GetYear]"
UPC.federalelections.002.intro: "Cuộc bầu cử Tổng thống được cho là phần được mong đợi nhất trong chu kỳ bầu cử này. Mặc dù nhiều hiến pháp và các đạo luật khác đã tìm cách biến Trung Quốc thành một hệ thống nghị viện, trên thực tế Trung Quốc luôn mang tính chất Tổng thống. Và ít có Tổng thống nào tự nguyện rời bỏ văn phòng."
UPC.federalelections.002.closer: "Sau đó, Tổng thống mới sẽ được kỳ vọng sẽ tạo ra một chính phủ hoạt động. Các cuộc đàm phán liên minh đã diễn ra giữa các đảng thứ ba và hai phe, vì các triển vọng Tổng thống tìm cách không chỉ giành sự ủng hộ cho bản thân, mà còn cho sự lựa chọn Thủ tướng của họ."
UPC.federalelections.002.d.indirect: "$UPC.federalelections.002.intro$\n\nTổng thống sẽ được chọn gián tiếp, với quốc hội bỏ phiếu về nguyên thủ quốc gia tiếp theo của Trung Quốc. Mặc dù các đảng chính trị chính thức ở Trung Quốc đã gia tăng trong thập kỷ qua hoặc lâu hơn, lòng trung thành với đảng vẫn còn hạn chế trong cấp cơ sở. Sẽ có nhiều cơ hội để trao đổi mua bán với các lãnh đạo đảng và đảm bảo những kẻ đào tẩu thời cơ.\n\n$UPC.federalelections.002.closer$"
UPC.federalelections.002.d.direct: "$UPC.federalelections.002.intro$\n\nTổng thống sẽ được chọn trực tiếp, với hàng triệu cử cử Trung Quốc bỏ phiếu cho ứng cử viên ưa thích của họ. Với các lãnh đạo của các đảng chính trị lớn hơn tự nguyện ngồi ngoài cuộc đua trước áp lực, phiếu bầu sẽ được giành chiến thắng bởi một trong hai người. Đã mất một thời gian để phiếu bầu được lập bảng, tuy nhiên một Tổng thống mới dự kiến sẽ được tuyên bố sớm.\n\n$UPC.federalelections.002.closer$"
UPC.federalelections.002.a: "Xin chúc mừng [UPC_GetGRAPartyLeader]!"
UPC.federalelections.002.b: "[UPC_GetCDLPartyLeader] đã chiến thắng!"

UPC.federalelections.003.t: "Bầu cử Quốc hội bị Hoãn vô Thời hạn"
UPC.federalelections.003.d: "Sau các cuộc bầu cử Liên bang đầu tiên kiệt sức, giới chính trị Trung Quốc có ít sự thèm khát cho một vòng vận động bầu cử khác. Ba năm đã trôi qua và các cuộc bầu cử thường sẽ được lên lịch trong vài tháng. Tuy nhiên, đã có ít sự chuyển động theo hướng đó trong vài tuần qua: không có sự vận động công khai hay tuyên bố ứng cử viên lớn nào.\n\nCuối cùng, các lãnh đạo của quốc gia đã thận trọng phá vỡ sự im lặng. [UPC_GetGRAPartyLeader], [UPC_GetCDLPartyLeader], và các lãnh đạo cấp cao khác của các đảng lớn đã tuyên bố một quyết định chung về việc hoãn cuộc bầu cử quốc hội tiếp theo cho đến khi sự thống nhất Trung Quốc hoàn tất - một quyết định gây tranh cãi nhưng có lẽ hiểu được. Đã có một số cuộc phản đối về sự hoãn lại, với những người phản đối chỉ ra sự đình chỉ của Bầu cử Quốc hội năm 1933 là dấu hiệu rõ ràng nhất về việc phe Trực Hệ thất hứa về các lời hứa tự do của họ sau sự thống nhất ban đầu của họ."
UPC.federalelections.003.a: "Một thực tế đáng tiếc cho quốc gia chúng ta."

#Post Unification Events

UPC.federalelections.030.t: "Chính trị Thay đổi ở Trung Quốc"
UPC.federalelections.030.d: "Với sự thống nhất đất nước, Trung Quốc đã trải qua sự thay đổi to lớn. Về mặt quân sự, chính trị, xã hội và văn hóa, Chiến tranh Trung-Nhật lần thứ hai và kết luận (hy vọng là cuối cùng) của Thời đại Quân phiệt đã đẩy đất nước vào một thời đại mới một cách không thể đảo ngược. Đã trở nên ngày càng rõ ràng rằng Phong trào Liên bang sẽ là những người chiến thắng cuối cùng trong cuộc tìm kiếm sự thống nhất của Trung Quốc.\n\nKết quả là, chính trị quốc gia đã được định hình lại xung quanh các khuynh hướng dự kiến của một trật tự Liên bang mới. Liên minh Đại Cộng hòa và Đồng minh Dân chủ Trung Hoa đã phát triển từ các khối bầu cử vụng về thành các đảng có bản sắc quốc gia gắn kết hơn nhiều, củng cố sự nắm giữ của họ đối với cộng hòa mới.\n\nTuy nhiên họ không cô đơn trong sự phát triển của mình. Nhiều đảng, nhóm dân sự, và các nhà chính trị cá nhân đều đã bắt đầu làm việc để tìm kiếm vị thế của họ trong hệ thống chính trị mới. Các hiệp hội sinh ra các đảng chính trị chính thức, những người Độc lập giữ vững lập trường của họ hoặc tham gia các liên minh, và các đảng điều chỉnh các chương trình của họ cho hệ thống mới. Ở một cấp độ cao hơn, toàn bộ các phong trào đã bắt đầu điều chỉnh theo các thực tế mới trên mặt đất.\n\nKhi Trung Quốc chuyển giao vào một kỷ nguyên mới, những thay đổi nhanh chóng đã trở nên ngày càng khó khăn cho giới cầm quyền kiểm soát. Nhiều nhóm bướng bỉnh từ chối uốn nắn, giữ đúng với lý tưởng của các môi trường chính trị trước đó. Những người khác đã thay đổi quá nhanh đến mức họ trở nên Utterly không thể nhận ra - Zongshe, chẳng hạn, đã chuyển giao thành một đảng quyền lợi quý tộc và Mãn Châu. Cho dù trường hợp có thể là gì, các nhà tư tưởng và nhà chính trị của Trung Quốc sẽ không chờ đợi để giọng nói của họ được lắng nghe."
UPC.federalelections.030.a: "Chúng ta tay trong tay đi tới một tương lai Liên bang tươi sáng hơn!"
UPC.federalelections.030.b: "Và tuy nhiên, chúng ta không thể đón chào tất cả các bạn trên hành trình."

UPC.federalelections.031.t: "Tái tổ chức Phe Tả"
UPC.federalelections.031.d: "Bị tước đoạt cuộc cách mạng của mình, phe tả cực đoan đã trở nên nghèo nàn khi họ vật lộn với raison d'etre của họ trong thời đại mới này. Thiếu bất kỳ cách thức có ý nghĩa nào để chiến đấu với trật tự tư sản, phong trào phân mảnh giờ đây chiến đấu với sự tan rã khi các lãnh đạo của họ quay cuồng theo nhiều hướng khác nhau.\n\nLiên minh những người Công đoàn Trung Hoa, một trong những dấu ấn của sự hợp tác thiên tả, đã giải thể - các thành viên vô chính phủ, Mác-xít và công đoàn của họ phân tán vào sự không liên quan. Đảng Công đoàn Trung Hoa đã chứng tỏ là tổ chức duy nhất đủ kiên cường để chịu đựng trên một quy mô đáng kể, chiến đấu để trốn tránh sự kiểm duyệt và đàn áp.\n\nQuốc dân đảng tương tự đã thấy mình trong tình trạng tồi tệ khi sự thống nhất xé rách đảng. Các nhân vật ôn hòa và linh hoạt như Uông Tinh Vệ và Cố Mộng Dư ở phe tả và Tôn Khoa, Dương Vĩnh Thái, và Cư Chính ở phe hữu đã đưa ra các dạm hỏi đối với chính phủ mới, đề nghị từ bỏ cách mạng bạo lực và tham gia bầu cử nếu KMT được hợp pháp hóa. Những kẻ cứng rắn như Đặng Diễn Đạt, Tống Khánh Linh, Hồ Hán Dân, và Đới Quý Đào vẫn luôn sung sức trong các cuộc tấn công của họ vào cộng hòa Liên bang hoặc thông qua một cuộc đấu tranh quân sự bạo lực tiếp tục hoặc các bài đả kích dài dòng phân tích mọi khía cạnh của Trung Quốc mới.\n\nTrong đống tro tàn, nhiều nhóm ly khai đã hình thành không còn chịu sự ràng buộc của ủy ban trung ương cũ. Đảng Sản nghiệp Nhân dân của Trần銘Khung, Đảng Nông công Dân chủ Trung Hoa của Đàm Bình Sơn và Trương Bác Quân, và Liên minh Cách mạng của Chủ nghĩa Tôn Trung Sơn ngoài lề đều đã cố gắng tham gia vào chính trị mà không có gánh nặng chết chóc của KMT. Một số kẻ cực đoan sẽ không bao giờ chấp nhận cộng hòa, với các du kích xã hội chủ nghĩa chiến đấu trong vô vọng hy vọng rằng dòng thủy triều không thể tránh khỏi của lịch sử sẽ sớm mang lại cuộc cách mạng thế giới cho Trung Quốc.\n\nNhững ngày cách mạng có thể đã qua, nhưng liệu các nguyên tắc của nó sẽ phai nhạt vào ngoài lề hay hòa nhập vào dòng chính có thể được quyết định trong những năm đầu tiên của cộng hòa."
UPC.federalelections.031.a: "Nếu họ thực sự phổ biến, họ có thể tham gia."
UPC.federalelections.031.b: "Lừa tôi một lần, xấu hổ cho ngươi..."

UPC.federalelections.032.t: "Những người Thừa kế của Lương Khải Siêu"
UPC.federalelections.032.d: "Phong trào cải cách của Lương Khải Siêu và Khang Hữu Vi đã có ảnh hưởng lâu dài đến chính trị Trung Quốc. Khang là người lớn tuổi hơn và bảo thủ hơn trong hai người, ủng hộ một chế độ quân chủ hiến định. Lương lệch khỏi Khang, tranh luận cho một nhà nước trung ương tập quyền hiến định mà dựa vào đó quốc gia sẽ đủ mạnh để khẳng định mình trên trường thế giới. Dao động giữa phe hữu và phe tả, ông khăng khăng rằng chủ nghĩa chuyên chế và chế độ độc tài chỉ được sử dụng trong các hoàn cảnh hạn chế để thúc đẩy sự tiến bộ. Lương cuối cùng vẫn là một người kiên định của chủ nghĩa cải cách và chủ nghĩa hiến định Trung Quốc.\n\nSau khi ông qua đời, Lương để lại một tập hợp hậu duệ chính trị rải rác. Đồng minh và đồng nghiệp của ông, Từ Tấn, đã kế nhiệm Lương làm lãnh đạo Đảng Hiến chính Trung Hoa vào năm 1923 và đưa nó theo một hướng bảo thủ kiên định hơn. Điều này đã thúc đẩy một sự chia rẽ trong CCP và người được ông bảo hộ Từ Tiên Tử đã tổ chức một nhóm cận vệ trẻ \"Hiến chính Dân chủ\" trong cộng hòa mới để gây áp lực buộc cận vệ cũ nghỉ hưu một cách thân thiện. Đường Hóa Long đã tích lũy phe phái của riêng mình ở Hồ Nam giống như những ngày Nghiên cứu 社 cũ của phong trào.\n\nHai người được Lương bảo hộ từ bước ngoặt thiên tả của ông vào những năm 1920, Trương Quân Mại và Trương Đông Tôn, đã thành lập Đảng Dân chủ Xã hội sau Sự cố Thất Quân Tử. Nhưng tính cách hách dịch của Trương Quân Mại có nguy cơ khiến đảng của ông bị rạn nứt.\n\nNhững kẻ cực đoan theo hướng chính trị Liangist, Thanh niên Đảng Trung Hoa vẫn giữ lại sự chia rẽ của riêng mình. Những kẻ cực đoan dưới thời Tăng Kỳ khăng khăng theo một phương pháp cách mạng, trong khi những người ôn hòa dưới thời Lý Hoàng và Tả Thuấn Sinh đã bắt đầu theo đuổi các phương tiện bầu cử. Đã tự gắn mình với Trực Hệ trong Thời đại Quân phiệt, sức mạnh của họ đã giảm bớt nhưng không biến mất.\n\nCác ý tưởng của Lương cũng phổ biến đối với cả các quân phiệt chủ nghĩa khu vực và những người theo chủ nghĩa nhà nước. Lời kêu gọi của ông về một Trung Quốc mạnh mẽ, trung ương tập quyền và thậm chí dân chủ được thấm nhuần với một giáo lý của chủ nghĩa Darwin xã hội có thể sẽ thu hút những người cảm thông trong nhiều năm tới."
UPC.federalelections.032.a: "Trương Quân Mại là người gần gũi nhất với Lương khi ông qua đời..."
UPC.federalelections.032.b: "Những người Hiến chính là di sản kéo dài của ông!"
UPC.federalelections.032.c: "Chỉ có Thanh niên Trung Hoa chứng tỏ sự đổi mới vượt ra ngoài quá khứ."

UPC.federalelections.033.t: "Chủ nghĩa Tự do Trung Hoa Thế kỷ 20"
UPC.federalelections.033.d: "Trong giới trí thức, nhà Tự do Trung Hoa được cho là một ngọn hải đăng của các lý tưởng kiên định và không lay chuyển trong niềm tin của họ vào nền dân chủ. Nhưng họ thấy mình hoặc vô lực trước dòng thủy triều của chủ nghĩa quân phiệt hoặc bị buộc phải thỏa hiệp về niềm tin của họ để thấy sự tiến bộ.\n\nĐiều này được thấy rõ nhất trong trường hợp của Hồ Thích, \"Nhà Lý tưởng Cô độc\" mang tính biểu tượng, người tự coi mình đứng trên trò chơi chính trị bẩn thỉu. Nhưng ông đã nhanh chóng mất đi sự ngây thơ thời trẻ đó, và quay sang cố gắng tổ chức \"Phong trào Người tốt\" bằng cách đảm bảo sự hợp tác giữa các quân phiệt và trí thức dưới một Phấn Đấu 社 được hồi sinh.\n\nHồ cũng từng là một thành viên của Nguyệt Tân 社 do Từ Chí Ma lãnh đạo. CMS dưới sự lãnh đạo mới của La Long Cơ, Văn Nhất Đa, và Lương Thực Thu đã chèo lái hoạt động dân chủ tự do-bảo thủ, tập trung xung quanh Đại học Tây Nam ở Vân Nam.\n\nỞ miền Bắc, Việt Nam Bắc Dương đã sinh ra các hiệp hội dân sự của riêng mình. Phe Chính trị Học và Phe Thông tin được hình thành từ các nhà cách mạng Đồng minh hội cũ đã từ chối bước ngoặt cực đoan của Tôn Trung Sơn. Họ thấy ảnh hưởng của mình tăng giảm trong suốt cuộc đời của Việt Nam cũ. Phi đảng phái vào những thời điểm tốt nhất, vị trí ngách của họ đã cho họ sức mạnh kinh ngạc trong nhiều năng lực khác nhau.\n\nMột sự phát triển gần đây hơn là sự xuất hiện của Liên minh các Đảng Trung gian từ những người bị từ chối hoặc từ chối gia nhập GRA hoặc CDL. Do Đảng Dân chủ Hồng Môn Trung Hoa lãnh đạo, được hình thành bởi các hội kín Hồng Môn không đồng ý với chủ nghĩa chuyên chế GRA và sự chính trị hóa CDL, nó được tham gia bởi Đảng Tự do Quốc gia Trung Hoa, Đảng Dân chủ Trung Hoa, Tự cường 社, Hòa Bình Đảng, Trung Nghĩa Đảng, và Quang Phục Hội được hồi sinh và đứng ở một vị trí giữa không thoải mái. Trong sự chuyển giao dân chủ của chúng ta, có vẻ như nhà Tự do Trung Hoa chưa chết nhưng có thể bị buộc phải phát triển một lần nữa trong nửa sau của thế kỷ."
UPC.federalelections.033.a: "Chủ nghĩa Tiến bộ tìm thấy vị trí của nó dưới thời những người Tự do!"
UPC.federalelections.033.b: "Lợi ích Kinh doanh và Tính Phi đảng phái bay cao!"
UPC.federalelections.033.c: "Cả GRA và CDL đều không thể được tin tưởng với nền dân chủ!"

UPC.federalelections.034.t: "Một Thời đại Mới ở các Tỉnh"
UPC.federalelections.034.d: "Các quan sát viên, cả quốc tế và địa phương, đương nhiên đã tập trung vào các thay đổi rộng lớn, quét sạch trong chính trị quốc gia Trung Quốc. Các đại hội đảng lớn, các thay đổi trong học thuyết đảng, sự xuất hiện của một thế hệ các nhà chính trị lôi cuốn mới, và việc xây dựng một nền dân chủ ở quốc gia đông dân nhất trên hành tinh. Nhưng chính trị khu vực ở Trung Quốc vẫn duy trì tầm quan trọng cốt yếu - có lẽ còn hơn thế nữa khi Trung Quốc là một cộng hòa Liên bang.\n\nChủ nghĩa liên bang mới này mang một hình thức khác với hình thức của Thời đại Quân phiệt Cao cấp. Các quân phiệt lớn hơn phần lớn đã bị tiêu diệt hoặc khuất phục; sức mạnh và sự độc lập của họ bị cuộn lại bởi Quân đội Trung ương và pháp luật Liên bang. Tuy nhiên, đối với các quân phiệt còn lại - cả những quân phiệt lớn khôn khéo chọn đúng bên và nhiều quân phiệt nhỏ và địa phương mà chính phủ mới phụ thuộc vào để ổn định sự cai trị của họ - các kết nối chế độ và sức mạnh mềm của họ cho phép họ chịu đựng.\n\nSức mạnh của Chính phủ Trung ương, mặc dù có những nỗ lực của các nhánh định hướng chủ nghĩa khu vực và vô chính phủ của Phong trào Liên bang, đã không bị phá vỡ. Chủ nghĩa nhà nước vẫn còn, được trao quyền bởi hai cánh tay của bộ máy quan liêu chính phủ trung ương và quân đội trung ương. Một số thành tố của nó được xây dựng bởi chính những người theo chủ nghĩa Liên bang, được xây dựng từ cốt lõi đã thống nhất đất nước. Những thành tố khác chỉ đơn giản là được thừa kế từ hệ thống Bắc Dương mà nó đã lật đổ.\n\nCuộc \"kéo co\" cổ xưa giữa ngoại vi và cốt lõi tiếp tục như nó luôn thế. Sự cân bằng căng thẳng này giữ cho cả hai bên trong sự kiểm soát hiện tại, được giữ bởi sự hiểu biết rằng một cuộc khủng hoảng có thể lật đổ hoàn toàn bàn cờ, gây nguy hiểm cho hệ thống mỏng manh và thậm chí có khả năng kích hoạt nội chiến. Nhưng ai biết liệu điều này có kéo dài mãi mãi..."
UPC.federalelections.034.a: "Chỉ có quân đội mới có thể bảo vệ Cộng hòa!"
UPC.federalelections.034.b: "Chủ nghĩa Liên bang phải được bảo vệ bởi những nhà Chủ nghĩa Khu vực của nó!"

#Post Democratic Back Sliding Events (060-089):
UPC.federalelections.060.t: "Bầu cử Liên bang Năm [GETYear]"
UPC.federalelections.060.d: "Hôm qua các cuộc bỏ phiếu cuối cùng đã đóng cửa trên khắp Trung Quốc. Đại diện từ các đơn vị bầu cử xung quanh quốc gia sẽ đến [UPC.Capital.GetCapitalVictoryPointName] và tuyên thệ nhậm chức khi một quốc hội mới nhậm chức trong những tuần tới.\n\nĐúng như dự đoán, Tổng thống [ROOT.GetLeader] và các đồng minh của ông đã giành chiến thắng đa số, hưởng lợi từ quán tính chế độ và một phe đối lập bị khóa miệng. Các đảng khác và những người độc lập đã thúc đẩy để giành chiến thắng một số ghế cạnh tranh, hầu hết đều nằm ngoài trung tâm của [UPC.GetRulingParty], với các mức độ thành công và đàn áp khác nhau.\n\nĐã có một số tia hy vọng cho sự tan băng chính trị và các đảng khác nhau đã ăn mừng những chiến thắng nhỏ mà họ đã giành được. Nhưng theo một cách nào đó điều đó cảm thấy tồi tệ hơn đối với những nhà lý tưởng, bởi vì điều đó có nghĩa là sự sắp xếp này có thể diễn ra vô thời hạn khi những nhà dân chủ phục tùng thực tế mới này."
UPC.federalelections.060.a: "Phe đối lập ghi nhận một vài chiến thắng tượng trưng."
UPC.federalelections.060.b: "[UPC.GetRulingParty] tiếp tục khẳng định sự thống trị của họ."

##Campaigning Events
#Provincial Campaigning Events
#Super Yield (200-209)
UPC.federalelections.200.t: "Chiến dịch Đáp xuống Tứ Xuyên"
UPC.federalelections.200.d: "Bước vào Lưu vực Sông Hồng, chính trị rạn nứt của sa bàn Tứ Xuyên địa phương đã phản ánh chính nó trong chính trị quốc gia. Được coi là những người khởi xướng chính của Đồng minh Dân chức Tứ Xuyên Trung Hoa, Trương Lan và Tiên Anh đã gắn biến thể địa phương của họ về phong trào với biến thể của Bộ Sĩ quan địa phương dưới sự bảo trợ của Lý Gia Dụ và La Trạch Châu để đứng trước cơ hội chống lại các phe phái quân sự hóa cao độ của khu vực. Tương tự, Trương và Tiên giữ lại mối quan hệ với các nhánh Bộ Tốc thành của Dương Sâm và Lưu Tương, và trong quá trình chuyển giao từ chính trị khu vực sang Tỉnh Liên bang, ngay cả Bộ Bảo Định cũng đã thấy mình trong CDL - có lẽ nếu chỉ để chọc tức những người theo Chủ nghĩa Liên bang Cũ.\n\nĐóng vai trò là trung tâm của phong trào Liên bang tuy nhiên là Hùng Khắc Vũ, Nhóm Chín người của ông, và Văn phòng Chuẩn bị Tự trị Liên bang Tỉnh Tứ Xuyên. Trong quá khứ Hùng đã phải đưa ra các sắp xếp với các tế bào Quốc dân đảng địa phương và những kẻ cực đoan khác để duy trì sự sống, và duy trì sự ủng hộ nhạt nhẽo của họ.\n\nLực lượng lớn thứ ba trong chính trị Tứ Xuyên là của nhiều đảng không phải Liên bang, cấp bách nhất là Thanh niên Đảng Trung Hoa. Tỉnh nhà của họ, họ có một lượng sức mạnh không thể tranh cãi trong khu vực địa phương, nắm bắt liên minh Trực-YCP mạnh mẽ của thời kỳ giữa hai cuộc chiến. Giữa thời kỳ chuyển giao nằm một loạt các đảng nông dân và nông nghiệp địa phương, chủ yếu là Đảng Tự do Nông dân Trung Hoa do Hà Lỗ và Hồ Văn Lan lãnh đạo, và Đảng Nông dân Trung Hoa do Giáo sư Đổng Thời Tiến lãnh đạo (một sự phát triển từ Hiệp hội Cải cách Nông nghiệp Trung Hoa của ông). Cả hai đều không thiết tha hợp tác, với CPLP nghiêng về phe tả, và CPP nghiêng về phe hữu.\n\nCuối cùng vẫn tồn tại Tự cường 社 Trung Hoa ít được biết đến, liên minh với Đảng Dân chủ Trung Hoa do nhà báo Trùng Khánh Hầu Dã Quân thành lập. Aspiring gia nhập CDL, họ cuối cùng đã thất bại. Bị chi phối rộng rãi bởi các hội kín, họ chống lại bộ máy quan liêu, và giữ lại một ngách cho các đề xuất kiến thiết nông thôn và xã hội độc đáo của họ."
UPC.federalelections.200.a: "Có vẻ như các quân phiệt thực sự có thể mặc vest..."
UPC.federalelections.200.b: "Hùng tập hợp ngọn cờ Chủ nghĩa Liên bang một lần nữa!"
UPC.federalelections.200.c: "YCP và các Đảng Nhỏ đã khắc họa một chiến thắng!"

UPC.federalelections.201.t: "Chính trị Bán đảo ở Sơn Đông"
UPC.federalelections.201.d: "Từ lâu bị chi phối bởi các quân phiệt hách dịch, chính trị tỉnh Sơn Đông thấy mình bị cô lập khỏi bối cảnh chính trị rộng lớn hơn. Với việc loại bỏ ảnh hưởng quân phiệt, các nhóm chính trị địa phương khác nhau đã thấy mình tranh giành để lấp đầy khoảng trống trong Cộng hòa Liên bang mới.\n\nPhe \"Dinh Cố vấn\" do Trương Công Trí lãnh đạo, là một nhánh địa phương của Tiến bộ Đảng nổi tiếng của Liangist. Thừa nhận một loại vị trí trung tâm trong chính trị Sơn Đông, và phần lớn bao gồm các cựu quan chức và các nhà trí thức-sĩ phu truyền thống, nó đã liên tục hoạt động chống lại tất cả các quân phiệt Sơn Đông, và do đó với sự loại bỏ của họ, đã hành động. Đưa ra một liên minh ngầm với Liên minh Đại Cộng hòa, họ được coi là những người gánh vác chính cho bất kỳ khoản lợi nhuận nào họ hy vọng đạt được trong tỉnh, mặc dù niềm tin Liên bang của họ gần như bằng không.\n\nHợp tác một cách thực dụng với phe Dinh là \"Câu lạc bộ Cố vấn\" do Vương Trào Quân lãnh đạo. Ban đầu là một nhánh của Quốc dân đảng Sơn Đông, họ đã hầu như mất kết nối với KMT vào năm 1916. Bao gồm các cựu nhà cách mạng và đại diện của công chúng nói chung, nó tương tự hoạt động chống lại các quân phiệt Sơn Đông mặc dù tư cách thiên tả của nó đã liên tục bị chỉ trích, bị coi là mất kết nối. Cuối cùng, họ đã thất bại trong việc đảm bảo sự kết nạp vào Đồng minh Dân chủ Trung Hoa, và vì vậy phần lớn đứng như những người độc lập.\n\nCuối cùng, mặc dù không quan trọng như hai nhóm nói trên, tồn tại \"Câu lạc bộ Đồng Nhân\" do An Bằng Đông lãnh đạo. Bề ngoài thân chính quyền, đó là một phe của Dinh đã tách ra khỏi họ vào đầu những năm 1920, thông qua một lập trường thân thống đốc. Bao gồm chủ yếu là bộ máy quan liêu dân sự chính quyền và nhân sự quân sự không hoạt động, họ đã phần lớn dựa nền tảng của họ vào việc \"không làm rung chuyển con thuyền\". Dựa vào các mối thù giữa Câu lạc bộ và phe Dinh (bây giờ kẻ thù chung của họ đã biến mất) để định vị mình là lựa chọn ổn định và đáng tin cậy trong tỉnh."
UPC.federalelections.201.a: "Dinh và GRA khôi phục sự hòa hợp cho Sơn Đông!"
UPC.federalelections.201.b: "Câu lạc bộ và CDL mang lại sự tiến bộ cho tất cả!"
UPC.federalelections.201.c: "Câu lạc bộ Đồng Nhân quản lý để tập hợp cho sự ổn định!"

UPC.federalelections.202.t: "Tại Quê hương của Trực Hệ"
UPC.federalelections.202.d: "Khi các cuộc bầu cử một lần nữa đắm chìm trụ sở của nhiều chính phủ Trung Quốc, những người theo Chủ nghĩa Liên bang miền Nam đã thấy mình bị khóa chặt khỏi thế giới cắt cổ của chính trị [GetVictoryPointName_9843].\n\nVới một liên minh chính trị ngầm dựa trên sự bảo tồn mô hình Người tốt Nho gia và Chủ nghĩa Xã hội Nhà nước của họ, tàn dư của cánh dân sự thuộc Nhóm Lạc Dương của Ngô Bội Phu (Các Bộ Chính vụ và Bí thư) đã xuất hiện vào một liên minh chính trị với nhánh Thanh niên Đảng Trung Hoa quốc gia. Được tham gia bởi Thủ tướng [UPC_GetDCPPartyName_nocolour_long], nhóm tạm thời kết nối tất cả các con đường của đời sống chính trị [GetVictoryPointName_9843].\n\nHoạt động trong vị trí giữa không thoải mái của một Cộng hòa Quân tử, các nhóm Độc lập khác nhau và các nhóm Cộng hòa khác đã tích lũy cùng nhau trong một cordon sanitaire với Liên minh Đại Cộng hòa để cố gắng cắt đứt chính trị phi đảng phái. Được hình thành thông qua sự đồng ý của Phấn Đấu 社, Phe Chính trị Học, Tân Hải quân 社, Tự trị Phong trào Đồng chí Hội và những người theo Dương Độ và Lưu Sư Bồi, liên minh rạn nứt dựa sự ủng hộ của mình vào chính trị phi đảng phái và danh nghĩa Liên bang.\n\nChạy ngược lại cả hai nhóm nói trên là cờ đầu chính của Đồng minh Dân chủ Trung Hoa ở miền Bắc - Hội Cứu quốc của Thẩm Quân Nho. Được tham gia bởi những người như Đảng Dân chủ Xã hội Mới Trung Hoa của Giang Kháng Hổ, Diễn đàn Dân chủ và Khoa học, Hiệp hội Giáo dục Nghề nghiệp Trung Hoa, Hiệp hội Kiến thiết Nông thôn và Đảng Công đoàn Trung Hoa của Lý Đại Zhao, họ đại diện cho mặt trận thiên tả và dân túy chống lại các bất công được nhận thức thực thi trên nhân dân Trung Quốc.\n\nCuối cùng, rải rác trong gió là tàn dư của Hòa Bình Hiệp Hội, Phồn Vinh Liên minh, Cảnh Tinh 社, và Nhóm Tân Bảo. Chìm xuống nhưng chắc chắn không rời cuộc chơi, họ giữ lại nhiều quan chức và bộ máy quan liêu của chính phủ cũ, và bám vào một vị trí cố thủ trong tỉnh Trực Hệ. Đương nhiên việc bãi nhiệm họ sẽ làm mất ổn định mọi thứ ở Trực Hệ."
UPC.federalelections.202.a: "Chính phủ Người tốt sống tiếp trong liên minh Lạc Dương-YCP-[UPC_GetDCPPartyName_nocolour]!"
UPC.federalelections.202.b: "Hoàng Phú và Hồ Thích xoay sang Phi đảng phái và GRA!"
UPC.federalelections.202.c: "Tiến bộ và Dân chủ chưa chết dưới thời CDL!"
UPC.federalelections.202.e: "Giới cầm quyền đảm bảo sự ổn định và thịnh vượng!"

UPC.federalelections.203.t: "Hà Nam và Tòa án của Ngọc Soái"
UPC.federalelections.203.d: "Từ lâu là chiến trường giữa các quân đội cướp bóc và quân phiệt, Hà Nam chỉ thấy sự ổn định và hòa bình tương đối trong Thời đại Quân phiệt. Với việc quản lý của nó thường xuyên bị dằn xé như ngã tư đường giữa Bắc Kinh và Vũ Hán, nó đã bị xé rách thường xuyên hơn là giữ cùng nhau. Tuy nhiên trong thời gian gần đây, dưới thời Thống đốc Lý Tế Thần thuộc Phe Sĩ quan thuộc Nhóm Lạc Dương của Ngô Bội Phu, nó đã chứng kiến một cảm giác ổn định, nhưng không phải thịnh vượng.\n\nLà quê hương của căn cứ hoạt động Lạc Dương của Ngô Bội Phu, Hà Nam giữ lại một cảm giác kỷ luật nghiêm ngặt và cưỡng chế, ngay cả trong đời sống dân sự hàng ngày. Cố thủ vững chắc trong Chính trị Tỉnh, Phe Sĩ quan, Bộ Chính vụ, và Phe Bí thư đều đã gạt bỏ sự khác biệt của họ để trình bày một mặt trận Lạc Dương thống nhất trong chính trị tỉnh. Tự thể hiện mình là có hiểu biết về lợi ích của nhân dân, và thậm chí lắng nghe thời hoàng kim của Quản trị Người tốt, Lý Tế Thần đã quản lý để kết hợp phong trào chính trị của Trực Hệ thành một phong trào của riêng mình.\n\nXen kẽ trong lõi sĩ quan Trực Hệ, các học viện, và chính phe Lạc Dương nằm Thanh niên Đảng Trung Hoa. Mặc dù không mạnh như ở Giang Tô, Sơn Tây, Trực Hệ hay Tứ Xuyên, họ đã quản lý để môi giới một thỏa thuận căng thẳng với [UPC_GetDCPPartyName_nocolour_long], và tò mò hơn là Liên minh Đại Cộng hòa, để đặt ra một mối đe dọa khá nghiêm trọng chống lại sự thống trị của Lạc Dương.\n\nVới việc GRA quản lý để đột phá con đường của họ về mặt chính trị vào miền Bắc, Đồng minh Dân chủ Trung Hoa đã được để lại để tranh giành các nhóm nông dân và nông nghiệp địa phương để chạy cùng. Được gom lại cùng nhau là các nhóm độc lập địa phương khác nhau, hy vọng giữ lại ảnh hưởng hạn chế của họ. Khá kỳ lạ, tàn dư của sự chiếm đóng Hà Nam của Quốc dân quân đã dấy lên, với cuộc nổi dậy Núi Đại Biệt kéo dài của Trương Quốc Đào bước ra khỏi bóng tối. Trình bày một lựa chọn thiên tả cho chính trị địa phương, bất kỳ sự đưa những kẻ cực đoan này, hiện gắn liền với CDL, vào quyền lực sẽ thấy một sự mất ổn định lớn của chính trị địa phương."
UPC.federalelections.203.a: "Lý Tế Thần thừa kế chiếc áo áo của Ngọc Soái!"
UPC.federalelections.203.b: "Thanh niên Trung Hoa, những người Hiến chính, và GRA mang lại sự thay đổi!"
UPC.federalelections.203.c: "Liên minh CDL-CSP-GMJ làm rung chuyển tỉnh!"

UPC.federalelections.204.t: "Bầu cử ở Mái đao Quảng Đông"
UPC.federalelections.204.d: "Piedmont Miền Nam Trung Hoa, tỉnh Quảng Đông từ lâu đã là trung tâm của các chính phủ đối lập khác nhau, và như vậy đã thấy chính trị địa phương của nó bị lật ngược nhiều lần. Động lực chính trị, nó thăng trầm khi các làn sóng cách mạng, chủ nghĩa cải cách, và chủ nghĩa quân phiệt quét qua nó. Một hạt nhân lớn của phong trào Liên bang, nhiều quan chức của nó được rút ra từ tỉnh.\n\nPhần lớn là trụ sở quyền lực của Trần Quýnh Minh và phong trào của ông, Đảng Công Nghĩa hướng tới nông dân-sĩ紳 căng thẳng đã thấy mình trong điểm nổi bật của Cộng hòa Liên bang mới. Gắn liền với nhau là những người thiên tả và thiên hữu của PIP, với các quân phiệt độc lập chuyển thành nhà chính trị khác nhau như Đặng Bản Ân (với sự kìm kẹp của ông đối với Quỳnh Nhai) và Hồng Trác Lâm (nắm giữ Triều Mei).\n\nChuyển giao sang Quảng Đông làm căn cứ hoạt động của họ sau sự trấn áp năm 1932 của Tôn Truyền Phương đối với các hoạt động thiên tả, Trương Quân Mại và các nhà Hiến chính Left-Liangist khác nhau của ông đã thấy mình ở đỉnh cao của nhánh Đồng minh Dân chủ Trung Hoa địa phương. Dưới sự bảo trợ của người đứng đầu khu vực Từ Phú Lâm, nó phần lớn là một cuộc đua hai con chó giữa Liên minh Đại Cộng hòa dưới thời PIP, và CDL.\n\nTuy nhiên chạy làm kẻ phá bĩnh là lực lượng Quốc dân đảng trong tỉnh. Luôn là một lò hống lớn của tâm lý cách mạng, họ vẫn là một mối bận tâm cho các đảng quốc hội địa phương. Với các phiến quân nông thôn, giai cấp công nhân đô thị, và một phong trào vô chính phủ đi kèm, một số người trong KMT đã tách ra khỏi nhánh chính để chạy đua cho văn phòng địa phương, nhưng những người khác đã khăng khăng đòi Đảng Quốc."
UPC.federalelections.204.a: "Công Nghĩa dồn Quảng Đông đến chiến thắng!"
UPC.federalelections.204.b: "Một Trung Quốc Mới được đưa ra dưới thời CDL."
UPC.federalelections.204.c: "Chính trị Học và Trần Liên Bá nắm lấy quyền từ khi sinh ra..."
UPC.federalelections.204.e: "Chủ nghĩa Cực đoan nắm lấy Quảng Đông một lần nữa!"

UPC.federalelections.205.t: "Giang Tô: Hang Hổ"
UPC.federalelections.205.d: "Từng là trụ sở của Cọp Cười, Nam Kinh đã là nơi diễn ra nhiều khoảnh khắc then chốt trong lịch sử Trung Quốc, và với tư cách là Thủ đô Miền Nam kính trọng, đã trở thành một chiến trường cho các đảng chính trị và hiệp hội khác nhau trong Cộng hòa Liên bang mới. Mặc dù nó từng là một điểm nóng khá phổ biến cho tư tưởng Liên bang, gắn liền với Thượng Hải và Triết Giang như một loại trung tâm trí thức cho phong trào, nó phần lớn bị giảm quy mô sau Cuộc khởi nghĩa Thượng Hải.\n\nTuy nhiên, điều đó không nhất thiết có nghĩa là phong trào đã chết trong khu vực. Với các nhà hòa giải khác nhau và những người cộng hòa độc lập hiểu biết về các dạm hỏi của Liên minh Đại Cộng hòa, Tô 社 cũ (một nhánh tự trị địa phương dân sự dựa trên giới sĩ紳) đã thấy một loại hồi sinh nguyên thủy trong sự sắp xếp với GRA. Mặc dù không thống nhất nội bộ, và còn lâu mới ở đầu sóng chính trị tỉnh, họ rất thiết tha hợp tác với những người theo Chủ nghĩa Liên bang Cũ.\n\nỞ lối đi đối diện đứng các nhóm Đồng minh Dân chủ Trung Hoa khác nhau, thống nhất dưới sự lãnh đạo của một số nhà chính trị hàng đầu của nó. Ở cấp độ địa phương, Hội Xúc tiến Dân chủ Trung Hoa của Mã Húc Lun được tôn trọng rộng rãi đứng cao, phối hợp với Trương Quân Mại khét tiếng và Đảng Dân chủ Xã hội của ông, và Hoàng炎Bồi kính trọng và Hội Kiến thiết Quốc gia Dân chủ Trung Hoa và Hiệp hội Giáo dục Nghề nghiệp Trung Hoa. Thu hút Tập đoàn Giang Nam dưới thời anh em họ Vinh do lập trường thân Công nghiệp hóa của họ và các kết nối ngân hàng của Trương Đông Tôn, tấm vé của họ đã thấy một sự thống nhất hiếm có của giới sĩ紳, ngân hàng, nông dân và giai cấp công nhân, không khác gì di sản chính trị của chính Tôn Truyền Phương.\n\nCuối cùng chạy đua như các ứng cử viên phá bĩnh là các nhóm rải rác khác nhau của những người độc lập hoặc các diễn viên chính trị tương đối nhỏ khác trong tỉnh. Các cựu chi nhánh của mạng lưới bảo trợ Trực Hệ như Dương Văn Khải, những người tách ra từ Tập đoàn Giang Nam, Cảnh Tinh 社 dưới thời Lý Bào Chương, Thanh niên Đảng Trung Hoa dưới thời Lý Bào Chương, và thậm chí [UPC_GetDCPPartyName_nocolour_long] đều đã đưa ra các ứng cử viên."
UPC.federalelections.205.a: "Tô 社 và GRA hoàn thành các lời hứa của họ."
UPC.federalelections.205.b: "Các kết nối kinh doanh và Chủ nghĩa Lý tưởng đẩy CDL tiến lên!"
UPC.federalelections.205.c: "Cảnh Tinh, Thanh niên Trung Hoa, những người Hiến chính, và Trực Hệ chia rẽ Giang Tô."

#High Yield (210-219)

UPC.federalelections.210.t: "Hồ Nam và Tấm gương Liên bang"
UPC.federalelections.210.d: "Sự vận động bầu cử đã tăng lên ở Tỉnh Hồ Nam. GRA có một ngôi sao địa phương là Triệu Hằng Tịch và Dân tộc Tân sinh 社 của ông. Triệu, đã làm Thống đốc trong hơn một thập kỷ, có các kết nối đáng chú ý trong giới Sĩ紳 và Chính giới, và đã huy động họ trong một nỗ lực để khiến cử cử bỏ phiếu cho các ứng cử viên GRA ở Hồ Nam.\n\nTuy nhiên, khuynh hướng bảo thủ hơn của ông đã mở ra sườn trái cho CDL khai thác. Châu Thế Chiêu, người đã lãnh đạo FCDP và hiện lãnh đạo CDL ở Hồ Nam, đã sử dụng tư cách thiên tả của mình để giành sự ủng hộ của các cử cử tiến bộ và tập trung vào lao động. Đồng thời có Hoàng炎Bồi, mặc dù hiện được coi là một nhân vật quốc gia, người đã dành nhiều năm xây dựng các trường học và Hội Kiến thiết Quốc gia Dân chủ Trung Hoa (hiện là một thành tố của CDL) ở Hồ Nam. Bây giờ ông đang sử dụng sự xây dựng đó để huy động sự ủng hộ cho CDL, hình thành một phe đối lập thiên tả kiên định đối với PRS của Triệu.\n\nMặc dù phần lớn bị chi phối bởi hai Đảng chính, Hồ Nam cũng có ba đảng thứ ba. Đầu tiên là Hiệp hội Tự trị Tương Tây, phần lớn được xây dựng xung quanh Trần Cừ Trân và Thẩm Tùng Văn, và tập trung vào chủ nghĩa đặc thù Tương Tây. Thứ hai là YCP, nhánh Hồ Nam do Tả Thuấn Sinh lãnh đạo, người đã cố gắng giành phiếu bầu từ những người dân tộc chủ nghĩa và bảo thủ bất mãn với Triệu và Trần. Cuối cùng là [UPC_GetDCPPartyName_nocolour] tập trung xung quanh Đường Hóa Long. Mặc dù bị yếu đi do sự ra đi của Đường Hướng Minh, Đường Hóa Long đã quản lý để khắc họa một ngách chính trị của riêng mình ở Hồ Nam bằng cách sử dụng các mối quan hệ cũ và sức hút cá nhân của mình, trở thành đảng thứ ba chính của Tỉnh."
UPC.federalelections.210.a: "PRS của Triệu Hằng Tịch vượt lên trước khi DCP giật ghế từ CDL."
UPC.federalelections.210.b: "Châu Thế Chiêu và CDL về nhất khi YCP ăn lấn vào cánh hữu của Triệu."
UPC.federalelections.210.c: "Đường Hóa Long giành chiến thắng đa số mỏng thông qua các liên minh với Thẩm và Tả."

UPC.federalelections.211.t: "Thách thức đối với Vua Hồ Bắc"
UPC.federalelections.211.d: "Ban đầu là trụ sở của Cuộc khởi nghĩa Vũ Xương, và là điểm kích hoạt của Cuộc khởi nghĩa Tân Hợi, chính trị tỉnh Hồ Bắc đã thấy mình tách rời xa và loại bỏ khỏi thời hoàng kim của nó như là điểm nóng tự phát của một cuộc cách mạng thay đổi quốc gia. Với nhiều người trong Phe Hồ Bắc Cũ bị phân tán vào Nhạc Dương (theo Đường Hướng Minh và Hóa Long), họ phần lớn đã bị giảm xuống sự không liên quan sau khi cài đặt Tiêu Diệu Nam làm Thống đốc.\n\nCưỡi trên tà áo của Vương Trảm Nguyên và sự cai trị thảm họa của ông, Tiêu đã chứng tỏ là một thành viên kiên cường và kiên định của Trực Hệ. Hòa giải các xung đột giữa Ngô Bội Phu và Tào Côn, ông đã trở thành một chốt chặn cốt yếu của sườn phía nam của nó, ngay cả khi đào tẩu ngắn ngủi sau Chiến tranh Trực Phụng lần hai. Dưới sự cai trị của ông, ông đã thi hành các biện pháp phòng ngừa lớn để hợp tác với cả các yếu tố dân sự và quân sự của tỉnh, xây dựng \"Quân đoàn Tổng hợp Hồ Bắc\" với Hà Hán Chương, một tập hợp các cựu chiến binh Khởi nghĩa Vũ Xương. Làm việc với giới sĩ紳, ông hầu như kiểm soát mọi con đường chính trị tỉnh Hồ Bắc đóng cửa hầu hết các diễn viên khác, và thậm chí đưa ra các dạm hỏi cho cả phong trào Liên bang thông qua Triệu Hằng Tịch, và Quốc dân đảng thông qua Tôn Khoa và Uông Tinh Vệ.\n\nThống trị cả các lĩnh vực quân sự và dân sự của chính trị tỉnh, bản chất thất thường của Tiêu, sự mưu đồ của ông, và sự lừa gạt của ông đã trình bày một mặt trận để tấn công ông từ phe đối lập địa phương. Một trong những quân phiệt nổi bật nhất, sự tham gia nhạt nhẽo của ông với Liên minh Đại Cộng hòa đã cung cấp đạn dược cho Đồng minh Dân chủ Trung Hoa đả kích vị trí của họ trong tỉnh.\n\nĐưa ra các ứng cử viên của riêng họ, CDL đã đóng một phần nhỏ trong việc thúc đẩy động lực của các nhà độc lập khác nhau trong một nỗ lực nhằm lật đổ triều đại gần hai thập kỷ của Tiêu trong tỉnh. Dưới một tấm vé chung Thanh niên Đảng Trung Hoa, [UPC_GetDCPPartyName_nocolour_long], và cựu Phe An Huy, họ đã làm cho cuộc đua gần hơn nhiều so với mức nó nên có đối với Tiêu, mặc dù ít người tin rằng họ đặt ra một mối đe dọa thực sự cho Vua Hồ Bắc."
UPC.federalelections.211.a: "Tiêu và Quân đoàn Tổng hợp đóng cửa sự bất mãn."
UPC.federalelections.211.b: "Đả đảo Vua Hồ Bắc!"

UPC.federalelections.212.t: "An Huy và Sự vụ của Hai Phe Phái"
UPC.federalelections.212.d: "Địa điểm của Thảm sát Vu Hồ, và một tỉnh nổi bật của Liên minh Tám Tỉnh, An Huy vừa chứng kiến sự sinh ra của hai Phe phái, vừa là đá tảng của phong trào Chống nhượng địa do Sử Liangcai lãnh đạo. Điều đó không cần phải nói đến vị thế hàng đầu mà Trần \"Kẻ Ngốc\" Điều Nguyên đã nắm giữ trong tỉnh. Mặc dù không nhất thiết là một lực lượng hiện đang đứng vững nữa, một lượng lớn cựu Trực Hệ của ông đã bước ra khỏi xưởng gỗ. Phối hợp với sự hồi sinh của Phe An Khánh là sự trở lại của [UPC_GetDCPPartyName_nocolour_long] và Thanh niên Đảng Trung Hoa lên đầu sóng chính trị. Phần lớn thống nhất với nhiều đồng nghiệp nghiêng về hiện đại hóa của họ trong Phe An Khánh, họ đã tự đặt mình là các ứng cử viên chính quyền trong tỉnh.\n\nTừng là nơi sinh của Đoạn Kỳ Thụy và các môn đồ của ông, Phe An Huy phần lớn đã phân tán trong gió khi thời hoàng kim của họ vào những năm 1910 và 20 phai nhạt vào lịch sử. Tuy nhiên, Phong trào Tự trị Triết Giang phần lớn đã tràn sang chính trị địa phương An Huy, phần nào gắn kết các tỉnh và Phe An Huy lại với nhau. Chử Phụ Thành, lãnh đạo bề ngoài của ZAM, đã phần lớn biến đảng của mình thành nhánh Miền Nam của Diễn đàn Dân chủ và Khoa học, làm việc cùng nhau với Liên minh Đại Cộng hòa đối lập với sự hợp tác của Nhánh Miền Bắc của họ với Đồng minh Dân chức Trung Hoa.\n\nKéo Mã Húc Lun và Hội Xúc tiến Dân chủ Trung Hoa của ông, Đồng minh Dân chủ Trung Hoa đã sử dụng CAPD phối hợp với DSP của Trương Quân Mại và sự vươn ra địa phương của nó để trình bày một mặt trận dân túy. Cùng nhau với Hội Kiến thiết Quốc gia Dân chủ Trung Hoa và Hiệp hội Giáo dục Nghề nghiệp Trung Hoa của Hoàng炎Bồi, họ đã quản lý để kéo Tập đoàn Giang Nam vào liên minh của họ, bên cạnh một vài thành viên của Đảng Công đoàn Trung Hoa và Quốc dân đảng."
UPC.federalelections.212.a: "Sự hồi sinh của Phe An Khánh?"
UPC.federalelections.212.b: "An Huy có thể sống tiếp trong DSF không?"
UPC.federalelections.212.c: "Trước sự ngạc nhiên của tất cả, nước cờ của CDL đã thành công!"

UPC.federalelections.213.t: "Triết Giang và Cuộc chạm trán của những Kẻ Tạo vua"
UPC.federalelections.213.d: "Một phần của trung tâm kinh tế Trung Quốc dọc theo Sông Trường Giang, Triết Giang được cai trị bởi Phe Trực Hệ trong những năm 1930. Thông qua Nội chiến, Triết Giang vẫn là một pháo đài cho trật tự xã hội Trực Hệ Miền Nam, với Chử Phụ Thành lãnh đạo Phong trào Tự trị Triết Giang. Gập tổ chức của mình vào Liên minh Đại Cộng hòa, ông đã thiết lập một khối bầu cử dẫn đầu ở Triết Giang, liên minh với các tàn dư cựu Trực Hệ của cựu Thống đốc Trần Nghi cũng như YCP, những người giữ lại sự hiện diện từ các sĩ quan quân sự địa phương nổi bật.\n\nMột số người trong ZAM đã không chọn đứng về phía GRA, với một số ít lựa chọn mời một số cựu sĩ quan Phe An Huy và Quang Phục Hội tham gia. Cận vệ trẻ của ZAM cũng đã phá vỡ hàng ngũ để đứng về phía DSP của Trương Quân Mại. Ông cũng đã ném chiếc mũ của mình vào cuộc đua ở Triết, với người bạn của Trương Quân Mại là Trương Đông Tôn rất háo hức muốn giành chiến thắng ở tỉnh nhà của mình. Tập đoàn Giang Nam cũng đã xác nhận Trương Quân Mại do những khát vọng công nghiệp hóa chung của họ, cũng như các kết nối tài chính của Trương Đông Tôn.\n\nTrên đỉnh của DSP, CDL cũng có tổ chức Hội Xúc tiến Dân chủ Trung Hoa của Mã Húc Lun hoạt động trong tỉnh. Vượt ra ngoài những nỗ lực của Mã và Trương, Hoàng炎Bồi và Hội Kiến thiết Quốc gia Dân chức Trung Hoa và Hiệp hội Giáo dục Nghề nghiệp Trung Hoa đã dồn nỗ lực đáng kể vào tỉnh. Cùng nhau, CDL hy vọng rằng những nỗ lực của Mã, Hoàng, và Trương sẽ dẫn đến một chiến thắng bầu cử cho họ trong một tỉnh chiến trường then chốt như vậy.\n\nỞ các rìa của dòng chính chính trị nằm Quốc dân đảng, những người vẫn nắm giữ ảnh hưởng đáng kể. Đới Quý Đào, cùng với Tương Tự Cách mạng Đồng chí Hội Triết Giang, được cấu thành từ các thành viên KMT từ tỉnh, và nhiều người cực đoan nhất trong đảng đã gọi Triết Giang là quê hương của họ. Mặc dù bị hầu hết mọi người ghét bỏ, Đới và anh em họ Trần có sự ủng hộ của những kẻ cực đoan địa phương và một số nhà ngân hàng thông qua các kết nối tài chính của Phe CC trong khu vực, và tội phạm có tổ chức cùng tàn dư xã hội chủ nghĩa được đồn đại là đang hợp tác với Đới Xuân Phong."
UPC.federalelections.213.a: "Một chiến thắng cho Liên minh Tiến bộ!"
UPC.federalelections.213.b: "Trần Nghi và Chử Phụ Thành giữ vững đường ranh!"

UPC.federalelections.214.t: "Tàn dư của Phe Phụng Thiên"
UPC.federalelections.214.d: "Trung tâm Đế chế của Đại Soái, tỉnh Phụng Thiên mang theo nó những tội lỗi trong nhiệm kỳ kéo dài nhiều thập kỷ của ông ở Đông Bắc. Với sự thù hằn giữa Phe Trương và các phe phái phụ vây quanh như Thiếu Soái, hoặc Hắc Long Giang, cùng với Phe Sĩ quan thuộc Nhóm Dương Vũ Đình, Quang Phục Hội và tàn dư An Huy của Vương Y Đường, Phe Thông tin của Tào Nhữ Lâm, Hiệp hội Hòa hợp và tất cả các nhóm nhỏ khác trong Phe Phụng Thiên, nó đã thực sự bị chia rẽ bởi sự bãi nhiệm tất cả quyền lực quân sự đã được thiết lập trong tỉnh.\n\nTuy nhiên trong sự trỗi dậy của nó, đó không phải là Liên minh Đại Cộng hòa, hay Đồng minh Dân chủ Trung Hoa đã quản lý để môi giới một mặt trận chính trị, mà là tàn dư của trật tự cũ. Cụ thể, Thanh niên Đảng Trung Hoa đã nhảy vào hành động, sử dụng Trụ sở địa phương của họ trong các học viện quân sự khác nhau (chủ yếu là Giảng võ đường Quân Phụng Thiên) để tăng cường sự phổ biến của họ trong giới cựu binh và Trí thức Miền Bắc. Hợp tác với các cựu quân phiệt Phụng Thiên, Phe Thông tin, và Quang Phục Hội, họ đã quản lý để kết hợp một lượng lớn tính hợp pháp chính trị của Phụng Thiên, chỉ đưa ra các ví dụ mơ hồ cho Liên minh Đại Cộng hòa ở mức tối đa.\n\nVới sự chiếm đóng cuối cùng không ổn định của tỉnh, nhiều nhà quân phiệt bộc trực nhất của quân đội đã chọn duy trì sự chiếm đóng quân sự. Mặc dù trên bề mặt một động thái như vậy đọc như sự tái thiết hiệp sĩ của một khu vực bị chiến tranh tàn phá, nhiều nhà lý tưởng phản đối một thao tác như vậy coi đó như một trò chơi thuần túy để đảm bảo Thanh niên Đảng Trung Hoa và giới cầm quyền Phụng Thiên không bù đắp được tổn thất của họ.\n\nTrong một sự chuyển biến khá kỳ lạ của các sự kiện, một Tướng Phụng Thiên, một người tên là Châu Nhã Vệ, đã tự đặt mình qua một bên để trở thành một cái gì đó của một ứng cử viên ngựa đen. Tái lập Quang Phục Hội thời Tân Hợi với vợ ông Doãn Thụy Chi, mà ông là một thành viên ban đầu, nó mang tính dân tộc chủ nghĩa mơ hồ, cộng hòa, và cuối cùng không liên kết."
UPC.federalelections.214.a: "Liên minh Thanh niên Trung Hoa thống trị tỉnh..."
UPC.federalelections.214.b: "Kéo dài sự chiếm đóng quân sự!"
UPC.federalelections.214.c: "Quang Phục Hội... chiến thắng?"

UPC.federalelections.215.t: "Giang Tây và Tàn dư Cực đoan"
UPC.federalelections.215.d: "Một nửa trung tâm của cuộc nổi dậy xã hội chủ nghĩa lâu đời, Giang Tây chưa bao giờ là một tỉnh đặc biệt thịnh vượng hay ổn định sau khi cuộc Bắc phạt kết thúc. Giang Tây đã chịu đựng và than van trước Cuộc nổi dậy Mẫn Cám, và bất chấp các chiến dịch bao vây, tình hình không bao giờ cải thiện cho đến khi cuộc khởi nghĩa xảy ra. Tuy nhiên với Cộng hòa Liên bang mới, tình hình chính trị đã được trẻ hóa với một làn gió tương đối tươi mới.\n\nDưới thời Thống đốc Trần Quang Bồi, một phong trào tự trị địa phương đã thấy mình kiên định trong Giang Tây. Hy vọng tái thiết tỉnh bị chiến tranh tàn phá, nó đã cố gắng dự thảo Đạo luật Tự trị Tỉnh, và Hiến pháp của riêng mình. Tuy nhiên cuối cùng, Phong trào Tự trị Giang Tây đã bị rạn nứt, và vô lực trước lực lượng quân sự được áp đặt bởi những người như Trần và những người khác. Bị truất quyền sau cuộc Bắc phạt đầu tiên của Tôn Trung Sơn, sự bãi nhiệm của Trần sẽ không thấy Phong trào Tự trị nổi lên nhiều vì \"Cọp Thái\" Trịnh Thành Thuẫn sẽ thấy sự hỗn loạn hơn nữa trong tỉnh. Và sau khi ông bị bãi nhiệm, nhiệm kỳ của Phương Bản仁 sẽ thấy nhiều hạt gom lại cùng nhau với các cuộc bầu cử danh nghĩa, và một cảnh tương tự đã bắt đầu diễn ra.\n\nBị ảnh hưởng bởi sự thành công của Chủ nghĩa Liên bang địa phương ở Hồ Nam và Quảng Đông, các quân phiệt khác nhau của Giang Tây, cùng với giới sĩ紳, đã có những dạm hỏi lớn đối với Liên minh Đại Cộng hòa, và về hiệu quả đã trở thành con ngựa của họ trong cuộc đua.\n\nỞ đầu đối diện nằm Ủy ban Tỉnh Giang Tây của Đồng minh Dân chủ Trung Hoa. Tổ chức đại hội đầu tiên ở Nam Xương, Từ Đức Nguyên, một giáo sư được giáo dục tại Đức kính trọng của Đại học Bắc Kinh, đã được bầu làm chủ tịch. Hợp tác với người bạn của ông, Chu Ngạc, một người tiên phong trong Lâm nghiệp Trung Hoa, chuyên gia về trà, và là thành viên của cả Đảng Công đoàn Trung Hoa và Hội Cứu quốc, bộ đôi đã quản lý để chèo lái các kẻ cực đoan Quốc dân đảng và CSP khác nhau trong việc trình bày một lựa chọn thiên tả chống lại giới cầm quyền và GRA.\n\nCho dù trường hợp có thể là gì, bản chất của Giang Tây sẽ thấy rằng một bên chiến thắng cuối cùng sẽ làm cực đoan hóa bên còn lại."
UPC.federalelections.215.a: "Càng nhiều thứ thay đổi, mọi thứ càng giữ nguyên."
UPC.federalelections.215.b: "Từ Đức Nguyên và CDL Thiên tả đánh trúng điểm nóng!"

#Medium Yield (220-229)

UPC.federalelections.220.t: "Quảng Tây và Lý tưởng Liên bang"
UPC.federalelections.220.d: "Một tỉnh bị tàn phá bởi nạn trộm cướp và sự hỗn loạn kể từ hoàng hôn của nhà Thanh, Quảng Tây đã phản ứng với sự xung đột như vậy bằng số lượng quân sự hóa nặng nề tương đương, và các phe phái khu vực địa phương khác nhau thu hút và dựa vào sức mạnh quân sự đó để bổ sung cho sự thiếu hụt tương đối về giàu có của nó.\n\nKhông chỉ có vậy, Quảng Tây còn là quê hương của tập hợp lớn nhất dân tộc thiểu số Choang, là những người bản địa gốc của tỉnh. Tồn tại từ nhà Đường trở đi cho đến nhà Thanh, người Choang đã thấy sự thăng trầm của họ về mặt quyền lực khu vực và văn hóa quân sự. Với bình minh của những ngày cuối cùng của nhà Thanh, nhiều nông dân người Choang đã tham gia Cách mạng Tân Hợi như một phần của Đồng minh hội và xa hơn nữa trong Quốc dân đảng, bao gồm cả những người như Vi Bạt Quần. Tương tự, họ đã tận hưởng sự bảo vệ địa phương và quyền tự trị, một phần vì các quan chức Quảng Tây Cũ then chốt như Lục Vinh Đình và Đàm Hạo Minh thuộc dân tộc này, và thậm chí Sầm Xuân Huyên và Lục Đạo cũng thuộc dân tộc thiểu số.\n\nMặc dù cả Liên minh Đại Cộng hòa và Đồng minh Dân chức Trung Hoa đều có sự hiện diện lớn do bản chất cốt yếu của Quảng Tây trong lịch sử Liên bang, họ phần lớn phụ thuộc vào các quân phiệt lớn của khu vực. Đảng Công Nghĩa về phần mình, do Lôi Vinh Kha lãnh đạo trong khu vực, và đã nhận được sự ủng hộ từ người Quảng Tây Cũ Lâm Hổ. Ở lối đi đối diện, CDL đã thấy sự bảo trợ từ cựu quân phiệt và thành viên PSC Lưu Zhenhuan, cùng với các trí thức độc lập như Dư Tùng Hổ.\n\nVà bất chấp nhiều năm bị đàn áp, Quốc dân đảng vẫn hoạt động phần nào trong tỉnh hầu như hoàn toàn do sự kiên trì tuyệt đối của Phe Quảng Tây Mới, mặc dù một lượng tượng trưng những người thiên tả dưới thời Vi Bạt Quần và Dư Tác Bách hoạt động địa phương xung quanh Bách Sắc. Kêu gọi những người bị đè nén và tuyệt vọng vì sự thay đổi, họ đã phát triển mạnh mẽ một cách nguy hiểm. Gần như quá mạnh mẽ, với một số người trong chính phủ ra tín hiệu rằng chính phủ nên bước vào để ngăn chặn chủ nghĩa cực đoan lật đổ tỉnh."
UPC.federalelections.220.a: "Sự nhiệt thành từ Quảng Đông tràn qua Quảng Tây!"
UPC.federalelections.220.b: "Lưu Zhenhuan và CDL chiếm lấy tỉnh."
UPC.federalelections.220.c: "Các phiến quân Quốc dân đảng đe dọa sự ổn định bầu cử."

UPC.federalelections.221.t: "Vân Nam và Thanh gươm Liên bang"
UPC.federalelections.221.d: "Những người Cứu rỗi Cộng hòa, và những nhà Vua của miền Tây Nam, Tỉnh Vân Nam đã thường xuyên đấm vượt quá những gì danh xưng địa lý của nó nên cho phép. Miền núi, nghèo đói, và bị tàn phá bởi trộm cướp và thuốc phiện, nó dù sao cũng sở hữu một trong những lực lượng quân sự đáng chú ý và vinh quang nhất của toàn bộ Thời đại Quân phiệt. Quê hương của Phe Vân Nam cùng tên, vốn thực tế đồng nghĩa với phong trào Liên bang của khu vực, nó là một pháo đài của tư tưởng. Phối hợp, một lượng lớn các dân tộc thiểu số thấy mình ở quê nhà Vân Nam, và tất cả đều huyên náo đòi hỏi một giọng nói; người Di, Bạch, Lô Thủy, Cáp Nhì, Mao Nam, Thái, Hồi, Oa, Lạp Hủ, Nạp Tây, Tây Tạng và những người khác. Một số được kết hợp, trong khi những người khác vẫn hài lòng với sự cô lập của họ.\n\nVới các cuộc bầu cử Liên bang được tuyên bố, Vân Nam phần lớn đã trở thành cuộc đua hai chiều giữa Phe Vân Nam và phe đối lập địa phương. Với các lợi ích thương mại địa phương và giới sĩ紳 đóng một vai trò lớn trong chính trị địa phương, họ không phải lúc nào cũng ủng hộ Phe Vân Nam một cách mù quáng, và một số đã tách ra để thương lượng với phe đối lập trong các sự sắp xếp khá kỳ lạ của những người dân túy-nông dân và kẻ áp bức tiềm năng của họ.\n\nGắn liền nặng nề với Phe Vân Nam là Đảng Chính phủ Nhân dân của Đường Kế Nghiêu. Được cảm hứng bởi Phật giáo và Liên bang-bảo thủ, họ kết nối nguồn cảm hứng tư tưởng của họ với Trương Thái炎 huyền thoại. Tương thích với những người Liangist địa phương, họ thậm chí đã quản lý để xoay một số thành viên Thanh niên Đảng Trung Hoa địa phương vào hàng ngũ của họ.\n\nTuy nhiên, do quá khứ của nó trong việc cung cấp sự bảo vệ cho một loạt các trí thức bị Chính phủ Trung ương đàn áp, Phe Vân Nam đã vô tình làm dấy lên phe đối lập của chính mình trong chính trị đảng tỉnh. Trở thành nền tảng của Đồng minh Dân chủ Vân Nam Trung Hoa, La Long Cơ và Nguyệt Tân 社 (Nhánh Thanh Hoa), được tham gia bởi sự lãnh đạo ôn hòa tự trồng từ Tô Hồng Hóa và Thốn Thụ Sinh đã thể hiện một mặt trận dân chủ tả-tự do để chống lại Phe Vân Nam. Mặc dù sự tham gia của họ bởi những cựu xã hội chủ nghĩa đến muộn như Dương Nhất Bối dấy lên nhiều điều đáng mong đợi bởi chính quyền."
UPC.federalelections.221.a: "PGP và các đồng minh chiến thắng, đúng như dự đoán."
UPC.federalelections.221.b: "Đáng kinh ngạc, CDL đánh bại phe đối lập bất chấp mọi khó khăn."

UPC.federalelections.222.t: "Trao lại Sự Giám hộ Cát Lâm"
UPC.federalelections.222.d: "Dưới sự bảo trợ của \"Người Giám hộ Cát Lâm\" Trương Tác Tương, Cát Lâm đã thấy một sự thịnh vượng bùng nổ tương đối trong nhiệm kỳ của ông. Một chiến trường giữa Nga, Nhật Bản và Trung Quốc, nó dù sao cũng sở hữu một trong những khu vực công nghiệp hóa nhất của Trung Quốc. Mặc dù với chính quyền quân sự đặt một rào cản lên mọi thứ, các cuộc bầu cử Liên bang được tuyên bố gần đây đã làm bùng nổ nhiều đồng nghiệp cũ của Tác Tương, các tay sai Phe Phụng Thiên hay những người khác, vào hành động.\n\nNgười Giám hộ, ốm yếu và đã nghỉ hưu, đã trẻ hóa Cát Lâm trong thời gian của mình, và phần lớn được kính trọng trong tỉnh như một anh hùng, và trong Phe Phụng Thiên như một nhân vật trưởng lão trung thành. Cực kỳ phổ biến, Tác Tương đã cải cách chính quyền theo các tuyến thực tài, cắt giảm tham nhũng, tiêu diệt nạn trộm cướp, chỉnh đốn chính sách tài khóa vốn không ổn định và thuế địa phương, và cấm hoàn toàn việc sản xuất, vận chuyển, bán và tiêu thụ thuốc phiện. Sử dụng tài chính bổ sung từ những nỗ lực của mình, ông đã thúc đẩy phúc lợi công cộng và các nỗ lực hạ tầng, và tập trung đầu tư vào giáo dục, thành lập Đại học Tỉnh Cát Lâm, và làm hiệu trưởng cho đến khi nghỉ hưu.\n\nĐằng sau ông là một di sản tỉnh cao quý, khi hai người họ hàng của ông đo lường để trở thành người thừa kế quá khứ hạng nặng chính trị của Tác Tương. Phùng Tầm Hải, cháu trai của Tác Tương, được coi là một ngôi sao đang nổi trong Phe Phụng Thiên. Trẻ trung, mạo hiểm, và yêu nước dữ dội, ông đã trở thành một điểm tập hợp cho các nhà Độc lập khác nhau, và ngay cả Thanh niên Đảng Trung Hoa cũng đã ủng hộ ông một cách nhạt nhẽo, phần lớn để phục vụ như phe đối lập đối với ảnh hưởng của Đảng Công đoàn Trung Hoa.\n\nTrương Đình Shu, con trai và là người thừa kế sinh học của Tác Tương, cũng được coi là một loại ngôi sao đang nổi trong Phe Phụng Thiên. Bạn thân với Thiếu Soái Trương Học Lương từ thời đi học của họ, ông chống Nhật dữ dội, và thông qua các tiếp xúc với Hội Cứu quốc và các tế bào Quốc dân đảng khác nhau trong Đông Bắc, ông đã trở thành một trung tâm kỳ lạ cho chính trị cánh tả ở Đông Bắc, và được hỗ trợ lỏng lẻo bởi CSP."
UPC.federalelections.222.a: "Phùng Tầm Hải và YCP mang lại một bình minh dân chủ mới!"
UPC.federalelections.222.b: "Trương Đình Shu và CSP cung cấp sự thay đổi thực sự!"

UPC.federalelections.223.t: "Phúc Kiến và Con đường tiến tới Chủ nghĩa Liên bang"
UPC.federalelections.223.d: "Một trong những tỉnh ven biển tự hào và hàng đầu nhất của Trung Quốc, Phúc Kiến đã thấy một lượng lớn xung đột và hỗn loạn trong Thời đại Quân phiệt. Bị nhốt bởi một nội địa miền núi là một văn hóa ven biển phát triển mạnh mẽ, và là người khởi xướng hầu hết các hậu duệ Trung Hoa Hải ngoại, tất cả đều xoay quanh thành phố ven biển lớn Phúc Châu — bị chiếm bởi các Đoàn nhượng địa — và truyền thống hải quân của nó.\n\nChính Phúc Kiến đã không đặc biệt tách rời khỏi Phong trào Liên bang, như vào và xung quanh đầu những năm 1920 Việt Quân đã chiếm đóng khu vực cùng với Quốc dân đảng và các nhóm cách mạng khác, tham gia vào các cải cách chịu ảnh hưởng vô chính phủ khác nhau để giằng xé nhưng thành công phổ biến. Năm 1922, Hội đồng Tỉnh Phúc Kiến đã phát ra một điện văn tuyên bố việc dự thảo hiến pháp tỉnh, và năm 1925 đã thực thi một hiến pháp như vậy, tuy nhiên với sự bác bỏ của Đoạn Kỳ Thụy, Châu Mãnh Nhân, và Tát Trấn Băng đối với các nỗ lực tỉnh, phong trào Liên bang đã bị tuyên bố là thất bại và hội đồng đã bị giải tán vào năm 1926.\n\nVới một chính quyền chiếm đóng nặng nề và thực chất được thực thi, Liên minh Đại Cộng hòa đã bắt đầu kết hợp một số thành viên cũ của Phong trào Hiến pháp Tỉnh Phúc Kiến, và tương tự như vậy bộ máy quan liêu cựu Trực Hệ của Châu Âm Nhân. Đồng minh Dân chủ Trung Hoa về phần mình đã hình thành ủy ban Tỉnh Phúc Kiến của họ với Lâm Chí Phú khá gây tranh cãi làm Chủ tịch của nó.\n\nCựu Quốc dân đảng trong liên kết, Lâm đã phục vụ trong Tân Tứ Quân cho đến khi những người theo Chủ nghĩa Liên bang di chuyển sang Bắc Kinh. Tham gia Đồng minh Dân chủ Trung Hoa, ông được coi là một cốt lõi của cánh cực tả của nhóm. Do bản chất của Phúc Kiến là một trong những khu vực cốt lõi của Cuộc nổi dậy Mẫn Cám, nó bị nhiễm các kẻ cố thủ và người cảm thông LKMT, với nhiều người trong số họ tiếp tục chiến đấu, tuy nhiên Lâm đã quản lý để kéo nhiều người trong số họ để chống đỡ cơ sở ủng hộ của ông trong khu vực. Một số người nói rằng họ tham gia CDL, những người khác nói rằng họ đang \"thâm nhập\" vào nó."
UPC.federalelections.223.a: "GRA và những người Bảo thủ ngăn ngừa sự mất trật tự."
UPC.federalelections.223.b: "Giấc mơ của Tôn Trung Sơn sống tiếp trong CDL!"

UPC.federalelections.224.t: "Sơn Tây: Tỉnh Kiểu mẫu"
UPC.federalelections.224.d: "Phục vụ hiệu quả như Thống đốc kể từ năm 1911, Diêm Tích Sơn đã kiểm soát Sơn Tây trong hơn 25 năm trước khi Trực Hệ sụp đổ, với tất cả chính trị tập trung xung quanh \"Thống đốc Kiểu mẫu\". Rất nhiều thứ chắc chắn đã thay đổi kể từ đó, với các dự án tỉnh lớn của ông cùng với tư tưởng đa chiều và thực dụng. Kiểm soát bộ máy quan liêu, quân đội, và với một mối quan hệ bật-tắt lại với giới sĩ紳 và tầng lớp thương nhân, \"Phe Tấn\" của Diêm dường như quan trọng nhất trong Sơn Tây.\n\nVới sự tuyên ngôn của một Cộng hòa Liên bang mới, tàn dư của Phe Tấn đã tái tổ chức thành cái được gọi là Câu lạc bộ Tân Tân Hợi. Nó sở hữu các cựu quân nhân trung thành, những người tham gia Hội Tẩy tâm Tân Nho gia của Diêm, và Liên minh Hy sinh mang tính dân tộc chủ nghĩa của ông. Thanh niên Đảng Trung Hoa, vốn có các nhánh nhỏ ở Sơn Tây dưới sự bảo trợ trực tiếp của Tấn, cũng đã phình to với việc giới sĩ紳 tham gia vào làn sóng. Mặc dù tất cả các điều kiện này sẽ phần lớn thiết lập Câu lạc bộ Tân Hợi chiến thắng trắng trợn, họ đã chịu đựng nhiều kẻ đào tẩu lớn do Lương Hóa Chi đảm nhận chiếc áo lãnh đạo, người mà nhiều người coi chỉ là một con rối cho người chú của mình, Diêm.\n\nNhững kẻ đào tẩu then chốt từ Phe Tấn bao gồm Thương Zhen, luôn là một loại người ngoại lệ và người cảm thông cách mạng trong hàng ngũ của Tấn, ông đã tham gia Liên minh Đại Cộng hòa, đứng ở Sơn Tây như ứng cử viên của họ. Thu hút các lợi ích thương mại, gắn liền với Bắc Kinh và do đó với chính phủ trung ương, cùng với các nhà hòa giải chính trị khác.\n\nCố gắng làm xáo trộn trạng thái nguyên trạng là Đồng minh Dân chủ Trung Hoa. Với Đảng Dân chủ Xã hội của Trương Quân Mại được kích hoạt để thiết lập các đầu ra dưới thời Diêm, cơ bắp thực sự đằng sau hoạt động địa phương là Hiệp hội Sinh viên Sơn Tây. Tràn ngập những người tự do, tiến bộ và xã hội chủ nghĩa, Triệu Phi Luyện, một kẻ đào tẩu Phe Tấn khác và cựu hiệu trưởng của Trường Sư phạm Nhân dân ở Thái Nguyên, đã trở thành lãnh đạo của họ — sở hữu các kết nối đủ tốt với giới cầm quyền để có cơ hội chiến thắng."
UPC.federalelections.224.a: "Lương Hóa Chi và Tàn dư Tấn là một kết luận đã rồi."
UPC.federalelections.224.b: "Thương Zhen mang lại cho GRA một chiến thắng vững chắc."
UPC.federalelections.224.c: "Triệu Phi Luyện mang lại cho CDL một chiến thắng lật kèo."

UPC.federalelections.225.t: "Thù hằn Gia tộc của Quý Châu"
UPC.federalelections.225.d: "Quý Châu từ lâu đã bị xé rách giữa động lực chính trị của miền Tây Nam, mặc dù thường xuyên hơn không bị xiềng xích vào các sự vụ của Quảng Tây, Tứ Xuyên, Hồ Nam, hoặc cấp bách nhất là Vân Nam. Trong Cách mạng Tân Hợi, nó bị chi phối bởi hai phe phái chính trị — Hội Chuẩn bị Hiến chính cải cách và Hội Nghiên cứu Tự trị cách mạng — và với cuộc xâm lược Quý Châu bởi Đường Kế Nghiêu (theo lệnh của Thái Ngạc), những người Hiến chính được ưu ái, phục vụ như căn cứ cho sự trang điểm chính trị ngày nay của Quý Châu.\n\nĐã từ lâu cố thủ trong Quý Châu, Gia tộc Lưu đã quản lý để đảm bảo vai trò của họ như những \"người bảo vệ\" của Quý Châu trong suốt sự khởi đầu của Thời đại Quân phiệt, tước vũ khí của những người Hiến chính, và xây dựng hiệu quả một liên minh sĩ紳-thương nhân-bảo thủ trong tỉnh. Được gọi một cách hiệu quả là Phe Hưng Nghĩa (Cũ), họ sẽ bị truất quyền do Sự cố Mẫn Cửu, nơi Vương Văn Hóa, Lục Đạo, Hà Ứng Khâm và Cố Chính Lun (trong số những người khác) đã cố gắng đảo chính Lưu顕世. Bị ám sát bởi Viên Tổ Minh theo lệnh của Lưu, cái chết của Vương sẽ cho phép kẻ ám sát ông nổi lên trong Phe Hưng Nghĩa Mới, sau đó phản bội Gia tộc Lưu trong những năm 1920.\n\nVới Liên minh Đại Cộng hòa bị chi phối bởi Phe Hưng Nghĩa Cũ dưới thời Lưu顕Chiêm cổ xưa, ông đã bị phản đối triệt để bởi Phe Hưng Nghĩa Mới dưới thời Viên, người đã nuôi dưỡng Thanh niên Đảng Quý Châu Trung Hoa địa phương để hoạt động như cơ quan tư tưởng của mình. Đồng minh Dân chủ Trung Hoa về phần mình đã hoàn toàn vật lộn để tìm kiếm các đồng minh sẵn lòng, và khá nguy hiểm đã quăng lô của họ với Phe Đồng Nhân của Châu Tây Thành. Một người cực kỳ linh hoạt, Châu thậm chí đã bắt đầu sử dụng tàn dư của Hội Nghiên cứu Tự trị của chính phủ RKMT cũ để duy trì giá thầu của mình cho quyền lực.\n\nNgoài ra, Nhậm Khắc Trừng, người cuối cùng của những người Hiến chính Cũ, được đồn đại là đang đàm phán với Châu để tham gia liên minh rộng lớn của ông, hy vọng đảm bảo một chiến thắng cuối cùng trong sự nghiệp trung bình của mình."
UPC.federalelections.225.a: "Phe Hưng Nghĩa Cũ đòi lại sự lãnh đạo của Quý Châu."
UPC.federalelections.225.b: "Phe Hưng Nghĩa Mới khẳng định sự thống trị của họ."
UPC.federalelections.225.c: "Phe Đồng Nhân tập hợp một liên minh biệt lập cho sự thay đổi."

#Low Yield (230-239)

UPC.federalelections.230.t: "Thiểm Tây: Thái ấp của Phe Chính trị Học"
UPC.federalelections.230.d: "Tỉnh Thiểm Tây giữ lại một trong những lịch sử giàu có nhất trong toàn bộ Trung Quốc. Quê hương của Tây An, nó được coi là một trong những nôi của văn minh Trung Hoa, với mười ba triều đại phong kiến thiết lập thủ đô của họ trong tỉnh từ triều đại nhà Chu đến triều đại nhà Đường. Mặc dù vì tầm quan trọng lịch sử của nó, nó vẫn khá nghèo như là bản chất của hầu hết các tỉnh nội địa kể từ cuối nhà Thanh.\n\nKể từ sự thống nhất của Trực Hệ trong những năm 1920, nó đã bị chia hiệu quả thành hai vùng ảnh hưởng. Miền Nam, và thủ đô Tây An, đã được cai trị bởi Thống đốc liên kết Trực Hệ rụt rè Lưu Trấn Hóa. Một thành viên của Phe Chính trị Học, ông là người giữ văn phòng cao nhất của họ trong chính trị quốc gia. Miền Bắc được cai trị bởi Phùng Ngọc Tường và Quốc dân quân biệt lập của ông, tập hợp lại cùng nhau trong một sự sắp xếp tuyệt vọng với Diêm Tích Sơn của Sơn Tây.\n\nChủ nghĩa Liên bang chính nó đã có một thời gian ngắn trong tỉnh, với thành viên Phe An Huy Trần Thụ Phiên của Thiểm Tây phản ứng với đề xuất của thành viên An Huy đồng nghiệp Lục Vĩnh Tường để sử dụng biểu ngữ của \"quản trị thống nhất\" để chiến đấu chống lại Chính phủ Bắc Dương. Bị đánh bại bởi Phùng Ngọc Tường vào năm 1921, và với quân đội của ông bị tiêu diệt hoàn toàn, ông đã nghỉ hưu khỏi chính trị, và tập trung vào Phật giáo. Mặc dù không rất có liên quan, ông đã đưa ra một sự xác nhận tượng trưng cho Liên minh Đại Cộng hòa ở Thiểm Tây.\n\nNhánh Đồng minh Dân chủ Trung Hoa địa phương đã được hình thành từ các chi nhánh Quốc dân quân và Quốc dân đảng cũ, bao gồm một trong những \"Linh mục Đỏ\" của Phùng Ngọc Tường, Dư Tân Thanh. Hấp thụ các người cảm thông thiên tả khác nhau vào hàng ngũ của họ, họ đã bắt đầu kéo vào chủ nghĩa dân túy và chủ nghĩa nông nghiệp để giành phiếu bầu.\n\nTừng là diễn viên hàng đầu nhất trong tỉnh, Lưu Trấn Hóa đã không phải là người ngồi xuống nhàn rỗi. Ngay cả khi Trấn Tùng Quân của ông đã bị tiêu diệt, ông đã quản lý để tích lũy đủ vốn chính trị — với sự trợ giúp từ [UPC_GetDCPPartyName_nocolour] — để hầu như đóng cửa nhiều phe đối lập chính trị, và đã tập hợp PSC để giữ lại Tỉnh của họ"
UPC.federalelections.230.a: "PSC đòn bẩy các mối quan hệ của họ để đảm bảo Thiểm Tây."
UPC.federalelections.230.b: "Những người theo Chủ nghĩa Liên bang của Thiểm Tây đoàn tụ cho một khởi đầu mới."
UPC.federalelections.230.c: "Phe tả của Thiểm Tây kết hợp thành một liên minh hoạt động."

UPC.federalelections.231.t: "Dân chủ ở Tây Bắc?"
UPC.federalelections.231.d: "Tây Bắc, biểu thị Tây Bắc Trung Quốc, phần lớn đại diện cho ba tỉnh Thanh Hải, Ninh Hạ và Cam Túc, trong đó Thanh Hải và Ninh Hạ là một số tỉnh mới hơn trong quốc gia. Từ lâu bị chi phối bởi Phe Mã, một tập hợp các Quân phiệt người Hồi, họ thực sự là ba gia đình trong lịch sử nhưng do các mối thù và động lực khác phần lớn đã kết hợp thành Phe Mã Thanh Hải, Phe Mã Ninh Hạ, và Phe Mã Cam Túc. Mặc dù khá mang tính khu vực, họ vẫn kiên định là người Trung Quốc và thường xuyên tham gia vào chính trị quốc gia trong một vai trò phụ trợ, chẳng hạn như thời gian của họ với Quốc dân quân.\n\nBản thân Tây Bắc là một khu vực đầy sự đa dạng về dân tộc, văn hóa và tôn giáo, và kết quả là, sự căng thẳng. Quê hương của người Tây Tạng, Hồi, Hán và Mông Cổ, chính trị của nó ít mang tính tư tưởng hơn nhiều và mang tính cá nhân, dân tộc, hoặc tôn giáo nhiều hơn. Truyền bá Hồi giáo Y Tề Hòa Ni, Mã coi đó là một sự giải thích ôn hòa và yêu nước hơn, và đã thường xuyên đàn áp Tái La Phùng Dã và các Giáo phái Hồi giáo khác bị coi là ly khai, đặc biệt là những giáo phái gắn liền với người Duy Ngô Nhĩ ở Tân Cương. Một sự đối xử tương tự có thể được chứng kiến cho người Tây Tạng và Mông Cổ ở Thanh Hải, mặc dù trong Liên minh Alxa, Mã Hồng Binh đã thể hiện một bàn tay khá nhẹ nhàng.\n\nVới các chuyến thăm bất ngờ tới Lan Châu, các ứng cử viên dẫn đầu đã mang lại sự chú ý đổi mới cho khu vực khá hẻo lánh, nhưng như vậy Tây Bắc hoàn toàn thiếu bất kỳ loại cơ sở tư tưởng xã hội chủ nghĩa hay tự do nào. FCDP trong quá khứ đã có thể thiết lập một vài nhóm trí thức nhỏ như Nhóm Chính trị Dân chủ Tây Bắc và Hiệp hội Thúc đẩy Dân chủ Chống Đế quốc Thanh niên Tây Bắc, nhưng nhiều người tin rằng họ là những nỗ lực thất bại.\n\nCuối cùng, với việc Tây Bắc phần lớn giữ lại cuộc sống bị mất kết nối và bộ lạc của nó, những bông hoa dân chủ có thể mất thời gian để nở rộ. Một số người đã ủng hộ chỉ cần làm việc với các trưởng lão địa phương để đảm bảo sự tuân thủ và phục tùng, nhưng những nhà lý tưởng khác đã khăng khăng đòi đặt nền móng cho một sự thiết lập dân chủ trong tương lai."
UPC.federalelections.231.a: "Các ứng cử viên tập trung vào việc đảm bảo sự hợp tác tiếp tục của các lãnh đạo người Hồi."
UPC.federalelections.231.b: "Các ứng cử viên cố gắng xây dựng cơ sở hạ tầng đảng cho tương lai."

UPC.federalelections.232.t: "Chủ nghĩa Dân tộc Nội Mông và Dự án Liên bang"
UPC.federalelections.232.d: "Nội Mông đã thấy cuộc xung đột đáng kể trong thời đại quân phiệt. Bị dằn xé giữa bản sắc Trung Hoa và Mông Cổ, cách mạng và truyền thống, Chủ nghĩa Liên bang là một kẻ đến muộn đối với thảo nguyên chăn nuôi bị chia rẽ.\n\nỞ phía tây, KMT là đảng đầu tiên hình thành một đảng chính trị có tổ chức. Bạch Vân Đễ, một trong những người được Hoàng tử Cống bảo hộ và là một thành viên KMT, đã liên minh với Đảng Dân tộc Chủ nghĩa Mông Cổ để hình thành Đảng Dân tộc Chủ nghĩa Nội Mông ở Khalgan để thống nhất các nhà cách mạng Nội Mông khác nhau. Nhưng IMNP sau đó sẽ chia thành ba: \"Ủy ban Điều hành\" của người Kharachin Bạch, \"Mới\" của người Đạt Oát Nhĩ Phù Minh Thái, \"Thanh niên\" của người Thổ Mặc Đặc Ô Lan Phủ.\n\nỞ phía bên kia của lối đi (nhưng thường chia sẻ thành viên với phe Ủy ban Điều hành) là \"Những người Mông Cổ Trẻ\" của Hoàng tử Đức. Liên minh chiết trung của các nhà dân tộc chủ nghĩa, sinh viên, quý tộc, và nhà cách mạng Mông Cổ đã chuyển giao từ một triển vọng bảo thủ sang một triển vọng tương đối đa nguyên. Với Thạch Quốc Anh (một trong những người được Đức bảo hộ gần gũi) dẫn đầu cuộc tranh chấp cho sự tham gia của họ vào chính trị Liên bang dưới Liên minh Thanh niên Mông Cổ tiến bộ của ông. MYA, YM, và IMNP(SC) đã tìm cách hình thành một liên minh toàn tư tưởng. Tìm kiếm sự không khuất phục mình cho CDL hay GRA, liên minh đã từ chối hợp tác với cả hai đảng, đứng về quyền tự trị và chủ nghĩa dân tộc Mông Cổ là trên hết.\n\nVề phần mình, người thừa kế chính trị của Hoàng tử Cống, Ngô Hạc Ling, đã đứng cô đơn với Nhóm Củng cố và Tái thiết Mông Cổ của ông, gợi ý sự cởi mở của ông để làm việc với cả CDL và GRA.\n\nTrong khi đó Phe Tự trị Đông Nội Mông đã tập hợp dưới thời Bố Hòa Mạn Đô Hô, Mã Ni Ba Đạt Lạp, Hạp Phong Ngạch, và Á Cáp. Có ảnh hưởng nhất trong các khu vực Mông Cổ trước đây thuộc Phe Phụng Thiên, họ đã dẫn dắt một nỗ lực cải cách do Triết Lý Mộc-Khát La Thấm chi phối ngay cả dưới sự bảo trợ của Kỳ Mộc Đức Sơn Bì Lặc, Lãnh đạo Liên minh Triết Lý Mộc. Cảm thông với các nỗ lực tiến bộ, họ đã phản đối rộng rãi hệ thống phong kiến của Mông Cổ, thương lượng với GRA."
UPC.federalelections.232.a: "IMNP Thiên tả làm mất ổn định khu vực."
UPC.federalelections.232.b: "Mông Cổ chỉ có thể tồn tại dưới liên minh MYA-YM-IMNP(SC)!"
UPC.federalelections.232.c: "Ngô Hạc Ling và MCRG đạt được một sự thỏa hiệp không hạnh phúc."
UPC.federalelections.232.e: "Liên minh EIMAC-GRA mang lại hy vọng cho tương lai!"

UPC.federalelections.233.t: "Hắc Long Giang: Biên giới Băng giá"
UPC.federalelections.233.d: "At the edges of China's Northeastern Frontier, Heilongjiang is an icy and inhospitable land that only a few call home. During the Warlord Era, Heilongjiang was under Zhang Zuolin's Fengtian Clique which had its homeland based in the Three Northeastern Provinces. Zhang sent his old friend Wu Junsheng to rule Heilongjiang as governor, who brought Wan Fulin and Ma Zhanshan as his deputies. Wu was largely uninterested in ruling, and left the job to his two subordinates.\n\nWith the fall of the Fengtian Clique and unification of China undertaken by [ROOT.GetLeader] and the Federalists, the ex-Fengtian administration has largely remained intact, with the Federal Government still attempting to consolidate all of China proper and reel in former warlord administrations. The Heilongjiang provincial government has largely sympathised with the Recovery and Communications Cliques composed of ex-Anhui Clique parliamentarians and officers.\n\nThe local military garrison, who continue to suppress local socialist guerrillas, have indicated their preference for strong centralisation efforts across the Republic, with some being particularly fond of the YCP. Heilongjiang is also home to a sizable number of White Russian Emigrés, who fled due to the Russian Civil War and the Savinkov regime, and had extensive ties with the Fengtian establishment, thus increasing the hold of the Recovery League.\n\nThe GRA of [ROOT.GetLeader] has only a small connection to Duan Qirui and the Recovery League, but it is hoped that their partnership will be electorally fruitful. Separate from the titans of Heilongjiang politics, General Zhou Yawei and his wife Yin Ruizhi have established a minor party of their own, the rebuilt Restoration Society. Initially a Tongmenghui splinter, the Restoration Society is now a vaguely republican and nationalistic party centred around Zhou himself, and unaffiliated with either the GRA or CDL."
UPC.federalelections.233.a: "Trật tự Cũ vẫn nguyên vẹn."
UPC.federalelections.233.b: "Một chiến thắng cho những kẻ mới phất!"

UPC.federalelections.234.t: "Các cuộc Đấu chính trị và Tương lai của Đài Loan"
UPC.federalelections.234.d: "Bị Nhật Bản chiếm đóng kể từ khi kết thúc Chiến tranh Trung-Nhật lần thứ nhất, Đài Loan đã thấy một thời kỳ chia rẽ kéo dài khỏi đất liền Trung Quốc, tuy nhiên một thời kỳ như vậy đã đầy sự kháng cự. Một loạt các phong trào yêu cầu Đài Loan gia nhập lại Trung Quốc, hoặc nếu không nhận được quyền tự trị tại nhà đã mọc lên, cuối cùng thể hiện trong sự thành lập Hiệp hội Văn hóa Đài Loan do Lâm Hiến Tường và Tưởng Vị Thủy lãnh đạo. Tiến bộ trong triển vọng, nó dần dần cực đoan hóa dẫn đến sự giải tán của nó sau các vụ bắt giữ thành viên của Nhật Bản.\n\nVới Đảng Nhân dân Đài Loan gắn liền với Quốc dân đảng được thành lập bởi Tưởng trong bước ngoặt dịch sang tả của ông, những người bảo thủ trong TWA đã rời đi để thành lập Liên minh Tự trị Đài Loan dưới thời Lâm Hiến Tường, một người ngưỡng mộ Lương Khải Siêu. Về bản chất, sao chép cuộc đấu tranh của đất liền giữa cách mạng và chủ nghĩa cải cách.\n\nTrong thời đại mới, TPP đã vật lộn để tìm kiếm vị thế của mình do sự cực đoan chính trị và chủ nghĩa chuyên chế của Tưởng xung đột với nhiều người ôn hòa như Thái Peihuo, những người đã đe dọa đào tẩu. Sự hợp tác của họ với Đảng Công đoàn Đài Loan bị ngoài lề cũng đã bị nghi ngờ, khi bị đàn áp bởi các chính quyền chính trị Trung Quốc kể từ khi họ đến hòn đảo.\n\nTrong khi đó, nhiều người trong giới sĩ紳 cũ và các giới tinh hoa khác của hòn đảo, những người đã hợp tác với sự chiếm đóng của Nhật Bản, đã cố gắng quay sang làm việc với chế độ Trung Quốc mới, với các kết quả khác nhau — nhận thức về TAHR như không yêu nước đã phần lớn làm tổn hại đến danh tiếng của nó với các chính quyền chiếm đóng.\n\nĐóng vai trò kẻ phá bĩnh như một đảng thứ ba bên cạnh hai đảng lớn trên hòn đảo, Hiệp hội Đồng chí Quang phục Đài Loan, do hai anh em Liao Wenkui và Liao Wenyi lãnh đạo, đã lao vào hiện trường. Bao gồm các nhà kỹ trị và trí thức được giáo dục ở Phương Tây, đó là một phong trào nói chung tự do, tìm cách tranh thủ cả GRA và CDL cùng một lúc, mặc dù đã có một sự giải thích Tân Nho gia hơn trong các cuộc tranh luận Trương Quân Mại-Hồ Thích về chủ nghĩa sinh khí và chủ nghĩa thực dụng."
UPC.federalelections.234.a: "TPP và phe tả chiến thắng trong các cuộc bầu cử!"
UPC.federalelections.234.b: "TAHR đánh bại các cáo buộc và chiến thắng!"
UPC.federalelections.234.c: "TRCA cưỡi trên sóng tự do đến chiến thắng!"
UPC.federalelections.234.e: "Chính quyền chiếm đóng đất liền tiếp tục áp đặt các cuộc bầu cử."

UPC.federalelections.235.t: "Thượng Hải: Điểm nóng Đô thị của Trung Quốc"
UPC.federalelections.235.d: "Paris của Phương Đông, Thượng Hải có lẽ là thành phố Trung Quốc đáng xứng đáng nhất để nhận danh hiệu đó. Lớn nhất và thịnh vượng nhất, nó được cho là một thực thể chính trị lớn đến mức nó bảo đảm sự đối xử đặc biệt của riêng mình, khác với phần còn lại của tỉnh Giang Tô. Sự đòi lại của Trung Quốc đối với các Thành phố Nhượng địa là một chiến thắng lớn cho [UPC.GetName], cuối cùng đưa Thế kỷ Tủm mủm đến hồi kết, và thống nhất đất nước trong một khoảnh khắc thống nhất quốc gia vĩnh cửu. Nhưng dĩ nhiên, chính trị phải tiếp tục.\n\nThượng Hải đương nhiên cũng đã là nơi diễn ra các phong trào lao động Trung Hoa lớn bất chấp sự trấn áp dã man của Cuộc khởi nghĩa Thượng Hải năm 1932. Nó đương nhiên cũng tràn ngập các mối quan hệ với Tam Hoàng, những người thường xuyên cho mượn mình cho chủ nghĩa cộng hòa cách mạng và chủ nghĩa dân tộc — làm mờ ranh giới giữa Tam Hoàng và Nhà Cách mạng. Ngoài KMT, CSP, CDL, và GRA, nhiều đảng nhỏ hơn đã xuất hiện.\n\nAn Ruoding, biên tập viên của Tạp chí Cô Tinh và là người sáng lập Cô Tinh 社 là một người ủng hộ \"tinh thần hiệp sĩ lớn\", sử dụng sự tự hoàn thiện như một công cụ cho sự giải phóng giai cấp, thực thi Chủ nghĩa Tam Dân, và đạt được Đại Đồng. Sử dụng Học hội Tạo Tinh thần của mình, ông hy vọng kết thúc sự cai trị của Trực Hệ, sử dụng Chủ nghĩa Dân túy Quốc gia Châu Âu để củng cố kỷ luật và sự thống nhất nội bộ. Mặc dù vậy, ông có các mối quan hệ với cả phe hữu và phe tả của KMT.\n\nBang Xanh đã tài trợ cho sự gia tăng của Châu Tuyết Phong thông qua các công đoàn bưu điện, dẫn đến Hội Quyết định. Mặc dù có các cáo buộc về chủ nghĩa công đoàn vàng, ông đã trở thành một nhà tổ chức lao động nổi tiếng và đã thành lập Đảng Lao động Trung Hoa. Bất chấp CSP và quá khứ tội phạm của mình, ông đã ngạc nhiên quay sang CDL. Về phần mình, anh em họ Trương đã sử dụng các kết nối tinh hoa của họ để kéo phiếu bầu cho CDL.\n\nGRA đã sử dụng Diễn đàn Dân chủ và Khoa học của Chử Phụ Thành để vượt qua khu vực Giang Nam, được tham gia bởi nhiều trí thức khác ở Thượng Hải, những người đã đứng về phía PIP và PGP."
UPC.federalelections.235.a: "Phe tả cực đoan đưa ra một sự khiển trách cay đắng đối với chính phủ mới."
UPC.federalelections.235.b: "CDL tập hợp một liên minh tự do-lao động trung dung để quét sạch các cuộc bầu cử!"
UPC.federalelections.235.c: "GRA thống nhất những người theo chủ nghĩa liên bang và trí thức giữa những nỗi sợ bảo thủ."

#Fringe Yield (240-249)

UPC.federalelections.240.t: "Rút dao ở Tân Cương"
UPC.federalelections.240.d: "Tân Cương là một tỉnh xa xôi khỏi các trung tâm quyền lực Trung Quốc ở Đồng bằng Trung nguyên, nhưng [ROOT.GetLeader] dù sao cũng đã chọn dành một chiến pháp đáng kể trong khu vực. Truyền thông đưa tin về cuộc bầu cử đã đầu cơ rằng ý định thực sự của cuộc bầu cử là để ăn mừng sự khôi phục quyền lực Trung Quốc của Cộng hòa từ Đông sang Tây, và rằng sự chú ý gia tăng đã thúc đẩy phe đối lập gửi những người vận động đến Địch Hóa, buộc tay của [ROOT.GetLeader]. Nói rằng chiến dịch bầu cử đã không diễn ra suôn sẻ sẽ là một sự nói giảm, với việc Tổng thống suýt bị bắn bởi các phiến quân địa phương.\n\nNếu [ROOT.GetLeader] có ý định làm nổi bật quyền lực được خôi phục ở Địch Hóa, thông điệp chính dường như đã được thúc đẩy là nhiều phần của Tân Cương vẫn biến động và sự ổn định thực sự trốn tránh tỉnh bất chấp những nỗ lực tốt nhất của chính quyền quân sự tỉnh tạm thời. Căng thẳng dân tộc cũng không được làm dịu, vì người Duy Ngô Nhĩ và Kumullik bản địa vẫn hoài nghi đối với sự thống trị của người Hán trong Chính quyền Địa phương và Trung ương. Tuy nhiên, đã có một số lượng chấn động các lãnh đạo địa phương sẵn lòng làm việc với chính phủ. Yulbars Khan, Đại Chưởng ấn cuối cùng của Hãn quốc Kumul, đã làm hòa với chính phủ trung ương và đã bày tỏ sự hợp tác của mình.\n\nMã Tư Ngũ Đức Sa Bố Lý và Y Tát Á Nhĩ Phù Đề Kim, những người từng tham gia Cộng hòa Đông Turkestan cũng là các lãnh đạo Duy Ngô Nhĩ bảo thủ ôn hòa sẵn lòng hợp tác với sự cai trị của Trung Quốc trong khi tìm kiếm quyền tự trị. Bao Nhĩ Hán Sa Hi Đế, nhìn chung được coi là một người cảm thông KMT nhưng linh hoạt trong lòng trung thành của mình, cũng đã hứa sự sẵn lòng hợp tác của mình với Chính phủ Liên bang. Tuy nhiên, các lãnh đạo Duy Ngô Nhĩ cực đoan hơn của Cộng hòa Đông Turkestan cũ - cho dù do tính chất dân tộc chủ nghĩa, xã hội chủ nghĩa, Hồi giáo chủ nghĩa, hoặc một số sự kết hợp ở giữa - đã từ chối các lời kêu gọi tham gia bầu cử, thề sẽ tiếp tục cuộc đấu tranh bạo lực để đảm bảo sự độc lập hoàn toàn."
UPC.federalelections.240.a: "Những kẻ Hợp tác hình thành một liên minh hoạt động!"
UPC.federalelections.240.b: "Sự sợ hãi sẽ giữ các hệ thống địa phương theo hàng lối."

UPC.federalelections.241.t: "Tương lai của Tăng đoàn Tây Tạng"
UPC.federalelections.241.d: "Tây Tạng, rất giống Ngoại Mông Cổ, đã là một khu vực bị chi phối bởi Tăng đoàn Phật giáo trong nhiều thế kỷ. Dưới quyền lực cận-chuyên chế của các nhiếp chính và các lạt ma quyền lực, ngay cả Đạt Lai Lạt Ma cũng đã bị ám sát, hoặc nếu không bị khuất phục trước những sự tùy hứng của Giáo hội. Với các tu viện và quý tộc kiểm soát nhiều của cải vật chất, người dân bình thường hoàn toàn thiếu hụt một số hình thức đại diện phổ biến — với nhiều người thậm chí là nô lệ giao kèo cho các tu viện.\n\nTuy nhiên, không phải tất cả đều tăm tối. Khi sự tiến bộ của thời đại hiện đại chạm tới Cao nguyên Tây Tạng, khoảng thời gian các phe cải cách chiến thắng trong cuộc đấu tranh quyền lực Tây Tạng những năm 1920 đã thấy sự hiện đại hóa sâu rộng trên cao nguyên. Với sự thành công của họ và các sự phát triển xa hơn, các tổ chức như Đảng Cải tiến Tây Tạng, và Nhóm Kyicho Kuntun sẽ được thiết lập.\n\nMột đảng lấy cảm hứng từ Đại hội Dân tộc Ấn Độ, và được thành lập bởi những người như Pandatsang Rapga, Thubten Kunoheka, và Solang Gyalpo, Đảng Cải tiến Tây Tạng danh nghĩa tuân thủ chủ nghĩa xã hội được ủng hộ bởi Azad Hind, vì đa số hàng ngũ của họ đã học tập ở Calcutta. Nói chung được coi là có phần thân Trung Hoa tuy nhiên, họ đã phản đối Đạt Lai Lạt Ma một cách dữ dội, và chứa một cánh cực đoan do Rapga lãnh đạo.\n\nKyicho Kuntun là một nhóm khá bí ẩn được quan niệm là đã được thiết lập bởi Tsipon Lungshar. Hoặc ít nhất, đó là những gì kẻ thù của ông muốn bạn tin. Dù sao đi nữa, Lungshar sở hữu một chút sự ủng hộ chính trị, và một phe thân cận của những người ôn hòa tương đối tự do (theo tiêu chuẩn Tây Tạng), những người có vẻ hiểu biết về các sự tiến bộ của Liên minh Đại Cộng hòa, và hy vọng về quyền tự trị cho người dân Tây Tạng.\n\nMặc dù chính phủ có thể đẩy chính trị địa phương theo một hướng để thấy các ứng cử viên ưa thích, KK và TIP, đạt được chiến thắng, luôn có lựa chọn tôn trọng quá trình dân chủ địa phương — bất kể kết quả có thể là gì."
UPC.federalelections.241.a: "Chúng ta kiểm soát các cuộc bầu cử, và chúng ta kiểm soát ai được bầu."
UPC.federalelections.241.b: "Tuân thủ các nguyên tắc của chúng ta sẽ không hại gì."

UPC.federalelections.242.t: "Sự Chia rẽ của Nhà nước Đại Mông Cổ"
UPC.federalelections.242.d: "Lần thứ hai trong thế kỷ, Nhà nước Đại Mông Cổ đã bị đưa vào sự quy phục bởi sự chiếm đóng của Trung Quốc. Sáp nhập vào nhà Thanh năm 1691 sau một thời kỳ xen kẽ giữa sự hợp tác và chiến tranh, các vùng đất Ngoại Mông Cổ sẽ thấy quyền tự trị tương đối so với anh em Nội Mông Cổ của họ, và sau những nỗ lực của Cách mạng Mông Cổ 1911, sự Bán độc lập và thống nhất với Hô Luân Bối Nhĩ và Ba Nhĩ Hổ ở phía Đông. Rối loạn chức năng ở những thời điểm tốt nhất, Mông Cổ sẽ bị đưa vào quy phục bởi Phe An Huy năm 1919.\n\nSự chiếm đóng thứ hai này sẽ sinh ra một loạt các hiệp hội chính trị và đảng phái mới để phản đối sự chiếm đóng của Trung Quốc. Đông Khố Luân, Đồi Lãnh sự, và Nhóm Quý tộc. Tất cả thống nhất trong sự phản đối chống lại người Trung Quốc, họ sẽ hợp tác một cách tiết kiệm, với hai nhóm trước kết hợp thành Đảng Dân tộc Chủ nghĩa Mông Cổ vào giữa năm 1920 dưới sự quản lý của Dogsomyn Bodoo, và Soliin Danzan. Hợp tác với Quốc dân đảng — đã gửi Tseren-Ochiryn Dambadorj, Damdin Sükhbaatar và Ajvaagiin Danzan tới Đại hội Đầu tiên của họ năm 1924 — tính cách bị rạn nứt của MNP sẽ dẫn đến một môi trường nội bộ cạnh tranh cao độ, với các vụ lật đổ lặp đi lặp lại trong thời kỳ giữa hai cuộc chiến.\n\nDo hoàn toàn thiếu cơ sở hạ tầng bầu cử, các cuộc bầu cử trong Ngoại Mông Cổ đã được chọn tổ chức bằng lời nói, và liên minh lều rộng của MNP đã bắt đầu quét sạch quần chúng, đưa ra các yêu sách lớn cho quyền tự trị, những tiếng thì thầm lặng lẽ dỡ bỏ hệ thống phong kiến, một khu vực hành chính Toàn Mông Cổ thống nhất, và từ chối chủ nghĩa đế quốc Hán.\n\nTrong khi MNP đã thu hẹp điểm sáng, Hệ thống phong kiến của Mông Cổ phần lớn vẫn nguyên vẹn. Cả lạt ma và quý tộc tục gia đều có hiểu biết để giữ lại quyền lợi của họ, không chắc chắn về ý định của MNP, và các nhân vật như các Hãn của các Liên minh Ngoại Mông Cổ hoàn toàn sẵn lòng hợp tác với [UPC.GetLeader] giả định rằng các quyền của họ được bảo vệ. Mặc dù vậy, các quý tộc và lạt ma chính họ chứng tỏ bình đẳng dắt mũi như những nhà cách mạng."
UPC.federalelections.242.a: "Đả đảo Chủ nghĩa Đế quốc Hán! Mông Cổ tiến lên dưới thời MNP!"
UPC.federalelections.242.b: "Đưa ra các thỏa thuận với giới quý tộc, đảm bảo sự tuân thủ của họ."
UPC.federalelections.242.c: "Hủy bỏ các cuộc bầu cử, dẫn ra sự mất ổn định..."

UPC.federalelections.243.t: "Bầu cử ở Ngoại Mãn Châu"
UPC.federalelections.243.d: "Trong những gì phần lớn được coi là một sự lật kèo trong cuộc đua bầu cử, hai đối thủ chính cho Bầu cử Liên bang, Đồng minh Dân chủ Trung Hoa và Liên minh Đại Cộng hòa, đã gửi nhiều người vận động bầu cử và ứng cử viên tới khu vực Ngoại Mãn Châu vừa chinh phục gần đây. Tập trung phần lớn vào Hải Sâm Uy (Hiện là Hải Sâm Uy, Tỉnh Cát Lâm), họ đã tập trung các chiến dịch của họ vào việc nhấn mạnh tính nguyên vẹn của khu vực đối với quốc gia Trung Hoa.\n\nPhần lớn đây đã là một sự lật kèo cho dân số địa phương, phần lớn vẫn là người Nga. Bất chấp những nỗ lực từ những người dân tộc chủ nghĩa nhằm trống lên các băng nhóm chiến tranh của những người định cư để tích hợp và ngập lụt khu vực với người Hán Trung Quốc, điều này phần lớn đã thất bại trong việc thể hiện. Một phần do thiếu cơ hội kinh tế trong Siberia, ngay cả Hải Sâm Uy.\n\nViễn Đông Nga trước khi sáp nhập vào nhà nước Trung Quốc khá đa dạng về mặt dân tộc, bao gồm người Nhật, Triều Tiên, Nga, Yakuts, Buryats, Trung Quốc, và những người khác trong một nồi nấu văn hóa. Đương nhiên, một lượng lớn từ đó đã di cư trở lại quê hương của họ, hoặc sợ bị áp bức hoặc từ chối sống trong một nhà nước Trung Quốc. Mặc dù vậy, khu vực này phần lớn vẫn là người Nga, và với các cuộc bầu cử địa phương sắp tới được dự đoán sẽ tuyên bố, có niềm tin rằng họ sẽ được lấp đầy phần lớn bởi các đảng do người Nga lãnh đạo, nhiều đảng trong số đó yêu cầu quyền tự trị tại nhà nếu không muốn nói là độc lập hoàn toàn — chẳng hạn như Oblastniki, vốn đã xuất hiện trở lại.\n\nDĩ nhiên, điều này loại trừ khái niệm rằng chính phủ hy vọng tổ chức các cuộc bầu cử hợp pháp trong một lãnh thổ nguy hiểm như vậy ngay từ đầu. Với một phần lớn sự vận động tập trung vào sự hiện diện tin tức quốc tế, nhiều người đã bắt đầu sợ rằng các đảng Thân Nga khác nhau sẽ bị cấm hoàn toàn, hoặc các cuộc bầu cử chỉ đơn giản là bị gian lận, đảm bảo cho đảng chiến thắng."
UPC.federalelections.243.a: "Dĩ nhiên....bầu cử...đúng vậy."
UPC.federalelections.243.b: "Bầu cử? Bầu cử gì cơ?"

UPC.federalelections.244.t: "Singapore: Nơi Trú ẩn An toàn Bị vỡ"
UPC.federalelections.244.d: "Vị trí chiến lược ở trung tâm Đông Nam Á dọc theo Eo biển Malacca, hòn đảo Singapore giữ một lịch sử độc đáo với Trung Quốc, với hơn một nửa dân số của nó là người gốc Hoa như một kết quả của làn sóng di cư kéo dài một thế kỷ. Bất chấp khoảng cách của hòn đảo khỏi Trung Quốc, cộng đồng người Hoa địa phương dù sao cũng đã đóng một vai trò trong chính trị của quốc gia, cung cấp một nơi trú ẩn an toàn cho các nhà cách mạng Đồng minh hội khi các cuộc khởi nghĩa chống lại chính phủ nhà Thanh kết thúc trong thất bại, cùng với việc gửi viện trợ cho các nhà cách mạng trong Cách mạng Tân Hợi.\n\nSau sự thành công của cuộc cách mạng, cộng đồng người Hoa địa phương đã đến ủng hộ Quốc dân đảng, với các nhánh địa phương được thiết lập trên hòn đảo cùng với Mã Lai. Singapore sớm trở thành một điểm nóng cho chủ nghĩa cực đoan cách mạng thiên tả, làm chủ nhà cho các tổ chức xã hội chủ nghĩa tìm kiếm không chỉ viện trợ cuộc đấu tranh chống lại Chính phủ Bắc Dương ở đất liền, mà còn kích động sự bất ổn chống lại chủ nghĩa thực dân Anh ở Singapore. Bất chấp sự sụp đổ của cuộc Bắc phạt và sự hiện diện gia tăng của Đức trong các cựu thuộc địa của Đế chế Anh đang phân hủy, sự ủng hộ cho KMT vẫn mạnh mẽ và ổn định trong cộng đồng địa phương.\n\nHoàn cảnh đã thay đổi rất nhiều trong những năm gần đây, tuy nhiên, vì không ai có thể dự đoán sự chiếm đóng của hòn đảo dưới thời Trung Quốc. Thêm vào sự ngạc nhiên của nhiều người là các chuyến thăm bất ngờ của các ứng cử viên dẫn đầu của cuộc bầu cử sắp tới của Trung Quốc. Trong khi tầm quan trọng của chiến dịch của họ ở một hòn đảo xa xôi với ít sự đóng góp chính trị đã bị mất đối với mọi người, một số người đã đầu cơ sự có được sự bảo trợ của cộng đồng kinh doanh địa phương là lý do thực sự cho các chuyến thăm, vì nó cấu thành một phần lớn viện trợ được gửi về đất liền trong Kiều bào Trung Hoa.\n\nBất kể mục đích chuyến thăm có là gì, sự vận động bầu cử ở Singapore vẫn bất ổn khi sự bất an về sự ngoài lề hóa chính trị gia tăng của dân số không phải người Hoa trên hòn đảo đã thêm dầu vào một cảnh chính trị vốn đã rạn nứt."
UPC.federalelections.244.a: "Lập trường mang tính xã hội chủ nghĩa của CDL giành chiến thắng trong giới thiên tả địa phương."
UPC.federalelections.244.b: "Lập trường ôn hòa của GRA giành chiến thắng trong giới thương nhân địa phương."
UPC.federalelections.244.c: "Cả hai ứng cử viên đều không quản lý để giành chiến thắng trong cộng đồng địa phương."

UPC.federalelections.245.t: "Đấu trường Thay đổi của Kiều bào"
UPC.federalelections.245.d: "Bên ngoài Trung Quốc sống một Kiều bào Trung Hoa đáng kể rải rác khắp thế giới, theo dõi từ nước ngoài chính trị hỗn loạn bao bọc quê hương của họ. Trong khi các nhánh địa phương của các đảng chính trị đất liền tồn tại ở các nước có dân số kiều bào, các nhóm di cư đã hình thành các đảng chính trị của riêng họ hoạt động từ thành phố Hồng Kông, an toàn khỏi sự áp bức côn đồ của các quân phiệt đất liền nhưng đủ gần vẫn để làm việc hướng tới việc đạt được các mục tiêu chính trị của họ ở Trung Quốc.\n\nBị giới hạn trong thành phố tồn tại một lượng lớn các đảng di cư như Liên minh Tự do Dân chủ Nhân dân, Đảng Tự do Nhân dân Trung Hoa, và Đảng Tiến bộ Dân chủ, độc lập khỏi các đảng chính trị lớn đã đến thống trị chính trị đất liền và bị bao phủ trong màn sương không liên quan. Trong số các đảng này tồn tại các hội kín Hồng Môn chưa tham gia GRA, với đảng lớn nhất trong số này là Đảng Dân chủ Hồng Môn Trung Hoa.\n\nTuyên bố đại diện cho lợi ích của ba triệu người di cư ở mẫu quốc của họ, đảng đã bị khóa trong một cuộc đấu tranh quyền lực giữa hai nhà sáng lập: Tư Đồ Mỹ Tạng và Triệu Vũ. Bên ngoài đảng, một số người đã chống lại sự chính trị hóa Hồng Môn bởi CHMPRP, thiết lập các hiệp hội của riêng họ - Hội Tự trị và Tái thiết Quốc gia Hồng Môn do Lâm Hữu Minh lãnh đạo, và Hiệp hội Hồi sinh Hồng Môn do Trương Tư Liên tổ chức, vốn đã biến đổi thành Đảng Dân sinh và Tiến bộ.\n\nĐấu trường chính trị thay đổi này của các đảng Hồng Môn đã thấy một sự thay đổi trong phát triển với sự thống nhất gần đây của các đảng Hồng Môn dưới Liên minh các Đảng Trung gian, hoạt động như một vị trí giữa giữa CDL công khai thiên tả và GRA bán phản động. Với cuộc bầu cử ở Trung Quốc trở nên căng thẳng khi các đảng lớn tranh giành để thu thập sự ủng hộ chính trị bất cứ nơi nào họ có thể, cả hai đảng dẫn đầu đã tìm đến việc tranh thủ sự ủng hộ của LoMP và đổi lại, kiều bào hải ngoại."
UPC.federalelections.245.a: "Đáng kinh ngạc, khuynh hướng thiên tả của LoMP đã chiến thắng!"
UPC.federalelections.245.b: "Các đảng Hồng Môn huy động phiếu bầu có lợi cho GRA."
UPC.federalelections.245.c: "Những người di cư khao khát một Trung Quốc truyền thống hơn, mạnh mẽ hơn."

#Interest Group Events
UPC.federalelections.250.t: "Người Lao động trong một Trung Quốc Mới"
UPC.federalelections.250.d: "Các mối quan hệ Công đoàn liên quan đến các chính phủ trong Trung Quốc từ lâu đã đầy căng thẳng. Với dòng thủy triều ngày càng tăng của sự tự hiểu biết của Côn nhân, sự phát triển của phong trào công nhân, và sự công nghiệp hóa gia tăng, phong trào Công đoàn Trung Hoa đã đưa ra các nỗ lực ngày càng tăng và ngày càng bạo lực hơn để nuôi dưỡng sự thay đổi cho công nhân quốc gia. Bãi công Hồng Kông-Quảng Châu, Bãi công Bắc Kinh-Hán Khẩu, Cuộc khởi nghĩa Thượng Hải chỉ là một vài ví dụ đáng chú ý.\n\nBản chất của phong trào liên quan đến Chủ nghĩa Liên bang tuy nhiên, lại hỗn hợp hơn. Một phần của những người theo Chủ nghĩa Liên bang Cũ có một niềm tin chân thành rằng các công đoàn nên tồn tại theo nguyên tắc. Nhưng họ không được mang tính chính trị, và phải hợp tác đối với chính quyền — không có hành động đình công tự phát. Những kẻ cứng rắn khác khao khát sự kiểm soát tuyệt đối đối với phong trào công đoàn, ngăn chặn bất kỳ và tất cả sự gián đoạn đối với sản xuất.\n\nĐồng minh Dân chủ Trung Hoa, dựa trên trí thức nhiều hơn, mở cửa cho các công đoàn đóng một vai trò chính trị mở, nhưng không... quá nhiều. Các đảng khác, chẳng hạn như [UPC_GetDCPPartyName_nocolour] hoặc YCP, và các nhà độc lập khác nhau, đã bày tỏ sự quan tâm đến các công đoàn và lao động có tổ chức. Nhưng trong thực tế, sự cam kết của họ thay đổi. Tất cả họ, bao gồm cả CDL, có xu hướng nhìn nền kinh tế theo một nghĩa tập đoàn — nhu cầu cho tất cả các giai cấp làm việc cùng nhau như một cỗ máy. Các công đoàn có thể được phép đại diện cho công nhân, miễn là họ không phải là những người xã hội chủ nghĩa nổi dậy; một vai trò xã hội, nhưng không phải là một vai trò chính trị nghiêm ngặt.\n\nDĩ nhiên, những nỗi sợ hãi vẫn là tối quan trọng về sự quyến rũ của chủ nghĩa công đoàn xâm nhập vào phong trào lao động. Những người xã hội chủ nghĩa, đặc biệt là những người có khuynh hướng cực đoan, tin rằng các công đoàn là một đá tảng lớn trong tương lai của cuộc cách mạng, và theo truyền thống đã có thời gian dễ dàng nhất để đạt được lợi ích trong giới công nhân."
UPC.federalelections.250.a: "Các công đoàn cần phải được giám sát nghiêm ngặt và giữ phi chính trị."
UPC.federalelections.250.b: "Các công đoàn là một công cụ cho sự hòa hợp giai cấp và sự hồi sinh kinh tế."
UPC.federalelections.250.c: "Các công đoàn nên được để lại để tự sắp xếp chính trị của họ."

UPC.federalelections.251.t: "Sự Bất hòa ở Nông thôn"
UPC.federalelections.251.d: "Trong nông thôn, các mối quan hệ giai cấp giữa tư sản, \"côn đồ địa phương và sĩ紳 ác độc\", và các nông dân nông nghiệp được cho là còn tồi tệ hơn cả phong trào công nhân. Sống một cuộc sống hiệu quả của chủ nghĩa phong kiến tôn vinh, nhiều nông dân bị ràng buộc với các chủ sĩ紳 của họ, và dưới sự thương hại của các băng nhóm cướp bóc lưu động. Nói chung được giáo dục kém và bị đối xử kém, họ đã chứng tỏ dễ dàng bị huy động bởi những người xã hội chủ nghĩa, và bị cưỡng ép bởi giới sĩ紳. Bất chấp sự phô trương từ các nhân vật khác nhau, thực sự rất ít người nói cho quần chúng.\n\nBây giờ là một đề tài bầu cử có thể hình dung được, sự căng thẳng giữa nông dân và nông dân thuê đất so với các địa chủ lớn và giới sĩ紳 đã gia tăng, với không bên nào thực sự đưa ra giải pháp hoàn hảo nhất cho vấn đề. Cả GRA và CDL đều đã nói về nguyên tắc về việc nông dân xứng đáng nhận được sự đối xử tốt hơn, nhưng về cơ bản không phải thuộc giai cấp nông dân — chủ yếu bao gồm các trí thức, hoặc các giới tinh hoa khác — và vì vậy hấp dẫn đối với giới sĩ紳 trong thực tế.\n\nLiên minh Đại Cộng hòa, gần gũi hơn nhiều với giai cấp sĩ紳 (cùng với các nhà Liangist khác như Thanh niên Đảng Trung Hoa), đã hy vọng tạo ra một số hình thức hòa hợp nông nghiệp nông thôn địa phương. Nâng cao nông dân từ từ thông qua giới sĩ紳, hạn chế các sự quá đà và lạm dụng, nhưng giữ lại áp lực lên nông dân để cải thiện sự nghèo đói quốc gia của Trung Quốc.\n\nNổi lên như một liều thuốc độc động lực của nhà trí thức đối với vấn đề trong những năm 30, Hiệp hội Kiến thiết Nông thôn, đứa con tinh thần của Lương Thấu Minh và Yến Dương Chu, đã nổi lên trong sự nổi bật khi thảo luận về vấn đề. Trực tiếp tất cả các vấn đề hướng tới giáo dục, và làng quê Trung Quốc địa phương, RRA tin rằng khối xây dựng cơ bản (trong sự giải thích Nho giáo) của Trung Quốc, ngôi làng khiêm tốn, đã bị bỏ ngỏ. Thông qua sự hồi sinh của họ, và ít nhất được chứng minh một phần bằng ví dụ, RRA khăng khăng đòi niềm tin rằng tình hình sẽ tự giải quyết."
UPC.federalelections.251.a: "Nông dân cần phải biết vị trí của họ."
UPC.federalelections.251.b: "Nông dân cần sự hướng dẫn của chúng ta."
UPC.federalelections.251.c: "Nông dân không có mấy sự bận tâm."

UPC.federalelections.252.t: "Đường nét của một Quan chức"
UPC.federalelections.252.d: "Chừng nào đã có các triều đại và văn hóa đối đầu ở Miền Bắc của quốc gia và Miền Nam của quốc gia, đã có sự chia rẽ \"Nam-Bắc\" phù du này, lỏng lẻo dọc theo Sông Trường Giang. Với sự thừa kế lãnh địa của Miền Bắc, Cộng hòa Liên bang mới đã bị yên ngựa với tất cả tội lỗi của nó: mạng lưới bảo trợ, sự thờ ơ, chủ nghĩa quân phiệt, tham nhũng. Như đã chứng minh ngay cả trong lịch sử gần đây, Miền Bắc và Miền Nam đã vật lộn cả về mặt địa lý và tư tưởng. Đối với Miền Nam, sau khi bị khuất phục lâu dài trước Miền Bắc, cách mạng chỉ là sự thể hiện khả thi nhất của hành động chính trị, và nó ít nhất đã chứng tỏ thành công ban đầu.\n\nVới Tân Hợi bị phá hủy thông qua sự biến dạng của Việt Nam Bắc Dương, Chủ nghĩa Liên bang cũng sẽ thấy bản chất của nó do dự trong số các nhà chính trị và trí thức Miền Bắc. Thử nghiệm với các khái niệm như vậy, đáng chú ý nhất là dưới sự bảo trợ của Đoạn Kỳ Thụy, Tào Côn, và Ngô Bội Phu, sự mơn trớn giữa các Phe An Huy và Trực Hệ với những người theo Chủ nghĩa Liên bang khác nhau cả ở Miền Nam và Miền Bắc cuối cùng đã mang lại rất ít quả — có lẽ những tàn dư kéo dài duy nhất là Hiến pháp Tào Côn, hoặc Tỉnh Hồ Nam.\n\nThừa kế bộ máy quan liêu của nó, quốc gia cũng đã tích hợp nhiều mạng lưới Quan hệ của Miền Bắc. Bộ máy quan liêu tự chứng minh quá giá trị nhưng đồng thời quá kết hợp với các \"gia đình\" hiện có. Mua lại sự kiểm soát của các mạng lưới này trao cho chính phủ quyền lực không cân đối liên quan đến cử cử, đặc biệt là các cử cử miền Bắc, những người sợ mất đặc quyền của họ, và nó đã tự nhiên trở thành một chủ đề thảo luận nóng hổi nhưng im lặng.\n\nBất kỳ sự gián đoạn nào đối với các mạng lưới hiện có chắc chắn sẽ đầy căng thẳng: chắc chắn sẽ chứng minh khả năng xé rách chính phủ đương nhiệm nếu nó chứng tỏ đủ tàn phá, nhưng những người khác đã khăng khăng đòi sự bãi nhiệm các mạng lưới hiện có — mặc dù không chính thức gợi ý người của họ chiếm giữ khoảng trống quyền lực. Dĩ nhiên, lựa chọn để cho những con chó đang ngủ nằm mãi mãi vẫn áp dụng được — làm phiền tổ ong của các động lực quyền lực cố thủ ở miền bắc có thể chứng tỏ quá vụng về."
UPC.federalelections.252.a: "Các thỏa thuận hậu trường là cách mọi thứ được làm mịn..."
UPC.federalelections.252.b: "Thay thế người của họ bằng người của chính chúng ta."
UPC.federalelections.252.c: "Tốt nhất không nên chọc vào tổ ong."

UPC.federalelections.260.t: "Cơn lốc Sinh viên của Trung Quốc"
UPC.federalelections.260.d: "Sinh viên và thanh niên từ lâu đã là nền tảng cơ bản của rất nhiều sự thay đổi chính trị quyết liệt của Trung Quốc. Những người thừa kế và người sinh ra các di sản chính trị, các sinh viên của những năm 1910 và 20 đã nổi lên để trở thành các nhà trí thức và nhân vật chính trị dẫn đầu của ngày nay. Với nhiều cuộc tranh luận của họ thời quá khứ được bắt chước tương tự, về các chủ đề mới nhưng trong cùng các chế độ cũ. Các cuộc tranh luận giữa Hồ Thích và Hồ Hán Dân, Lương Thực Thu và Lỗ Tấn, Trần Độc Tú và Trương Đông Tôn, tất cả đều đã thấy điểm sáng của họ và những người kế nhiệm của họ.\n\nDĩ nhiên, không phải tất cả đều là hoạt động chính trị, nhiều trong số đó là văn học. Với Phong trào Văn hóa Mới nhảy vọt, sự phát triển của Tiếng Trung Bạch thoại, các phong cách thơ và văn xuôi viết, và tất cả các loại đã được tranh luận trong các đại sảnh của Đại học Bắc Kinh và những nơi khác. Tuy nhiên với những tâm trí trẻ táo bạo, đi vào các phong trào chính trị có tổ chức. Đảng Công đoàn Trung Hoa, Thanh niên Đảng Trung Hoa, Phấn Đấu 社, Nguyệt Tân 社, Đảng Dân chủ Xã hội, và những người khác.\n\nTrong ngày nay, nhiều người đã bắt đầu mô phỏng Quốc dân đảng trong sáng kiến của họ để thu được sự ủng hộ của phong trào thanh niên vào các hoạt động chính trị của họ. Tài trợ cho một loạt các hội văn học và tổ chức thanh niên rộng lớn, Đồng minh Dân chủ Trung Hoa và Liên minh Đại Cộng hòa đã tạo ra các tổ chức như \"Thanh niên Dân chủ\", cho phép các thành viên cố gắng được coi là các thành viên chuẩn bị.\n\nTổ chức các hội thơ, hội múa, hội giáo dục, và hội phụ nữ, họ cũng đã tạo ra các tổ chức như Hiệp hội Chống Nội chiến Toàn Trung Hoa, và một loạt các tờ báo đảng. Tất cả đều có những thành công khác nhau trong quần chúng."
UPC.federalelections.260.a: "Nhấn mạnh sự tái thiết của quốc gia."
UPC.federalelections.260.b: "Nhấn mạnh chủ nghĩa yêu nước và sự thống nhất quốc gia."
UPC.federalelections.260.c: "Thật tuyệt khi chỉ đơn giản theo dõi các học giả tranh luận."

UPC.federalelections.261.t: "Khăng khăng, Thương nhân, và Giới Tinh hoa Kinh doanh"
UPC.federalelections.261.d: "Công nghiệp Trung Hoa đã thấy những tiến bộ lớn kể từ sự khởi đầu sớm của thế kỷ 20. Thông qua sự nuôi dưỡng của nhà Thanh, và sau đó tập trung các nỗ lực công nghiệp hóa của các quân phiệt khác nhau, các cường quốc nước ngoài, các nhà công nghiệp địa phương, và một tập hợp các thương nhân và nhà kinh doanh, quốc gia đã tự ném mình vào thời đại hiện đại. Ít nhất, ở các khu vực ven biển và đô thị; dĩ nhiên hình ảnh ở nội địa ít thịnh vượng và nhảy vọt hơn nhiều.\n\nNhiều doanh nghiệp lớn đã xuất hiện, chẳng hạn như Công ty Sắt & Thép An Sơn, Peking Syndicate, Krupp Steel, Ngân hàng HSBC, và Phelps-Dodge. Cũng đã có các doanh nghiệp khu vực khác nhau, Xi măng Đảo Xanh, Nhà máy Sắt Triết Giang, hoặc Nhà máy Bột Thượng Hải. Tổ chức chính họ trong các tổ chức khác nhau chẳng hạn như Tập đoàn Giang Nam, hoặc căn chỉnh với các phe phái chẳng hạn như Phe Thông tin, đã có một sự tranh chấp tinh vi nhưng phát âm giữa các ý kiến về thương mại, chủ nghĩa bảo hộ, xuất khẩu, và thuế quan.\n\nNhiều người theo Chủ nghĩa Liên bang chính họ đã bị chia rẽ về vấn đề này. Nhiều người là những nhà tập đoàn lớn, do di sản Liangist của họ, và tin rằng nền kinh tế nên được kiểm soát bởi chính phủ, và làm việc trong sự phục vụ hòa hợp cho nhân dân. Như vậy, họ là những người ủng hộ lớn cho một chính sách thân thuế quan.\n\nNhững người khác đã chứng tỏ là có hiểu biết hơn đối với phía thương mại tự do của phổ, với niềm tin rằng các nhà kinh doanh yêu nước nội địa nên được phép thương mại tự do, và rằng thương mại như vậy cho phép sự trao đổi tự do các ý tưởng giữa các nhà doanh nghiệp. Họ chỉ cần thiết rằng nó phải công bằng, và trên vị thế bình đẳng. Nói chung, một triển vọng như vậy được minh chứng thông qua sự giàu có vật chất tự nhiên và tài nguyên thô của Trung Quốc, và nhiều nhà chính trị có mối quan hệ kinh doanh đã bắt đầu thúc đẩy một triển vọng như vậy.\n\nKhá kỳ lạ, có một sự nhô ra của các cá nhân khao khát một cuộc chiến tổng lực và sự tước đoạt chống lại tất cả các doanh nghiệp và đầu tư nước ngoài, vận động trên chủ nghĩa siêu dân tộc cực đoan, chủ nghĩa siêu bảo hộ, và sự tiêu diệt cuồng nhiệt các nhượng địa."
UPC.federalelections.261.a: "Thương mại nước ngoài, khi được thực hiện trên các điều kiện bình đẳng, có lợi cho tất cả."
UPC.federalelections.261.b: "Ngành công nghiệp non trẻ của chúng ta đòi hỏi sự bảo vệ và đầu tư của nhà nước."
UPC.federalelections.261.c: "Mắng chửi sự bóc lột nước ngoài và nội địa hoạt động mọi lúc."

UPC.federalelections.262.t: "Quân nhân trong Chính trị"
UPC.federalelections.262.d: "Vai trò của quân đội trong chính trị đã đan xen kể từ những bước nông đầu tiên của Việt Nam Bắc Dương. Trong hiện tại, vai trò của chủ nghĩa quân phiệt và quân đội vẫn được ghi khắc, ngay cả trong cộng hòa mới. Các nhà chính trị ở tất cả các bên tham quan các kho vũ khí và căn cứ quân sự khác nhau, cưỡi trên những đỉnh cao của chủ nghĩa yêu nước. Ngoài ra, một tập hợp các cựu sĩ quan và quân nhân đã bắt đầu chuyển giao sự nghiệp của họ vào quốc chính, chạy đua cho văn phòng địa phương và vận động trên lượng lớn chủ nghĩa dân tộc.\n\nTính nguyên vẹn của các quân nhân chạy đua cho văn phòng đã bị đặt vào câu hỏi. Ở một cấp độ triết học, tại điểm nào các sĩ quan bị cấm đắm mình trong chính trị — nó không chỉ đơn thuần là chủ nghĩa quân phiệt trong bộ quần áo mới sao? Tất nhiên nhiều người trong số họ sẽ thúc đẩy các người bạn cũ của họ trong quân đội, cùng với việc bắn hạ các đề xuất cho việc phi quân sự hóa.\n\nVà điều này thậm chí không bận tâm đến các tình huống trong đó quân đội trực tiếp tham gia vào chính trị. Các cá nhân chạy đua cho văn phòng bị \"giải ngũ\" chỉ trên danh nghĩa — nếu họ thua cuộc đua, họ chỉ đơn giản gia nhập lại quân đội. Trong quá trình thống nhất đất nước, nó đã phổ biến cho quân đội bổ nhiệm các đại biểu tới các khu vực gần đây được \"giải phóng\", và nếu không ảnh hưởng đến chính trị địa phương, một thực hành tiếp tục không chính thức ở một số khu vực. Điều này đến một mức độ như vậy mà nhiều đại biểu được bổ nhiệm của họ vẫn còn trong văn phòng. Và dĩ nhiên, vấn đề luôn hiện diện của quân đội đe dọa nhân dân vẫn hiện diện, củng cố chính nó như một thứ gì đó độc lập với sự kiểm soát dân sự.\n\nThan ôi, nhân dân đã thực hiện nhiều sự hy sinh trong thời gian gần đây, và kết quả là có một lượng lớn cựu chiến binh — những cá nhân trẻ tuổi bị tàn phế cả về mặt thể chất và tinh thần. Gia đình của những người lính này, đã chết và còn sống, cũng đã bị ảnh hưởng do các cuộc chiến tranh gần đây — và không nghi ngờ gì sẽ yêu cầu lương hưu cùng với sự hỗ trợ tài chính. Đối với họ, sự thúc đẩy các đồng đội của họ trong các vai trò dân sự là sự xác nhận cho sự phục vụ của họ."
UPC.federalelections.262.a: "Dĩ nhiên Tổng thống với tư cách là tổng chỉ huy sẽ được thấy cùng với người của ông!"
UPC.federalelections.262.b: "Phe đối lập tạo ra một số tiến triển kêu gọi chuyển giao sang thời bình."
UPC.federalelections.262.c: "Quân đội sẽ luôn là trụ cột yêu nước của nhà nước-quốc gia chúng ta."

UPC.federalelections.263.t: "Những Kẻ Mạnh mẽ Bùng nổ trong các Cuộc Bỏ phiếu!"
UPC.federalelections.263.d: "Nhiều hình mẫu sao chép khác nhau của một quân phiệt mang tính đa chiều, và tùy thuộc vào cá nhân, được giải thích theo một phạm vi các mức độ thay đổi. Để thực sự đặt ra, một quân phiệt là gì? Một cảnh sát trưởng cũng là một trưởng lão làng, một quan huyện cũng là một địa chủ lớn, một sĩ quan quân sự cũng đã được bầu làm thượng sĩ — tất cả đều mang các yếu tố là những quân tử được kính trọng đối với một số người, và một kẻ tàn bạo địa phương đối với những người khác.\n\nTrong hàng ngũ của chủ nghĩa quân phiệt là các cấp độ tầm quan trọng khác nhau — nhỏ và lớn. Tràn ngập các cấp dưới của họ, các quân phiệt địa phương khác nhau và các toán viên, và các nhân vật thẩm quyền hoạt động bên dưới họ — giới sĩ紳 và trưởng làng. Nhiều người đã so sánh nó với một hình thức biến thái của chủ nghĩa phong kiến vốn hiện diện ở Châu Âu, hoặc Nhật Bản, hoặc búp bê Matryoshka, hoặc thậm chí màng nhện, nhưng sự rối rắm của các mối quan hệ trốn tránh bất kỳ sự phân cấp rõ ràng nào.\n\nTheo một số cách, các mối quan hệ quân phiệt có quan trọng hơn sự kiểm soát trực tiếp của họ đối với súng ống — các quân phiệt này có các mối quan hệ sâu rộng không chỉ đối với các lực lượng quân sự, mà còn đối với các tiếp xúc trong lĩnh vực xã hội, kinh tế, và chính trị đồng thời.\n\nSự chịu đựng của chủ nghĩa quân phiệt đã thấy nó như vậy ngay cả trong chính phủ Liên bang mới, những nỗ lực của nó để thực thi dân chủ, và tước vũ khí các quân phiệt, nó đã không hoàn toàn cắt bỏ họ khỏi việc giữ lại quyền lực. Một số người thậm chí đã bắt đầu tập hợp sự phổ biến địa phương chân chính như những \"Nhà Vô địch của Nhân dân\", hoặc một \"Nhà Bảo vệ Chống lại Chính phủ Trung ương Tàn bạo\", hoặc thậm chí chỉ như một giới tinh hoa địa phương trung thực so với các quan huyện chính phủ trung ương tham nhũng, hoặc các quan chức đảng thờ ơ. Đủ để nói, với sự phổ biến và các kết nối của họ, họ đã được kích hoạt để giành chiến thắng các cuộc bầu cử địa phương trên sự ủng hộ chân chính, trái ngược với sự lừa gạt.\n\nVới các sự trở lại chính trị của họ, các trí thức đã bắt đầu phổ biến sự bắt đầu của một thời đại mới của chủ nghĩa quân phiệt, và đã bắt đầu tấn công Tổng thống và chính phủ vì đã cho phép \"sự mục nát\" như vậy mưng mủ một lần nữa."
UPC.federalelections.263.a: "Tổng thống sẽ không đứng cho sự xuất hiện trở lại của chủ nghĩa quân phiệt!"
UPC.federalelections.263.b: "Phe đối lập khai thác cơ hội này để làm suy yếu Tổng thống."
UPC.federalelections.263.c: "Đôi khi nền dân chủ đi theo những bước ngoặt kỳ lạ."

UPC.federalelections.270.t: "Tương lai của Phe Đẹp hơn"
UPC.federalelections.270.d1: "Với sự chính thức hóa quyền cử cử của phụ nữ trong giấy tờ được viết rõ ràng, Phụ nữ Trung Hoa cuối cùng đã giành được quyền bầu cử phổ thông, một biện pháp khá phổ biến theo hầu hết các thước đo. Mặc dù hầu hết phụ nữ trong quốc gia về thực tế đã mặc định trở lại quan điểm của gia đình họ về chính trị, các đảng đã bắt đầu điều chỉnh — thấy nhu cầu lớn hơn để kêu gọi phiếu bầu của phụ nữ.\n\n$UPC.federalelections.270.d_end$"
UPC.federalelections.270.d2: "Trong khi phụ nữ ở Trung Quốc không có quyền bầu cử chính thức một cách phổ thông, một số tỉnh nghiêng về tiến bộ như Quảng Đông và Hồ Nam dù sao cũng đã trao nó trong hiến pháp tỉnh của họ, mặc dù những tỉnh khác đã tụt lại phía sau. Trong khi quyền bầu cử của họ không được đảm bảo trên toàn quốc, phụ nữ là một lực lượng xã hội mạnh mẽ và không thể bị phớt lờ hoàn toàn.\n\n$UPC.federalelections.270.d_end$"
UPC.federalelections.270.d_end: "Trong đầu thế kỷ 20, các phong trào như \"Người Phụ nữ Mới\" đã bắt đầu xuất hiện. Kêu gọi sự thúc đẩy quyền phụ nữ và sự tự do khỏi các thực hành Nho giáo bó hẹp, Tân Hợi sẽ thấy nhiều đơn vị nổi dậy toàn phụ nữ được dấy lên, và năm 1912 Liên minh Bầu cử Phụ nữ được thành lập để làm việc cho sự bao gồm các quyền bình đẳng và bầu cử của phụ nữ trong hiến pháp mới.\n\nCả GRA và CDL đều đã cố gắng kết hợp các vấn đề của phụ nữ vào nền tảng của họ. Đối với GRA, họ đã tập trung chiến dịch của họ vào sự bảo vệ phụ nữ và trẻ em trong nơi làm việc. CDL đã yêu cầu rằng các quyền của họ được bảo vệ và các cơ hội trong chính trị, giáo dục, và việc làm được giữ vững; một sự đảm bảo cho các công nhân phụ nữ quyền nghỉ phép trong thời gian mang thai và sau khi sinh con; các trung tâm chăm sóc ban ngày và nhà trẻ nên được cung cấp để giải tỏa công nhân phụ nữ khỏi các nghĩa vụ gia đình, và tăng sự độc lập kinh tế.\n\nCả hai đều đã kêu gọi sự đại diện của phụ nữ trong chính phủ. Các cá nhân cũng đã không ngồi ngoài: lãnh đạo CDL Lương Thực Thu đã khăng khăng đòi sự khác biệt giữa nam và nữ, và rằng sự bình đẳng về cơ bản phủ nhận thực tế này — giáo dục nên được may đo để biến họ thành \"người phụ nữ lý tưởng\"; những người vợ đức hạnh và những người mẹ tốt. Hồ Thích về phần mình đã phản đối triển vọng bảo thủ của Thực Thu, yêu cầu rằng sự bình đẳng hoàn toàn phải được thiết lập; đó là của cá nhân làm với quyền của họ những gì họ muốn. Thanh niên Đảng Trung Hoa đã đưa ra một lời kêu gọi tập thể rằng bình đẳng giới và tất cả những gì nó thuộc về là cần thiết cho quốc gia tiến bộ và đi lên."
UPC.federalelections.270.a: "Quý bà, hãy bảo các ông chồng của quý vị bỏ phiếu cho [UPC_players_candidate]!"
UPC.federalelections.270.b: "Sự tiến bộ về các vấn đề Phụ nữ là Sự tiến bộ về các vấn đề Quốc gia."
UPC.federalelections.270.c: "Các vai trò Giới tính Nho gia giữ cho các ngôi nhà trật tự và hòa hợp."

UPC.federalelections.271.t: "Các Vấn đề Đơn lẻ và Những nhà Chủ nghĩa Đặc thù"
UPC.federalelections.271.d: "Lướt sóng ở giữa các ngóc ngách và kẽ hở của các cuộc tranh luận và vấn đề chính trị lớn của cộng hòa hiện đại nằm một loạt các thứ linh tinh; mang tính chất thản nhiên, các vấn đề có tầm quan trọng khá nghi ngờ. Các vấn đề đơn lẻ, lợi ích đặc biệt, các vấn đề chia rẽ. Mặc dù thường không hoàn toàn quan trọng để hình thành toàn bộ một chiến dịch, nó dù sao cũng có khả năng xoay các phiếu bầu có lợi cho các đảng, nhỏ và lớn như nhau.\n\nNhiều nhóm truyền giáo Kitô giáo, hoạt động phần lớn ở Tây Bắc nhưng với một vài đại đội ở những nơi khác trong quốc gia, đặc biệt là Thượng Hải, đã bắt buộc sự bảo vệ các sứ mệnh của họ, và sự đảm bảo quyền tự do tôn giáo — giành được sự ủng hộ cần thiết trong số nhiều nhóm thiểu số tôn giáo khác. Truyền thông và báo chí đã tập hợp cho sự bảo vệ quyền tự do ngôn luận, tham gia vào một sự hiệp thông khá kỳ lạ bởi các nhóm khác nhau chẳng hạn như Hồng Môn.\n\nKhắc họa các ngách đáng kể, bất kỳ sự phủ nhận hoặc từ chối trắng trợn nào để giám sát các vấn đề tương đối không quan trọng này có thể thấy các mảng phiếu bầu di chuyển vào vòng tay mở của những kẻ cực đoan, những người độc lập, hoặc những nhà chủ nghĩa khu vực. Và trên một dòng tương tự, các đảng đương đại tham gia vào các cuộc bầu cử có khả năng xoay một phần cơ sở cử cử theo hướng của họ — một chiến thắng cho tất cả, một số người có thể nói."
UPC.federalelections.271.a: "Dĩ nhiên, [UPC_players_candidate] vẫn đứng đầu các vấn đề."
UPC.federalelections.271.b: "Đôi khi các khẩu vị chính trị kỳ lạ thể hiện thành chủ nghĩa đặc thù chính trị."
UPC.federalelections.271.c: "Mọi đảng đều tìm thấy các ngách nhỏ họ có thể phục vụ."

UPC.federalelections.272.t: "Năm Dân tộc Dưới một Liên minh?"
UPC.federalelections.272.d1: "Trong khi nhiều phần của tây bắc quốc gia và những nơi khác — quê hương của nhiều dân tộc thiểu số — vẫn nằm ngoài sự kiểm soát của Trung Quốc, và do đó tiếp tục không thể đại diện trong Quốc hội hoặc tổ chức bầu cử, chính phủ vẫn thấy phù hợp để lấp đầy các ghế khác nhau đại diện cho các khu vực đó và nhân dân của họ, chủ yếu vì lý do hợp pháp, và để đảm bảo rằng sự tích hợp tương lai không thể tránh khỏi của họ là suôn sẻ, hiệu quả, và đại diện định lượng được.\n\nTuy nhiên, vấn đề được quyết định trên vực thẫm bổ nhiệm của họ: họ nên được bổ nhiệm trực tiếp khi vắng mặt bởi chính chính phủ trong cuộc bầu cử này? Hay đúng hơn, chính phủ nên có các nhóm lưu vong và trung thành khác nhau tổ chức bầu cử tương ứng với các khu vực bầu cử thay mặt cho họ? Thực tế, chính phủ thậm chí có nên phục vụ cho khái niệm các dân tộc thiểu số có quyền tự trị địa phương trong tương lai không?"
UPC.federalelections.272.d2: "Với sự kiểm soát trực tiếp đối với biên giới Trung Hoa, và sự thống nhất của quốc gia, nhiều dân tộc thiểu số bên ngoài bong bóng Hán Trung Quốc giờ đây một lần nữa bao gồm công dân của nhà nước cộng hòa Trung Hoa. Đã dập tắt các nhóm độc lập dân tộc thiểu số ở các mức độ thay đổi, nhiều công dân của họ sợ các sự trả đũa hoặc chủ nghĩa Sô-vanh Hán xa hơn mang tính biểu tượng của các chính quyền trước đó.\n\nDĩ nhiên, lịch sử các dân tộc thiểu số trong Cộng hòa Trung Hoa rất phức tạp, vì ở cấp độ cơ bản nhất của nó nó được xây dựng trên một cấp độ thống nhất và bình đẳng. Ngũ Tộc Cộng Hòa biểu tượng cho người Hán, Mãn, Tạng, Hồi, và Mông Cổ cùng nhau trong sự hòa hợp để tiến lên một thời đại thịnh vượng mới, cho dù hình thức đó có thể là gì. Mặc dù vậy, nhiều người ủng hộ chính khái niệm đó, chẳng hạn như Tiến sĩ Tôn Trung Sơn, tương tự mang lý tưởng rằng người Hán phải \"nâng cao\" và \"khai sáng\" các dân tộc \"nhỏ hơn\" của quốc gia Trung Hoa để tích hợp họ vào cộng hòa.\n\nTrong sự phản đối, nhiều nhóm ly khai đã dấy lên chống lại Trung Quốc, đôi khi được hỗ trợ bởi các cường quốc đế quốc. Trong Tân Hợi, người Mông Cổ Khảo Nhĩ Khảo đã bứt phá tự do dưới sự hỗ trợ của Nga, và đã tiến hành một cuộc chiến kéo dài chống lại Trung Quốc cho đến năm 1915 trong một nỗ lực để giải phóng người Nội Mông Cổ, và người Đạt Oát Nhĩ/Ba Nhĩ Hổ. Tây Tạng bứt phá tự do tương tự, đảm bảo sự độc lập của mình dưới sự đảm bảo của Anh, và tham gia vào các xung đột với các thể chế quân phiệt Trung Quốc trong Thời đại Quân phiệt. Tân Cương cũng vậy, chịu đựng các cuộc khởi nghĩa thiểu số, cũng như nội địa và miền nam của quốc gia.\n\nĐể chữa lành tất cả các vết thương và xem xét các xiềng xích ràng buộc chính phủ, một giáo phái lớn của chính quyền đã đề xuất các mức độ thay đổi của các khu vực tự trị, xem xét đề xuất của nó bởi các nhóm thiểu số đại diện khác nhau. Câu hỏi vẫn còn tuy nhiên, liệu các nỗ lực như vậy có đáng giá cho sự cố gắng."
UPC.federalelections.272.a: "Sự thống nhất của quốc gia Trung Hoa sẽ luôn được ưu tiên."
UPC.federalelections.272.b: "Có nhiều dân tộc cấu thành nên Trung Quốc, và mỗi dân tộc đều có giọng nói của họ."

#Election Challenge Events

UPC.federalelections.280.t: "Các Hạt Bầu cử Mục nát"
UPC.federalelections.280.d: "Được dự đoán như một hậu quả của cơ sở hạ tầng dân chủ hiện có không lành mạnh một cách bất thường của Trung Quốc là trạng thái của các hạt bầu cử quốc gia trong cuộc bầu cử. Do thiếu thời gian, hoặc nếu không thì các mưu đồ độc ác và thâm hiểm hơn nhiều của các quan chức địa phương, một sự kết hợp của việc gian lận hình thù hạt bầu cử và các hạt được vẽ kém, hoặc mang tính chính trị, đã thể hiện như một thách thức nghiêm trọng đối với quá trình bầu cử.\n\nĐược gọi là cái gọi là \"Pocket Boroughs\", theo hiện tượng ở Vương quốc Anh những năm 1800, các hạt bầu cử này được vẽ thô bạo để bao gồm một lượng cử cử nhỏ như vậy nhưng cung cấp cùng một ghế như các cử cử lớn hơn hoặc nếu không thì sự cân bằng quyền lực là không cân đối. Trao cho các ông chủ ảnh hưởng không đại diện trong Quốc hội, nhiều nghị sĩ ngồi ghế được bầu bởi chỉ một nắm cử cử so sánh có cùng tiếng nói như một người đại diện cho các mảng lớn nhân dân.\n\nNgoài ra, số lượng cử cử đi bầu thấp đã làm trầm trọng thêm vấn đề. Do tỷ lệ gram biết chữ trung bình, sự phục tùng đối với giới sĩ紳 địa phương hoặc các nhà chính trị được bầu, đa số công dân Trung Quốc nói chung mù chính trị hoặc thờ ơ. Kết quả là, một đa số khổng lồ các hạt nói chung không cạnh tranh, và đã trở nên dễ dàng bị kiểm soát bởi các bè lũ nhỏ của các giới tinh hoa chính trị.\n\nKhi các chiến dịch đã được tiến hành, và các cuộc bầu cử đã diễn ra, không gì có thể thực sự được làm về các hạt được vẽ. Và bất kỳ điều gì được làm chắc chắn sẽ phải được thông qua quốc hội. Hiện tại, Tổng thống có thể gây áp lực lên các ứng cử viên địa phương để chơi công bằng, hoặc nếu không thì, chấp nhận."
UPC.federalelections.280.a: "Chính phủ trung ương phải bước vào để đảm bảo các phiếu bầu công bằng hơn."
UPC.federalelections.280.b: "Thật không may, đó chỉ đơn giản là trò chơi mà tất cả chúng ta phải chơi."

UPC.federalelections.281.t: "Cơn Giãy giụa Cuối cùng của một Cuộc Cách mạng"
UPC.federalelections.281.d: "Đánh bom, ám sát, đột kích du kích, các chiến dịch khủng bố, khởi nghĩa. Tuyên truyền bằng hành động chắc chắn đã không chạy hết khóa học của nó trong \"hòa bình\" Trung Quốc mới. Trên bề mặt, chắc chắn rồi, hoa và chim câu tràn ngập. Nhưng ở các cực đoan, ở các rìa chính trị, rất ít người đã đồng ý chỉ đơn giản sống với cách lịch sử đã được viết. Quá vỡ vụn. Quá tức giận. Những kẻ cực đoan tiếp tục lột tả, và sự giận dữ của họ đã bắt đầu đổ một bóng đen sâu lên các cuộc bỏ phiếu. Và đó không chỉ là Quốc dân đảng, không, các nhóm khác — những kẻ cực đoan của Thanh niên Đảng Trung Hoa — tranh chấp với hệ thống bầu cử.\n\nTuy nhiên chính là Quốc dân đảng những người chứng tỏ mình là nghiêm ngặt nhất, và thành công nhất, trong chiến dịch khủng bố của họ. Hoặc tốt hơn, đó là biểu ngữ họ từng bay. Đáng lo ngại nhất, một lượng lớn không nợ lòng trung thành với KMT hay Đảng Công đoàn Trung Hoa nữa — họ chỉ là những phiến quân độc lập không có nguyên do. Một số đã trở nên quá vỡ mộng với sự thay đổi đến mức họ đã mất bất kỳ sự hiện diện nào của tư tưởng, các chiến dịch của họ là vì ác ý chống lại hệ thống, hoặc đôi khi để tồn tại.\n\nTrong rất nhiều hạt, tình hình đã trở nên quá tồi tệ đến mức các lực lượng an ninh địa phương đã bị áp đảo hoàn toàn. Các hội đồng địa phương đã bắt đầu đề xuất thiết quân luật được phê chuẩn để ít nhất một số hình ảnh của trật tự được khôi phục. Trong quá khứ tuy nhiên, quân đội thực tế đã chạy toàn bộ các khu vực như \"các khu vực dập tắt cướp\" tuy nhiên lại nổi tiếng hơn nhiều vì các sự trả đũa khắc nghiệt làm tức giận và cực đoan hóa nhân dân thay vì kết quả — và thậm chí bắt đầu phủ quyết các ứng cử viên cho cuộc bầu cử, thay thế bằng người của họ.\n\nTuy nhiên dù sao đi nữa, họ tập hợp cho một số \"công lý\". Đình chỉ lệnh xá tội, tiêu diệt quá trình hợp pháp, lệnh nghiêm cấm, bắt giữ tùy tiện. Bất kể điều gì cần thiết để đảm bảo tiêu diệt các băng cướp."
UPC.federalelections.281.a: "\"Các Điều khoản Đặc biệt\" sẽ được áp dụng cho đến khi các tình huống địa phương này giải quyết."
UPC.federalelections.281.b: "Chúng ta không thể trở lại những ngày của các vụ bắt giữ tùy tiện và cưỡng chế biến mất."

UPC.federalelections.282.t: "Sự Thiết lập của các Bộ máy Chính trị"
UPC.federalelections.282.d: "Với một Cộng hòa mới dấy lên các thách thức mới, và trong khi một số chắc chắn là mới những người khác chắc chắn là các con quỷ cũ trong các hình thức mới. Cơ sở hạ tầng chính trị toàn quốc cho tất cả các đảng phần lớn vẫn trong thời kỳ thơ ấu của họ — ngoại trừ có lẽ cho những người Hiến chính và Thanh niên Đảng Trung Hoa — do sự tái tích hợp tương đối gần đây của các tỉnh, và một sự thiếu hụt chung các cuộc bầu cử cạnh tranh trong các năm trước đó, các ông chủ chính trị địa phương thường đã chắt lọc việc giành chiến thắng các cuộc bầu cử trong các hạt của họ xuống thành một khoa học.\n\nCác bộ máy chính trị quyền lực này sử dụng cả các thỏa thuận hậu trường bí mật và chủ nghĩa mua phiếu bầu cử công khai để duy trì hệ thống bảo trợ chính trị của họ, hứa hẹn các chức vụ béo bở có giá trị và sự thông qua các chính sách dân túy để thưởng cho những người trung thành và mua phiếu bầu. Họ cũng đã trở nên thạo trong việc tạo ra một thái độ phân cực khép kín trong cử cử mục tiêu của họ — lùa họ đến các điểm bỏ phiếu hàng loạt thông qua các lời hứa lớn nếu họ chiến thắng, và khơi dậy nỗi sợ hãi về những gì sẽ chạy cuồng nếu họ thua.\n\nMặc dù không nhất thiết là một vấn đề trong tâm trí của một số nhân vật, vấn đề với một hệ thống như vậy là nó thực tế tự duy trì, và khó điều chỉnh. Chừng nào một cỗ máy có thể tiếp tục giành chiến thắng các cuộc đua then chốt, và không làm phá sản các chính quyền địa phương thông qua chính sách, họ có thể tiếp tục gần như vô thời hạn. Nó cũng đã khơi dậy một lượng lớn chủ nghĩa bộ lạc và tham nhũng, làm tăng nhận thức trong số các cử cử nghèo hơn rằng nền dân chủ bị gian lận, và trong số các cử cử giàu có hơn rằng nền dân chủ chỉ đơn thuần là sự cướp phá có tổ chức các quỹ công.\n\nThực tế, nó khá khó khăn để thậm chí ép buộc các cuộc đua cạnh tranh — bạn có thể nện vào chính sự tham nhũng thực sự nhưng việc đánh bại cỗ máy chính trị đòi hỏi một cỗ máy lớn hơn để ép họ ra ngoài, một chu kỳ tự thực hiện. Và ngay cả khi đó, kết quả là một lượng lớn các cỗ máy nhỏ hơn chỉ đơn giản sẽ căn chỉnh với sinh vật lớn hơn thay vì bị thay thế bởi họ."
UPC.federalelections.282.a: "Chúng ta thực sự cần phải làm rung chuyển hệ thống, bằng cách này hay cách khác!"
UPC.federalelections.282.b: "Họ luôn bỏ phiếu theo lời kêu gọi của đảng của họ, và không bao giờ nghĩ đến việc tự suy nghĩ cho mình!"

UPC.federalelections.290.t: "Thiếu Mù chữ, và Ít Truyền thống Dân chủ"
UPC.federalelections.290.d: "Mặc dù khó định lượng nếu không có một cuộc điều tra dân số vững chắc, nạn mù chữ ở Trung Quốc từ lâu đã là một vấn đề cốt yếu — đa số quần chúng khó có thể đọc chứ đừng nói đến viết. Khả năng tiếp cận giáo dục công lập cũng từ lâu đã không phổ biến, và các tỉnh khác nhau cùng với ngay cả các hạt có các tiêu chuẩn khác nhau và các mức độ tài trợ, hoặc chất lượng. Đủ để nói, nó có thể mất nhiều thế hệ để giáo dục hoàn toàn quốc gia.\n\nĐiều này không có nghĩa là nó là một vấn đề mới, cuộc đấu tranh chống lại nạn mù chữ và việc mang giáo dục đến cho quần chúng đã là một tiếng kêu tập hợp lớn từ các nhà cải cách trên khắp đất nước và phổ chính trị từ lâu. Khái niệm rằng Trung Quốc sẽ không bao giờ được hiện đại hóa cho đến khi nhân dân của nó được giáo dục đương nhiên khá hấp dẫn đối với các nhà trí thức-sĩ phu flanking bộ máy quan liêu của Trung Quốc.\n\nNhiều nỗ lực cải cách đã được thử: mở rộng khả năng tiếp cận giáo dục công lập bắt buộc cho trẻ em, việc cung cấp các khóa học giáo dục người lớn vào ban đêm. Tuy nhiên sự thiếu hụt tài chính, chiến tranh, sự gián đoạn, và bản chất có vẻ nghi ngờ của giáo dục vượt quá một điểm nhất định (do khả năng không thể cho những người có giáo dục cao hơn tìm kiếm việc làm) so với việc ngay lập tức gia nhập các ngành nghề đã làm cản trở các nỗ lực.\n\nVượt ra ngoài điều đó, mù chính trị còn tồi tệ hơn. Trung Quốc kiên quyết chưa bao giờ thực sự có một truyền thống chính trị dân chủ mặc dù những nỗ lực bởi các trí thức khác nhau để tranh luận nó luôn có. Các cuộc bầu cử, kể từ năm 1912, đã luôn bị chi phối bởi các giới tinh hoa (cùng các giai cấp sản xuất ra giới trí thức), và trong khi điều đó được cho là trường hợp ở những nơi khác, có một sự thiếu hụt đáng chú ý về sự tham gia chính trị có ý nghĩa bởi người dân bình thường ở Trung Quốc. Một lượng lớn quần chúng không hiểu sức mạnh của phiếu bầu, hoặc ý nghĩa của các ứng cử viên, chỉ đơn thuần bỏ phiếu dựa trên mong muốn của địa chủ của họ.\n\nRõ ràng sự thay đổi mang tính hệ thống sẽ là một nhiệm vụ khó khăn — người ta có thể đầu tư vào việc nâng cao người dân bình thường như các nhà cải cách nói, nhưng điều đó chỉ đơn thuần là một biện pháp tạm thời. Và càng nhiều thời gian bị lãng phí, quần chúng càng kéo đến KMT và các lời kêu gọi của họ đối với tâm hồn của quần chúng."
UPC.federalelections.290.a: "Có lẽ một số \"giáo dục chính trị\" phút cuối là phù hợp."
UPC.federalelections.290.b: "Dân chủ là vì nhân dân, nhưng một ai đó khác phải làm việc suy nghĩ."

UPC.federalelections.291.t: "Các Lực lượng Bán quân sự và Trò chơi Chính trị"
UPC.federalelections.291.d: "Đó đã là một truyền thống không chính thức trong giới tinh hoa chính trị Trung Quốc để tham gia vào việc sản xuất và thuê mướn dân quân địa phương và khu vực kể từ sự suy tàn của nhà Thanh. Trong sự vắng mặt của thẩm quyền trung ương, các chính quyền địa phương không nghi ngờ gì đã đứng lên để bảo vệ lợi ích của họ, và trong một ống kính quan điểm lạc quan, bảo vệ các đồng nghiệp công dân của họ. Một trạng thái sự vụ như vậy đã tiếp tục thông qua thời đại quân phiệt và đi vào cộng hòa mới.\n\nMột số tiểu đoàn phục vụ nhu cầu của họ một cách tận tụy và cho mục đích hợp pháp, chẳng hạn như an ninh để bảo vệ các vật có giá trị, dân quân làng để đẩy lùi cướp bóc, và hiệu quả các lực lượng cảnh sát địa phương. Nhưng một lượng lớn bên ngoài tập hợp này tương tự nhân đôi như các vệ sĩ cá nhân cho những người giàu có, những kẻ phá bãi công chống lại các công đoàn đô thị và các hiệp hội nông dân nông thôn, những kẻ thực thi chống lại các con nợ. Như một kết quả của sự giải ngũ, một lượng lớn lính giờ đây trở về nhà vật lộn để tìm kiếm việc làm do thiếu các kỹ năng, và chấn thương; và vì vậy lời kêu gọi tự nhiên của họ dẫn đến việc trở thành cướp, hoặc những kẻ cướp tôn vinh trên bảng lương của một giới tinh hoa.\n\nVới một quốc gia quy mô như Trung Quốc, thực tế khá khó khăn để chiến đấu với vấn đề này về mặt pháp lý. Và đàng đàng, khi thời gian bầu cử lăn quanh, các nhà chính trị địa phương trở nên khá thích sử dụng các lực lượng bán quân sự của họ để làm lợi thế cho họ — đe dọa các nhà hoạt động chính trị đối thủ, đột kích trụ sở của đối thủ, và bắt cóc các cá nhân dưới cái màng của nạn cướp bóc không pháp luật.\n\nĐiều này đã dẫn đến một màng bọc không bao giờ kết thúc của bạo lực chu kỳ. Tất cả các điều đáng lo ngại hơn liên quan đến nền dân chủ non trẻ của Trung Quốc, làm tổn hại đến nhận thức của nó trên quốc tế và ở nhà."
UPC.federalelections.291.a: "Pháp luật phải bước vào để bảo vệ tính nguyên vẹn của các cuộc bầu cử của chúng ta!"
UPC.federalelections.291.b: "Chiến đấu với những lính đánh thuê này sẽ chỉ làm mọi thứ tồi tệ hơn."

UPC.federalelections.292.t: "Các Bê bối Tham nhũng Làm Rung chuyển các Cuộc Bầu cử"
UPC.federalelections.292.d: "Kể từ các cuộc đàm phán dẫn đến sự kết thúc của Triều đại Nhà Thanh, và sự thực thi của Việt Nam Bắc Dương, tham nhũng và chủ nghĩa thân hữu đã đi tay trong tay với chính trị Trung Quốc. Và dĩ nhiên, trước đó, Triều đình Nhà Thanh và các chính quyền địa phương tràn ngập các thỏa thuận tự lợi và các vụ đánh cược chống lại cả sự tiến bộ và sự tử tế. Ngay cả sau bản chất trắng trợn khét tiếng của nó trong Thời đại Quân phiệt Cao cấp, và đặc biệt là việc \"Mua Quốc hội\" của Tào Côn, nhân dân Trung Quốc vẫn gầm lên với sự phẫn nộ trước các bê bối khác nhau xuất hiện — đặc biệt là khi Chủ nghĩa Liên bang tự phác họa mình khác biệt so với Cộng hòa cũ.\n\nThan ôi, các tội lỗi của người cha vẫn luôn hiện diện. Ăn hối lộ, hay đúng hơn, sự sử dụng không thật thà thẩm quyền của một nhà chính trị cho lợi ích cá nhân, vẫn còn lớn; giao dịch nội gián, và sự sử dụng vị trí chính trị của họ để phục vụ các lợi ích tư nhân như chi phí của công chúng. Tiền lót tay cũng vậy, hiện lên lớn, trong đó các nghị sĩ và quan chức địa phương đã báo cáo nhận hối lộ để kích hoạt các công ty khác nhau tiếp cận các lợi ích bổ sung. Tồi tệ nhất của tất cả, hoạt động hành lang đã bước vào thời hoàng kim của nó — khá gần đây một tập hợp các \"chú\" đã nhận một loạt bao thư đỏ từ các \"cháu\" của họ trong văn phòng.\n\nCác sự ưu ái chính trị chạy cuồng, các vị trí chỉ có giá trị bằng lợi ích của họ đối với các lợi ích bóng tối đằng sau hậu trường, và cảnh chính trị chung đã phát triển thành một cảnh của chủ nghĩa lý tưởng thích hợp và sự quan tâm chân chính cho cái tốt chung giữa một biển chính trị sòng phẳng: gãi lưng tôi, và tôi sẽ gãi lưng bạn. Với các cuộc bầu cử đang diễn ra tốt đẹp, bất kỳ chuỗi bê bối tham nhũng hồ sơ cao nào cũng có thể đe dọa nhận thức và tính hợp lệ của nền dân chủ non trẻ của Trung Quốc."
UPC.federalelections.292.a: "Chúng ta sẽ làm một tấm gương từ những kẻ vi phạm tồi tệ nhất."
UPC.federalelections.292.b: "Đôi khi chúng ta cần chấp nhận rằng đây chỉ là cách chính trị vận hành."

UPC.federalelections.293.t: "Sự Tước quyền cử cử và Sự Vỡ mộng"
UPC.federalelections.293.d: "Trong khi Cộng hòa tự giữ mình đến các lý tưởng của quyền bầu cử phổ thông bao trùm tất cả, vì đó là những gì rất nhiều người đã đổ máu và hy sinh, thực tế ít hơn nhiều so với lý tưởng đó. Với các cuộc bầu cử tiếp theo, nó đã trở nên brutal rõ ràng rằng không phải mọi công dân đều được phép bỏ phiếu một cách khả thi trong thực tế. Đặc biệt là ở các khu vực vẫn giữ lại một số hình thức sự hiện diện quân sự, hoặc nếu không được ghi chú là các pháo đài của \"kẻ thù\".\n\nRất nhiều nhà chính trị dẫn đầu cũ của các phe phái bị đánh bại — Uông Tinh Vệ, Trương Học Lương, Bạch Kiến Vũ — đã có các ấn phẩm và ý kiến của họ bị kiểm duyệt, hoặc nếu không dwelt trong sự quản thúc tại gia nghiêm ngặt, nếu không phải trong sự lưu vong. Xa hơn nữa, bất kỳ hoạt động chính trị nào của các phe phái bị đánh bại thường bị cắt giảm dưới tay quân sự, và một số thậm chí bị cấm trắng trợn chạy đua cho văn phòng ngay từ đầu. Trong các trường hợp đặc biệt cực đoan, toàn bộ các xóm giềng bị ngăn chặn một cách hệ thống khỏi việc bỏ phiếu hoặc tổ chức chính trị bởi các chính quyền Liên bang.\n\nTrong khi điều này có khả năng cần thiết để giữ chủ nghĩa cực đoan ở vị trí vịnh, khi bạn thực sự xem xét ai thường ở đầu nhận như các mục tiêu của các sự trừng phạt chính trị này (những người xã hội chủ nghĩa và các quân phiệt), nhiều người trong số nói trên thực sự phổ biến trong nhân dân. Một số người trong phe đối lập đang bắt đầu đả kích sự vượt quá trắng trợn của chính phủ để bảo vệ bức bình phong của nền dân chủ."
UPC.federalelections.293.a: "Chúng ta có thể thử nghiệm dỡ bỏ một số hạn chế này."
UPC.federalelections.293.b: "Các hạn chế này giữ cho chính trị là một sự vụ quân tử."

UPC.federalelections.300.t: "Ném Bùn và Tuyên truyền"
UPC.federalelections.300.d: "Như khá rõ ràng một cách đau đớn, một mảng đáng kể dân số Trung Quốc là những người mù chữ, những người lao động và công nhân khiêm tốn mà các cơ hội giáo dục đã quản lý để né tránh. Nhưng điều đó không có nghĩa là thông tin không thể lan rộng như lửa rừng. Như đã được chứng minh trong các cuộc chiến thống nhất, tuyên truyền, nếu được áp dụng và biên tập chính xác, là một công cụ hiệu quả một cách tàn bạo — các áp phích dựa trên hình ảnh, tin đồn, và thậm chí các kịch bản cùng với bài hát và bài thơ có thể nhanh chóng phổ biến các thông điệp chính trị trên khắp quần chúng.\n\nTương tự như vậy trong số các giai cấp có giáo dục hơn, các bài xã luận trong các tờ báo, tạp chí, và các ấn phẩm khác kích hoạt các trí thức cân nhắc về chính trị — với sự phát triển khối lớn của công nghệ radio, khía cạnh này của trò chơi phổ biến thông tin đã phát triển tất cả các quan trọng hơn. Ngay cả khi nó vẫn giữ lại vóc dáng tương đối nhỏ của nó so với sự phổ biến của nó.\n\nVà điều này mang chúng ta đến vấn đề cấp bách. Vai trò chúng ta nên đóng trong cuộc chiến thông tin. Nếu chúng ta từ chối tham gia vào một chiến dịch chống lại đối thủ của chúng ta, đó là điều không thể tránh khỏi rằng họ sẽ nắm lấy sáng kiến và xông lên phía trước. Tuy nhiên, nếu chúng ta nói xấu các đối thủ của chúng ta, nó phục vụ cho việc làm hỏng hệ thống dân chủ mà chúng ta đã làm việc chăm chỉ để bảo vệ và thiết lập."
UPC.federalelections.300.a: "Chúng ta có thể thử nghiệm dỡ bỏ một số hạn chế này."
UPC.federalelections.300.b: "Các hạn chế này giữ cho chính trị là một sự vụ quân tử."

UPC.federalelections.301.t: "Các Vụ kiện Bầu cử được Nộp"
UPC.federalelections.301.d: "Có vẻ như sự nhỏ mọn không biết đến ranh giới, và tiến lên một cách không ngừng nghỉ như hệ thống dân chủ làm. Đôi khi, các cá nhân đặc biệt bất mãn và thua cuộc bầu cử nộp một vụ kiện tòa án tuyên bố các cuộc bầu cử đã được, cho tất cả các mục đích và mục tiêu, tiến hành một cách gian lận. Một vấn đề như vậy không phải là không quen thuộc ngay cả trong các nền dân chủ lành mạnh nhất.\n\nKhăng khăng rằng các quy tắc bầu cử không được thực thi công bằng, rằng phía bên kia đã tiến hành thu hoạch phiếu bầu, nhồi thùng phiếu, can thiệp vào phiếu bầu, gian lận phiếu bầu, và tất cả các tập hợp nghiêm trọng khác của các vi phạm nghiêm trọng chống lại hệ thống dân chủ. Kết quả là, cánh tư pháp vốn đã vất vả của Cộng hòa phải lội qua một lượng lớn các báo cáo ít hơn chân chính về gian lận bầu cử giữa các trường hợp chân thành khác — và nói chung các hạt đối mặt với nhiều cuộc tái bầu cử cho đến khi nó cuối cùng được coi là công bằng theo pháp luật.\n\nVà tuy nhiên lần này, các cá nhân đã bắt đầu nộp các yêu cầu gian lận bầu cử từ trước cuộc bầu cử của họ, chứng tỏ là cực kỳ tức giận cho bất kỳ và tất cả các quan chức liên quan. Để điều tra trước khi các phiếu bầu thậm chí đã bắt đầu sẽ không thể tránh khỏi có nghĩa là lội vào ngọn lửa địa ngục dự kiến, tuy nhiên không điều điều tra sẽ có nghĩa là những kẻ xúi giục sẽ có thể diễu hành và tập hợp chống lại \"bất công\" của hệ thống."
UPC.federalelections.301.a: "Một ủy ban bầu cử được gửi đến để điều tra."
UPC.federalelections.301.b: "Các hạn chế này giữ cho chính trị là một sự vụ quân tử."

UPC.federalelections.302.t: "Các Trò bẩn"
UPC.federalelections.302.d: "Ngoài tham nhũng sau bầu cử, và sự sản xuất và phát triển quy mô lớn các bộ máy chính trị, các ứng cử viên chính trị quy mô nhỏ thường đã bắt đầu tham gia vào một loạt các chiến thuật ít hơn lý tưởng khi mắt của các chính quyền bỏ sót. Tống tiền các đối thủ chính trị, hối lộ các lãnh đạo địa phương cho sự xác nhận, đây chỉ là bề mặt của ngọn núi toàn bao bọc của các trò bẩn mà các nhà chính trị tiềm năng đã bắt đầu kéo.\n\nTrong một số trường hợp, các cá nhân đã bị bắt quả tang hối lộ cử cử xuất hiện tại các điểm bỏ phiếu, hoặc cung cấp phương tiện vận chuyển cho những người ủng hộ. Thậm chí đã có các trường hợp cử cử bị giám sát khi họ rời khỏi các phòng bỏ phiếu, och sự lan rộng nhất trí các lời nói dối và nói xấu về các đối thủ chính trị."
UPC.federalelections.302.a: "Chúng ta cần thực thi các quy tắc chiến dịch nghiêm ngặt hơn!"
UPC.federalelections.302.b: "Tất cả đều công bằng trong chính trị."

#Warlord Campaign Events

UPC.federalelections.310.t: "[FROM.GetNameDefCap] Ủng hộ GRA!"
UPC.federalelections.310.d: "Sự thống nhất của quốc gia không bao giờ là một nhiệm vụ đặc biệt đơn giản để hoàn thành, và ngay cả khi kết luận về mặt chức năng, nhiều cá nhân có tư tưởng độc lập sống trong quốc gia chúng ta. Thông qua việc thực hiện quyền tự trị của họ ở nhà, họ đã trở nên ngạc nhiên có khả năng ảnh hưởng đến các cuộc bầu cử vừa được tuyên bố của quốc gia. Với tư cách là các quan chức trong cộng hòa Liên bang, hoặc nếu không, họ đã bắt đầu đặt toàn bộ trọng lượng chính trị của họ đằng sau ứng cử viên được chọn của họ.\n\nTrong một sự kiện chiến dịch gần đây cho Liên minh Đại Cộng hòa, [FROM.GetLeader] đã xuất hiện như một khách mời đặc biệt trên sân khấu. Nắm giữ một bài phát biểu sôi nổi, họ đã tuyên bố công khai sự ủng hộ hoàn toàn của họ cho GRA. Khăng khăng về tầm nhìn của GRA cho cộng hòa Liên bang như là lựa chọn khả thi duy nhất, họ đã dự đoán một lượng lớn sự ủng hộ bầu cử xoay theo hướng của GRA."
UPC.federalelections.310.a: "Họ tự đặt mình tách biệt khỏi phần còn lại!"
UPC.federalelections.310.b: "Dân chủ hay không, chúng ta không thể dung thứ cho việc vận động hành lang."

UPC.federalelections.311.t: "[FROM.GetNameDefCap] Ủng hộ CDL!"
UPC.federalelections.311.d: "Sự thống nhất của quốc gia không bao giờ là một nhiệm vụ đặc biệt đơn giản để hoàn thành, và ngay cả khi kết luận về mặt chức năng, nhiều cá nhân có tư tưởng độc lập sống trong quốc gia chúng ta. Thông qua việc thực hiện quyền tự trị của họ ở nhà, họ đã trở nên ngạc nhiên có khả năng ảnh hưởng đến các cuộc bầu cử vừa được tuyên bố của quốc gia. Với tư cách là các quan chức trong cộng hòa Liên bang, hoặc nếu không, họ đã bắt đầu đặt toàn bộ trọng lượng chính trị của họ đằng sau ứng cử viên được chọn của họ.\n\nTrong một sự kiện chiến dịch gần đây cho Đồng minh Dân chủ Trung Hoa, [FROM.GetLeader] đã xuất hiện như một khách mời đặc biệt trên sân khấu. Nắm giữ một bài phát biểu sôi nổi, họ đã tuyên bố công khai sự ủng hộ hoàn toàn của họ cho CDL. Khăng khăng về tầm nhìn của CDL cho cộng hòa Liên bang như là lựa chọn khả thi duy nhất, họ đã dự đoán một lượng lớn sự ủng hộ bầu cử xoay theo hướng của CDL."
UPC.federalelections.311.a: "Tất cả tiến lên vì một tương lai Trung Hoa mới!"
UPC.federalelections.311.b: "Rõ ràng họ quên mất chính mình. Hãy nhắc nhở họ về vị trí của họ."

UPC.federalelections.312.t: "[FROM.GetNameDefCap] Ủng hộ những người Tự do!"
UPC.federalelections.312.d: "Sự thống nhất của quốc gia không bao giờ là một nhiệm vụ đặc biệt đơn giản để hoàn thành, và ngay cả khi kết luận về mặt chức năng, nhiều cá nhân có tư tưởng độc lập sống trong quốc gia chúng ta. Thông qua việc thực hiện quyền tự trị của họ ở nhà, họ đã trở nên ngạc nhiên có khả năng ảnh hưởng đến các cuộc bầu cử vừa được tuyên bố của quốc gia. Với tư cách là các quan chức trong cộng hòa Liên bang, hoặc nếu không, họ đã bắt đầu đặt toàn bộ trọng lượng chính trị của họ đằng sau các ứng cử viên được chọn.\n\nTrong một chuỗi các sự kiện chiến dịch gần đây cho [UPC_GetDCPPartyName_nocolour_long] và các Nhà Cộng hòa Độc lập khác nhau, [FROM.GetLeader] đã xuất hiện nhiều lần như một khách mời đặc biệt trên sân khấu. Nắm giữ một chuỗi các bài phát biểu sôi nổi, họ đã tuyên bố công khai sự ủng hộ hoàn toàn của họ cho cả [UPC_GetDCPPartyName_nocolour], Phấn Đấu, Chính trị Học, và các phe phái khác. Khăng khăng về nhiều tầm nhìn tự do của họ cho cộng hòa Liên bang như là lựa chọn khả thi duy nhất, họ đã dự đoán một lượng lớn sự ủng hộ bầu cử xoay theo hướng của những người tự do."
UPC.federalelections.312.a: "[FROM.GetLeader] Đứng về phía Dân chủ!"
UPC.federalelections.312.b: "Phản công các nỗ lực của họ bằng nỗ lực của chính chúng ta."

UPC.federalelections.313.t: "[FROM.GetNameDefCap] Ủng hộ Chủ nghĩa Khu vực!"
UPC.federalelections.313.d: "Sự thống nhất của quốc gia không bao giờ là một nhiệm vụ đặc biệt đơn giản để hoàn thành, và ngay cả khi kết luận về mặt chức năng, nhiều cá nhân có tư tưởng độc lập sống trong quốc gia chúng ta. Thông qua việc thực hiện quyền tự trị của họ ở nhà, họ đã trở nên ngạc nhiên có khả năng ảnh hưởng đến các cuộc bầu cử vừa được tuyên bố của quốc gia. Với tư cách là các quan chức trong cộng hòa Liên bang, hoặc nếu không, họ đã bắt đầu đặt toàn bộ trọng lượng chính trị của họ lên việc bảo vệ sự độc lập của họ.\n\nTrong một sự kiện công khai gần đây được tổ chức tại tỉnh nhà của họ, [FROM.GetLeader] đã tuyên bố sự thất bại của Cộng hòa Liên bang trong việc đáp ứng các nhu cầu của nhân dân tỉnh của họ. Khăng khăng về sự độc lập của chính quyền của họ cho sự bảo vệ Chủ nghĩa Liên bang, họ đã dự đoán một sự gia tăng lớn trong tâm lý chủ nghĩa khu vực trên toàn quốc."
UPC.federalelections.313.a: "Và vì vậy họ thể hiện bộ mặt thực sự của họ..."
UPC.federalelections.313.b: "Chủ nghĩa Khu vực KHÔNG PHẢI là Chủ nghĩa Liên bang."

UPC.federalelections.314.t: "[FROM.GetNameDefCap] Ủng hộ những kẻ Cực đoan!"
UPC.federalelections.314.d: "Sự thống nhất của quốc gia không bao giờ là một nhiệm vụ đặc biệt đơn giản để hoàn thành, và ngay cả khi kết luận về mặt chức năng, nhiều cá nhân có tư tưởng độc lập sống trong quốc gia chúng ta. Thông qua việc thực hiện quyền tự trị của họ ở nhà, họ đã trở nên ngạc nhiên có khả năng ảnh hưởng đến các cuộc bầu cử vừa được tuyên bố của quốc gia. Với tư cách là các quan chức trong cộng hòa Liên bang, hoặc nếu không, họ đã bắt đầu đặt toàn bộ trọng lượng chính trị của họ đằng sau các kẻ cực đoan khác nhau.\n\nTrong một sự kiện công khai gần đây được tổ chức tại tỉnh nhà của họ, [FROM.GetLeader] đã tuyên bố sự thất bại của triển vọng cải cách của Cộng hòa Liên bang. Khăng khăng về sự ưu tiên của cuộc cách mạng tiếp tục và sự thay đổi cực đoan, họ đã dự đoán một sự gia tăng lớn trong tâm lý cách mạng trên toàn quốc."
UPC.federalelections.314.a: "Bị bao bọc cả bên trái và bên phải..."
UPC.federalelections.314.b: "Họ không thể làm điều đó! Dừng họ lại hoặc làm điều gì đó!"

UPC.federalelections.315.t: "[UPC.GetNameDefCap] Từ chối sự Tiến lên của Chúng ta!"
UPC.federalelections.315.d: "Bất chấp việc đặt áp lực chính trị dữ dội lên [UPC.GetNameDefCap] và cố gắng ảnh hưởng đến chiến dịch bầu cử quốc gia, có vẻ như Chính phủ Trung ương đã có các quan niệm khác về những gì nền dân chủ của họ sẽ biểu thị. Thông qua các phương tiện khác nhau, cả hợp pháp và ít hơn lý tưởng, Chính phủ Trung ương đã đóng cửa các nỗ lực của chúng ta để tập hợp sự ủng hộ cho ứng cử viên được chọn của chúng ta. Khăng khăng về bản chất \"phi dân chủ\" mà [ROOT.GetLeader] đã cố gắng ảnh hưởng đến chiến dịch, họ đã trở nên đặc biệt cảnh giác chống lại các sự tiến lên xa hơn, ít nhất là trong một thời gian."
UPC.federalelections.315.a: "Họ có vẻ từ chối nền dân chủ của chính họ!"

UPC.federalelections.600.t: "Kêu gọi một Hội nghị Hiến pháp"
UPC.federalelections.600.d: "Trong những ngày cuối cùng của nhà Thanh, Trung Quốc đã tìm thấy những nỗ lực đầu tiên đối với chủ nghĩa hiến định thông qua các cải cách cực đoan của Lương Khải Siêu trong Bách Nhật Duy Tân. Lương kêu gọi chế độ quân chủ hiến định, thông qua chủ nghĩa tư bản và bước ra khỏi chủ nghĩa phong kiến, kết thúc hệ thống khoa cử đế quốc, và các chế độ chính phủ hiện đại. Tuy nhiên, các cải cách cực đoan này sẽ bị đè bẹp bởi Từ Hi Thái hậu. Cách mạng Tân Hợi năm 1911 đã thiết lập một hiến pháp tạm thời được mô phỏng theo hiến pháp Pháp. Sau sự phục hồi đế quốc thất bại và cái chết của Viên Thế Khải, Quảng Châu và Bắc Kinh vẫn mâu thuẫn, mặc dù cả hai ban đầu tuân thủ Hiến pháp 1912.\n\nNăm 1923, Tào Côn đã tạo ra Hiến pháp của riêng mình, vốn được coi là một hiến pháp rất rộng lớn và tiến bộ, mặc dù chỉ có các quân phiệt Trực Hệ ban đầu tuân thủ nó. Hiến pháp của Tào đã cố gắng mở rộng một cành ô liu tới Đường Kế Nghiêu, nhưng các mối quan hệ đã giảm sâu sắc khi Tào bãi nhiệm Lý Nguyên Hồng để tự mình trở thành tổng thống. Ở miền Nam, Triết Giang và Hồ Nam đã dẫn dắt cuộc tranh chấp trong sự ban hành Hiến pháp, dựa chúng trên Hiến pháp Mỹ vốn cố gắng thiết lập các biến thể riêng của họ về nền dân chủ địa phương. Với việc Trung Quốc cuối cùng đã được thống nhất lần đầu tiên trong nhiều thập kỷ, một Hội nghị Hiến pháp đã được kêu gọi bởi [ROOT.GetLeader].\n\nTuy nhiên, với nhiều người tham gia từ khắp Trung Quốc, nhiều người không đồng ý về những gì triển vọng tương lai của Hiến pháp mới này nên là. Nhiều người từ miền Bắc kêu gọi sử dụng Hiến pháp 1912 và 1923 làm hướng dẫn, dẫn ra sự thất bại của họ xuất phát từ chủ nghĩa quân phiệt thay vì các vấn đề cấu trúc. Nhiều người trong số những người theo đuổi cốt lõi của [ROOT.GetLeader], cũng như những người theo Chủ nghĩa Liên bang miền Nam khác đang kêu gọi một Hiến pháp mới lấy cảm hứng từ Hiến pháp Tỉnh đã chứng tỏ bảo vệ sự đa nguyên trên một quy mô nhỏ hơn, dẫn ra một nhu cầu phá vỡ với các khuynh hướng chuyên chế của Bắc Kinh. Trong khi không tích hợp vào sự hình thành của Hiến pháp mới, các đường ranh giới được vẽ trong cát này là một sự khởi đầu không lành bệnh cho những gì sắp đến."
UPC.federalelections.600.a: "Chính là ánh sáng ở miền Nam sẽ hướng dẫn tương lai của chúng ta!"
UPC.federalelections.600.b: "Chúng ta đã chiến đấu để chuộc lại các lời hứa của Tân Hợi."

UPC.federalelections.601.t: "Đàm phán một Liên bang Trung Hoa"
UPC.federalelections.601.d: "Câu hỏi quan trọng nhất đang được tranh luận là mối quan hệ giữa chính phủ liên bang và các tỉnh của nó. Các triều đại Trung Quốc theo lịch sử mang tính chất trung ương tập quyền trong tư tưởng, mặc dù các chính quyền địa phương tận hưởng các mức độ tự trị thay đổi. Tất cả đều đồng ý về nhu cầu trao quyền cho các hạt và khu vực địa phương, nhưng vai trò của các tỉnh bị tranh chấp nóng hổi hơn. Hiến pháp Tào Côn 1923 bề ngoài có các điều khoản cho sự tự trị liên bang, nhưng đồng thời thất bại trong việc kiểm soát các tỉnh hoặc tôn trọng quyền tự do của họ.\n\nTrong những năm 1920, sự đồng thuận chung là các tỉnh khác nhau nên dự thảo các hiến pháp của riêng họ và sau đó làm việc cùng nhau để dự thảo một hiến pháp quốc gia. Điều này dẫn đến các đề xuất phân quyền, với các nhân vật như Trương Thái炎 thường xuyên khuyên một bang liên lấy cảm hứng vô chính phủ cận ranh giới. Những người khác như Đường Kế Nghiêu, FCDP, và hầu hết các đảng miền bắc ưu ái một mô hình kiểu Tào Côn: một chính phủ trung ương mạnh mẽ với một số quyền tỉnh. Nhiều người, như Trần Quýnh Minh, ở giữa - tìm kiếm một mô hình chia sẻ quyền lực thực dụng. Kể từ thời hoàng kim Liên bang, nhiều người khác đã chuyển dịch vị trí của họ.\n\nSự diễn giải này thâm nhập vào hầu như mọi thứ, thiết lập tông giọng cho sự phân phối quyền lực chung giữa cộng hòa và các tỉnh của nó trong hiến pháp. Chẳng hạn, Việt Nam Bắc Dương mang tính lưỡng viện. Thượng viện được bầu bởi và đại diện cho các hội đồng tỉnh và Hạ viện đại diện cho nhân dân. Một số ít đã kêu gọi một cơ quan lập pháp đơn viện, một sự nhắc nhở rằng nhiều người đã tham gia Quảng Châu vì các lời hứa dân chủ của nó và vẫn nghi ngờ về chủ nghĩa khu vực.\n\nCuối cùng, câu trả lời cho câu hỏi này về quyền tự trị tỉnh sẽ hướng dẫn những người dự thảo hướng tới việc thiết lập một sự tiếp tục của Cộng hòa Trung Hoa cũ hoặc có thể cố gắng tạo ra một chính phủ hoàn toàn mới: Các Tỉnh Thống nhất Trung Hoa. Ở đỉnh điểm của phong trào Liên bang, các đại biểu từ khắp Trung Quốc hoàn thiện bản sắc của nó."
UPC.federalelections.601.a: "Chúng ta đã luôn tìm cách xây dựng một Bắc Dương chưa từng tồn tại."
UPC.federalelections.601.b: "Phong trào của chúng ta đã luôn là về một điều gì đó vĩ đại hơn!"

UPC.federalelections.602.t: "Quốc hội"
UPC.federalelections.602.d: "Trên khắp hầu hết Hội nghị Hiến pháp, nhiều người đã gán cho nhu cầu cho một cơ quan lập pháp mạnh mẽ và có khả năng. Quốc hội Bắc Dương từng được coi là một cơ quan tiến bộ có khả năng ban hành cải cách quét rộng khẩn thiết cần thiết để khôi phục Trung Quốc về vị thế đúng đắn của nó như một Cường quốc trên thế giới. Thật không may, quá nhiều sự can thiệp quân phiệt với quá trình lập pháp đã dẫn đến việc cơ quan này mất đi tính hợp pháp rộng rãi và bị coi là một con dấu cao su nhiều hơn. Quốc hội mới này của Cộng hòa sẽ được nhân sự với các thành viên được bầu bởi các hội đồng địa phương hoặc các cơ quan bầu cử tùy thuộc vào pháp luật địa phương, và sẽ hỗ trợ Tổng thống trong việc làm việc hướng tới một Trung Quốc tốt đẹp hơn.\n\nVới Quốc hội phần lớn được quyết định, nhiều người đã dấy lên các câu hỏi về sự đại diện đặc biệt cho các nhóm chưa được đại diện đúng mức. Quả thực, Trung Quốc làm chủ nhà cho một tập hợp đa dạng các dân tộc thiểu số, từ người Duy Ngô Nhĩ ở Lưu vực Tarim đến người Mông Cổ ở Sa mạc Gobi đến người Tây Tạng ở Himalaya. Sự đại diện của phụ nữ cũng đã được đưa ra, vì mặc dù phụ nữ đại diện cho một nửa Trung Quốc, trung nguyên theo truyền thống đã là một xã hội của sự thống trị gia trưởng và sự ngoài lề hóa phụ nữ. Một số người đã đề xuất phân bổ các ghế được đảm bảo cho các dân tộc thiểu số, cũng như phụ nữ để đảm bảo giọng nói của họ được lắng nghe trong cộng hòa mới.\n\nMột số người cũng đã dấy lên vấn đề về các nghề nghiệp chuyên nghiệp. Trong một xã hội lớn như Trung Quốc, mọi nghề nghiệp đều cần thiết để làm cho đất nước chạy. Nhiều người đã kêu gọi một số ghế được phân bổ cho đại diện của các nghề nghiệp khác nhau để đảm bảo rằng giọng nói của lực lượng lao động giúp hướng dẫn quá trình lập pháp của chính phủ mới. Một số yếu tố nhất định, đặc biệt là các đảng xuất thân từ Liangist, đã đặc biệt nhiệt tình về việc thêm vào sự đại diện nghề nghiệp, dẫn ra nó như một vấn đề có tầm quan trọng quốc gia."
UPC.federalelections.602.a: "Không cần sự đại diện xa hơn cho các dân tộc thiểu số và nghề nghiệp."
UPC.federalelections.602.b: "Quốc gia chúng ta là một quốc gia phức hợp, các dân tộc thiểu số nên có giọng nói của họ được lắng nghe!"
UPC.federalelections.602.c: "Cộng hòa của chúng ta được giữ cùng nhau bởi tất cả các giai cấp xã hội, họ nên có tiếng nói!"
UPC.federalelections.602.e: "Các dân tộc thiểu số có một ghế! Các nghề nghiệp có một ghế! Mọi người đều có một ghế!"

UPC.federalelections.603.t: "Quyền cử cử của Phụ nữ ở Trung Quốc"
UPC.federalelections.603.d: "Văn hóa Trung Hoa, trong khi phần lớn phát triển trong Thời kỳ Xuân Thu của Triều đại nhà Chu, phần lớn đã được củng cố vào thời kỳ Đại Hán. Cùng với đó là sự thiết lập của xã hội gia trưởng Nho gia, vốn thiết lập các chuẩn mực như bó chân, hiện phần lớn bị coi là một sự tàn bạo của Thời kỳ Đế quốc bởi giới tinh hoa chính trị Trung Quốc. Tuy nhiên, xã hội Trung Hoa vẫn giữ tính gia trưởng mạnh mẽ, và phụ nữ thiếu sự bình đẳng chính trị với nam giới.\n\nTrong Hội nghị Hiến pháp, nhiều đảng tiến bộ đã đưa ra quyền cử cử của phụ nữ như một quyền mà hầu hết các quốc gia hiện đại đã thông qua, và nếu Trung Quốc đạt được sự bình đẳng với Phương Tây, thì phụ nữ Trung Hoa cũng phải được giải phóng. Những người khác trong Quốc hội ưu ái một phương pháp thận trọng hơn, thay vào đó kêu gọi quyền cử cử của phụ nữ được quyết định bởi các tỉnh.\n\nCả liên minh bầu cử quốc gia cũng như các đối thủ của họ đã chỉ ra Hiến pháp Quảng Đông và Hồ Nam như các ví dụ, với phong trào bầu cử sử dụng các hiến pháp tỉnh làm nguồn cảm hứng cho một hiến pháp quốc gia, trong khi các đối thủ của họ chỉ ra chúng như các ví dụ của sự liên bang hóa quyền cử cử phụ nữ hoạt động như dự định. Quả thực, nhiều người ở Trung Quốc đã coi quyền cử cử của phụ nữ ở cấp quốc gia là xu hướng hướng tới việc được thiết lập sớm hơn thay vì muộn hơn, nhưng tâm lý như vậy không nhất thiết hoàn toàn hiện diện trong Hội nghị Hiến pháp."
UPC.federalelections.603.a: "Phụ nữ sẽ có thể bỏ phiếu trên khắp Trung Quốc!"
UPC.federalelections.603.b: "Một cuộc chiến cho một ngày khác, hãy để điều đó cho các tỉnh vào lúc này."

UPC.federalelections.604.t: "Quyền lực của Tổng thống"
UPC.federalelections.604.d: "Chức vụ Tổng thống từ lâu đã là một nguồn tranh cãi trong Cộng hòa Trung Hoa. Mặc dù sự ưu tiên của Quốc hội đã được thiết lập bởi Hiến pháp Tạm thời 1912, Viên Thế Khải đã dỡ bỏ Quốc hội năm 1914. Ngay cả khi Hiến pháp được khôi phục năm 1916 bởi Tổng thống Lý Nguyên Hồng và Thủ tướng Đoạn Kỳ Thụy, hai người tiếp tục va chạm về thẩm quyền, với Đoạn cuối cùng chiến thắng. Thẩm quyền Tổng thống đã được tăng lên bởi Hiến pháp Tào Côn 1923 và chính phủ do quân đội chi phối của Trương Tác Lâm tiếp tục xu hướng tập trung quyền lực. Hiến pháp 1923 được khôi phục bởi một Ngô Bội Phu trỗi dậy, nhưng quyền lực chưa bao giờ thực sự rời khỏi tay cơ quan hành pháp.\n\nMặc dù không ai muốn một chế độ độc tài, một số yếu tố nhất định trong Hội nghị ủng hộ cho một chức vụ tổng thống mạnh mẽ, dẫn ra nhu cầu cho sự ổn định. Họ tranh luận rằng các Tổng thống quyền lực là một điều không thể tránh khỏi, và tốt nhất là đảm bảo rằng ít nhất các vai trò của Tổng thống và Thủ tướng được phân định rõ ràng. Sự phê chuẩn từ cả hai sẽ là cần thiết để ký ban hành luật thành luật, mặc dù bên sau vẫn có thể đẩy qua luật pháp với đa số 2/3. Tổng thống sẽ đại diện cho Trung Quốc trên quốc tế, và sẽ được phép kết thúc các hiệp ước với sự ủng hộ của quốc hội. Tuyên bố thiết quân luật cũng sẽ nằm trong tay Tổng thống, mặc dù Quốc hội sẽ phải khẳng định nó để nó được duy trì.\n\nNhững người ủng hộ một cơ quan hành pháp mạnh mẽ đã đóng gói các đề xuất của họ cho một cộng hòa bán tổng thống với các cuộc bầu cử trực tiếp Tổng thống, thay vì mô hình gián tiếp hiện tại qua một đại cử đoàn bao gồm cả hai viện của Quốc hội (Thượng viện và Hạ viện) cũng như các nhóm đại diện khác. Các nghị sĩ thay vào đó sẽ ưu ái làm cho Chức vụ Tổng thống thành một vai trò nghi lễ (hoặc ít nhất giảm đáng kể sức mạnh của nó), và truyền tất cả các quyền lực tổng thống được đề xuất vào Thủ tướng, vốn đổi lại sẽ trao các quyền lực này trong Quốc hội."
UPC.federalelections.604.a: "Chúng ta sẽ bầu các Tổng thống gián tiếp để giữ họ chịu trách nhiệm trước cơ quan lập pháp."
UPC.federalelections.604.b: "Chúng ta cần một chức vụ tổng thống quyền lực cũng như một phiếu bầu phổ thông!"

UPC.federalelections.605.t: "Tư pháp và Quyền công dân"
UPC.federalelections.605.d: "Với các thẩm quyền Lập pháp và Tổng thống được phác thảo, Hội nghị Hiến pháp giờ đây chuyển sang các vấn đề Tư pháp. Trong khi sự khôi phục của Tòa án Tối cao được ủng hộ bởi tất cả, thẩm quyền chính xác của nó vẫn bị tranh chấp. Một số người đã kêu gọi Nhánh Tư pháp được trao quyền Xem xét Tư pháp, cho phép họ là những người giải thích cuối cùng của Hiến pháp.\n\nNhững người khác đã từ chối trao cho Tòa án Tối cao thẩm quyền này, nhìn về Hiến pháp Tào Côn cho tiền lệ. Cũng có một cuộc tranh luận về việc liệu Tư pháp có nên được phép chọn hình phạt của một Tổng thống bị luận tội về cáo buộc phản quốc. Nhiều đại biểu cũng đã đề xuất cho phép Tư pháp trọng tài các tranh chấp giữa các chính quyền tỉnh và Chính phủ Trung ương, trong khi những người khác đã kêu gọi thẩm quyền đó hoặc được trao trong Chức vụ Tổng thống hoặc Cơ quan Lập pháp."
UPC.federalelections.605.a: "Một bộ Tư pháp mạnh mẽ là cần thiết để sự đa nguyên kéo dài!"
UPC.federalelections.605.b: "Một bộ Tư pháp yếu đuối có lợi hơn cho sự ổn định của chính phủ."

UPC.federalelections.606.t: "Hiến pháp Năm [GetYear]"
UPC.federalelections.606.d: "Hội nghị Hiến pháp không phải không có sự cố hay tranh cãi. Quả thực, một số cuộc tranh luận đã trở nên nóng hổi một cách nguy hiểm. Không phải ai cũng thấy các đề xuất của họ được luật hóa, và nhiều người sẽ coi bản dự thảo Hiến pháp là một tài liệu pháp lý không hoàn hảo. Tuy nhiên, sự thỏa hiệp là người chiến thắng cuối cùng của Hội nghị, và Hiến pháp cuối cùng đã thông qua. Còn quá sớm để nói liệu Hiến pháp này sẽ được ghi nhớ như một lực lượng ổn định cho Cộng hòa Liên bang của chúng ta hay nếu nó chỉ là dấu hiệu đầu tiên của những rắc rối chưa đến, nhưng dù sao đi nữa đó là nghĩa vụ của chính phủ từ nay về sau để thực thi tài liệu này như là Luật Tối cao của đất nước."
UPC.federalelections.606.a: "Cầu mong Cộng hòa của chúng ta kéo dài Vạn Năm!"

#Twin Dragons Taming the Water Events

UPC.twindragonevents.001.t: "Một Lời đề nghị từ Nguyên soái"
UPC.twindragonevents.001.d: "Kể từ sau sự sụp đổ của Cách mạng Tân Hợi, Miền Bắc và Miền Nam của quốc gia đã liên tục đưa ra các nỗ lực để bắc cầu qua sự chia rẽ hoành tráng giữa các cảm nhận chung của họ. Vào cuối Tân Hợi, Viên Thế Khải và Tôn Trung Sơn đã gửi các đại diện của họ để ban hành Việt Nam Bắc Dương. Trong Thời đại Quân phiệt, các nhân vật khác nhau đã gặp nhau ngắt quãng để tiến hành các cuộc Đàm phán Hòa bình Nam-Bắc khét tiếng, với ít thành công. Năm 1925, Tôn Trung Sơn và Quốc dân đảng đã tham dự Hội nghị Thống nhất Quốc gia của Đoạn Kỳ Thụy, vốn một lần nữa sputtering vào sự cãi lộn không liên quan và phục vụ như lời mở đầu cho cuộc Bắc phạt. Chỉ dưới sự cưỡng chế thông qua vũ lực quân sự thì Miền Bắc, dưới thời Trực Hệ, mới có thể khuất phục Miền Nam.\n\nNhưng sự điên rồ và chủ nghĩa không tưởng tiếp tục hiện lên lớn trong tâm trí của nhiều nhân vật dẫn đầu Trung Quốc, xen kẽ với chủ nghĩa thực dụng và chủ nghĩa thời cơ. Trong một sự đa dạng các lời đề nghị như vậy là tập hợp các tin nhắn gần đây nhất từ [FNG.GetLeader], với một số đặc sứ tư nhân của ông thậm chí đã đi du hành suốt đường tới [ROOT.Capital.GetCapitalVictoryPointName], yêu cầu một cuộc kiến diện với [ROOT.GetLeader]. Trong hoàn cảnh thảm khốc của một cuộc chiến bảo tồn quốc gia, có vẻ như các nỗ lực nhen nhóm lại sự thống nhất Nam-Bắc đã xuất hiện một lần nữa.\n\nCác điều khoản, như được đề xuất bởi các đại diện Miền Bắc, và các tin nhắn đi kèm của họ, khá đơn giản. Theo thuật ngữ của người lay nhân, chính quyền của [ROOT.GetLeader] và các đồng minh của ông sẽ tự đặt mình dưới thẩm quyền danh nghĩa của An Quốc Quân, và đổi lại, các cải cách và sửa đổi chính trị hứa hẹn khác nhau, cùng với sự đảm bảo quyền tự trị, sẽ được thực thi sau khi thống nhất quốc gia.\n\nĐương nhiên, một lời đề nghị như vậy là hấp dẫn, vì nó sẽ ngăn chặn một cuộc thù hằn đẫm máu khác trong một quốc gia bị làm hỏng bởi xung đột vĩnh cửu. Nhưng lời nói và hứa hẹn của một người Miền Bắc vô đạo đức khó có thể ràng buộc, và nó cần rất nhiều để tin tưởng một quân phiệt quá thích sự tự phóng đại của mình."
UPC.twindragonevents.001.a: "Để thống nhất quốc gia thông qua lời nói là một điều cao quý."
UPC.twindragonevents.001.b: "Miền Bắc và Miền Nam chưa bao giờ có thể hòa giải."

UPC.twindragonevents.002.t: "[FROM.GetLeader] Chấp nhận Liên minh!"
UPC.twindragonevents.002.d: "Kỳ diệu thay, có vẻ như những tâm trí tốt hơn và những người đàn ông dũng cảm hơn đã chiến thắng các sự chia rẽ chính trị và tâm lý khu vực. Hứa hẹn với [FROM.GetLeader] một loạt các cải cách dưới dòng, và đảm bảo uy tín và quyền tự trị của họ trong Cộng hòa mới, chúng ta đã quản lý để phần nào chính thức phê chuẩn vai trò của họ như những thành tố của An Quốc Quân. Mặc dù điều này có nghĩa rất ít ở thời điểm hiện tại, nó biểu thị cả một chiếc lá mới cho ngoại giao Trung Hoa, và sự đảm bảo lòng trung thành triển vọng của họ khi Thống nhất Quốc gia đến. Tuy nhiên, điều này tất cả được cược trên sự hoàn thành các lời hứa của chúng ta, một điều gì đó [FROM.GetLeader] và các đồng minh của ông không nghi ngờ gì sẽ giữ [ROOT.GetLeader] đối với."
UPC.twindragonevents.002.a: "Bây giờ, chúng ta có phải là những người giữ lời nói của mình không?"

UPC.twindragonevents.003.t: "[FROM.GetLeader] Từ chối Liên minh!"
UPC.twindragonevents.003.d: "Có vẻ như giống như tất cả các nỗ lực trước đó, bất kỳ triển vọng nào của sự thống nhất hòa bình bởi Miền Bắc và Miền Nam không thể được đưa vào thông qua lực lượng lời nói đơn thuần. Ngay cả trong các điều kiện thảm khốc như sự tiêu diệt triển vọng bởi bàn tay của Tokyo, tính cách và sự khác biệt đã chiến thắng sự thống nhất quốc gia. Trong khi cuộc chiến tiếp tục hoành hành, có vẻ như chúng ta phải chiến đấu với một tay bị buộc đằng sau lưng, cho sự chuẩn bị chống lại các tham vọng của [ROOT.GetLeader] và các tay sai của ông."
UPC.twindragonevents.003.a: "Đây là sai lầm của họ để mắc phải."

UPC.twindragonevents.004.t: "[FROM.GetLeader] Quy phục [FROM.FROM.Capital.GetCapitalVictoryPointName]"
UPC.twindragonevents.004.d: "Thống nhất các phong trào tỉnh từng khá biệt lập của Trung Quốc đã không gì khác ngoài một nhiệm vụ Herculean, và tuy nhiên ngạc nhiên các nỗ lực gần đây đã nở hoa thành một cái gì đó của một sự sắp xếp không chính thức của ý định chân chính. [FROM.GetLeader], được công nhận là người gánh cờ quốc gia của một phong trào như vậy, đã quản lý để hợp tác với các nhân vật khác nhau từ các thống đốc tỉnh tới các nhân vật quốc gia để thấy kết luận của sự thống nhất Trung Quốc nơi nó đã thất bại trong những năm 1920. Và về phần mình, [ROOT.GetLeader] đã đóng một vai trò cốt yếu trong việc tiêm động lực vào sự nảy mầm thứ hai của sự thống nhất Trung Quốc.\n\nVà có vẻ như họ không phải là lực lượng duy nhất muốn thương lượng bằng lời nói. Thường bị chế giễu như những tay sai Nhật Bản, những kẻ phản quốc, các quan chức bị cô lập, hoặc những kẻ tiêu xài hoang phí, Phe Phụng Thiên của Đông Bắc đã thấy mình trỗi dậy trong sự nổi bật gần đây. Hiệu quả là con ngáo ộp của Bắc Kinh, họ cuối cùng đã quản lý để đảm bảo thành phố lần thứ ba trong lịch sử gần đây.\n\nTrong số tất cả sự phô trương, cưỡng chế hay tự nguyện, một sự bùng nổ kỳ lạ của các tin nhắn và đặc sứ đã được thấy hạ cánh từ các quân phiệt Miền Bắc, hạ cánh để gặp các đại diện của [FROM.GetLeader]. Trong khi ít người trong chính quyền của chính chúng ta nghĩ rằng nhiều thứ sẽ nổi lên từ sự tiếp xúc này, có lẽ chỉ đơn thuần là các nghị định thư thời chiến chống lại những kẻ đế quốc nước ngoài, có vẻ như nó đã nở hoa thành một cái gì đó nhiều hơn. Với các lời hứa về cải cách chính trị trong tương lai, An Quốc Quân đã tự đặt mình là các chúa tể danh nghĩa không chỉ [FROM.GetLeader], mà mở rộng cả [ROOT.GetLeader] nữa, mà không có nhiều tiếng nói trong vấn đề."
UPC.twindragonevents.004.a: "Chúng ta phải duy trì sự thống nhất..."

UPC.twindragonevents.005.t: "Thống nhất trên các Điều kiện Bình đẳng"
UPC.twindragonevents.005.d: "Mang lại sự thống nhất cho Trung Quốc không phải là một nhiệm vụ dễ dàng, và tuy nhiên có vẻ như đối thủ nhất quán, luôn hiện diện của Chính phủ Trực Hệ cuối cùng đã nổi lên ở trên đỉnh. Cư trú trong thánh địa Đông Bắc của họ, và được hỗ trợ bởi người Nhật, chính phủ Phụng Thiên cuối cùng, lần thứ ba, đã lấy lại Bắc Kinh. Chạy qua các hậu quả của sự thống nhất quốc gia, chính phủ của họ đã bị vây hãm với các thiếu hụt kinh tế nghiêm trọng, và một vùng đất hoang của sự ủng hộ chính trị; ít người đã quên danh tiếng của những người đam mê Phụng Thiên.\n\nHơn nữa, có vẻ như bất chấp những nỗ lực tốt nhất của Nguyên soái Trương, liên minh An Quốc Quân bị rạn nứt đã bắt đầu xé rách chính nó. Với các tham vọng của Tokyo xen kẽ, một trận lốc xoáy phát triển nhanh chóng của sự thù hằn chính trị và xung đột nội bộ đã xuất hiện dưới ngọn cờ Ngũ Kỳ. Phe Sĩ quan, Phe Thông tin, Quang Phục Hội, các nhà dân chủ khác nhau và các phe phái nhỏ hơn khác đều đã bắt đầu thù hằn về các vị trí bảo trợ và hướng đi của chính phủ.\n\nĐủ để nói, đã là khối lớn nhất của các thành viên không mô tả của An Quốc Quân, đã có một cảm giác giận dữ gia tăng đang ủ trong Miền Nam. Đã tự buộc mình dưới sự cưỡng chế quốc gia với An Quốc Quân, có vẻ như họ đã trở nên thường xuyên bị lãng quên trong các sự vụ của Bắc Kinh. Với vị trí độc đáo của sự yếu đuối Phụng Thiên trên sân chơi, nhiều người trong chính phủ của [ROOT.GetLeader] đã khuyên một cuộc nổi dậy, hoặc phản loạn, của các loại. Vì Miền Nam và Miền Bắc chưa bao giờ có thể thực sự thống nhất bởi các cuộc đàm phán hòa bình phù phiếm đơn thuần."
UPC.twindragonevents.005.a: "Họ khó có thể được tin tưởng!"
UPC.twindragonevents.005.b: "Chờ đợi đến lượt của chúng ta..."
UPC.twindragonevents.005.c: "Hãy để chúng ta làm việc cùng nhau, vì một tương lai tốt đẹp hơn."

UPC.twindragonevents.006.t: "Cuộc Nổi dậy [FROM.GetAdjective]"
UPC.twindragonevents.006.d.start: "Sau sự nhận thức về sự thống nhất An Quốc Quân đối với Trung Quốc, các phe phái và những người nắm giữ quyền lực khác nhau trong cộng hòa được khôi phục của Trung Quốc đã bắt đầu tranh giành quyền lực và sự ủng hộ trên khắp đất nước. Trong tâm lý chủ nghĩa khu vực nằm một mối sợ về sự tập trung hóa chính phủ gia tăng, sự tham nhũng trong hàng ngũ chính phủ (tất cả quá biết rõ đối với những người Đông Bắc), và một mối sợ về sự thống trị từ các phe phái chính trị Đông Bắc. Với những người ủng hộ của [FROM.GetLeader] sẵn lòng hỗ trợ các yêu sách của họ bằng vũ khí, một cuộc nội chiến có khả năng đang diễn ra.\n\nChính phủ Trung ương dĩ nhiên dự kiến sẽ có một lợi thế lớn, kiểm soát các thành phố lớn của Trung Quốc và chỉ huy tính hợp pháp quốc tế (ít nhất là hiện tại) vốn trao cho họ khả năng tiếp cận lớn hơn đối với các khoản vay cũng như một cơ sở thuế và nhân lực lớn hơn để dự thảo một quân đội. Tuy nhiên An Quốc Quân tập trung vẫn giữ nhiều nhà chủ nghĩa khu vực không trung thành trong hàng ngũ của nó. Hơn nữa, những nhà chủ nghĩa khu vực [FROM.GetAdjective] tự tin vào khả năng của các lực lượng của họ và mong đợi rằng những người khác sẽ dấy lên chống lại chế độ độc tài tàn bạo của Chính phủ Trung ương. Và Trung Quốc không lạ lẫm với các sự lật kèo. Những gì cả hai bên có thể đồng ý tuy nhiên, là họ sẽ không dung thứ cho một thời đại quân phiệt khác."
UPC.twindragonevents.006.d.npa: "$UPC.twindragonevents.006.d.start$\n\nCảm thấy tức giận do sự phản bội có vẻ của các ưu tiên của Miền Nam cho sự xung đột nội bộ nhỏ mọn trong giới cầm quyền chính trị Miền Bắc, [FROM.GetLeader] và [FROM.GetRulingParty] đã quản lý để tập hợp một biểu ngữ tất cả quá tương tự như nhiều chính phủ Miền Nam đi trước họ: Sự phản đối của Miền Nam đối với Chủ nghĩa Bảo thủ và sự tham nhũng của Miền Bắc. Ban đầu liên minh dưới các điều khoản của Cuộc chiến chống lại Những kẻ Đế quốc Nước ngoài, nó thực sự xuất hiện rằng chỉ có những kẻ ngốc mới tin vào khả năng bắc cầu Miền Bắc và Miền Nam trên lời nói đơn thuần."
UPC.twindragonevents.006.d.upc: "$UPC.twindragonevents.006.d.start$\n\nCoi các cam kết của người Đông Bắc đối với nền dân chủ và Chủ nghĩa Liên bang như không gì khác ngoài một trò hề, Chính phủ Liên bang Miền Nam, ban đầu liên minh với An Quốc Quân do các điều kiện thời chiến, đã tự đặt mình trong sự phản đối kiên định với Đông Bắc và các mong muốn của nó. Khăng khăng về các nguyên tắc của phong trào Liên bang như là phương tiện duy nhất cho Trung Quốc tiến bộ và đi lên, có vẻ như Trung Quốc đã hạ xuống một lần nữa vào xung đột mở, và một lần nữa giữa Miền Nam và Miền Bắc."
UPC.twindragonevents.006.a: "Họ không thể phản bội chúng ta, nếu chúng ta phản bội họ trước!"
UPC.twindragonevents.006.b: "Nó chưa bao giờ đi đến hoạt động."
UPC.twindragonevents.006.c: "Lòng trung thành của tôi là dành cho cộng hòa! Dành cho dân chủ!"

UPC.twindragonevents.007.t: "Sự Thỏa hiệp Liên bang"
UPC.twindragonevents.007.d: "Bất chấp tất cả sự giả vờ đối lập, có vẻ như liên minh điểm nóng với Phong trào Liên bang Miền Nam trong Cuộc chiến Kháng chiến Quốc gia đã nở hoa thành một cơ hội mới. Một ánh sáng chiếu sáng trong bóng tối, Chính phủ Liên bang đã chấp nhận các điều khoản chính thức của liên minh An Quốc Quân. Hy vọng, có lẽ khăng khăng, về sự ban hành của một phong trào mới để đưa tiến lên Chủ nghĩa Liên bang và Dân chủ trong Cộng hòa, chính phủ Phụng Thiên và Liên bang đã đi đến các điều khoản công nhận và tôn trọng lẫn nhau; được củng cố bởi sự bổ nhiệm Trương Quân Mại, nhà dân chủ dẫn đầu, làm Thủ tướng Cộng hòa.\n\nTrong khi một số người nhìn sự bổ nhiệm của ông một cách bi quan như sự bảo hiểm, và những người khác như một nỗ lực lý tưởng chân chính, Trương đã bắt đầu đụng đầu với các thành viên khác nhau của Chính phủ Đông Bắc, khi ông khăng khăng đòi các cải cách và bổ nhiệm khác nhau được thực hiện gần như ngay lập tức. Tương tự, ông đã thấy mình bị hạn chế và gò bó bởi các phe phái cô lập của Đông Bắc, với ít cá nhân sẵn lòng làm việc với người mà họ coi là một kẻ cực đoan, hoặc một kẻ xã hội chủ nghĩa.\n\nDù sao đi nữa, trạng thái sự vụ hiện tại vẫn bị hoen ố với sự căng thẳng, vì nhiều người không tin rằng [ROOT.GetLeader] sẽ theo đuổi một cách thích hợp với kết thúc thỏa thuận của ông. Như vậy, các thành tố khác nhau của lực lượng vũ trang Liên bang giữ lại quyền tự trị của họ trong An Quốc Quân, và đang ở trong tình trạng báo động cao. Tuy nhiên, nếu Nguyên soái quản lý để hoàn thành các nghĩa vụ của mình, chống lại sự phán đoán tốt nhất của ông, ông sẽ không gì khác ngoài một anh hùng."
UPC.twindragonevents.007.a: "Nên giữ vững lời nói của chúng ta, vậy thì."


