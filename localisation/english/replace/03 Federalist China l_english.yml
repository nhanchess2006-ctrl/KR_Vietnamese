UPC_upcoming_federal_elections_timer: "Bầu cử Liên bang sắp tới trong [?UPC.campaign_timer_var|0] Tháng"
UPC_upcoming_federal_elections_timer_desc: "Bầu cử liên bang đã được lên lịch tổ chức trong vài tháng tới. Trong thời gian này, chúng ta sẽ có thể vận động ở các tỉnh khác nhau và tham gia các hoạt động vận động tranh cử khác. Các đối thủ của chúng ta trong cuộc bầu cử này cũng sẽ không thụ động - cách duy nhất để giữ nguyên vị trí là tiếp tục tiến về phía trước!"

UPC_elections_swap_sides_decision: "Đổi phe"
UPC_elections_swap_sides_decision_desc: "Tất cả chúng ta đôi khi đều phạm sai lầm. Và trong những thời điểm đó, các chính trị gia khôn ngoan có thể chọn xoay chuyển và ủng hộ một con ngựa mạnh hơn."

UPC_expand_our_ground_game_decision: "Mở rộng Chiến dịch Cơ sở của Chúng ta"
UPC_expand_our_ground_game_decision_desc: "Các cuộc bầu cử truyền thống ở Trung Quốc là một công việc của giới tinh hoa, với việc các chính trị gia hàng đầu vận động tối thiểu - công việc bẩn thỉu được giao cho các nhà sửa chữa và các đại lý khác. Tuy nhiên, thời thế đang thay đổi. Nếu chúng ta muốn thắng cuộc bầu cử này, chúng ta sẽ cần đổ thêm nguồn lực vào con đường vận động tranh cử - thêm nhiều điểm dừng, nhiều bài phát biểu hơn, nhiều nhà hoạt động hơn - bất cứ điều gì để có được lợi thế."

UPC_leverage_presidential_powers_decision: "Tận dụng Quyền hạn Tổng thống"
UPC_leverage_presidential_powers_decision_desc: "Tổng thống là một người đàn ông quyền lực, bất kể các cơ quan lập pháp đã tìm cách hạn chế đặc quyền hành pháp đến đâu. Một số có thể gọi đó là lạm dụng hoặc chủ nghĩa dân túy - nhưng người dân bầu Tổng thống của họ để hành động. Một vài sắc lệnh phút chót để cải thiện chất lượng cuộc sống của người dân và đảm bảo họ có thêm vài đồng xu trong túi, thuê thêm một vài cá nhân được chọn lọc vào các vị trí nhàn hạ có giá trị, và gạt sang một bên một vài đối thủ khó chịu không phải là tham nhũng - đó chỉ là chính trị."

UPC_lean_on_our_military_ties_decision: "Dựa vào các Mối quan hệ Quân sự của Chúng ta"
UPC_lean_on_our_military_ties_decision_desc: "Tổng thống của chúng ta có một mối quan hệ đặc biệt gần gũi với quân đội, đã tuyển mộ, huấn luyện và lãnh đạo nó đến chiến thắng. Mặc dù bề ngoài đã chuyển sang vai trò dân sự hơn và đã từ bỏ quyền kiểm soát hàng ngày đối với các hoạt động, ông vẫn giữ tình bạn cá nhân sâu rộng với các sĩ quan quân đội hàng đầu, những người sẽ rất vui lòng được phục vụ 'gây ảnh hưởng' đến cuộc bỏ phiếu sắp tới."

UPC_campaign_in_state_decision: "Vận động tại [UPC_election_region_scripted_loc]"
UPC_campaign_in_state_decision_desc: "Với thời gian và nguồn lực có hạn, chúng ta phải có chiến lược về nơi tập trung nỗ lực vận động tranh cử. Chúng ta có thể sẽ tối đa hóa tác động bằng cách vận động ở các tỉnh có mật độ dân số cao như Tứ Xuyên, Sơn Đông, Trực Lệ, Hà Nam, Quảng Đông và Giang Tô, tuy nhiên chúng ta cũng có thể được hưởng lợi từ việc vận động ở các tỉnh nhỏ hơn nhưng có cơ sở ủng hộ truyền thống hơn như Chiết Giang, Hồ Nam và Thượng Hải đối với CDL và Vân Nam, Giang Tây và Cộng đồng Hải ngoại đối với GRA."

