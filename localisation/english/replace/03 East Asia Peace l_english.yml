asian_hol_will_proceed_to_peacedeal_we_white_peace: "Các thuộc địa và đồng minh Đông Á của Hà Lan sẽ được đưa vào một thỏa thuận hòa bình, và phần còn lại của Hà Lan sẽ rút khỏi chiến tranh.\n"
asian_reichspakt_will_proceed_to_peacedeal_we_white_peace: "Các thuộc địa và đồng minh Đông Á của Đức sẽ được đưa vào một thỏa thuận hòa bình, và phần còn lại của Reichspakt sẽ rút khỏi chiến tranh.\n"