east_asia_peace_events.5.d: "Với việc chúng ta đã loại bỏ thành công các căn cứ của [From.GetNameDef] trong vùng, họ muốn đàm phán, tìm cách rút hoàn toàn khỏi Đông Á, để mặc chúng ta thu hoạch chiến lợi phẩm cùng với những người khác đã chiến đấu chống Hà Lan trong khu vực này."
