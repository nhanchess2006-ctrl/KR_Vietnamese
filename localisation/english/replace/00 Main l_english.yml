 generic_neutral_foreign_policy: "Chính sách Đối ngoại Trung lập"
 generic_neutral_foreign_policy_desc: "Dù vì chủ nghĩa hòa bình, sự cần thiết, hay chỉ đơn giản là vì lợi ích bản thân, các mục tiêu chính sách đối ngoại của nhà nước này hiện được đặc trưng bởi mong muốn tránh các vướng mắc nước ngoài. Hoạt động quân sự tập trung vào các cân nhắc phòng thủ, và mọi hành động trên trường quốc tế đều được thiết kế để tạo ra càng ít kẻ thù càng tốt."
