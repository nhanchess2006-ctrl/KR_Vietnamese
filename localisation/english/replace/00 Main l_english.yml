 generic_events.101.a: "Cứ để vậy."

 generic_events.102.t: "Tự trị [Root.GetAdjective] Lớn hơn?"
 generic_events.102.d: "[Root.GetNameDefCap] vẫn nằm dưới sự kiểm soát của chính phủ [Root.overlord.GetAdjective], nhưng sự kiểm soát đó đang bắt đầu suy yếu một cách chắc chắn khi sức mạnh của chúng ta tái khẳng định. Sức mạnh [Root.GetAdjective] không phải là thứ dễ bị kìm hãm, và các nhà lãnh đạo của chúng ta đã đang đòi hỏi nhiều quyền kiểm soát hơn đối với công việc của chính mình. Chắc chắn lãnh chúa [Root.overlord.GetAdjective] của chúng ta sẽ không thể cưỡng lại chúng ta lâu hơn được nữa."
 generic_events.102.a: "[Root.GetNameDef] muôn năm!"

 generic_events.103.t: "Tự trị [From.GetAdjective] Lớn hơn"
 generic_events.103.d: "[From.GetNameDefCap] vẫn nằm dưới sự kiểm soát của chính phủ [Root.GetAdjective], nhưng sự kiểm soát đó đang bắt đầu suy yếu khi sức mạnh của họ tái khẳng định. Sức mạnh [From.GetAdjective] không phải là thứ dễ bị kìm hãm, và tiếng nói đòi hỏi nhiều quyền kiểm soát hơn đối với công việc của chính mình từ các nhà lãnh đạo của họ đang được cảm nhận khắp đất nước."
 generic_events.103.a: "Chúng ta sẽ cần theo dõi điều này cẩn thận"

 generic_events.106.t: "Cuộc Đấu tranh Giành Độc lập"
 generic_events.106.d: "Sự kiểm soát của [Root.overlord.GetAdjective] đối với chính phủ [Root.GetAdjective] đã bị tuột dốc từ một thời gian rồi. Chúng ta quá mạnh để họ có thể kìm hãm. Có một tiếng nói chung trong nhân dân [Root.GetAdjective] đòi [Root.GetNameDef] trở nên tự do, và chẳng mấy chốc thời điểm của chúng ta sẽ đến."
 generic_events.106.a: "Một [Root.GetName] tự do muôn năm!"
 generic_events.106.b: "Đúng, chúng ta phải đòi độc lập"
 generic_events.106.c: "Không, tốt nhất là đừng chọc vào tổ ong vò vẽ"

 generic_events.107.t: "[From.GetNameDefCap] Đòi Độc lập"
 generic_events.107.d: "Sự kiểm soát của [Root.GetAdjective] đối với chính phủ [From.GetAdjective] đã bị tuột dốc từ một thời gian rồi. Họ quá mạnh để chúng ta có thể kìm hãm hoàn toàn. Có một tiếng nói chung trong nhân dân [From.GetAdjective] đòi [From.GetNameDef] được tự do, và giờ chính phủ của họ đã chính thức đệ trình yêu cầu độc lập hoàn toàn."
 generic_events.107.a: "Hãy để họ đi, trong khi chúng ta vẫn còn là bạn"
 generic_events.107.b: "Họ đang đùa à? Quên đi"

 generic_events.108.t: "Độc lập bị Từ chối"
 generic_events.108.d: "Chính phủ [From.GetAdjective] đã bác bỏ yêu cầu độc lập của chúng ta. Trong khi chúng ta vốn chỉ nằm dưới sự kiểm soát danh nghĩa của họ, những hạn chế vẫn khiến chúng ta bức bối."
 generic_events.108.a: "Chuyện này chưa kết thúc ở đây"

 KR_fight_for_independence: "Tuyên bố Độc lập"
 KR_fight_for_independence_desc: "[From.GetNameDefCap] có thể đã từ chối yêu cầu độc lập của chúng ta, nhưng đó không phải là dấu chấm hết. Chúng ta sẽ tự do, kể cả khi phải chiến đấu vì nó!"

 generic_events.109.t: "[From.GetNameDefCap] Tuyên bố Độc lập"
 generic_events.109.d: "Có vẻ như việc chúng ta từ chối trao độc lập cho [From.GetNameDef] là không đủ với họ. Dù sao đi nữa, họ đã tuyên bố tự do khỏi sự kiểm soát của [Root.GetAdjective]."
 generic_events.109.a: "Chà! Để họ đi"
 generic_events.109.b: "Ta sẽ xem xét chuyện đó!"

 generic_events.110.t: "Cuộc Chiến Giành Độc lập"
 generic_events.110.d: "Có vẻ như lãnh chúa cũ của chúng ta không thể có được chỗ đứng vững chắc tại [Root.GetNameDef]... nhưng chúng ta cũng không thể đánh bại họ. Có lẽ đã đến lúc kêu gọi đình chiến và kết thúc chuyện này?"
 generic_events.110.a: "Đúng, hãy kết thúc chuyện này"
 generic_events.110.b: "Không! Đây không còn chỉ là chuyện độc lập nữa!"

 generic_events.111.t: "Cuộc Chiến Giành Độc lập của [From.GetAdjective]"
 generic_events.111.d: "Cuộc chiến với [From.GetNameDef] đã kéo dài một thời gian, không bên nào có thể giành được lợi thế rõ ràng. Có lẽ đã đến lúc chỉ cần công nhận nền độc lập của họ và kết thúc chuyện này."
 generic_events.111.a: "Đúng, hãy kết thúc chuyện này"
 generic_events.111.b: "Không! Chúng ta sẽ kết thúc chuyện này!"

 generic_events.250.t: "Biến [marked_country.GetNameDef] thành Chư hầu?"
 generic_events.250.d: "Điều này sẽ biến [marked_country.GetNameDef] thành chư hầu của [to_be_overlord.GetNameDef], sử dụng trạng thái tự trị Chư hầu Bị chiếm đóng mặc định. Nếu họ ở trong một phe phái khác, họ sẽ rời khỏi đó, nhưng điều này sẽ không kết thúc bất kỳ cuộc chiến nào họ đang tham gia. Nếu bạn muốn làm điều đó, bạn nên làm riêng.\n\n§RLƯU Ý: Điều này rất có thể sẽ phá vỡ nội dung của Kaiserreich! Sử dụng với rủi ro của riêng bạn!!§!"
 generic_events.250.a: "Làm đi"
 generic_events.250.b: "Làm đi, nhưng để họ giữ chính phủ hiện tại"
 generic_events.250.c: "Nghĩ lại thì..."

 generic_events.251.t: "Giải phóng [marked_country.GetNameDef]?"
 generic_events.251.d: "Điều này sẽ khiến [marked_country.GetNameDef] hoàn toàn độc lập. Nó sẽ không thay đổi chính phủ hiện tại của họ (trừ khi mod có nội dung để tự động làm vậy), không loại [marked_country.GetNameDef] khỏi phe phái của họ, nếu họ ở trong một phe, cũng không đưa họ ra khỏi bất kỳ cuộc chiến nào.\n\n§RLƯU Ý: Điều này rất có thể sẽ phá vỡ nội dung của Kaiserreich! Sử dụng với rủi ro của riêng bạn!!§!"

 generic_events.252.t: "Gia nhập [to_be_faction_leader.GetFactionName]?"
 generic_events.252.d: "Điều này sẽ khiến [marked_country.GetNameDef] gia nhập [to_be_faction_leader.GetFactionName], giải thể phe phái của riêng họ nếu họ là lãnh đạo phe phái hoặc chỉ đơn giản là rời khỏi phe phái hiện tại nếu họ ở trong một phe. Điều này sẽ không thay đổi bất kỳ cuộc chiến nào họ đang tham gia.\n\n§RLƯU Ý: Điều này rất có thể sẽ phá vỡ nội dung của Kaiserreich! Sử dụng với rủi ro của riêng bạn!!§!"

 generic_events.253.t: "Lãnh đạo [marked_country.GetFactionName]?"
 generic_events.253.d: "Điều này sẽ khiến [marked_country.GetNameDef] trở thành lãnh đạo phe phái của [marked_country.GetFactionName].\n\n§RLƯU Ý: Điều này rất có thể sẽ phá vỡ nội dung của Kaiserreich! Sử dụng với rủi ro của riêng bạn!!§!"

 generic_events.254.t: "Rời khỏi [marked_country.GetFactionName]?"
 generic_events.254.d: "Điều này sẽ khiến [marked_country.GetNameDef] rời khỏi [marked_country.GetFactionName], giải thể phe phái nếu họ là lãnh đạo. Nó sẽ không ảnh hưởng đến bất kỳ cuộc chiến nào họ đang tham gia.\n\n§RLƯU Ý: Điều này rất có thể sẽ phá vỡ nội dung của Kaiserreich! Sử dụng với rủi ro của riêng bạn!!§!"

 generic_events.255.t: "Hòa bình với [peace_target.GetNameDef]?"
 generic_events.255.d: "[marked_country.GetNameDefCap], cùng với tất cả đồng minh của mình, sẽ hòa bình trắng với [peace_target.GetNameDef] và tất cả đồng minh của họ.\n\n§RLƯU Ý: Điều này rất có thể sẽ phá vỡ nội dung của Kaiserreich! Sử dụng với rủi ro của riêng bạn!!§!"
 generic_events.255.b: "Tách [marked_country.GetNameDef] khỏi đồng minh của mình, rồi hòa bình"

 generic_events.256.t: "Hòa bình khỏi tất cả các cuộc chiến?"
 generic_events.256.d: "[marked_country.GetNameDefCap] sẽ thực hiện một nền hòa bình trắng riêng cho tất cả các cuộc chiến hiện tại của mình. Nếu là chư hầu, trước tiên họ sẽ được giải phóng, và nếu ở trong một phe phái, trước tiên họ phải rời khỏi đó.\n\n§RLƯU Ý: Điều này rất có thể sẽ phá vỡ nội dung của Kaiserreich! Sử dụng với rủi ro của riêng bạn!!§!"

 generic_events.257.t: "Chiến tranh với [war_target.GetNameDef]?"
 generic_events.257.d: "[marked_country.GetNameDefCap] sẽ tuyên chiến với [war_target.GetNameDef]. Không có kiểm tra nào để xem đây có phải là một lời tuyên chiến hợp lệ hay không, ngoài việc hai quốc gia không phải là đồng minh và chưa có chiến tranh.\n\n§RLƯU Ý: Điều này rất có thể sẽ phá vỡ nội dung của Kaiserreich! Sử dụng với rủi ro của riêng bạn!!§!"

### Government in Exile Events ###
 mtg_exile_leader_added.1.t: "Lãnh đạo Lưu vong [exile_nation.GetAdjective] Đề nghị Phục vụ"
 mtg_exile_leader_added.1.desc: "Sau một hành trình dài và nguy hiểm qua lãnh thổ do địch kiểm soát và một số quốc gia trung lập, một sĩ quan quân đội cấp cao từ một trong những đồng minh đã đầu hàng của chúng ta cuối cùng đã đến thủ đô. Sau một thời gian ngắn hồi phục, ông đã đề nghị phục vụ trong cuộc đấu tranh chung của chúng ta."
 mtg_exile_leader_added.1.a: "Cuộc chiến của bạn vẫn chưa kết thúc."

 mtg_exile_government.2.title: "Chính phủ Lưu vong [From.GetAdjective]"
 mtg_exile_government.2.desc: "[From.GetLeader] đã chính thức yêu cầu chính phủ [Root.GetAdjective] cho phép trở về [From.GetNameDef] và tái lập nội các [From.GetRulingParty] lâm thời để chuẩn bị cho hòa bình sau chiến tranh."
 mtg_exile_government.2.a: "Đã đến lúc họ trở về lãnh thổ của mình."
 mtg_exile_government.2.b: "Thời cơ chưa chín muồi."

 mtg_exile_government.3.title: "[From.GetName] Yêu cầu Tích hợp Hải quân"
 mtg_exile_government.3.desc: "Bộ chỉ huy hải quân [From.GetAdjective] đã trình bày cho chúng ta một kế hoạch tích hợp hải quân của chúng ta vào hải quân của họ. Họ lập luận rằng, bằng cách cho phép các nhà hoạch định hải quân [From.GetAdjective] toàn quyền kiểm soát tàu của chúng ta, hiệu quả của chúng sẽ tăng đáng kể so với các hoạt động độc lập hiện tại."
 mtg_exile_government.3.a: "Chúng tôi đồng ý."
 mtg_exile_government.3.b: "Chúng tôi sẽ không phục vụ dưới quyền họ."

 mtg_exile_government.4.title: "[From.GetName] Chấp nhận Tích hợp Hải quân"
 mtg_exile_government.4.desc: "Chính phủ [From.GetAdjective] đã thông báo cho chúng ta rằng họ đồng ý với đề xuất của chúng ta, và từ nay tàu của họ sẽ hoạt động dưới sự chỉ huy của chúng ta."
 mtg_exile_government.4.a: "Tuyệt vời."

 mtg_exile_government.5.title: "[From.GetName] Từ chối Tích hợp Hải quân"
 mtg_exile_government.5.desc: "Chính phủ [From.GetAdjective] đã thông báo cho chúng ta rằng hải quân của họ sẽ không bao giờ phục vụ dưới sự chỉ huy của một cường quốc nước ngoài. Họ định giúp chúng ta, nhưng họ sẽ làm điều đó một cách độc lập."
 mtg_exile_government.5.a: "Họ đặt lòng kiêu hãnh của mình lên trên lợi ích của liên minh."

 mtg_generic.1.title: "[From.GetName] Áp đặt Thay đổi Chính phủ"
 mtg_generic.1.desc: "Viện dẫn sự thiếu rõ ràng về ủng hộ bầu cử cho chính phủ hiện tại của chúng ta, [From.GetNameDef] đã yêu cầu một sự thay đổi trong chính trị."
 mtg_generic.1.a: "Chúng ta không có lựa chọn nào khác ngoài chấp nhận."

