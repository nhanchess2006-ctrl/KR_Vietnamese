 ## TAB 3 ##
 kr_intro_screen_tab_3_content: "§YVui lòng lưu ý những điều sau:§!\n£white_dot \n£white_dot \n£white_dot \n\n£white_dot \n\n£white_dot \n\n£white_dot \n\n§YBáo cáo sự cố:§!\nMod này vẫn đang trong quá trình phát triển, vì vậy có thể xảy ra lỗi và sự cố. Nếu bạn gặp bất kỳ vấn đề nào, vui lòng báo cáo cho §Ytrình theo dõi sự cố GitHub§! của chúng tôi để giúp chúng tôi sửa chữa nhanh chóng. Bạn có thể tìm thấy liên kết trong menu tạm dừng."
 kr_intro_screen_tab_3_content_0: "Kaiserreich đặt ra những hạn chế đối với các hành động ngoại giao như §Rchiến tranh sớm§!, §Rphe phái§! và §Rmức độ tự trị§!.\nKaiserreich cũng bao gồm §CGiới hạn Sư đoàn§! và cơ chế §CGiải ngũ§! để cải thiện khả năng chơi ở giai đoạn cuối.\nTrong các §YHội nghị Hòa bình§!, hãy nhớ sáp nhập tất cả các bang có thể. Bạn sẽ có thể giải phóng các quốc gia khỏi các lãnh thổ đã sáp nhập thông qua các §Cquyết định§! sau này.\nMenu thiết lập §YQuy tắc Trò chơi Tùy chỉnh§! cho phép bạn điều chỉnh nhiều tùy chọn bao gồm §CĐường lối Quốc gia§!, §CƯu tiên Người chơi trong Hội nghị Hòa bình§! và §CCông cụ Chuyển giao Bang và Quốc gia§!.\nMenu §YTùy chọn§! trong tab §YQuốc gia§! cho phép bạn điều chỉnh §Ctần suất sự kiện tin tức§! và bật §Cđổi tên động§! các bang và điểm chiến thắng.\nNhấp vào biểu tượng £kr_intro_screen_icon ở góc trên bên phải để §Ymở lại màn hình giới thiệu này§! bất cứ lúc nào."

