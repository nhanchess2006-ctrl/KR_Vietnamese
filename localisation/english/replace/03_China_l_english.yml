### Army Reform
 china_army_decisions: "Cải cách quân đội"
 china_army_decisions_desc: "Quân đội Trung Quốc và quân đội của các nước ly khai từ lâu đã phải vật lộn để bắt kịp với các tiêu chuẩn phương Tây. Binh lính nổi tiếng là được đào tạo kém và mất trật tự, thường được tuyển dụng từ một nhóm cướp bóc, tội phạm nhỏ và những người nghèo khổ kinh niên. Trang thiết bị thường xuyên chắp vá, lỗi thời hoặc thậm chí hết sức cổ xưa. Lòng trung thành thường được trao cho các sĩ quan riêng lẻ, hoặc một cái bát gạo thường xuyên đầy, và động lực ý thức hệ tốt nhất là phù du. Sẽ mất rất nhiều thời gian để xây dựng lại các đội quân này theo các tuyến hiện đại.\n"

 china_army_reform: "Cải cách quân đội"
 china_army_reform_desc: "Được hình thành bởi nhu cầu của những ngày suy yếu của nhà Thanh và đúc kết từ kinh nghiệm của thời đại quân phiệt, quân đội quân phiệt Trung Quốc và quân đội của các quốc gia ly khai khác nhau gần như có bản chất phong kiến, được tổ chức bởi các nhóm kẻ mạnh trong khu vực. Quân đội của chúng ta thường xuyên bị chỉ trích vì chất lượng thấp, với một số sĩ quan bị buộc tội không đủ năng lực ở mọi thứ trừ làm giàu cho mình. Chúng ta phải phấn đấu nhiều hơn thế này, đặc biệt nếu chúng ta muốn đứng cho bất cứ điều gì lớn hơn."
 china_lessons_of_war: "Bài học chiến tranh"
 china_lessons_of_war_desc: "Những bài học về chiến tranh đã dạy cho chúng ta một cách đáng kể trong những cuộc xung đột hiện đại. Với tham vọng mới, chúng ta phải theo đuổi những cải cách cơ cấu lớn để đưa lực lượng của mình cập nhật, xây dựng một lực lượng có thể đứng vững trước thử thách của thời gian."

 CHN_cleanse_army_corruption_decision: "Bài trừ tham nhũng trong quân đội"
 CHN_cleanse_army_corruption_decision_desc: "Tiền lương của người lính trong lịch sử rất nghèo ở Trung Quốc, nhưng có rất ít sự thiếu hụt trong các phương tiện bồi thường thay thế \" \" cho những người lính dám nghĩ dám làm. Bán vật tư quân sự cho thị trường chợ đen, đăng ký trẻ em và người thân làm binh sĩ bổ sung trong biên chế, bán hoa hồng và ân huệ cho những người lính khác, tống tiền và bảo vệ rackets, và đôi khi chỉ hoàn toàn trộm cắp từ dân thường chỉ là một lát của cách binh sĩ Trung Quốc đã làm giàu cho mình. Thông thường các sĩ quan của họ cắt giảm hoặc thậm chí đi đầu trong các hoạt động này. Bất chấp những cải cách của chúng ta, việc mở rộng nhanh chóng của quân đội của chúng ta đã được đi kèm với một dấu hiệu tham nhũng. Điều này không thể đứng. Một nỗ lực triệt để phải được thực hiện để bắt giữ những kẻ biển thủ và kẻ lừa đảo mặc đồng phục, do đó đảm bảo nguồn cung cấp và người đàn ông chảy không bị cản trở đến đích của họ cũng như bảo vệ danh tiếng của quân đội chúng ta."

 CHN_reorganise_military_units_decision: "Tái tổ chức các đơn vị quân đội"
 CHN_reorganise_military_units_decision_desc: "Cuộc hành quân của chúng ta hướng tới thống nhất đã có một cái giá: nhiều đơn vị khởi đầu của chúng ta đã bị mỏng đi nghiêm trọng do thương vong và đào ngũ, những đơn vị khác đã tăng lên đến quy mô không thể quản lý được bằng cách đào ngũ đối thủ và quân tiếp viện đặc biệt, trong khi vẫn còn những đơn vị khác được vội vã ra mặt trận trước khi chúng có thể được thành lập đúng cách. Kết quả là, chất lượng đã bị suy giảm nghiêm trọng trên toàn hội đồng - với sự phân bố không đồng đều và không được lên kế hoạch của các đơn vị cựu chiến binh và màu xanh lá cây. Giống như một con dao cùn, quân đội cần phải được mài giũa và điều này chỉ có thể xảy ra bằng cách luân chuyển các đơn vị cạn kiệt sang các cấp sau để ân xá và tổ chức lại rất cần thiết. Làm theo cách không để lại lỗ hổng hơn nữa đặt ra một thách thức hậu cần đáng kể và sẽ đòi hỏi một nỗ lực lớn từ trên xuống của các nhà hoạch định quân sự."

 CHN_disband_unreliable_units_decision: "Giải tán các đơn vị thiếu tin cậy"
 CHN_disband_unreliable_units_decision_desc: "Quân đội giống như một gánh xiếc, một bộ sưu tập đa dạng các đơn vị có kích cỡ, chất lượng và nguồn gốc khác nhau trông giống như một triển lãm trưng bày chứ không phải là một biểu tượng thống nhất, kỷ luật của chính phủ mới. Mặc dù có một số đơn vị ưu tú, tận tụy mang thiết bị hiện đại và đồng phục bóng bẩy, nhưng chúng rất ít và xa so với số lượng lớn hơn các đội quân cựu quân phiệt và cựu cướp quấy rối người dân địa phương và sau đó chạy khi đối mặt với nguy hiểm. Tệ hơn, một số đơn vị chỉ tồn tại trên giấy - những đơn vị ma này vượt ra ngoài danh sách đơn vị được thổi phồng, với bộ khung xương nếu chúng tồn tại.\n\nTrong khi số lượng không có một chất lượng riêng của mình, nó cũng có tác động xuống cấp về chất lượng với nhiều đơn vị tốt hơn distrusting những người ít hơn để bảo vệ sườn của họ và những người lính lý tưởng hơn bị thiệt hại nghiêm trọng về tinh thần khi chứng kiến hành vi man rợ của đồng chí \" ZXQ của họ \" trên người dân. Vấn đề này chỉ trở nên tồi tệ hơn khi chúng ta đã hấp thụ nhiều đơn vị từ quân đội đối phương. Tuy nhiên, loại bỏ và giải giáp các đơn vị này sẽ không phải là một vấn đề khá. Sẽ có một lượng lớn phản biện ủng hộ và tham nhũng trên một phần của các kiểm toán viên, và nhiều người sẽ phàn nàn rằng chúng ta đang đặt lợi ích chính trị trên thống nhất quốc gia."

 CHN_purge_disloyal_officers_decision: "Thanh trừng sĩ quan bất trung"
 CHN_purge_disloyal_officers_decision_desc: "Khi quân địch bắt đầu tan rã, nhiều kẻ thù cũ của chúng ta bắt đầu đào ngũ và đôi khi toàn bộ đội hình thay đổi đồng phục. Thật không may, điều này thường bị gạt bỏ như một thực tế khác của sự nghiệp quân sự ở quân phiệt Trung Quốc và các khu vực lân cận và trong khi phần nào đúng, nhiều người trở nên tự mãn về những nguy hiểm mà điều này đặt ra cho tương lai của quân đội. Nhiều sĩ quan mới được tuyển dụng không đặc biệt quan tâm đến sự nghiệp của chúng ta, nhưng hy vọng sẽ giữ lại những đặc quyền và địa vị mà họ được hưởng dưới thời chủ nhân trước đây. Một số người nổi loạn ở biên giới, bác bỏ những nỗ lực của các sĩ quan trung thành để đưa họ vào sứ mệnh của chúng ta.\n\nChúng ta cắt bỏ khối u này trước khi nó bắt đầu lan rộng, loại bỏ các ví dụ nghiêm trọng nhất và sàng lọc trước các tân binh trong tương lai cho lòng trung thành. Tất nhiên, các sĩ quan bị sa thải trong khu vực có xu hướng lần lượt rời đi với toàn bộ nhân viên và đơn vị trung thành với cá nhân họ, mang theo súng của họ. Có rất nhiều mối quan tâm họ sẽ trở thành kẻ cướp vì vậy chúng ta phải cảnh giác hơn."

 CHN_enforce_military_discipline_KMT_decision: "Siết chặt quân kỷ"
 CHN_enforce_military_discipline_KMT_decision_desc: "Quân đội Trung Quốc từ lâu đã được coi là một sự nghiệp lựa chọn cuối cùng cho con trai của quý tộc và giới tinh hoa khác: những thanh niên danh dự trong lịch sử được kỳ vọng sẽ làm tốt trong kỳ thi Hoàng gia và đi vào bộ máy quan liêu dân sự. Ngay cả ở đỉnh cao của thời đại quân phiệt, vẫn còn sự kỳ thị đáng kể đối với nghĩa vụ quân sự giữa những người đàn ông có học thức vì những khuôn mẫu tiêu cực phổ biến của binh lính và sĩ quan của họ là những tên trộm, kẻ giết người và kẻ bắt nạt.\n\nĐiều này đã được chứng minh là một lời tiên tri tự hoàn thành, và các báo cáo về cướp bóc và trừng phạt ngoài vòng pháp luật được ban hành bởi ngay cả một số đơn vị đáng tin cậy nhất của chúng ta đã trở nên phổ biến một cách đáng lo ngại khi quân đội của chúng ta say sưa với chiến thắng và quyền lực. Nó chắc chắn sẽ không được phổ biến, nhưng cần phải khẳng định lại quyền lực của chính phủ nếu chúng ta muốn giữ gìn sự toàn vẹn của quân đội. Một số ví dụ sẽ phải được thực hiện từ một số trường hợp trong khi các trường hợp khác sẽ phải được che đậy, cả hai sẽ làm hỏng tính chính danh chính trị của chúng ta trong ngắn hạn nhưng là một điều ác cần thiết để đảm bảo khả năng tồn tại lâu dài của sự nghiệp của chúng ta."

 CHN_insist_on_civilian_control_UPC_decision: "Khẳng định quyền kiểm soát của chính quyền dân sự"
 CHN_insist_on_civilian_control_UPC_decision_desc: "Các triều đại Trung Quốc trong lịch sử đã coi thấp nghĩa vụ quân sự, và các học giả-Bureaucrat Nho giáo từ lâu tự hào về việc duy trì sự kiểm soát chặt chẽ đối với quân đội. Những ngày suy yếu của triều đại nhà Thanh và sự hỗn loạn của Kỷ nguyên quân phiệt đã cho phép quân đội trượt khỏi tầm tay của chính phủ dân sự. Tệ hơn nữa, ranh giới giữa hai người thường bị xóa nhòa, với các nhân vật quân sự tự đưa mình trực tiếp vào chính phủ dân sự và các nhân vật dân sự đeo tước hiệu quân sự trong nỗ lực duy trì cả quyền kiểm soát và tính chính danh. Nếu quân đội của chúng ta muốn từ bỏ danh tiếng là một nhóm các quân phiệt, chúng ta cần tận dụng sức mạnh của chính phủ để kiềm chế các sĩ quan của chúng ta, ngay cả khi nó có khả năng gây ra xung đột trong tương lai gần."

 china_poor_officers_fixed_text: "Tình trạng đào ngũ đã giảm sút nhờ sự kết hợp giữa tăng lương, tinh thần tốt hơn và năng lực lớn hơn trong toàn quân đội. Những người lính ma đang dần bị loại khỏi danh sách quân đội, mặc dù cần nhiều cải cách hơn để loại bỏ hoàn toàn vấn đề này. Với các sĩ quan được thăng chức bằng công đức thay vì bảo trợ hoặc gia đình trị, một cấu trúc chỉ huy phối hợp và hiệu quả có thể xuất hiện thay thế."
 china_poor_army_3_officers: "Di chứng thời quân phiệt"
 china_poor_army_3_officers_desc: "Mặc dù có nhiều tuyên bố khác nhau, chưa bao giờ thực sự có một \" Quân đội Trung Quốc \" . Thay vào đó, quân đội là phi tập trung, có tính phe phái cao và bất thường - quân đội của các quân phiệt và quốc gia ly khai khác nhau đã phát triển bừa bãi và bán độc lập qua nhiều thập kỷ xung đột. Hầu hết các lực lượng quan trọng là khu vực, quá khổ, được duy trì kém và không tin tưởng lẫn nhau, nếu không nói là thù địch hoàn toàn. Tham nhũng là đặc hữu. Nơi tồn tại hậu cần, hầu hết là các chuyến tàu đơn giản hoặc la được bổ sung bởi cướp bóc thường xuyên ở vùng nông thôn xung quanh. Mặc dù một vài đơn vị dường như đáp ứng các tiêu chuẩn phương Tây, đại đa số thì không, và tốt hơn giống với các băng đảng cướp và tội phạm khác. Ngay cả trong thời bình, chỉ cần lời của một đội quân đang đến gần thường là đủ để nông dân địa phương chạy trốn làn sóng cướp bóc và lạm dụng sắp tới."
 china_poor_army_3: "Di chứng thời quân phiệt"
 china_poor_army_3_desc: "Mặc dù có nhiều tuyên bố khác nhau, chưa bao giờ thực sự có một \" Quân đội Trung Quốc \". Thay vào đó, quân đội là phi tập trung, phe phái cao, và bất thường, đã phát triển bừa bãi qua nhiều thập kỷ xung đột. Hầu hết các lực lượng quan trọng là khu vực, quá khổ, duy trì kém, và không tin tưởng lẫn nhau, nếu không phải là thù địch hoàn toàn. Tham nhũng là đặc hữu. Nơi hậu cần tồn tại, hầu hết là coolie đơn giản hoặc xe lửa la bổ sung bằng cách cướp thường xuyên của vùng nông thôn xung quanh.\n\n$china_poor_officers_fixed_text$\n\nMặc dù một vài đơn vị dường như đáp ứng các tiêu chuẩn phương Tây, đại đa số thì không, và tốt hơn giống với các băng đảng cướp bóc và tội phạm khác. Ngay cả trong thời bình, chỉ cần nói về một đội quân đang đến gần thường là đủ để nông dân địa phương chạy trốn khỏi làn sóng cướp bóc và lạm dụng sắp tới."
 china_poor_army_2_officers: "Những yếu kém có hệ thống của quân đội"
 china_poor_army_2_officers_desc: "Những bước đầu tiên hướng tới cải cách quân sự có hệ thống đang được tiến hành, bắt đầu gạt qua một bên tham nhũng và nhiều bất cập cản trở những gì một ngày nào đó sẽ là một đội quân Trung Quốc thực sự. Một bộ máy quan liêu tập trung và hậu cần phối hợp là bước đầu tiên trên hành trình như vậy, và sẽ xây dựng nền tảng cho các cải cách trong tương lai. Một hệ thống cung cấp và thanh toán đáng tin cậy hơn đã được thiết lập, đảm bảo duy trì tốt hơn quân đội, giảm động lực cướp bóc và xây dựng niềm tin với người dân địa phương. Hiện tại, hệ thống này vẫn dễ bị trộm cắp và tham ô, nhưng bạn không thể tạo ra Danhuatang mà không phá vỡ một số quả trứng."
 china_poor_army_2: "Những yếu kém có hệ thống của quân đội"
 china_poor_army_2_desc: "Những bước đầu tiên hướng tới cải cách quân sự có hệ thống đang được tiến hành, bắt đầu gạt sang một bên tham nhũng và nhiều bất cập gây khó khăn cho một ngày nào đó sẽ là một đội quân Trung Quốc thực sự. Một bộ máy quan liêu tập trung và hậu cần phối hợp là bước đầu tiên trên hành trình như vậy, và sẽ xây dựng nền tảng cho những cải cách trong tương lai.\n\n$china_poor_officers_fixed_text$\n\nMột hệ thống cung cấp và thanh toán đáng tin cậy hơn đã được thiết lập, đảm bảo duy trì quân đội tốt hơn, giảm động cơ cướp bóc và xây dựng niềm tin với người dân địa phương. Hiện tại, hệ thống này vẫn dễ bị trộm cắp và tham ô, nhưng bạn không thể tạo ra Danhuatang mà không phá vỡ một số quả trứng."
 china_poor_army_1_officers: "Đang tiến hành cải cách quân đội"
 china_poor_army_1_officers_desc: "Cải cách quân đội tiếp tục đều đặn, mặc dù không phải lúc nào cũng với tốc độ đều đặn. Nhiệm vụ khó khăn là phá vỡ các đơn vị địa phương và mạng lưới bảo trợ rộng lớn hơn đã bắt đầu, mặc dù có sự phản kháng đáng kể cả cởi mở và lật đổ. Các sĩ quan mới không có mối liên hệ rộng rãi như vậy, hy vọng sẽ có thẩm quyền hơn và ít tham nhũng công khai hơn, đã được chỉ định khi danh sách chỉ huy bắt đầu thay đổi. Đào tạo và trưng dụng cũng đang được cải cách, mặc dù một số yếu tố chống lại những thay đổi này, coi chúng là quá xa và quá nhanh. Mặc dù chất lượng đơn vị có thể khác nhau, đường cơ sở đã được nâng lên rất nhiều so với \" Murder of Crows \" mà trước đây họ đã bị sa thải."
 china_poor_army_1: "Đang tiến hành cải cách quân đội"
 china_poor_army_1_desc: "Cải cách quân đội tiếp tục diễn ra đều đặn, mặc dù không phải lúc nào cũng với tốc độ đều đặn. Nhiệm vụ khó khăn là chia tách các đơn vị địa phương và mạng lưới bảo trợ rộng lớn hơn đã bắt đầu, mặc dù có sự phản kháng đáng kể cả cởi mở và lật đổ. Các sĩ quan mới không có mối liên hệ rộng rãi như vậy, hy vọng sẽ có năng lực hơn và ít tham nhũng công khai hơn, đã được chỉ định khi danh sách chỉ huy bắt đầu thay đổi.\n\n$china_poor_officers_fixed_text$\n\nĐào tạo và trưng dụng cũng đang được cải cách, mặc dù một số yếu tố có khả năng chống lại những thay đổi này, nhìn thấy chúng quá xa và quá nhanh. Mặc dù chất lượng đơn vị có thể khác nhau, đường cơ sở đã được nâng lên cao hơn nhiều so với \" Murder of Crows \" cũ mà trước đây họ đã bị sa thải."
 china_poor_army_0: "Quân đội đã cải cách"
 #Could Rename this to something about officers
 china_poor_army_0_desc: "Quân đội đã đi một chặng đường dài kể từ khi tình trạng hỗn loạn và xáo trộn của nó chỉ vài năm trước đây. Nhờ rất nhiều nỗ lực và kinh nghiệm thu được từ những thành công trên chiến trường, các đơn vị nòng cốt của nó đứng trên đỉnh cao của sự hiện đại; năng lực chiến đấu của họ là do thiết bị và chuyên môn hóa hơn là bỏ bê hoàn toàn.\n\n$china_poor_officers_fixed_text$\n\nĐiều tương tự không thể nói cho toàn bộ lực lượng, cũng như các đơn vị đồng minh và tích hợp đặc biệt, nhưng con đường bây giờ là rõ ràng để xây dựng một đội quân mới, hiện đại và thống nhất để bảo vệ lợi ích của Trung Quốc."

 CHN_activate_military_disarray_redundant_tt: "§G Đã giải quyết triệt để các tác động quân sự của sự thống nhất quốc gia, chúng ta được củng cố từ bất kỳ cú sốc quy mô quốc gia nào. §!"
 CHN_activate_military_disarray_normal_tt: "§R Chúng ta đã cố gắng hết sức để giảm thiểu những nỗi đau ngày càng tăng của quân đội đang mở rộng nhanh chóng của chúng ta nhưng chúng ta có thể giữ lại tác động không còn nữa. Hành động trực tiếp sẽ phải được thực hiện để giải quyết những vấn đề gắn kết này trong hàng ngũ của chúng ta. §!"
 CHN_activate_military_disarray_early_warning_tt: "§R Chúng ta sẽ chủ động mở rộng quy mô quân đội, mở ra những con đường tiếp theo để cải thiện quân đội của chúng ta mà còn buộc chúng ta gánh vác gánh nặng của một lực lượng quân sự mở rộng và giải quyết chúng trước. §!"
 CHN_activate_military_disarray_no_additional_level_warning_tt: "§R Đã không đạt được tiến bộ bổ sung trong việc loại bỏ sự lộn xộn đã nắm chặt quân đội của chúng ta, tinh thần đã giảm sút nhưng chúng ta có thể tìm thấy một số an ủi ở chỗ nó không thể tồi tệ hơn. §!"
 CHN_activate_military_disarray_additional_level_warning_tt: "§R Những nỗ lực trước đây của chúng ta trong việc mở rộng quy mô quân đội đã giúp đệm tác động của quân đội đang mở rộng nhanh chóng của chúng ta, mặc dù không thể bảo vệ chúng ta hoàn toàn khỏi sự suy giảm tự nhiên của giải phóng chất lượng đã mang lại. §!"

 CHN_military_disarray_idea1: "Quân đội hỗn loạn"
 CHN_military_disarray_idea1_desc: "Bất chấp những thành công vang dội trên chiến trường và lòng dũng cảm mà binh sĩ của chúng ta đã thể hiện trong cuộc hành quân hướng tới thống nhất, quân đội đã phát triển cồng kềnh do kết quả của việc kết hợp hàng ngàn người đào ngũ, tình nguyện viên và chiếm giữ kho dự trữ của đối phương. Đồng thời, nghịch lý thay, nhiều đơn vị khởi đầu ưu tú của quân đội đã cạn kiệt khi cuộc viễn chinh tiếp diễn, một số chỉ tồn tại hiệu quả trên giấy tờ. Quân tiếp viện của họ đã bị trì hoãn hoặc chuyển hướng khi hậu cần gầm gừ đi về phía bắc.\n\nSự mục nát lan tràn, gần như có hệ thống, đã lan rộng khắp quân đội đã trở nên không thể cắt bỏ. Nếu chúng ta muốn cứu nó khỏi trở thành một khối người lúng túng, giải pháp thực tế duy nhất còn lại là tạm thời giải tán toàn bộ quân đoàn và xây dựng lại từng sư đoàn một. Đây là một mệnh lệnh cao và dự kiến sẽ phải đối mặt với sự kháng cự đáng kể, đặc biệt là vì các đơn vị quân phiệt sẽ phải đối mặt với gánh nặng của các mệnh lệnh giải tán."
 CHN_military_disarray_idea2: "Quân đội mất trật tự"
 CHN_military_disarray_idea2_desc: "Một số tiến bộ đã được thực hiện trong việc xây dựng lại quân đội, mặc dù vấn đề vẫn tiếp tục. Nhiều chỉ huy địa phương đã chống lại lệnh của chúng ta để giải tán, sợ rằng những nỗ lực của chúng ta sẽ đến chủ yếu là chi phí sức mạnh của họ. Những người khác sợ giải ngũ sẽ rời khỏi khu vực của họ không có bảo vệ, hoặc ngần ngại chia tách các đơn vị có nhiều năm tình bạn.\n\nTuy nhiên, từng lữ đoàn và từng trung đoàn, các sư đoàn của chúng ta đang dần được tái lập một lần nữa thành các đơn vị chiến đấu. Khi tiền tuyến củng cố phần nào, một đoàn tàu hậu cần ổn định hơn đã được thiết lập, do đó làm giảm bớt một số mối quan tâm cấp bách về tình trạng của quân đội chúng ta. Tuy nhiên, thời gian là điều cốt lõi, chỉ còn là vấn đề thời gian trước khi NRA một lần nữa được kêu gọi bảo vệ và bảo vệ Trung Quốc."
 CHN_military_disarray_idea3: "Quân đội thiếu tổ chức"
 CHN_military_disarray_idea3_desc: "Những thành công to lớn của quân đội trong cuộc viễn chinh phương Bắc đã che giấu một vấn đề ngày càng tăng trong hàng ngũ của nó: đó là chạy nhanh hơn cái đuôi hậu cần của nó và trở nên quá phình to như quân đội của các quân phiệt. Sau khi thảo luận kỹ lưỡng và nhận ra không có lựa chọn nào khác, bộ chỉ huy cấp cao đã ra lệnh xuất ngũ triệt để.\n\nĐó là một quá trình đau đớn nhưng có vẻ như điều tồi tệ nhất của nó bây giờ đã ở phía sau chúng ta. Hầu hết các sư đoàn tốt nhất của chúng ta đã được khôi phục hoàn toàn, và những người chúng ta đã nâng lên hoặc mua lại trên đường đi đã được tích hợp phần lớn vào hàng ngũ của chúng ta. Vẫn còn nhiều vấn đề chỉ huy và kiểm soát ở cấp quân đoàn và quân đội, mặc dù điều này có thể được coi là nỗi đau ngày càng tăng khi quả bóng quân đội mới được xây dựng của chúng ta có kích thước. Tuy nhiên, họ phải cảnh giác, chúng ta có mặt bằng đáng kể để bù đắp khi chúng ta tiếp tục tiến tới thống nhất đất nước."

 CHN_activate_economic_devastation_redundant_tt: "§G Đã giải quyết triệt để các tác động kinh tế của sự thống nhất quốc gia, chúng ta được củng cố từ bất kỳ cú sốc quy mô quốc gia nào. §!"
 CHN_activate_economic_devastation_normal_tt: "§R Chúng ta đã làm hết sức mình để giải quyết sự gián đoạn kinh tế địa phương nhưng chúng ta không thể chịu được cuộc chinh phục suy thoái tài chính đang gia tăng. Hành động trực tiếp phải được thực hiện để ổn định nền kinh tế quốc gia. §!"
 CHN_activate_economic_devastation_early_warning_tt: "§R Chúng ta sẽ chủ động sửa chữa tình trạng đáng tiếc của nền kinh tế quốc gia, mở ra những con đường tiếp theo để cải thiện các lĩnh vực thương mại và công nghiệp khác nhau, làm cho hệ thống trở nên linh hoạt hơn khi chúng ta mở rộng. §!"
 CHN_activate_economic_devastation_no_additional_level_warning_tt: "§R Sau khi không đạt được tiến bộ bổ sung trong việc loại bỏ sự hỗn loạn gây ra cho nền kinh tế quốc gia của chúng ta, niềm tin vào sự ổn định tài chính của chính phủ đã giảm mạnh nhưng chúng ta có thể tìm thấy một số an ủi ở chỗ nó không thể tồi tệ hơn. §!"
 CHN_activate_economic_devastation_additional_level_warning_tt: "§R Những nỗ lực trước đây của chúng ta trong cải cách đã giúp giảm những cú sốc kinh tế của việc tái hòa nhập các phần lớn của đất nước, mặc dù không thể ngăn chặn hoàn toàn biến động tài chính. §!"

 CHN_devastated_national_econ_idea: "Nền kinh tế quốc gia bị tàn phá"
 CHN_devastated_national_econ_idea_desc: "Trung Quốc đã từng là quốc gia giàu có nhất thế giới, trung tâm của thương mại bùng nổ và nghề thủ công tao nhã. Sự suy đồi của triều đại nhà Thanh, sự cô lập với thế giới bên ngoài và sự thất bại của những người tiền nhiệm của chúng ta trong việc nắm bắt tầm quan trọng của cuộc cách mạng công nghiệp đã đẩy quyền lực hùng mạnh đến một thế kỷ khinh miệt. Không hiện đại hóa và bắt kịp với các cường quốc nước ngoài, Trung Quốc tụt lại phía sau trong sản xuất công nghiệp. Phụ thuộc rất nhiều vào đầu tư nước ngoài để công nghiệp hóa, những gì ít ỏi được tạo ra phần lớn thuộc sở hữu của người nước ngoài, những người khai thác vị trí thuận lợi của họ để rút ra những nhượng bộ đáng kể từ các nhà lãnh đạo Trung Quốc tham nhũng và cãi vã. Trong khi đó, nông thôn vẫn kém phát triển và không bình đẳng, với ít cơ giới hóa và sản xuất trong khi vẫn còn thâm dụng nhân lực.\n\nDưới sức căng từ các cuộc chiến tranh gần đây, buộc phải chịu gánh nặng di chuyển quân đội, thuế và phá hủy thời chiến, hệ thống đã sụp đổ một cách hiệu quả. Các nhà đầu tư nước ngoài đang rút ra, thương mại bị gián đoạn, cướp bóc và cướp bóc lan rộng, và những vùng lãnh thổ rộng lớn dưới sự kiểm soát của chúng ta đang đối mặt với nạn đói. Nhiều người đang đặt câu hỏi về khả năng của chính phủ chúng ta trong việc hỗ trợ đồng tiền mà họ đang phát hành hoặc xử lý cuộc khủng hoảng đang gia tăng và chúng ta có rất ít thời gian quý báu để đưa mọi thứ trở lại đúng hướng."
 CHN_devastated_national_econ2_idea: "Nền kinh tế quốc gia bị tổn hại"
 CHN_devastated_national_econ2_idea_desc: "Mặc dù nền kinh tế [ROOT.GetAdjective] đã được cải thiện phần nào, nhưng tai họa của nó vẫn tiếp tục nhân lên. Bị thu hút như ruồi đến sự ổn định mới nổi của chính phủ mới, các chủ nợ của chính phủ trước đã ra khỏi công việc gỗ mong chúng ta tôn trọng nghĩa vụ của mình. Khả năng thực tế của chúng ta để trả hết nợ của chúng ta vẫn còn trong không khí vì nhiều người vẫn không tin tưởng vào tuổi thọ của chế độ của chúng ta và rất nhiều từ chối chấp nhận tiền tệ của chúng ta. Cần phải làm nhiều hơn và nhanh chóng - quân đội, chính phủ và mạng lưới bảo trợ của chúng ta yêu cầu tiền để chạy. Chúng ta càng bình minh lâu, chúng ta càng gặp nhiều rủi ro.\n\nChúng ta có thể có ít cơ hội để vận động hơn so với các đối tác phương Tây của chúng ta. Sau một thế kỷ nhục nhã, nền kinh tế Trung Quốc rất mong manh với sự hiện đại hóa hạn chế trong các lĩnh vực nông nghiệp và công nghiệp. Phụ thuộc nặng nề vào đầu tư nước ngoài và chi phí ổn định chính trị, và bị thối rữa chính trị xã hội nghiêm trọng do thời đại quân phiệt, các chủng chiến tranh gần đây đã gây thiệt hại nghiêm trọng cho nền kinh tế của các vùng lãnh thổ dưới sự kiểm soát của chúng ta. Mặc dù chúng ta có thể đã bắt nguồn tồi tệ nhất của cuộc khủng hoảng, nhưng việc ngăn chặn lạm phát và đưa công nhân, thương gia và nông dân trở lại làm việc vẫn là ưu tiên hàng đầu. Nỗi sợ nạn đói hầu như đã giảm xuống, mặc dù nhiều người tiếp tục bị đói và có những khu vực vẫn có nguy cơ nghiêm trọng đối với cuộc khủng hoảng tiếp theo. Có nhiều điều chúng ta phải làm trước khi chúng ta có thể tuyên bố trở lại bình thường."
 CHN_devastated_national_econ3_idea: "Nền kinh tế quốc gia bị gián đoạn"
 CHN_devastated_national_econ3_idea_desc: "Thế kỷ khinh miệt đã để lại một Trung Quốc bị đánh đập, với một nền kinh tế không thể đủ khả năng hỗn loạn gây ra bởi cuộc đấu tranh nội bộ của các quân phiệt. Tuy nhiên, nó đã chứng minh khả năng phục hồi cao hơn dự kiến, và một số phân đoạn đang dần trở lại cuộc sống. Với ngày càng nhiều người chấp nhận rằng chính phủ của chúng ta có khả năng ở đây, một tiếng ồn nhẹ nhàng đã trở lại cuộc sống ở các thành phố và nhà máy. Năng suất hầu hết đã trở lại bình thường trong các lãnh thổ cốt lõi của chúng ta, mặc dù các khu vực gần đây bị lực lượng của chúng ta chiếm giữ vẫn còn trong eo biển thảm khốc khi chúng ta làm việc để tái hòa nhập hệ thống bị phá vỡ. Cần nỗ lực hơn nữa để thực sự đưa Trung Quốc vào tương lai."

 CHN_national_illiteracy1_idea: "Nạn mù chữ toàn quốc"
 CHN_national_illiteracy1_idea_desc: "Mù chữ vẫn còn phổ biến trên toàn quốc, mặc dù các cuộc gọi liên tục từ các cải cách trên khắp quang phổ chính trị để giải quyết vấn đề này. Đối với nhiều người, nó đã trở thành biểu tượng của sự lạc hậu \" \" Trung Quốc bị, đặc biệt là ở các vùng nông thôn, nơi tiếp cận với sách, giáo viên và trường học vẫn còn hạn chế. Nghỉ học cũng phổ biến, vì nhiều người nhận thấy (đến các mức độ chính xác khác nhau) chương trình giảng dạy là vô vọng lỗi thời và không thực tế, thay vào đó thích giúp đỡ các trang trại gia đình và kinh doanh hoặc có được nhiều kỹ năng thực hành hơn ở nơi khác. Nhiều người không hoàn thành chương trình trung học bắt buộc và ít người hoàn thành chương trình giáo dục trung học tùy chọn. Đối với một số ít người may mắn có thể đủ khả năng học tập tại các trường đại học, nhiều người tự hỏi liệu họ có thể đảm bảo một công việc sau đó trong nền kinh tế thay đổi nhanh chóng (thường là tồi tệ nhất). Không chắc là chúng ta sẽ có thể khắc phục tất cả những vấn đề lớn này trong một thời gian ngắn như vậy, nhưng ít nhất chúng ta có thể ngăn chặn điều tồi tệ nhất của nó."

 SHX_disrupted_economy_idea1: "Kinh tế gián đoạn"
 SHX_disrupted_economy_idea1_desc: "Cần hành động nhanh chóng để tránh thảm họa kinh tế!"
 SHX_disrupted_economy_idea2: "Kinh tế đang phục hồi"
 SHX_disrupted_economy_idea2_desc: ""
 SHX_disrupted_economy_idea3: "Kinh tế đang ổn định"
 SHX_disrupted_economy_idea3_desc: "Sau khi làm việc chăm chỉ đáng kể trong vài tháng qua, nền kinh tế của chúng ta đã ổn định đáng kể. Mặc dù chúng ta vẫn phải vật lộn để duy trì dự trữ và sao lưu tiền tệ của chúng ta, nhưng đã có một số khả năng phục hồi trong số tiền chúng ta đã in và hầu hết chúng được chấp nhận trong biên giới của chúng ta. Một khi được cho là có nguy cơ phá sản, chúng ta đã đảm bảo với hầu hết thế giới về sự thận trọng tài chính của chúng ta. Với một chút nỗ lực hơn, nền kinh tế của chúng ta sẽ sớm trở lại cuộc sống."

 CHN_an_army_in_transition_idea: "Quân đội trong thời kỳ chuyển đổi"
 CHN_an_army_in_transition_idea_desc: "Cải cách quân đội là một quá trình đang diễn ra, thường gây khó khăn hơn bởi các chương trình cải cách quân sự đã có từ trước phải được cứu vãn, thiết kế lại hoặc loại bỏ để nhường chỗ cho tiến bộ. Đã có một số tiến bộ dọc theo một con đường, bộ chỉ huy cao cấp của chúng ta đã bầu để xoay chuyển sang một con đường khác, với hậu quả trong khi chờ đợi."

 china_baoding_school_theorist: "Trường phái Bảo Định"
 china_baoding_school_trait: "Kỷ luật và ái quốc"
 china_baoding_school_theorist_desc: "§Y Được thành lập: §! §L Tháng 5 năm 1902, tại Baoding, tỉnh Trực Lệ, Great Thanh §!\n§Y Bối cảnh: §! §L Học viện quân sự Bảo Định ban đầu được thành lập bởi Viên Thế Khải vào năm 1902 nhưng trước đó là Học viện quân sự Thiên Tân 1885 của Li Hongzhang. Cả hai đều sản sinh ra một số tướng lĩnh Trung Quốc được kính trọng nhất trong thế kỷ 20th, và các tổ chức kế nhiệm của họ ở Bảo Định và Nam Kinh tiếp tục là các học viện quân sự hàng đầu ở Trung Quốc. Giống như những người tiền nhiệm Thiên Tân của họ, trường Bảo Định hiện đại lấy cảm hứng từ các sĩ quan Đức của Hội Trực Lệ, những người tư vấn cho một cốt lõi nhỏ, cơ động và ưu tú cho quân đội trung ương để đối phó với các mối đe dọa lớn trong khi các lực lượng địa phương cung cấp an ninh địa phương và củng cố các khối chống lại quân nổi dậy và kẻ thù giao tranh. Kết hợp với nhau, một đoàn hệ của Trường Bảo Định do cựu hiệu trưởng Giang Bái ủng hộ các chiến lược vượt trội và tinh thần vượt trội, để chuẩn bị cho Trung Quốc cho Chiến tranh toàn diện. Cho dù có liên kết với Trực Lệ hay không, những người chấp nhận trường chiến tranh này sẽ luôn nhớ phương châm \" Hãy đáng tin cậy, đúng giờ và học tập siêng năng. Thực hành chăm chỉ, yêu đất nước của bạn và yêu nước. \" §!"

 china_shenyang_school_theorist: "Trường phái Thẩm Dương"
 china_shenyang_school_trait: "Điều lệnh và chính thống"
 china_shenyang_school_theorist_desc: "§Y Được thành lập: §! §L 1906, tại Phụng Thiên, quận Shengjing, Great Thanh §!\n§Y Bối cảnh: §! §L Học viện quân sự Phụng Thiên được thành lập bởi Zhao Erxun vào năm 1906, và các tổ chức kế thừa khác nhau của nó đã cung cấp hàng ngàn sĩ quan cho Trương Tác Lâm và Quân đội Đông Bắc của ông. Lấy cảm hứng từ các cố vấn Nhật Bản (và trong một số trường hợp là lính đánh thuê Bạch vệ Nga), những người chấp nhận trường phái chiến tranh này (có xu hướng liên kết An Quốc quân) nhấn mạnh việc sử dụng nhiều pháo binh và hỏa lực đông đảo - khai thác sự kiểm soát của phe họ đối với ngành công nghiệp quân sự và đường sắt hạn chế của Trung Quốc để đạt được lợi thế so với các đồng nghiệp ít được cung cấp hơn. \" Lương tâm \" là phương châm của trường, như người hướng dẫn Zhou Lian từng khuyên sinh viên của mình: \" không nhường quyền lực, không bị cám dỗ bởi lợi nhuận, nhưng kiên quyết và quyết tâm thực hiện nhiệm vụ của mình một cách tận tâm. \"  §!"

 china_kunming_school_theorist: "Trường phái Côn Minh"
 china_kunming_school_trait: "Kiên trì và chuẩn bị"
 china_kunming_school_theorist_desc: "§Y Được thành lập: §! §L Tháng 8 năm 1909, tại Côn Minh, tỉnh Vân Nam, Đại Thanh §!\n§Y Bối cảnh: §! §L Học viện Quân sự Côn Minh, còn được gọi là Học viện Quân sự Vân Nam, được thành lập vào năm 1909 và được mô tả là một trong bốn cái nôi chiến lược gia \" ở Trung Quốc hiện đại \". Được lãnh đạo bởi những người như Thái Ngạc và Li Genyuan, sinh viên tốt nghiệp của nó đã điều khiển các đội hình chủ chốt trong Cách mạng Tân Hải, Chiến tranh Hộ quốc và Chiến tranh Bảo vệ Hiến pháp. Học viện ban đầu chịu ảnh hưởng của Pháp và Anh, nhưng sự kiểm soát của Đức đối với Đông Dương đã làm tăng sự nổi bật của họ. Các thành viên của Trường Côn Minh có xu hướng thể hiện lòng nhiệt thành vị tha, kiên trì và khả năng đấm các giải đấu trên trọng lượng của chính họ. Phương châm hiện tại của họ là \" Kiên trì và làm việc chăm chỉ \", nhưng thế hệ sinh viên tốt nghiệp đầu tiên cũng nhớ: \" Endure Hardship, trong đó cư trú cơ sở cải cách. \" §!"

 china_whampoa_school_theorist: "Trường phái Hoàng Phố"
 china_whampoa_school_trait: "Tình đồng đội và lòng cuồng nhiệt"
 china_whampoa_school_theorist_desc: "§Y Được thành lập: §! §L Ngày 1 tháng 5 năm 1924, tại Quảng Châu, tỉnh Quảng Đông, Cộng hòa Trung Quốc §!\n§Y Bối cảnh: §! §L Năm 1924, Tôn Trung Sơn và chính phủ Quảng Châu của ông đã tìm cách tạo ra một lực lượng quân sự trung thành trực tiếp với bản thân và Quốc dân đảng. Được thành lập với sự giúp đỡ của các cố vấn xã hội chủ nghĩa từ Nga, Pháp, Anh, Học viện Quân sự Hoàng Phố tự hào không chỉ là một chương trình giảng dạy quân sự hiện đại mà còn đào tạo ý thức hệ mãnh liệt. Theo sự lãnh đạo đầu tiên của Hiệu trưởng Tưởng Giới Thạch, các giảng viên và cựu sinh viên của nó tiếp tục đóng vai trò chính trị và quân sự lớn trong chính phủ tương ứng của họ. Phản ánh phương châm của \" Tình huynh đệ, sự tận tụy, chân thành \" , trường chiến tranh Hoàng Phố và những người kế nhiệm của nó được ghi nhận vì sự cuồng tín hoàn toàn và xu hướng hình thành các bè phái bị ràng buộc chặt chẽ. §!"

 china_green_forest_school_theorist: "Trường phái Lục Lâm"
 china_green_forest_school_trait: "Bền bỉ và trưng dụng"
 china_green_forest_school_theorist_desc: "§Y Nền: §! §L Một số quân phiệt của Trung Quốc không có trường quân sự nào và thay vào đó tự gọi mình là đã theo học 'trường đại học của rừng xanh'. Tuy nhiên, đối với tất cả những thiếu sót của họ, những tên cướp trước đây (và đôi khi hoạt động) này mang đến một cách tiếp cận độc đáo cho chiến tranh, có thể duy trì sự linh hoạt và kiên cường ngay cả trong những hoàn cảnh khó khăn nhất. Một số người có thể gọi phương pháp của họ là thô thiển hoặc thậm chí là tội phạm, nhưng họ thường nhận được kết quả. §!"

