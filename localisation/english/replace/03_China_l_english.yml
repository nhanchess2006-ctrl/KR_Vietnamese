 CHN_new_guard_officer_trait: "Sĩ quan phe Thiếu soái"
 CHN_new_guard_officer_trait_desc: "§L Cán bộ này là một tín đồ của Trương Học Lương. §!"
 CHN_shikan_officer_trait: "Sĩ quan phe Sĩ quan"
 CHN_shikan_officer_trait_desc: "§L Sĩ quan này được liên kết với Hội Shikan của Dương Vũ Đình. §!"
 CHN_zhang_officer_trait: "Sĩ quan phe họ Trương"
 CHN_zhang_officer_trait_desc: "§L Nhân viên này là cộng sự lâu năm của Trương Tác Lâm. §!"
 CHN_japanese_aligned_officer_trait: "Người thân Nhật"
 CHN_japanese_aligned_officer_trait_desc: "§L Trong khi không chính thức là một phần của bất kỳ bè phái nào, sĩ quan này giữ một số cảm tình thân Nhật. §!"

 CHN_gmj_officer_trait: "Tướng Quốc dân quân"
 CHN_gmj_officer_trait_desc: "§L Tướng này thuộc về Quốc dân quân của Phùng Ngọc Tường. §!"

 CHN_jin_officer_trait: "Tướng Tấn quân"
 CHN_jin_officer_trait_desc: "§L Tướng quân này là thành viên của quân đội Kim của Diêm Tích Sơn. §!"

 CHN_monarchist_officer_trait: "Sĩ quan bảo hoàng"
 CHN_monarchist_officer_trait_desc: "§L Cán bộ này được gắn trực tiếp với chế độ quân chủ hoặc đảng Hoàng gia, và như vậy, số phận của họ được gắn chặt với họ. §!"

 CHN_yue_clique_officer_trait: "Sĩ quan phe Quảng Đông"
 CHN_yue_clique_officer_trait_desc: "§L Cán bộ này là một thành viên của phe Quảng Đông cũ, và được biết đến lợi ích của họ. §!"

 CHN_gui_clique_officer_trait: "Sĩ quan phe Quảng Tây"
 CHN_gui_clique_officer_trait_desc: "§L Cán bộ này là một thành viên của phe phái Quảng Tây cũ, và được biết đến lợi ích của họ. §!"

 CHN_RKT_officer_trait: "Sĩ quan Quốc dân đảng cánh hữu"
 CHN_RKT_officer_trait_desc: "§L Sự đồng cảm chính của sĩ quan này nằm ở cánh hữu của Quốc dân đảng. §!"

 CHN_LKT_officer_trait: "Sĩ quan Quốc dân đảng cánh tả"
 CHN_LKT_officer_trait_desc: "§L Sự cảm thông chính của sĩ quan này nằm ở cánh trái của Quốc dân đảng. §!"

 CHN_CDL_officer: "Sĩ quan Đồng minh Dân chủ Trung Quốc"
 CHN_CDL_officer_desc: "§L Lợi ích của nhân viên này phù hợp với CDL. §!"

 CHN_GRA_officer: "Sĩ quan Đại Liên minh Cộng hòa"
 CHN_GRA_officer_desc: "§L Lợi ích của nhân viên này phù hợp với Đại Liên minh Cộng hòa. §!"

 CHN_YUN_officer: "Sĩ quan phe Vân Nam"
 CHN_YUN_officer_desc: "§L Cán bộ này có nguồn gốc từ tỉnh Vân Nam hoặc liên kết với các nhà lãnh đạo của nó. §!"

 CHN_GZH_officer: "Sĩ quan phe Quý Châu"
