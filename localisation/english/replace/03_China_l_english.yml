 china_events.422.t: "[FROM.GetNameDefCap] Tìm cách Tham gia [ROOT.GetFactionName]"
 china_events.422.d: "Với sự thống nhất của Trung Quốc và sứ mệnh được tuyên bố của chúng ta là giải phóng châu Á và Thái Bình Dương khỏi chủ nghĩa đế quốc, chúng ta đã nhanh chóng trở thành nguồn cảm hứng cho tất cả những ai hy vọng vứt bỏ ách thực dân nước ngoài. Nhiều người bây giờ tự hào mô hình du kích của họ sau MinGan và rèn luyện binh sĩ của họ với tinh thần Hoàng Phố, và tất nhiên sẵn sàng tìm kiếm chúng ta để được hỗ trợ và hỗ trợ. Do đó, không có gì ngạc nhiên khi những người đã lật đổ các bậc thầy cũ của họ bây giờ đã tìm cách liên kết với chúng ta, hy vọng bảo vệ bản thân khỏi các cuộc tấn công tiếp theo và có lẽ là viện trợ trong việc giải phóng châu Á. Tuy nhiên, đáng để chúng ta thực hiện sự siêng năng của mình - trong khi cách mạng thế giới nghe có vẻ tốt đẹp trên giấy tờ, thực tế về địa chính trị và các yêu sách dân tộc chồng chéo không nên được giảm giá trong kỷ nguyên mới này cho lục địa này."
 china_events.422.a: "Tất nhiên chúng ta sẽ chào đón anh em [FROM.GetAdjective] của chúng ta!"
 china_events.422.b: "Thật không may, chúng ta phải từ chối đơn của họ."

 china_events.423.t: "[ROOT.GetNameDefCap] Tham gia [FROM.GetFactionName]!"
 china_events.423.d: "Với sự thống nhất của Trung Quốc và sứ mệnh được tuyên bố của chúng ta để giải phóng châu Á và Thái Bình Dương khỏi chủ nghĩa đế quốc, họ đã nhanh chóng trở thành một ví dụ cho tất cả những người hy vọng vứt bỏ ách thực dân nước ngoài. Điều đó nói rằng, những nỗ lực thành công của chúng ta để giải phóng người dân một cách độc lập là một điều kỳ diệu đối với chính nó và khiến chúng ta khác biệt với nhiều nhóm ở châu Á đang đấu tranh để đánh thức ý thức dân tộc và giai cấp của nhân dân họ. Những người đấu tranh tự do của châu Á cần hy vọng và cảm hứng, và điều gì có thể tốt hơn không phải một mà là hai đèn hiệu chống chủ nghĩa thực dân? Do đó, chúng ta đã được nhận vào [FROM.GetFactionName] khi chúng ta theo đuổi sự bảo vệ lẫn nhau, thịnh vượng và tự do!"
 china_events.423.a: "Cánh tay và cánh tay cho sự tự do của người dân châu Á!"

 china_events.424.t: "Đơn xin gia nhập bị từ chối"
 china_events.424.d: "Người Trung Quốc là một nền văn minh cổ đại, và luôn kiêu ngạo. Từ hoàng đế này đến hoàng đế khác, triều đại này đến triều đại khác, họ chỉ dung thứ cho một vài người bạn nhưng mong đợi nhiều chư hầu. Người ta sẽ hy vọng lời kêu gọi nhân đạo, xuyên quốc gia của chủ nghĩa xã hội sẽ khuyến khích người Trung Quốc thay đổi cách thức của họ và giúp một tay bảo vệ đồng bào của họ, nhưng có vẻ như điều này là vô ích. Người Trung Quốc đã từ chối ký kết một liên minh với chúng ta, cho dù vì sợ vướng víu, yêu sách dân tộc, hoặc có lẽ là chính trị hiện thực đơn giản."
 china_events.424.a: "Dường như bất chấp cuộc cách mạng của họ, người Trung Quốc vẫn chưa thực sự thay đổi."

 china_events.425.t: "Lời mời tham gia [FROM.GetFactionName]"
 china_events.425.d: "Sáng nay đại sứ của chúng ta đã chào đón phái đoàn Trung Quốc từ [FROM.GetNameDef]. Được bổ nhiệm bởi [FROM.GetLeader], người chiến thắng trong các cuộc nội chiến gần đây của Trung Quốc, không có gì bí mật khi nhà nước Trung Quốc thống nhất đã tìm cách phô trương sức mạnh ở nước ngoài và khôi phục vai trò lịch sử của Trung Quốc như là cường quốc thống trị ở Đông Á. Có hay không đó là một điều tốt là tùy thuộc vào nhiều cuộc tranh luận.\n\nĐại sứ bày tỏ chân thành hy vọng rằng chúng ta nên làm việc cùng với Chính phủ Trung Quốc trong tình đoàn kết để bảo vệ lẫn nhau chống lại chủ nghĩa đế quốc nước ngoài. Tài nguyên của chúng ta sẽ được chia sẻ và các lực lượng quân sự của chúng ta sẽ tích cực làm việc cùng nhau trong các cuộc tập trận quân sự chung để tăng cường hợp tác của chúng ta.\n\nTrong khi chắc chắn có những người trong chính phủ của chúng ta ủng hộ một quyết định như vậy, cũng có những người khác nghi ngờ ý định của Trung Quốc và lo lắng rằng chúng ta sẽ chỉ đơn thuần thấy mình là kẻ lừa đảo hoặc con rối trong trật tự mới của họ ở châu Á."
 china_events.425.a: "Cùng nhau vì hòa bình lâu dài!"
 china_events.425.b: "Không, chúng ta không có gì để đạt được từ đó!"

 china_events.426.t: "[FROM.GetNameDefCap] tham gia với chúng ta!"
 china_events.426.d: "Dường như các đại sứ của chúng ta đã hoàn thành một kỳ tích đáng chú ý về thành công ngoại giao khi ông đã thuyết phục được [FROM.GetNameDef] hợp tác với chúng ta và tham gia vào cuộc đấu tranh quốc tế và cách mạng lớn hơn chống lại chủ nghĩa đế quốc nước ngoài. Chúng ta hãy hy vọng rằng mối quan hệ này với [FROM.GetNameDef] sẽ chứng minh sẽ kéo dài đến cuối thời gian, khi chúng ta kiên quyết tuyên chiến với tất cả các đế quốc nước ngoài - vì một châu Á tự do!"
 china_events.426.a: "Đoàn kết là sức mạnh!"

 china_events.427.t: "[FROM.GetNameDefCap] Từ chối lời mời của chúng ta"
 china_events.427.d: "Thật không may, bất chấp những nỗ lực tốt nhất của anh ấy, dường như quân đoàn ngoại giao của chúng ta đã thất bại trong việc thuyết phục [FROM.GetNameDef] tham gia vào trật tự mới của chúng ta. Dường như người dân [FROM.GetNameDef] đã giả định điều tồi tệ nhất về ý định của chúng ta hoặc đơn giản là họ không coi trọng sức mạnh của chúng ta. Họ đã chọn đứng một mình mà không có sự bảo vệ và lãnh đạo của chúng ta, một rủi ro mà họ đã mang lại cho chính họ."
 china_events.427.a: "Thiệt cho họ thôi."

 china_events.450.t: "Thế giằng co ở miền Nam"
 china_events.450.d: "Lịch sử và chính trị của miền Nam Trung Quốc đã được đan xen, đặc biệt là sau Cách mạng Tân Hợi 1911. Cuộc cách mạng thứ hai năm 1913, Chiến tranh bảo vệ quốc gia năm 1915, Chiến tranh bảo vệ hiến pháp năm 1917, và sự lãnh đạo và bắt đầu của cuộc viễn chinh phương Bắc đã chứng kiến các tỉnh khác nhau đồng minh với nhau và phản bội nhau tại các điểm khác nhau.\n\nSau khi thống nhất Trực Lệ vào năm 1928, ba khối lớn trong khu vực vẫn còn ở phía nam: Liêu Quảng cai trị Quảng Đông và Quảng Tây, Hồ Nam bao gồm miền đông Quý Châu trong phạm vi của nó, và Vân Nam sử dụng miền tây Quý Châu làm vùng đệm.Tất cả họ đều hợp tác với nhau để giữ ảnh hưởng của Trực Lệ ở vịnh, trong khi cũng không bao giờ hoàn toàn tin tưởng lẫn nhau.\n\nVới sự sụp đổ của trật tự Trực Lệ, cả ba trụ cột của miền nam Trung Quốc đang phải chịu biến động như Quốc dân đảng, Liên bang, và các diễn viên khu vực đấu tranh để kiểm soát các tỉnh của họ. Một khi những xung đột được giải quyết, chiến tranh cho lãnh đạo miền nam Trung Quốc là một khả năng khác biệt. Nếu một trong những phe phái xâm lược khác, nó có khả năng thu hút thứ ba trong là tốt."
 china_events.450.a: "Hãy hy vọng chúng ta có thể giải quyết mọi chuyện một cách hòa bình"
 china_events.450_tt: "§R Nếu chiến tranh bắt đầu giữa chúng ta và một trong những người hàng xóm độc lập của chúng ta, người thứ ba (nếu độc lập) có thể chọn can thiệp vào một trong hai bên của chúng ta hoặc cả hai. §!"

 CHN_south_china_war_get_GXC_alignment_compatible_key: "[GXC.GetRulingParty] và [ROOT.GetRulingParty] được coi là tương thích, chia sẻ nhiều giá trị ngay cả khi họ đã đi vào xung đột trước đây. [GXC.GetLeader] không phải là người đáng tin cậy một cách vô tư, nhưng anh ta là người có thể lý luận được. Trong mọi trường hợp, sự giàu có của Quảng Đông và quân đội Quảng Tây làm cho anh ta trở thành một nhà lãnh đạo, chúng ta tốt hơn bạn bè hơn kẻ thù."
 CHN_south_china_war_get_GXC_alignment_incompatible_key: "Các [GXC.GetRulingParty] đã thành công outmanoeuvred đồng minh của chúng ta ở Liêu Quảng và đã nắm lấy quyền lực cho mình. Hệ tư tưởng của chúng ta chỉ đơn giản là không tương thích và sự khác biệt của chúng ta không thể hòa giải. Sự giàu có của Quảng Đông là rất lớn và quân đội của Quảng Tây hùng mạnh, nhưng [GXC.GetLeader] không thể tin tưởng và nếu theo cách của chúng ta là nắm giữ ở phía nam, chúng ta phải giải phóng Quảng Châu cho sự nghiệp của chúng ta."

 CHN_south_china_war_get_HNN_alignment_compatible_key: "[HNN.GetLeader] và [ROOT.GetLeader] có thể không phải lúc nào cũng nhìn thẳng vào mắt nhau, nhưng niềm tin đang thoáng qua trong một thời gian nguy hiểm như vậy. Các mối đe dọa rất nhiều từ mọi phía, và một liên minh giữa [HNN.Capital.GetCapitalVictoryPointName] và [ROOT.Capital.GetCapitalVictoryPointName] có thể là cách duy nhất để mang lại hòa bình lâu dài cho miền Nam."
 CHN_south_china_war_get_HNN_alignment_incompatible_key: "[HNN.GetLeader] là nhà lãnh đạo phản bội của [HNN.GetNameDef], người đặt ra mối đe dọa đáng kể cho chúng ta từ căn cứ của anh ta ở [HNN.Capital.GetCapitalVictoryPointName]. Một liên minh với anh ta là không thể trong hoàn cảnh này. Chống lại anh ta có thể là cách duy nhất để mang lại hòa bình lâu dài ở miền Nam."

 CHN_south_china_war_get_YUN_alignment_compatible_key: "[YUN.GetNameDefCap] được cai trị bởi [YUN.GetLeader], một quân phiệt đầy tham vọng nhưng là người mà chúng ta đủ thân thiện. Cai trị một Vân Nam quân sự cao và Tây Quý Châu, ông chỉ huy một đội quân hùng mạnh, cứng rắn. Nó có thể là khôn ngoan để hợp tác (ít nhất là bây giờ) với [YUN.Capital.GetCapitalVictoryPointName], vì lợi ích của sự sống còn lẫn nhau."
 CHN_south_china_war_get_YUN_alignment_incompatible_key: "[YUN.GetNameDefCap] được cai trị bởi [YUN.GetLeader], một quân phiệt đầy tham vọng thù địch với chúng ta. Cai trị một Vân Nam quân sự cao và Tây Quý Châu, ông chỉ huy một đội quân hùng mạnh, cứng rắn. Anh ta phải bị loại bỏ (bây giờ hoặc sau này) và [YUN.Capital.GetCapitalVictoryPointName] giải phóng nếu chúng ta muốn tồn tại."

 CHN_south_china_war_closing: "Cuối cùng luôn có khả năng trung lập, chỉ đơn giản là chờ đợi xung đột để xem điều gì sẽ xảy ra tiếp theo. Có lẽ nếu chúng ta cảm thấy tự tin, chúng ta có thể loại bỏ người chiến thắng \" bị suy yếu. \" Nhưng thời gian đang cạn kiệt trước khi một trong những cường quốc phương Bắc vĩ đại bắt đầu di chuyển về phía nam, và có lẽ hành động tốt nhất là nắm bắt sáng kiến cho chính mình?"

 CHN_penalty_for_greater_alignment_tt: "§R Một hình phạt bổ sung sẽ được áp dụng vì chúng ta tương thích về ý thức hệ. §!"

 china_events.451.t: "Một cuộc chiến vì miền Nam?"
 china_events.451.d: "Chiến tranh đã nổ ra giữa Hồ Nam và Vân Nam, khiến hai nước láng giềng xa xôi gặp khó khăn trực tiếp lần đầu tiên sau hơn một thập kỷ. Mối quan hệ giữa hai người trở nên tồi tệ một phần vì các lĩnh vực ảnh hưởng cạnh tranh đối với Quý Châu, nằm giữa hai tỉnh. Dường như các cường quốc nằm trong hai nhóm quân phiệt đơn giản là không thể cùng tồn tại.\n\n[CHN_south_china_war_get_HNN_alignment]\n\n[CHN_south_china_war_get_YUN_alignment]\n\n$CHN_south_china_war_closing$"
 china_events.451.a: "Chúng ta sẽ tuyên chiến với Hồ Nam."
 china_events.451.b: "Chúng ta sẽ tuyên chiến với Vân Nam."
 china_events.451.c: "Chúng ta sẽ tuyên chiến với cả hai."
 china_events.451.e: "Chúng ta sẽ tuyên bố trung lập trong cuộc xung đột này."

 china_events.452.t: "Một cuộc chiến vì miền Nam?"
 china_events.452.d: "Chiến tranh đã nổ ra giữa Vân Nam và Liêu Quảng (\" Hai Guangs \" của Quảng Đông và Quảng Tây), ba trong số các tỉnh ưu việt nhất trong chính trị miền Nam Trung Quốc. Đây chỉ là bước ngoặt mới nhất trong mối quan hệ hậu Hán Hải của họ, vì hai phe liên tục liên minh với nhau để chống lại ảnh hưởng của phương Bắc nhưng cạnh tranh giành quyền thống trị chính trị. Có vẻ như sự khác biệt chính trị sẽ tiếp tục giữ cho hai bên cách xa nhau.\n\n[CHN_south_china_war_get_GXC_alignment]\n\n[CHN_south_china_war_get_YUN_alignment]\n\n$CHN_south_china_war_closing$"
 china_events.452.a: "Chúng ta sẽ tuyên chiến với Liêu Quảng."
 china_events.452.b: "Chúng ta sẽ tuyên chiến với Vân Nam."
 china_events.452.c: "Chúng ta sẽ tuyên chiến với cả hai."
 china_events.452.e: "Chúng ta sẽ tuyên bố trung lập trong cuộc xung đột này."

 china_events.453.t: "Một cuộc chiến vì miền Nam?"
 china_events.453.d: "Chiến tranh đã nổ ra giữa Hồ Nam và Liêu Quảng (\" Hai Guangs \" của Quảng Đông và Quảng Tây), đưa hai một lần nữa vào một khóa học va chạm trong thời kỳ hậu Hán Đài. Hồ Nam thường thấy mình bị bắt giữa các lĩnh vực Bắc Kinh và Quảng Châu, và mặc dù một số phe phái trong Hồ Nam đã tìm kiếm mối quan hệ thân thiện với cánh cửa quay vòng của các phe phái cầm quyền ở Liêu Quảng, có vẻ như hòa bình chỉ đơn giản là không được.\n\n[CHN_south_china_war_get_GXC_alignment]\n\n[CHN_south_china_war_get_YUN_alignment]\n\n$CHN_south_china_war_closing$"
 china_events.453.a: "Chúng ta sẽ tuyên chiến với Liêu Quảng."
 china_events.453.b: "Chúng ta sẽ tuyên chiến với Hồ Nam."
 china_events.453.c: "Chúng ta sẽ tuyên chiến với cả hai."
 china_events.453.e: "Chúng ta sẽ tuyên bố trung lập trong cuộc xung đột này."

 china_events.460.t: "Chiến tranh Hoa Nam"
 china_events.460.d: "Miền Nam Trung Quốc đã chuyển thành một tự do cho tất cả sau khi [FROM.GetLeader] đưa ra quyết định táo bạo để can thiệp với tư cách là bên thứ ba trong cuộc xung đột hiện có giữa các nước láng giềng. Điều này làm tăng thêm một nếp nhăn cho nền chính trị vốn đã phức tạp của khu vực khi các lực lượng từ Liêu Quảng, Hồ Nam và Vân Nam chiến đấu độc lập để giành quyền lực trên toàn bộ khu vực.\n\nSự phản bội và bạo lực không có gì mới ở miền Nam, nơi đã trải qua những biến động to lớn cả trong thời đại quân phiệt tối cao và bây giờ là sự sụp đổ sau Trực Lệ. Nhưng liệu cuộc chiến này sẽ chứng kiến một người chiến thắng chiến thắng duy nhất trong số họ hay nó chỉ làm suy yếu tất cả họ trước khi một thế lực bên ngoài chinh phục họ là một câu hỏi khác."
 china_events.460.a: "Chúng ta sẽ chiến thắng."
 china_events.460.b: "Miền Nam Trung Quốc rơi vào tình trạng hỗn loạn."

 china_events.461.t: "Chiến tranh Hoa Nam"
 china_events.461.d: "Lưỡng Quảng là trên chân sau khi một cuộc xung đột với một trong những nước láng giềng của nó dẫn đến cả Vân Nam và Hồ Nam hợp tác để tiêu diệt chúng. Được cho là mạnh nhất trong ba quốc gia quân phiệt phía nam, tuy nhiên điều này được dự kiến sẽ là một cuộc khủng hoảng khó khăn cho [GXC.GetLeader] để điều hướng.\n\nSự phản bội và bạo lực không có gì mới ở miền Nam, đã trải qua những biến động to lớn cả trong thời đại quân phiệt tối cao và bây giờ là sự sụp đổ sau Trực Lệ. Nhưng liệu cuộc chiến này sẽ thấy một hình thức thống nhất lâu dài giữa họ hay nếu nó chỉ làm suy yếu tất cả họ trước khi một thế lực bên ngoài chinh phục họ là một câu hỏi khác."
 china_events.461.a: "Chúng ta sẽ chiến thắng."
 china_events.461.b: "Miền Nam Trung Quốc rơi vào tình trạng hỗn loạn."

 china_events.462.t: "Chiến tranh Hoa Nam"
 china_events.462.d: "Hồ Nam là trên chân sau khi một cuộc xung đột với một trong những nước láng giềng của nó dẫn đến cả hai Lưỡng Quảng và Vân Nam hợp tác để tiêu diệt chúng. Theo truyền thống dựa vào Trực Lệ để bảo vệ họ, có vẻ như rằng ít nhất cho bây giờ [HNN.GetLeader] sẽ buộc phải chiến đấu với cuộc xung đột này không có đồng minh bên cạnh các quân phiệt Quý Châu họ đứng lên ở phía tây.\n\nSự phản bội và bạo lực không có gì mới ở miền Nam, đã trải qua những biến động to lớn cả trong thời đại quân phiệt tối cao và bây giờ là sự sụp đổ sau Trực Lệ. Nhưng liệu cuộc chiến này sẽ thấy một hình thức thống nhất lâu dài giữa họ hay nếu nó chỉ làm suy yếu tất cả họ trước khi một thế lực bên ngoài chinh phục họ là một câu hỏi khác."
 china_events.462.a: "Chúng ta sẽ chiến thắng."
 china_events.462.b: "Miền Nam Trung Quốc rơi vào tình trạng hỗn loạn."

 china_events.463.t: "Chiến tranh Hoa Nam"
 china_events.463.d: "Vân Nam là trên chân sau khi một cuộc xung đột với một trong những nước láng giềng của nó dẫn đến cả hai Lưỡng Quảng và Hồ Nam hợp tác để tiêu diệt chúng. Một nhà nước quân phiệt tây nam hùng mạnh và quân sự nặng nề, [YUN.GetLeader] và các đồng minh của ông sẽ vẫn được khó khăn-ép để chiến đấu với cuộc xung đột này không có đồng minh bên cạnh chính phủ Vân Nam hậu thuẫn ở Quý Châu.\n\nSự phản bội và bạo lực không có gì mới ở miền Nam, đã trải qua những biến động to lớn cả trong thời đại quân phiệt tối cao và bây giờ là sự sụp đổ sau Trực Lệ. Nhưng liệu cuộc chiến này sẽ thấy một hình thức thống nhất lâu dài giữa họ hay nếu nó chỉ làm suy yếu tất cả họ trước khi một thế lực bên ngoài chinh phục họ là một câu hỏi khác."
 china_events.463.a: "Chúng ta sẽ chiến thắng."
 china_events.463.b: "Miền Nam Trung Quốc rơi vào tình trạng hỗn loạn."

 china_events.464.t: "Động viên cho cuộc chiến toàn quốc"
 china_events.464.d: "$CUF_call_of_the_united_front_idea_1_desc$"
 china_events.464.a: "Chúng ta phải bỏ qua sự khác biệt của chúng ta, ngay bây giờ."

 china_events.465.t: "Những thất bại trong kháng chiến"
 china_events.465.d: "$CUF_call_of_the_united_front_idea_2_desc$"
 china_events.465.a: "Người dân đã thực sự thức tỉnh!"
 china_events.465.b: "Sự kháng cự của Trung Quốc trở nên cứng rắn."
 china_events.465_tt: "§R Trung Quốc đã mất hơn một phần ba số thành phố trọng điểm. §!"

 china_events.466.t: "Trận chiến cuối cùng của Trung Hoa"
 china_events.466.d: "$CUF_call_of_the_united_front_idea_3_desc$"
 china_events.466.a: "Đừng quên chuyện xảy ra ở Ju."
 china_events.466.b: "Tiếng thở hổn hển cuối cùng của địch."
 china_events.466_tt: "§R Trung Quốc đã mất hơn một nửa số thành phố trọng điểm. §!"

 china_events.470.t: "Trương Học Lương chạy trốn đến [ROOT.Capital.GetCapitalVictoryPointName]"
 china_events.470.d: "Vụ ám sát Trương Tác Lâm đã dẫn đến sự can thiệp trực tiếp của Nhật Bản để tiết kiệm các khoản đầu tư của họ và đã gây ra một cuộc chiến tranh rộng lớn hơn. Người Nhật và chính phủ mới dưới thời Dương Vũ Đình đã đổ lỗi cho các phe phái bên ngoài Trung Quốc về cái chết của ông trong khi những người khác chỉ tay vào Quân đội Kwantung. Dù trong trường hợp nào, dường như hầu hết An Quốc quân cũ đã đóng cửa hàng ngũ đằng sau Dương Vũ Đình chứ không phải là con trai của Trương Tác Lâm Trương Học Lương, thích năng lực của cựu và cũng sợ trả thù của Nhật Bản.\n\nTrương Tử Lương và những người trung thành còn lại của ông ta đã rút lui vào lãnh thổ của chúng ta để tìm nơi trú ẩn. Quân đội Đông Bắc của Zhang vẫn có chất lượng đáng kể nhưng đã bị đánh đập bởi nhiều năm chiến tranh và những thất bại gần đây (có lẽ trong tay chúng ta). Tích hợp một lực lượng lớn và độc lập như vậy là một rủi ro chính trị nghiêm trọng, vì vậy bộ chỉ huy cao cấp đã khuyên mạnh mẽ nên tách nó thành các thành phần nhỏ hơn và sử dụng chúng để bổ sung hàng ngũ của chúng ta (và xáo trộn Zhang và các sĩ quan của ông ta vào các công việc nhân viên bất lực) nhưng điều đó có thể sẽ mang lại những rủi ro nghiêm trọng cho hiệu quả ngay lập tức. Và với xung đột ngay lập tức trên đường chân trời, không có quyết định dễ dàng nào về cách xử lý con trai út của Nguyên soái già."
 china_events.470.a: "Đưa họ ra mặt trận ngay lập tức!"
 china_events.470.b: "Bắt giữ các tướng lĩnh của họ, giải giáp các đơn vị của họ và tiêu diệt các sư đoàn đào ngũ Dongbei."

 china_events.471.t: "Số phận của Đông Bắc quân"
 china_events.471.d: "Một thời gian ngắn trước khi bắt đầu Chiến tranh Trung-Nhật lần thứ hai, \" Nguyên soái trẻ \" Trương Học Lương và những người trung thành bị đánh đập của ông đã trốn sang chúng ta để trú ẩn, mất quyền kiểm soát vùng Đông Bắc sau cái chết của người cha đáng kính hơn nhiều. Mặc dù được ca ngợi vì lòng yêu nước và từ chối chiến đấu cho Nhật Bản, nhưng anh ta và người của mình luôn có một động cơ thầm kín trong đầu - việc cải tạo Dongbei.\n\nZhang trẻ hơn đã ép yêu sách của mình với [ROOT.GetLeader] và các quan chức cấp cao khác, dường như đã thừa hưởng sự táo bạo của Thẩm Dương Tiger. Tất nhiên anh ta thề sẽ trung thành với chính phủ của chúng ta, nhưng mọi người đều biết không có gì tốt đẹp có thể đến từ việc cho phép một bè phái Phụng Thiên mới được thành lập tại một trong những khu vực công nghiệp hóa nhất (mặc dù bị tàn phá từ chiến tranh) của Trung Quốc.\n\nQuân đội Đông Bắc không bao giờ thực sự hòa nhập vào quân đội của chúng ta, ngay cả khi họ chiến đấu bên cạnh chúng ta trong cuộc xung đột. Họ được kiểm soát thông qua một hỗn hợp của chủ nghĩa dân tộc thực sự, hối lộ và nuông chiều, và áp lực công cộng và quân sự. Có lẽ đã đến lúc đơn giản phải đối mặt với điều không thể tránh khỏi và thanh trừng họ khỏi hàng ngũ của chúng ta, mặc dù với một chút xảo quyệt (và tâng bốc) của riêng chúng ta có lẽ chúng ta có thể giữ Zhang lâu hơn một chút."
 china_events.471.a: "Đơn giản là hắn đã sống lâu hơn sự hữu dụng của mình."
 china_events.471.b: "Chúng ta có thể trói hắn vô thời hạn."
 CHN_devastation_of_dongbei_accelerated_idea_purge_tt: "§Y Thanh trừng quân đội Dongbei trong bối cảnh tái thiết nhanh chóng của Dongbei sẽ giúp đóng dấu vững chắc quyền lực của chúng ta đối với khu vực. §!"
 CHN_devastation_of_dongbei_minimal_idea_recruit_tt: "§Y Hòa giải với Quân đội Dongbei trong bối cảnh tái thiết Dongbei tối thiểu của chúng ta sẽ giúp giảm sự bất ổn trong khu vực. §!"

 china_events.472.t: "Một chính phủ đối địch sụp đổ"
 china_events.472.d: "Một chính phủ lớn đã sụp đổ trong Chiến tranh Kháng chiến của chúng ta, ném lực lượng của họ vào tình trạng lộn xộn và để lại những khoảng trống lớn trên tiền tuyến. Trong khi [FROM.GetLeader] và nội các của ông đã chạy trốn hoặc lưu vong hoặc dưới lòng đất (không tin tưởng chúng ta hoặc những người khác với sự an toàn của họ) và nhiều lực lượng của họ tan chảy hoặc gia nhập họ, một số đơn vị vô tổ chức của họ đã từ từ tiến vào lãnh thổ của chúng ta.\n\nHọ được vội vã tái tổ chức thành những đơn vị có chất lượng đáng ngờ dưới quyền các sĩ quan của chúng ta, với hy vọng sớm đưa họ trở lại tiền tuyến. Chúng ta chỉ có thể mong số tàn quân [FROM.GetAdjective] này đủ trung thành để làm bia đỡ đạn cho binh sĩ của mình."
 china_events.472.a: "Thời gian rất quý báu, hãy đưa họ trở lại mặt trận!"
 china_events.472.b: "Chúng ta nên kiểm tra kỹ lưỡng lòng trung thành của họ"

 china_events.473.t: "Một quân phiệt đầu hàng"
 china_events.473.d: "Một chính phủ quân phiệt đã sụp đổ trong Chiến tranh Kháng chiến của chúng ta, ném lực lượng của họ vào tình trạng lộn xộn và để lại những khoảng trống tiềm năng trên tiền tuyến. Trong khi [FROM.GetLeader] và bè lũ của anh ta đã trốn sang lưu vong hoặc dưới lòng đất (không tin tưởng chúng ta hoặc những người khác với sự an toàn của họ) và nhiều lực lượng của họ tan chảy hoặc gia nhập họ, một số đơn vị vô tổ chức của họ đã từ từ tiến vào lãnh thổ của chúng ta.\n\nHọ được vội vã tái tổ chức thành những đơn vị có chất lượng đáng ngờ dưới quyền các sĩ quan của chúng ta, với hy vọng sớm đưa họ trở lại tiền tuyến. Chúng ta chỉ có thể mong số tàn quân [FROM.GetAdjective] này đủ trung thành để làm bia đỡ đạn cho binh sĩ của mình."
 china_events.473.a: "Xem xét chúng một cách nhanh chóng và sau đó gửi chúng trở lại phía trước ngay lập tức!"
 china_events.473.b: "Giải tán họ và triển khai các tiểu đoàn của họ để củng cố các sư đoàn hiện có của chúng ta."

 china_events.474.t: "Sự tàn phá tại Đông Bắc"
 china_events.474.d: "Đông Bắc Trung Quốc (còn được gọi là Dongbei hoặc Mãn Châu) là một trong những khu vực thịnh vượng nhất của Trung Quốc bước vào thập niên 1930, nhưng bạn sẽ không biết điều đó nếu bạn đi du lịch đến đó ngày hôm nay. \" Con trai cả của Cộng hòa \" là một trong những khu vực đầu tiên công nghiệp hóa trên đỉnh là một giỏ bánh mì lớn, nhưng chiến tranh đã gây ra thiệt hại chưa kể cho ngành công nghiệp nặng nổi tiếng của họ và di dời hàng triệu người.\n\nSự chiếm đóng của chúng ta trong khu vực đã mang lại cho chúng ta một lợi ích đáng kể trong nỗ lực đoàn kết Trung Quốc, nhưng còn lâu mới hoàn hảo. cướp bóc bằng cách tiến quân và rút lui quân đội, sự kết hợp của nhân viên từ chế độ cũ, băng đảng lang thang và quân nổi dậy, việc chiếm đoạt tài sản của đối phương đang diễn ra, và việc cài đặt quản lý mới trong khu vực đã gây ra sự hỗn loạn đáng kể."
 china_events.474.a: "Những việc này cần có thời gian, chúng ta phải thật kỹ lưỡng."
 china_events.474.b: "Nội chiến sắp xảy ra, hãy để lại một đơn vị đồn trú tối thiểu."
 china_events.474.c: "Chúng ta phải làm mọi thứ có thể để đẩy nhanh quá trình này!"

### Foreign Policy Events

#KMT Foreign Policy Events (000-199):
 CHN.foreignpolicy.001.t: "Các [FROM.GetFactionName] tăng"
 CHN.foreignpolicy.001.d.sinopacific_friendship_association: "Hôm nay, Bộ Ngoại giao của [FROM.GetName] đã công bố một hướng đi mới trong chính sách đối ngoại Trung Quốc. Trích dẫn sự thành công và chống chủ nghĩa đế quốc của Cách mạng Quốc gia Trung Quốc - [FROM.GetName] đã chính thức tuyên bố ý định làm việc với các nước độc lập mới ở châu Á thuộc Hiệp hội Hữu nghị Trung-Thái Bình Dương.\n\nHướng kế hoạch của hiệp hội là làm việc với các quốc gia mới nổi và xã hội chủ nghĩa ở châu Á và châu Phi, để khuyến khích phát triển kinh tế và tự túc quốc gia trong một trật tự thế giới mới đang nổi lên, nơi các nước hiện đang tìm kiếm khoảng cách xa cả Reichspakt và Quốc tế thứ ba."
 CHN.foreignpolicy.001.d.internationale_of_the_east_standard: "Hôm nay, Bộ Ngoại giao của [FROM.GetName] đã công bố một hướng đi mới trong chính sách đối ngoại Trung Quốc. Trích dẫn sự thành công và chống chủ nghĩa đế quốc của Cách mạng Quốc gia Trung Quốc - [FROM.GetName] đã chính thức tuyên bố thành lập \" Internationale \" của riêng mình ở châu Á.\n\nCác mục tiêu và định hướng được lên kế hoạch của Quốc tế này là cung cấp viện trợ kinh tế và chính trị cho tất cả các quốc gia châu Á bất kể ý thức hệ và tôn giáo, để các nước châu Á có thể tham gia vào một trật tự thế giới mới đang nổi lên trong đó các nước mới được giải phóng cuối cùng có thể thách thức quyền bá chủ của Entente và Reichspakt."
 CHN.foreignpolicy.001.d.internationale_of_the_east_and_minshengpartnership: "Hôm nay, Bộ Ngoại giao [FROM.GetName] công bố một đường hướng mới trong chính sách đối ngoại của Trung Quốc. Viện dẫn thành công và tinh thần chống đế quốc của Cách mạng Quốc dân Trung Quốc, [FROM.GetName] chính thức tuyên bố sẽ thành lập một \"Quốc tế\" riêng tại châu Á.\n\nBên cạnh đó, Chủ tịch [FROM.GetLeader] cũng công bố việc thành lập \"Quan hệ Đối tác Kinh tế Hợp tác Dân sinh Nhân dân\" nhằm thúc đẩy hợp tác kinh tế giữa các quốc gia châu Á, đồng thời truyền bá Chủ nghĩa Tam Dân. Động thái này thách thức mạnh mẽ quyền bá chủ của phương Tây, cho thấy các quốc gia châu Á đang tham gia xây dựng một trật tự thế giới mới."
 CHN.foreignpolicy.001.d.asian_peoples_antiimperialism_league: "Hôm nay, Bộ Ngoại giao của [FROM.GetName] tuyên bố rằng Chính phủ Trung Quốc sẽ theo đuổi một đường lối cứng rắn trong các vấn đề quốc tế, chính thức theo đuổi Liên minh Chống đế quốc của Nhân dân Châu Á để củng cố bản thân và các vệ tinh chống lại chủ nghĩa đế quốc nước ngoài.\n\nTrong khi tuyên bố sự cần thiết phải duy trì nguyên tắc an ninh không thể phân chia giữa các thành viên của mình, trong thực tế nó là một phần mở rộng của cái gọi là \" Sinosphere \" khái niệm, như Tổng tư lệnh [FROM.GetLeader] và Quốc dân đảng đã chỉ ra rằng họ tìm cách theo đuổi một dân tộc và hướng ultranationalist liên quan đến liên kết của họ trên thế giới. Nhiều người tự hỏi liệu điều này có nghĩa là Trung Quốc sẽ bạo lực bảo đảm biên giới của nó hoặc nếu bây giờ họ sẽ chuyển vào bên trong để cô lập."
 CHN.foreignpolicy.001.d.asian_peoples_internationale: "Hôm nay, Bộ Ngoại giao cho [FROM.GetName] đã công bố một hướng đi mới trong chính sách đối ngoại của Trung Quốc. Trích dẫn sự thành công và chống chủ nghĩa đế quốc của Cách mạng Quốc gia Trung Quốc - [FROM.GetName] đã chính thức tuyên bố thành lập một \" Asian People Internationale \" để thúc đẩy hợp tác Pan-Asian từ các quốc gia hậu thuộc địa.\n\n[FROM.GetLeader] đã đưa ra giả thuyết rằng thế giới là một chiến trường giữa chủ nghĩa đế quốc và chủ nghĩa phản đế, và cả hai cường quốc tư bản và quốc tế thứ ba cuối cùng sẽ sụp đổ. Ông và những người theo chủ nghĩa dân tộc khác tuyên bố rằng không giống như Nhật Bản, họ sẽ thúc đẩy hỗ trợ lẫn nhau và viện trợ phát triển, không khuất phục ở lục địa vì họ hy vọng sẽ đạt được Datong \" toàn cầu. \""
 CHN.foreignpolicy.001.d.new_asia_alliance: "Hôm nay, Bộ Ngoại giao cho [FROM.GetName] đã công bố một hướng đi mới trong chính sách đối ngoại của Trung Quốc. Trích dẫn sự thành công và chống chủ nghĩa đế quốc của Cách mạng Quốc gia Trung Quốc - [FROM.GetName] đã chính thức tuyên bố thành lập Liên minh châu Á mới \" \" để thúc đẩy phi thực dân hóa hòa bình và hợp tác ở châu Á.\n\n[FROM.GetLeader] và các nhà lãnh đạo dân tộc ôn hòa khác từ lâu đã tham gia đối thoại với các lực lượng chống thực dân khác trên Lục địa, hy vọng có sự đoàn kết và trao đổi văn hóa giữa các dân tộc châu Á trong khi bác bỏ chủ nghĩa quốc tế xã hội chủ nghĩa. Liên minh mới này, được đặt theo tên của Hiệp hội Châu Á mới, tìm cách đặt các quốc gia mới trên cơ sở bình đẳng nhưng trong thực tế sẽ bị chi phối bởi Trung Quốc."
 CHN.foreignpolicy.001.a: "Một mối đe dọa ở phương Đông!"
 CHN.foreignpolicy.001.b: "Một lực lượng giải phóng?"
 CHN.foreignpolicy.001.c: "Trung Quốc uốn cong cơ bắp của mình."

 CHN.foreignpolicy.002.t: "Lời mời tham gia [FROM.GetFactionName]"
 CHN.foreignpolicy.002.d: "Sáng nay đại sứ của chúng ta đã chào đón phái đoàn Trung Quốc từ [FROM.GetNameDef]. Đại sứ Trung Quốc bày tỏ chân thành hy vọng của mình rằng chúng ta nên làm việc cùng với Chính phủ Trung Quốc trong tình đoàn kết cho cuộc cách mạng chống thực dân quốc tế chống lại chủ nghĩa đế quốc nước ngoài. Các nguồn lực của chúng ta sẽ được chia sẻ và các lực lượng quân sự của chúng ta sẽ tích cực làm việc cùng nhau trong các cuộc tập trận quân sự chung để tăng cường hợp tác Pan-Asian của chúng ta.\n\nTrong khi chắc chắn có những người trong chính phủ của chúng ta ủng hộ một quyết định như vậy, cũng có những người khác nghi ngờ ý định của Trung Quốc và lo lắng rằng chúng ta sẽ chỉ đơn thuần thấy mình là kẻ lừa đảo hoặc con rối trong trật tự mới của họ ở châu Á."
 CHN.foreignpolicy.002.a: "Cùng nhau vì Pan-Asianism!"
 CHN.foreignpolicy.002.b: "Không, chúng ta không có gì để đạt được từ đó!"

 CHN.foreignpolicy.003.t: "[FROM.GetNameDefCap] tham gia với chúng ta!"
 CHN.foreignpolicy.003.d: "Dường như Bộ Ngoại giao của chúng ta đã một lần nữa hoàn thành một kỳ tích đáng chú ý về thành công ngoại giao khi ông đã thuyết phục [FROM.GetNameDef] làm việc với chúng ta và tham gia vào cuộc đấu tranh quốc tế lớn hơn và cách mạng chống lại chủ nghĩa đế quốc nước ngoài. Chúng ta hãy hy vọng rằng mối quan hệ này với [FROM.GetNameDef] sẽ chứng minh là kéo dài đến cuối thời gian, khi chúng ta kiên quyết tuyên chiến với tất cả các đế quốc nước ngoài - vì một châu Á tự do!"
 CHN.foreignpolicy.003.a: "Đoàn kết là sức mạnh!"

 CHN.foreignpolicy.004.t: "[FROM.GetNameDefCap] Từ chối lời mời của chúng ta"
 CHN.foreignpolicy.004.d: "Thật không may, bất chấp những nỗ lực tốt nhất của mình, dường như đại sứ của chúng ta đã thất bại trong việc thuyết phục [FROM.GetNameDef] tham gia vào cuộc đấu tranh chống đế quốc chung của chúng ta. Dường như người dân [FROM.GetNameDef] đã giả định điều tồi tệ nhất trong ý định của chúng ta hoặc đơn giản là họ không coi trọng sức mạnh của chúng ta. Họ đã chọn đứng một mình mà không có sự bảo vệ và lãnh đạo của chúng ta, một rủi ro mà họ đã tự mang lại."
 CHN.foreignpolicy.004.a: "Thiệt cho họ thôi."

 CHN.foreignpolicy.005.t: "Hội nghị Á–Phi"
 CHN.foreignpolicy.005.nomafcollapse.d: "Trật tự thế giới cũ của Kaiserreich đã bị thách thức kể từ sự sụp đổ của nền kinh tế toàn cầu tư bản như là hậu quả của Thứ Hai Đen. Ở châu Á, sự sụp đổ kinh tế của [GER.GetNameDef] đã gửi những gợn sóng qua thế giới thuộc địa với Indochina Đang tăng năm 1936 cũng như sự sụp đổ của Liên minh Tám tỉnh. Việc hoàn thành gần đây của Bắc Expedition cũng như Chiến tranh Kháng chiến đã củng cố [FROM.GetNameDef] là quốc gia đầu tiên ở châu Á đánh bại thành công các lực lượng của chủ nghĩa đế quốc.\n\nKết quả là [FROM.GetLeader] và Bộ Ngoại giao của Quốc dân đảng đã quyết định tổ chức Hội nghị các nhà lãnh đạo và đại sứ châu Á-Phi để tập hợp và thảo luận về những thay đổi chính trị mới đang phát triển. Trong khi các quốc gia châu Phi vẫn chưa giành được độc lập từ người Đức, người Trung Quốc rất vui mừng chào đón các nhà cách mạng châu Phi với tư cách là đồng chí cách mạng trong cuộc chiến tranh quốc tế lớn hơn chống lại chủ nghĩa đế quốc.\n\nCác đại biểu tại hội nghị đã quyết định phê chuẩn và thừa nhận các nguyên tắc chính của việc quản lý một thế giới châu Á-Phi hậu thuộc địa bao gồm thiết lập thiện chí với tất cả các thành viên của hội nghị, để kiểm tra các vấn đề xã hội và văn hóa, và để nâng cao khả năng quốc tế của thế giới đang phát triển đối với cộng đồng quốc tế. Một kỷ nguyên mới đang bắt đầu ở châu Á, và quốc gia Trung Quốc dưới [FROM.GetLeader] rất vui khi đóng vai trò tích cực trong việc thúc đẩy một tương lai chung cho thế giới đang phát triển."
 CHN.foreignpolicy.005.mafcollapse.d: "Trật tự thế giới cũ của Kaiserreich đã bị thách thức kể từ sự sụp đổ của nền kinh tế toàn cầu tư bản như là hậu quả của Thứ Hai Đen. Ở châu Á, sự sụp đổ kinh tế của [GER.GetNameDef] đã gửi những gợn sóng qua thế giới thuộc địa với Indochina Đang tăng năm 1936 cũng như sự sụp đổ của Liên minh Tám tỉnh. Việc hoàn thành gần đây của Bắc Expedition cũng như Chiến tranh Kháng chiến đã củng cố [FROM.GetNameDef] là quốc gia đầu tiên ở châu Á đánh bại thành công các lực lượng của chủ nghĩa đế quốc.\n\nKết quả là [FROM.GetLeader] và Bộ Ngoại giao của Quốc dân đảng đã quyết định tổ chức một Hội nghị Afro-Asian của các nhà lãnh đạo và đại sứ của các nước đang phát triển để tập hợp và thảo luận về những thay đổi chính trị mới đang phát triển. Sự sụp đổ và tan vỡ mạnh mẽ của Mittelafrika của Đức đã dẫn đến sự trỗi dậy của chủ nghĩa dân tộc châu Phi và người Trung Quốc rất vui mừng chào đón các quốc gia mới của châu Phi với tư cách là đồng chí cách mạng trong cuộc chiến tranh quốc tế lớn hơn chống lại chủ nghĩa đế quốc.\n\nCác đại biểu tại hội nghị đã quyết định phê chuẩn và thừa nhận các nguyên tắc chính của việc quản lý một thế giới châu Á-Phi hậu thuộc địa bao gồm thiết lập thiện chí với tất cả các thành viên của hội nghị, để kiểm tra các vấn đề xã hội và văn hóa, và để nâng cao khả năng quốc tế của thế giới đang phát triển đối với cộng đồng quốc tế. Một kỷ nguyên mới đang bắt đầu ở châu Á, và quốc gia Trung Quốc dưới [FROM.GetLeader] rất vui khi đóng vai trò tích cực trong việc thúc đẩy một tương lai chung cho thế giới đang phát triển."
 CHN.foreignpolicy.005.a: "Chúc mừng một kỷ nguyên mới!"
 CHN.foreignpolicy.005.b: "Một sáng kiến đáng khen ngợi!"
 CHN.foreignpolicy.005.c: "Chúng ta có kế hoạch của riêng mình."

 CHN.foreignpolicy.0050.t: "Hội nghị thượng đỉnh Quảng Châu"
 CHN.foreignpolicy.0050.nomafcollapse.d: "Trật tự thế giới cũ của Kaiserreich đã bị thách thức kể từ sự sụp đổ của nền kinh tế toàn cầu tư bản chủ nghĩa như là hậu quả của Thứ Hai Đen. Ở châu Á, sự sụp đổ kinh tế của [GER.GetNameDef] đã gửi những gợn sóng qua thế giới thuộc địa với Indochina Đang tăng năm 1936 cũng như sự sụp đổ của Liên minh Tám tỉnh. Chiến thắng gần đây trong Nội chiến Trung Quốc đã củng cố [FROM.GetNameDef] là quốc gia đầu tiên ở châu Á đánh bại thành công các lực lượng đế quốc.\n\nKết quả là [FROM.GetLeader] và Bộ Ngoại giao Trung Quốc đã quyết định tổ chức một hội nghị thượng đỉnh tại Quảng Châu của các nhà lãnh đạo và đại sứ của các nước đang phát triển để tập hợp và thảo luận về những thay đổi chính trị mới đang phát triển. Trong khi các quốc gia châu Phi vẫn chưa giành được độc lập từ người Đức, người Trung Quốc rất vui mừng chào đón các nhà cách mạng châu Phi như những đồng chí cách mạng trong cuộc chiến tranh quốc tế lớn hơn chống lại chủ nghĩa đế quốc.\n\nCác đại biểu tại hội nghị đã quyết định phê chuẩn và thừa nhận các nguyên tắc chính của việc quản lý một cuộc cách mạng thế giới quốc tế hậu thuộc địa dựa trên nền tảng nông dân. Hội nghị bao gồm thiết lập thiện chí với tất cả các thành viên của hội nghị, để kiểm tra các vấn đề xã hội và văn hóa, và nâng cao khả năng quốc tế của thế giới đang phát triển đối với cộng đồng quốc tế. Một kỷ nguyên mới đang bắt đầu ở châu Á và quốc gia Trung Quốc dưới [FROM.GetLeader] rất vui khi đóng vai trò tích cực trong việc thúc đẩy một tương lai chung cho thế giới đang phát triển."
 CHN.foreignpolicy.0050.mafcollapse.d: "Trật tự thế giới cũ của Kaiserreich đã bị thách thức kể từ sự sụp đổ của nền kinh tế toàn cầu tư bản chủ nghĩa như là hậu quả của Thứ Hai Đen. Ở châu Á, sự sụp đổ kinh tế của [GER.GetNameDef] đã gửi những gợn sóng qua thế giới thuộc địa với Indochina Đang tăng năm 1936 cũng như sự sụp đổ của Liên minh Tám tỉnh. Chiến thắng gần đây trong Nội chiến Trung Quốc đã củng cố [FROM.GetNameDef] là quốc gia đầu tiên ở châu Á đánh bại thành công các lực lượng đế quốc.\n\nKết quả là [FROM.GetLeader] và Bộ Ngoại giao Trung Quốc đã quyết định tổ chức một hội nghị thượng đỉnh tại Quảng Châu của các nhà lãnh đạo và đại sứ của các nước đang phát triển để tập hợp và thảo luận về những thay đổi chính trị mới đang phát triển. Sự sụp đổ và tan vỡ mạnh mẽ của Mittelafrika của Đức đã dẫn đến sự trỗi dậy của chủ nghĩa dân tộc châu Phi và người Trung Quốc rất vui mừng được chào đón các quốc gia mới ở châu Phi như những đồng chí cách mạng trong cuộc chiến tranh quốc tế lớn hơn chống lại chủ nghĩa đế quốc.\n\nCác đại biểu tại hội nghị đã quyết định phê chuẩn và thừa nhận các nguyên tắc chính của việc quản lý một cuộc cách mạng thế giới quốc tế hậu thuộc địa dựa trên nền tảng nông dân. Hội nghị bao gồm thiết lập thiện chí với tất cả các thành viên của hội nghị, để kiểm tra các vấn đề xã hội và văn hóa, và nâng cao khả năng quốc tế của thế giới đang phát triển đối với cộng đồng quốc tế. Một kỷ nguyên mới đang bắt đầu ở châu Á và quốc gia Trung Quốc dưới [FROM.GetLeader] rất vui khi đóng vai trò tích cực trong việc thúc đẩy một tương lai chung cho thế giới đang phát triển."
 CHN.foreignpolicy.0050.a: "Chúc mừng một kỷ nguyên mới!"
 CHN.foreignpolicy.0050.b: "Một sáng kiến đáng khen ngợi!"
 CHN.foreignpolicy.0050.c: "Chúng ta có kế hoạch của riêng mình."

 CHN.foreignpolicy.006.t: "[FROM.GetNameDefCap] Cung cấp đầu tư"
 CHN.foreignpolicy.006.d: "Sáng nay, chúng ta đã nhận được tin từ đại sứ của [FROM.GetNameDef] rằng đất nước của họ đang tìm cách đầu tư vào quốc gia trẻ mới của chúng ta. Gần đây chúng ta vừa giành được và bảo đảm độc lập, tuy nhiên cơ sở công nghiệp và vốn của chúng ta còn thiếu so với các quốc gia công nghiệp còn lại trên thế giới. [FROM.GetNameDefCap] đã đề nghị đầu tư vào quốc gia của chúng ta để chúng ta có thể đẩy nhanh quá trình công nghiệp hóa và như một phương tiện để chúng ta chống lại xu hướng tư bản của các quốc gia đế quốc. Tuy nhiên, có một số người trong chính phủ của chúng ta phản đối các biện pháp như vậy vì điều này có thể tạo ra ảnh hưởng không mong muốn của [FROM.GetNameDef] và rất có thể chỉ là một phương tiện của đất nước họ đang cố gắng tận dụng lợi thế của quốc gia trẻ của chúng ta."
 CHN.foreignpolicy.006.a: "Chúng ta vui lòng chấp nhận."
 CHN.foreignpolicy.006.b: "Chúng ta lịch sự từ chối."

 CHN.foreignpolicy.007.t: "[FROM.GetNameDefCap] chấp nhận đầu tư"
 CHN.foreignpolicy.007.d: "Chúng ta đã nhận được tin tức tuyệt vời từ đại sứ của chúng ta đến [FROM.GetNameDef] rằng đất nước của họ đã chấp nhận những bất lợi đầu tư của chúng ta. Cùng nhau, chúng ta sẽ có thể phát triển sức mạnh kinh tế và giúp họ phát triển thành một sức mạnh đang lên mới đồng thời hỗ trợ các nỗ lực công nghiệp và phục hồi của chúng ta. Có thể đây là khởi đầu của một tình bạn lâu dài và hiệu quả trong những năm tới!."
 CHN.foreignpolicy.007.a: "Sự khởi đầu của một quan hệ đối tác hiệu quả."

 CHN.foreignpolicy.008.t: "[FROM.GetNameDefCap] thúc đẩy đầu tư"
 CHN.foreignpolicy.008.d: "Chúng ta đã nhận được tin tức đáng thất vọng từ đại sứ của chúng ta đến [FROM.GetNameDef] rằng họ không muốn chấp nhận cơ hội đầu tư của chúng ta và đã từ chối lời đề nghị duyên dáng của chúng ta. Có lẽ họ xem tiếp cận biết ơn của chúng ta là một mối đe dọa nước ngoài hoặc đơn giản là họ không tin tưởng rằng những gì chúng ta tìm kiếm là một mối quan hệ cùng có lợi cho cả hai quốc gia của chúng ta. Cho dù lý do của họ có thể, đó là mất mát của họ mà họ đã từ chối lời đề nghị hào phóng của chúng ta."
 CHN.foreignpolicy.008.a: "Chúng ta chúc họ may mắn, họ sẽ cần điều đó."

 #Joining the INT has been moved to generic China decisions category

 CHN.foreignpolicy.009.t: "Chúng ta được mời tham gia MCEP"
 CHN.foreignpolicy.009.d: "Sau thông báo của họ về một hướng đi mới trong chính sách đối ngoại và thương mại quốc tế, [FROM.GetNameDef] đã công bố việc chấm dứt hợp tác kinh tế \" Dân sinh Partnrship \" . Dành riêng để chống lại các chế độ áp bức của chủ nghĩa tư bản trong khi cũng cung cấp một phương tiện đầy đủ cho các nước châu Á trẻ hiện đại hóa ở các nước không có đủ công nghiệp hóa, MCEP nhằm mục đích ràng buộc các quốc gia châu Á với nhau trong một hợp tác kinh tế do quốc gia Trung Quốc lãnh đạo. Trong khi có nhiều người trong chính phủ của chúng ta ủng hộ hành động này và tin rằng điều này sẽ mang lại lợi ích cho nền kinh tế của chúng ta rất nhiều - cũng có những người coi cái gọi là hợp tác này là một hành động của chủ nghĩa đế quốc bởi Trung Quốc; vì sau khi tất cả nó được tổ chức và tập trung xung quanh lãnh đạo Trung Quốc."
 CHN.foreignpolicy.009.a: "Nâng ly vì các đồng chí Trung Quốc của chúng ta!"
 CHN.foreignpolicy.009.b: "Không thì sao?"

 CHN.foreignpolicy.010.t: "[FROM.GetNameDefCap] gia nhập MCEP"
 CHN.foreignpolicy.010.d: "Chúng ta đã nhận được tin tức từ đại sứ của [FROM.GetNameDef] rằng đất nước của họ rất vui mừng thông báo quyết định tham gia Quan hệ đối tác kinh tế hợp tác Dân sinh. Chúng ta hoan nghênh họ vì quyết định khôn ngoan của họ và chúng ta mong muốn hợp tác với các đồng chí của chúng ta trong việc thiết lập một chống lại chủ nghĩa đế quốc."
 CHN.foreignpolicy.010.a: "Chống đế quốc muôn năm!"

 CHN.foreignpolicy.011.t: "[FROM.GetNameDefCap] Từ chối thành viên MCEP"
 CHN.foreignpolicy.011.d: "Chúng ta đã nhận được tin tức từ đại sứ của [FROM.GetNameDef] rằng đất nước của họ không muốn tham gia Quan hệ đối tác kinh tế hợp tác Dân sinh. Có lẽ tin rằng chúng ta có những ý tưởng bất chính khác cho sự hợp tác chia sẻ của chúng ta hoặc chúng ta sẽ không phân phối tài nguyên đồng đều, họ đã từ chối tham gia vào cuộc đấu tranh chống thực dân lớn hơn. Mặc dù chắc chắn là thất vọng khi nghe điều này, họ sẽ hối tiếc về quyết định này khi họ trở thành nạn nhân của chủ nghĩa tư bản và chủ nghĩa đế quốc. Chỉ thông qua hợp tác toàn châu Á, các dân tộc bị áp bức mới có thể làm việc."
 CHN.foreignpolicy.011.a: "Thật xấu hổ."

#UPC Foreign Policy Events (200-399):
 CHN.foreignpolicy.200.t: "Mẫu [FROM.GetFactionName]"
 CHN.foreignpolicy.200.d.league_of_free_asian_states: "Sau nhiều năm nội chiến, Trung Quốc đã được thống nhất dưới sự lãnh đạo của [FROM.GetLeader] và không lâu trước khi Trung Quốc quay trở lại sân khấu thế giới. Phản ánh những nỗ lực của Trung Quốc để trở thành một cường quốc một lần nữa và xây dựng lại phạm vi ảnh hưởng của mình, Bộ Ngoại giao Trung Quốc đã tuyên bố thành lập Liên minh các quốc gia châu Á tự do.\n\nĐược xây dựng dựa trên sức mạnh ngày càng tăng từ thập kỷ Trực Lệ Hegemony, Sáng kiến Liên đoàn hy vọng sẽ cung cấp một giải pháp thay thế cho các quốc gia châu Á phi thực dân hóa đối với chủ nghĩa đế quốc Nhật Bản và châu Âu. Dự án đầy tham vọng này cũng phản ánh tham vọng của Bắc Dương trong việc khôi phục trật tự chính trị truyền thống châu Á quay quanh Trung Quốc."
 CHN.foreignpolicy.200.d.wuxing_protocol: "Sau nhiều năm nội chiến, Trung Quốc đã được thống nhất dưới sự lãnh đạo của [FROM.GetLeader] và không lâu trước khi Trung Quốc quay trở lại sân khấu thế giới. Phản ánh những nỗ lực của Trung Quốc để trở thành một cường quốc một lần nữa và xây dựng lại phạm vi ảnh hưởng của mình, Bộ Ngoại giao Trung Quốc đã công bố thành lập Nghị định thư Vô Tích.\n\nĐược đặt theo cụm từ cổ \" Năm ngôi sao mọc ở phía Đông, là một dấu hiệu thuận lợi cho Vương quốc Trung tâm \", nó phản ánh hy vọng của các nhà lãnh đạo Trung Quốc mới về việc khôi phục trật tự chính trị châu Á truyền thống quay quanh Trung Quốc. Nó cũng phản ánh sự xa cách của họ với các đồng minh truyền thống của họ ở Nhật Bản khi Trung Quốc lập biểu đồ một khóa học độc lập."
 CHN.foreignpolicy.200.d.SHX_yan_faction: "Sau nhiều năm nội chiến, Trung Quốc đã được thống nhất dưới sự lãnh đạo của [FROM.GetLeader] và không lâu trước khi Trung Quốc quay trở lại sân khấu thế giới. Phản ánh những nỗ lực của Trung Quốc để trở thành một cường quốc một lần nữa và xây dựng lại phạm vi ảnh hưởng của mình, Bộ Ngoại giao Trung Quốc đã công bố thành lập Phong trào Không liên kết châu Á-Thái Bình Dương.\n\nNỗ lực này thể hiện tham vọng của Tổng thống Trung Quốc Diêm Tích Sơn về việc tạo ra một trật tự chính trị châu Á mới xung quanh Trung Quốc và một số suy nghĩ không tưởng của ông về việc tạo ra một thế giới mới. Thực tế hơn, nó cũng củng cố vị thế của Trung Quốc như một cường quốc đang lên và cung cấp cho các quốc gia châu Á hậu thuộc địa mới một sự thay thế tiềm năng để bị kéo vào các cuộc chiến tranh châu Âu."
 CHN.foreignpolicy.200.d.SHX_feng_faction: "Sau nhiều năm nội chiến, Trung Quốc đã được thống nhất dưới sự lãnh đạo của [FROM.GetLeader] và không lâu trước khi Trung Quốc quay trở lại sân khấu thế giới. Phản ánh những nỗ lực của Trung Quốc để trở thành một cường quốc một lần nữa và xây dựng lại phạm vi ảnh hưởng của mình, Bộ Ngoại giao Trung Quốc đã công bố thành lập Mặt trận Giải phóng Dân tộc.\n\nĐược điều hành bởi chủ tịch Trung Quốc Phùng Ngọc Tường, nó đại diện cho mong muốn tuyên bố của phong trào của ông để giúp giải phóng người dân châu Á khác khỏi chủ nghĩa đế quốc phương Tây và Nhật Bản. Nhưng Feng cũng được biết đến với chủ nghĩa thực dụng của mình, và nó vẫn còn để được nhìn thấy nếu đây sẽ là một liên minh phòng thủ hay tấn công trong thực tế."
 CHN.foreignpolicy.200.d.asian_federation: "Sau nhiều năm nội chiến, Trung Quốc đã được thống nhất dưới sự lãnh đạo của [FROM.GetLeader] và không lâu trước khi Trung Quốc quay trở lại sân khấu thế giới. Phản ánh những nỗ lực của Trung Quốc để trở thành một cường quốc một lần nữa và xây dựng lại phạm vi ảnh hưởng của mình, Bộ Ngoại giao Trung Quốc đã tuyên bố thành lập Liên đoàn châu Á.\n\nLiên minh này phản ánh chủ nghĩa không tưởng của các trí thức Trung Quốc sau Chiến tranh thế giới thứ nhất. Họ tìm cách xây dựng lại châu Á thành một nền văn minh thống nhất, hài hòa sau thời thuộc địa có thể đóng vai trò là nền tảng cho một tổ chức thế giới được tạo thành từ các liên minh lục địa riêng biệt dựa trên sự bình đẳng, phi quân sự hóa và cùng tồn tại hòa bình."
 CHN.foreignpolicy.200.d.asia_pacific_treaty_organisation: "Sau nhiều năm nội chiến, Trung Quốc đã được thống nhất dưới sự lãnh đạo của [FROM.GetLeader] và không lâu trước khi Trung Quốc quay trở lại sân khấu thế giới. Phản ánh những nỗ lực của Trung Quốc để trở thành một cường quốc một lần nữa và xây dựng lại phạm vi ảnh hưởng của mình, Bộ Ngoại giao Trung Quốc đã công bố thành lập Tổ chức Hiệp ước Châu Á-Thái Bình Dương.\n\nĐược xây dựng trên khuôn khổ hợp tác quốc tế, dân chủ và chống đế quốc, mục tiêu được thể hiện của liên minh này là tạo ra một siêu liên bang ở châu Á có thể thực thi trật tự chính trị lập hiến và can thiệp khi cần thiết để bảo vệ các nền dân chủ hậu thuộc địa trong khu vực."
 CHN.foreignpolicy.200.d.asia_pacific_security_pact: "Sau nhiều năm nội chiến, Trung Quốc đã được thống nhất dưới sự lãnh đạo của [FROM.GetLeader] và không lâu trước khi Trung Quốc quay trở lại sân khấu thế giới. Phản ánh những nỗ lực của Trung Quốc để trở thành một cường quốc một lần nữa và xây dựng lại phạm vi ảnh hưởng của mình, Bộ Ngoại giao Trung Quốc đã công bố thành lập Hiệp ước An ninh Châu Á-Thái Bình Dương.\n\nĐược xây dựng như một phần mở rộng sức mạnh quân sự của Trung Quốc, nó hy vọng sẽ cung cấp một giải pháp thay thế cho các quốc gia châu Á phi thực dân hóa chủ nghĩa đế quốc Nhật Bản và châu Âu. Giữa khoảng trống quyền lực sau Chiến tranh Trung-Nhật lần thứ hai và dự đoán về sự rút lui của châu Âu khỏi khu vực, Trung Quốc hy vọng tìm được vị trí của mình trong thế giới sắp tới."
 CHN.foreignpolicy.200.a: "Nguy hiểm phương Đông!"
 CHN.foreignpolicy.200.b: "Rồng gầm vang!"
 CHN.foreignpolicy.200.c: "Một thế lực mới trỗi dậy ở phía Đông."

 CHN.foreignpolicy.201.t: "Cộng đồng Đông Á"
 CHN.foreignpolicy.201.d: "Trong nhiều thiên niên kỷ, tàu thuyền và đoàn lữ hành từ khắp nơi trên thế giới sẽ đi đến và đi từ Trung Quốc để buôn bán. Các đế chế đã tăng và giảm dựa trên khả năng kiểm soát các tuyến thương mại có giá trị này và Trung Quốc tự hào là trung tâm của thế giới. Nhưng trong sự kiêu ngạo của họ, triều đình bắt đầu quay vào bên trong - bắt đầu nhiều thế kỷ trì trệ và cuối cùng suy giảm. Thiệt hại tàn khốc cho đế quốc nước ngoài và sau đó là nội chiến là một tiếng gọi thức tỉnh tàn bạo, một lời nhắc nhở rằng thế giới đã tiến lên.\n\nKhi Trung Quốc tái xuất hiện từ giấc ngủ của mình, dưới [CHN.GetLeader] , họ tìm cách đòi lại vị trí của mình như một cường quốc và tái khẳng định không chỉ quyền bá chủ quân sự mà còn thống trị kinh tế trước đây của họ. Cộng đồng Đông Á là dự án kinh tế quốc tế lớn đầu tiên cho Trung Quốc mới thống nhất, hy vọng xây dựng một khối thương mại có thể phục vụ thay thế cho châu Âu và Nhật Bản. Chủ yếu là một phần mở rộng của lĩnh vực hiện tại của họ, tuy nhiên nó đã thu hút sự quan tâm từ các quốc gia hậu thuộc địa khác."
 CHN.foreignpolicy.201.a: "Chúng ta mang lục địa lại gần nhau hơn!"
 CHN.foreignpolicy.201.b: "Trung Quốc tìm cách xây dựng lại đế chế thương mại của mình."

 CHN.foreignpolicy.202.t: "[FROM.GetNameDefCap] Cung cấp đầu tư"
 CHN.foreignpolicy.202.d: "Gần đây đã gia nhập [FROM.GetFactionName], các đồng minh Trung Quốc mới của chúng ta đã đề xuất rằng chúng ta tham gia Cộng đồng Đông Á - một khối thương mại với tham vọng kết nối Đông và Nam Á cũng như Thái Bình Dương. Tổ chức nhiều sáng kiến khác nhau, từ phát triển kinh tế, đầu tư cơ sở hạ tầng, và thậm chí trao đổi học thuật và văn hóa, khối hứa hẹn sự thịnh vượng và thống nhất độc lập với sự thống trị của nước ngoài.\n\nTuy nhiên, trong khi tiếp cận với vốn Trung Quốc đã hứa hẹn trong việc cải thiện cơ sở công nghiệp hạn chế của chúng ta, có những lo ngại rằng Trung Quốc sẽ sử dụng đòn bẩy của họ để thống trị nền kinh tế của chúng ta và cạnh tranh hơn các ngành công nghiệp trong nước. Cũng có những lo ngại rằng nó cũng sẽ mở ra nền kinh tế của chúng ta cho những ảnh hưởng không mong muốn của Trung Quốc, cho phép họ tận dụng lợi thế của nhà nước chính trị mong manh của chúng ta."
 CHN.foreignpolicy.202.a: "Chúng ta vui lòng chấp nhận."
 CHN.foreignpolicy.202.b: "Chúng ta lịch sự từ chối."

 CHN.foreignpolicy.203.t: "[FROM.GetNameDefCap] chấp nhận đầu tư"
 CHN.foreignpolicy.203.d: "Chúng ta đã nhận được tin tức tuyệt vời từ đại sứ của chúng ta đến [FROM.GetNameDef] rằng đất nước của họ đã chấp nhận các cơ hội đầu tư của chúng ta. Cùng nhau, chúng ta sẽ có thể phát triển sức mạnh kinh tế và giúp họ phát triển thành một cường quốc đang lên mới đồng thời hỗ trợ các nỗ lực công nghiệp và phục hồi của chúng ta. Có thể đây là khởi đầu của một tình bạn lâu dài và hiệu quả trong những năm tới!."
 CHN.foreignpolicy.203.a: "Sự khởi đầu của một quan hệ đối tác hiệu quả."

 CHN.foreignpolicy.204.t: "[FROM.GetNameDefCap] thúc đẩy đầu tư"
 CHN.foreignpolicy.204.d: "Chúng ta đã nhận được tin tức đáng thất vọng từ đại sứ của chúng ta đến [FROM.GetNameDef] rằng họ không muốn chấp nhận cơ hội đầu tư của chúng ta và đã từ chối lời đề nghị duyên dáng của chúng ta. Có lẽ họ xem tiếp cận biết ơn của chúng ta là một mối đe dọa nước ngoài hoặc đơn giản là họ không tin tưởng rằng những gì chúng ta tìm kiếm là một mối quan hệ cùng có lợi cho cả hai quốc gia của chúng ta. Cho dù lý do của họ có thể, đó là mất mát của họ mà họ đã từ chối lời đề nghị hào phóng của chúng ta."
 CHN.foreignpolicy.204.a: "Chúng ta chúc họ may mắn, họ sẽ cần điều đó."

#Frontier Annexation Events:
 CHN.foreignpolicy.300.t: "Quản lý dân bạc Herds"
 CHN.foreignpolicy.300.d_base: "Sau khi chinh phục hoàn toàn người Mông Cổ vào năm 1691, nhà Thanh đã cai trị một phần của thảo nguyên trong hơn 200 năm, nhưng tất cả sẽ sụp đổ vào năm 1911 sau Cách mạng Mông Cổ. Trải qua cả sự tiến hóa văn hóa và xã hội trong và kể từ thời Zanabazar là Jebtsundamba Khutukhtu đầu tiên, sự suy yếu dần dần của nhà Thanh và việc thực hiện các chính sách mới trên thảo nguyên sẽ dẫn đến sự phản đối dữ dội từ các hoàng tử và lạt ma Mông Cổ.\n\nTuyên bố độc lập của họ, cuộc tranh giành độc lập ngắn ngủi của Bogd Khanate sẽ chứng kiến một số chính khách vĩ đại nhất của Mông Cổ, và tồi tệ nhất của nó. Một nhà nước không được công nhận, cuối cùng nó sẽ chịu khuất phục trước sự đấu tranh nội bộ và bất tài của chính nó, tự làm phiền Chính phủ An Huy vào năm 1919. Trong thời gian này, một tập hợp mới của các nhà cách mạng Mông Cổ đã xuất hiện, Đảng Quốc gia Mông Cổ, và với những nỗ lực của họ, tình trạng hiện tại của Mông Cổ sẽ được thiết lập."
 CHN.foreignpolicy.300.d_end: "Tuy nhiên, các vấn đề quản trị của Mông Cổ thường được xử lý gần như hoàn toàn (chính thức) bởi Ủy ban các vấn đề Mông Cổ-Tây Tạng, một cơ quan phần lớn bất lực, và vì vậy có thể tốt hơn là duy trì tình trạng như vậy. Không kém phần hấp dẫn, và được hỗ trợ bởi Bộ Tổng tham mưu, là việc tiếp tục duy trì sự chiếm đóng quân sự, mặc dù quyết định như vậy gợi lên hình ảnh về sự thất bại của Từ Shuzheng nhiều thập kỷ trước. Cuối cùng, luôn có lựa chọn làm việc với các nhà môi giới quyền lực địa phương trong giới quý tộc đã thành lập, có thể là họ hoặc lama, như một loại thỏa thuận cùng có lợi cho cả người Trung Quốc và người Mông Cổ."
 CHN.foreignpolicy.300.d_northzhili: "$CHN.foreignpolicy.300.d_base$\n\nTrong những nỗ lực để đạt được quyền tự trị của Mông Cổ trong những năm 1920 và 30, các nhóm khác nhau đã được tổ chức dưới sự bảo trợ của chiến thắng tài trợ chính thức của Chính phủ Trung ương cho \" đại diện cho \" người Mông Cổ. Trong một môi trường như vậy, các nhân vật như Hoàng tử De, So, Yon và Sung, Tögs-Ochiryn Namnansüren, và Tserendondovyn Navaanneren đã vươn lên các tiêu đề quốc tế cho chức vô địch của họ về quyền Mông Cổ. Mặc dù dai dẳng nhất trong số họ, và liên tục cố gắng để định vị mình là Promethean Man của người Mông Cổ này là người được bảo trợ của Hoàng tử Gung, Ngô Hạc Linh, và Nhóm Củng cố và Phục hồi Mông Cổ của ông.\n\nĐược trao quyền quản lý Ủy ban các vấn đề Mông Cổ-Tây Tạng, MCRG của ông giữ lại các văn phòng ở Bắc Kinh và Nam Kinh, và do đó Wu đã chính thức gia nhập Trực Lệ Clique để có vị trí tốt hơn trong các vấn đề Trung Quốc-Mông Cổ. Trung lập trong chính trị nội bộ gia đình thực tế, Heling đã đảm bảo với chính phủ về ý định của mình để cung cấp giải pháp tốt nhất cho cả người Trung Quốc và người Mông Cổ, và đã vội vã soạn thảo các đề xuất và luật pháp khác nhau.\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_southzhili: "$CHN.foreignpolicy.300.d_base$\n\nTrong những nỗ lực để đạt được quyền tự trị của Mông Cổ trong những năm 1920 và 30, các nhóm khác nhau đã được tổ chức dưới sự bảo trợ của chiến thắng tài trợ chính thức của Chính phủ Trung ương cho \" đại diện cho \" người Mông Cổ. Trong một môi trường như vậy, các nhân vật như Hoàng tử De, So, Yon và Sung, Tögs-Ochiryn Namnansüren, và Tserendondovyn Navaanneren đã vươn lên các tiêu đề quốc tế cho chức vô địch của họ về quyền Mông Cổ. Mặc dù dai dẳng nhất trong số họ, và liên tục cố gắng để định vị mình là Promethean Man của người Mông Cổ này là người được bảo trợ của Hoàng tử Gung, Ngô Hạc Linh, và Nhóm Củng cố và Phục hồi Mông Cổ của ông.\n\nĐược trao quyền quản lý Ủy ban các vấn đề Mông Cổ-Tây Tạng, MCRG của ông giữ lại các văn phòng ở Bắc Kinh và Nam Kinh. Không chính thức gia nhập Trực Lệ, các cộng sự thân cận nhất của Ngô ở miền Nam đã được lắng nghe các vấn đề Nam Trực Lệ, phần lớn dưới sự bảo trợ của Wu Yunpeng. Trong khi Heling tự liên kết quá chặt chẽ với Cao Kun và Ngô Bội Phu, Yunpeng vẫn giữ được tham vọng, quyền tự chủ và lòng trung thành của riêng mình.\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_fengtian: "$CHN.foreignpolicy.300.d_base$\n\nThông qua các thuật ngữ kỹ thuật là những người kế thừa hợp pháp nhất cho chính quyền Trung Quốc của Mông Cổ, Phượng hệ đã ít chú ý hoặc quan tâm đến các mối quan tâm của biên giới, thay vào đó tập trung nỗ lực của nó trong Nhiệt Hà, Sát Cáp Nhĩ, Barga, Hulunbuir và Xilingol. Tuy nhiên, Phượng hệ vẫn giữ lại các nhân vật Mông Cổ địa phương quan trọng, những người sẵn sàng hợp tác với chính phủ, miễn là người Mông Cổ giữ được quyền tự trị đáng kể. Như vậy, họ đã khẳng định Lưu Diệp Phi trở thành Cao ủy, một chức vụ mà trước đây ông đã từng nắm giữ một lần, với tư cách là cộng sự thân cận của Trương Học Lương, và là một người có khuynh hướng cải cách.\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_yan: "$CHN.foreignpolicy.300.d_base$\n\nThật kỳ lạ, khi đã được trao toàn quyền đối với toàn bộ khu vực Ngoại Mông, Diêm Tích Sơn có lẽ đã vượt quá tầm hiểu biết của mình. Trong khi đã phái các nhân vật như Triệu Đại Văn đến Sát Cáp Nhĩ, và Từ Vĩnh Xương đến Tuyên Viễn hợp tác với các hoàng tử địa phương, Diêm Tích Sơn hầu như không phải là bạn của người Mông Cổ. Là một trong những người ủng hộ chính việc chuyển đổi các lãnh thổ Mông Cổ thành các tỉnh đầy đủ của Trung Quốc, và thường sử dụng Changkya Khutukhtu thứ 7 để ngăn chặn các vấn đề tự trị của Mông Cổ, Diêm Tích Sơn có rất ít lựa chọn để quản lý các lãnh thổ Mông Cổ, tuy nhiên, Phục Tác Nghĩa đã chứng tỏ mình có khả năng và kiên cường, nếu có lẽ bản thân người Mông Cổ không thể chịu đựng được, và có thể là một lựa chọn khả thi để giữ quyền kiểm soát.\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_gmj: "$CHN.foreignpolicy.300.d_base$\n\nXếp hạng có lẽ trong số những điều tồi tệ nhất trong con mắt của người Mông Cổ, Quốc dân quân, hoặc Quân đội Công dân, đã gây ra hoạn nạn, hỗn loạn và đau khổ cho người Mông Cổ trong thời gian ở Nội Mông. Với mối quan hệ nhạt nhẽo với Đảng Quốc gia Nội Mông, và của phe Thành phố Thủ đô của Đảng Quốc gia Mông Cổ, tuy nhiên Feng là tuôn ra với những người bạn và đồng minh tiềm năng, ngay cả khi chỉ cầu xin. Tất nhiên, các sĩ quan GMJ duy nhất không hoàn toàn nằm trong danh sách đen, bên cạnh chính Feng, là sĩ quan phụ tá và cánh tay phải thân cận của ông, Zhang Zhijiang, và Ma Hetian, một sĩ quan cảm thông khác. Cả hai đều gần gũi với những nhân vật như Bai Yunti và Dambadorj, và như vậy có thể tin tưởng vào sự ủng hộ của những người theo chủ nghĩa dân tộc Mông Cổ nếu cần thiết.\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_manchu: "$CHN.foreignpolicy.300.d_base$\n\nTuy nhiên, có lẽ may mắn cho chính quyền nhà Thanh, không khí truyền thống giữa các quân phiệt và thần dân của họ vẫn mạnh mẽ trong tâm trí của nhiều quý tộc Mông Cổ, với những nhân vật như Hoàng tử De, Hoàng tử Sung, Hoàng tử A, Hoàng tử Ta, và đặc biệt là Jodbajab khẳng định lòng trung thành của họ với Hoàng đế.Tuy nhiên, ở Ngoại Mông Cổ, các nhân vật nhiếp chính hàng đầu của Bogd Khan thứ hai như Dorjsürenkhoroljav, Tögs-Ochiryn Namnansüren, và Tserendondovyn Navaanneren đều yêu cầu quyền tự trị đáng kể cho người Mông Cổ, để đổi lấy sự ủng hộ Dorjsürenkhoroljav như một thần dân trung thành của Hoàng đế.\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_rkmt: "$CHN.foreignpolicy.300.d_base$\n\nĐược coi là các đảng chị em, ít nhất là bởi một số nhân vật nhất định trong mỗi phe, Quốc dân đảng và Đảng Dân tộc Mông Cổ (cùng với Đảng Dân tộc Nội Mông) từ lâu đã là đồng minh, ngay cả trong thời gian họ lưu vong dữ dội. Trong khi các nhân vật như Danzan và Dambadorj trong MNP giữ lại một số yếu tố cảm tình thân Trung Quốc, và IMNP là một dự án chung giữa Quốc dân đảng và MNP, nhiều nhân vật khác nhau trong Đảng đã khuyên rằng một người Mông Cổ liên kết chặt chẽ nên được giao phụ trách các lãnh thổ Mông Cổ. Tranh cãi với nhau, các ứng cử viên hàng đầu cho một vị trí như vậy đã làm tròn ra Bai Yunti, được đề xuất bởi các nhân vật của cánh hữu cũ và Li Yongxin của cánh hữu mới.\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_xsm: "$CHN.foreignpolicy.300.d_base$\n\nGần đây đã chiến đấu một cuộc chiến tranh với người Mông Cổ để kiểm soát Nội Mông, không có gì đáng ngạc nhiên khi các gia đình Mã có rất ít đồng minh trong khu vực. Thay vào đó phải dựa vào cơ bắp của chính họ, may mắn thay, có một nhân vật hàng đầu của các gia đình có một số mối quan hệ Mông Cổ: Mã Hồng Quỳ. Mặc dù được coi là hoàn toàn khó chịu bởi hầu hết các biểu ngữ trong lãnh thổ của mình, Hongkui là một trong số ít nhân vật đã xử lý rộng rãi việc quản lý người Mông Cổ, và thậm chí có thể tin tưởng vào các nhân vật như Wang Ying và Khangdudorj, những người cùng nhau được gọi là \" ba quân phiệt nhỏ liều lĩnh \" .\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.d_generic: "$CHN.foreignpolicy.300.d_base$\n\nTừ lâu vẫn duy trì bộ máy quan liêu rộng lớn gồm các ủy viên chịu trách nhiệm quản lý các lãnh thổ Mông Cổ, Trung Quốc tràn ngập nhiều quan chức có tay nghề cao, giữ được phẩm chất và chuyên môn phù hợp để xử lý các vấn đề của Mông Cổ. Những nhân vật như Wang Yintai, người được Chen Yi bảo trợ, hoặc những người như Chen Lu. Đã từng là Cao ủy của các lãnh thổ Mông Cổ, tất cả chỉ là một việc đã rồi khi Chen Lu và chuyên môn của anh ta được kêu gọi một lần nữa làm Cao ủy Mông Cổ.\n\n$CHN.foreignpolicy.300.d_end$"
 CHN.foreignpolicy.300.a: "[CHN_mongolia_get_unique_governor]"
 CHN.foreignpolicy.300.b: "MTAC tồn tại là có lý do."
 CHN.foreignpolicy.300.c: "Duy trì thiết quân luật."
 CHN.foreignpolicy.300.e: "Chơi cho các quý tộc, cố gắng và đúng sự thật của nó."
 CHN_mongolia_get_unique_governor_northzhili: "Nếu không có Ngô Hạc Linh, chúng ta sẽ gặp rắc rối lớn."
 CHN_mongolia_get_unique_governor_southzhili: "Wu Yunpeng nên thành công là Heling thất bại."
 CHN_mongolia_get_unique_governor_fengtian: "Lưu Diệp Phi đã từng giữ chức vụ này, chắc chắn là hắn không thể thất bại hai lần."
 CHN_mongolia_get_unique_governor_yan: "Tất cả đều dưới quyền Cảnh sát trưởng."
 CHN_mongolia_get_unique_governor_gmj: "Ma Hetian duy trì các mối quan hệ thân mật một lần trước đây."
 CHN_mongolia_get_unique_governor_xsm: "Mã Hồng Quỳ sẽ giữ chân họ."
 CHN_mongolia_get_unique_governor_rkmt: "Ném một khúc xương cho Bai Yunti."
 CHN_mongolia_get_unique_governor_rkmt_yun: "Li Yongxin đảm bảo các ưu tiên của Chủ tịch."
 CHN_mongolia_get_unique_governor_manchu: "Điều tự nhiên là Dorjsürenkhoroljav vẫn giữ vị trí của mình."

 CHN.foreignpolicy.301.t: "Đặt chân lên cao nguyên"
 CHN.foreignpolicy.301.d_base: "Thiết lập một chỗ đứng kiểm soát kể từ cuộc viễn chinh Trung Quốc đến Tây Tạng năm 1720, chính quyền Trung Quốc ở Tây Tạng đã gặp nhiều khó khăn, cả bên trong và bên ngoài. Giữ lại quyền bán tự trị đáng kể, sự xâm lấn dần dần của Trung Quốc vào lãnh thổ Tây Tạng vẫn chỉ là lý thuyết, vì nhiều công ước được ký kết giữa Anh và Trung Quốc sẽ công khai bị chính quyền Tây Tạng phô trương hoặc bỏ qua, đến mức người Anh xâm chiếm khu vực vào năm 1903 để chinh phục người Tây Tạng.\n\nCông nhận quyền bá chủ của nhà Thanh vào năm 1907, người Tây Tạng sẽ nổi dậy với Cách mạng Tân Hợi năm 1911, mở cửa Tây Tạng cho những âm mưu thực sự của độc lập địa phương, mặc dù chỉ được chính phủ Mông Cổ ở Khuree công nhận.Dưới tình trạng này, Tây Tạng sẽ phải vật lộn để đi đến thỏa thuận với hiện đại, vì các nhóm khác nhau bao gồm Dalai và Panchen Lamas sẽ mâu thuẫn về một loạt các vấn đề, từ nghĩa vụ thuế đơn giản đến hiện đại hóa quân sự và xã hội."
 CHN.foreignpolicy.301.d_end: "Bất kể trường hợp nào, chính trị Tây Tạng đã không ngồi yên bằng cách chờ đợi Trung Quốc chọn chúa tể của họ. Đảng Cải tiến Tây Tạng và Tập đoàn Kyicho Kuntun đều bắt đầu âm mưu thúc đẩy tầm nhìn tương ứng của họ cho tương lai của Tây Tạng. Tương tự, Tăng đoàn đã tái khẳng định vị trí của mình, đặt ưu thế đằng sau vai trò của Đức Đạt Lai Lạt Ma trong các vấn đề Tây Tạng. Trong khi đó, nhiều nhân vật khác nhau của quân đội đã đảm bảo [ROOT.GetLeader] rằng một nhóm binh sĩ có thể kiểm soát toàn bộ cao nguyên."
 CHN.foreignpolicy.301.d_szc_liu: "$CHN.foreignpolicy.301.d_base$\n\nTrên danh nghĩa được xử lý bởi Hội đồng các vấn đề Mông Cổ-Tây Tạng, sự kiểm soát và quản lý hiện đại của Trung Quốc không tìm cách sao chép chế độ bán tự trị của nhà Thanh, và sau đó vội vàng tiến hành can thiệp vào năm 1910. Đối với Tứ Xuyên, vấn đề này là cấp bách nhất, và đặc biệt là đối với Lưu Văn Hủy, đã chiến đấu chống lại người Tây Tạng trong thời gian gần đây. Với hầu hết các kết nối trong Cao nguyên, ông đã đưa mình lên để quản lý các lãnh thổ Tây Tạng.\n\n$CHN.foreignpolicy.301.d_end$"
 CHN.foreignpolicy.301.d_rkmt: "$CHN.foreignpolicy.301.d_base$\n\nTrên danh nghĩa được xử lý bởi Hội đồng các vấn đề Mông Cổ-Tây Tạng, sự kiểm soát và quản lý hiện đại của Trung Quốc không tìm cách sao chép chế độ bán tự trị của nhà Thanh, và sau đó vội vàng tiến hành can thiệp vào năm 1910. Trong khi rất ít người trong chính phủ Quốc dân đảng có bất kỳ ảnh hưởng hoặc lợi ích nào trước đây trong việc quản lý các lãnh thổ Tây Tạng, một quan chức dũng cảm đã đưa ra: Hoàng Mộ Tùng. Tương đối trung lập trong các vấn đề của đảng, ông đã hứa sẽ tiến hành một cách tiếp cận tự do và công bằng đối với vấn đề Tây Tạng, phù hợp với mong muốn của đảng.\n\n$CHN.foreignpolicy.301.d_end$"
 CHN.foreignpolicy.301.d_manchu: "$CHN.foreignpolicy.301.d_base$\n\nĐược Hội đồng các vấn đề Mông Cổ-Tây Tạng trên danh nghĩa xử lý, sự kiểm soát và điều hành hiện đại của Trung Quốc không tìm cách sao chép chế độ bán tự trị của nhà Thanh, và sau đó vội vàng tiến hành can thiệp vào năm 1910. Trong khi người Mãn mang theo họ những ý nghĩa tiêu cực trong các bè phái của những người hiện đại hóa Tây Tạng, Hoàng đế vẫn giữ được sự tôn trọng và lòng trung thành đáng kể giữa một số nhân vật nhất định ở Plataeu. Gần với Panchen Lama, và là cựu thượng nghị sĩ của Chính phủ Bắc Dương, người bản địa Tây Tạng Lobsang Gyaltsen đã tự đề cử mình làm Cao ủy. Có lẽ để bảo vệ quyền tự trị của Tây Tạng, hoặc nói cách khác, ông đã chứng tỏ tính mềm dẻo trước hầu hết các nỗ lực hội nhập của người Mãn.\n\n$CHN.foreignpolicy.301.d_end$"
 CHN.foreignpolicy.301.d_generic: "$CHN.foreignpolicy.301.d_base$\n\nTrên danh nghĩa được xử lý bởi Hội đồng các vấn đề Mông Cổ-Tây Tạng, sự kiểm soát và quản lý hiện đại của Trung Quốc không tìm cách sao chép chế độ bán tự trị của nhà Thanh, và sau đó vội vã tiến hành can thiệp vào năm 1910. Giữ chức vụ Giám đốc các vấn đề Tây Tạng trong Ủy ban các vấn đề Mông Cổ-Tây Tạng, Kong Qingzong đã chứng tỏ mình là một người theo chủ nghĩa sô vanh Hán cổ, mặc dù bị mê hoặc bởi Tây Tạng học. Cùng với Ôn Tsungyao, một Amban Tây Tạng trước đây và một người đàn ông theo chủ nghĩa cải cách Bắc Dương, hai người đã soạn thảo kế hoạch của riêng họ cho một chính quyền Tây Tạng.\n\n$CHN.foreignpolicy.301.d_end$"
 CHN.foreignpolicy.301.a: "[CHN_tibet_get_unique_governor]"
 CHN.foreignpolicy.301.b: "Tây Tạng đang rất cần sự hiện đại thực sự."
 CHN.foreignpolicy.301.c: "Khó mà kiểm soát được Tây Tạng chỉ bằng một bộ phận"
 CHN.foreignpolicy.301.e: "Sangha đã ở đây trước chúng ta, hãy để chúng ta làm việc với họ."
 CHN_tibet_get_unique_governor_szc_liu: "Tôi chắc là Lưu Văn Huy đã kiểm soát được tình hình."
 CHN_tibet_get_unique_governor_rkmt: "Hoàng Mường có tay trong nhiều việc."
 CHN_tibet_get_unique_governor_manchu: "Lobsang Gyaltsen sẽ làm việc cho cả Tăng đoàn và Hoàng đế."

 CHN.foreignpolicy.302.t: "Hướng về biên cương"
 CHN.foreignpolicy.302.d_base: "Tân Cương đã có một thời gian dài và rắc rối trong nhà nước Trung Quốc. Dao động giữa kiểm soát của Trung Quốc và du mục trong phần lớn lịch sử của nó, Tân Cương đã được Hoàng đế Càn Long sáp nhập vĩnh viễn vào Trung Quốc. Về mặt lịch sử được chia thành hai khu vực, nhà Thanh đã tạo ra bản sắc khu vực duy nhất của tỉnh Tân Cương sau đó. Khi nhà Thanh sụp đổ, Yang Zengxin cai trị tỉnh này một cách hiệu quả với tư cách là thái ấp của riêng mình thông qua quân đội Dungan. Quyền thống đốc của Yang sẽ kéo dài trong nhiều thập kỷ, nhưng người kế nhiệm Jin Shuren đã kích động sự bất ổn bằng cách chấm dứt Hãn quốc Kumul, khiến nhiều yếu tố bất mãn lao vào chiến tranh.\n\nSự bất ổn của Tân Cương phần lớn đã kết thúc kể từ khi nhà nước Trung Quốc hồi sinh trực tiếp tái hợp tỉnh bướng bỉnh trở lại, nhưng căng thẳng vẫn còn. Các nhà cải cách Duy Ngô Nhĩ ôn hòa đã chọn mở rộng một nhánh ô liu cho chính quyền, cung cấp dịch vụ của họ cho chính phủ. Ngược lại, những người theo chủ nghĩa dân tộc Turk đã thề sẽ tiếp tục cuộc đấu tranh cho một nước cộng hòa Đông Turkestan. Có lẽ chào đón nhất để tái hòa nhập là dân số Hán và Hồi địa phương của Tân Cương, những người chưa bao giờ có mối quan hệ tốt nhất với đa số dân Uyghur."
 CHN.foreignpolicy.302.d_end: "Bất kể ai trở thành Thống đốc, họ sẽ có bàn tay đầy đủ. Masud Sabri và Isa Alptekin của Cộng hòa Đông Turkestan cũ đã đề nghị phục vụ văn phòng Thống đốc Tân Cương nếu ai đó như Burhan Shahidi hoặc Yulbars Khan đảm nhận chức vụ, nhưng các nhân vật cấp tiến hơn trong phong trào có thể sẽ lên tiếng phản đối bất kể. Ngọn lửa của Tân Cương đã được dập tắt, nhưng tỉnh sẽ tiếp tục bốc khói trong một thời gian."
 CHN.foreignpolicy.302.d_northzhili: "$CHN.foreignpolicy.302.d_base$\n\nThật vậy, có vẻ như dòng bất ngờ của các cộng tác viên địa phương đã đủ khả năng chính quyền Trực Lệ ở Tân Cương một phần công bằng của picks cho các bài viết của Thống đốc. Tuy nhiên, Bắc Kinh là quan tâm đến việc duy trì một sự kìm kẹp chặt chẽ hơn trên các tỉnh để ngăn chặn sự trở lại thời đại Warlord. Bắc Kinh có lẽ có thể nâng Yulbars Khan lên thống đốc trên tài khoản của thái độ thân Trung Quốc của mình để xoa dịu Uyghur Nationalists, hoặc có lẽ một quản trị viên dân sự như Fan Yaonan sẽ làm tốt hơn trong việc thúc đẩy lợi ích của Bắc Kinh.\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_southzhili: "$CHN.foreignpolicy.302.d_base$\n\nThật vậy, có vẻ như dòng người bất ngờ của các cộng tác viên địa phương đã đủ khả năng chính quyền Trực Lệ ở Tân Cương một phần công bằng lựa chọn cho chức vụ Thống đốc. Thịnh Thế Tài, mặc dù được cho là có thiện cảm với chủ nghĩa xã hội, là một ứng cử viên hàng đầu do mối quan hệ tích cực của anh ta với Liên minh Marshal Sun, điều này có thể khiến anh ta trở thành một người trung thành hữu ích với kinh nghiệm địa phương. Tuy nhiên, anh ta cũng đã thể hiện những tham vọng, điều này có thể khiến anh ta kém mềm dẻo hơn một quan chức như Fan Yaonan. Một lựa chọn khác sẽ là để lại một thống đốc trung thành từ các lực lượng của Liên minh, trong khi để một địa phương giữ quyền thống đốc dân sự.\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_fengtian: "$CHN.foreignpolicy.302.d_base$\n\nThật vậy, có vẻ như dòng người bất ngờ của các cộng tác viên địa phương đã cho phép Chế độ An Quốc quân chia sẻ công bằng các lựa chọn cho chức vụ Thống đốc Tân Cương. Yulbars Khan của Kumul Khanate là một người bảo thủ nổi tiếng, người sẽ kẹp chặt chủ nghĩa cực đoan và thân Trung Quốc trong triển vọng, người có thể khuyến khích lòng trung thành của Uyghur với Bắc Kinh. Tướng Ma Shaowu cũng là một ứng cử viên hàng đầu, vì Tướng Vân Namese Hui có thể khuyến khích binh lính Dungan gia nhập lực lượng quân sự An Quốc quân và tăng sức đề kháng địa phương trước sự xâm lấn tiềm năng của Nga.\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_yun: "$CHN.foreignpolicy.302.d_base$\n\nThật vậy, có vẻ như dòng người cộng tác địa phương bất ngờ đã cho phép chính quyền Điền ở Tân Cương được chia sẻ một phần công bằng các lựa chọn cho chức vụ Thống đốc. Tân Cương từ lâu đã biết đến sự cai trị của Hội Vân Nam, nhờ Yang Zengxin và Ma Shaowu, và có lẽ sau này sẽ tiếp tục duy trì tính ưu việt của Hội Điền trên toàn khu vực, và giữ cho tỉnh theo thứ tự. Có lẽ chế độ của ông ta có thể được củng cố với những người lính Vân Namese Hui đặt dưới sự chỉ huy của ông ta?\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_xsm: "$CHN.foreignpolicy.302.d_base$\n\nThật vậy, có vẻ như dòng cộng tác viên địa phương bất ngờ đã giúp chính quyền Mã ở Tân Cương có được một phần chọn hợp lý cho chức vụ Thống đốc. Mã Hổ Sơn đã giúp anh rể Mã Trọng Anh chiến đấu cho Tân Cương cùng với Yulbars Khan, và có thể khôn ngoan trao cho anh ta thái ấp mà cừu đen của gia đình Mã không bao giờ có thể nắm giữ. Chúng ta cũng có thể tin tưởng vào dân số Dungan địa phương để chào đón sự cai trị của chúng ta, với tư cách là người Hồi giáo Hồi giáo.\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_rkmt: "$CHN.foreignpolicy.302.d_base$\n\nThật vậy, dường như dòng chảy bất ngờ của các cộng tác viên địa phương đã mang lại cho chính quyền Quốc dân đảng ở Tân Cương một phần công bằng cho chức vụ Thống đốc. Tân Cương có thể là một vùng đất đầy rẫy những kẻ phản động và ly khai, nhưng Burhan Shahidi đã thể hiện mình là một lực lượng tiến bộ chiến đấu vì sự tốt đẹp hơn của tỉnh, không giống như những kẻ ngốc mưu mô đã chiến đấu cho thái ấp của chính họ. Lý tưởng của ông tương thích với lý tưởng của Cách mạng Quốc gia, và ông có thể là một lực lượng lớn để hỗ trợ địa phương.\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_manchu: "$CHN.foreignpolicy.302.d_base$\n\nThật vậy, dường như dòng hợp tác bất ngờ của các cộng tác viên địa phương đã mang lại cho chính quyền Hoàng gia ở Tân Cương một phần chọn công bằng cho chức vụ Thống đốc. Yulbars Khan đã chứng minh lòng trung thành của mình với Kumul Khan trong Chiến tranh Tân Cương, và chắc chắn đã giành được sự cảm thông của Hoàng đế. Một vị tướng như Ma Shaowu cũng là một lựa chọn hấp dẫn, vì ông là một người lính trung thành với Yang Zengxin, một người bảo hoàng nổi tiếng. Ma cũng kiên quyết chống Nga, và anh ta sẽ tăng cường sức đề kháng của chúng ta đối với chương trình nghị sự bất chính của Moscow.\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.d_generic: "$CHN.foreignpolicy.302.d_base$\n\nThật vậy, có vẻ như dòng người bất ngờ của các cộng tác viên địa phương đã dành cho chính quyền Trung Quốc mới ở Tân Cương một phần chọn công bằng cho chức vụ Thống đốc. Có một trường hợp mạnh mẽ để chọn ra một cộng tác viên địa phương để phục vụ bài viết, vì nó chắc chắn sẽ tăng hỗ trợ địa phương. Tuy nhiên, một số người trong chính phủ đã gây áp lực [ROOT.GetLeader] để cài đặt một vị tướng trung thành từ quân đội trung ương làm Thống đốc, để ngăn chặn một nhân vật đầy tham vọng như Jin Shuren thành lập thái ấp địa phương của riêng họ với sự trợ giúp của Nga.\n\n$CHN.foreignpolicy.302.d_end$"
 CHN.foreignpolicy.302.a: "[CHN_xinjiang_get_unique_governor]"
 CHN.foreignpolicy.302.b: "Các thành phần tiến bộ của Tân Cương phải được trao quyền!"
 CHN.foreignpolicy.302.c: "Một trong những tướng lĩnh của chúng ta sẽ giữ Tân Cương trong hàng ngũ."
 CHN.foreignpolicy.302.e: "Tân Cương sẽ tiếp tục được dẫn dắt bởi những tiếng nói bảo thủ!"
 CHN_xinjiang_get_unique_governor_northzhili: "Chúng ta hãy đưa Fan Yaonan lên vị trí."
 CHN_xinjiang_get_unique_governor_southzhili: "Thịnh Thế Tài sẽ phục vụ chúng ta rất tốt."
 CHN_xinjiang_get_unique_governor_fengtian: "Yulbars Khan sẽ duy trì truyền thống."
 CHN_xinjiang_get_unique_governor_yun: "Ma Shaowu là một người bạn cũ, ông ấy có phiếu bầu của chúng ta."
 CHN_xinjiang_get_unique_governor_xsm: "Mã Hàn sẽ kết thúc những gì mà Mã Trung Nghĩa bắt đầu."
 CHN_xinjiang_get_unique_governor_rkmt: "Sự chân thành của Burhan Shahidi đã chiến thắng ông ở Tân Cương."
 CHN_xinjiang_get_unique_governor_manchu: "Yulbars Khan sẽ phụng sự Hoàng đế thật tốt."
 CHN_xinjiang_get_default_governor: "Hầu như không thể sai lầm với phương pháp của Yang."

 CHN.foreignpolicy.303.t: "Tình hình Đài Loan"
 CHN.foreignpolicy.303.d_base: "Sau khi Đài Loan được nhượng lại cho Nhật Bản, các phong trào Độc lập và Nội quy khác nhau đã nổi lên. Sự nhiệt tình này thể hiện dưới hình thức Hiệp hội Văn hóa Đài Loan, do Giang Weishui và Lin Xiantian lãnh đạo. Giang và Lâm cuối cùng đã chia rẽ, với Giang thành lập Đảng Nhân dân Đài Loan liền kề Quốc dân đảng, và Lương Khải Siêu ngưỡng mộ Lâm và các yếu tố bảo thủ thành lập Liên minh Đài Loan về Nội quy. Sau khi cải tạo Đài Loan, TPP đã thấy mình lúng túng. Những người ôn hòa như Cai Peihuo đã đụng độ với chủ nghĩa cấp tiến và thái độ độc đoán của Giang, đe dọa chia rẽ đảng.\n\nĐảng Công đoàn Đài Loan cũng đã bị đàn áp ngay lập tức khi sự xuất hiện của chính quyền đại lục. Trong khi đó, giới tinh hoa cũ và tầng lớp quý tộc đã cố gắng để tìm kiếm sự hỗ trợ của chế độ mới của Trung Quốc, mặc dù nhận thức của TAHR là không yêu nước đã làm tổn thương danh tiếng của họ với các cơ quan chức năng nghề nghiệp. Giữa TPP và TAHR đã nổi lên Hiệp hội Đồng chí Phục hồi Đài Loan, do anh em Liao Wenkui và Liao Wenyi lãnh đạo. Bao gồm các nhà kỹ trị và trí thức được giáo dục phương Tây, đây là một phong trào tự do nói chung, tìm kiếm sự ủng hộ tự do từ Đại lục."
 CHN.foreignpolicy.303.d_end: "Mặc dù Đài Loan không giống như các khu vực biên giới ở chỗ nó gần như hoàn toàn bao gồm người Hán, nhưng các bước chính quyền thực hiện để tái hòa nhập tỉnh lạc hậu cũng rất quan trọng. Dân số Đài Loan đã bị tách khỏi Đại lục trong nửa thế kỷ và bất kỳ chính phủ Trung Quốc nào cố gắng quản lý tỉnh này sẽ phải thừa nhận những khác biệt này, hoặc có lẽ Đài Loan sẽ tiếp tục cảm thấy bất ổn trong nhiều năm tới."
 CHN.foreignpolicy.303.d_northzhili: "$CHN.foreignpolicy.303.d_base$\n\nChính quyền Trực Lệ, bất chấp quan điểm chống Nhật Bản, đã có một cái nhìn thuận lợi về TAHR. Lương Khải Siêu tiếp tục có ảnh hưởng lớn đến Bắc Kinh, một tình cảm chia sẻ với Lin Xiantian. Trong khi các yếu tố tự do trong phe Trực Lệ đã lên tiếng ủng hộ TRCA, Lin và TAHR của ông chắc chắn có sự hỗ trợ của các cấp cao bảo thủ trong chính phủ. Tuy nhiên, đã có một lời kêu gọi giữa các nhân vật tập trung và quân sự hơn trong chính phủ không tin tưởng các đảng địa phương để đưa tỉnh này vào tình trạng thiết quân luật tạm thời.\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_southzhili: "$CHN.foreignpolicy.303.d_base$\n\nMặc dù Đài Loan đã trở lại nếp gấp hơi xa lạ với các đối tác đại lục của nó, có lẽ chính quyền [ROOT.GetLeader] là duy nhất phù hợp để đối phó với tỉnh đảo. Cơ sở quyền lực ban đầu của Tôn Truyền Phương là ở Phúc Kiến lân cận, tiếp tục đóng một vai trò quan trọng trong chính phủ Liên đoàn. Người Phúc Kiến chia sẻ một ngôn ngữ với các đối tác đảo của họ, vì vậy có lẽ ngôi sao đang lên của Phúc Châu Sa Shijun có thể cai trị tỉnh, đảm bảo rằng người dân địa phương vẫn bình định.\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_fengtian: "$CHN.foreignpolicy.303.d_base$\n\nGiống như Đài Loan, Đông Bắc biết quá rõ người Nhật. Trong khi nhiều người yêu nước Trung Quốc có ý nghĩa tốt có thể chê bai sự hợp tác của Nhật Bản giữa tầng lớp ưu tú của Đài Loan, Chính phủ An Quốc quân hiểu rõ hơn về tình hình Đài Loan. Do đó, chính quyền [ROOT.GetLeader] đã xem TAHR là một đối tác tiềm năng cùng với chính quyền để khuyến khích sự hỗ trợ của địa phương trong cả việc củng cố sự ổn định và chủ nghĩa truyền thống trên tỉnh đảo chia rẽ.\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_rkmt: "$CHN.foreignpolicy.303.d_base$\n\nQuốc dân đảng có chia sẻ công bằng của các đồng minh trên đảo để lựa chọn. Giang, bất chấp chủ nghĩa cực đoan của mình, là một người yêu nước đã được chứng minh, người tôn vinh Guofu nhiều như bất kỳ thành viên đảng nào từ Đại lục. Lin Xiantian cũng là một lựa chọn tốt vì các mối liên hệ của ông với giới quý tộc và giới tinh hoa Đài Loan, mặc dù có lẽ trao quyền cho các cộng tác viên Nhật Bản không phải là lợi ích tốt nhất của Trung Quốc. Một số người trong Đảng cũng đã gợi ý rằng Đài Loan có lẽ chưa sẵn sàng cho sự cai trị địa phương, thay vì một sĩ quan trung thành của NRA là lựa chọn tối ưu để duy trì trật tự và mở đường cho việc thực hiện tầm nhìn của Guofu trên đảo.\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_lkmt: "Sau khi Đài Loan được nhượng lại cho Nhật Bản, các phong trào Độc lập và Nội quy khác nhau đã nổi lên. Sự nhiệt tình này thể hiện dưới hình thức Hiệp hội Văn hóa Đài Loan, do Giang Weishui và Lin Xiantian lãnh đạo. Giang và Lâm cuối cùng đã chia rẽ, với Giang thành lập Đảng Nhân dân Đài Loan liền kề Quốc dân đảng, và Lương Khải Siêu ngưỡng mộ Lâm và các yếu tố bảo thủ thành lập Liên minh Đài Loan về Nội quy. Sau khi cải tạo Đài Loan, TPP đã thấy mình lúng túng. Những người ôn hòa như Cai Peihuo đã đụng độ với chủ nghĩa cấp tiến và thái độ độc đoán của Giang, đe dọa chia rẽ đảng.\n\nĐảng Công đoàn Đài Loan cũng được sáp nhập vào LCS lớn hơn khi chính quyền Đại lục đến. Trong khi đó, giới tinh hoa và tầng lớp quý tộc cũ trong TAHR đã chống lại trật tự xã hội chủ nghĩa mới. Giữa TPP và TAHR đã nổi lên Hiệp hội Đồng chí Phục hồi Đài Loan, do anh em Liao Wenkui và Liao Wenyi lãnh đạo. Bao gồm các nhà kỹ trị và trí thức được giáo dục phương Tây, đây là một phong trào tự do nói chung, tìm cách giành sự ủng hộ tự do từ Đại lục.\n\nQuốc dân đảng có chia sẻ công bằng của các đồng minh trên đảo để lựa chọn. Giang là một người yêu nước đã được chứng minh, người tôn vinh Guofu nhiều như bất kỳ thành viên đảng nào từ Đại lục. Một số người trong Đảng cũng đã gợi ý rằng Đài Loan có lẽ chưa sẵn sàng cho sự cai trị của địa phương, thay vì một sĩ quan trung thành của NRA là lựa chọn tối ưu để duy trì trật tự và mở đường cho việc thực hiện tầm nhìn của Guofu trên đảo.\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_manchu: "$CHN.foreignpolicy.303.d_base$\n\nSự mất mát của Đài Loan có lẽ là điểm thực sự không thể quay trở lại để duy trì triều đại nhà Thanh. Tuy nhiên, không chỉ chế độ quân chủ trở lại cai trị Trung Quốc, mà ngay cả tỉnh đảo cũng đã được Hoàng gia đòi lại. Các tổ chức địa phương của Đài Loan có xu hướng cộng hòa trong triển vọng, nhưng giới tinh hoa của họ luôn có ý nghĩa thực tế. Họ tìm thấy một mối quan hệ làm việc với Tokyo, có lẽ họ cũng có thể tìm thấy một mối quan hệ với Con trai của Thiên đường.\n\n$CHN.foreignpolicy.303.d_end$"
 CHN.foreignpolicy.303.d_generic: "$CHN.foreignpolicy.303.d_base$\n\nSau khi được quản lý tương tự như Phúc Kiến như một đơn vị toàn tỉnh, nhiều người đề xuất trong chính phủ ủng hộ việc trở lại tình trạng đó; người Phúc Kiến phù hợp nhất với việc quản lý người Đài Loan và nền văn hóa chung của họ.Tuy nhiên, một số người trong quân đội đã nhấn mạnh vai trò của quân đội trong việc duy trì một hòn đảo chiến lược như vậy, hoặc làm việc với các nhóm địa phương, có thể là TPP, TAHR hoặc cách khác.\n\n$CHN.foreignpolicy.303.d_end$"

 CHN.foreignpolicy.303.a: "[CHN_taiwan_get_unique_governor]"
 CHN.foreignpolicy.303.b: "Làm việc với các nhóm tiến bộ địa phương."
 CHN.foreignpolicy.303.c: "Vẫn còn sự hiện diện kéo dài của người Nhật trên đảo."
 CHN.foreignpolicy.303.e: "Phán quyết TAHR, ngay cả với danh tiếng của họ."
 CHN_taiwan_get_unique_governor_northzhili: "Chúng ta thấy hợp tác với Lin Xiantian là chấp nhận được."
 CHN_taiwan_get_unique_governor_southzhili: "Sa Shijun sẽ có thể đưa Đài Loan dưới sự quản lý thích hợp."
 CHN_taiwan_get_unique_governor_fengtian: "TAHR hiểu cách nhảy với Đang tăng Sun, như chúng ta."
 CHN_taiwan_get_unique_governor_rkmt: "Giang Trạch Dân rất thô lỗ, nhưng hắn là người chúng ta cần."
 CHN_taiwan_get_unique_governor_lkmt: "Giang Trạch Dân có thể được tin tưởng để mang chủ nghĩa xã hội đến Đài Loan."
 CHN_taiwan_get_unique_governor_manchu: "Lin và TAHR của hắn sẽ phục vụ Hoàng đế tốt."

##Other Foreign Policy (400-599):

#Tawang and Askai Chin Border War Events (400-419)
 CHN.foreignpolicy.400.t: "Chiến tranh tại Himalaya"
 CHN.foreignpolicy.400.d: "Trong nhiều tuần nay, các lực lượng đã tích lũy dọc theo dãy Himalaya trên các vùng lãnh thổ tranh chấp nóng bỏng từng được Ấn Độ thuộc Anh và nhà Thanh Trung Quốc tuyên bố vào đầu những năm 1900. Cả hai bên đã trải qua tình trạng hỗn loạn đáng kể, nhưng các quốc gia kế nhiệm của họ đã không quên tuyên bố tương ứng của họ, nguồn căng thẳng chính là [858.GetName] và [897.GetName] . Được tuyên bố bởi các chính phủ cạnh tranh ở Ấn Độ, Trung Quốc và các cường quốc địa phương ở Tây Tạng và Tân Cương tương ứng, họ đã trở thành một điểm bùng phát trong quan hệ ngoại giao trên các ngọn núi.\n\nThật không may, những kẻ cực đoan đã giành chiến thắng trong [FROM.Capital.GetCapitalVictoryPointName] . Không hài lòng với kết quả ban đầu, họ đã vận động thành công cho một cuộc chiến tổng lực sẽ quyết định số phận của nhiều hơn một vài thôn xóm ở dãy Himalaya."
 CHN.foreignpolicy.400.a: "Chúng ta sẽ chiến thắng!"
 CHN.foreignpolicy.400.b: "Một sự leo thang quyết liệt!"

 CHN.foreignpolicy.401.t: "Xem xét lại đường McMahon"
 CHN.foreignpolicy.401.d: "Dưới sự cai trị của nhà Thanh Trung Quốc, Tây Tạng là một nước bảo hộ tự trị nhưng đã chứng kiến ảnh hưởng của Trung Quốc suy tàn nhanh chóng trong Đại hội Thể thao cuối thế kỷ 19 giữa Đế quốc Anh và Nga. Trong khi các lực lượng nhà Thanh cố gắng tái khẳng định quyền kiểm soát, cuộc cách mạng năm 1911 đã phá vỡ các kế hoạch này và các lực lượng Tây Tạng đã trục xuất sự hiện diện của Trung Quốc khỏi lãnh thổ của họ. Trong giai đoạn bất ổn của Trung Quốc này, người Anh đã đàm phán một hiệp ước với Cộng hòa Trung Quốc và Tây Tạng tại Simla và Delhi, chính thức chia Tây Tạng thành Ngoại Tây Tạng và Nội Tây Tạng. Là một phần của thỏa thuận, Tây Tạng sau đó đã khoanh định vài trăm dặm vuông (bao gồm cả khu vực Tawang) cho Ấn Độ thuộc Anh. Bị xúc phạm bởi hiệp ước, người Trung Quốc đã từ chối ký kết và người Tây Tạng cũng từ chối chấp nhận nó vì sự chấp nhận của họ là có điều kiện khi được Trung Quốc chấp nhận.\n\nTuy nhiên, người Anh duy trì rằng Sửa đổi Biên giới 1914 là hợp pháp và cái gọi là Đường McMahon đã được thi hành mặc dù không thường xuyên. Nhưng trong cuộc cách mạng của Anh vào năm 1925 và Nội chiến Ấn Độ sau đó, các lực lượng Tây Tạng đã có thể đòi lại quyền kiểm soát thực tế đối với lãnh thổ.\n\nSự hỗn loạn của vài năm qua đã làm phân tâm Ấn Độ, Trung Quốc và Tây Tạng khỏi những vấn đề này. [KR_himalaya_war_tawang_defender_tag.GetNameDefCap] kiểm soát khu vực trong thực tế và với địa hình cao, khó khăn và giá trị thực tế thấp của Tawang, sẽ rất khó để đánh bật chúng. Nhưng [FROM.GetNameDef] dường như không nản lòng và đã bắt đầu tích lũy lực lượng để thách thức hiện trạng trong một bế tắc có khả năng chết người."
 CHN.foreignpolicy.401.a: "Một ranh giới rắc rối."
 CHN.foreignpolicy.401.a_tt: "§R Một cuộc chiến tranh biên giới đã nổ ra trên Tawang. Nếu xung đột này không được giải quyết trong một trăm ngày, người bảo vệ sẽ giữ quyền kiểm soát nhà nước. §!"

 CHN.foreignpolicy.402.t: "[KR_himalaya_war_tawang_defender_tag.GetNameDefCap] Chiến thắng trong [858.GetName]"
 CHN.foreignpolicy.402.d: "Trong vài tuần qua, các cuộc đụng độ nhỏ đã nổ ra gần thị trấn Tawang với cả hai bên trao đổi pháo binh hạng nhẹ và hỏa lực vũ khí nhỏ trên lãnh thổ tranh chấp, được gọi là Arunachal Pradesh cho người Ấn Độ, Lhoyu và Monyul cho người Tây Tạng, và Nam Tây Tạng cho Trung Quốc. Mặc dù thương vong cuối cùng là nhẹ, độ cao lớn đã gây ra khó khăn đáng kể cho cả hai bên.\n\nTuy nhiên, cuối cùng, [KR_himalaya_war_tawang_defender_tag.GetAdjective] đã thiết lập các vị trí phòng thủ chỉ huy trong khu vực - đẩy lùi sự xâm nhập của kẻ thù vào lãnh thổ của họ. Cả hai bên đã nhanh chóng nhận ra rằng sự leo thang hơn nữa có thể sẽ yêu cầu huy động toàn bộ quốc gia của họ. Chấp nhận hiện trạng sẽ để lại [KR_himalaya_war_tawang_defender_tag.Capital.GetCapitalVictoryPointName] ở một lợi thế, tuy nhiên tất cả trừ những người hiếu chiến nhất tin rằng chiến tranh hơn nữa sẽ tàn phá cả hai. Tuy nhiên, có nhiều người ở cả hai bên tin rằng đây chỉ là trận chiến đầu tiên của một cuộc chiến rộng lớn hơn nhiều giữa các nền văn minh và đã tìm cách tiếp tục cuộc chiến trên dãy Himalaya."
 CHN.foreignpolicy.402.a: "Có vẻ như tất cả chúng ta sẽ phải hài lòng với kết quả này."
 CHN.foreignpolicy.402.b: "Vớ vẩn, chuyện này sẽ đi đến cùng!"

 CHN.foreignpolicy.403.t: "[KR_himalaya_war_tawang_attacker_tag.GetNameDefCap] Chiến thắng trong [858.GetName]"
 CHN.foreignpolicy.403.d: "Trong vài tuần qua, các cuộc đụng độ nhỏ đã nổ ra gần thị trấn Tawang với cả hai bên trao đổi pháo binh hạng nhẹ và hỏa lực vũ khí nhỏ trên lãnh thổ tranh chấp, được gọi là Arunachal Pradesh cho người Ấn Độ, Lhoyu và Monyul cho người Tây Tạng, và Nam Tây Tạng cho Trung Quốc. Mặc dù thương vong cuối cùng là nhẹ, độ cao lớn đã gây ra khó khăn đáng kể cho cả hai bên.\n\nTuy nhiên, cuối cùng, [KR_himalaya_war_tawang_attacker_tag.GetAdjective] đã chiếm giữ các vị trí phòng thủ chỉ huy trong khu vực - đẩy lùi lực lượng đối phương và chiếm lấy nó cho riêng họ. Cả hai bên đã nhanh chóng nhận ra rằng sự leo thang hơn nữa có thể sẽ yêu cầu huy động toàn bộ quốc gia của họ. Chấp nhận hiện trạng sẽ để lại [KR_himalaya_war_tawang_attacker_tag.Capital.GetCapitalVictoryPointName] ở một lợi thế, tuy nhiên tất cả trừ những kẻ hiếu chiến nhất của warhawks tin rằng chiến tranh hơn nữa sẽ tàn phá cả hai. Tuy nhiên, có nhiều người ở cả hai bên tin rằng đây chỉ là trận chiến đầu tiên của một cuộc chiến rộng lớn hơn nhiều giữa các nền văn minh và đã tìm cách tiếp tục cuộc chiến trên dãy Himalaya."
 CHN.foreignpolicy.403.a: "Cuộc chiến này đã kết thúc."
 CHN.foreignpolicy.403.b: "Cuộc chiến này chỉ mới bắt đầu!"

 CHN.foreignpolicy.404.t: "Stalemate trong [858.GetName]"
 CHN.foreignpolicy.404.d: "Trong một trăm ngày, các cuộc đụng độ nhỏ đã nổ ra gần thị trấn Tawang với cả hai bên trao đổi pháo binh hạng nhẹ và hỏa lực nhỏ trên lãnh thổ tranh chấp, được gọi là Arunachal Pradesh cho người Ấn Độ, Lhoyu và Monyul cho người Tây Tạng, và Nam Tây Tạng cho Trung Quốc.Mặc dù thương vong cuối cùng là nhẹ, độ cao lớn đã gây ra khó khăn đáng kể cho cả hai bên.\n\nMặc dù bướng bỉnh lẫn nhau, không bên nào có tiến bộ đáng kể trong cuộc xung đột vì các vị trí phòng thủ nằm rải rác trên những con đường đồi núi. Địa hình gồ ghề đã gây khó khăn cho việc thiết lập hậu cần ổn định hoặc hỗ trợ không quân hiệu quả, khiến cả hai lực lượng bị mắc kẹt trong tình trạng bế tắc. Dường như cả hai sẽ không thể tiến xa hơn với nguồn lực hạn chế mà họ đã được cung cấp.\n\nĐàm phán đã bắt đầu giữa hai bên, hy vọng hòa giải cuộc xung đột vì sợ nó tràn vào một cuộc chiến tranh toàn diện. Để kết thúc cuộc chiến ở đây có thể sẽ dẫn đến sự trở lại của status quo ante bellum, ủng hộ mạnh mẽ [KR_himalaya_war_tawang_defender_tag.GetNameDef] . Nhưng warhawks ở cả hai trại tuyên bố họ rất gần với chiến thắng trong cuộc xung đột, và hơn nữa tình hình này là phát súng mở màn cho một cuộc đối đầu lớn giữa hai nền văn minh. Thay vì hòa bình, họ yêu cầu chiến thắng hoàn toàn."
 CHN.foreignpolicy.404.a: "Hãy giả vờ như chuyện này chưa từng xảy ra."
 CHN.foreignpolicy.404.b: "Làm sao chúng ta có thể giả vờ đây là thời điểm tốt nhất của chúng ta?"

 CHN.foreignpolicy.411.t: "Tranh chấp biên giới [897.GetName]"
 CHN.foreignpolicy.411.d: "Tranh chấp về phần phía tây của biên giới Trung-Ấn (Aksai Chin) lần đầu tiên phát sinh vào năm 1834 với cuộc chinh phục Ladakh của quân đội Raja Gulab Singh dưới quyền bá chủ của Đế chế Sikh. Sau một chiến dịch không thành công vào Tây Tạng, Gulab Singh và người Tây Tạng đã ký một hiệp ước vào năm 1842 đồng ý gắn bó với các biên giới cũ được thiết lập” (không được chỉ định). Cuộc chinh phục của người Sikh của Anh dẫn đến việc chuyển khu vực Jammu và Kashmir cho người Anh - sau đó liên lạc với các quan chức Trung Quốc, những người ít quan tâm. Khu vực này vẫn bị bỏ qua phần lớn trong suốt thế kỷ 19 và được đặt tên là Đường Johnson Johnson” theo tên của WH Johnson, một nhà khảo sát người Anh, người đã mở rộng Kashmir thuộc Anh vào rìa phía đông của Thung lũng Chang Chenmo dọc theo dãy núi Côn Lôn (kéo dài vào Turkestan và Tây Tạng của Trung Quốc).\n\nLực lượng Trung Quốc chính thức tái chiếm Turkestan vào năm 1878, đổi tên thành Tân Cương (Biên giới mới) và trở lại biên giới truyền thống. Người Anh đồng ý, lo lắng không chia sẻ biên giới với người Nga (những người tham gia vào Great Game). Một biên giới nửa vời được tạo ra với các cột biên giới yếu cho đến năm 1899, người Anh trở lại biên giới với Tuyến Maccartney-Macdonald, dự định nhượng lại cho Trung Quốc đồng bằng Aksai Chin trong khi Trung Quốc nhượng lại yêu sách đối với Huzna. Trung Quốc không bao giờ chấp nhận nó và sau sự sụp đổ của nhà Thanh, người Anh chính thức bắt đầu sử dụng Đường Johnson nhưng không bên nào thực thi nó. Chính quyền tỉnh Tân Cương đã khai thác Cách mạng Anh năm 1925 để di chuyển khu vực thay mặt chính phủ Trung Quốc và Chính phủ Ấn Độ thuộc Anh - bận rộn với cuộc nội chiến, sẽ làm rất ít để tranh cãi.\n\nTình hình đã thay đổi kể từ đó. Quân đội đã bắt đầu tích lũy ở cả hai bên biên giới và tuần tra đối thủ và di chuyển ngày càng gần nhau. Dường như sự thù địch chắc chắn sẽ bùng nổ trong khu vực."
 CHN.foreignpolicy.411.a: "Rắc rối về bia ở vùng cao nguyên."
 CHN.foreignpolicy.411.a_tt: "§R Một cuộc chiến tranh biên giới đã nổ ra trên Aksai Chin. Nếu cuộc xung đột này không được giải quyết trong một trăm ngày, người bảo vệ sẽ giữ quyền kiểm soát nhà nước. §!"

 CHN.foreignpolicy.412.t: "[KR_himalaya_war_aksai_chin_defender_tag.Getadjective] Hậu vệ Chiến thắng trong [897.GetName]"
 CHN.foreignpolicy.412.d: "Trong vài tuần qua, các lực lượng đối thủ đã tham gia vào các cuộc đụng độ nhỏ ở [897.GetName]. Pháo binh hạng nhẹ và hỏa lực vũ khí nhỏ đã cướp đi hàng chục sinh mạng trong điều kiện độ cao khốn khổ khi các lực lượng địa phương đấu tranh để kiểm soát khu vực.\n\nTrong hoàn cảnh đó, không có gì ngạc nhiên khi những người bảo vệ [KR_himalaya_war_aksai_chin_defender_tag.GetAdjective] nói chung vẫn duy trì lợi thế, làm chảy máu kẻ thù của họ và buộc họ phải rút lui. Các cuộc đàm phán đã bắt đầu, với [KR_himalaya_war_aksai_chin_defender_tag.capital.Getcapitalvictorypointname] được hưởng lợi từ lợi thế chiến trường của họ. Một cuộc xung đột lớn hơn sẽ yêu cầu huy động lớn giữa hai quốc gia vẫn đang đối phó với các chủng loại hiện đại hóa và phục hồi.\n\nNhưng có nhiều người cấp tiến ở cả hai bên khẳng định rằng hòa bình sẽ chỉ trì hoãn một cuộc xung đột quy mô rộng không thể tránh khỏi. Họ kêu gọi leo thang thành một cuộc chiến tranh rộng lớn hơn sẽ quyết định số phận của khu vực cho tốt."
 CHN.foreignpolicy.412.a: "Triển vọng lâu dài của chúng ta phụ thuộc vào sự hợp tác hòa bình."
 CHN.foreignpolicy.412.b: "An ninh quốc gia của chúng ta đòi hỏi chiến thắng toàn diện!"

 CHN.foreignpolicy.413.t: "[KR_himalaya_war_aksai_chin_attacker_tag.Getadjective] Lực lượng di chuyển vào [897.GetName]"
 CHN.foreignpolicy.413.d: "Trong vài tuần qua, các lực lượng đối thủ đã tham gia vào các cuộc đụng độ nhỏ ở [897.GetName]. Pháo binh hạng nhẹ và hỏa lực vũ khí nhỏ đã cướp đi hàng chục sinh mạng trong điều kiện độ cao khốn khổ khi các lực lượng địa phương đấu tranh để kiểm soát khu vực.\n\nTrong một sự đảo ngược tuyệt vời, lực lượng [KR_himalaya_war_aksai_chin_attacker_tag.GetAdjective] đã có thể nắm bắt được sáng kiến và đẩy lùi các đối thủ của họ từ các công sự của họ trong [897.GetName]. Những người bảo vệ, tổ chức kém và với hệ thống phòng thủ được xây dựng không đúng cách, bị tàn lụi dưới hỏa lực của kẻ thù và buộc phải rút lui, trao cho [KR_himalaya_war_aksai_chin_attacker_tag.GetLeader] một chiến thắng lớn. Các cuộc đàm phán đã bắt đầu, với [KR_himalaya_war_aksai_chin_attacker_tag.Capital.Getcapitalvictorypointname] được hưởng lợi từ lợi thế chiến trường của họ. Một cuộc xung đột lớn hơn sẽ đòi hỏi huy động lớn giữa hai quốc gia vẫn còn đối phó với những căng thẳng của hiện đại hóa và phục hồi.\n\nNhưng có nhiều người cấp tiến ở cả hai bên khẳng định rằng hòa bình sẽ chỉ trì hoãn một cuộc xung đột quy mô rộng không thể tránh khỏi. Họ kêu gọi leo thang thành một cuộc chiến tranh rộng lớn hơn sẽ quyết định số phận của khu vực cho tốt."
 CHN.foreignpolicy.413.a: "Bây giờ không còn gì để làm ngoài việc ký kết thỏa thuận hòa bình tất yếu."
 CHN.foreignpolicy.413.b: "Chúng ta có thể làm gì ngoài việc theo đuổi chiến thắng cuối cùng?"

 CHN.foreignpolicy.414.t: "[897.GetName] Skirmishes Kết thúc trong một Stalemate"
 CHN.foreignpolicy.414.d: "Trong vài tuần qua, các lực lượng đối thủ đã tham gia vào các cuộc đụng độ nhỏ ở [897.GetName]. Pháo binh hạng nhẹ và hỏa lực vũ khí nhỏ đã cướp đi hàng chục sinh mạng trong điều kiện độ cao khốn khổ khi các lực lượng địa phương đấu tranh để kiểm soát khu vực.\n\nÍt tiến bộ đã được thực hiện trong cuộc xung đột, như [KR_himalaya_war_aksai_chin_attacker_tag.GetAdjective] quân đấu tranh để làm cho tiến bộ và [KR_himalaya_war_aksai_chin_defender_tag.Getadjective] hậu vệ thất bại trong việc đánh bật chúng.\n\nCác cuộc đàm phán đã bắt đầu, và hiện trạng chắc chắn có lợi cho [KR_himalaya_war_aksai_chin_defender_tag.Capital.GetCapitalVictoryPointName] , nhưng chiến tranh vẫn là mối quan tâm lớn đối với cả hai bên. Một cuộc xung đột lớn hơn sẽ đòi hỏi phải huy động lớn giữa hai quốc gia vẫn đang đối phó với những căng thẳng của hiện đại hóa và phục hồi.\n\nNhưng có nhiều người cấp tiến ở cả hai bên khẳng định rằng hòa bình sẽ chỉ trì hoãn một cuộc xung đột quy mô rộng không thể tránh khỏi. Họ kêu gọi leo thang thành một cuộc chiến tranh rộng lớn hơn sẽ quyết định số phận của khu vực cho tốt."
 CHN.foreignpolicy.414.a: "Chúng ta phải kết thúc mớ hỗn độn này."
 CHN.foreignpolicy.414.b: "Chỉ có một cách để kết thúc chuyện này mãi mãi!"

## Chinese Puppeting (600-799):
 CHN_can_create_new_rival_government_puppet_tt: "§Y Bởi vì chúng ta sở hữu một trong những thành phố lớn của Trung Quốc ([608.GetCapitalVictoryPointName], [613.GetCapitalVictoryPointName], [1048.GetCapitalVictoryPointName], [592.GetCapitalVictoryPointName], [716.GetCapitalVictoryPointName] hoặc [650.GetCapitalVictoryPointName]), chúng ta là §G có thể tạo ra §! một chính phủ đối thủ mới. §!"
 CHN_cannot_create_new_rival_government_puppet_tt: "§Y Bởi vì chúng ta §R không §! sở hữu một trong những thành phố lớn của Trung Quốc ([608.GetCapitalVictoryPointName], [613.GetCapitalVictoryPointName], [1048.GetCapitalVictoryPointName], [592.GetCapitalVictoryPointName], [716.GetCapitalVictoryPointName] hoặc [650.GetCapitalVictoryPointName]), chúng ta là §R không thể tạo ra §! một chính phủ đối thủ mới. §!"

# Shared (600-619)
 CHN.foreignpolicy.600.t: "Trung Quốc- [ROOT.GetAdjective] Đàm phán"
 CHN.foreignpolicy.600.d: "Kể từ 1911, Trung Quốc đã phải chịu đựng rất nhiều từ sự mất đoàn kết chính trị, cuộc cách mạng, và quân phiệt. Nhập cảnh của chúng ta vào lục địa làm cho chúng ta chỉ mới nhất sẽ được chinh phục của xã hội cổ đại, nhưng trừ khi chúng ta muốn trực tiếp tài trợ cho việc tái thiết Trung Quốc và đối phó với nổi dậy kéo dài, cướp bóc, và quân phiệt, chúng ta sẽ là khôn ngoan để hợp tác với các đồng minh địa phương và / hoặc cộng tác viên trong khu vực. Các đại lý của chúng ta trên mặt đất đã bắt đầu mở các cuộc đàm phán với cả hai phe phái địa phương và lưu vong chính trị với hy vọng facilitaating một cuộc đối thoại như vậy. Nó cuối cùng sẽ lên đến [ROOT.Capital.GetCapitalVictoryPointName] để quyết định hướng đi. Cuối cùng nó được quyết định để khám phá các cuộc đàm phán với ..."
 CHN.foreignpolicy.600.monarchy: "...các quân chủ Trung Quốc."
 CHN.foreignpolicy.600.pro_japanese: "...đồng minh thân Nhật của chúng ta."
 CHN.foreignpolicy.600.federalists: "...Phong trào Liên bang Trung Quốc."
 CHN.foreignpolicy.600.revolutionaries: "Cách mạng Trung Hoa."
 CHN.foreignpolicy.600.republicans: "...những người Cộng hòa Trung Quốc khác."
 CHN.foreignpolicy.600.CHN: "...mạnh nhất. Chúng ta không muốn làm gì hơn với Trung Quốc."
 CHN.foreignpolicy.600.cancel: "Chúng ta sẽ trì hoãn việc đưa ra quyết định."

# Monarchy (620-639)
 CHN.foreignpolicy.620.t: "Đàm phán với phe bảo hoàng Trung Quốc"
 CHN.foreignpolicy.620.d.intro: "Trong 1911, các nhà cách mạng Trung Quốc lật đổ Hoàng đế Xuantong, sau đó Puyi hai tuổi. Đây là đỉnh cao của nhiều thập kỷ suy thoái chính trị, kinh tế và quân sự của nhà Thanh. Cách mạng Tân Hải liên quan đến hợp lưu của chủ nghĩa cộng hòa, chủ nghĩa cấp tiến, và chủ nghĩa dân tộc và một nỗ lực của Viên Thế Khải (gợi ý bởi các cố vấn phương Tây) để đăng quang mình như Hoàng đế một vài năm sau đó lao quốc gia vào một kỷ nguyên Warlord dài nhiều thập kỷ."
 CHN.foreignpolicy.620.d.MCU_exists: "$CHN.foreignpolicy.620.d.intro$\n\nBất chấp tất cả các tỷ lệ cược, chế độ quân chủ nhà Thanh quản lý để không chỉ trở lại nhưng treo trên thông qua sự hỗn loạn. Hỗ trợ chính trị cho chế độ quân chủ bị hạn chế mặc dù ý kiến đã dịu đi do sự hỗn loạn của quy tắc cộng hòa trong những năm tiếp theo. Các ứng cử viên khác có quá ít tính chính danh vào thời điểm này để cung cấp một sự thay thế có ý nghĩa, vì vậy nếu có một chế độ quân chủ Trung Quốc, dường như nhà Thanh có thể là lựa chọn duy nhất của chúng ta để khôi phục lại sự cân bằng và ổn định cho Trung Quốc."
 CHN.foreignpolicy.620.d.no_MCU: "$CHN.foreignpolicy.620.d.intro$\n\nHỗ trợ chính trị cho chế độ quân chủ bị hạn chế mặc dù ý kiến đã dịu đi do sự hỗn loạn của chế độ cộng hòa trong những năm tiếp theo. Tuy nhiên, nhiều người cảnh giác với việc cố gắng cài đặt một chế độ quân chủ bằng vũ lực và sự lập dị \" \" của vị vua sẽ trở thành (Puyi đã trưởng thành) cũng khiến nhiều người phải tạm dừng. Các ứng cử viên khác có quá ít tính chính danh vào thời điểm này để cung cấp một sự thay thế có ý nghĩa. Tuy nhiên, có nhiều người tin rằng sự phục hồi của chế độ quân chủ cũ có thể là cách duy nhất để khôi phục lại sự cân bằng và ổn định cho Trung Quốc."
 CHN.foreignpolicy.620.QIE: "Trung Quốc sẽ cúi đầu trước Hoàng đế nhà Thanh được phục hồi."
 CHN.foreignpolicy.620.cancel: "Trung Quốc xứng đáng có một tương lai tư duy tiến bộ hơn."

# Japan Aligned (640-659)
 CHN.foreignpolicy.640.t: "Cải tổ nền cộng hòa"
 CHN.foreignpolicy.640.d: "Nhật Bản từ lâu đã nuôi dưỡng ảnh hưởng ở Trung Quốc, sàng lọc thông qua các đồng minh và cộng tác viên khác nhau với hy vọng mở rộng phạm vi tiếp cận của họ sang nước láng giềng đông dân hơn. Các phe phái Trung Quốc khác nhau đã làm việc với Nhật Bản, hoặc là chủ nghĩa lý tưởng Pan-Asian thực sự của chúng ta hoặc niềm tin rằng hai cường quốc có thể làm việc cùng nhau chống lại chủ nghĩa đế quốc châu Âu hoặc mong muốn thực dụng để tránh chiến tranh hoặc thống trị hoàn toàn bởi Nhật Bản hoặc đơn giản là vì họ muốn hoặc cần sự giúp đỡ của Nhật Bản.\n\nHầu hết các lực lượng ủng hộ Nhật Bản cuối cùng liên kết với bè phái Phong kiến hoặc Quân đội Thái Bình Dương Quốc gia (An Quốc quân), với phe Trương Tổ Lâm, bè phái Shikan, Liên minh Phục hồi (những người kế nhiệm của bè phái An Huy) và bè phái Truyền thông mới đều có mức độ cảm tình ủng hộ Nhật Bản khác nhau.Được tài trợ trực tiếp hơn bởi Tokyo là Hiệp hội Concordia và Hội Nhân dân Mới.\n\nNhiều đồng minh nhỏ của Nhật Bản bao gồm Chen Lianbo và chính phủ thương gia của ông ở Quảng Châu (Quảng Châu), những người đã tìm cách làm sâu sắc thêm mối quan hệ với Nhật Bản để chống lại ảnh hưởng của Trực Lệ và Old Quảng Tây. Tương tự, các đại lý của chúng ta cũng đã làm việc để tòa án Thống đốc Diêm Tích Sơn của Sơn Tây về phía chúng ta.\n\nVới nền cộng hòa cũ đã bị phá hủy, một nền cộng hòa mới phải được hình thành - sáp nhập các dự án cạnh tranh của Quân đội, Hải quân và chính phủ dân sự Nhật Bản. Cuối cùng, một quyết định phải được đưa ra về việc ai sẽ lãnh đạo Chính phủ tái lập \" này. \""
 #This event can be worded as creating a new government because only Japan can create it so you will only see this if you have not created a Pro-Japanese puppet yet.
 CHN.foreignpolicy.640.FNG: "Chúng ta hãy dựa vào mạng lưới được vun đắp ở Thẩm Dương."
 CHN.foreignpolicy.640.GXC: "Chúng ta hãy nhìn về phía nam tới Quảng Châu Merchants."
 CHN.foreignpolicy.640.SHX: "Chúng ta hãy nhìn về phía bắc đến Diêm Tích Sơn hoang dại."
 CHN.foreignpolicy.640.cancel: "Bây giờ chúng ta tiếp tục chiếm đóng."

# Federalists (660-679)
 CHN.foreignpolicy.660.t: "Chủ nghĩa liên bang tại Trung Quốc?"
 CHN.foreignpolicy.660.d.intro: "Chủ nghĩa liên bang ở Trung Quốc đã có một lịch sử phức tạp, với một điểm cao ngắn ngủi vào đầu những năm 1920 sau đó là sự suy giảm nhanh chóng trong những năm tiếp theo. Tuy nhiên, nó vẫn giữ được sự phổ biến của nó trong số những người sợ sự chuyên chế và tham nhũng của chính quyền trung ương, và phong trào Liên bang trong những năm gần đây cũng đã hấp thụ các yếu tố dân chủ, hiến pháp và khu vực."
 CHN.foreignpolicy.660.d.UPC_exists: "$CHN.foreignpolicy.660.d.intro$\n\nMột chính phủ liên bang đã được thành lập ở Trung Quốc, đã được xem với sự nghi ngờ như là một phần mở rộng của chế độ quân phiệt nhưng cũng đã được chấp nhận bởi nhiều chính trị gia địa phương những người đứng để hưởng lợi từ một hệ thống như vậy. Họ sẽ khá biết ơn nếu chúng ta thêm một vài tỉnh vào liên bang của họ."
 CHN.foreignpolicy.660.d.no_UPC: "$CHN.foreignpolicy.660.d.intro$\n\nCài đặt một chính phủ liên bang ở Trung Quốc có thể sẽ được xem xét với sự nghi ngờ như là một phương tiện phân chia và chinh phục, mặc dù các chính trị gia địa phương những người đứng để được hưởng lợi từ một hệ thống như vậy có thể nhanh chóng nắm lấy nó. Phong trào Liên bang ở Trung Quốc, bởi bản chất của nó, là đa dạng về chính trị và khuếch tán. Liêu Giang, Vân Nam, Hồ Nam, Tứ Xuyên, và Chiết Giang có lẽ là trung tâm đáng chú ý nhất của phong trào Liên bang Trung Quốc."
 CHN.foreignpolicy.660.GXC: "Những người theo chủ nghĩa liên bang Quảng Châu có vẻ hứa hẹn."
 CHN.foreignpolicy.660.YUN: "Miền Tây Nam luôn là một pháo đài liên bang."
 CHN.foreignpolicy.660.cancel: "Cái này có vẻ hơi quá xa vời..."

# Republic (680-699)
 CHN.foreignpolicy.680.t: "Một nền cộng hòa mới?"
 CHN.foreignpolicy.680.d: "Sau Cách mạng Tân Hợi năm 1911, một nước cộng hòa mới đã được tuyên bố. Cộng hòa Trung Quốc này đã trải qua sự hỗn loạn to lớn trong suốt thời đại quân phiệt khi một thế lực kế tiếp thống trị Bắc Kinh. Được mệnh danh là Cộng hòa \" Bắc Dương \" , nó trở nên khét tiếng vì tham nhũng và độc tài, nhưng tuy nhiên chủ nghĩa lý tưởng của cuộc cách mạng ban đầu vẫn tồn tại. Ngay cả những nhà lãnh đạo hoài nghi hơn của chính phủ vẫn cố gắng định hình quốc gia theo hình ảnh của họ, truyền vào một hỗn hợp của chủ nghĩa tự do phương Tây, Nho giáo Trung Quốc và các ý thức hệ đồng bộ khác để cố gắng và cung cấp quản trị tốt cho người dân. Điều tự nhiên là chúng ta bàn giao quyền lực cho sự tiếp nối của chính phủ cũ này."
 #Phrase the responses in such a way that its neutral if one exists or not.
 CHN.foreignpolicy.680.QIE: "Chúng ta sẽ hợp tác với chính phủ ở Bắc Kinh."
 CHN.foreignpolicy.680.LEP: "Chúng ta sẽ làm việc với ban lãnh đạo ở Nam Kinh."
 CHN.foreignpolicy.680.SHX: "Chúng ta đặt niềm tin vào Thống đốc Yan xảo quyệt."
 CHN.foreignpolicy.680.cancel: "Bây giờ chúng ta sẽ tiếp tục."

# Revolutionaries (700-719)
 CHN.foreignpolicy.700.t: "Một cuộc cách mạng mới tại Trung Quốc?"
 CHN.foreignpolicy.700.d.intro: "Cách mạng Tân Hợi năm 1911 là một sự kiện thảm khốc trong lịch sử Trung Quốc và mở ra cánh cửa cho các ý tưởng chính trị, xã hội và kinh tế cấp tiến phát triển mạnh trong diễn ngôn Trung Quốc. Nhưng việc dịch các ý tưởng thành hành động rất khó khăn và thúc đẩy sự chia rẽ hơn nữa giữa thế hệ mới này của những người xã hội chủ nghĩa, dân tộc chủ nghĩa và cộng hòa cách mạng.\n\nTiến sĩ Tôn Trung Sơn và Quốc dân đảng của ông đã trở thành đảng cách mạng quan trọng nhất trong thời kỳ Warlord nhưng họ hầu như không một mình. Quốc dân quân, Đảng Công đoàn chủ nghĩa Trung Quốc, Xã hội Thế giới, và các mảnh vỡ khác nhau và các nhóm độc lập xuất hiện trong suốt những năm qua, tất cả cạnh tranh cho một cơ hội để định hình lại Trung Quốc trong hình ảnh của họ."
 CHN.foreignpolicy.700.d.KMT_exists: "$CHN.foreignpolicy.700.d.intro$ Có nhiều lý do để cảnh giác với chính phủ cách mạng hiện tại, nhưng nếu chúng ta làm việc với họ, chúng ta có thể mãi mãi thay đổi tiến trình của nền văn minh cổ đại."
 CHN.foreignpolicy.700.d.no_KMT: "$CHN.foreignpolicy.700.d.intro$ Cưỡng bức cài đặt cách mạng vào Trung Quốc chắc chắn sẽ khó khăn, nhưng có thể làm thay đổi mãi mãi tiến trình lịch sử của nền văn minh cổ đại."
 CHN.foreignpolicy.700.CHI: "Cơ sở xã hội chủ nghĩa tất nhiên."
 CHN.foreignpolicy.700.GXC: "Quảng Châu là quê hương của cách mạng!"
 CHN.foreignpolicy.700.SHX: "Quốc dân quân cung cấp một viễn cảnh tươi mới."
 CHN.foreignpolicy.700.YUN: "Quý Châu là chỗ đứng cuối cùng của NRA cũ!"
 CHN.foreignpolicy.700.cancel: "Chuyện này đi quá xa rồi..."

