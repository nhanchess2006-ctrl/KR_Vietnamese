 china_faction_tenets_title_independent: "§YCác quân phiệt độc lập§!"
 china_faction_tenets_desc: "[ChinaGetAlignmentTenetsDesc]"
 china_faction_tenets_northern_zhili_desc: "§L Được cai trị bởi vua Bảo Định \" hào hiệp \" Cao Côn và \" Ngọc Nguyên soái nổi tiếng \" Ngô Bội Phu, bè phái Bắc Trực Lệ có tổ tiên là bè phái của Phùng Quốc Chương trong Tân quân Bắc Dương, và thậm chí xa hơn nữa là từ Phó vương Trực Lệ, \" Bismarck Trung Quốc \" Li Hongzhang. Ý thức chính trị hơn nhiều về mong muốn cải cách chính trị của quần chúng, bè phái Bắc Trực Lệ thể hiện lịch sử cải cách \" nghiêm túc \".\n\nTuy nhiên, nhiều lambaste Trực Lệ cho là không có gì nhiều hơn so với các quân phiệt, với sự phân chia nội bộ của họ và hệ thống mạng Guanxi vấn đề tồi tệ hơn. Chia giữa phe Jinbao Cao và phe Luoyang Wu của, lý tưởng của Trực Lệ là nhiều mặt. Mặc dù một điều họ được thống nhất trong là vai trò của Trực Lệ trong sự thống nhất của Trung Quốc.\n\nVới phe của Tào Côn dựa vào sự nghiệp chính trị nặng nề của mình, vị trí cầm quyền trong toàn bộ Trực hệ, và hiến pháp đặc trưng của ông, họ thúc đẩy một loạt hiện đại hóa thận trọng của quốc gia Trung Quốc và tiếp tục di sản của Bắc Dương. Ngược lại, phe Ngô Bội Phu thúc đẩy một nước Cộng hòa Dân chủ Nho giáo có đầu óc trí tuệ, hy vọng khắc phục những sai lầm của Cộng hòa Bắc Dương dưới hình thức ý định cải cách thực sự. §!"
 china_faction_tenets_southern_zhili_desc: "§L Di sản lâu dài của \" Smiling Tiger \" Tôn Truyền Phương, Nam Trực Lệ Clique chia sẻ tổ tiên tương tự như Bắc Trực Lệ Clique. Với tổ tiên của nó là Li Hongzhang và Feng Guozhang, Nam Trực Lệ sẽ tách ra khỏi họ hàng phía Bắc của họ sau sự trỗi dậy của Ba Giám sát viên của sông Dương Tử. Đó là Feng Guozhang, Li Chun và Wang Zhanyuan.\n\nTiếp tục được khuyến khích bởi quyền lực của Wang Zhanyuan và cái chết của Feng, Nam Trực Lệ cuối cùng sẽ đi vào riêng của họ dưới Tôn Truyền Phương. Với sự hình thành của Liên minh năm tỉnh, Nam Trực Lệ củng cố sự thống trị của họ trong bờ biển phía đông của Trung Quốc. Tuy nhiên về mặt ý thức hệ Nam Trực Lệ là xa mạch lạc, với nhiều thành viên tất cả tán thành giáo lý riêng của họ.\n\nVới Tôn Truyền Phương thúc đẩy ý thức về chủ nghĩa cộng hòa chuyên chế giác ngộ, Tề Tuyết Viễn ngược lại thúc đẩy một chính sách cai trị nhượng bộ độc đoán, với Trần Nghị đặt mình vào một vị trí đặc biệt với tư cách là thành viên Nam Trực, duy trì mối quan hệ sâu rộng với cả Nhật Bản và có cảm tình với lý tưởng của Đồng Minh Hồi cũ. §!"
 china_faction_tenets_manchu_qing_desc: "§L Nhiều ghê tởm bởi người dân Trung Quốc, chế độ quân chủ đã không thực sự chết vào năm 1911. Với ngọn lửa của chế độ quân chủ liên tục được vô địch bởi Khang Hữu Vi, Lương Khải Siêu, Hoàng gia và các nhóm quân chủ khác. Được khôi phục để nổi bật trong một cử chỉ sai lầm của Hội Trực Lệ, các nhóm quân chủ trong Hội đồng chưa bao giờ thực sự hài lòng với vị trí thứ hai của họ đối với Đảng Cộng hòa.\n\nSau một thời kỳ suy yếu Trực Lệ, \" Mãn Thanh Coup \" đã được đưa ra, nắm quyền kiểm soát của Chính phủ Trung ương và đặt nó trong tay của Hoàng đế Xuantong. Cai trị thông qua Thiên mệnh, và với các nhà cải cách và trí thức khác nhau ở bên cạnh họ, những người phục hồi vô địch một chế độ quân chủ cải cách, một tiến bộ trở đi từ những thất bại dẫn đến Cách mạng Tân Hải. §!"
 china_faction_tenets_fengtian_desc: "§L Chính phủ An Quốc quân, chính thức là Chính phủ Quân đội Thái Bình Dương Quốc gia, là dấu tích cuối cùng được cho là của Cộng hòa Bắc Dương ban đầu. Hoặc ít nhất, một tuyên bố như vậy được tuyên bố bởi Đại nguyên soái Trương Tác Lâm, con số cầm quyền của nó. Tuy nhiên, bên dưới bề mặt, An Quốc quân chỉ là một nguồn hợp pháp khác mà Trương Tác Lâm bám vào bất kỳ yêu sách nào về tính chính danh quốc gia.\n\nNhóm lại với nhau nhiều phe phái của Phượng Đàm, chẳng hạn như Phượng Đàm của Trương Tuyên Lương, Phượng Đàm của Dương Ngọc Đình và Phượng Đàm, An Quốc quân cũng kết hợp những phe phái khác nhau từ thời ở Bắc Kinh. Mang theo nó di sản của 1928, các thành viên thể thao Hội Thẩm Dương từ Phượng Đàm cũ; không quá khác biệt với thành viên của câu lạc bộ Jiwei, Phượng Đàm Truyền thông Cũ và Mới, Hiệp hội Concordia Pro-Nhật Bản, và cuối cùng là bất kỳ quan chức Bắc Dương nào bị đuổi khỏi Hội đồng Bắc Kinh hoặc Trực Lệ. Rối loạn tốt nhất, đó là một tình huống được tổ chức cùng nhau bởi lực lượng tuyệt đối của Nguyên soái cũ một mình. §!"
 china_faction_tenets_federalists_desc: "§L Do một di sản tương tự như các phong trào cách mạng của cuộc cách mạng Tân Hải, phong trào Liên bang có thể tìm thấy tổ tiên thực sự của nó trong các hình thức của Đồng Minh hội. Tiếp tục nâng cao bởi những suy nghĩ trí tuệ của huyền thoại Zhang Taiyan, Lương Khải Siêu, Song Jiaoren, và nhiều người khác, \" Phong trào Hiến pháp tỉnh \" sẽ thấy những bước tiến nhanh chóng ở các tỉnh trên toàn quốc. Với Chiết Giang, Hồ Nam, Quảng Đông, Tứ Xuyên và Vân Nam là thành công nhất.\n\nSau những phát triển của thời đại Warlord, phong trào liên bang sẽ trở thành một sự phát triển tự nhiên khi quyền lực chuyển từ Chính phủ Trung ương sang cấp tỉnh, và tình trạng của tỉnh đã tăng lên. Nhìn thấy việc thực hiện đầu tiên ở Hồ Nam dưới thời Zhao Hengti, và ở Chiết Giang dưới Phong trào Tự trị Chiết Giang, chủ nghĩa liên bang sẽ được áp dụng và xem xét trên toàn quốc.\n\nChia rẽ ý thức hệ, phong trào Liên bang mang theo nó nhóm tán thành \" dưới lên \" Chủ nghĩa liên bang, chẳng hạn như Li Jiannong và Zhao Hengti. \" Top Xuống \" Chủ nghĩa liên bang được tán thành bởi Đường Kế Nghiêu, và hệ thống liên bang tốt được thúc đẩy bởi Trần Quýnh Minh. Được coi là một phong trào cách mạng thay thế cho Quốc dân đảng, những người theo chủ nghĩa liên bang đã thấy rất ít thành công ở miền Bắc trung ương truyền thống của đất nước, với những người đề xuất lớn nhất của họ là các đảng nhỏ ở Bắc Kinh. §!"
 china_faction_tenets_left_kuomintang_desc: "§L Quốc dân đảng tìm thấy nguồn gốc của nó trong xã hội bí mật cách mạng thời nhà Thanh, Đồng Minh hội. Người sáng lập Tôn Trung Sơn hy vọng sẽ trục xuất nhà Thanh Mãn Châu và thành lập một nước Cộng hòa Trung Quốc mới xảy ra dưới Cách mạng Tân Hải. Ghê tởm với các quân phiệt Bắc Dương, Sun đã thành lập một chính phủ đối thủ ở Quảng Châu hợp tác với các đảng Cộng hòa miền Nam khác, chẳng hạn như Liên bang của Trần Quýnh Minh. Sau khi Sun và Chen có một sự sụp đổ, trước đây đã tiếp xúc với Internationale, người đã gửi cho anh ta sự hỗ trợ thông qua các cố vấn lưu vong Nga.\n\nNhững người Bolshevik đã giúp Mặt trời cách mạng hóa Quốc dân đảng trong cuộc tái tổ chức năm 1924, trong đó Đảng áp dụng các nguyên tắc của Trung ương Dân chủ với mục tiêu thống nhất Trung Quốc dưới một nhà nước độc đảng, trong thời gian đó Đảng sẽ ban hành giám hộ chính trị để chuẩn bị cho Trung Quốc dân chủ và thúc đẩy Ba nguyên tắc Dân sinh, Dân tộc và Dân quyền của Mặt trời.Sau cái chết của Sun, Quốc dân đảng sẽ bị bao vây bởi chủ nghĩa bè phái giữa những người cánh tả ủng hộ liên minh với Liên đoàn Công đoàn chủ nghĩa Trung Quốc và những người cánh hữu phản đối nó.\n\nSau khi cuộc viễn chinh phương Bắc sụp đổ và Tưởng Giới Thạch bị giết, Ủy ban Trung ương đã trốn sang Paris với tàn dư duy trì một cuộc nổi dậy ở khu vực MinGan. Quốc dân đảng cánh tả tìm cách hoàn thành Thống nhất Trung Quốc và lãnh đạo Cách mạng Xã hội chủ nghĩa ở châu Á. Không thể nghi ngờ rằng chủ nghĩa xã hội là kết luận tự nhiên của Ba nguyên tắc! §!"
 china_faction_tenets_right_kuomintang_desc: "§L Quốc dân đảng tìm thấy nguồn gốc của nó trong xã hội bí mật cách mạng thời nhà Thanh, Đồng Minh hội. Người sáng lập Tôn Trung Sơn hy vọng sẽ trục xuất nhà Thanh Mãn Châu và thành lập một nước Cộng hòa Trung Quốc mới xảy ra dưới Cách mạng Tân Hải. Ghê tởm với các quân phiệt Bắc Dương, Sun đã thành lập một chính phủ đối thủ ở Quảng Châu hợp tác với các đảng Cộng hòa miền Nam khác, chẳng hạn như Liên bang của Trần Quýnh Minh. Sau khi Sun và Chen có một sự sụp đổ, trước đây đã tiếp xúc với Internationale, người đã gửi cho anh ta sự hỗ trợ thông qua các cố vấn lưu vong Nga.\n\nNhững người Bolshevik đã giúp Mặt trời cách mạng hóa Quốc dân đảng trong cuộc tái tổ chức năm 1924, trong đó Đảng áp dụng các nguyên tắc của Trung ương Dân chủ với mục tiêu thống nhất Trung Quốc dưới một nhà nước độc đảng, trong thời gian đó Đảng sẽ ban hành giám hộ chính trị để chuẩn bị cho Trung Quốc dân chủ và thúc đẩy Ba nguyên tắc Dân sinh, Dân tộc và Dân quyền của Mặt trời.Sau cái chết của Sun, Quốc dân đảng sẽ bị bao vây bởi chủ nghĩa bè phái giữa những người cánh tả ủng hộ liên minh với Liên đoàn Công đoàn chủ nghĩa Trung Quốc và những người cánh hữu phản đối nó.\n\nNhững người cánh hữu rút lui về Quý Châu sau thất bại của Cuộc viễn chinh phương Bắc khi những kẻ hèn nhát cánh tả của Ủy ban Trung ương chạy trốn đến Paris. Quốc dân đảng cánh hữu hy vọng hoàn thành giấc mơ của Mặt trời bằng cách hoàn thành Cách mạng Quốc gia, mà không có tai họa của chủ nghĩa xã hội lây nhiễm Ba nguyên tắc. Trung Quốc mới sẽ không được xây dựng dựa trên những diễn giải vật chất kinh tởm về học thuyết Sanmin! §!"
 china_faction_tenets_national_protection_alliance_desc: "§L Thực sự là một nhóm kỳ lạ và đặc biệt của các quân phiệt, những kẻ cơ hội và các cá nhân bất lương khác, Liên minh Hộ quốc \" \" bề ngoài tuyên bố di sản của nó đối với Thái Ngạc, Li Liejun và Đường Kế Nghiêu \" Quân đội Bảo vệ Quốc gia \" , hoặc Huguojun. Trong khi người trùng tên của họ tán thành lý tưởng cao quý của chiến đấu một cuộc chiến tranh cuối cùng, tổng thể, cứu rỗi quốc gia để từ chối một kẻ điên chuyên chế tham vọng độc đoán của mình, Liên minh Hộ quốc của thời đại hiện nay không thể khác hơn nữa.\n\nThay vào đó ban hành và củng cố những kẻ chuyên quyền cấp tỉnh và sự kiểm soát của họ đối với các tỉnh của họ, Liên minh Hộ quốc là một nhóm rối loạn chức năng gồm các nhân vật khác nhau thống nhất trong việc bảo tồn lợi ích cá nhân duy nhất của họ. Nhiều nhà quan sát, và kiên quyết nhất là đối thủ của họ, cho rằng phe quân phiệt chắc chắn sẽ không kéo dài, và chỉ phục vụ để tiếp tục Kỷ nguyên Quân phiệt. §!"
 china_faction_tenets_geacps_desc: "§L Có lẽ đã chỉ trích là số phận tồi tệ nhất khi người Trung Quốc ngã xuống, người Nhật dường như đã chìm cái miệng chảy nước dãi của họ vào xác chết mục nát của Trung Quốc, và cùng với nó, họ đã để lại một vỏ xương của nó ở vị trí của nó. Được tổ chức bởi Quân đội Kwantung Nhật Bản và các đồng minh hợp tác địa phương của họ, Đế quốc Nhật Bản cuối cùng đã mở rộng ảnh hưởng của mình vượt xa các trò chơi của Nguyên soái cũ.\n\nKhông có ý thức hệ chặt chẽ được chia sẻ bởi những người đương thời của họ, thái độ ủng hộ Nhật Bản, các nhân vật hàng đầu của chính phủ này bị coi là cộng tác viên, \" Hán gian \" , và hoàn toàn bị người dân bản địa ghét bỏ. Gây ra đau khổ quá mức và chấn thương quốc gia to lớn, nó không có ý nghĩa gì đối với Tokyo khi các doanh nghiệp Nhật Bản tiếp tục kiếm lợi nhuận, và sự tham lam ích kỷ của các cộng tác viên đã bão hòa. §!"
 china_faction_tenets_independent_desc: "§L Trong sự hỗn loạn của thời đại quân phiệt, nhiều thống đốc hoạt động với quyền tự chủ hoàn toàn từ các chính phủ ở Bắc Kinh hoặc Quảng Châu. Các quân phiệt không liên kết như vậy rất linh hoạt trong triển vọng của họ và sẽ cố gắng duy trì quyền tự chủ của họ trong bối cảnh chính trị luôn thay đổi ... §!"

