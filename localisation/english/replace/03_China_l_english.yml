 CHN_begin_civil_war_preparation_tt: "§Y Chúng ta sẽ bắt đầu chuẩn bị để thách thức Chính phủ Trung ương. Nếu chúng ta kết thúc chiến tranh với chủ nhân của mình (trong cuộc khủng hoảng sau thống nhất hoặc do nỗ lực không thành công để tích hợp chúng ta), chúng ta sẽ nhận được phần thưởng tấn công chống lại họ. Chúng ta càng chuẩn bị, phần thưởng tấn công ban đầu của chúng ta sẽ kéo dài lâu hơn! §!"
 CHN_begin_civil_war_preparation_warning_tt: "§R Các nhà chức trách [FROM.GetNameDefCap] đang tự định vị để thách thức quy tắc của chúng ta. Chúng ta phải sẵn sàng đối đầu với họ. (Họ càng chuẩn bị nhiều, phần thưởng tấn công ban đầu của họ sẽ càng kéo dài!) §!"
 CHN_add_to_civil_war_preparation_tt: "§G Chúng ta sẽ mở rộng chuẩn bị để thách thức Chính phủ Trung ương. (Chúng ta càng chuẩn bị nhiều, phần thưởng tấn công ban đầu của chúng ta sẽ kéo dài lâu hơn!) §!"
 CHN_limited_civil_war_challenge_tt: "§R Hoàn cảnh của kịch bản mà chúng ta phải đối mặt có nghĩa là chúng ta sẽ không thể thách thức Chính phủ Trung ương mà không báo trước cho người dân, trừ khi có bất kỳ sự phẫn nộ nào do chính phủ trung ương tạo ra. §!"
 CHN_fuel_to_civil_war_warning_tt: "§R Hành động mạo hiểm này từ phía chúng ta có thể tạo ra vụ bê bối và gây ra cho các diễn viên trong khu vực thách thức quyền lực của chúng ta! §!"
 CHN_fuel_to_the_civil_war_tt: "§G Hành động đáng ghê tởm này của Chính phủ Trung ương đã tạo ra vụ bê bối đáng kể. Bây giờ chúng ta có lý do để thách thức quyền lực của họ! §!"
 CHN_done_our_patriotic_duty_tt: "§c Chúng ta đã hoàn thành nhiệm vụ yêu nước của mình. §!"

 CHN_will_pressure_overlord_to_act_tt: "§R Chúng ta sẽ khuyến khích [ROOT.overlord.GetNameDef] bắt đầu hành động quyết định để đảm bảo thống nhất. Họ sẽ có nhiều khả năng kết thúc chiến tranh trong tương lai gần - chúng ta phải sẵn sàng hỗ trợ họ! §!"
 CHN_pressure_to_act_tt: "§R Áp lực để theo đuổi sự thống nhất sẽ chỉ phát triển về sức mạnh! §!"

