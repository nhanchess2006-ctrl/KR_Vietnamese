### Dynamic Modifiers ###
 china_dense_rural_infrastructure: "Khu vực nông thôn đông dân"
 china_dense_rural_infrastructure_desc: "Mạng lưới cơ sở hạ tầng trong khu vực này đã được bão hòa cao bởi dân số địa phương dày đặc.\n\nSẽ được gỡ bỏ bằng cách đạt tối đa §Y $infrastructure$ §! trong trạng thái này."

 CHN_autonomous_region_modifier: "Khu tự trị"
 CHN_autonomous_region_modifier_desc: "Sự kiểm soát của nhà Thanh đối với các vùng biên giới của nó là một vấn đề phức tạp, với mức độ kiểm soát giảm dần và chảy. Các lãnh thổ ở phía bắc và phía tây, được gọi là \" Feudatory Regions \" bởi Trung Quốc và \" Trung Quốc Tartary \" bởi các nhà quan sát phương Tây, bao gồm một sự chắp vá của các bộ lạc, gia tộc và đồn trú quân sự biên giới thề trung thành với Hoàng đế. Khi chủ nghĩa dân tộc Trung Quốc phát triển và Cách mạng Tân Hải đang diễn ra, câu hỏi về cách đối xử với các dân tộc thiểu số là một câu hỏi phổ biến đối với bản sắc Trung Quốc sau cách mạng, phức tạp hơn nữa bởi những nỗ lực từ các nhóm ly khai để tạo ra các quốc gia ly khai ở Tây Tạng, Mông Cổ và Tân Cương. Với một chính phủ Trung Quốc đã thiết lập quyền kiểm soát khu vực này, các cường quốc đã quyết định cách tốt nhất để bảo vệ quyền lợi của người dân địa phương và đảm bảo lòng trung thành của họ là tạo ra một khu tự trị tự trị."

### Decisions ###

 CHN_found_our_faction_decision: "Khẳng định vị thế trên thế giới"
 CHN_found_our_faction_decision_desc: "Với chiến thắng của chúng ta trước Nhật Bản, bây giờ là lúc Trung Quốc chiếm lấy vị trí xứng đáng của mình ở Đông Á và thế giới, sử dụng các nguồn lực và dân tộc hùng mạnh của mình để thúc đẩy thiện chí và hợp tác quốc tế. Với việc hoàn thành các chiến dịch thống nhất quốc gia của chúng ta, chỉ có logic là bước tiếp theo nên là khẳng định lại ảnh hưởng của chúng ta để Trung Quốc sẽ không bao giờ trở thành nạn nhân của chủ nghĩa đế quốc."

 china_join_the_internationale_decision: "Gia nhập Quốc tế"
 china_join_the_internationale_decision_desc: "Khi cuộc xâm lược của Đức sụp đổ Cuộc viễn chinh phương Bắc đầu tiên, nhiều người Quốc dân đảng lưu vong đã tìm nơi ẩn náu ở các quốc gia của Quốc tế thứ ba. Bây giờ với sức mạnh của chúng ta được hồi sinh và hồi sinh, điều tự nhiên là chúng ta sẽ có thể đóng vai trò hỗ trợ Quốc tế thứ ba trong việc truyền bá cách mạng thế giới cũng như trả lại cho các đồng chí xã hội chủ nghĩa của chúng ta vì sự giúp đỡ của họ trong những năm qua."
 CHN_join_the_internationale_puppets_warning_tt: "§Y Lưu ý: §! §R Tham gia hoặc hình thành Internationale sẽ ngăn cản bạn có bất kỳ trạng thái con rối phi xã hội (Xã hội chủ nghĩa cấp tiến, Công đoàn chủ nghĩa hoặc Toàn trị). Bất kỳ trạng thái nào hiện có sẽ được thiết lập miễn phí! §!"

 china_create_the_fourth_internationale_decision: "Thành lập Quốc tế thứ Tư"
 china_create_the_fourth_internationale_decision_desc: "Mặc dù Đệ tam Quốc tế đã sụp đổ, chúng ta sẽ không bao giờ từ bỏ giấc mơ về một cuộc cách mạng thế giới. Chúng ta sẽ nhặt ngọn đuốc và tập hợp các công nhân trong một chiến dịch giải phóng toàn cầu mới!"

 china_join_the_reichspakt_decision: "Gia nhập Reichspakt"
 china_join_the_reichspakt_decision_desc: "Đức đã là ân nhân chính của chúng ta kể từ cuộc viễn chinh phương Bắc cam chịu của Quốc dân đảng. Bây giờ chúng ta đã xóa bỏ mọi sự phản đối đối với sự cai trị của chúng ta đối với Trung Quốc, đã đến lúc yêu cầu một liên minh chính thức với bạn bè của chúng ta ở Berlin."

 china_join_the_moscow_accord_decision: "Gia nhập Hiệp ước Moskva"
 china_join_the_moscow_accord_decision_desc: "Sự xuất hiện của Thứ Hai Đen đã kết thúc nhiều năm thống trị của Đức trên toàn thế giới. Với các cường quốc đang trỗi dậy trên toàn thế giới, điều tự nhiên là Trung Quốc nên tìm kiếm đồng minh. Chúng ta có thể tìm thấy những đồng minh như vậy ở các nước láng giềng ở phía bắc, những người Nga mong muốn gạt sang một bên những cuộc cãi vã trong quá khứ của chúng ta cho một thế kỷ mới do các cường quốc Á-Âu lãnh đạo."

 china_join_the_co_pro_decision: "Gia nhập Khối Thịnh vượng chung"
 china_join_the_co_pro_decision_desc: "Người Nhật, bất chấp sự ghẻ lạnh trước đây của chúng ta và các cuộc chiến tranh xảy ra sau đó, vẫn là anh em châu Á của chúng ta. Chúng ta cho phép đế quốc châu Âu chia rẽ chúng ta, ném toàn bộ lục địa châu Á vào tình trạng lộn xộn và khuất phục. Sau khi chứng minh sức mạnh của chúng ta và khôi phục sự thống trị của chúng ta trên đất liền, trong khi họ tiếp tục cai trị các vùng biển, cuối cùng chúng ta có thể đàm phán để làm việc với họ như là đối tác bình đẳng. Là đồng minh, chúng ta sẽ khôi phục sự thịnh vượng cho tất cả châu Á!"

 china_join_the_entente_decision: "Gia nhập Entente"
 china_join_the_entente_decision_desc: "Entente, mặc dù mối quan hệ nói chung kém và không có khả năng sao lưu thái độ đế quốc kiêu ngạo của họ nữa, là đồng minh dự kiến của chúng ta trong cuộc xung đột hiện tại giữa các cường quốc. Nhờ các kết nối tiếng Quảng Đông của chúng ta và số lượng trung gian dồi dào và việc Entente rút khỏi các tuyên bố dân tộc chủ nghĩa quan trọng của Trung Quốc, tăng cường liên minh của chúng ta có thể là ý tưởng thực dụng nhất cho sự thịnh vượng lâu dài."

 china_join_america_decision: "Liên kết với Hoa Kỳ"
 china_join_america_decision_desc: "Bất chấp sự tham gia của người Mỹ trong Thế kỷ khinh miệt, cuối cùng lợi ích chung của chúng ta trong việc kiểm tra ảnh hưởng của Nhật Bản và châu Âu trong khu vực mang chúng ta lại với nhau. Chúng ta hãy làm việc cùng nhau để mang lại hòa bình và thịnh vượng cho châu Á và Thái Bình Dương!"

 china_invite_countries_to_faction: "Mời [FROM.GetNameDef] vào [ROOT.GetFactionName]"
 china_invite_countries_to_faction_desc: "Vị trí hợp pháp của Trung Quốc ở châu Á là người anh cả, cố vấn và lãnh đạo của tất cả các dân tộc lục địa. Đã vứt bỏ xiềng xích của chủ nghĩa đế quốc nước ngoài, chúng ta sẵn sàng tiếp tục vị trí của mình với tư cách là người bảo vệ các quốc gia châu Á khác khỏi sự chuyên chế của châu Âu hoặc Nhật Bản. Chúng ta hãy gửi đại sứ của chúng ta để mang [FROM.GetAdjective] vào nếp gấp của chúng ta."
 china_invite_countries_to_faction_tt: "§Y Tỷ lệ chấp nhận phụ thuộc vào §Y [FROM.GetAdjective] §! ý kiến của chúng ta. §!"

 chinese_unification: "Thống nhất Trung Quốc"
 chinese_unification_desc: "Chính quyền trung ương ở Trung Quốc từ lâu đã bị xói mòn, khi nhiều thập kỷ của chủ nghĩa đế quốc nước ngoài, bất ổn chính trị và tình trạng bất ổn trong nước trong ánh sáng của sự yếu kém của đế quốc sinh ra một lớp mới của quân phiệt khu vực trong những ngày ốm yếu của nhà Thanh.Cách mạng Tân Hợi đã mang lại sự hỗn loạn hơn nữa cho quốc gia, khi các tướng lĩnh cách mạng nắm quyền kiểm soát nhiều tỉnh và bắt đầu xây dựng mạng lưới phức tạp của các sĩ quan quân đội, doanh nhân đồng minh, tầng lớp quý tộc đổ bộ, giới trí thức cảm thông và các quan chức chính phủ.\n\nTuy nhiên, một bản sắc dân tộc chung vẫn còn, và các phong trào khác nhau trên khắp đất nước đã nỗ lực đoàn kết dân tộc và xây dựng lại Trung Quốc theo hình ảnh của họ. Lợi dụng mạng lưới bảo trợ của chính họ, hỗ trợ nước ngoài và quân đội đang phát triển, họ đụng độ để giành ảnh hưởng ở các thành phố và nông thôn. Tuy nhiên, trong thực tế xoắn và biến đổi của quân phiệt Trung Quốc, chiến tranh công khai không phải là cách duy nhất mà cuộc xung đột này phát triển. Những câu chuyện về sự thay đổi liên minh và sự phản bội bẩn thỉu mở ra, tất cả trong khi cuộc xâm lược nước ngoài xuất hiện ...\n\n§C Lãnh đạo của chúng ta hiện là [ChinaGetMemberAlignment] §Y Align §!. §!"

 china_create_united_front: "Thành lập Mặt trận Thống nhất"
 china_create_united_front_desc: "Chúng ta, hậu duệ của Diên và Hoàng, không thể ngồi yên vì đất nước chúng ta bất lực để ngăn chặn ma quỷ ngoại bang tàn phá đất đai của chúng ta. Chúng ta đã bị chia rẽ quá lâu, chia rẽ theo các tuyến tỉnh và phe phái trong khi đế quốc nhìn đói vào biên giới của chúng ta - sẵn sàng khai thác đất nước của chúng ta. Không còn nữa! Chúng ta hãy gạt sang một bên những cuộc cãi vã nhỏ nhặt của chúng ta về sự thống nhất dân tộc để bảo vệ danh dự của chúng ta, danh dự của Trung Hoa, khỏi bị xỉn màu mãi mãi! Qilai!"

 china_northeastern_gambit: "Nước cờ Đông Bắc"
 china_northeastern_gambit_desc: "Sự diều hâu của Nhật Bản cuối cùng đã chạy theo hướng của nó với quyết định liều lĩnh của họ để đi đến chiến tranh với Đức cho quyền bá chủ ở châu Á-Thái Bình Dương. Điều này cung cấp cho chúng ta một cơ hội duy nhất - nếu chúng ta đi đến chiến tranh với Nhật Bản và tấn công chống lại các dự án đế quốc của họ ở Đông Bắc, uy tín của chúng ta sẽ được củng cố và chúng ta sẽ được nâng lên như những anh hùng dân tộc. Phần còn lại của Trung Quốc có thể sẽ bị buộc phải nằm trong hàng như một phần của Mặt trận Thống nhất chống lại sự xâm lược của Nhật Bản, và lôi kéo người Nhật vào cả chiến tranh trên bộ và trên biển cùng một lúc, chúng ta sẽ trải rộng chúng cho đến khi chúng rơi!"

 china_join_united_front: "Gia nhập Mặt trận Thống nhất"
 china_join_united_front_desc: "Khi đế quốc nước ngoài phát động một cuộc xâm lược tàn bạo của đất nước chúng ta, [FROM.GetName] đã mời chúng ta giúp bảo vệ danh dự của Trung Quốc trong giờ phút cần thiết. Trong khi đất nước chúng ta vẫn còn bị chia rẽ nặng nề giữa các tuyến tỉnh và phe phái, nền văn minh của chúng ta có nguy cơ bị phá hủy hoàn toàn. Chúng ta hãy gạt sang một bên sự khác biệt của chúng ta và làm việc cùng nhau để bảo vệ Tổ quốc!"

 china_offer_ceasefire: "Đàm phán ngừng bắn với [FROM.GetNameDef]"
 china_offer_ceasefire_desc: "Trung Quốc đã tự thấy mình đang có chiến tranh với một cường quốc lớn. Tự mình chiến đấu với họ sẽ là một quyết định ngu ngốc trong khi Trung Quốc vẫn còn chia rẽ. Chúng ta nên đàm phán với kẻ thù hiện tại của chúng ta trong [FROM.Capital.GetCapitalVictoryPointName] một thỏa thuận ngừng bắn tạm thời cho đến khi kẻ xâm lược bị đánh bại. Chúng ta không được quên rằng tất cả những gì đế quốc muốn là sự giàu có của chúng ta. Chúng ta không có gì để mất! Vạn tuế!"

 china_reclaim_CUF_leadership: "Giành lại quyền lãnh đạo Mặt trận Thống nhất Trung Quốc"
 china_reclaim_CUF_leadership_desc: "Do hoàn cảnh hỗn loạn ngoài tầm kiểm soát của chúng ta, lãnh đạo trên thực tế của Mặt trận Thống nhất Trung Quốc rơi vào tay [CUF.GetLeader]. Trong khi sự quản lý của họ được đánh giá cao, cuối cùng nó không có ý nghĩa gì đối với một Thống đốc để được chữa lành thay vì Tổng thống. Do đó, chúng ta sẽ tiếp tục kiểm soát liên minh thời chiến ngay lập tức."
 china_reclaim_CUF_leadership_tt: "§Y Code Hạn chế ngăn cản các đối tượng chấp nhận sự đầu hàng của Nhật Bản. Quân phiệt của cựu lãnh đạo CUF sẽ trở thành lãnh đạo CUF mới. §!"

 china_declare_government: "[ROOT.china_declare_government_text]"
 china_declare_government_desc: "[ROOT.china_declare_government_text_desc]"

 china_declare_government_SHX: "Tuyên bố thành lập Chính phủ Trung Nguyên"
 china_declare_government_SHX_desc: "Với vị trí của chúng ta ở đồng bằng Bắc Trung Quốc được bảo đảm, giờ đây chúng ta có thể mạnh dạn tuyên bố cho mình di sản của Cách mạng Tân Hợi. Chính phủ mới của chúng ta bây giờ sẽ phấn đấu để thống nhất quốc gia, đánh bại bất kỳ đối thủ cạnh tranh nào có thể cản đường chúng ta. Không ai, ngoại trừ có lẽ [SHX.GetLeader] trong tất cả sự khôn ngoan của mình, có thể mong đợi tỉnh Sơn Tây tìm thấy chính nó trong quyền lực như vậy. Nhưng thông qua lòng can đảm và sự liên minh của chúng ta trong việc giải phóng Đồng bằng Trung tâm, chúng ta đã chứng tỏ mình xứng đáng lãnh đạo sự thống nhất quốc gia!"

 china_declare_government_SHD_national_populist: "Khôi phục Đại Thanh"
 china_declare_government_SHD_national_populist_desc: "Trận chiến khốc liệt vì Tử Cấm Thành đã bị ép theo lệnh của Trương Thiên Ran. Cổng cung điện trở thành nhà tù cho gia đình Aisin-Gioro hèn nhát. Một số thành viên trong gia đình đã cố gắng rời đi nhưng bị dẫn trở lại, và các bức tường được điều khiển bởi Red Spears ở tất cả các góc. Cuối cùng, Hoàng đế đầu hàng Shangqing. Thay vì chết, Puyi buộc phải đầu hàng Zhang Tianran trong Áo khoác Hoàng gia của mình, cũng như tái khẳng định với người dân chế độ hoàng đế của mình. Puyi sẽ vẫn là Hoàng đế, và các hoàng đế nhỏ, quản lý và linh mục của Shangqing Tianguo là các thẩm phán chính thức của nhà Thanh.\n\nZhang Tianran đã tha thứ cho Hoàng đế bị giam cầm về bất kỳ tội lỗi nào trong cuộc chiến này, và tuyên bố rằng chiến thắng này là đỉnh cao của một phả hệ tâm linh bắt đầu với các võ sĩ quyền Anh và Tôn Trung Sơn."

 china_declare_government_SHD_manchu_restoration: "Khôi phục Đại Thanh"
 china_declare_government_SHD_manchu_restoration_desc: "Nhiều người nghi ngờ khả năng của Qu Yingguang để ngăn chặn cuộc xâm lược của Trực Lệ sau thất bại của cuộc đảo chính Mãn Châu, nhưng bây giờ mọi nghi ngờ đã được xóa. Không chỉ Sơn Đông đã ngăn chặn cuộc tấn công, mà Qu đã hướng dẫn Sơn Đông và hoàng đế trở lại từ bờ vực, và bây giờ chúng ta đứng vững hơn bao giờ hết. Puyi sẽ được phục hồi làm hoàng đế, với anh trai Pujie bên cạnh, và Qu Yingguang sẽ là cố vấn thân cận nhất của họ. Hãy để tất cả những người đứng trên con đường của chúng ta biết rằng người Mãn Châu đã trở lại, và lần này họ ở đây để ở lại."

 china_declare_government_other: "Thành lập Chính phủ Quốc dân"
 china_declare_government_other_desc: "Đã bảo đảm vị trí của chúng ta là lực lượng mạnh nhất ở Trung Quốc, đã đến lúc chúng ta tuyên bố tham vọng thống nhất đất nước và chấm dứt thời đại xung đột khốn khổ này một lần và mãi mãi. Nó có thể thu hút một số sự chú ý không mong muốn, và có khả năng sẽ có xung đột do những người tìm cách thống trị đất đai của họ xúi giục, nhưng đó là sự hy sinh mà chúng ta phải thực hiện để giải phóng quốc gia khỏi chế độ quân phiệt một lần và mãi mãi!"

 china_declare_unification: "Tuyên bố thống nhất Trung Quốc"
 china_declare_unification_desc: "Kẻ thù của chúng ta đã bị đánh bại và bất cứ ai dám tuyên bố một cách bất công về lớp vỏ lãnh đạo quốc gia đã được đưa trở lại vị trí của họ. Bây giờ chúng ta đứng với tư cách là người cai trị của một Trung Quốc hầu như thống nhất, tất cả những gì còn lại để làm là chính thức tuyên bố quyền lãnh đạo quốc gia của chúng ta. Chúng ta là những người chiến thắng của Thời đại Warlord dù tốt hay xấu, và chúng ta phải dẫn dắt Trung Quốc vào tương lai nhân từ của nó."
 china_united: "§YTrung Quốc đã hoàn toàn thống nhất dưới một ngọn cờ.§!"

 china_declare_legitimacy_decision: "Củng cố tính chính danh"
 china_declare_legitimacy_decision_desc: "Sau hậu quả của sự đổi mới hỗn loạn của Kỷ nguyên quân phiệt, dường như dòng kế vị từ Chính phủ Trung ương Trực Lệ đã bị mất trong cuộc xung đột. Đã hoàn thành phần của chúng ta để đoàn tụ đất nước, đã đến lúc chúng ta thực hiện bước tiếp theo trong việc ghép Trung Quốc lại với nhau."

 china_no_rival_governments_left_tt: "Chúng ta đã đánh bại mọi chính phủ đối địch tại Trung Quốc"

 CHN_conquer_beijing_fallback_decision: "[CHN_conquer_beijing_fallback_decision_scripted_loc]"
 CHN_conquer_beijing_fallback_decision_desc: "[CHN_conquer_beijing_fallback_decision_desc_scripted_loc]"

 KMT_conquer_beijing_fallback_decision_key: "Hoàn thành sứ mệnh cách mạng"
 KMT_conquer_beijing_fallback_decision_desc_key: "Chừng nào những kẻ phản động còn tiếp tục thống trị Bắc Kinh, thì sứ mệnh vĩ đại mà người sáng lập quá cố của chúng ta, Tiến sĩ Tôn Trung Sơn đã đặt vào tay chúng ta không thể thành công. Chúng ta phải thắng thế trước những điều bất lợi, để chuẩn bị một cuộc hành quân thứ hai về phía bắc. Điều này không chỉ vì sự cứu rỗi của sự nghiệp cách mạng mà chúng ta còn chiến đấu cho sự sống còn của chủng tộc Trung Quốc! Cách mạng dân tộc muôn năm, nước Cộng hòa Trung Hoa muôn năm!"

 CHN_conquer_beijing_fallback_decision_key: "Giải phóng Bắc Kinh"
 CHN_conquer_beijing_fallback_decision_desc_key: "Bắc Kinh là thủ đô cổ xưa của Trung Quốc và giữ một vị trí độc đáo trong ý thức dân tộc Trung Quốc. Giữ nó có nghĩa là sự công nhận quốc tế và tính chính danh trong nước, làm cho nó nắm bắt được bản chất cao nhất. Vì những nỗ lực ban đầu của chúng ta để chiếm thành phố đã giảm ngắn, chúng ta phải tăng gấp đôi nỗ lực của mình. Trở đi, đến một Trung Quốc mới!"

 CHN_demand_control_of_beijing: "Yêu cầu trao quyền kiểm soát Bắc Kinh"
 CHN_demand_control_of_beijing_desc: "Sự kết thúc của cuộc viễn chinh phương Bắc đã đưa Bắc Kinh dưới thời Quốc dân đảng, tuy nhiên trên thực tế khu vực vẫn nằm dưới sự cai trị của quân phiệt. Trong khi loại tự trị địa phương này đã được chứng minh là một điều ác cần thiết khi chúng ta tiến hành thống nhất, để cho phép số phận này xảy ra với ghế quyền lực cổ xưa của Trung Quốc là hoàn toàn không thể chấp nhận được. Chừng nào Bắc Kinh vẫn nằm ngoài sự kiểm soát trực tiếp của chính quyền trung ương, sẽ luôn có những kẻ âm mưu phá hoại và chiếm đoạt quyền lực của chúng ta. Chúng ta phải thực hiện các động thái để mang lại sự cai trị quốc gia cho miền Bắc, đưa cuộc cách mạng tiến gần hơn đến hoàn thành."

 CHN_march_to_manchuria: "Tiến quân vào Mãn Châu"
 CHN_march_to_manchuria_desc: "Đã quá lâu rồi Mãn Châu bị tàn phá bởi những kẻ phản bội quốc gia Trung Quốc và đế quốc Nhật Bản, những người tìm cách khai thác đất nước chúng ta vì tài nguyên thiên nhiên của mình. Trong khi đó là biên giới phía đông của lãnh thổ của chúng ta bên ngoài Trung Quốc, câu hỏi Mãn Châun là không thể phủ nhận khi [ROOT.GetNameDef] xác định các tỉnh Đông Bắc là các tỉnh không thể tách rời của nhà nước Trung Quốc. Trong khi chúng ta đứng đằng sau sự an toàn của đèo Shanhai, chúng ta hãy tự mình giải phóng đồng bào của chúng ta một lần và thống nhất đất nước một lần và mãi mãi."

 CHN_war_for_guangzhou: "Cuộc chiến giành Quảng Châu"
 CHN_war_for_guangzhou_desc: "Ý định trở thành điểm tập hợp cho miền Nam thậm chí có cơ hội thống nhất đất nước, Đồng bằng sông Châu Giang là nơi có cơ hội chính và hỗ trợ tài chính. Với thành phố đã chuyển quyền sở hữu nhiều lần kể từ khi Quốc dân đảng sụp đổ, tuy nhiên nó vẫn cung cấp tất cả các nguồn lực cần thiết để khởi động một cuộc thám hiểm phương Bắc của riêng chúng ta. Với tính toàn vẹn của nó đối với tuyên bố tương lai của chúng ta về thống nhất quốc gia, [ROOT.GetLeader] và các đồng minh của họ đã chọn con đường chiến tranh, và với chủ sở hữu của Quảng Châu hiếu chiến, đã đến lúc Tây Nam phải vũ trang một lần nữa."

 CHN_nanjing_expedition: "Cuộc viễn chinh Nam Kinh"
 CHN_nanjing_expedition_desc: "Nam Kinh là thủ đô phía Nam của một số triều đại Trung Quốc và cũng là nơi Tôn Trung Sơn được tuyên bố là Tổng thống lâm thời của Cộng hòa vào năm 1911. Kiểm soát khu vực Giang Nam giàu có và mạnh mẽ ở cửa sông Dương Tử, đây có lẽ là thành phố quan trọng nhất trên bờ biển phía đông của Trung Quốc và chỉ đứng sau Bắc Kinh về tầm quan trọng quốc gia. Dài chỗ ngồi của lãnh thổ Liên minh Nguyên soái Tôn Truyền Phương, mặc dù chính trị của khu vực có thể đã thay đổi tầm quan trọng của nó đối với lợi ích của chúng ta đã không."

 CHN_storming_of_wuhan: "Công phá Vũ Hán"
 CHN_storming_of_wuhan_desc: "Vũ Hán là địa điểm khởi nghĩa Vũ Xương năm 1911, châm ngòi cho Cách mạng Tân Hợi. Ba thành phố cấu thành của nó là Vũ Xương, Hán Khẩu và Hán Dương nằm dọc theo các con sông lớn ở trung tâm Trung Quốc. Thủ đô Hồ Bắc và căn cứ hoạt động của Nguyên soái Ngọc Trạch Ngô Bội Phu, nắm bắt nó là điều cần thiết cho cả tính chính danh quốc gia và kiểm soát chiến lược đối với nội địa Trung Quốc."

 CHN_satellite_generic_challenge_overlord_decision: "Thách thức Cơ quan của [ROOT.Overlord.GetLeader]"
 CHN_satellite_generic_challenge_overlord_decision_desc: "[CHN_satellite_generic_challenge_overlord_decision_desc_scripted_loc]"
 CHN_satellite_generic_challenge_overlord_decision_desc_zhili: "Nhóm Trực Lệ đã đi đầu trong chính trị Trung Quốc trong hơn một thập kỷ nay, những người vô địch về trật tự và ổn định ở trung tâm của đất nước. Nhưng ở trên cùng, tham nhũng và do dự trị vì. Mặc dù thông thường sẽ không phù hợp khi một cấp dưới nhảy qua cấp trên của mình, nhưng đây không phải là thời điểm bình thường."
 CHN_satellite_generic_challenge_overlord_decision_desc_manchu: "Sự phục hồi đế quốc là điều cần thiết để giữ gìn sự toàn vẹn của dân tộc, bảo vệ trật tự và truyền thống. Nhưng những con rắn xảo quyệt lấp đầy tai Hoàng đế bằng những lời vặn vẹo, độc ác. Cần phải làm gì đó để khôi phục Hoàng đế trở nên nhân từ!"
 CHN_satellite_generic_challenge_overlord_decision_desc_fengtian: "Niềm hy vọng cuối cùng của Cộng hòa Bắc Dương nằm trong bè phái Phong Tộc sau khi Trực Lệ phản bội khôi phục Hoàng đế vào năm 1928. Lãnh đạo của chúng ta đã làm hết sức mình, tất nhiên, nhưng nỗ lực tốt nhất của họ là không đủ nếu chúng ta bảo vệ đất nước của chúng ta. Một sự thay đổi là có trật tự."
 CHN_satellite_generic_challenge_overlord_decision_desc_federalists: "Những người tìm cách bảo vệ hiến pháp và cứu nền dân chủ Trung Quốc là một ban nhạc cao quý, nhưng luôn gặp nguy hiểm từ những người tham nhũng bên trong. Sự lãnh đạo hiện tại của phong trào Liên bang này chỉ đơn giản là quá thiếu sót và quá ràng buộc với sự trùng lặp để được tin tưởng với ánh sáng của nền dân chủ Trung Quốc, và do đó chúng ta phải bắt đầu chuẩn bị để giải cứu nó."
 CHN_satellite_generic_challenge_overlord_decision_desc_chinese_republican: "Cách mạng Tân Hợi đã thu hút nhiều người mơ mộng, nhưng hết lần này đến lần khác chúng ta thấy rằng những giấc mơ không còn là hiện thực. Sự lãnh đạo hiện tại của chính quyền trung ương đã chứng tỏ mình không xứng đáng với nó, vì vậy chúng ta phải bắt đầu chuẩn bị để tự mình lấy nó."
 CHN_satellite_generic_challenge_overlord_decision_desc_fallback: "Chính phủ đến, và chính phủ đi. Các nhà lãnh đạo tăng và các nhà lãnh đạo giảm. Nhưng Trung Quốc chịu đựng, và người dân Trung Quốc tiếp tục tìm kiếm một hành pháp có thể cứu họ khỏi hoàn cảnh của họ. Nó đã trở nên ngày càng rõ ràng rằng vị quân phiệt mới nhất nhảy lên để đảm nhận ghế của Tướng là không xứng đáng với vị trí của mình. Có lẽ đến lượt chúng ta lãnh đạo?"

 china_move_capital: "Ấn định thủ đô chính thức"
 china_move_capital_desc: "Đã có nhiều thủ đô của một nhà nước Trung Quốc thống nhất và với các bộ phận quan trọng của Trung Quốc dưới sự cai trị của chúng ta, chúng ta có thể tuyên bố thủ đô vĩnh viễn cho nước cộng hòa. Có bốn lựa chọn chính để đi cùng nếu chúng ta kiểm soát thành phố đó: Nam Kinh, Bắc Kinh, Vũ Hán hoặc Quảng Châu. Mỗi người mang lại lợi thế độc đáo. Chúng ta phải xem xét điều này một cách cẩn thận vì quyết định này sẽ không thể đảo ngược."

 china_provisional_capital: "Di dời thủ đô lâm thời"
 china_provisional_capital_desc: "Khi chúng ta tiếp tục chiến dịch đoàn kết Trung Quốc, những vùng rộng lớn của đất nước đã nằm dưới sự kiểm soát của chúng ta. Khi quân đội của chúng ta tiến sâu hơn vào lãnh thổ kẻ thù, căng thẳng hậu cần đã tăng lên. Có thể là khôn ngoan để giảm bớt gánh nặng này và báo hiệu ý định đoàn kết quốc gia của chúng ta bằng cách di chuyển thủ đô của chúng ta đến một vị trí trung tâm hoặc chính trị có giá trị hơn."

 china_attack_decision: "Tấn công [FROM.GetNameDef]"
 china_attack_decision_desc: "Sự thách thức liên tục của lãnh đạo [FROM.GetAdjective] là một trong đó không thể được giải quyết bằng các phương tiện hòa bình. [FROM.GetLeader] đã chứng minh [FROM.GetHerselfHimself] một nhà lãnh đạo không xứng đáng, và sẽ bị đẩy ra khỏi [FROM.Capital.GetCapitalVictoryPointName] bằng vũ lực."
 china_demand_submission: "Nhu cầu gửi [FROM.GetNameDef]"
 china_demand_submission_desc: "Chính quyền khu vực ở [FROM.Capital.GetCapitalVictoryPointName] gần đây thấy mình trôi dạt, thề trung thành với không ai ngoài chính họ. Là chính phủ thực sự hợp pháp của Trung Quốc, chúng ta phải đưa họ vào nếp gấp - họ sẽ chấp nhận hoặc chúng ta sẽ chuẩn bị các biện pháp khác, ít lịch sự hơn."
 china_integrate_subjects: "Tăng Tích hợp [FROM.GetNameDef]"
 china_integrate_subjects_desc: "Mặc dù sự lãnh đạo trong [FROM.Capital.GetCapitalVictoryPointName] đã may mắn nhìn thấy sự khôn ngoan và quyết định liên kết với chúng ta, chúng ta phải đi xa hơn nếu chúng ta thực sự chấm dứt thời đại quân phiệt. Những nỗ lực sẽ được thực hiện để đưa chính quyền [FROM.GetAdjective] đến gần hơn với chính chúng ta."

 china_joint_strike_GXC_decision: "Phối hợp một cuộc tấn công chung với [FROM.GetNameDef]"
 china_joint_strike_GXC_decision_desc: "Cơ hội của chúng ta chống lại [GXC.GetNameDef] rất mỏng, tuy nhiên [FROM.GetNameDef] có thể tuân thủ để chống lại sự chuyên chế [GXC.GetAdjective]. Tuy nhiên, chúng ta nên hành động nhanh chóng - chúng ta phải có yếu tố bất ngờ nếu một cuộc tấn công chung như vậy có hiệu quả. Nếu kế hoạch này hoạt động, chúng ta sẽ tiến hành ngay lập tức chống lại kẻ thù [GXC.GetAdjective] của chúng ta."
 china_joint_strike_GXC_attack_mission: "[YUN.GetNonIdeologyName] - Tấn công chung [HNN.GetNonIdeologyName] chống lại [GXC.GetNameDef]"
 china_joint_strike_tooltip: "Chúng ta chỉ có thể phối hợp tấn công với một phe"
 HNN_GXC_chicken_exit: "§R Chúng ta sẽ từ bỏ [YUN.GetNameDef] để tự mình đối mặt với [GXC.GetNameDef] §!"
 YUN_GXC_chicken_exit: "§R Chúng ta sẽ từ bỏ [HNN.GetNameDef] để tự mình đối mặt với [GXC.GetNameDef] §!"

 northwest_conflict_surrender: "Đầu hàng kẻ địch"

 himalaya_border_conflict_decision: "Xúi giục xung đột biên giới với [FROM.GetNameDef]"
 himalaya_border_conflict_decision_desc: "Chính phủ [FROM.GetAdjective] đã từ chối yêu sách hợp pháp của chúng ta ở biên giới tranh chấp của chúng ta ở dãy Himalaya. Bây giờ ngoại giao đã thất bại, điều bắt buộc là chúng ta phải tìm ra các giải pháp khác. Hiện tại, chúng ta sẽ bắt đầu bằng cách gửi các đội nhỏ để củng cố các điểm nghẹt thở chiến lược quan trọng trong khu vực. Nếu chúng ta may mắn, họ sẽ buộc phải lùi lại một khi họ thấy sức mạnh vượt trội của chúng ta. Tuy nhiên, một số người tự hỏi liệu đây có thể là cái cớ cho một cuộc xung đột rộng lớn hơn ..."

 china_integration_timer: "[THIS.overlord.GetNameDefCap] Tăng Tích hợp"

 china_break_free: "Thách thức Cơ quan của [ROOT.Overlord.GetLeader]"
 china_break_free_desc: "[china_subject_challenge_overlord_decision_desc_loc]"
 china_break_free_desc_lkmt: "Các âm mưu chính trị và chicanery của Ủy ban Trung ương Quốc dân đảng [ROOT.Overlord.GetLeader] đã mang lại gì, nhưng hủy hoại cho quốc gia Trung Quốc và người dân của mình. Đó là thời gian cho [ROOT.GetLeader] và các nhà vô địch thực sự của Tiến sĩ Sun để sạc ra, lật đổ những kẻ phản bội, và cưỡi thủy triều cao của Cách mạng Quốc gia. [ROOT.GetNameDefCap] có thể được outmanned, nhưng ý chí của chúng ta được thép và trái tim của chúng ta nói đúng."
 china_break_free_desc_rkmt: "Để nghĩ rằng cuộc cách mạng sẽ trở nên quá xoắn, quá khác biệt, từ các nguyên tắc ban đầu của nó. Cách giải thích thực sự về Nguyên tắc ba người đã bị bóp méo bởi những thế giới nhỏ bé, trí thức không có xương sống và hầu hết tất cả những kẻ chuyên quyền hèn hạ [ROOT.Overlord.GetLeader] . Thật không may, nhưng khi quốc gia đang trên bờ vực sụp đổ, [ROOT.GetLeader] phải tách [ROOT.GetNameDef] ra khỏi con tàu chìm, và tiến lên chiến thắng."
 china_break_free_desc_fed: "Bề ngoài tìm kiếm sự bảo vệ của người dân Trung Quốc, sự phát triển của một nền dân chủ bản địa, và việc ban hành một hiến pháp thực sự, tự do, phong trào Liên bang đã thấy mình bị tham nhũng bởi các nhà độc tài và giới tinh hoa. Trong khi chúng ta không lạ gì với các giao dịch thực dụng, [ROOT.Overlord.GetLeader] đã đưa nó đi quá xa. [ROOT.GetLeader] không thể chỉ đơn giản đứng bên lề như bản chất của phong trào khô héo đi."
 china_break_free_desc_zhili: "Không phù hợp với đỉnh cao nhất, sự lãnh đạo của phe Trực Lệ đã chùn bước quá lâu. Mất đi sự thống nhất của dân tộc và sự kiểm soát của [ROOT.GetNameDef], Thống đốc [ROOT.GetLeader] phải đảm bảo sự ổn định trong tỉnh. Tuy nhiên, một lần nữa, dường như chúng ta phải cứu người dân Trung Quốc. Tuy nhiên, lần này, không chỉ [ROOT.GetNameDef] mà cả quốc gia. Trong khi một cấp dưới không thể nổi dậy chống lại cấp trên của mình, sự suy đồi của chế độ [ROOT.Overlord.GetLeader] đã tồn tại quá lâu."
 china_break_free_desc_fengtian: "Làm sao đất nước lại có thể xuống thấp đến thế? Thoạt đầu bị ảnh hưởng bởi sự vĩ đại của Nguyên soái Tố Lâm, bảo vệ sự nghiệp cộng hòa dưới ánh sáng của cuộc Phục hưng Xuân Thông, hoặc thậm chí bởi mối quan hệ cá nhân của [ROOT.GetLeader] với gia đình Trương. Tuy nhiên, chính quốc gia này đang bị dẫn đến xáo trộn và hủy hoại dưới sự cai trị của những kẻ ăn cắp, những kẻ đơn giản và những kẻ phản bội, với một tên cướp như [ROOT.Overlord.GetLeader] thống trị tất cả. Cuối cùng, [ROOT.GetNameDefCap] phải chơi bàn tay tuyệt vọng của chúng ta, một nỗ lực cuối cùng để lãnh đạo quốc gia. Điều đó có thể ngớ ngẩn, nhưng phong trào của chúng ta không xa lạ gì với việc lột áo khoác."
 china_break_free_desc_manchu: "Trước mắt chúng ta là Con Thiên Đàng, cai trị ngai vàng của mình, thống trị việc khôi phục thực sự quyền lực của mình, nhưng trong trại của chúng ta nằm một cảm giác xấu hổ, bị từ chối, bị e ngại mạnh mẽ. Trung Quốc không phải là một quốc gia hiện đại? Tân Hải để làm gì? Tất cả những đổ máu, hy sinh và nước mắt để lật đổ sự man rợ của người Mãn Châu, chỉ để chúng ta hủy bỏ số phận của mình một lần nữa? Không, Chúa tể \" được cho là Thiên mệnh \" sẽ không còn thống trị người dân Trung Quốc tự do và độc lập!"
 china_break_free_desc_fallback: "Trung Quốc không xa lạ gì với cánh cửa xoay của các nhà điều hành đang tìm cách lèo lái đất nước theo cách của họ. Tuy nhiên, nó đã dẫn đến một quốc gia vô hướng, sụp đổ vào chính nó. Để thực sự cứu người dân khỏi hoàn cảnh của họ, chúng ta phải làm việc để lật đổ [ROOT.Overlord.GetLeader] , anh hề mới nhất đã nắm lấy khái niệm lãnh đạo quốc gia. Quốc gia mới của Trung Quốc sẽ là một quốc gia do [ROOT.GetNameDef] lãnh đạo, không tham nhũng."
 china_half_strength_of_overlord_tt: "Tỷ lệ sức mạnh quân đội ước tính của §Y 50% §! trở lên so với chúa tể của chúng ta"
 china_has_been_365_days_tt: "Đã ít nhất 365 ngày kể từ khi chúng ta thần phục nước tôn chủ."

 CHN_join_NPA_decision: "Tham gia [NPA.GetName]"
 CHN_join_NPA_decision_desc: "Liên minh Hộ quốc là một sự hồi sinh của liên minh quân phiệt cũ đã tìm cách lật đổ nỗ lực chuyên chế của Viên Thế Khải để thiết lập một chế độ quân chủ mới và cứu nền Cộng hòa. Lần lặp lại mới nhất này do [NPA.GetLeader] dẫn đầu có thể tồn tại trong các trường hợp khác nhau, nhưng mục tiêu cuối cùng vẫn là như nhau - bảo vệ đất nước và đồng bào của chúng ta khỏi những kẻ sẽ phá hủy nó!"

 CHN_join_NZH_decision: "Tham gia [NZH.GetName]"
 CHN_join_NZH_decision_desc: "Bắc Trực hệ đã thống trị chính trường Trung Quốc kể từ chiến thắng năm 1927, vượt qua những cơn bão chính trị của Bắc Dương, các nhà cách mạng miền Nam và các đối thủ phía bắc.Mặc dù quyền bá chủ của họ gần đây đã bị thách thức, chiến thắng của họ là không thể tránh khỏi và với việc giữ gìn đạo đức và trật tự chính trị Trung Quốc."

 CHN_join_SZH_decision: "Tham gia [SZH.GetName]"
 CHN_join_SZH_decision_desc: "Nam Trực Hội là một nhánh của nhánh chính ở phía bắc, tập trung xung quanh di sản của Tôn Truyền Phương và Liên minh Tám tỉnh của ông. Nói chung tự hào hợp tác lớn hơn với Đức và các thành phố Legation, khả năng của họ để mang lại sự thịnh vượng yêu nước mang chúng ta đến gần họ hơn."

 CHN_join_MCU_decision: "Tham gia [MCU.GetName]"
 CHN_join_MCU_decision_desc: "Chính phủ phục hưng Mãn Châu đã mang lại sự nhân từ và trật tự cho bối cảnh chính trị Trung Quốc, và với tư cách là những thần dân trung thành, chúng ta sẽ liên kết với chính phủ thích hợp của Trung Quốc."

 CHN_join_AGJ_decision: "Tham gia [AGJ.GetName]"
 CHN_join_AGJ_decision_desc: "Quân đội Thái Bình Dương Quốc gia (An Quốc quân) là một liên minh quân phiệt do Trương Tác Lâm lãnh đạo, tìm cách chống lại các phần tử cấp tiến cách mạng của Quốc dân đảng và thống nhất Trung Quốc dưới ngọn cờ của Phượng đoàn. Mặc dù bị Trực Lệ đánh bại trong cuộc xung đột tiếp theo, họ không bao giờ từ bỏ hy vọng và với vận may của họ đang trỗi dậy, nó được sử dụng để tái gia nhập các đồng chí cũ của chúng ta."

 CHN_join_UPC_decision: "Tham gia [UPC.GetName]"
 CHN_join_UPC_decision_desc: "Phong trào Liên bang là một liên minh của các đảng chủ yếu ở phía nam tìm cách tạo ra một nước cộng hòa Trung Quốc mới được xây dựng theo mô hình liên bang. Sự tham gia của chúng ta vào liên minh này là điều cần thiết nếu chúng ta đoàn tụ Trung Quốc như một liên minh các tỉnh bình đẳng tôn trọng quyền của các quốc gia cấu thành."

 CHN_join_LKT_decision: "Tham gia [LKT.GetName]"
 CHN_join_LKT_decision_desc: "Cánh tả của Trung Quốc đã đoàn kết dưới sự lãnh đạo của [LKT.GetLeader], và tương lai của nó phải nằm trong tay của những người có tầm nhìn để thấy những thay đổi sâu rộng cần thiết để đưa đất nước vào tương lai. Chúng ta sẽ gia nhập hàng ngũ các đồng chí cách mạng của chúng ta và mang lại một kỷ nguyên mới cho đất nước của chúng ta!"

 CHN_join_RKT_decision: "Tham gia [RKT.GetName]"
 CHN_join_RKT_decision_desc: "Đảng Quốc dân Trung Hoa (Quốc dân đảng Trung Quốc) được thành lập bởi Tiến sĩ Tôn Trung Sơn để phục vụ như là đội tiên phong của cuộc cách mạng quốc gia và cứu Trung Quốc khỏi chủ nghĩa đế quốc nước ngoài và tham nhũng trong nước. Nhiệm vụ của chúng ta là gia nhập hàng ngũ Quân đội Cách mạng Quốc gia mới và bảo vệ đất nước chúng ta!"

 CHN_join_RGC_decision: "Tham gia [RGC.GetName]"
 CHN_join_RGC_decision_desc: "Mặt trời đang mọc ở phương Đông và sự cứu rỗi của châu Á khỏi chủ nghĩa đế quốc phương Tây đang trong tầm tay. Chỉ thông qua hợp tác với Khối thịnh vượng chung Đông Á mà chúng ta thực sự có thể cứu Trung Quốc khỏi chủ nghĩa xã hội và chủ nghĩa đế quốc, và do đó chúng ta phải tham gia chính phủ được hỗ trợ của họ."

 CHN_join_FROM_decision: "Tham gia [FROM.GetName]"
 CHN_join_FROM_decision_desc: "[FROM.GetLeader] là một ngôi sao đang lên ở Trung Quốc, tận dụng sự kiểm soát của mình đối với Quân đội [FROM.GetAdjective] hùng mạnh và các đồng minh của ông trong [FROM.GetRulingParty] để trở thành một ứng cử viên quốc gia của riêng mình. Hoạt động ra khỏi cơ sở của mình trong [FROM.Capital.GetCapitalVictoryPointName], thách thức bất ngờ này cho sự thống trị quốc gia cho thấy rất nhiều hứa hẹn, và chúng ta sẽ ràng buộc mình gần gũi hơn với họ."

 china_demand_annexation: "Nhu cầu Phụ lục của [FROM.GetNameDef]"
 china_demand_annexation_desc: "Khu vực [FROM.GetNonIdeologyName] từ lâu đã nằm trong phạm vi ảnh hưởng của Trung Quốc trong hàng trăm năm, nhưng nó đã thoát khỏi chúng ta trong sự hỗn loạn của Cách mạng Tân Hải. Với sự thống nhất của Trung Quốc, chúng ta sẽ đưa [FROM.GetAdjective] trở lại nếp gấp của chúng ta và kết thúc thời kỳ độc lập ngắn ngủi của nó."
 china_offer_alliance: "Cung cấp một liên minh cho [FROM.GetNameDef]"
 china_offer_alliance_desc: "Bị trôi dạt bởi những hoàn cảnh thay đổi ở Trung Quốc, các đồng minh của chúng ta trong [FROM.Capital.GetCapitalVictoryPointName] tuy nhiên đã xoay sở để chiếm ưu thế khi đối mặt với những cơn gió thay đổi của quốc gia. Với sự liên kết của họ đối với chúng ta, chúng ta sẽ bắt đầu đàm phán để hợp lực với nhau và mang lại tầm nhìn chung cho tương lai."
 china_negotiate_with_legation_cities: "Đàm phán với [FROM.GetNameDef]"
 china_negotiate_with_legation_cities_desc: "Các thành phố Legation, khắc ra khỏi bờ biển của Trung Quốc bởi các cường quốc nước ngoài thèm khát, là một tổ chức làm nổi bật sự đối xử bất bình đẳng của quốc gia tự hào của chúng ta bởi đế quốc khác nhau. Sau khi cuối cùng đã mang lại sự thống nhất cho nội thất và kết thúc sự bất ổn cản trở nó, Legations không còn phục vụ một mục đích trên thế giới. Chúng ta sẽ di chuyển để kết thúc chương buồn này trong lịch sử Trung Quốc."
 china_request_return_of_concessions: "Yêu cầu trả lại các nhượng bộ [FROM.GetAdjective]"
 china_request_return_of_concessions_desc: "Những nhượng bộ ban đầu là những mảnh đất nhỏ được cho các cường quốc nước ngoài thuê trong sự yếu đuối của chúng ta, điều này chỉ mở rộng phạm vi khi các cường quốc thực dân tìm cách hạ thấp người dân của chúng ta. Cuối cùng đã thống nhất đất nước, chúng ta có thể mang đến sức mạnh thống nhất của Trung Quốc và chính thức thách thức những kẻ đế quốc tuyệt vọng bám víu vào tài sản bất công của họ."
 china_seize_concessions: "Nắm bắt các nhượng bộ [FROM.GetAdjective]"
 china_seize_concessions_desc: "Với các cuộc đàm phán đã thất bại, không còn lựa chọn nào khác ngoài thanh kiếm nếu chúng ta giải phóng công dân ven biển khỏi sự cai trị của nước ngoài. Lực lượng của chúng ta đã bắt đầu tích lũy dọc theo vùng ngoại ô, sẵn sàng đảm bảo trả lại những thành phố này cho chủ sở hữu hợp pháp của họ."

 CHN_pressure_overlord_to_act_decision: "Ép buộc chính quyền trung ương phải hành động!"
 CHN_pressure_overlord_to_act_decision_desc: "Mặc dù đúng là chúng ta đã tự nộp mình cho biểu ngữ của [ROOT.overlord.GetLeader] và chính quyền trung ương, điều này luôn phụ thuộc vào thực tế là chúng ta tin rằng [ROOT.overlord.GetNameDef] là một người thống nhất đáng tin cậy cho quốc gia tan vỡ của chúng ta. Thực tế là các nhà chức trách [ROOT.overlord.getadjective] đã kéo chân của họ trong việc chấm dứt sự phân chia của Trung Quốc không có gì đáng hổ thẹn, và có lẽ họ cần nhắc nhở rằng lòng trung thành của chúng ta không phải là vô điều kiện."

 CHN_pressure_to_act_mission: "Áp lực để hành động"
 CHN_pressure_to_act_mission_desc: "Câu hỏi Thống nhất đã cản trở các nhà lãnh đạo Trung Quốc kể từ năm 1911, và bị mắc kẹt giữa các yêu cầu liên kết nghịch lý của những người theo chủ nghĩa khu vực và dân tộc, chúng ta đã chịu áp lực phải hành động nhanh chóng để thống nhất đất nước dưới ngọn cờ của chúng ta. Điều này tất nhiên không phải là nhiệm vụ dễ dàng và không may những người bức xúc cho sự thống nhất phải chịu sự giám sát ít hơn đáng kể so với chúng ta vì sự không hành động bị cáo buộc của chúng ta. Tuy nhiên, nếu chúng ta thực sự chứng minh mình là những nhà lãnh đạo hợp pháp của Trung Quốc, thì chúng ta không còn lựa chọn nào khác ngoài chiến đấu và giành chiến thắng!"

 china_expand_autonomous_region: "[CHN_expand_autonomous_region_scripted_loc]"
 china_expand_autonomous_region_desc: "[CHN_expand_autonomous_region_desc_scripted_loc]"

 CHN_expand_mongolian_autonomous_region_scripted_loc_key: "Mở rộng MAR sang [FROM.GetName]"
 CHN_expand_mongolian_autonomous_region_desc_scripted_loc_key: "Khi các lực lượng của chúng ta lần đầu tiên đến Mông Cổ, một quyết định đã được đưa ra để trao quyền tự trị cho các biểu ngữ Mông Cổ địa phương, dẫn đến sự hình thành Khu tự trị Ngoại Mông. Một Khu tự trị Nội Mông cũng nhận được sự xem xét. Gần đây đã có thêm lãnh thổ ở các khu vực có dân số Mông Cổ đáng kể, sẽ hợp lý khi cấp cho các lãnh thổ này sự đối xử tương tự."

 CHN_expand_xinjiang_autonomous_region_scripted_loc_key: "Mở rộng XAR thành [FROM.GetName]"
 CHN_expand_xinjiang_autonomous_region_desc_scripted_loc_key: "Khi lực lượng của chúng ta lần đầu tiên đến Tân Cương, một quyết định đã được đưa ra để trao quyền tự trị tỉnh đa dạng, dẫn đến sự hình thành Khu tự trị Uyghur Tân Cương. Gần đây đã có thêm lãnh thổ ở các khu vực có dân số thiểu số đáng kể, sẽ hợp lý khi cấp cho các lãnh thổ này cách đối xử tương tự."

 CHN_expand_tibetan_autonomous_region_scripted_loc_key: "Mở rộng TAR sang [FROM.GetName]"
 CHN_expand_tibetan_autonomous_region_desc_scripted_loc_key: "Khi các lực lượng của chúng ta lần đầu tiên đến Tây Tạng, một quyết định đã được đưa ra để trao quyền tự trị cho người Tây Tạng địa phương, dẫn đến việc hình thành Khu tự trị Ngoại Tạng. Một Khu tự trị Nội Tạng cũng nhận được sự xem xét. Gần đây đã có thêm lãnh thổ ở các khu vực có dân số Tây Tạng đáng kể, sẽ hợp lý khi cấp cho các lãnh thổ này sự đối xử tương tự."

 china_orchestrate_sinophile_coup: "Dàn nhạc Sinophile Coup trong [FROM.Capital.GetCapitalVictoryPointName]"
 china_orchestrate_sinophile_coup_desc: "Mặc dù chúng ta đã bảo đảm việc nộp [FROM.GetNameDef] để đổi lấy sự độc lập một phần, nhưng việc duy trì sự lãnh đạo hiện tại của họ luôn chỉ là một sự tạm thời. Miễn là họ nắm quyền, việc duy trì quyền bá chủ lâu dài của chúng ta sẽ luôn được đặt câu hỏi. Do đó, với những người bảo trợ tiềm năng của họ bị phân tâm hoặc đồng ý, họ sẽ có rất ít lựa chọn ngoài việc chấp nhận một đội hình quản lý phù hợp hơn."

 #Reusable loc
 #CHI_alignment_integration_category: "Chinese Autonomous Region Integrations"
 #CHI_alignment_integration_category_desc: "Our victory in the North of China has allowed us to centralise our nation into one cohesive government however, some of the provinces of China are ruled by autonomous governors which should be brought more directly under our control..."
 #CHI_dec_integrate_YUN: "The South West of China has long been isolated from politics, it is time they are represented once more."
 #CHI_dec_integrate_SZC: "Sichuan is one of the most populated regions in China so it is our duty to reintegrate the Sichuan Basin back into our full control."
 #CHI_dec_integrate_SHX: "Shanxi had for a long time been known as the neutral clique due to its unwillingness to get involved in other conflicts, with the mountains under our zone of influence we must bring the model province out of neutrality."
 #CHI_dec_integrate_XSM: "The Ma Clique is the key to the north-west and thus it is only natural they should be reincorporated into our government."
 #CHI_dec_integrate_SIK: "The Xinjiang area is the wild frontier of China, when the Qing were in charge they had little interaction with the far west. We will rectify this mistake and prevent another large war from erupting in the province."
 #CHI_dec_integrate_FNG: "The North-east is now pacified and the autonomous government set up there has now outlived its usefulness. We should begin reintegration immediately and secure our frontier against the Russian Far East."
 #QIE_negotiate_with_LEC_desc: "The Legation Cities' leadership has signalled some degree of openness in peaceful integration with our regime. There is certain to be much negotiation involved, but this will make our government's claim to the territory look far more legitimate than an outright invasion would."
 #QIE_attack_entente_LEC_desc: "The Legations have fallen under the sway of Canada and the rest of the hated Entente. This losers club is no match for our new military, and a by mobilising our troops on the outskirts of the Legation boundaries we should be able to scare them into ceding the cities back to us!"
 #QIE_attack_non_aligned_LEC_desc: "The Legations international backers have left them alone. Now is our moment to strike!"
 #QIE_attack_GER_LEC_desc: "With Germany distracted in its war, we have a perfect moment to strike at the Legations. Let us attack while they are distracted, and seize them for ourselves!"
 #QIE_attack_entente_HK_desc: "The [AST.GetName] seize control over Hong Kong during the chaos of the last few years, and have been ruling it directly ever since. This last vestigial remnant of British imperialism must be crushed!"
 #china_seize_concessions_desc: "While we signed over the islands of Macau to Portugal centuries ago, our new power, combined with their current conflicts, makes launching a surprise attack on the territory an inviting prospect. Portugal refused to cede the area to the Legation Cities, and with their current conflict few expect them to put up any more than a token resistance."
 #QIE_negotiate_ger_treaty_ports_desc: "The treaty ports of Qingdao, Wehawei, and Zhanjiang are integral parts of China, though they are currently held by Germany on a 99-year lease. We can offer them some cash to accelerate this timeline, however."
 #QIE_threaten_ger_treaty_ports_desc: "[GEA.GetName] currently holds a several treaty ports on a 99-year lease. Instead of waiting for decades, let's exploit their distraction in their war and mobilise troops on the border! They won't dare fight over a couple of ports, right?"
 #CHI_seize_macau: "Demand Portugal Return Macau"
 #CHI_seize_macau_desc: "Macau has been owned by Portugal since 1557 on a lease basis although the Portuguese certainly took advantage of our weakness during the Century of Humiliation by annexing Taipa and Coloane. We will demand that the Portuguese government return our territory to us...or face the threat of war."
 #CHI_threaten_ger_treaty_ports: "Demand the Germans Withdraw from China"
 #CHI_threaten_ger_treaty_ports_desc: "Too long have we suffered under Germany's humiliation, from the failure of the first Northern Expedition to their restoration of the despicable Qing monarchy. With the Nationalist Party in power, we will demand the Germans fully withdraw from all territorial acquisitions on the Chinese mainland."

