 china_league_collapse_decisions: "Chiến tranh Liên tỉnh"
 china_league_war_gui_text: "Với cái chết của Tôn Truyền Phương, Liên minh §Y của Tám tỉnh §! đã sụp đổ trong một cú đánh ngã. Người chiến thắng trong Chiến tranh Liên minh chắc chắn sẽ đóng một vai trò quan trọng trong việc xác định tương lai của Trung Quốc và để sống sót qua thử thách bằng lửa, người dân của chúng ta đã được hứa hẹn - và mong đợi - một chiến dịch ngắn, quyết định.\n\n£GFX_pol_violence §Y Tinh thần §! là đại diện cho niềm tin của người dân vào chiến thắng của chúng ta và sự sẵn sàng chiến đấu vì chiến thắng đó. Với £GFX_pol_violence §Y Tinh thần §! cao, chúng ta sẽ có khả năng tập hợp mọi người vào sự nghiệp của chúng ta và đảm bảo hỗ trợ nước ngoài. £GFX_pol_violence §Y Tinh thần §! có thể là §G đã đạt được §! thông qua:\n- Chiếm lãnh thổ địch\n- Giữ thành phố Nam Kinh\n\nMặt khác, cuộc chiến càng kéo dài, chúng ta dường như sẽ không thực hiện được lời hứa của mình. Nếu £GFX_pol_violence §Y Tinh thần §! giảm xuống đủ thấp, quân đội của chúng ta sẽ bắt đầu đào tẩu và khả năng chiến đấu của họ sẽ bị tê liệt nghiêm trọng. £GFX_pol_violence §Y Tinh thần §! có thể là §R mất §! bởi:\n- Mất lãnh thổ\n- Tiến triển của thời gian"
