### Party Descs ###
 CHN_radicals_party: "Phe cấp tiến"
 CHN_radicals_party_long: "Những người cấp tiến và cách mạng độc lập\n§L Sự căng thẳng mang tính cách mạng của chủ nghĩa cấp tiến ở Trung Quốc có một lịch sử hấp dẫn bắt nguồn từ cuộc đấu tranh vượt thời gian của các liệt sĩ và anh hùng trong cuộc đấu tranh chống lại những bất công được nhận thức. Huy động sự phẫn nộ của quần chúng, nhiều nhà cách mạng đã đến và đi, một cách hòa bình hoặc thông qua lửa và chiến tranh. Phần lớn kết hợp thành các đảng khác nhau như Quốc dân đảng, hoặc Đảng Trung Quốc trẻ, dòng tư tưởng cách mạng phần lớn là trái ngược với tư tưởng cải cách.\n\nTuy nhiên, sức hấp dẫn của chủ nghĩa cực đoan mở rộng khắp Trung Quốc, từ thảo nguyên của Biên giới Tây Bắc đến những con đường nhộn nhịp của Thượng Hải, nhiều người bám vào lý tưởng của một Trung Quốc biến đổi triệt để, hoặc trong lý tưởng bình đẳng xã hội chủ nghĩa, hoặc trong hương vị dân tộc mạnh mẽ. Hoạt động dưới các yếu tố cực đoan của Quốc dân đảng, Đảng Trung Quốc trẻ hoặc đảng Công đoàn chủ nghĩa Trung Quốc, các nhóm cực đoan từ chối tham gia vào hệ thống Nghị viện Trung Quốc; nhìn thấy Chính phủ Trung ương mới được tuyên bố chỉ là một sự phản bội của cuộc cách mạng xã hội chủ nghĩa. §!\n"

 CHN_KMT_party: "Quốc dân đảng"
 CHN_KMT_party_long: "Quốc dân đảng Trung Quốc (Zhongguo Guomindang)\n§L Đảng Quốc gia Trung Quốc đã có nhiều hình thức trong lịch sử bị hủy hoại của nó. Được thành lập với tư cách là tổ chức nghị viện của Đồng Minh hội vào năm 1912 bởi Tôn Dật Tiên, Hoàng Hưng và Song Jiaoren, Quốc dân đảng sẽ nỗ lực để trung thành phục vụ như một đảng nghị viện trong Cộng hòa Bắc Dương đầu tiên. Tuy nhiên, sau khi Song bị ám sát và nhiều người lưu vong tiếp theo của Sun, Đảng sẽ được tổ chức lại thành Gemingang Trung Quốc, và sau đó hồi sinh thành Quốc dân đảng vào ngày 10 tháng 10 năm 1919. Dành riêng cho Chủ nghĩa Tam Dân như được tán thành bởi Tiến sĩ Tôn Dật Tiên, Quốc dân đảng khao khát thực hiện Nhà nước Đảng, hoặc Đảng quốc, và thực hiện Cách mạng Quốc gia Ba giai đoạn. Thông qua khát vọng về Ba nguyên tắc của Dân tộc, Dân quyền và Dân sinh (Chủ nghĩa dân tộc, Dân chủ và Phúc lợi tương ứng), họ hy vọng sẽ thấy một nước cộng hòa cách mạng mới.\n\nCố gắng thống nhất đất nước trong 1927 với Cuộc viễn chinh phương Bắc, Quốc dân đảng và Quân đội Cách mạng Quốc gia của nó cuối cùng sẽ thất bại trong nỗ lực của mình, và buộc phải chạy trốn vào vùng núi của khu vực nổi dậy MinGan, tỉnh Quý Châu, và vào Paris cùng với Moscow. Rife với đấu đá nội bộ, đảng phần lớn đã bị chia rẽ trên vách đá của cánh phải và cánh trái của nó. Heralded bởi Hồ Hán Dân và các phe phái quân đội còn lại ở Quý Châu, \" Quốc dân đảng cánh hữu \" nhằm mục đích thực hiện hệ tư tưởng của Tiến sĩ Sun mà không có bất kỳ ảnh hưởng phổ biến xa lạ nào của Syndicalists và International. Ở phía đối diện, \" Quốc dân đảng cánh tả \" rao giảng một cách giải thích xã hội chủ nghĩa cứng rắn về Ba Nguyên tắc, và duy trì sự thống nhất của Mặt trận Thống nhất với Đảng Công đoàn chủ nghĩa Trung Quốc.\n\nTuy nhiên, phần lớn bị chia thành nhiều phe phái ở cả hai đầu, Quốc dân đảng bị rạn nứt, và nó đang chờ đợi để được nhìn thấy nếu Đảng Quốc gia vĩ đại một thời có thể đòi lại chiếc áo choàng của mình như là đảng của quần chúng. §!\n"

 CHN_CSP_party: "CSP"
 CHN_CSP_party_long: "Đảng Công đoàn Trung Quốc (Zhongguo Gongtuandang)\n§L Phần lớn chỉ giới hạn ở các trung tâm đô thị hoặc các thành phố cảng, Đảng Công đoàn Trung Quốc trong nhiều năm vẫn chỉ là một đảng cơ sở bị phân mảnh của Quốc dân đảng Trung Quốc. Được coi là những người cấp tiến milquetoast tán thành một hệ tư tưởng nước ngoài trong một quốc gia không có cơ sở hỗ trợ công nhân lớn giống như ở châu Âu hoặc châu Mỹ, Đảng Công đoàn Trung Quốc vẫn duy trì những thành công đáng kể trong lịch sử chính trị của mình. Với hành động quan trọng trong các sự kiện lịch sử như các cuộc đình công Hồng Kông-Quảng Châu trong 1925, dẫn đến việc thành lập Liên đoàn của Syndicalists Trung Quốc, hoặc cuộc nổi dậy Thượng Hải trong 1932 dẫn đến hành động quần chúng quốc gia rộng lớn.\n\nVới bản chất đa nguyên vốn có của nó, Đảng Công đoàn Trung Quốc đã tự thấy mình bị phân mảnh với một loạt các bè phái khác nhau như phe Chính thống của Trần Độc Tú và Lý Lệ Quân, phe Cấp tiến của Trần Thiếu Dư, và các hội viên khác nhau như các bè phái phía Bắc của Lý Đại Chiêu, các bè phái phía Nam của Tân Bình Sơn và Đặng Trung Hạ, và các bè phái khu vực như Thái Hòa Sâm ở Hồ Nam hoặc Ngô Ngọc Chương ở Tứ Xuyên. Tuy nhiên, mặc dù có tất cả sự phô trương và tư thế của họ, Đảng Công đoàn Trung Quốc hầu như không phải là một lực lượng chính trị lớn ở Trung Quốc - với sức mạnh và ảnh hưởng chính của nó chỉ trong số các sinh viên và công nhân cấp tiến. §!\n"

 CHN_FCDP_party: "FCDP"
 CHN_FCDP_party_long: "Liên đoàn các Đảng Dân chủ Trung Quốc (Zhongguo Minzhu Zhengtuan Tongmeng)\n§L Được thành lập trong quá trình tự do hóa Trấn Lý ngắn ngủi sau năm 1928, Liên đoàn Xây dựng Quốc gia Thống nhất cuối cùng sẽ bị cấm nhưng đặt nền móng cho sự hình thành của Liên đoàn các Đảng Dân chủ Trung Quốc.FCDP cố gắng đoàn kết tất cả các đảng trên toàn quốc tìm kiếm nền dân chủ hiến pháp, dân sự dưới biểu ngữ của nó - bao gồm Đảng Lập hiến Trung Quốc, Liên đoàn Cứu quốc, Hội Khoa học Chính trị, Hiệp hội Giáo dục Nghề nghiệp Trung Quốc / Hiệp hội Xây dựng Dân chủ Quốc gia Trung Quốc, Đảng Xã hội Dân chủ, Hiệp hội Trăng lưỡi liềm và nhiều đảng khác.\n\nVới sự thống nhất của quốc gia và củng cố các khối chính trị, FCDP khó sử dụng đã thấy phần lớn sự hỗ trợ của nó được chuyển sang các đảng chính thức trong khu vực hoặc phổ biến hơn nhiều. Tuy nhiên, trong khoảng trống đó, nó đã kết hợp nhiều đảng nhỏ khác để củng cố vị trí của mình. Phần lớn được lãnh đạo bởi các đảng và bè phái dân chủ miền Bắc, nó đã tự đặt mình là một thay thế chủ yếu cho Liên minh Cộng hòa Lớn thống trị miền Nam, cân bằng sự lãnh đạo bảo thủ, cải cách với các nhà hoạt động cơ sở năng động hơn. §!\n"

 CHN_GRA_party: "GRA"
 CHN_GRA_party_long: "Liên minh Cộng hòa lớn (Gonghe Datongmeng)\n§L Liên minh Cộng hòa Lớn là một liên minh chính trị gần như hợp pháp của các đảng chủ yếu ở miền Nam Trung Quốc hoạt động đối lập với trật tự chính trị Bắc Dương đã được thiết lập. Được thành lập vào năm 1931 sau khi năng lượng chống nhượng bộ và kích động dân tộc chủ nghĩa lan rộng sau thất bại của các cuộc thảo luận đàm phán Trực Lệ-Phụng Thiên, Liên minh Cộng hòa Lớn sẽ liên minh một thời gian ngắn với Đoàn Kỳ Thụy đã nghỉ hưu, và được tham gia bởi các nhóm \" Old \" Liên bang khác như Đảng Chính phủ Nhân dân của Đường Kế Nghiêu ở Vân Nam và Phong trào Tự trị Chiết Giang của Chu Fucheng ban hành một khối không tuân thủ trong Quốc hội. Phần lớn thông cảm với GRA nhưng độc lập là những người của Hiệp hội Đổi mới Nhân dân của Zhao Hengti và Văn phòng Chuẩn bị Tự trị Liên bang Tỉnh của Xiong Kewu.\n\nVới sự thống nhất của quốc gia và củng cố các khối chính trị, Liên minh Cộng hòa Lớn đã nổi lên không chỉ đơn thuần là một liên minh chính trị miền Nam của các đảng khác nhau, nhưng thành một thực thể của riêng mình. Tham gia vô số các \" Old \" đảng dân chủ phong cách vào một con tàu duy nhất mà qua đó để vô địch nguyên nhân cho nhà nước dân chủ Trung Quốc, họ đã quản lý để hấp thụ rất nhiều sự hỗ trợ trung tâm trong nước, mặc dù vẫn còn ảnh hưởng lớn ở miền Nam. §!\n"

 CHN_republicans_party: "Phe cộng hòa"
 CHN_republicans_party_long: "Cộng hòa độc lập và trí thức\n§L Truyền thống trí tuệ trong lĩnh vực chính trị Trung Quốc đã là một truyền thống lâu dài, tự hào và chắc chắn nhất. Nhiều chính trị gia tham gia hoàn toàn và chân thành từ chối tham gia vào bất kỳ đảng phái chính trị nào, coi họ là tham nhũng và hạn chế. Giữ vững các nguyên tắc và chủ nghĩa thực dụng của riêng mình trái ngược với ý thức hệ, phần lớn họ là những quý ông đằng sau biệt danh \" Gentleman's Republic \" của Cộng hòa Bắc Dương. Thành lập nhiều nhóm, hiệp hội và xã hội \" phi chính trị \" trị vì trên các đảng can thiệp, di sản Cộng hòa đã thể hiện những thứ như Hội nghiên cứu của Lương Khải Siêu, Hội truyền thông cũ và mới, Câu lạc bộ Anfu, Câu lạc bộ Jiwei, Hội khoa học chính trị, Hiệp hội Endeavour, Diễn đàn dân chủ và khoa học, và rất nhiều người khác.\n\nThống nhất trong một mong muốn chung phần nào cho một tương lai hiến pháp, dân sự cai trị, đảng Cộng hòa không sẵn sàng tổ chức ở cấp độ cao hơn đã hạn chế các lựa chọn của họ. Thật vậy, đối với một vấn đề nhất định, họ hiếm khi bỏ phiếu như một khối thống nhất, với các nhà lập pháp hoặc bị lung lay hoặc hối lộ hoặc đe dọa vào một bên. Tuy nhiên, họ vẫn là một lực lượng thành lập mạnh mẽ và cung cấp hy vọng cho một tương lai dân chủ. Bị cám dỗ bởi thực tế mà họ đã tìm thấy chính mình, nhiều người xem xét bỏ phiếu với các phe phái dân chủ lớn khác, mặc dù kiêng thành viên chính thức. §!\n"

 CHN_CCP_party: "CCP"
 CHN_CCP_party_long: "$CHN_CCP_party_long_tt$\n§L Đảng Lập hiến Trung Quốc, do một trong mười đệ tử \" của Khang Hữu Vi lãnh đạo \" Xu Qin, là một trong những đảng và tổ chức chính trị lâu đời nhất trong lĩnh vực chính trị Trung Quốc. Tuyên bố di sản của mình từ những nỗ lực lập hiến của Kang và Lương Khải Siêu trong cơ quan lập pháp Hoàng gia nhà Thanh, phiên bản hiện đại của đảng tuyên bố mình là hậu duệ của cả hai nhà lập hiến nhà Thanh ban đầu, và của các phiên bản sau này của họ; Đảng Tiến bộ, Hội Nghiên cứu và tất cả các nỗ lực chính trị khác của Liangist. Thống nhất trong nỗ lực của họ cho chủ nghĩa lập hiến, và một nền dân chủ Trung Quốc hoạt động (tự do hay không), họ đã chứng tỏ kiên cường kiên cường trong chính trị Trung Quốc.\n\nĐược thành lập từ một cốt lõi của các chính trị gia chống cách mạng nhưng ủng hộ cải cách, họ sẽ ngày càng bị gạt ra ngoài lề trong Chính phủ Bắc Dương. Hỗ trợ Viên Thế Khải một thời gian ngắn, họ sẽ chia tay với anh ta vào năm 1915, và trở nên nổi bật với tư cách là cả phe đối lập và đối tác của Nhà nước Đảng Anfu. Được mệnh danh bởi Lương Khải Siêu, họ sẽ tích lũy một lều rộng sau tất cả những người theo chủ nghĩa Liang trừ những người từ Trung Quốc trẻ hay nói cách khác. Với cái chết của Liang, Xu Qin \" Zilu \" Kang đã nhặt được vỏ bọc của chủ nghĩa hợp hiến Trung Quốc.\n\nTiến về phía trước, họ mong muốn một nền dân chủ đạo đức, Nho giáo, chống quân phiệt Trung Quốc tuân thủ Hiến pháp như thể đó là phúc âm. Đã gặp phải sự rạn nứt do sự hỗ trợ rụt rè của chính phủ Bắc Dương, tuy nhiên nó vẫn là một lực lượng nhất quán và nhất quán trong chính trị Trung Quốc chống lại các quân phiệt và Đảng quốc. §!\n"
 CHN_CCP_party_long_tt: "Đảng Lập hiến Trung Quốc (Trung Quốc Hiến chính đảng)"

 CHN_DCP_party: "DCP"
 CHN_DCP_party_long: "Đảng Dân chủ Lập hiến (Minzhu Xianzhengdang)\n§L Một lần lặp lại khác trong hàng dài các đảng báo hiệu các nhà cải cách nhà Thanh quá cố như Lương Khải Siêu và Khang Hữu Vi, Đảng Lập hiến Dân chủ có thể được coi là người kế thừa Đảng Lập hiến Trung Quốc, và thông qua cùng một tiêu chuẩn của Đảng Tiến bộ, Hội nghiên cứu, v.v. Thống nhất trong nỗ lực của họ cho chủ nghĩa lập hiến và một nền dân chủ hoạt động, các nhà lập hiến dân chủ đã thông qua lớp phủ như các chính trị gia \" Old Guard \" của các nhà lập hiến Trung Quốc nghỉ hưu theo trật tự chính trị mới. Với Xu Qin nghỉ hưu với tư cách là lãnh đạo của ĐCSTQ, ông sẽ được bảo vệ và \" Young Guard \" lãnh đạo Wu Xianzi để đảm nhận lớp phủ.\n\nCùng với Li Daming, các nhà lập hiến dân chủ mới tiếp tục vô địch nền dân chủ hiến pháp cải cách, cải cách hòa bình nước cộng hòa đối lập với cuộc đấu tranh cách mạng hoặc hành động quần chúng triệt để. Được coi là \" Rightist \" thay thế cho Đảng Xã hội Dân chủ, các nhà lập hiến dân chủ hy vọng sẽ thoát khỏi khuôn mẫu mà di sản Hiến pháp Trung Quốc đã để lại cho họ, và thực sự làm việc hướng tới một nền dân chủ không có quân phiệt. §!\n"

 CHN_regionalists_party: "Phe địa phương"
 CHN_regionalists_party_long: "Khu vực độc lập và kẻ mạnh\n§L Thất bại trên chiến trường vẫn chưa xóa hết mọi dấu tích của chủ nghĩa quân phiệt ở Trung Quốc. Trên khắp đất nước, vẫn còn rất nhiều dư vị từ các phe phái quân phiệt lớn bị phá hủy, cho dù đó là các bè phái quân phiệt nhỏ nhoi đã quy phục các bậc thầy mới vào đúng thời điểm, cấp dưới cấp thấp hơn được chính quyền mới thuê, hoặc đôi khi là những người mạnh mẽ mới xuất hiện từ khoảng trống quyền lực tiếp theo và lợi dụng mối quan hệ của họ với những người chiến thắng. Thực tế là nhiều người chỉ giả vờ trung thành với sự nghiệp quốc gia để bắt nạt và bóc lột người dân không có nghĩa là những người khác không thực sự nổi tiếng - ngay cả những người đàn ông đa dạng nhất của thời đại quân phiệt cao cũng cẩn thận xây dựng các mạng lưới guanxi mạnh mẽ bao trùm các giới quân sự, dân sự và xã hội. Có sức lôi cuốn, kết nối và thường tham nhũng, những người sống sót sau trật tự thay đổi là những bậc thầy khai thác tình cảm khu vực cũng như bất mãn với hiện trạng, quyết tâm tồn tại lâu hơn những nỗ lực thanh trừng họ. Chỉ có thời gian mới cho biết phải mất bao nhiêu thế hệ để thực sự loại bỏ di sản đau đớn của thời đại quân phiệt. §!\n"

 CHN_YCP_party: "YCP"
 CHN_YCP_party_long: "Đảng Trung Quốc trẻ (Zhongguo Qingniandang)\n§L Sinh ra từ sinh viên \" Hội Trung Quốc trẻ \", Đảng Trung Quốc trẻ sẽ là một trong những người kế nhiệm của xã hội, khi nó chia thành \" chủ nghĩa dân tộc \", \" xã hội chủ nghĩa \" và \" lý tưởng \" phe phái, dẫn đầu bởi Tăng Kỳ và Lý Hoàng, Lý Đại Chiêu, và Wang Guangqi tương ứng. Đi du lịch đến Pháp để học tập, Tăng Kỳ và Lý Hoàng và các thành viên khác của phe dân tộc chủ nghĩa của họ sẽ tham gia vào các cuộc cãi vã với các sinh viên khác ở Pháp như Chu Ân Lai, Thái Nguyên Bồi và Lý Thạch Tăng.\n\nĐôi khi trở nên bạo lực, việc tích lũy hỗ trợ cho Đảng Công đảng Trung Quốc và sự ủng hộ của chính phủ Pháp sẽ dẫn đến việc Tăng Khánh Thụy và Lý Quang Diệu thành lập đảng riêng của họ, tuyên bố thành lập Đảng Trung Quốc trẻ vào năm 1923, bên ngoài Paris. Phát triển nhanh chóng giữa các tổ chức sinh viên Trung Quốc, Đảng Trung Quốc trẻ sẽ đứng trong sự phản đối cụ thể đối với Đảng Cộng sản và Quốc dân đảng. YCP sẽ trở lại Thượng Hải thành lập một loạt các xã hội chính trị và báo chí vào năm 1924, trở thành đồng minh với Ngô Bội Phu và Tôn Truyền Phương của Trực hệ.\n\nThông qua sự hỗ trợ của các quân phiệt Trực Lệ, Đảng Trung Quốc trẻ sẽ là đảng đại chúng duy nhất có vị trí thuận lợi sau Cuộc viễn chinh phương Bắc thất bại của Quốc dân đảng, cho phép họ mở rộng đáng kể ảnh hưởng của mình đối với nhiều sĩ quan quân đội và các tổ chức giáo dục. Dưới sự lãnh đạo của Tăng Kỳ, YCP hy vọng đạt được một cuộc cách mạng bầu cử, kêu gọi các nguyên tắc tổ chức chính trị xã đoàn, chủ nghĩa liên bang, chủ nghĩa dân tộc, và trên hết, bảo vệ một Trung Quốc Nho giáo. §!\n"

### Shared Chinese History ###
 CHN_country_intro_header_1: "Tổng quan Trung Quốc thế kỷ XX (Phần 1)"
 CHN_country_intro_content_1: "§Y Pre-1911: Sự suy giảm của nhà Thanh §!\nTrung Quốc là một nền văn minh cổ đại, nhưng nguồn gốc của cuộc xung đột hiện tại của nó phát triển chủ yếu từ sự suy giảm quyền lực của triều đại nhà Thanh sau khi Chiến tranh Nha phiến thế kỷ 19 bắt đầu cái gọi là \" Bách niên Quốc sỉ \" . Những nỗ lực của chính phủ nhà Thanh để hiện đại hóa, chẳng hạn như 1861 \" Phong trào tự tăng cường \" , 1898 \" Cải cách Trăm ngày \" , 1901 \" Chính sách mới \" dẫn đến tiến bộ không đồng đều - có lẽ thành tựu đáng chú ý nhất của họ là việc tạo ra Quân đội Bắc Dương theo phong cách phương Tây của Viên Thế Khải vào năm 1895. Nhưng những cải cách đó đã thất bại trong việc ngăn chặn các thất bại quân sự ngày càng tăng như trong Chiến tranh Trung-Nhật 1894 hoặc sự bất mãn của công chúng ngày càng tăng như trong Cuộc nổi dậy Đài Bắc kéo dài 14 năm tàn phá vào năm 1850. Đến năm 1911, các tổ chức xã hội bí mật cách mạng đã sinh sôi nảy nở trên khắp đất nước - đáng chú ý nhất là Đồng Minh hội của Tôn Trung Sơn.\n\n§Y 1911-1916: Cách mạng Tân Hải và Chiến tranh Hộ quốc §!\nNăm 1911, tình trạng bất ổn âm ỉ đã kích hoạt cuộc nổi dậy Vũ Xương (cuối cùng do Li Yuanhong chỉ huy) nhanh chóng lan rộng khắp đất nước trong Cách mạng Tân Hợi. Các nhà lãnh đạo cách mạng đã mời Tôn Trung Sơn lưu vong trở về Trung Quốc để trở thành tổng thống lâm thời ở Nam Kinh trong khi Tướng Viên Thế Khải nắm quyền kiểm soát chính phủ Hoàng gia ở Bắc Kinh. Hai bên đã đi đến một thỏa thuận trong đó Hoàng đế trẻ Puyi bị phế truất, Viên Thế Khải trở thành Tổng thống của Cộng hòa mới, Đồng Minh hội thống trị cơ quan lập pháp và Sun đã đứng ngoài ủng hộ cánh nghị sĩ của phong trào. Nhưng xung đột nảy nở giữa Yuan và Đồng Minh hội dẫn đến một sự sụp đổ bạo lực và Yuan củng cố quyền lực với việc nghiền nát thành công \" Cách mạng thứ hai \" bởi Quân đội Bắc Dương của ông.\n\nViên Thế Khải đã đưa nhiều thuộc hạ của Bắc Dương vào các vị trí quyền lực quan trọng - chính phủ Bắc Kinh thường được mệnh danh là Chính phủ Bắc Dương \". \" Mặc dù có quyền kiểm soát rõ ràng đối với quốc gia, họ đã vật lộn để vật lộn với ảnh hưởng nước ngoài, đặc biệt là bởi Đế quốc Nhật Bản đang lên đã leo thang áp lực của họ trong Chiến tranh thế giới thứ nhất thông qua Nhu cầu 21 năm 1915. Viên Thế Khải, có lẽ dưới ảnh hưởng của các cố vấn phương Tây, đã tự xưng là Hoàng đế Hongxian vào cuối năm đó, gây ra phản ứng dữ dội của đảng cộng hòa. Đồng minh cũ của ông, tướng Thái Ngạc đã trốn thoát khỏi nhà tù và chạy trốn đến tỉnh Vân Nam quê hương và bắt đầu một cuộc nổi dậy lan rộng khắp miền nam được gọi là Chiến tranh Hộ quốc. Mặc dù chiến đấu kết thúc trong bế tắc, nó buộc Viên phải từ bỏ tuyên bố quân chủ của mình mặc dù ông vẫn giữ chức Tổng thống cho đến khi ông qua đời vào năm 1916.\n\n§Y 1916-1920: Chiến tranh bảo vệ hiến pháp và phân mảnh hơn nữa §!\nCái chết của Viên Thế Khải đã đưa Lý Nguyên Hồng lên làm Tổng thống, Thái E chấp nhận. Nhưng Thủ tướng Đoàn Kỳ Thủy vẫn là lực lượng thực sự đằng sau chính phủ mới và phe của ông được gọi là Hội An Huy. Các phe phái đối thủ bắt đầu hình thành ở Bắc Dương, đáng chú ý nhất là Hội Trực hệ của Phó Tổng thống Phùng Quốc Chương và quân phiệt bị cướp Trương Tác Lâm thành lập Hội Phong Tộc ở Đông Bắc (Mãn Châu).\n\nĐoan đã thành công trong việc đưa Trung Quốc vào cuộc Đại chiến ở phe Đồng Minh, khởi đầu một cuộc đấu tranh quyền lực với Lý và một nỗ lực phục hồi quân chủ ngắn ngủi vào năm 1917, trong đó Đoan nổi lên trên đỉnh. Nỗ lực của ông trong việc soạn thảo một hiến pháp mới có lợi cho Hội An Huy dẫn đến hàng trăm nghị sĩ chạy trốn về phía nam. Điều này đã cho Tôn Trung Sơn và Quốc dân đảng mới thành lập của ông tính chính danh để trở về Quảng Châu với sự giúp đỡ của các quân phiệt địa phương và kích hoạt Phong trào Bảo vệ Hiến pháp. Chính phủ Quảng Châu đã không đạt được nhiều tiến bộ và sớm rơi vào cuộc đấu đá nội bộ - dẫn đến việc Tôn và Quốc dân đảng bị trục xuất ở phía nam để ủng hộ một chính quyền quân sự. Tuy nhiên, các cuộc đàm phán thống nhất cuối cùng đã thất bại khi căng thẳng gia tăng đối với các giao dịch của Hội An Huy với Nhật Bản. Sự kết thúc của Đại chiến chứng kiến tình trạng bất ổn lớn khi các cuộc biểu tình tháng 11 nổ ra về ảnh hưởng của Nhật Bản (đồng minh cũ của Trung Quốc) đối với Sơn Đông."

 CHN_country_intro_header_2: "Tổng quan Trung Quốc thế kỷ XX (Phần 2)"
 CHN_country_intro_content_2: "§Y 1920s-1925: Sự trỗi dậy của Trực Lệ và Quốc dân đảng §!\nPhùng Quốc Chương qua đời vào cuối năm 1919, và các đệ tử của ông là Tào Côn và Ngô Bội Phu đã tiếp quản Trực hệ. Họ đánh bại đối thủ của mình trong Chiến tranh Trực hệ 1920 và Chiến tranh Trực Hệ 1922 lần thứ nhất.\n\nỞ miền Nam, Tôn Trung Sơn và Trần Quýnh Minh đã đánh bại chính quyền Quảng Châu của Cen Chunxuan và Lu Rongting. Sun gây tranh cãi tuyên bố mình là \" Tổng thống phi thường \" , gây ra một cuộc đấu tranh quyền lực với Chen, người đã đuổi Sun trong một cuộc đảo chính năm 1922. Các trí thức và quân phiệt miền Nam đã thành lập phong trào Liên bang, đề xuất thống nhất hòa bình với Li Yuanhong với tư cách là Chủ tịch thống nhất để đổi lấy quyền tự trị tỉnh rộng lớn. Đàm phán với Chính phủ Nhân dân Tốt \" phía bắc \" cuối cùng đã sụp đổ khi Trực Lệ (đặc biệt) Ngô Bội Phu từ chối chủ nghĩa liên bang trong thực tế.\n\nTôn Trung Sơn sớm quay trở lại và tổ chức lại Quốc dân đảng vào năm 1924 theo đường lối tiên phong. Họ gia nhập Mặt trận Liên hiệp \" \" với Đảng Công đảng Trung Quốc để đổi lấy sự hỗ trợ từ Quốc tế thứ ba. Học viện Quân sự Hoàng Phố được thành lập, tích hợp giáo dục quân sự phương Tây với truyền bá ý thức hệ nặng nề, và Quân đội Cách mạng Quốc gia của Quốc dân đảng đã đánh bại các đối thủ trong khu vực của họ trong suốt 1922-1926.\n\nỞ miền Bắc, Chiến tranh Trực Lệ–Phụng Thiên lần thứ 2 nổ ra vào năm 1924. Nó bất ngờ kết thúc với sự phản bội của Tướng Phùng Ngọc Tường, người đã tổ chức Cuộc đảo chính Bắc Kinh chống lại Trực. Các cuộc đàm phán thống nhất không thành công sau đó bắt đầu giữa \" Quốc dân quân \" của Phùng Ngọc Tường, Quan hệ Phụng Thiên của Trương Tác Lâm, Đoàn Kỳ Thụy và tàn dư An Huy lưu vong của ông, và Quốc dân đảng của Tôn Trung Sơn.\n\n§Y 1925-1928: Cuộc thám hiểm phía Bắc và thống nhất Trực Lệ §!\nTôn Trung Sơn qua đời trong các cuộc đàm phán vào năm 1925 và đảng của ông sớm chia thành các phe phái. Người kế nhiệm trực tiếp của ông, Hồ Hán Dân, và \" Old Right \" của ông đã bị thanh trừng sau một nỗ lực ám sát thất bại đối với đối thủ Liao Zhongkai. Một sự hợp tác không thoải mái xuất hiện giữa \" Left \" Quốc dân đảng dưới thời Uông Tinh Vệ và quân đội \" Center \" dưới thời Hoàng Phố Clique của Tưởng Giới Thạch cũng như các quân phiệt đồng minh khác nhau của họ.\n\nNăm 1926, Quốc dân đảng đã phát động cuộc viễn chinh phương Bắc, hy vọng bắt được các quân phiệt phương Bắc bị chia rẽ và suy yếu sau Chiến tranh chống Phụng Thiên khi thấy Phùng Ngọc Tường và Quốc dân quân của ông bị đuổi ra khỏi Bắc Kinh bởi một liên minh Phụng Thiên-Trực Lệ. Trong khi Quốc dân đảng thực hiện một số tiến bộ, viện trợ của Đức cho Trực Lệ và sự can thiệp kịp thời của họ đã giúp xoay chuyển thủy triều. Trực Lệ sau đó đánh bại bè phái Phụng Thiên trong hai cuộc chiến tiếp theo, tái khẳng định quyền kiểm soát của họ đối với phần lớn Trung Quốc.\n\n§Y 1928-1936: Các vết nứt theo thứ tự Trực Lệ §!\nChính phủ Trực Lệ bị bao vây bởi sự bất ổn ngay từ đầu. Tìm kiếm sự hỗ trợ của nước ngoài, Trực Lệ trên danh nghĩa đã khôi phục triều đại nhà Thanh. Sự đối lập ngày càng tăng giữa người Đức và Nhật Bản đã được trung gian bởi người Mỹ, củng cố lợi ích của phương Tây trong Hội nghị Thượng Hải năm 1928, dẫn đến việc thành lập các thành phố công sứ. Xung đột đường sắt Đông Trung Quốc nổ ra ngay sau đó, dẫn đến chiến thắng của Phụng Thiên trước người Nga nhưng cũng phơi bày sự yếu kém của chính quyền trung ương.\n\nHiệp hội Hòa hợp được Trực Lệ hậu thuẫn đã giành được đa số áp đảo trong cuộc bầu cử năm 1929. Trương Tác Lâm đã từ bỏ lời hứa tôn trọng kết quả và thành lập chính phủ đối thủ của mình ở Đông Bắc. Ở miền Nam, nội chiến gần như nổ ra khi Liên minh Tám tỉnh của Quân phiệt Tôn Chuẩn Phương của Trực Lệ phản đối yêu cầu phi quân sự hóa và tập trung hóa của Tào và Ngô.\n\nGiữa sự cạnh tranh giữa các phe phái Bắc và Nam Trực, phe đối lập tiếp tục phát triển.Các đảng dân chủ Trung Quốc thành lập Liên đoàn Xây dựng Quốc gia Thống nhất nhưng phải đối mặt với sự đàn áp đặc biệt là sau khi những người nổi dậy xã hội chủ nghĩa tổ chức Cuộc nổi dậy Thượng Hải năm 1932 tập trung quanh bờ biển phía Đông.Phía bắc bắt đầu đi ngược lại lời hứa của họ về chủ nghĩa hợp hiến, đình chỉ cuộc bầu cử quốc gia năm 1933 trong khi phía nam bắt đầu tan vỡ khi các quân phiệt nhỏ hơn đạt được độc lập trên thực tế và trật tự Trực tiếp sụp đổ."
