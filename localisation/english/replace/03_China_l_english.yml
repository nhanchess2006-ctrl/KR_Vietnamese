#Major Arsenals
 CHN_integrate_major_arsenal_decision: "[CHN_integrate_major_arsenal_scripted_loc]"
 CHN_integrate_major_arsenal_decision_desc: "[CHN_integrate_major_arsenal_desc_scripted_loc]"

 CHN_integrate_major_arsenal_shenyang_key: "Hợp nhất Xưởng quân giới Thẩm Dương"
 CHN_integrate_major_arsenal_shenyang_desc_key: "Quân xưởng Thẩm Dương có lẽ là một trong những thành tựu nổi bật của phe Phong kiến, được tạo ra và duy trì với sự giúp đỡ của các cố vấn Nhật Bản để duy trì sự kiểm soát của Trương Tác Lâm đối với Mãn Châu và thúc đẩy tham vọng thống nhất Trung Quốc dưới ngọn cờ của ông. Được biết đến với tên gọi Quân xưởng Ba tỉnh Đông, đây là một trong những quân xưởng lớn nhất ở Trung Quốc và tự hào về khả năng sản xuất nhiều vũ khí hơn tất cả những nơi khác ở Trung Quốc kết hợp trong suốt những năm 1920. Tận dụng sức mạnh công nghiệp vượt trội của Dongbei và tài nguyên thiên nhiên phong phú, Quân xưởng Thẩm Dương đã trở thành một trung tâm không chỉ sản xuất mà còn tạo ra một chuỗi hậu cần quân sự rộng lớn (bao gồm sản xuất tập trung khẩu phần và đồng phục), cũng như phát triển vũ khí của riêng họ. Trong khi Zhang không thể phá vỡ hoàn toàn sự phụ thuộc của Trung Quốc vào nhập khẩu vũ khí nước ngoài, có lẽ dưới sự quản lý của chúng ta, nó sẽ đóng một vai trò có giá trị trong việc xây dựng một ngành công nghiệp vũ khí trong nước."
 integrated_shenyang: "Đã hợp nhất Xưởng quân giới Thẩm Dương"

 CHN_integrate_major_arsenal_taiyuan_key: "Hợp nhất Xưởng quân giới Thái Nguyên"
 CHN_integrate_major_arsenal_taiyuan_desc_key: "Thái Nguyên Arsenal là một khu phức hợp khổng lồ được xây dựng tại thủ đô của Sơn Tây bởi Thống đốc đáng kính Diêm Tích Sơn. Được trích dẫn khi nói lực lượng vũ trang \" là sự ủng hộ của công lý \", ông đã thấy kho vũ khí quý giá của mình là nền tảng để bảo vệ quyền tự chủ của tỉnh. Nhà máy được xây dựng lần đầu tiên vào năm 1912 với tư cách là Cục Máy móc Sơn Tây và đã trải qua nhiều lần lặp lại trong nhiều thập kỷ, sản xuất súng trường, súng máy, súng cối, lựu đạn và đạn dược cho phe phái Sơn Tây. Không giống như các kho vũ khí quân phiệt khác, Thái Nguyên đáng chú ý vì khả năng hiếm có (ngay cả trong số các cơ sở chính phủ trung ương) để sản xuất pháo và đạn pháo với số lượng có ý nghĩa. Việc bắt giữ nó bởi các lực lượng của chúng ta thêm một xưởng đúc phía bắc vô giá khác vào ngành công nghiệp vũ khí đang phát triển của chúng ta."
 integrated_taiyuan: "Đã hợp nhất Xưởng quân giới Thái Nguyên"

 CHN_integrate_major_arsenal_gongxian_key: "Hợp nhất Xưởng quân giới Củng Huyện"
 CHN_integrate_major_arsenal_gongxian_desc_key: "Năm 1914, Yuan Shicai trực tiếp giám sát việc xây dựng Quân xưởng Củng Huyện ở Hà Nam. Tận dụng vị trí chiến lược và dễ dàng tiếp cận nguyên liệu thô, Đô đốc Sa Zhenbing và thuê các kỹ sư Đức đã sử dụng máy móc mua của Mỹ để thành lập một trong những kho vũ khí quân sự hiện đại hàng đầu ở Trung Quốc. Việc bắt giữ tương đối nguyên vẹn của nó đã đảm bảo cho chúng ta một giải thưởng có giá trị ở miền trung Trung Quốc, một giải thưởng mà chúng ta phải nhanh chóng tích hợp với phần còn lại của ngành công nghiệp quốc phòng."
 integrated_gongxian: "Đã hợp nhất Xưởng quân giới Củng Huyện"

 CHN_integrate_major_arsenal_hanyang_key: "Hợp nhất Xưởng quân giới Hán Dương"
 CHN_integrate_major_arsenal_hanyang_desc_key: "Quân xưởng Hán Dương là một trong những Quân xưởng lớn nhất, lâu đời nhất và quan trọng nhất hiện đại của Trung Quốc. Được xây dựng vào năm 1891 với tên gọi Quân xưởng Hồ Bắc, nó đòi hỏi thời gian và kinh phí đáng kể được chuyển hướng từ hạm đội. Có khả năng sản xuất pháo, súng trường và đạn dược, Hán Dương đã nuôi dưỡng một loạt quân đội bao gồm các nhà cách mạng Tân Hải ban đầu có trụ sở tại Vũ Hán. Nó đã đạt được danh tiếng khi phát triển và sản xuất súng trường Hán Dương 88 (dựa trên Gewehr 1888 của Đức) và súng trường General Liu (được thiết kế bởi Tổng giám đốc Hán Dương Liu Qingen), một số vũ khí mang tính biểu tượng nhất của Thời đại Warlord."
 integrated_hanyang: "Đã hợp nhất Xưởng quân giới Hán Dương"

 CHN_integrate_major_arsenal_guangdong_key: "Hợp nhất Xưởng quân giới Quảng Đông"
 CHN_integrate_major_arsenal_guangdong_desc_key: "Lần đầu tiên được dựng lên bởi Phó vương Liêu Quảng vào năm 1873, Quân xưởng Quảng Đông đã bắt đầu với tư cách là Cục Máy móc Quảng Đông sản xuất vũ khí nhẹ. Dần dần, nó được mở rộng và hiện đại hóa, xây dựng các cơ sở mới và tiếp thu các kho vũ khí khác như Cục Vũ khí Zengbu để tạo ra một khu công nghiệp quân sự mạnh mẽ ở Quảng Đông. Cách mạng Tân Hải và các cuộc chiến sau đó đã chứng kiến Quảng Châu trở thành trung tâm của một loạt các chính phủ miền Nam, và vai trò của Quân xưởng Quảng Đông chỉ tiếp tục mở rộng. Được hỗ trợ bởi các kho vũ khí khu vực khác như tại Thạch Tỉnh, Pajiang và thậm chí là một nhà máy sản xuất mặt nạ khí chuyên dụng, các cơ sở của miền nam Trung Quốc sẽ phục vụ rất tốt cho sự nghiệp của quốc gia."
 integrated_guangdong: "Đã hợp nhất Xưởng quân giới Quảng Đông"

 CHN_integrate_major_arsenal_jinling_key: "Hợp nhất Xưởng quân giới Kim Lăng"
 CHN_integrate_major_arsenal_jinling_desc_key: "Cục sản xuất máy móc Kim Lăng, được xây dựng trên đỉnh đền thờ Xitian cũ bởi nhà cải cách cuối triều đại nhà Thanh Li Hongzhang vào năm 1865, nhanh chóng trở thành một trong những kho sản xuất vũ khí đáng kính của Trung Quốc ở miền Đông Trung Quốc. Đôi khi được gọi là \" cái nôi của ngành công nghiệp quân sự quốc gia Trung Quốc \", nó được biết đến với khả năng tung ra súng trường cho quân đội của phe Trực Lệ phía nam. Được đổi tên thành Kim Lăng Arsenal, nó đã trở thành tâm điểm của những nỗ lực Tôn Truyền Phương để xây dựng một đội quân Trung Quốc hiện đại dọc theo dòng Đức. Tham mưu với các cố vấn kỹ thuật của Đức, nó đã được hiện đại hóa thành một cường quốc sản xuất cho Liên minh tám tỉnh."
 integrated_jinling: "Đã hợp nhất Xưởng quân giới Kim Lăng"

 CHN_integrate_major_arsenal_shanghai_key: "Hợp nhất Xưởng quân giới Thượng Hải"
 CHN_integrate_major_arsenal_shanghai_desc_key: "Được thành lập vào năm 1865 trong Phong trào Tự tăng cường của Li Hongzhang và Zeng Guofan, Cục Sản xuất Giang Nam ở Thượng Hải được thành lập để cung cấp vũ khí hiện đại cho nhà Thanh. Mặc dù phải đối mặt với tình trạng hỗn loạn chính trị trong nhiều thập kỷ, nhà máy đã trải qua những mở rộng và phát triển đáng kể. Đổi tên thành Thượng Hải Arsenal vào năm 1917, nó nổi lên như một trong những nhà sản xuất máy công cụ và vũ khí hiện đại hiệu quả nhất, bao gồm súng máy hạng nặng, súng cối, súng dã chiến và thậm chí cả súng phòng không."
 integrated_shanghai: "Đã hợp nhất Xưởng quân giới Thượng Hải"

 CHN_integrate_major_arsenal_fallback_key: "Tích hợp các kho vũ khí quân sự lớn tại [FROM.GetName]"
 CHN_integrate_major_arsenal_fallback_desc_key: "Các cơ sở sản xuất quân sự quy mô lớn ở đây có chất lượng tối đa, hoặc ít nhất là có thể được chính phủ đầu tư và chú ý đầy đủ. Chúng ta phải làm việc để hợp nhất chúng vào dây chuyền sản xuất rộng hơn của chúng ta."

#Minor Arsenals - Infantry Equipment
 CHN_integrate_minor_small_arms_arsenal_decision: "[CHN_integrate_minor_small_arms_arsenal_scripted_loc]"
 CHN_integrate_minor_small_arms_arsenal_decision_desc: "[CHN_integrate_minor_small_arms_arsenal_desc_scripted_loc]"

 CHN_integrate_minor_small_arms_arsenal_jinan_key: "Hợp nhất Xưởng quân giới Tế Nam"
 CHN_integrate_minor_small_arms_arsenal_jinan_desc_key: "Được thành lập với tư cách là Cục Máy móc Sơn Đông của Thống đốc Ding Baozhen vào năm 1875, nó đã mua lại máy móc cần thiết để sản xuất vũ khí vài năm sau đó vào năm 1883. Nó bắt đầu sản xuất một loạt các vũ khí nhẹ có nguồn gốc từ các thiết kế phương Tây, nhanh chóng mở rộng cơ sở công nghiệp của mình để sản xuất số lượng súng trường ngày càng lớn và các thiết bị bộ binh khác. Được Chính phủ Bắc Dương đổi tên thành Quân xưởng Sơn Đông, nó đã được sản xuất thêm và tên cuối cùng của nó là Quân xưởng Tế Nam dưới sự cai trị của Zhang Zhongchang."

 CHN_integrate_minor_small_arms_arsenal_chengdu_key: "Hợp nhất Xưởng quân giới Thành Đô"
 CHN_integrate_minor_small_arms_arsenal_chengdu_desc_key: "Sự gián đoạn gây ra bởi các cuộc chiến tranh khác nhau ở miền Đông Trung Quốc, bao gồm cả những phát triển gần đây sau sự sụp đổ của chính quyền nhà Thanh, đã đẩy một số di dời cơ sở hạ tầng sản xuất về phía nội địa. Trong khi mức độ mà những động thái này được lên kế hoạch so với chủ nghĩa cơ hội vội vàng đang được tranh luận, Thành Đô đã là một người nhận sẵn sàng của những cuộc sơ tán này, tạo ra một khu vực quốc phòng đang phát triển của riêng mình."

 CHN_integrate_minor_small_arms_arsenal_guizhou_key: "Hợp nhất Xưởng quân giới Quý Châu"
 CHN_integrate_minor_small_arms_arsenal_guizhou_desc_key: "Quân xưởng Quý Châu được thành lập vào tháng 8 năm 1926 tại Quý Dương bởi Zhou Xichen, thông qua việc sáp nhập Chishui Arsenal và Yanhe Gun Factory, ban đầu được thành lập bởi Zhou vào năm 1923 và 1924 tương ứng, để sản xuất súng ngắn và súng trường cho cuộc đấu tranh quyền lực của mình ở Quý Châu. Tham gia bởi một nhà máy bột không khói đã hỗ trợ rất nhiều cho sản xuất, Quân xưởng Quý Châu hiện đang sản xuất súng máy, lựu đạn, đạn pháo và thậm chí cả mìn cho quân đội của Zhou Xichen."

 CHN_integrate_minor_small_arms_arsenal_guangxi_key: "Hợp nhất Xưởng quân giới Quảng Tây"
 CHN_integrate_minor_small_arms_arsenal_guangxi_desc_key: "Ban đầu được thành lập tại Longcheng vào năm 1899 để sản xuất vũ khí cho quân đội Trung Quốc ở biên giới phía tây nam, Cục Máy móc Quảng Tây đã bị cháy trong một tai nạn hỏa hoạn vào năm 1914 và được chuyển đến Nam Ninh.Nó lần đầu tiên được sử dụng bởi Lu Rongting để trang bị cho quân đội Quảng Tây của mình và sau đó được tiếp quản bởi Lý Tông Nhân và Huang Shaohong để tạo ra Quân xưởng Quảng Tây bằng cách sáp nhập các nhà máy vũ khí tương ứng của họ vào năm 1924 để sản xuất súng trường cho binh lính của họ."

 CHN_integrate_minor_small_arms_arsenal_fallback_key: "Tích hợp kho vũ khí nhỏ tại [FROM.GetName]"
 CHN_integrate_minor_small_arms_arsenal_fallback_desc_key: "[FROM.GetName] đã trở thành một trung tâm sản xuất vũ khí nhỏ, tung ra một lượng lớn súng trường, lựu đạn và đạn dược cho quân đội địa phương trong những năm qua. Đã trở thành bậc thầy mới nhất của nó, điều quan trọng là chúng ta tận dụng tối đa chuyên môn của họ vì lợi ích của quốc gia."

#Minor Arsenals - Support Equipment
 CHN_integrate_minor_support_equipment_arsenal_decision: "[CHN_integrate_minor_support_equipment_arsenal_scripted_loc]"
 CHN_integrate_minor_support_equipment_arsenal_decision_desc: "[CHN_integrate_minor_support_equipment_arsenal_desc_scripted_loc]"

 CHN_integrate_minor_light_arms_arsenal_kunming_key: "Vân Nam Arsenal"
 CHN_integrate_minor_light_arms_arsenal_kunming_desc_key: "Được thành lập vào năm 1884 với tư cách là Cục Máy móc Vân Nam ở Côn Minh để sửa chữa và sản xuất vũ khí, Quân xưởng Vân Nam bắt đầu sản xuất súng trường hiện đại vào năm 1905. Được đổi tên sau sự sụp đổ của nhà Thanh, nó bắt đầu sản xuất lựu đạn và đạn pháo nhỏ và cung cấp vũ khí cho Quân đội Vân Nam trong Cách mạng thứ hai và Chiến tranh Hộ quốc dưới sự quản lý địa phương của Vân Nam, nơi mở rộng kho vũ khí vào năm 1927."

 CHN_integrate_minor_light_arms_arsenal_zhuzhou_key: "Mở rộng Xưởng quân giới Hồ Nam"
 CHN_integrate_minor_light_arms_arsenal_zhuzhou_desc_key: "Khi nhu cầu quân sự của phe Trực Lệ tăng lên, một số chuyên gia từ Củng Huyện Arsenal đã đến tỉnh Hồ Nam mới được bảo đảm để hỗ trợ tạo ra một nhà máy vũ khí hạng nhẹ mới tại Chu Châu, mở rộng các kho vũ khí trước đây được thành lập bởi Tan Yankai vào năm 1912 và được hồi sinh bởi Zhao Hengti vào năm 1924. Trong khi mục tiêu của họ là tạo ra một cơ sở tiên tiến đã giảm ngắn do sự bất ổn mà Hồ Nam phải đối mặt sau sự sụp đổ của Liên đoàn, Hồ Nam nằm ở ngã tư đường của quốc gia và đến lượt nó là bắt buộc mà chúng ta đầu tư vào việc mở rộng các cơ sở hiện có cho phù hợp."

 CHN_integrate_minor_light_arms_arsenal_dihua_key: "Mở rộng Xưởng quân giới Địch Hóa"
 CHN_integrate_minor_light_arms_arsenal_dihua_desc_key: "Nhiều thập kỷ trước, ở vùng xa xôi của Tân Cương, Thống đốc Rao Yingqi đã có đủ tầm nhìn xa khi ông xem người Nga và Anh chơi trò chơi \" Great Game \" của họ cho Trung Á để nhận ra rằng là biên giới phía tây nhất của Trung Quốc, ông phải chuẩn bị cho khả năng xâm nhập nước ngoài. Năm 1897, với sự cho phép của chính phủ nhà Thanh, ông đã mua máy móc của Đức từ Thượng Hải và do đó chính thức thành lập Cục Máy móc Tân Cương. Sản xuất rất khó khăn, bị cản trở bởi việc lựa chọn địa điểm không đúng cách khiến nước khô vào mùa hè và mùa đông.\n\nTuy nhiên, các quân phiệt gần đây đã đầu tư một cách khôn ngoan vào nhà máy, đổi tên thành Địch Hóa Arsenal và làm việc để đảm bảo nó có thể sản xuất một nguồn cung cấp vũ khí mới cũng như sửa chữa những vũ khí hiện có. Điều này đã giúp họ có lợi thế chống lại phiến quân trong khu vực, và với sự làm chủ mới được tìm thấy của chúng ta đối với khu vực, điều quan trọng là chúng ta học hỏi từ những cách cứng rắn, tiết kiệm của họ."

 CHN_integrate_minor_light_arms_arsenal_fallback_key: "Mở rộng kho vũ khí hạng nhẹ tại [FROM.GetName]"
 CHN_integrate_minor_light_arms_arsenal_fallback_desc_key: "[FROM.GetName] có tiềm năng trở thành một trung tâm sản xuất vũ khí hạng nhẹ, tung ra một lượng lớn vữa, đồng phục, khẩu phần và các thiết bị hỗ trợ khác để hỗ trợ lực lượng ngày càng tăng của chúng ta. Điều quan trọng là chúng ta tận dụng tối đa khu vực và chuyên môn của mình vì lợi ích của quốc gia."

#Minor Arsenals - Artillery
 CHN_integrate_minor_artillery_arsenal_decision: "[CHN_integrate_minor_artillery_arsenal_scripted_loc]"
 CHN_integrate_minor_artillery_arsenal_decision_desc: "[CHN_integrate_minor_artillery_arsenal_desc_scripted_loc]"

 CHN_integrate_minor_artillery_arsenal_lanzhou_key: "Mở rộng Xưởng quân giới Lan Châu"
 CHN_integrate_minor_artillery_arsenal_lanzhou_desc_key: "Trong những ngày ốm yếu của nhà Thanh, Thống đốc Zuo Zongtang của Thiểm Tây và Cam Túc đã bầu thành lập Cục Máy móc Lan Châu vào năm 1871. Thuê thợ thủ công địa phương và mua máy móc cần thiết từ nước ngoài, ông đã đặt nền móng cho một trung tâm sản xuất pháp lệnh khu vực thành công hợp lý bằng cách điều phối các cơ sở dưới sự chỉ huy của ông ở Lan Châu và Tây An. Súng trường, súng pháo và đạn dược tương ứng của chúng cho phép Zuo đạt được thành công khi chiến đấu trên khắp miền tây Trung Quốc, mặc dù nhà máy không may bị đóng cửa vào năm 1882.\n\nNhiều quân phiệt gần đây đã mở cửa trở lại, mặc dù phần lớn cơ sở hạ tầng và nhân sự đã bị mất hoặc phát triển lỗi thời. Tuy nhiên, ngồi sâu trong nội địa Trung Quốc, sẽ không hại gì khi phát triển một nguồn pháo thay thế và thực sự có vẻ như những người tiền nhiệm của chúng ta cũng có ý tưởng tương tự mặc dù họ không thấy nó hoàn thành đầy đủ."

 CHN_integrate_minor_artillery_arsenal_fallback_key: "Mở rộng sản xuất pháo binh tại [FROM.GetName]"
 CHN_integrate_minor_artillery_arsenal_fallback_desc_key: "[FROM.GetName] có tiềm năng trở thành một trung tâm sản xuất vũ khí hạng nhẹ, tung ra một lượng lớn súng hạng nặng và đạn pháo để hỗ trợ lực lượng đang phát triển của chúng ta. Điều quan trọng là chúng ta tận dụng tối đa khu vực và chuyên môn của mình vì lợi ích của quốc gia."

#Naval Arsenals
 CHN_integrate_major_dockyard_decision: "[CHN_integrate_major_dockyard_scripted_loc]"
 CHN_integrate_major_dockyard_decision_desc: "[CHN_integrate_major_dockyard_desc_scripted_loc]"

 CHN_integrate_major_dockyard_yingkou_key: "Tích hợp Dinh Khẩu Naval Yard"
 CHN_integrate_major_dockyard_yingkou_desc_key: "Cảng Dinh Khẩu nằm trong một vị trí chiến lược ở Hoàng Hải, được đặt ở vị trí kiểm soát dọc theo sông Đại Liêu và Vịnh Liêu Đông. Với Đại Liên (Cảng Arthur) dưới sự kiểm soát của Nhật Bản, Dinh Khẩu thực sự là cảng duy nhất dưới sự kiểm soát trực tiếp của phe Phong kiến và nguồn tài trợ đáng kể (mặc dù không đủ) đã được cung cấp để mở rộng nó như là quê hương của hạm đội của họ. Rõ ràng họ đã học được rất nhiều từ các đối tác Nhật Bản của họ, một bộ kỹ năng mà chúng ta phải có thể sử dụng để phát triển một hạm đội của riêng mình."

 CHN_integrate_major_dockyard_jiangnan_key: "Tích hợp nhà máy đóng tàu Giang Nam"
 CHN_integrate_major_dockyard_jiangnan_desc_key: "Nhà máy đóng tàu Giang Nam được thành lập vào năm 1865 để xây dựng, sửa chữa và bí mật cả tàu quân sự và dân sự. Nằm gần sông Dương Tử và nằm phần lớn trong cảng Thượng Hải hùng vĩ, Giang Nam là một trong những trung tâm đóng tàu hàng đầu ở Trung Quốc. Từ lâu dưới sự kiểm soát mạnh mẽ của chính phủ Bắc Dương, việc tạo ra các thành phố công sứ đã thay đổi đáng kể năng động. Tuy nhiên, họ đã được hưởng lợi từ đầu tư và chuyên môn bên ngoài, một cái gì đó chúng ta phải mang dưới sự kiểm soát của chúng ta cho một tương lai bình đẳng hơn."

 CHN_integrate_major_dockyard_mawei_key: "Hợp nhất Xưởng quân giới Phúc Châu"
 CHN_integrate_major_dockyard_mawei_desc_key: "Quân xưởng Phúc Châu, còn được gọi là Quân xưởng Phúc Châu hoặc Quân xưởng Mawei, được thành lập theo lệnh của các nhà lãnh đạo triều đại nhà Thanh quá cố Li Hongzhang và Zuo Zongtang cách sông Min vài dặm. Tận dụng di sản hải quân tự hào của Phúc Kiến và các học viện hải quân địa phương, quân xưởng Phúc Châu đã bổ sung cho khu vực bằng cách cung cấp một xưởng đóng tàu hải quân được thiết kế theo kiểu phương Tây, một lò rèn kim loại và các trường học bổ sung cho kỹ thuật hàng hải và hàng hải. Bị hư hại trong các cuộc chiến sau đó, nó đã được xây dựng lại và vẫn là một xưởng đóng tàu nổi bật mặc dù dưới sự kiểm soát của Công sứ quán. Sau khi đảm bảo sự trở lại của nó, chúng ta phải sử dụng nó với công suất tối đa để giúp chúng ta xây dựng một lực lượng hải quân hiện đại."

 CHN_integrate_major_dockyard_whampoa_key: "Tích hợp công ty Xưởng tàu Hoàng Phố"
 CHN_integrate_major_dockyard_whampoa_desc_key: "Công ty Đóng tàu Hồng Kông và Hoàng Phố được thành lập bởi Douglas Lapraik và Thomas Sutherland vào năm 1866. Thường được viết tắt là Xưởng tàu Hoàng Phố hoặc Xưởng tàu Cửu Long, nó có hiệu quả độc quyền đóng tàu ở Đồng bằng sông Châu Giang trong suốt những năm 1870. Khu vực Quảng Châu theo truyền thống là một trung tâm thương mại bên ngoài, và vị trí của nó khiến nó trở thành một tài sản và một mục tiêu ở Biển Đông. Chúng ta sẽ tích hợp các cơ sở mới mua này vào hải quân của chúng ta."

 CHN_integrate_major_dockyard_dagu_key: "Tích hợp Đại Cô Nhà máy đóng tàu"
 CHN_integrate_major_dockyard_dagu_desc_key: "Được thành lập vào năm 1880 bởi Li Hongzhang ở Đại Cô, Nhà máy đóng tàu Đại Cô ban đầu chỉ được giao nhiệm vụ sửa chữa tàu cho Hạm đội Bắc Dương. Hai năm sau, nó bắt đầu sản xuất tàu chiến và vào năm 1891, nó thậm chí còn sản xuất vũ khí như súng hải quân. Bị chiếm đóng vào năm 1900 bởi các cường quốc và trở về Trung Quốc hai năm sau đó, Nhà máy đóng tàu Đại Cô vẫn nổi bật trong Thời đại Warlord. Nó cũng đáng chú ý vì đã sản xuất súng máy được thiết kế của châu Âu cho Bộ Hải quân."

 CHN_integrate_major_dockyard_fallback_key: "Tích hợp các nhà máy đóng tàu chính tại [FROM.GetName]"
 CHN_integrate_major_dockyard_fallback_desc_key: "[FROM.GetName] đã trở thành một trung tâm xây dựng hải quân, với một bộ sưu tập mạnh mẽ của các ụ tàu, nhà máy đóng tàu và trung tâm đào tạo cho nhân viên hải quân. Đã trở thành bậc thầy mới nhất của nó, điều quan trọng là chúng ta tận dụng tối đa chuyên môn của họ vì lợi ích của quốc gia."

#Shared Industry Decisions
 CHN_build_guangxi_arsenal: "Xây dựng kho vũ khí Quảng Tây"
 CHN_build_guangxi_arsenal_desc: "Là một trong những tỉnh nghèo nhất Trung Quốc, Quảng Tây hầu như không phải là nơi thích hợp cho công nghiệp hóa. Quân xưởng Quảng Tây là đứa con tinh thần của cả Lý Tông Nhân và Huang Shaohong để tổ chức lại các nhà máy sản xuất vũ khí hiện có của Quảng Tây - cho đến khi tiếp quản New Quảng Tây Clique chỉ sản xuất súng đất \" chất lượng kém \" hoặc súng trường gần cổ khác. Lấy cảm hứng từ các mẫu súng trường của Đoàn Vân Nam, Quân xưởng Quảng Tây mới mở tìm cách sản xuất súng trường, thuốc súng, bom, lựu đạn, súng máy và thậm chí cả bản sao bom và đạn cối của Đức."

 CHN_refurbish_the_shijing_arsenal: "Cải tạo kho vũ khí Thạch Tỉnh"
 CHN_refurbish_the_shijing_arsenal_desc: "Được thành lập vào năm thứ 11 dưới triều đại của Hoàng đế Quảng Châu, Cục Máy móc Quảng Châu ban đầu được sáp nhập vào Cục Vũ khí Zengbu và trở thành Cục Sản xuất Đông. Một sản phẩm của Phong trào Tây phương hóa, phần lớn thiết bị và máy móc của nhà máy đã được quản lý bởi các kỹ sư người Đức - một di sản vẫn không thay đổi với ảnh hưởng của Đức ở Trung Quốc phổ biến sau chiến thắng của Đức trong Weltkreig. Tuy nhiên, kho vũ khí đang bắt đầu thể hiện tuổi tác của nó và chúng ta nên cung cấp sự tích cực của mình trong việc duy trì và tân trang kho vũ khí để phù hợp với sản xuất súng hiện đại hơn - cho phép chúng ta sản xuất nhiều hơn là súng trường mà còn cả súng máy hạng nhẹ."

 CHN_build_guangxi_aircraft_assembly_plant: "Xây dựng nhà máy lắp ráp máy bay Quảng Tây"
 CHN_build_guangxi_aircraft_assembly_plant_desc: "Với quá trình công nghiệp hóa đang được tiến hành tốt ở tỉnh Quảng Tây nông thôn, nghèo nàn, nhiều quan chức hàng đầu trong Hội Quảng Tây mới, cụ thể là Bạch Sùng Hy và Huang Xuchu, đã nỗ lực để Quảng Tây trở thành bước đầu tiên trong việc hiện đại hóa năng lực quân sự của Trung Quốc. Giám sát việc xây dựng Nhà máy lắp ráp máy bay \" Quảng Tây mới được đặt tên \", rất hy vọng rằng việc mở rộng năng lực quân sự của chúng ta cuối cùng sẽ cho Trung Quốc cơ hội triển khai một hạm đội không quân hiện đại, nếu không phải bây giờ, ít nhất là trong tương lai."

 CHN_evacuate_military_industry: "Sơ tán ngành công nghiệp quân sự đến Hinterlands"
 CHN_evacuate_military_industry_desc: "Vì hầu hết các ngành công nghiệp nặng của Trung Quốc nằm xung quanh các khu vực ven biển của đất nước, mối đe dọa của một cuộc chiến tranh sẽ nhấn chìm bờ biển của chúng ta khiến các ngành công nghiệp của chúng ta gặp rủi ro. Trong thời gian khủng hoảng này, chúng ta sẽ tìm cách di chuyển và di dời các ngành công nghiệp vũ khí đến các khu vực bên trong của đất nước mà chúng ta kiểm soát - để bảo tồn việc sử dụng chúng cho các nỗ lực chiến tranh của chúng ta."

 CHN_evacuate_civilian_industry: "Sơ tán ngành công nghiệp dân sự đến Hinterlands"
 CHN_evacuate_civilian_industry_desc: "Vì hầu hết các ngành công nghiệp nặng của Trung Quốc nằm xung quanh các khu vực ven biển của đất nước, mối đe dọa của một cuộc chiến tranh sẽ nhấn chìm bờ biển của chúng ta khiến các ngành công nghiệp của chúng ta gặp rủi ro. Trong thời gian khủng hoảng này, chúng ta sẽ tìm cách di chuyển và di dời các ngành công nghiệp dân sự đến các khu vực bên trong của đất nước mà chúng ta kiểm soát - để bảo tồn việc sử dụng chúng cho các nỗ lực chiến tranh của chúng ta."
 CHN_war_time_relocation_tt: "§L Lấy trọng tâm này sẽ đưa ra quyết định §Y Di dời các ngành công nghiệp quân sự §! và §Y Di dời các ngành công nghiệp dân sự §! rẻ hơn! §!"

