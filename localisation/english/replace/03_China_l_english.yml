 ANQ_revolt_against_bonus_idea: "Tiến quân chống An Khánh"
 ANQ_revolt_against_bonus_idea_desc: "Từ sự tan rã định mệnh của Hội tám tỉnh đến cả Bắc Kinh và Nam Kinh treo cùng một biểu ngữ, An Khánh đã thống nhất Trung Quốc. Cuộc đấu tranh đẫm máu cho quyền lực để thống nhất Trung Quốc là tốn kém, nhưng người dân tỉnh An Huy đã kéo nó ra khi đối mặt với những tỷ lệ cược không thể.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 GXC_revolt_against_bonus_idea: "Tiến quân chống Lưỡng Quảng"
 GXC_revolt_against_bonus_idea_desc: "Mặc dù có nhiều thất bại và một cánh cửa quay vòng của chính phủ, Lưỡng Quảng đã hoàn thành mục tiêu hàng thập kỷ của họ về thống nhất Trung Quốc. Đây là một kỳ công khó khăn, đặc biệt hiếm đối với một chính phủ Trung Quốc ở miền Nam, nhưng người dân của hai Guangs (Quảng Đông và Quảng Tây), kéo nó ra khi đối mặt với tỷ lệ cược không thể.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 CHI_revolt_against_bonus_idea: "Tiến quân chống Quốc dân đảng"
 CHI_revolt_against_bonus_idea_desc: "Từ những ngọn núi của Phúc Kiến, đến Bầu trời xanh và Mặt trời trắng bay trên hầu hết Trung Quốc, Ủy ban Quốc dân đảng cánh tả đã hoàn thành Cách mạng Quốc gia. Đây là một kỳ công khó khăn, đặc biệt là xem xét sự khởi đầu du kích của Nổi dậy MinGan, nhưng Quân đội Cách mạng Quốc gia đã kéo nó ra khi đối mặt với những tỷ lệ cược bất khả thi.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 FNG_revolt_against_bonus_idea: "Tiến quân chống Phụng Thiên"
 FNG_revolt_against_bonus_idea_desc: "Trở về may mắn mang lá cờ năm màu từ Bắc Kinh đến Begonia Leaf, Phượng đoàn đã hoàn thành mục tiêu hàng thập kỷ của họ là thống nhất Trung Quốc. Cuộc đấu tranh đẫm máu cho quyền lực để thống nhất Trung Quốc là tốn kém, nhưng các dân tộc Đông Bắc đã kéo nó ra khi đối mặt với tỷ lệ cược không thể.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 HNN_revolt_against_bonus_idea: "Tiến quân chống Hồ Nam"
 HNN_revolt_against_bonus_idea_desc: "Từ sự tan rã định mệnh của Liên minh Tám tỉnh cho đến cả Bắc Kinh và Nam Kinh treo cùng một biểu ngữ, Hồ Nam đã thống nhất Trung Quốc. Cuộc đấu tranh đẫm máu để giành quyền lực cho sự thống nhất của Trung Quốc là tốn kém, nhưng các dân tộc Hồ Nam đã kéo nó ra khi đối mặt với những tỷ lệ cược không thể.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 KUM_revolt_against_bonus_idea: "Tiến quân chống người Kumul"
 KUM_revolt_against_bonus_idea_desc: "Đến lượt các sự kiện đáng ngạc nhiên, thậm chí không thể hiểu được, Chính phủ ở Hami, hay Kumul, đã thống nhất Trung Quốc. Cuộc đấu tranh đẫm máu để giành quyền lực cho sự thống nhất của Trung Quốc là tốn kém, và các nhà lãnh đạo của Kumuliks bây giờ thu thập chiến lợi phẩm của họ.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 LEC_revolt_against_bonus_idea: "Tiến quân chống Các Thành phố Công sứ"
 LEC_revolt_against_bonus_idea_desc: "Trước sự ngạc nhiên của nhiều khán giả, và nỗi kinh hoàng của nhiều người Trung Quốc, một ủy quốc tế đã được thành lập ở tất cả các Trung Quốc. cử này độc đáo của sự kiện đã để lại thực tế tất cả mọi người trên thế giới choáng váng, trong khi Ủy quốc tế tập hợp chiến lợi phẩm của nó.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 LEP_revolt_against_bonus_idea: "Tiến quân chống Nam Kinh"
 LEP_revolt_against_bonus_idea_desc: "Từ sự tan rã định mệnh của Hội tám tỉnh cho đến việc cả Bắc Kinh và Nam Kinh cùng treo một biểu ngữ, Hội Nam Kinh đã thống nhất Trung Quốc. Cuộc đấu tranh đẫm máu giành quyền lực để thống nhất Trung Quốc là tốn kém, và dường như sự kiểm soát của Đức đối với Trung Quốc sẽ kéo dài.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 MAN_revolt_against_bonus_idea: "Tiến quân chống Mãn Châu"
 MAN_revolt_against_bonus_idea_desc: "Với sự hỗ trợ vững chắc của các quân phiệt, nhà nước Mãn Châu đã phá vỡ cảnh thống nhất Trung Quốc bằng cách tự mình tiếp quản Vương quốc Trung tâm. Cả tiếng nói trong nước và quốc tế đều lộn xộn, tranh luận liệu sự lặp lại này của Trung Quốc có thể được coi là một Trung Quốc hay không.\n\nTrong mọi trường hợp, chính phủ Mãn Châu vấp phải một loạt rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những người thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng quân đội của họ đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 QIE_manchu_revolt_against_bonus_idea: "Tiến quân chống nhà Thanh"
 QIE_manchu_revolt_against_bonus_idea_desc: "Mặc dù có nhiều khó khăn, và thậm chí là một cuộc đảo chính được cố gắng bởi những người bảo trợ của họ, Trực Lệ, triều đại Aisin-Gioro đã giữ lại Thiên mệnh của họ, và hoàng đế đã thống nhất Trung Quốc dưới ngai vàng ngọc bích của mình một lần nữa kể từ Cách mạng Tân Hợi. Trong khi nhà Thanh luôn là một đối thủ phổ biến cho Trung Quốc, họ đã gặp phải, và vượt qua từng trở ngại cho đến khi dường như không còn gì.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 QIE_zhili_revolt_against_bonus_idea: "Tiến quân chống Trực Lệ"
 QIE_zhili_revolt_against_bonus_idea_desc: "Bất chấp nhiều khó khăn, Trực hệ đã thống nhất Trung Quốc trong tầm nhìn của họ, và cuối cùng Thống chế Ngọc Cảnh đã thống nhất Trung Hoa dưới ngón tay cái của ông. Trong khi Trực hệ luôn là một ứng cử viên nổi tiếng cho Trung Quốc, họ đã gặp phải và vượt qua từng trở ngại cho đến khi dường như không còn ai.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 SHX_revolt_against_bonus_idea: "Tiến quân chống Sơn Tây"
 SHX_revolt_against_bonus_idea_desc: "Mặc dù có nhiều thất bại và một cánh cửa quay vòng của chính phủ, Sơn Tây đã hoàn thành mục tiêu hàng thập kỷ tuổi của họ thống nhất Trung Quốc. Đây là một kỳ công khó khăn, đặc biệt là khi tỉnh này từng là một trong những nơi kém phát triển nhất ở Trung Quốc, nhưng người dân Sơn Tây đã kéo nó ra khi đối mặt với tỷ lệ cược không thể.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 SIK_revolt_against_bonus_idea: "Tiến quân chống Tân Cương"
 SIK_revolt_against_bonus_idea_desc: "Đến lượt các sự kiện đáng ngạc nhiên, thậm chí không thể hiểu được, Tân Cương Clique đã thống nhất Trung Quốc. Cuộc đấu tranh đẫm máu cho quyền lực để thống nhất Trung Quốc là tốn kém, và các nhà lãnh đạo của Tân Cương bây giờ thu thập chiến lợi phẩm của họ.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 SHD_revolt_against_bonus_idea: "Tiến quân chống Sơn Đông"
 SHD_revolt_against_bonus_idea_desc: "Từ sự sụp đổ định mệnh của Liên minh Tám tỉnh cho đến cả Bắc Kinh và Nam Kinh cùng treo một biểu ngữ, Sơn Đông đã thống nhất Trung Quốc. Cuộc đấu tranh đẫm máu để giành quyền lực cho sự thống nhất của Trung Quốc là tốn kém, nhưng người dân Sơn Đông đã kéo nó ra khi đối mặt với những tỷ lệ cược không thể.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 SZC_revolt_against_bonus_idea: "Tiến quân chống Tứ Xuyên"
 SZC_revolt_against_bonus_idea_desc: "Mặc dù có nhiều thất bại và một cánh cửa quay vòng của chính phủ, Tứ Xuyên đã hoàn thành mục tiêu hàng thập kỷ của họ về thống nhất Trung Quốc. Đây là một kỳ công khó khăn, đặc biệt hiếm đối với một chính phủ miền Nam Trung Quốc, nhưng người dân Tứ Xuyên kéo nó ra khi đối mặt với tỷ lệ cược không thể.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 TAI_revolt_against_bonus_idea: "Tiến quân chống Đài Loan"
 TAI_revolt_against_bonus_idea_desc: "Với sự hỗ trợ vững chắc của các chúa tể, nhà nước Đài Loan đã phá vỡ cảnh thống nhất Trung Quốc bằng cách tự mình tiếp quản Vương quốc Trung tâm. Cả tiếng nói trong nước và quốc tế đều lộn xộn, tranh luận liệu sự lặp lại này của Trung Quốc có thể được coi là một Trung Quốc hay không.\n\nTrong mọi trường hợp, chính phủ Đài Loan vấp phải một loạt rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những người thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 XSM_revolt_against_bonus_idea: "Tiến quân chống tập đoàn Mã gia"
 XSM_revolt_against_bonus_idea_desc: "Đến lượt các sự kiện đáng ngạc nhiên, thậm chí không thể hiểu được, bè lũ Mã đã thống nhất Trung Quốc. Cuộc đấu tranh đẫm máu để giành quyền lực cho sự thống nhất của Trung Quốc là tốn kém, và gia đình Ma bây giờ thu thập chiến lợi phẩm của họ.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 YUN_revolt_against_bonus_idea: "Tiến quân chống Vân Nam"
 YUN_revolt_against_bonus_idea_desc: "Mặc dù có nhiều thất bại và một cánh cửa quay vòng của chính phủ, Vân Nam đã hoàn thành mục tiêu hàng thập kỷ của họ về thống nhất Trung Quốc. Đây là một kỳ công khó khăn, đặc biệt hiếm đối với một chính phủ miền Nam Trung Quốc, nhưng người dân Vân Nam đã kéo nó ra khi đối mặt với tỷ lệ cược không thể.\n\nNhưng họ ăn mừng quá sớm. Say sưa với quyền lực của mình, họ vấp phải một loạt các rào cản cuối cùng khi các chính phủ khu vực ở ngoại vi trở nên thất vọng. Tập hợp những người ủng hộ của họ chống lại sự lạm dụng nhận thức, những kẻ thách thức này tiến hành một chiến dịch để lật đổ những người cai trị sẽ là Trung Quốc. Thành công của họ xoay quanh khả năng của quân đội của họ để đối đầu với quân đội trung ương mới và với các biểu ngữ được nâng lên, họ hành quân đến chiến tranh."

 CHN_return_to_the_world_stage_idea: "Trở lại vũ đài thế giới"
 CHN_return_to_the_world_stage_idea_desc: "Trung Quốc đã từng là một bá chủ vĩ đại ở phương Đông, bị hạ thấp bởi sự trì trệ trong nước và chủ nghĩa đế quốc nước ngoài. Sau khi thống nhất thành công Trung Quốc theo các điều khoản riêng của mình, Trung Quốc hiện đang tự do bắt đầu ghép lại Đế chế cũ - từng bước một."

 CHN_return_to_the_world_stage_asia_pacific_treaty_organisation_idea: "Trở lại vũ đài thế giới"
 CHN_return_to_the_world_stage_asia_pacific_treaty_organisation_idea_desc: "Trung Quốc tìm cách quay trở lại vị trí truyền thống của mình là \" Anh cả \" của Đông Á, và như một phần trong nỗ lực của chính phủ mới để bảo vệ các nền dân chủ châu Á đang chớm nở, họ đã áp dụng cách tiếp cận can thiệp hơn đối với chính sách đối ngoại, sẵn sàng triển khai lực lượng gìn giữ hòa bình ở nước ngoài."

 CHN_return_to_the_world_stage_2_idea: "Rồng gầm vang"
 CHN_return_to_the_world_stage_2_idea_desc: "Trung Quốc đã trở lại vị trí truyền thống của mình là bá chủ phương Đông vĩ đại, rũ bỏ giấc ngủ của nó và đẩy lùi các ảnh hưởng nước ngoài khỏi biên giới truyền thống của nó. Khi họ làm việc để tái tạo phạm vi ảnh hưởng cũ của mình, họ đã chứng tỏ sẵn sàng hành xử hiếu chiến hơn với các cường quốc đối thủ - tranh chấp quyết liệt các lĩnh vực ảnh hưởng hiện có ở châu Á và Thái Bình Dương."

 CHN_invite_into_east_asian_community: "Mời [FROM.GetNameDef] vào Cộng đồng Đông Á"
 CHN_invite_into_east_asian_community_desc: "Gần đây chúng ta đã tổ chức lễ gia nhập [FROM.GetNameDef] vào [ROOT.GetFactionName] và với sự hợp tác mở rộng của chúng ta, sẽ là khôn ngoan khi đề xuất mở rộng mối quan hệ của chúng ta để bao gồm các dự án kinh tế chung bổ sung sẽ đưa toàn bộ lục địa xích lại gần nhau hơn."

 CHN_east_asian_community_shared_intro: "Thống nhất Trung Quốc đã cho phép chính phủ huy động nền kinh tế rộng lớn của mình một lần nữa trở thành trung tâm thương mại ở phương Đông. Nó đã chuyển sang tìm kiếm một khối thương mại mà nó hy vọng sẽ đoàn kết các quốc gia châu Á và Thái Bình Dương hậu thuộc địa khác nhau và cho phép họ xây dựng các nền kinh tế độc lập từ châu Âu."

 CHN_east_asian_community_founder_level_1_idea: "Cộng đồng Đông Á"
 CHN_east_asian_community_founder_level_1_idea_desc: "$CHN_east_asian_community_shared_intro$\n\nTất nhiên, với tư cách là nước sáng lập và nền kinh tế lớn nhất trong khối này, Trung Quốc được hưởng một vị trí đặc quyền trong hệ thống kinh tế này."

 CHN_east_asian_community_founder_level_2_idea: "$CHN_east_asian_community_founder_level_1_idea$"
 CHN_east_asian_community_founder_level_2_idea_desc: "$CHN_east_asian_community_founder_level_1_idea_desc$ Khối thương mại này và các chương trình phát triển kinh tế liên quan cũng đã mở rộng để bao gồm trao đổi văn hóa và học thuật."

 CHN_east_asian_community_founder_level_3_idea: "Trung tâm Liên bang Thế giới"
 CHN_east_asian_community_founder_level_3_idea_desc: "$CHN_east_asian_community_shared_intro$\n\nSau khi đưa các cường quốc thế giới vào liên bang của mình, Trung Quốc có thể sắp xếp lại hoàn toàn thương mại toàn cầu xung quanh chính nó."

 CHN_east_asian_community_member_idea: "Thành viên Cộng đồng Đông Á"
 CHN_east_asian_community_member_idea_desc: "$CHN_east_asian_community_shared_intro$\n\nLà một quốc gia thành viên, chúng ta được hưởng lợi từ các khoản đầu tư của Trung Quốc tuy nhiên nó cũng đòi hỏi chúng ta phải mở cửa nền kinh tế của mình cho đầu tư Trung Quốc."

 CUF_chinas_last_stand_idea: "Tuyên ngôn: Trận chiến cuối cùng của Trung Quốc"
 CUF_chinas_last_stand_idea_desc: "Với tình hình ở mặt trận xấu đi và lưng của họ chống lại một bức tường, người dân Trung Quốc đã tham gia vào một cuộc phản công giận dữ với hy vọng buộc những kẻ xâm lược ra khỏi tỉnh nhà của họ. Chủ nghĩa khu vực từ lâu đã chia rẽ Trung Quốc hiện đang đóng vai trò là các nhóm quân phiệt không có nơi nào để rút lui để củng cố phòng thủ của họ."

 CUF_call_of_the_united_front_idea_1: "Lời kêu gọi của Mặt trận Thống nhất: §GĐầy cảm hứng§!"
 CUF_call_of_the_united_front_idea_1_desc: "Sự bùng nổ của chiến tranh và sự hình thành của Mặt trận Thống nhất Trung Quốc đã truyền cảm hứng cho một làn sóng yêu nước trên các dòng tư tưởng, khu vực và giai cấp. Các tình nguyện viên đã tràn ngập cả vai trò quân sự và dân sự khi đàn ông và phụ nữ tìm kiếm cơ hội thể hiện lòng trung thành của họ với một Trung Quốc tự do cả trên chiến trường và trên mặt trận quê hương. Những tân binh mới, cựu chiến binh dày dạn và các tướng lĩnh cũ đều háo hức nhìn thấy chiến trường và vinh quang đang chờ đón một cường quốc.\n\nCông dân dám chuẩn bị các nhóm đảng phái và mạng lưới gián điệp đằng sau đường kẻ thù khi trước đây người dân Trung Quốc mệt mỏi chiến tranh đoàn kết đằng sau một nguyên nhân lần đầu tiên trong một thời gian dài. Cuộc xung đột đã giải phóng một năng lượng dân tộc hiếm hoi nhưng vẫn còn phải xem liệu sự lạc quan này có tồn tại khi tiếp xúc với kẻ thù hay không."

 CUF_call_of_the_united_front_idea_2: "Lời kêu gọi của Mặt trận Thống nhất: §gHoảng sợ§!"
 CUF_call_of_the_united_front_idea_2_desc: "Sự bùng nổ của chiến tranh và sự hình thành của Mặt trận Thống nhất Trung Quốc làm cho dân chúng háo hức chiến thắng chống lại các cường quốc nước ngoài, nhưng những thất bại trên chiến trường ngày càng tăng đã nhắc nhở đất nước về thực tế tàn bạo của cuộc xung đột. Tuy nhiên, một thành phố lớn khác đã rơi vào tay kẻ xâm lược nước ngoài, làm lạnh tâm trạng và buộc quân đội và dân thường phải sơ tán đến một tuyến phòng thủ bên trong.\n\nDân chúng đã sợ hãi bởi những tổn thất này, nhưng đã không từ bỏ. Nó đã đẩy họ vào một sự điên cuồng đổ lỗi - cả về phía các nhà lãnh đạo tham nhũng và bất tài của chính họ và cả về phía những kẻ xâm lược nước ngoài. Chủ nghĩa cuồng tín đã tăng lên trong quân đội và giữa các nhóm du kích hiện đang ngày càng hoạt động ở những vùng đất rộng lớn bị chiếm đóng của Trung Quốc. Cuộc chiến vẫn tiếp tục."

 CUF_call_of_the_united_front_idea_3: "Lời kêu gọi của Mặt trận Thống nhất: §oTuyệt vọng§!"
 CUF_call_of_the_united_front_idea_3_desc: "Sự bùng nổ của chiến tranh và sự hình thành của Mặt trận Thống nhất Trung Quốc đại diện cho một nỗ lực bền bỉ của Trung Quốc tự do để giữ ra chống lại các tỷ lệ cược nhưng cuộc chiến đã hầu như không đi theo cách họ hy vọng. Thất bại Battlefield đã trở thành routs và với sự sụp đổ của một thành phố lớn, tình hình đã trở nên rất thảm khốc.\n\nMặc dù vậy, một quyết tâm nghiệt ngã đã được đặt ra khi các chính phủ và quân phiệt còn lại chuẩn bị chiến đấu cho đến cuối cùng cay đắng ở những vùng đất mà họ vẫn kiểm soát. Trong khi đã có trường hợp đào ngũ, những người còn lại vẫn nguy hiểm như bao giờ hết. Không thể giành chiến thắng thông qua chiến tranh thông thường, nhiều người (bao gồm một số túi binh sĩ chính quy có đơn vị tan chảy) chuyển sang nổi dậy tàn bạo khi chiến tranh của Trung Quốc đạt đến thời điểm tuyệt vọng. Họ chỉ có thể hy vọng nỗ lực mương cuối cùng này có thể xoay chuyển thủy triều của cuộc chiến."

 CHN_devastation_of_dongbei_shared: "Đông Bắc Trung Quốc (còn được gọi là Dongbei hoặc Mãn Châu) là một trong những khu vực thịnh vượng nhất của Trung Quốc, là một trong những khu vực đầu tiên công nghiệp hóa và là một giỏ bánh mì lớn. Chiến tranh đã gây ra thiệt hại không kể xiết cho ngành công nghiệp nặng nổi tiếng của họ và di dời hàng triệu người. Cướp bóc bằng cách tiến quân và rút lui quân đội, việc kết hợp nhân sự từ chế độ cũ, bọn cướp và quân nổi dậy lang thang, chiếm đoạt tài sản của kẻ thù đang diễn ra và việc cài đặt quản lý mới trong khu vực đã gây ra sự hỗn loạn đáng kể."

 CHN_devastation_of_dongbei_normal_idea: "Sự tàn phá tại Đông Bắc: §YTái thiết toàn diện§!"
 CHN_devastation_of_dongbei_normal_idea_desc: "$CHN_devastation_of_dongbei_shared$\n\nChính phủ mới đang nghiêm túc và kỹ lưỡng giám sát việc tái thiết Dongbei. Mặc dù ràng buộc để yêu cầu nguồn lực đáng kể trong ngắn hạn, trong dài hạn nó sẽ là một lợi ích lớn cho sự thống nhất quốc gia."

 CHN_devastation_of_dongbei_minimal_idea: "Sự tàn phá tại Đông Bắc: §RTái thiết tối thiểu§!"
 CHN_devastation_of_dongbei_minimal_idea_desc: "$CHN_devastation_of_dongbei_shared$\n\nChính phủ mới đã rút phần lớn lực lượng ưu tú của họ khỏi khu vực, từ bỏ nó một cách hiệu quả cho dân quân địa phương và giới tinh hoa, đôi khi thậm chí bao gồm cả các sĩ quan từ trật tự cũ. Điều này chắc chắn sẽ gây ra vấn đề với hội nhập."

 CHN_devastation_of_dongbei_accelerated_idea: "Sự tàn phá tại Đông Bắc: §GĐẩy nhanh tái thiết§!"
 CHN_devastation_of_dongbei_accelerated_idea_desc: "$CHN_devastation_of_dongbei_shared$\n\nChính phủ mới đã tìm cách đưa khu vực đi nhanh chóng, giải tán tất cả các lực lượng khỏi chế độ cũ và cài đặt các quan chức của chính họ trong một chiến dịch nhanh chóng để chinh phục khu vực. Sự vội vàng này chắc chắn sẽ tốn kém và gây gián đoạn cho nền kinh tế."

 ### Events ###

 #Reusable loc
 #fengtian_events.284.t: "[From.GetNameDefCap] Demands Integration!"
 #fengtian_events.284.d: "The Central Government under [FROM.GetLeader] has demanded that we formally relinquish control of our armies and territory. While [ROOT.GetLeader] and his subordinates will be permitted to retain their current titles and positions, there is no way to know what the future might bring. On the one hand surrendering most of our autonomy would be the patriotic thing to do, and perhaps the safest in the short term. On the other hand, freedom is sweet."
 #fengtian_events.284.a: "For a United China! (Play as [From.GetNameDef])"
 #fengtian_events.284.b: "We shall not submit."

 #chi_for.102.t: "The Kuomintang Threaten Our Treaty Ports!"
 #chi_for.102.d: "The Kuomintang have long been a menace to our interests in East Asia, receiving extensive support from Syndicalist powers and riling up the people with their socialist, nationalistic messaging. Our intervention to save China from syndicalist rule in the 1920s was supposed to bring peace, but it seems that it has only bought them a decade to prepare - an opportunity squandered by our various allies in the continent. Emerging from their hiding places in Fujian, they have spent the last few years dismantling the hard work we have put in building a security architecture capable of keeping the Japanese and Syndicalists out.\n\nNow they are at our gates, demanding that we hand over all concessions we have in their \"integral territories\" lest there be war. Although perhaps it would be easy to acquiesce to these threats, it would be a great shame for our nation. Qingdao was a small fishing village when we first arrived and received a 99 year lease, and it was through a tremendous investment by our admiralty that it has become a modern port that it is today. And if it wasn't for us, it would've been seized by the Japanese during the Weltkrieg. To lose Qingdao and the other territories would truly mark the end of the age of German influence in the region."
 #chi_for.102.a: "Cede them, the lease was only good for another few decades anyway."
 #chi_for.102.b: "55 days to Peking."
 #
 #chi_for.103.t: "German Cities Are Ceded!"
 #chi_for.103.d: "The Germans have caved into our demands, and vacated their port cities! Before our troops could even arrive to finalise the arrangement, local crowds have begun to form to witness this momentous event in Chinese history. The handover was, however, peaceful with the German flag being lowered in solemn ceremonies before the last of the German ships left each harbour. President [Root.GetLeader] decided to go to Qingdao to observe the occasion, delivering a speech as the Blue Sky, White Sun, and a Wholly Red Earth was raised over the harbour. Many foreign businesses have elected to liquidate their assets rather than deal with our government, despite our assurances that there will be no violence - proof that they only serve themselves. All across China, the people are jubilantly celebrating this great victory over imperialism, and our legitimacy is as solidified as ever!"
 #chi_for.103.a: "Great!"
 #
 #chi_for.104.t: "Germany Stands their ground!"
 #chi_for.104.d: "Citing the illegitimacy of our government, prior treaties, and the continuing \"Syndicalist\" activities in our lands, the Germans have bristled at our demand to hand over the treaty ports. If anything, they have increased the fortifications of their territories, putting their troops on high alert and declaring the need to protect the citizens under their protection from the \"Red Menace\". We have word that their fleet and whatever forces they can muster are being deployed in effort to buttress their defences.\n\nIt hardly matters however, at least for many of our high command and leading anti-Imperialist thinkers. Ever since the Germans' intervention during the northern expedition, many have held a grudge - waiting for the day to avenge their fallen comrades. It should come as no surprise that the Dare-to-Die units amassing outside the concessions have been overflowing with volunteers as [CHI.GetLeader] and their cabinet makes their decision."
 #chi_for.104.a: "We wait for a better opportunity!"
 #chi_for.104.b: "Mobilise the troops!"

 #chi_for.105.t: "[From.GetName] Attack Macau!"
 #chi_for.105.d: "Early this morning Kuomintang troops began an attack on the outer fortifications of Macau, flagrantly violating our territorial integrity and international law! A major port held by our nation since Portuguese merchants first settled the area near the Pearl River. Formally rented from the Chinese government after an agreement in 1557, Macau has since become a major city and the embodiment of what a successful Sino-Portuguese cooperation could look like.\n\nInstead however, the new red government has elected to throw all of that away in favour of violence, threatening a broader war. Although they claim to be \"liberators\", we point out that many refugees fleeing the socialist menace have fled into our concession - showing how little legitimacy their government has. On the other hand however, our forces are stretched fairly thin, and Macau is a long way from the metropole. The local Governor and military authorities have begun sending urgent telegrams asking for instructions on what to do next."
 #chi_for.105.a: "Put up a token resistance, then surrender."
 #chi_for.105.b: "We will fight them!"

 #chi_for.106.t: "Portugal Surrenders Macau!"
 #chi_for.106.d: "Excellent news! Portuguese forces, facing our overwhelming superiority, surrendered control of Macau soon after our attack began. Both sides took few casualties, and we have released all prisoners to return home unmolested. Within a few days, the national flag could be seen in buildings all across the city, showing once and for all that the city is ours! This victory, done with as little violence or costly fighting, is proof of the growing strength of the Chinese people and is one great step towards reversing the humiliation our nation has experienced. In a speech today [Root.GetLeader] declares this a triumph against imperialism and proof that under the auspices of the Kuomintang, China will once again be reunited."
 #chi_for.106.a: "Great!"

 #chi_for.107.t: "The War for Macau!"
 #chi_for.107.d: "The Portuguese have stubbornly and foolishly decided to fight for control of Macau. Citing a litany of ancient treaties and various testimonies of reactionaries and warlords that have holed up in their concession of \"Socialist abuses\", they have made it clear that our attempt to take back Macau means war. We are, however, unbowed. The Chinese people are behind us, behind our revolution, behind our principles. The imperialists have stolen our land and exploited our people for centuries now, and Macau was perhaps one of the first instances of Chinese land being taken by force. With banners raised, we go forward for the liberation of the people from Portuguese domination!"
 #chi_for.107.a: "Onwards!"

 #lngupc.31.t: "[From.GetName] Demands Integration!"
 #lngupc.31.d: "With intensified anti-imperialist rhetoric, [FROM.GetLeader] has made it clear that our uncertain status cannot be maintained any longer. While the municipalities under our control are guaranteed to have autonomy under the Chinese Constitution, we are to be returned to direct control of the Chinese Federal Government with the Unequal Treaties declared null and void."
 #lngupc.31.a: "We shall join the reunited China. (Play as [From.GetName])"

 #chi_for.21.t: "An Ultimatum from the KMT"
 #chi_for.21.d: "Ever since the Hong Kong incident in 1925, the international community looked with suspicion on the Kuomintang - fearing their radical socialist and nationalistic tendencies. Their defeat in the Northern Expedition was supposed to extinguish the threat for good, and the establishment of the Legation Cities was meant to ensure a peaceful and cooperative future with the Chinese. When reports of a KMT insurgency emerging in the mountains first came in, Sun Chuanfang and the league were supposed to handle it, holding up their end of the bargain. How wrong we were.\n\nThe uprising of the KMT remnant overtook the League all too quickly in 1936, and since then we have watched in trepidation as the socialist army marched across China - no doubt backed by Syndicalist powers. Multiple attempts to stop this red tide by native Chinese forces have failed, and our commanders had begun preparing for the inevitable.\n\nThings have finally come to a head today. Emboldened by their successes, KMT agitators staged a series of protests and strikes across our cities - a flimsy pretext to invade. We have received a final ultimatum personally signed by [CHI.GetLeader], demanding that transfer over control of our concessions over to their authorities - which would mark the end of the Legations.\n\nGiven the overwhelming power of the nationalist government, our administration is divided. Some say we would be better off cutting our losses and leaving, while others argue that the powerful defence we have erected and the loyalty we have gained from the locals (joined by those fleeing the KMT's advance) will be sufficient to hold them off until foreign reinforcements arrive. Finally, the council arrives at a decision..."
 #chi_for.21.a: "They made us an offer we can't refuse."
 #chi_for.21.b: "Great Powers will protect us."
 #
 #chi_for.22.t: "Reply from Legation Cities"
 #chi_for.22.d1: "The Legation Cities have agreed to finally rejoin China after oppressing the Chinese citizens there for many years, places like Hong Kong and Shanghai haven't truly been free for decades with generations living and dying under European yoke. Now with the key cities under our control, they can, at last, be free from European colonialism."
 #chi_for.22.d2: "The Legations have refused our just demands and have pleaded with Europe for protection, this won't save them when our armies are read. The only question is, should we go as far as to attack them?"
 #chi_for.22.a: "Goodbye, the imperialists."
 #chi_for.22.b: "The imperialists are not credible."

 #lngkmt.12.t: "Request from the Central Committee"
 #lngkmt.12.d: "The reorganised Central Committee of the Kuomintang in Guangzhou has sent a simple request that we rejoin their ranks. This means putting ourselves under their command and supervision. For the good of the nation, of course."
 #lngkmt.12.a: "Of course. For the Republic!"
 #lngkmt.12.b: "This is encroaching on our autonomy!"
 #
 #lngkmt.13.t: "[FROM.GetLeader] Refuses our Request"
 #lngkmt.13.d: "The treacherous dogs in [FROM.GetNameDef] have refused to comply! They have essentially refused to recognise the authority of the Central Committee and they shall receive the punishment befitting traitors."
 #lngkmt.13.a: "They will pay."
 #
 #lngkmt.14.t: "[FROM.GetLeader] Rejoins the Central Committee"
 #lngkmt.14.d: "Our friends in [FROM.GetNameDef] have, of course, accepted our request and have rejoined our ranks."
 #lngkmt.14.a: "For the Republic!"
 #
 #lngkmt.15.t: "Integration into the Republic of China"
 #lngkmt.15.d: "With the consolidation of the Central Government under the Kuomintang, we are to be integrated firmly into the Republic."
 #lngkmt.15.a: "We will work within."
 #
 #lngkmt.16.t: "[FROM.GetName] Integrated"
 #lngkmt.16.d: "The region under the control of [FROM.GetNameDef] has been integrated into the Republic. Our government should now be unopposed there."
 #lngkmt.16.a: "Excellent!"

### Chinese Alignment and Unification Events ###
 china_events.0.t.target: "[FROM.GetAdjective] Xâm lược sắp xảy ra"
 china_events.0.t.ally_of_target: "Sắp xảy ra [FROM.FROM.GetAdjective] Cuộc xâm lược của [FROM.GetName]"
 china_events.0.d.target: "Báo cáo từ biên giới chỉ ra rằng chúng ta sẽ sớm bị tấn công từ những người hàng xóm khốn khổ của chúng ta ở [FROM.GetName] . Không hài lòng với chính phủ của chúng ta, [FROM.GetLeader] đã chính thức tố cáo chúng ta trước một đám đông ở [FROM.Capital.GetCapitalVictoryPointName] . Kể từ đó, ngày càng có nhiều đơn vị tích lũy dọc theo biên giới. Các cuộc đụng độ nhỏ đã bắt đầu khi đối thủ của chúng ta thực hiện các cuộc tấn công thăm dò và căng thẳng tăng đột biến. Chúng ta phải nhanh chóng phòng thủ, kẻo chúng ta bị nghiền nát dưới sức nặng của kẻ thù."
 china_events.0.d.ally_of_target: "Chúng ta đã nhận được một cảnh báo từ các đồng minh của chúng ta trong [FROM.GetName] rằng một cuộc xâm lược từ [FROM.FROM.GetName] đang ở đường chân trời. Cả hai bên đã bắt đầu chuẩn bị cho một cuộc xung đột như biên giới ngày càng căng thẳng. Với nghĩa vụ trước đây của chúng ta đối với [FROM.GetName] , chúng ta có thể sẽ bị lôi kéo vào cuộc xung đột này. Chúng ta phải bắt đầu xáo trộn quân đội của riêng mình ngay lập tức - chúng ta hãy hy vọng rằng quyết định liên minh với [FROM.GetAdjective] của chúng ta không được thực hiện quá vội vàng."
 china_events.0.a: "Triệu tập bộ tổng tham mưu!"

 china_events.1.t: "[FROM.GetNameDefCap] Yêu cầu gửi của chúng ta"
 china_events.1.d: "Tự tin vào sức mạnh ngày càng tăng của họ hoặc có lẽ chỉ đơn thuần tìm cách dự báo nó trong những thời điểm rắc rối này, chúng ta đã nhận được một loạt các yêu cầu từ chính phủ [FROM.GetLeader] yêu cầu chúng ta công nhận ngay lập tức về thẩm quyền của họ. Điều này tự nhiên sẽ đòi hỏi việc đóng quân của quân đội, tuân thủ các nghị định của họ và có khả năng cống nạp thêm mà tự nhiên sẽ được gửi đến một chính phủ quốc gia.\n\nGọi bluff của họ tất nhiên, luôn luôn là một lựa chọn. Nó có thể sẽ có nghĩa là chiến tranh, mặc dù tự do khỏi chế độ chuyên chế thường đòi hỏi một mức giá như vậy. Đặc biệt là ở Trung Quốc thời warlord, quốc gia này là rải rác với các chính phủ thất bại người overstretched mình tấn công \" yếu \" và \" dễ bị tổn thương \" phe phái. Nộp cho bây giờ và chơi các trò chơi dài cũng là một lựa chọn là tốt."
 china_events.1.a: "Chúng ta chấp nhận yêu sách của họ."
 china_events.1.b: "Chúng ta quyết không khuất phục!"
 china_events.1.c: "Chúng ta là chính phủ chính danh của Trung Quốc!"

 china_events.2.t: "[FROM.GetNameDefCap] gửi đến Cơ quan của chúng ta"
 china_events.2.d: "Thấy vài lựa chọn tiềm năng để duy trì quyền tự chủ của họ và tin rằng chúng ta là lựa chọn tốt nhất của họ, chính phủ [FROM.GetLeader] đã đồng ý công nhận chúng ta là nhà cai trị hợp pháp của Trung Quốc. Khi làm như vậy, họ đã cam kết hài hòa luật pháp của họ với luật pháp của chúng ta, cung cấp quân đội cho các cuộc chiến của chúng ta và cam kết phối hợp hơn nữa trong các vấn đề quốc gia.\n\nĐổi lại, trên thực tế họ đã bảo tồn phần lớn chính phủ cũ của mình, cũng như các mạng lưới bảo trợ hoạt động bên dưới. Quân đội quân phiệt luôn được biết là khó sử dụng và bản thân các quân phiệt không đáng tin cậy. Việc hội nhập hơn nữa sẽ phải được thảo luận vào một ngày khác, mặc dù hiện tại vẫn còn hiệu quả."
 china_events.2.a: "Chúng ta là những nhà cầm quyền khoan dung."

 china_events.3.t: "[FROM.GetNameDefCap] Từ chối năng suất!"
 china_events.3.d: "Bất chấp những nỗ lực của chúng ta để giải quyết vấn đề một cách hòa bình, [FROM.GetLeader] đã chính thức từ bỏ những nỗ lực của chúng ta trong việc thúc đẩy sự thống nhất quốc gia và bắt đầu huy động các đơn vị [FROM.GetAdjective] trong một chương trình vũ lực để cố gắng ngăn chặn chúng ta. [FROM.GetLeader.GetSheHeCap] cũng đã đuổi tất cả các đại diện của chúng ta và tố cáo chính phủ của chúng ta là bất hợp pháp, lan truyền những lời nói dối hèn hạ như vậy trên khắp [FROM.Capital.GetCapitalVictoryPointName].\n\nĐương nhiên hành động của mình là một sự xúc phạm nghiêm trọng, nhưng quá trình tốt nhất của chúng ta hành động vẫn còn để được nhìn thấy. Với bản chất bướng bỉnh và hay thay đổi của các quân phiệt, từ chối luôn luôn trong thẻ. Nhưng thực thi ý chí của chúng ta trên [FROM.GetNameDef] sẽ yêu cầu phân bổ lực lượng có thể được chi tiêu ở nơi khác. Thời gian, như mọi khi, là tất cả mọi thứ."
 china_events.3.a: "Hãy bắt đầu xây dựng ở biên giới."
 china_events.3.b: "Bắt đầu cuộc tiến công ngay!"

 china_events.3000.t: "[FROM.GetName] Cung cấp một cuộc đình công chung chống lại [GXC.GetAdjective]"
 china_events.3000.d: "Một đề nghị đặc biệt nhất đã đến trên bàn của [ROOT.GetLeader] như gần đây. Trộn lẫn với các báo cáo sôi nổi về tình hình quốc gia là một bức điện được in tinh xảo từ Thống đốc nước láng giềng của [FROM.GetNameDef], [FROM.GetLeader]. Chỉ ra sự trung thành lẫn nhau với nguyên nhân chung của chúng ta, thúc đẩy sự thống nhất quốc gia, đảm bảo biên giới và tăng cường mối quan hệ lẫn nhau, Thống đốc quý đã đưa ra một cuộc đình công chung \" \" giữa [ROOT.GetLeader] và [FROM.GetLeader] hướng vào [GXC.GetLeader].\n\nTrong khi một triển vọng quan tâm sâu sắc, nó không chứng minh hoàn toàn rủi ro miễn phí. Đối với nó sẽ đẩy binh sĩ của chúng ta vào một cuộc chiến tranh có thể vô nghĩa về bản chất để nắm bắt hai tỉnh Quảng Tây và Quảng Đông vì sự nghiệp chung của chúng ta. Tương tự như vậy tuy nhiên, điều đó có thể mang lại lợi ích lớn cho đảng có thể đảm bảo và duy trì quyền kiểm soát của Quảng Châu, rất quan trọng đối với miền Nam của đất nước. hấp dẫn không kém là bản chất của lời đề nghị, vì nó chỉ tốt như giấy mà nó được in trên, và nếu tình hình thay đổi, có thể được gia hạn theo."
 china_events.3000.a: "Cánh tay trong cánh tay, chúng ta tiến về Quảng Đông!"
 china_events.3000.b: "Tôi chưa bao giờ tin tưởng [FROM.GetLeader]."

 china_events.3001.t: "[FROM.GetNameDefCap] trả lời cuộc gọi của chúng ta!" #YUN/HNN Accept
 china_events.3001.d: "Hầu hết các tin tức ngẫu nhiên! Nó sẽ xuất hiện lời kêu gọi của chúng ta để được hỗ trợ trong một chiến dịch trong tương lai chống lại [GXC.GetLeader] đã được đáp ứng với một thành công vang dội. Trao đổi pleasantries lớn với [ROOT.GetLeader] qua điện tín, và thông báo cho chúng ta những hiểu biết tích cực về kế hoạch của mình, [FROM.GetLeader] đã chính thức dành riêng lực lượng vũ khí của mình đối với cuộc chinh phục Quảng Đông. Bây giờ chúng ta chỉ phải lên kế hoạch cho cuộc xung đột trong tương lai, và hy vọng lời nói của ông giữ đúng."
 china_events.3001.a: "Sự khởi đầu của một cái gì đó vĩ đại hơn?"

 china_events.3002.t: "[FROM.GetName] Từ chối cuộc gọi của chúng ta!" #YUN/HNN Decline
 china_events.3002.d: "Tin tức thảm khốc đã đến bàn của Thống đốc! Nó sẽ xuất hiện lời kêu gọi viện trợ của chúng ta trong một chiến dịch trong tương lai chống lại [GXC.GetLeader] đã được đáp ứng với một thất bại vang dội. Trao đổi những lời vui vẻ tuyệt vời với [ROOT.GetLeader] qua điện tín, và thông báo cho chúng ta về những hiểu biết tích cực về kế hoạch của mình, [FROM.GetLeader] tuy nhiên từ chối cống hiến bất kỳ người đàn ông hoặc vật liệu hướng tới cuộc chinh phục Quảng Đông. Trích dẫn những nguy hiểm có thể xảy ra, sự bất ổn của quốc gia và sự ưu tiên cho sự ổn định bên trong trái ngược với việc mời xung đột hơn nữa, [FROM.GetLeader] đã ở lại ngắn tố cáo hành động đề xuất của chúng ta. Một mình khiêm tốn, chúng ta phải lên kế hoạch cho trận chiến trong tương lai mà không cần sự giúp đỡ của họ."
 china_events.3002.a: "Tôi cho rằng tôi không thể nói chúng ta thất vọng."

 china_events.3003.t: "Danh dự-ít [FROM.GetAdjective]" #YUN/HNN Refuse to enter after agreeing
 china_events.3003.d: "Có lẽ nó là quá nhiều để mong đợi sự chân thành và danh dự từ thời đại Warlord, nhưng nó vẫn tiếp tục thất vọng. Mặc dù các thỏa thuận trước đó, tập trận chung, và thậm chí cả việc soạn thảo chung của một kế hoạch chiến dịch dũng cảm đè bẹp [GXC.GetLeader] và chính thể bất hợp pháp của mình nằm trên biên giới lẫn nhau của chúng ta, nó sẽ xuất hiện rằng [FROM.GetLeader] đã phát triển suy nghĩ thứ hai trên đỉnh cao của sáng kiến. Hoặc không chuẩn bị để vứt bỏ cuộc sống, hoặc hoàn toàn không muốn ở nơi đầu tiên, [FROM.GetLeader] gần đây đã gửi điện [ROOT.GetLeader] , đảm bảo hứa hẹn rằng họ sẽ không can thiệp vào quá trình hành động của chúng ta, nhưng họ sẽ không còn hỗ trợ nó.\n\nTrong khi không phải vô căn cứ, nó đã phát triển cả hai thù địch lớn và tàn bạo trong hàng ngũ của chúng ta, với nhiều warmongers quan tâm hơn cho thấy một cuộc tấn công hai mũi nhọn. May mắn thay, [ROOT.GetLeader] dường như thậm chí không được xem xét như là một lựa chọn. Thay vào đó lời nói [FROM.GetLeader] dường như đã thực hiện một số loại ảnh hưởng, có lẽ ít nhất tình cảm. Nếu họ đang lùi ra, là có một số sự thật để lời nói của họ? Nó sẽ là khôn ngoan để xem xét lại một cuộc tấn công cho Quảng Châu?"
 china_events.3003.a: "Dù sao thì chúng ta cũng không cần họ!"
 china_events.3003.b: "Có lẽ có sự khôn ngoan trong hành động của họ."

 china_events.3004.t: "[YUN.GetNameDefCap] và [HNN.GetNameDef] chuẩn bị để huy động chống lại chúng ta!"
 china_events.3004.d: "Nó sẽ xuất hiện rằng vị trí của Lưỡng Quảng trong nước là đe dọa nhất đối với các nước láng giềng của nó, quan trọng nhất trong số đó là của [HNN.GetNameDef] và [YUN.GetNameDef]. Nằm ở phía bắc và phía tây trực tiếp, các vấn đề của Tây Nam thường bị chi phối bởi các sự kiện trong phạm vi Quảng Đông xoắn ốc ra về phía Hồ Nam và Vân Nam. Do đó, nó là tự nhiên cho Côn Minh và Trường Sa phải cảnh giác với sự xuất hiện trong Quảng Châu. Thấy dễ bị tổn thương có thể, hoặc có lẽ áp đảo tỷ lệ cược, [YUN.GetLeader] và [HNN.GetLeader] gần đây đã công bố một chiến dịch chính thức để đẩy [ROOT.GetLeader] từ \" ngồi xổm \" khi Quảng Đông.\n\nTrích dẫn sự ổn định ở phía Tây Nam, sự thống nhất của quốc gia và việc loại bỏ các tên cướp \" \", quân đội của Xiang và Dian đã tích lũy trên biên giới tỉnh lẫn nhau của chúng ta, trao đổi các cuộc đụng độ với các phân đội biên giới địa phương. Dường như chỉ là vấn đề thời gian trước khi các cuộc tấn công bằng xẻng, và trong trường hợp như vậy, bộ tổng tham mưu và binh lính chắc chắn phải được chuẩn bị."
 china_events.3004.a: "Hai chọi một? Tôi thích tỷ lệ cược đó."

 china_events.4.t: "[FROM.GetNameDefCap] Cung cấp một liên minh"
 china_events.4.d: "Chỉ vì chúng ta là chính phủ hợp pháp duy nhất của Trung Quốc không có nghĩa là chúng ta đi du lịch một mình. Có nhiều người đồng cảm với mục tiêu của chúng ta trên toàn quốc, chỉ chờ giải phóng. Đôi khi, tuy nhiên, họ quản lý để tự giải phóng trước.\n\n[FROM.GetLeader] dường như đã làm được điều đó, tập hợp [FROM.GetRulingParty] để giải phóng người dân [FROM.GetNameDef]. Phù hợp với nguyên nhân của chúng ta, hoặc ít nhất là họ tuyên bố, chúng ta đã chính thức nhận được kiến nghị của họ để tham gia nguyên nhân của chúng ta với tư cách là một chi nhánh địa phương."
 china_events.4.a: "Chúng ta vui lòng chấp nhận."
 china_events.4.b: "Chúng ta không thể tin họ."

 china_events.5.t: "[FROM.GetNameDefCap] Chấp nhận Liên minh của chúng ta"
 china_events.5.d: "Sau khi nghe kiến nghị của chúng ta để phù hợp với họ, chúng ta đã chính thức được chấp nhận vào hàng ngũ của [FROM.GetNameDef]. Thông tin liên lạc giữa các sĩ quan của chúng ta đang được thiết lập, và chúng ta sẽ làm việc chặt chẽ hơn đối với giải phóng dân tộc. [FROM.GetLeader] đã chính thức khen ngợi [ROOT.GetLeader] và [FROM.GetRulingParty] trong một bài phát biểu tại [FROM.Capital.GetCapitalVictoryPointName] vì những nỗ lực yêu nước của họ, làm sâu sắc thêm mối quan hệ của chúng ta. Mặc dù một chiến thắng nhỏ cho chúng ta ngày hôm nay, lịch sử sẽ nhớ đây là một bước quan trọng đối với tương lai của Trung Quốc."
 china_events.5.a: "Tiến lên, các đồng chí!"

 china_events.6.t: "[FROM.GetNameDefCap] Từ chối liên minh"
 china_events.6.d: "Bất chấp những nỗ lực chân thành của chúng ta tại đoàn kết dân tộc, bè phái hoang tưởng xung quanh [FROM.GetLeader] đã quyết định từ chối những nỗ lực của chúng ta tham gia phong trào của họ, đi xa như vậy để tố cáo chúng ta là hai mặt và đói quyền lực. Những lời buộc tội không công bằng này chỉ phục vụ để chứng minh sự thối rữa bên trong của chính họ, không thể tin tưởng người ngoài với quyền lực.\n\nChúng ta sẽ phải tìm cách riêng của chúng ta hướng tới giải phóng, độc lập với âm mưu [FROM.GetAdjective]. Khi làm như vậy, chúng ta mang di sản thực sự của Tân Hợi, một người không bị hỏng bởi các tua của [FROM.GetLeader]."
 china_events.6.a: "Nguyên nhân của họ không cao quý như người ta nói."

 china_events.7.t: "[FROM.GetNameDefCap] Mời chúng ta tham gia xếp hạng"
 china_events.7.d: "Ngay cả khi Trung Quốc ngày càng chia rẽ, vẫn có nhiều người trên khắp đất nước chia sẻ tầm nhìn chung cho tương lai của quốc gia. Những tinh thần đồng cảm này thường bị chia cắt bởi núi và sông, buộc phải chiến đấu trong các trận chiến khu vực của riêng họ để thống trị. Tuy nhiên, luôn luôn là một cảnh tượng dễ chịu khi các ngôi sao thẳng hàng và các đồng chí độc lập nắm quyền.\n\n[FROM.GetLeader] của [FROM.GetNameDef] đã xác định [ROOT.GetRulingParty] của chúng ta là một đồng minh trong nhiệm vụ giải phóng đất nước. [ROOT.GetLeader] đã được mời tham gia lực lượng, đưa Trung Quốc đến gần hơn với sự thống nhất mà không cần bắn một phát súng."
 china_events.7.a: "Chúng ta hoàn toàn tán thành."
 china_events.7.b: "Chúng ta không liên kết với nhau."

 china_events.8.t: "[FROM.GetNameDefCap] Tham gia Xếp hạng của chúng ta!"
 china_events.8.d: "Nhờ một phần vào nguồn gốc tương tự giữa [FROM.GetRulingParty] và [ROOT.GetRulingParty] của chúng ta, dường như các mục tiêu của chúng ta vẫn được liên kết trong những năm qua. [FROM.GetLeader] của [FROM.GetNameDef] đã đồng ý bắt đầu phối hợp các nỗ lực của chúng ta để thống nhất, hòa bình đưa [FROM.GetNameDef] vào nếp gấp [ROOT.GetAdjective].\n\nNếu may mắn, các lực lượng kết hợp của chúng ta sẽ đủ để mang lại giải phóng dân tộc thành công khỏi sự hỗn loạn và xung đột đã nhấn chìm nó. Với động lực về phía chúng ta, sức mạnh tổng hợp của các lực lượng của chúng ta sẽ tiếp tục tiến tới chiến thắng!"
 china_events.8.a: "Một sự nghiệp vì một dân tộc."

 china_events.9.t: "[FROM.GetNameDefCap] Từ chối liên minh của chúng ta!"
 china_events.9.d: "Mặc dù có nguồn gốc tương tự của [FROM.GetRulingParty] và [ROOT.GetRulingParty] của chúng ta, dường như mục tiêu của chúng ta đã phân kỳ qua nhiều năm. [FROM.GetLeader] của [FROM.GetNameDef] đã từ chối những nỗ lực của chúng ta trong việc thống nhất một cách hòa bình sự nghiệp của chúng ta chống lại kẻ thù lẫn nhau, thay vào đó chọn đi con đường riêng của họ.\n\nSự phản bội này chỉ có thể được giải thích bởi sự ích kỷ của chính họ và không có khả năng suy nghĩ vượt ra ngoài lợi ích riêng của họ. Dù trong trường hợp nào, dường như chúng ta phải chịu di sản thực sự của Tân Hải, và khắc một tương lai cho tất cả người dân Trung Quốc."
 china_events.9.a: "Kẻ phản bội [FROM.GetAdjective] ít nhất cũng phải tránh đường cho chúng ta."

 china_events.10.t: "[FROM.GetNameDefCap] nỗ lực để tăng tích hợp"
 china_events.10.d.integration_level_1: "Đã tuyên bố lòng trung thành của chúng ta với nguyên nhân [FROM.GetAdjective], người ta sẽ tin rằng một số niềm tin là theo thứ tự. Tuy nhiên, [FROM.GetLeader] khẳng định rằng những nỗ lực hơn nữa trong hội nhập là cần thiết để tiếp tục giải phóng dân tộc và nhấn mạnh vào việc giám sát hơn nữa trong các vấn đề nội bộ của chúng ta.\n\nHiện tại, điều này chỉ có nghĩa là số lượng thẩm phán [FROM.Capital.GetCapitalVictoryPointName] tăng nhẹ, nhưng bằng cách chấp nhận tình trạng sẽ thay đổi một cách tinh tế nhưng có thể cảm nhận được. Quyền tự chủ rộng rãi mà chúng ta đã tận hưởng cho đến nay sẽ bắt đầu bị sứt mẻ và nhiều người sẽ bắt đầu quay lưng lại với [ROOT.GetLeader] và hướng tới [FROM.GetLeader] để lãnh đạo. Có lẽ bây giờ là lúc để thoát ra và tiết kiệm sự độc lập của chúng ta."
 china_events.10.d.integration_level_2: "Chúng ta từ lâu đã được hưởng quyền tự chủ của chúng ta ở đây trong [ROOT.Capital.GetCapitalVictoryPointName] , xa con mắt tò mò của chính quyền trung ương. Điều này có nhiều cách làm cho mọi thứ hiệu quả hơn về mặt quản trị, mặc dù chúng ta không có nghĩa là ly khai hoặc khu vực (chứ không phải là những từ bẩn thỉu trong chính trị Trung Quốc). Tuy nhiên, dường như mọi thứ đang thay đổi.\n\nCác [FROM.GetRulingParty] hoạt động ra khỏi [FROM.GetNameDef] đã nhấn mạnh vào kiểm soát lớn hơn đối với hội đồng chính trị chủ yếu là tự trị của chúng ta. Họ nhấn mạnh vào việc kiểm soát một số chức năng nội bộ quan trọng, một cái gì đó mà chúng ta đã nghĩ sẽ được để lại một mình khi ban đầu chúng ta đồng ý tuân theo quy tắc [FROM.GetAdjective]. Tất nhiên, từ chối sẽ có hậu quả thảm khốc, nhưng chúng ta đang nhanh chóng tiếp cận bước ngoặt trong đó sẽ rất khó để thoát khỏi sự nắm bắt của [FROM.GetLeader]. Bây giờ chúng ta phải nghiêm túc suy ngẫm về những rủi ro và thành công của việc thoát khỏi sự nắm bắt của chính phủ mới được tuyên bố này."
 china_events.10.d.integration_level_3: "Các thành viên hàng đầu của [ROOT.GetRulingParty] đã bắt đầu lo lắng muộn, khi mạng lưới bảo trợ lâu dài của họ bị đe dọa bởi sự hiện diện ngày càng tăng của các đại lý [FROM.GetAdjective]. Có tin đồn rằng [FROM.GetRulingParty] đã bắt đầu thành lập trụ sở khu vực tại [ROOT.Capital.GetCapitalVictoryPointName], hy vọng xây dựng một cơ sở chính trị của riêng họ.\n\nĐiểm không quay trở lại gần, khi các thẩm phán từ chính quyền trung ương phát triển táo bạo hơn trong nỗ lực chinh phục chúng ta. Luật pháp được thông qua trong [FROM.Capital.GetCapitalVictoryPointName] , trước đây thường bị bỏ qua, hiện đang được thi hành với sức sống ngày càng tăng. Sớm muộn gì chúng ta cũng sẽ không là gì khác ngoài một tỉnh khác dưới sự bảo trợ của [FROM.GetRulingParty] . Chúng ta không có lựa chọn nào khác ngoài việc chuẩn bị bản thân cho chiến tranh."
 china_events.10.d.integration_final: "Đã lâu rồi, nhưng tất cả đều có một số cú sốc trong vòng tròn bên trong của [ROOT.GetLeader] khi [FROM.GetNameDef] thực hiện động thái của họ ngày hôm nay. Trong một cuộc họp riêng, [FROM.GetLeader] đã nói về tương lai của [ROOT.GetNameDef] và trong khi đảm bảo rằng [ROOT.GetLeader] sẽ vẫn là thống đốc trong thời gian này, chính phủ trung ương sẽ thực hiện các bước cần thiết để đảm bảo sự cai trị của ông tương thích với lý tưởng của [FROM.GetRulingParty].\n\nCòn lại không nói ra là sự kiểm soát ngày càng tăng trong đó [FROM.Capital.GetCapitalVictoryPointName] đã khẳng định đối với chúng ta, với kỳ vọng rằng họ sẽ có quyền trên thực tế (và thậm chí có thể de jure) chọn một thống đốc mới và phủ quyết các cuộc hẹn nội bộ. Thực sự không có lựa chọn nào khác vào thời điểm này, hoặc chúng ta đi vào lịch sử như những người lính [FROM.GetRulingParty] giỏi hoặc [ROOT.GetLeader] thực hiện một lập trường tuyệt vọng cuối cùng chống lại sự cai trị của họ. Thời điểm then chốt này sẽ quyết định số phận của tỉnh chúng ta từ nay về sau."
 china_events.10.a: "Chúng ta chấp nhận quy tắc [FROM.GetAdjective]."
 china_events.10.b: "Chúng ta phản đối sự xâm lấn này!"

 china_events.11.t: "Tích hợp tiến trình [ROOT.GetNameDef]"

 china_events.11.intro: "Chúng ta từ lâu đã được hưởng quyền tự chủ của mình như một tỉnh độc lập, tránh xa bóng tối của chính quyền trung ương. Do tham nhũng và bất ổn của bầu không khí chính trị Trung Quốc, chúng ta đã quay lưng lại với bất kỳ khái niệm tập trung hóa nào - thấy rằng trong thời kỳ xung đột hỗn loạn này; chỉ có tự quản mới làm giảm bớt các vấn đề của chính chúng ta. Thật vậy, trong nhiều năm, chúng ta đã bắt đầu thực hiện các cải cách của riêng mình và củng cố sự khác biệt văn hóa của chúng ta với phần còn lại của đất nước."

 china_events.11.d.integration_level_1: "$china_events.11.intro$\n\nCác quan chức quản lý từ [THIS.overlord.GetNameDef] đã yêu cầu đài phát thanh địa phương và báo chí của chúng ta ngừng sản xuất phương tiện truyền thông dựa trên phương ngữ. Tin tức từ đó được phát sóng từ ngôn ngữ được chọn bởi [THIS.overlord.GetNameDef] và ngừng xuất bản tờ báo tỉnh của chúng ta. Một số tác giả nổi tiếng trong tỉnh của chúng ta đã từ chức vì phản đối, và tiếng nói đã nổi lên vì sợ tập trung hóa hơn nữa."
 china_events.11.d.integration_level_2: "$china_events.11.intro$\n\nCác quan chức quản lý từ [THIS.overlord.GetNameDef] đã yêu cầu tất cả các lễ hội văn hóa địa phương phải bị đóng cửa vì chúng là \" kích động khái niệm tách \" và gợi nhớ đến \" của một thời kỳ lạc hậu và cổ xưa \". Các trưởng lão và làng quê địa phương đã kêu lên phản đối tại các hội đồng địa phương trên toàn tỉnh."
 china_events.11.d.integration_level_3: "$china_events.11.intro$\n\nCác quan chức quản lý hình thức [THIS.overlord.GetNameDef] đã yêu cầu các trường học của chúng ta ngay lập tức đình chỉ chương trình giảng dạy địa phương của họ và áp dụng ngôn ngữ của họ để trở thành ngôn ngữ giảng dạy trong lớp học của họ. Đồng thời, nhiều giáo viên và giáo sư đã nộp đơn khiếu nại phản đối chính phủ của chúng ta. Thậm chí còn gây sốc hơn là chúng ta thấy rằng ngày càng khó khăn cho cha mẹ không thể giao tiếp với con cái họ. Vì hướng dẫn hiện nay là phương ngữ của [THIS.overlord.GetNameDef], một số lượng lớn công dân của chúng ta, từ sinh viên đến người kéo xe kéo địa phương, không thể nói tiếng địa phương mới hoặc tiếng địa phương cũ của họ."
 china_events.11.d.integration_final: "$china_events.11.intro$\n\nTỉnh nhà của chúng ta, trong khi xuất hiện như nhau ở bên ngoài, đã trải qua những thay đổi chính trị, xã hội và kinh tế đáng kể kể từ khi tập trung hóa đất nước chúng ta. Các thẩm phán và cơ quan quản lý hiện được chính phủ trung ương bổ nhiệm trực tiếp tại [THIS.overlord.Capital.GetCapitalVictoryPointName]. Trong khi rất nhiều người trong tỉnh vẫn nói tiếng địa phương tỉnh của họ trôi chảy, thế hệ trẻ ngày nay chỉ nói bằng tiếng địa phương quốc gia. Nền kinh tế của chúng ta cũng đã trải qua những thay đổi sâu sắc khi hệ thống tiền tệ tỉnh hữu ích một thời đã sụp đổ sau khi áp dụng đồng tiền quốc gia. Hơn nữa, các lực lượng tỉnh của chúng ta đều bị quốc hữu hóa, để lại bất kỳ khái niệm độc lập chính trị nào khỏi chính quyền trung ương."
 china_events.11.a: "Thay đổi là điều tất yếu."

 china_events.12.t: "Nỗ lực của chúng ta để tích hợp [FROM.GetNameDef]"
 china_events.12.intro: "Trong những tuần gần đây, chúng ta đã thực hiện các bước để tích hợp hơn nữa chính quyền [FROM.GetAdjective] với chính chúng ta, tạo ra sự tiến bộ chậm nhưng ổn định về vấn đề này. Điều này tất nhiên không được chú ý bởi [FROM.GetLeader] và [FROM.GetRulingParty] , nhưng dường như họ thường chấp nhận yêu cầu của chúng ta, cho dù là do lòng trung thành ý thức hệ thực sự hay vì họ thấy sự thống nhất là fait accompli."

 china_events.12.d.integration_level_1: "$china_events.12.intro$\n\nĐể chuẩn bị những vấn đề như vậy, chúng ta hãy tuyên bố với chính phủ của họ rằng từ nay trở đi họ phải sử dụng phương ngữ của chúng ta trong tất cả các hình thức truyền thông công cộng. Điều này không chỉ giúp phá vỡ các rào cản phương ngữ của tỉnh mà còn giúp chúng ta ngăn chặn các phương tiện bất đồng chính kiến địa phương. Trong mọi trường hợp, sự kiểm soát của chúng ta đối với [FROM.GetNameDef] đã tăng lên rất nhiều so với trước đây."
 china_events.12.d.integration_level_2: "$china_events.12.intro$\n\nChúng ta cũng phải tiếp cận với quần chúng Trung Quốc và thông báo rằng chúng ta đang đưa Trung Quốc vào một thời đại hiện đại, một kỷ nguyên mới cho quốc gia Trung Quốc. Vào thời điểm quyết định như vậy của sự thống nhất quốc gia, chúng ta phải cho họ biết rằng phong tục địa phương và lạc hậu của họ không còn tồn tại so với kiến thức hiện đại."
 china_events.12.d.integration_level_3: "$china_events.12.intro$\n\nTương lai của Trung Quốc thuộc về thanh niên mới, và thanh niên phải học cách của chúng ta và hiểu quyền lực của chúng ta nếu giữ của chúng ta trên Trung Quốc là để thực hiện cho các thế hệ. Chúng ta hãy gửi ra một lệnh để có trường học của họ sử dụng ngôn ngữ của chúng ta trong giảng dạy và trò chuyện."
 china_events.12.d.integration_final: "Những nỗ lực của chúng ta để tích hợp chính quyền tỉnh [FROM.GetAdjective] với chính quyền của chúng ta đã thành công hoàn toàn. Người dân của họ bây giờ hài lòng và hiểu về sự cai trị của chúng ta, với các báo cáo thuận lợi đến hàng tuần từ các thẩm phán được chỉ định của chúng ta. Hơn nữa, chúng ta nghe rằng xã hội của họ hiện đang nắm lấy văn hóa của khu vực thủ đô của chúng ta và các trường học của họ sử dụng phương ngữ của chúng ta trong tất cả các hình thức đối thoại. Chúng ta không cần phải lo lắng về sự bất đồng ý kiến vì phương tiện truyền thông địa phương của họ không còn phát sóng với phương ngữ tỉnh của họ và quân đội của họ hiện đã được tích hợp hoàn toàn vào chúng ta."
 china_events.12.a: "Một bước xa hơn trên con đường thống nhất."

 china_events.13.t: "[FROM.GetNameDefCap] nổi dậy chống lại hội nhập"
 china_events.13.d: "Các quân phiệt là những con thú hay thay đổi, không đáng tin cậy, luôn ghen tị bảo vệ quyền tự chủ của họ bất chấp chi phí áp đặt cho quốc gia và người dân của họ. Mặc dù chúng ta đã cố gắng hợp lý và tinh tế nhất có thể trong quá trình chuyển đổi, [FROM.GetLeader] đã kiên quyết chống lại những nỗ lực của chúng ta để đưa [FROM.GetNameDef] đến gần hơn với những gì được mong đợi từ sự nghiệp quốc gia của chúng ta.\n\nThay vào đó, anh ta đã tập hợp [FROM.GetRulingParty] chống lại chúng ta, tố cáo những gì anh ta chê bai là [ROOT.Capital.GetCapitalVictoryPointName] chuyên chế và nỗ lực giải giáp lực lượng quân sự [FROM.GetAdjective]. Chúng ta phải làm việc để nhanh chóng dập tắt cuộc nổi loạn này, và với bất kỳ may mắn nào tránh được bất kỳ thiệt hại nào cho nguyên nhân của chúng ta."
 china_events.13.a: "Một cái giá nhỏ phải trả cho sự cứu rỗi quốc gia."

 china_events.14.t: "[FROM.FROM.GetNameDefCap] nổi dậy chống lại [FROM.GetNameDef]"
 china_events.14.d: "Tin tức gây sốc đã đến với [Root.Capital.GetCapitalVictoryPointName] khi tin tức về cuộc nổi loạn [FROM.FROM.GetAdjective] chống lại quyền lực của [FROM.Capital.GetCapitalVictoryPointName] lan rộng. Bất mãn trước sự lãnh đạo của [FROM.GetLeader] và sợ bị các đại lý [FROM.GetRulingParty] tiếp tục xâm phạm trong các vấn đề địa phương, [FROM.FROM.GetName] đã trục xuất tất cả các đại diện [FROM.GetAdjective] trong một hành động thách thức khốc liệt.\n\nĐiều này đã đẩy [FROM.FROM.GetLeader] vào một vị trí đột ngột nổi bật như là nhà lãnh đạo của những gì ông hy vọng sẽ là một liên minh rộng lớn hơn của những người dám thách thức quyền lực [FROM.GetRulingParty]. Bây giờ chúng ta xem từ bên lề như hỗn loạn nhấn chìm chính phủ [FROM.GetAdjective] non trẻ, nhưng có khả năng chúng ta sẽ sớm bị buộc phải lựa chọn khi họ chiến đấu cho tương lai của phong trào."
 china_events.14.a: "Chúng ta phải nhanh chóng tham gia cuộc nổi dậy!"
 china_events.14.b: "Giữ lòng trung thành với chính phủ."

 china_events.15.t: "[FROM.GetNameDefCap] Từ bỏ Cơ quan của chúng ta"
 china_events.15.d: "Có lẽ nó là không thể tránh khỏi, hoặc có lẽ đây là một hành động của sự ích kỷ trơ tráo, nhưng bất kể ngày đã đến. Lấy cảm hứng từ cuộc nổi dậy [FROM.FROM.FROM.GetLeader] chống lại sự cai trị của chúng ta, [FROM.GetLeader] đã chọn ném rất nhiều của mình với phiến quân. Có lẽ tức giận bởi sự xâm lấn nhận thức về quyền tự chủ của họ hoặc có thể bất mãn bởi sự lãnh đạo liên tục của [ROOT.GetLeader] , họ đã tìm thấy một cơ hội để hạ bệ chính phủ của chúng ta từ bên trong. Hoặc là chúng ta đặt xuống những kẻ phản bội ngay lập tức, hoặc giấc mơ [ROOT.GetRulingParty] của thống nhất quốc gia sẽ chết trước khi nó thậm chí có thể bắt đầu."
 china_events.15.a: "Chỉ có một điều kẻ phản bội đáng bị như vậy."

 china_events.16.t: "[FROM.GetNameDefCap] tham gia cuộc nổi loạn"
 china_events.16.d: "Thấy một cơ hội để phá vỡ xiềng xích của [FROM.FROM.FROM.GetAdjective] áp bức, [FROM.GetRulingParty] đã quyết định liên kết với chúng ta trong nỗ lực của chúng ta để lật đổ [FROM.FROM.FROM.Capital.GetCapitalVictoryPointName] . [FROM.GetLeader] đã gửi một bức điện tín chính thức đặt các nguồn lực của [FROM.GetNameDef] dưới sự kiểm soát của chúng ta, mặc dù bao nhiêu điều này sẽ thực sự làm việc ra trong thực tế vẫn còn để được nhìn thấy. Warlords là những sinh vật hay thay đổi, và không có nghi ngờ họ đang tự hỏi nếu chúng ta cũng sẽ có một lượt chuyên chế.\n\nTuy nhiên, hiện tại, chúng ta phải tập trung vào việc đánh bại lực lượng của [PREV.GetNameDef]. Cấp bậc của chúng ta hiện đang tăng về số lượng, cơ hội của chúng ta đã tăng lên cùng với nó. Tuy nhiên, không chắc rằng [FROM.FROM.FROM.GetLeader] sẽ đi xuống mà không cần chiến đấu, và cuộc nổi dậy vẫn tiếp tục."
 china_events.16.a: "Hy vọng nuôi dưỡng những cuộc nổi dậy."

 china_events.17.t: "[ROOT.china_central_plains_war_title]"
 china_events.17.d: "[ROOT.china_central_plains_war_desc]"
 china_events.17.a: "[ROOT.china_central_plains_war_option]"
 china_central_plains_war_title_federalist: "[GetYear] Chống Nổi loạn Tập trung Ignites"
 china_central_plains_war_title_lkmt: "Chiến dịch thống nhất quốc gia [GetYear] bắt đầu"
 china_central_plains_war_title_rkmt: "Chiến dịch ngăn chặn tên cướp [GetYear] mở ra"
 china_central_plains_war_title_zhili: "Chiến tranh bảo vệ quốc gia [GetYear] tuyên bố"
 china_central_plains_war_title_manchu: "Chiến dịch hòa bình [GetYear] bắt đầu"
 china_central_plains_war_title_fengtian: "Cuộc nổi dậy lập hiến [GetYear] nổ ra"
 china_central_plains_war_title_generic: "Các [GetYear] Chống [FROM.GetAdjective] Nội chiến Bắt đầu"
 china_central_plains_war_desc_federalist: "Mặc dù [FROM.GetNameDef] đã có thành công đáng kể cho đến nay trong việc thuyết phục các quân phiệt khác nhau tham gia phong trào của [FROM.GetLeader], nhưng luôn có một nỗi sợ rằng các đồng minh \" cũ \" của phong trào Liên bang sẽ quay sang họ. Những nỗi sợ hãi như vậy cuối cùng đã trở thành sự thật ngày hôm nay, với nhiều thống đốc nổi loạn chống lại [FROM.Capital.GetCapitalVictoryPointName] .\n\nHai bên đã được thương mại tuyên bố độc tài, với các phiến quân tố cáo chính phủ trung ương là phản bội các nguyên tắc liên bang trong khi [FROM.GetRulingParty] nhấn mạnh rằng họ đang cố gắng dân chủ hóa oligarchies khu vực. Chiến tranh sắp xảy ra, và nếu lý tưởng của Liên bang là để tồn tại, quân đội của họ phải di chuyển nhanh chóng."
 china_central_plains_war_desc_lkmt: "Tin tức điên cuồng từ Trung Quốc đã đến rằng đất nước dường như rơi vào một cuộc nội chiến khác. Trong khi họ từng tuyên bố trung thành với Chính phủ Quốc gia của Quốc dân đảng, các quân phiệt nổi loạn đã công bố quyết định cắt đứt quan hệ với Chính phủ [CHI.Capital.GetCapitalVictoryPointName] - tố cáo chủ nghĩa độc tài rõ ràng của Quốc dân đảng.\n\nTrong khi một số người có thể cho rằng ý tưởng của Quốc dân đảng về một nhà nước đơn nhất đã dẫn đến một cuộc nội chiến không thể tránh khỏi, thì không thể nghi ngờ rằng NRA phải hành động nhanh chóng trong việc xua đuổi phiến quân, nếu không Quốc dân đảng rất có thể mất cơ hội một lần nữa để thực hiện cuộc cách mạng của Tiến sĩ Tôn."
 china_central_plains_war_desc_rkmt: "Sau khi liên tục bị các đối thủ lật đổ, Tiến sĩ Tôn Trung Sơn đã thành lập Quốc dân đảng theo đường lối tiên phong, yêu cầu lời thề trung thành cá nhân từ mỗi thành viên. Mặc dù vậy, Quốc dân đảng từ lâu đã phải vật lộn để trình bày một mặt trận thống nhất, ngay cả trước khi Thủ tướng vĩnh cửu của họ qua đời. Các phần tử cánh hữu của Quốc dân đảng đã cố gắng xây dựng một liên minh thống nhất, chỉ để thấy nó sụp đổ trong những ngày gần đây.\n\nChính phủ trung ương, do [FROM.GetLeader] lãnh đạo, đã tố cáo cuộc nổi loạn đang gia tăng là công việc của những tên cướp \" \" với hy vọng hủy bỏ sự bất mãn ngày càng tăng dưới sự cai trị độc đoán của ông. Khi quân đội chuẩn bị đụng độ, dường như Quốc dân đảng đã phải chịu một đòn lớn khác."
 china_central_plains_war_desc_zhili: "Nó được cho là đã kết thúc. Sau chiến thắng tuyệt vời của nhóm Trực Lệ trước các đối thủ của nó trong những năm 1920, nhiều người đã hình dung ra một tương lai được xây dựng dọc theo dòng Trực Lệ. Giấc mơ này đã bị phá vỡ hoàn toàn vào năm 1936 với sự sụp đổ của Liên minh, và dường như mọi thứ chỉ trở nên tồi tệ hơn từ đó. Nỗ lực của [FROM.GetNameDefCap] để nhặt các mảnh đã gây ra một đòn nghiêm trọng ngày hôm nay với tin tức về một cuộc nổi dậy lớn của các chính quyền khu vực khác nhau.\n\nGợi nhớ đến Chiến tranh Hộ quốc, phiến quân tuyên bố đang giải phóng quốc gia khỏi chế độ chuyên chế Trực Lệ. Có hay không đây chỉ đơn thuần là một mặt trận cho sự cai trị của quân phiệt, và nếu Trực Lệ liệu một cơn bão khác, sẽ được xác định trên chiến trường."
 china_central_plains_war_desc_manchu: "Lắp đặt trong một nỗ lực để đạt được tính chính danh quốc tế, chế độ quân chủ nhà Thanh đã không được đặc biệt phổ biến ngay cả sau khi lật đổ Trực Lệ. Những nỗ lực của họ để khẳng định quyền kiểm soát các phe đồng minh, đã gây ra một cuộc chiến tranh bảo vệ quốc gia mới, với phiến quân đốt cháy tình cảm cộng hòa chống lại những gì họ cho là một chế độ quân chủ áp đặt nước ngoài.\n\nLãnh đạo [FROM.GetAdjective] lần lượt đã thề sẽ dập tắt cuộc nổi loạn trong một chiến dịch bình định quốc gia: kết quả sẽ quyết định số phận của lịch sử rắc rối của triều đại nhà Thanh."
 china_central_plains_war_desc_fengtian: "Chiến thắng của [FROM.GetNameDef] không có nghĩa là chấm dứt những rắc rối của nó chi phối tính khí bất khuất của các diễn viên khu vực. Mặc dù [FROM.GetLeader] đã bảo đảm thành công sự trung thành của các chính phủ khu vực khác nhau thông qua các cuộc đàm phán, nhưng dường như những thỏa thuận đó đã thất bại ngày hôm nay khi tìm kiếm sự hội nhập lớn hơn.\n\nVới nhiều khu vực hiện đang nổi dậy, tính chính danh của [FROM.GetAdjective] hiện đang được đặt câu hỏi. Tuyên truyền, đúng hay không, về sự hợp tác của [FROM.GetAdjective] với người Nhật và những tin đồn bẩn thỉu khác đã bắt đầu lan rộng. Nếu cuộc nổi loạn này không bị dập tắt nhanh chóng, giấc mơ thống nhất Trung Quốc của họ sẽ sớm kết thúc."
 china_central_plains_war_desc_generic: "Mặc dù [FROM.GetNameDef] đã có những bước tiến lớn hướng tới sự thống nhất, nhưng thành công ban đầu của họ trong việc đảm bảo lòng trung thành của các Thống đốc khác nhau đã gây ra một đòn lớn trong những ngày gần đây. Các quân phiệt được biết đến là thủy triều và thất thường trong lòng trung thành của họ, và điều tương tự cũng có thể đúng với các bậc thầy [FROM.GetRulingParty] của họ trong [FROM.GetNameDef].\n\nSự mất lòng tin lẫn nhau này kết hợp với những nỗ lực của [FROM.GetAdjective] trong việc khẳng định sự kiểm soát hơn nữa đã dẫn đến cuộc nội chiến bùng nổ khi nhiều thống đốc liên kết trước đây đã tố cáo chính phủ trung ương. Khi quân đội hành quân đến chiến tranh, công dân co rúm lại và hy vọng sống sót sau một cơn bất ổn khác."
 china_central_plains_war_option_government: "Chính phủ của chúng ta sẽ tốt hơn nếu không có họ!"
 china_central_plains_war_option_government_warlord: "Chúng ta sẽ đánh bại bọn phản bội!"
 china_central_plains_war_option_puppet: "Chúng ta hãy hy vọng khách hàng của chúng ta sẽ chiến thắng."
 china_central_plains_war_option_ally_generic: "Đồng minh của chúng ta phải đối mặt với một cuộc đấu tranh khác."
 china_central_plains_war_option_revolting_warlord: "Chúng ta sẽ chiến thắng sự chuyên chế!"
 china_central_plains_war_option_enemy_government: "Bằng chứng về tính chính danh của chúng ta."
 china_central_plains_war_option_enemy_warlord: "Một thời gian nghỉ ngơi được chào đón, và cơ hội tiềm năng."
 china_central_plains_war_option_enemy_generic: "Bọn ngu ngốc đánh nhau với nhau!"
 china_central_plains_war_option_neutral_government: "Chính phủ đến rồi đi. Chúng ta sẽ sống sót."
 china_central_plains_war_option_neutral_warlord: "Hy vọng nó không tràn qua biên giới."
 china_central_plains_war_option_japan: "Một cơ hội hay một mối đe dọa?"
 china_central_plains_war_option_neutral: "Một cuộc xung đột bi thảm khác trong một khu vực khốn khổ."

 china_events.18.t: "[FROM.GetAdjective] Những người theo chủ nghĩa dân tộc trở lại Fold"
 china_events.18.d: "Cuối cùng, bất chấp tất cả sự khác biệt giữa họ, dường như những lời dạy của Tiến sĩ Sun tiếp tục đoàn kết trái tim và tâm trí của các thành viên Quốc dân đảng trên toàn quốc. Trong khi các nhà quan sát và các nhà sử học tương lai có và có khả năng sẽ luôn không đồng ý về mức độ mà chính phủ khu vực [FROM.GetAdjective] duy trì quyền tự chủ từ [RKT.Capital.GetCapitalVictoryPointName] , sự đồng thuận chung là sự thống nhất cuối cùng của đảng Trung Quốc đã cho phép nó hấp thụ các lực lượng tỉnh xa xôi vào một bộ máy chính phủ tập trung.\n\nQuá trình này không phải lúc nào cũng suôn sẻ, với nhiều thăng trầm. Lòng trung thành đã được đặt câu hỏi, những lời buộc tội được trao đổi và những hy sinh không được kể lại. Đảng luôn phủ nhận rằng có bất kỳ sự mất đoàn kết hoặc nghi ngờ về kết quả cuối cùng, và lợi ích tốt nhất của cả hai bên là tiếp tục câu chuyện này khi các sự kiện của ngày hôm nay được dệt vào lịch sử. Nhưng đồng thời, có một sự hiểu biết nhất định rằng [FROM.GetLeader] cuối cùng đã chọn con đường trung thành hơn là tham vọng, một điều hiếm hoi có lẽ báo hiệu sự kết thúc của một kỷ nguyên bi thảm."
 china_events.18.a: "Chúng ta kính chào những người đầy tớ trung thành của cách mạng."
 china_events.18.b: "Một quốc gia, một đảng, một tương lai"

 china_events.19.t: "Những người cánh tả [FROM.GetAdjective] đệ trình lên Đảng-Nhà nước"
 china_events.19.d: "Cuối cùng, bất chấp sự khác biệt giữa các phe phái khác nhau, những người cánh tả của Trung Quốc đã thống nhất trong mong muốn của họ để xem sự thay đổi mang tính cách mạng được thực hiện trên toàn quốc gia bị đánh đập của họ. Chiến thắng của [FROM.FROM.GetLeader] và chính phủ [FROM.FROM.Capital.GetCapitalVictoryPointName] đã tin tưởng vào thực tế này, đặc biệt là với việc nộp [FROM.GetNameDef] cho quy tắc của chính phủ trung ương. Trong khi sẽ tiếp tục có một số cuộc tranh luận về sự chân thành của việc tuân thủ [FROM.GetLeader] của học thuyết đảng và mức độ tự chủ [FROM.GetRulingParty] của [FROM.GetNameDef] được hưởng trong vài năm qua, không nói gì về đóng góp của họ cho cuộc cách mạng quốc gia, điều không thể chối cãi là họ đã phát triển gần gũi hơn với chỉ thị của Chính phủ Trung ương trong vài tháng qua.\n\nMặc dù đã gắn bó chặt chẽ với bộ máy của đảng, và có lẽ không dễ dàng nhận thấy từ quan điểm của người ngoài, nó đã đến một số bất ngờ rằng [FROM.GetLeader] đã bầu để đầu hàng một cách hòa bình quyền tự chủ tạm thời được hưởng bởi chính phủ [FROM.GetAdjective]. Một biến tinh tế nhưng rõ ràng đáng chú ý của các sự kiện, nó mang lại cho thời đại quân phiệt một bước gần hơn để kết thúc và cũng thoát khỏi [FROM.FROM.GetLeader] của một đối thủ tiềm năng trong đảng."
 china_events.19.a: "Chúng ta sẽ không bao giờ quên những người đồng chí trung thành và sự hy sinh của họ."
 china_events.19.b: "[FROM.FROM.GetLeader] có ít mối đe dọa hơn từ bên trong."

 china_events.190.t: "[FROM.GetAdjective] Phe liên bang Tham gia Chính phủ của chúng ta"
 china_events.190.d: "Cuối cùng, bất chấp kính vạn hoa của các diễn giải ý thức hệ và ý thức chung về chủ nghĩa dân tộc cấp tỉnh giữa hai cánh của phong trào Liên bang, dường như những người theo chủ nghĩa Liên bang Trung Quốc vẫn giữ được cảm giác thống nhất trong mong muốn thấy dự án Liên bang thành hiện thực. Khi chiến thắng vang lên khắp đất nước từ chính phủ [FROM.FROM.Capital.GetCapitalVictoryPointName] để vinh danh chiến thắng của [FROM.FROM.GetLeader], việc đệ trình, chứ không phải nổi dậy, của [FROM.GetNameDef] cho sự cai trị của chính quyền trung ương đã củng cố một khái niệm như vậy. Trong khi sự khác biệt rõ ràng đã xuất hiện trong việc thực hiện chủ nghĩa liên bang lý tưởng từ quan điểm của [FROM.GetLeader], và sức mạnh tương đối của họ so với các Chính quyền tỉnh khác không có gì để bôi nhọ, tuy nhiên họ đã chọn nguyên tắc trên niềm tự hào. Và đó là để được tôn trọng.\n\nVới sự ưu việt mãnh liệt của phong trào Liên bang đối với niềm tự hào của chủ nghĩa cấp tỉnh, lịch sử của nó đã thể hiện một cách tượng trưng những thất bại của chủ nghĩa khu vực trong việc tập hợp một phong trào quốc gia, và do đó, thật ngạc nhiên khi [FROM.GetLeader] sẵn sàng từ bỏ quyền tự chủ của chính phủ [FROM.GetAdjective]. Tinh tế trên sân khấu quốc tế, tuy nhiên nó vẫn đưa Thời đại Warlord đến gần Giờ phù thủy hơn và loại bỏ một con tốt khác khỏi bàn cờ."
 china_events.190.a: "Anh sẽ mãi là một trong những người tốt nhất trong lịch sử."
 china_events.190.b: "Và do đó củng cố Chính phủ Liên bang."

 china_events.191.t: "[FROM.GetAdjective] gia nhập chính phủ của chúng ta"
 china_events.191.d: "Hiếm khi một đức tính bị kết án được tổ chức ở mức độ cao trong Thời đại Warlord, sự tin tưởng và cống hiến thực sự cho chính quyền trung ương từ các quân phiệt địa phương chỉ là một cây kim trong đống cỏ khô đầy tham vọng. Tuy nhiên, khi chiến thắng vang lên trên toàn quốc từ chính phủ [FROM.FROM.Capital.GetCapitalVictoryPointName] để vinh danh chiến thắng của [FROM.FROM.GetLeader], việc đệ trình, chứ không phải nổi dậy, của [FROM.GetNameDef] cho sự cai trị của chính quyền trung ương đã củng cố một khái niệm khan hiếm về sự thống nhất dân tộc. Trong khi những khác biệt rõ ràng đã xuất hiện trong việc thực hiện quản trị lý tưởng từ quan điểm của [FROM.GetLeader], và sức mạnh tương đối của họ so với các Chính quyền tỉnh khác không có gì để bôi nhọ, tuy nhiên họ đã chọn nguyên tắc trên niềm tự hào. Và đó là để được tôn trọng.\n\nVới đặc quyền tự nhiên của Warlord để duy trì quyền tự trị của tỉnh, lịch sử của nó biểu tượng cho thấy sự thất bại của chủ nghĩa khu vực trong việc tập hợp một phong trào quốc gia, và vì vậy có phần ngạc nhiên khi [FROM.GetLeader] sẵn sàng từ bỏ quyền tự trị của chính phủ [FROM.GetAdjective]. Tinh tế trên sân khấu quốc tế, tuy nhiên nó mang Thời đại Warlord đến gần Giờ phù thủy hơn và loại bỏ một con tốt khác khỏi bàn cờ."
 china_events.191.a: "Một vị trí danh giá trên bàn, tôi chắc chắn."
 china_events.191.b: "Trung Quốc đoàn tụ, từng bước một."

 china_events.2145.t: "Thống nhất đất nước và những vấn đề mới"
 china_events.2145.d: "Với sự thống nhất của quốc gia, Trung Quốc cuối cùng đã một lần nữa được đưa dưới một biểu ngữ chính trị gắn kết trong lịch sử gần đây, ít nhất là phần nào. Tuy nhiên, nhiều khó khăn đã bắt đầu xuất hiện dưới ánh sáng của tầm vóc mới của [ROOT.GetLeader]. Quốc gia này, công bằng mà nói, bị hủy hoại về kinh tế, chính trị và quân sự. Các lực lượng khác nhau đã bắt đầu chơi tay của họ, hoặc tìm cách tạo ra các công việc bảo trợ trong chính quyền mới, tích lũy của cải và quyền lực của riêng họ, hoặc chỉ để tồn tại trong thực tế bị phân mảnh của một quốc gia bị thương.\n\nKhi quần chúng và cấp dưới của ông ta nhìn về phía [ROOT.GetLeader] để tìm câu trả lời và chỉ đạo, các đồng minh cũ của Chính phủ Trung ương mới ngày càng rút kiếm, và chuẩn bị lực lượng của họ cho những gì có thể là canh bạc quyền lực của chính họ."
 china_events.2145.a: "Chúng ta hãy bắt đầu xây dựng lại các mảnh ghép."

 china_events.2200.t: "Thống nhất về các điều khoản của [FROM.GetAdjective]"
 china_events.2200.d: "Cuối cùng, một nền hòa bình có thể thấm được đã được đưa ra cho quốc gia Trung Quốc, và với sự thống nhất phát sinh một loạt thách thức mới đối với cả Chính phủ Trung ương và các Thống đốc tỉnh khác nhau. Đã ủng hộ tham vọng của [FROM.GetLeader] về chìa khóa cho lâu đài của Cộng hòa Trung Quốc, [ROOT.GetLeader] đã được hưởng một vai trò chính trong chính quyền mới với tư cách là một quản trị viên đáng kính và có thể liên kết, và là quan chức quan trọng trong các vấn đề của Trung Quốc.\n\nTuy nhiên, với những khó khăn ngày càng tăng vây quanh Chính phủ Trung ương, có lẽ một cơ hội đã phát sinh trong sự tối tăm của cuộc xung đột? Với những khó khăn về kinh tế, quân sự và chính trị phát sinh ở Thủ đô, họ chỉ ở một vị trí yếu, và cơ hội hiệu quả nhất để đặt cược tuyên bố của [ROOT.GetLeader] để trở thành Piedmont của Trung Quốc sẽ là bây giờ. Tuy nhiên, một hành động như vậy là không thể phủ nhận một hành động phản bội, một người không được thực hiện quá nhẹ. Và trong khi yếu, [FROM.GetLeader] vẫn đặt ra một mối đe dọa đáng kể, một cái gì đó nhưng một số ít các trận chiến có thể biến thành một thảm họa."
 china_events.2200.a: "Chúng ta hầu như không thành thật."
 china_events.2200.b: "Gửi overtures của chúng ta đến [FROM.GetLeader]."
 china_events.2200.c: "Hãy tới thủ đô để chúc mừng họ. (Chuyển sang [FROM.GetNameDef])"

 china_events.2300.t: "[FROM.GetLeader] nổi dậy!"
 china_events.2300.d: "Những người bạn tốt rất khó tìm thấy trong Kỷ nguyên Warlord, và những tin tức gần đây về sự xuất hiện của một cuộc nổi dậy do [FROM.GetLeader] lãnh đạo đã củng cố thêm một khái niệm như vậy. Từng là một đồng minh cũ, dường như với sự yếu kém của Chính phủ Trung ương, họ đã quyết định tổ chức canh bạc của riêng mình cho quyền lực và sự nổi bật trên chiến trường Trung Quốc. Khi đàn ông chuẩn bị chiến đấu với anh em của họ, quốc gia run rẩy một lần nữa ..."
 china_events.2300.a: "Họ sẽ là những kẻ ngốc nếu cố gắng!"
 china_events.2300.b: "Đó là tình trạng của thời đại Warlord."

### United Front Events ###
 china_events.20.t: "[FROM.GetNameDefCap] đề nghị tham gia Mặt trận Thống nhất"
 china_events.20.d: "Chúng ta đã nhận được một đề nghị từ [FROM.Capital.GetCapitalVictoryPointName] yêu cầu tham gia với mặt trận thống nhất mới thành lập của chúng ta chống lại sự xâm lược của nước ngoài. Họ đã đề nghị gạt sang một bên bất kỳ sự khác biệt nào để giúp chúng ta đẩy lùi những kẻ xâm lược, đóng góp lực lượng cho sự nghiệp bảo vệ quốc gia.\n\nCó một số mối quan tâm tất nhiên, đặc biệt là về sự đáng tin cậy của [FROM.GetLeader] và [FROM.GetRulingParty] của mình. Liên kết với họ có nghĩa là buộc số phận của chúng ta lại với nhau. Các liên minh như thế này không may là phổ biến ở quân phiệt Trung Quốc, và sụp đổ nhanh như vậy. Tuy nhiên, nhân danh đoàn kết dân tộc, chúng ta có thể thực sự nói không?"
 china_events.20.d.ceasefire: "$china_events.20.d$\n\nĐặt ra một thách thức khác là thực tế là [FROM.GetNameDef] vẫn còn chiến tranh với các phe phái khác ở Trung Quốc. Chấp nhận chúng tạo ra cơn đau đầu ngoại giao khi phải giải quyết bất kỳ xung đột hiện có nào, vì sợ rằng chúng ta bị lôi kéo vào chúng."
 china_events.20.a: "Chúng ta hoan nghênh họ gia nhập liên minh."
 china_events.20.b: "Chúng ta từ chối sự trùng lặp."

 china_events.21.t: "[FROM.GetNameDefCap] chấp nhận nhập cảnh của chúng ta vào mặt trận"
 china_events.21.d: "Thấy nhu cầu bức xúc về sự thống nhất khi đối mặt với sự xâm lược của nước ngoài, [FROM.GetLeader] đã đích thân nhắn tin cho [ROOT.GetLeader] để chào đón chúng ta vào Mặt trận Thống nhất Trung Quốc. Quân đội kết hợp của chúng ta chắc chắn sẽ gây ra một mối đe dọa lớn chống lại những kẻ xâm lược Trung Quốc, tuy nhiên người ta nghi ngờ rằng một liên minh như vậy có thể tồn tại lâu dài. Có rất ít thời gian để suy nghĩ về điều đó bây giờ tuy nhiên, khi chúng ta diễu hành trở đi chống lại những kẻ xâm lược!"
 china_events.21.a: "Các đồng chí chiến thắng!"

 china_events.22.t: "[FROM.GetNameDefCap] từ chối nhập cảnh của chúng ta vào mặt trận"
 china_events.22.d: "Bất chấp những nỗ lực ernest của chúng ta trong việc thúc đẩy sự thống nhất quốc gia, chúng ta đã bị từ chối gay gắt bởi [FROM.GetNameDef]. Có vẻ như họ không tin tưởng chúng ta, như [FROM.GetLeader] ghen tị bảo vệ quyền lực của mình đối với liên minh. Loại hành vi phản quốc này không phải là hiếm ở Trung Quốc, và rất có thể đánh vần sự diệt vong của quốc gia khi nó bị xâm lược bởi các lực lượng bên ngoài. Trong thời gian đó, chúng ta sẽ chỉ đơn giản là phải tự quản lý."
 china_events.22.a: "Đồ ngốc và phản bội."

 china_events.23.t: "Mặt trận Thống nhất Trung Quốc chấm dứt"
 china_events.23.d: "Bây giờ cuộc xâm lược của kẻ thù đã đến gần, dường như có rất ít nhu cầu cho một mặt trận thống nhất Trung Quốc. Đã có các quân phiệt khác nhau đã bắt đầu từ chối lệnh của chính phủ trung ương, và cách xa bản thân từ [ROOT.Capital.GetCapitalVictoryPointName] . Dường như mọi thứ sẽ quay trở lại cách họ như các phe phái khác nhau nhấn tuyên bố của họ cho lãnh đạo quốc gia.\n\nTuy nhiên, chúng ta đã chứng minh trong cuộc chiến cuối cùng này rằng chúng ta có thể lãnh đạo Trung Quốc. Rằng chúng ta có thể bảo vệ nó khỏi sự xâm lược của kẻ thù, và sự mất đoàn kết không phải là cố hữu mà là một căn bệnh gây ra bởi sự ích kỷ khu vực. Nguyện xin người dân nhớ đến chúng ta và những thành tựu của chúng ta trên toàn quốc, và chúng ta sẽ sớm đoàn kết với họ một lần nữa."
 china_events.23.a: "Chúc mừng chiến thắng."

 china_events.24.t: "Mặt trận Thống nhất giải thể"
 china_events.24.d: "Bây giờ mà cuộc xâm lược của kẻ thù đã đến gần, nó xuất hiện rằng có rất ít nhu cầu cho một mặt trận thống nhất Trung Quốc. Sự thống nhất mà một mặt trận như vậy được cung cấp là hữu ích trong một thời gian, tuy nhiên các bộ phận trong vòng mặt trận chỉ đơn giản là quá nhiều để kéo dài. Bây giờ chúng ta phải đi theo con đường riêng của chúng ta, mặc dù thiện chí và lòng yêu nước nhiệt tình chúng ta đã đạt được từ sự tham gia của chúng ta có thể sẽ ở lại với chúng ta trong nhiều năm tới. Như một Trung Quốc chống lại cuộc xâm lược nước ngoài. Và điều đó sẽ đi xuống trong sách lịch sử mãi mãi."
 china_events.24.a: "Kéo dài cũng vui mà."

 china_events.25.t: "Mặt trận Thống nhất được thành lập"
 china_events.25.d: "Khi đối mặt với các mối đe dọa nước ngoài, các nhà hoạch định chính sách khác nhau, những người yêu nước và trí thức đã đề xuất các phe phái Trung Quốc chiến đấu cùng nhau thành một Mặt trận Thống nhất Trung Quốc nhân danh an ninh quốc gia chung. Chúng ta, với tư cách là một nhà nước Trung Quốc, đã được đưa vào các cuộc thảo luận như vậy và có rất nhiều người trong [ROOT.GetRulingParty] đã kiến nghị [ROOT.GetLeader] tiến tới liên minh này. Mặc dù nó không thể tồn tại mãi mãi, nhưng nhiệm vụ yêu nước của tất cả người Trung Quốc là bảo vệ đất nước vì sự xâm lược của kẻ thù."
 china_events.25.a: "Chúng ta cân nhắc các lựa chọn."

 china_events.26.t: "Mặt trận Thống nhất Trung Quốc"
 china_events.26.d: "[ROOT.china_united_front_desc]"
 china_events.26.a: "[ROOT.china_united_front_option]"
 china_united_front_desc_front_leader: "Đối mặt với sự xâm lược của nước ngoài, chúng ta đã đạt được một sự nổi bật mà chúng ta từ lâu đã tìm kiếm như là nhà lãnh đạo hiệu quả của Trung Quốc. [ROOT.GetLeader] đã có bài phát biểu ngày hôm nay trong [ROOT.Capital.GetCapitalVictoryPointName] chính thức công bố việc tạo ra một Mặt trận Thống nhất Trung Quốc, và kêu gọi tất cả Trung Quốc tập hợp cho sự nghiệp quốc gia.\n\nCuộc chiến tranh phía trước không được mong đợi sẽ dễ dàng bằng bất kỳ phương tiện nào, và liên minh mà chúng ta tập hợp có thể sẽ khó sử dụng. Tuy nhiên, sức mạnh của chúng ta đã được củng cố bởi sức mạnh chung của các đội quân quân phiệt khác nhau, và kết quả là tỷ lệ cược của chúng ta được cải thiện đáng kể. Dưới bóng của chiến tranh, Trung Quốc tự chui vào một cuộc xung đột kéo dài chống lại những kẻ sẽ chinh phục nó."
 china_united_front_desc_front_member: "Đối mặt với sự xâm lược của nước ngoài, chúng ta và nhiều người khác đã tập hợp lại để đối đầu với những kẻ xâm lược trong Mặt trận Thống nhất Trung Quốc. Một chính phủ chung, chủ yếu trên giấy tờ, đã được thành lập để phối hợp các hoạt động, một trong số đó chúng ta đã quan tâm tích cực.\n\nCuộc chiến phía trước không được mong đợi sẽ dễ dàng, nhưng Trung Quốc thống nhất vẫn là một sức mạnh để nhìn. Với hàng triệu người yêu nước chuẩn bị chiến đấu và chết chống lại sự áp bức của nước ngoài, và với kinh nghiệm chiến trường đáng kể được chia sẻ giữa các thành viên của nó, chúng ta phải đẩy kẻ thù ra khỏi vùng đất Trung Quốc. Vì lợi ích của quốc gia, người dân và tương lai của nó, không thể đầu hàng!"
 china_united_front_desc_possible_front_member: "Tập hợp các phe phái khác nhau trong Trung Quốc lại với nhau, Mặt trận Thống nhất Trung Quốc đã được thành lập để chống lại sự xâm lược của nước ngoài và phối hợp phòng thủ chống lại sự xâm lược của kẻ thù. Mặc dù [ROOT.GetLeader] và các nhân viên của ông vẫn đang cân nhắc có nên tham gia hay không, điều đó không ngăn cản những người khác tiến lên trong việc tạo ra liên minh này.\n\nChúng ta đã trải qua áp lực nội bộ, ngay cả trong [ROOT.GetRulingParty] , tham gia vào việc bảo vệ quê hương này, mặc dù những rủi ro vẫn còn rõ ràng. Hoa, Trung Quốc có thể gây ra một mối đe dọa lớn, tuy nhiên chiến thắng là xa đảm bảo. Và tương lai của mặt trận cũng không chắc chắn - điều gì sẽ xảy ra sau chiến thắng vẫn là một câu hỏi mở."
 china_united_front_desc_enemy: "Nhiều lực lượng Trung Quốc, trong một nỗ lực tuyệt vọng để từ chối chúng ta yêu cầu hợp pháp của chúng ta, đã đến với nhau để tạo thành một cái gọi là \" Trung Quốc Mặt trận Thống nhất \" . Thống nhất các phe phái quân phiệt khác nhau thành một liên minh và chính phủ được cho là chung, họ đã thề sẽ buộc chúng ta phải rút lui, sử dụng mọi nguồn lực và ounce của chủ nghĩa yêu nước Trung Quốc còn lại trong một quốc gia bị chia rẽ như vậy.\n\nMặc dù không chắc một liên minh khó sử dụng như vậy có thể thực sự đứng lên chống lại các lực lượng của chúng ta, nhưng sự thống nhất đột ngột này của Trung Quốc là nguyên nhân gây ra một số lo ngại. Chúng ta phải cẩn thận để điều chỉnh đầy đủ những thay đổi trên chiến trường như vậy và cũng có thể mở rộng phạm vi mục tiêu chiến dịch của chúng ta."
 china_united_front_desc_neutral: "Đối mặt với cuộc xâm lược nước ngoài, các phe phái khác nhau của Trung Quốc đã đồng ý hợp tác trong một \" Mặt trận Thống nhất Trung Quốc \" . Bề ngoài với một cấu trúc chỉ huy thống nhất và chính phủ, các chuyên gia cảnh báo rằng trong thực tế quyền tự chủ khu vực sẽ vẫn giữ nguyên và sự phối hợp có thể sẽ thiếu.\n\nTuy nhiên, sự thống nhất đột ngột này chống lại sự xâm lược đã gây ra một sự bùng nổ lòng yêu nước ở các thành phố trên toàn quốc. Bất cứ nghi ngờ nào tồn tại về sự chân thành của những người tham gia hoặc tỷ lệ chiến thắng phần lớn vẫn vô hình, khi quốc gia Trung Quốc huy động chiến tranh. Dường như ý tưởng về một Trung Quốc thống nhất còn lâu mới chết, mặc dù kết quả của cuộc chiến có thể thay đổi điều đó rất tốt."
 china_united_front_option_front_leader: "Chúng ta sẽ dẫn dắt dân tộc đến chiến thắng!"
 china_united_front_option_front_member: "Chúng ta hãy cùng nhau tiêu diệt bọn đế quốc!"
 china_united_front_option_possible_front_member: "Quyết định phải được đưa ra sớm..."
 china_united_front_option_enemy: "Hãy xem họ thực sự đoàn kết như thế nào!"
 china_united_front_option_neutral: "Con hổ Trung Quốc gầm lên."

 china_events.27.t: "[FROM.GetNameDefCap] Yêu cầu ngừng bắn cho Unity"
 china_events.27.d: "Trích dẫn cuộc xung đột hiện tại của chúng ta trong quốc gia và nhu cầu thống nhất khi đối mặt với mối đe dọa nước ngoài, đại diện từ [FROM.GetNameDef] đã nhấn mạnh rằng chúng ta ký lệnh ngừng bắn ngay lập tức, cho phép bên chiến thắng trong cuộc xung đột của chúng ta đặt ra các điều khoản hạn chế. Trong những trường hợp bình thường, kết thúc một cuộc xung đột như thế này và cho kẻ thù của chúng ta nghỉ ngơi chỉ là một công thức cho thảm họa, mặc dù sự thay thế trong trường hợp này dường như không tốt hơn nhiều.\n\nTừ chối có nghĩa là được coi là một cộng tác viên với những kẻ xâm lược nước ngoài trong một thời gian mà lòng yêu nước nhiệt thành là ở mức cao nhất mọi thời đại, và chúng ta sẽ thu hút sự khinh miệt từ liên minh Trung Quốc tập hợp để chống lại cuộc xâm lược nước ngoài. Chúng ta rất có thể sẽ phải đối mặt với toàn bộ mặt trận thống nhất trong cuộc xung đột lờ mờ nếu chúng ta không thực hiện các bước tương tự hướng tới hòa bình, một đề xuất lớn hơn nhiều trong phạm vi mà ban đầu chúng ta đã mặc cả."
 china_events.27.a: "Chúng ta miễn cưỡng chấp nhận."
 china_events.27.b: "Chúng ta ngoan cố từ chối."

 china_events.28.t: "[FROM.GetNameDefCap] Chấp nhận Ngừng bắn"
 china_events.28.d: "Đồng ý với nhu cầu đoàn kết dân tộc trong những thời điểm thảm khốc này, [FROM.GetLeader] đã đồng ý ký một lệnh ngừng bắn với đại diện của Mặt trận Thống nhất của chúng ta. Đối với hầu hết các phần, các lực lượng đã rút về vị trí hiện trạng, có thể gây ra ma sát nhưng trong kế hoạch lớn của sự vật đã được hòa bình. Chúng ta rất may mắn khi [FROM.GetAdjective] đã thấy lý do trong thời gian nguy hiểm này."
 china_events.28.a: "Đây là...chấp nhận được."

 china_events.29.t: "[FROM.GetNameDefCap] Từ chối Ngừng bắn"
 china_events.29.d: "Mặc dù tình trạng khẩn cấp quốc gia rõ ràng mà quốc gia phải đối mặt, [FROM.GetLeader] đã ngoan cố từ chối ký bất kỳ lệnh ngừng bắn nào và chấm dứt xung đột hiện tại của họ trong quốc gia Trung Quốc. Kết quả là, họ đã ném rất nhiều vào kẻ thù một cách hiệu quả và trở thành đồng minh với kẻ xâm lược. Do đó, chúng ta có rất ít lựa chọn ngoài việc chiến đấu với họ, loại bỏ một nhóm những kẻ phản bội ích kỷ khác làm hỏng sự toàn vẹn của quốc gia. Mặc dù kẻ thù của chúng ta tiếp tục phát triển, chúng ta hy vọng nhiều người đang chờ đợi trong biên giới [FROM.GetAdjective] để giải phóng dân tộc."
 china_events.29.a: "Hán gian đáng khinh!"

 china_events.30.t: "Nước cờ Đông Bắc"
 china_events.30.d: "Sự bùng nổ của Chiến tranh Biển Đông giữa Nhật Bản và Đức đã để lại lợi ích của Nhật Bản ở Đông Bắc (Đông Bắc Trung Quốc) dễ bị tổn thương. Tập hợp tình cảm yêu nước chống lại chủ nghĩa đế quốc Nhật Bản, [FROM.GetNameDef] đã tuyên chiến với Nhật Bản và các đồng minh của họ là đồng minh trong chiến tranh. Họ đã kêu gọi tất cả Trung Quốc chống lại chủ nghĩa đế quốc Nhật Bản, đề xuất rằng các phe phái Trung Quốc chiến đấu cùng nhau thành một Mặt trận Thống nhất Trung Quốc nhân danh an ninh quốc gia chung. Nếu chính phủ [FROM.GetAdjective] sụp đổ, họ cảnh báo, người Nhật sẽ dễ dàng có thể kết thúc phần còn lại của Trung Quốc từng phần.\n\nGợi ý này đã đặt hầu hết các quân phiệt còn lại và các đối thủ quốc gia trong một ràng buộc. Để chấp nhận sẽ bị kéo vào một cuộc xung đột lớn mà họ có thể không sẵn sàng. Từ chối sẽ được vẽ như là cộng tác viên Nhật Bản hiệu quả, bị công chúng coi thường. Ngay cả khi nhiều người càu nhàu rằng đây là một nỗ lực tuyệt vọng của [FROM.GetRulingParty] để cứu da của chính họ, chúng ta có thể chỉ đơn giản là có rất ít sự lựa chọn ngoài việc đồng ý với một liên minh tạm thời chống lại sự xâm lược của kẻ thù."
 china_events.30.a: "Chúng ta cân nhắc các lựa chọn."

 china_events.31.t: "Trung Quốc tham gia Đại chiến trên biển"
 china_events.31.d: "[ROOT.china_enters_great_seas_war_desc]"
 china_events.31.a: "[ROOT.china_united_front_option]"
 china_enters_great_seas_war_desc_front_leader: "Đấu tranh cho giải phóng Trung Quốc, chúng ta đã đạt được một sự nổi bật mà chúng ta từ lâu đã tìm kiếm như là nhà lãnh đạo hiệu quả của Trung Quốc. [ROOT.GetLeader] đã có bài phát biểu ngày hôm nay trong [ROOT.Capital.GetCapitalVictoryPointName] chính thức công bố việc thành lập Mặt trận Thống nhất Trung Quốc và kêu gọi tất cả Trung Quốc tập hợp lại vì sự nghiệp quốc gia.\n\nCuộc chiến tranh phía trước không được mong đợi sẽ dễ dàng bằng bất kỳ phương tiện nào, và liên minh mà chúng ta tập hợp có thể sẽ khó sử dụng. Tuy nhiên, sức mạnh của chúng ta đã được củng cố bởi sức mạnh chung của các đội quân quân phiệt khác nhau, và kết quả là tỷ lệ cược của chúng ta được cải thiện đáng kể. Dưới bóng của chiến tranh, Trung Quốc tự chui vào một cuộc xung đột kéo dài chống lại những kẻ sẽ chinh phục nó."
 china_enters_great_seas_war_desc_front_member: "Chiến đấu cho giải phóng Trung Quốc, chúng ta và nhiều người khác đã tập hợp lại với nhau để đối mặt với những kẻ xâm lược trong Mặt trận Thống nhất Trung Quốc. Một chính phủ chung, chủ yếu là trên giấy tờ, đã được thành lập để phối hợp các hoạt động, một trong số đó chúng ta đã quan tâm tích cực.\n\nCuộc chiến phía trước không được mong đợi sẽ dễ dàng, nhưng Trung Quốc thống nhất vẫn là một sức mạnh để nhìn. Với hàng triệu người yêu nước chuẩn bị chiến đấu và chết chống lại sự áp bức của nước ngoài, và với kinh nghiệm chiến trường đáng kể được chia sẻ giữa các thành viên của nó, chúng ta phải đẩy kẻ thù ra khỏi vùng đất Trung Quốc. Vì lợi ích của quốc gia, người dân và tương lai của nó, không thể đầu hàng!"
 china_enters_great_seas_war_desc_possible_front_member: "Tập hợp các phe phái khác nhau trong Trung Quốc lại với nhau, Mặt trận Thống nhất Trung Quốc đã được thành lập để chống lại chủ nghĩa đế quốc Nhật Bản và phối hợp giải phóng Dongbei. Mặc dù [ROOT.GetLeader] và các nhân viên của ông vẫn đang cân nhắc xem có nên tham gia hay không, điều đó không ngăn cản những người khác tiến lên trong việc tạo ra liên minh này.\n\nChúng ta đã trải qua áp lực nội bộ, ngay cả trong [ROOT.GetRulingParty] , tham gia vào việc giải phóng quê hương này, mặc dù những rủi ro vẫn còn rõ ràng. Hoa, Trung Quốc có thể gây ra một mối đe dọa lớn, tuy nhiên chiến thắng là xa đảm bảo. Và tương lai của mặt trận cũng không chắc chắn - điều gì sẽ xảy ra sau chiến thắng vẫn là một câu hỏi mở."
 china_enters_great_seas_war_desc_enemy: "Các lực lượng Trung Quốc khác nhau, khai thác lỗ hổng của chúng ta trong cuộc chiến với Đức, đã cùng nhau thành lập một cái gọi là \" Mặt trận Thống nhất Trung Quốc \" . Thống nhất các phe phái quân phiệt khác nhau thành một liên minh và chính phủ được cho là chung, họ đã thề sẽ buộc chúng ta phải rút lui khỏi Mãn Châu, sử dụng mọi nguồn lực và lòng yêu nước của Trung Quốc còn lại trong một quốc gia bị chia rẽ như vậy.\n\nMặc dù không chắc một liên minh khó sử dụng như vậy có thể thực sự đứng lên chống lại các lực lượng của chúng ta, nhưng sự thống nhất đột ngột này của Trung Quốc là nguyên nhân gây ra một số lo ngại. Chúng ta phải cẩn thận để điều chỉnh đầy đủ những thay đổi trên chiến trường như vậy và cũng có thể mở rộng phạm vi mục tiêu chiến dịch của chúng ta."
 china_enters_great_seas_war_desc_neutral: "Khai thác lỗ hổng của Nhật Bản trong cuộc chiến của họ với Đức, các phe phái khác nhau của Trung Quốc đã đồng ý hợp tác trong một \" Mặt trận Thống nhất Trung Quốc \" . Bề ngoài với một cấu trúc chỉ huy thống nhất và chính phủ, các chuyên gia cảnh báo rằng trong thực tế quyền tự chủ khu vực sẽ vẫn như cũ và sự phối hợp có thể sẽ thiếu.\n\nTuy nhiên, sự thống nhất đột ngột này chống lại chủ nghĩa đế quốc Nhật Bản đã gây ra một sự bùng nổ lòng yêu nước ở các thành phố trên toàn quốc. Bất cứ nghi ngờ nào tồn tại về sự chân thành của những người tham gia hoặc tỷ lệ chiến thắng phần lớn vẫn vô hình, khi quốc gia Trung Quốc huy động cho chiến tranh. Dường như ý tưởng về một Trung Quốc thống nhất còn lâu mới chết, mặc dù kết quả của cuộc chiến rất có thể thay đổi điều đó."

 china_events.32.t: "[CUF.GetLeader] đòi lại quyền lãnh đạo Trung Quốc"
 china_events.32.d: "Trong cuộc chiến tranh kháng chiến quốc gia của Trung Quốc, các phe phái khác nhau trên khắp đất liền đã tập hợp lại với nhau để chống lại cuộc xâm lược nước ngoài. Lãnh đạo Mặt trận Thống nhất Trung Quốc đã dao động khi vận may của các ứng cử viên khác nhau sáp và suy yếu khi họ tìm cách chứng minh tính khả thi lâu dài của họ với tư cách là chủ nhân của Trung Quốc. Thật bất ngờ, sự lãnh đạo thực tế đã rơi trên vai của một Thống đốc khu vực, người đã cam kết trung thành với chính quyền trung ương [CUF.GetAdjective]. Điều này gây ra một tranh chấp ngắn về việc ai thực sự phụ trách, nhưng cuối cùng đã được giải quyết khi [CUF.GetLeader] thể hiện đặc quyền của mình và nổi lên như một nhà lãnh đạo được công nhận của Trung Quốc ... ít nhất là bây giờ."
 china_events.32.a: "Đôi khi cần xáo trộn lãnh đạo trong chiến tranh."

### Army Reform Events ###
 china_events.40.t.first_step: "Cải cách quân sự [ROOT.GetAdjective]"
 china_events.40.d.first_step: "Các bước đầu tiên để cải cách quân đội của chúng ta đang được tiến hành, với việc tạo ra một bộ máy quan liêu tập trung để phối hợp hậu cần, cung cấp và thanh toán. Một ủy ban để xử lý dự án này đã được thành lập, với những người đàn ông đáng tin cậy được cho là do [ROOT.GetLeader] chọn lấy nhiệm vụ này một cách nhanh chóng. Điều này đặt nền tảng cho các cải cách quân đội trong tương lai, rất quan trọng để đưa lực lượng của chúng ta đến kỷ nguyên chiến tranh hiện đại."
 china_events.40.t.second_step: "Cải cách quân sự hành quân trở đi!"
 china_events.40.d.second_step: "Đã thực hiện những bước đầu tiên của chúng ta để cải thiện chất lượng quân đội, các sáng kiến tiếp theo đã sớm được thực hiện. Các đơn vị địa phương hóa đã bị chia nhỏ và phân phối lại, với một số sĩ quan hoàn toàn bị trục xuất vì tham nhũng. Đào tạo tương tự đã được tân trang từ mặt đất lên để đưa lực lượng của chúng ta tăng tốc với các kỹ thuật hiện đại.\n\nĐã có rất nhiều tiếng càu nhàu từ các thành viên của đội cận vệ cũ, đặc biệt là những người được hưởng lợi từ bản chất khu vực của lực lượng cũ của chúng ta. Tuy nhiên, mô hình chắp vá này, đôi khi hiệu quả hơn trong những ngày đầu của thời đại quân phiệt, không có chỗ đứng trong tương lai của quân đội chúng ta."
 china_events.40.t.third_step_officers: "Một hơi thở của không khí trong lành trong quân đội [ROOT.GetAdjective]"
 china_events.40.d.third_step_officers: "Sau những nỗ lực đáng kể, quân đội của chúng ta đã được cải cách triệt để. Đã cải cách thành công các thành phần cốt lõi của quân đội chúng ta, công việc khó khăn là tích hợp các đơn vị đồng minh và phụ trợ mà chúng ta đã thừa hưởng từ thời trước, bắt đầu.\n\nBộ tư lệnh tối cao của chúng ta vui mừng báo cáo những nỗ lực của họ trong vài tháng qua là một thành công. Mặc dù vẫn còn vấn đề với lính ma, bảng lương tham nhũng và đào ngũ, nhưng có rất ít nghi ngờ rằng chúng ta đã đi được một chặng đường dài."
 china_events.40.t.third_step_finished: "Một ngày mới cho quân đội [ROOT.GetAdjective]"
 china_events.40.d.third_step_finished: "Sau nỗ lực đáng kể, các thành phần cốt lõi của quân đội chúng ta đã được cải cách triệt để. Đi là những người lính ma, đào ngũ, cướp bóc, cấu trúc bán phong kiến. Thay vào đó là một lực lượng chuyên nghiệp mới, có thể so sánh với châu Âu và Nhật Bản. Bây giờ, họ đã sẵn sàng để thực thi thống nhất Trung Quốc và có thể vượt ra ngoài, một đội quân thực sự được tính đến!"
 china_events.40.a: "Quân đội của chúng ta chiến thắng ngay cả trên chiến trường!"

 china_events.41.t.army_reform_ongoing: "Vệ sinh nhà cửa và bắt trộm"
 china_events.41.d.army_reform_ongoing: "Quân đội Trung Quốc đã có một sự đi xuống nghiêm trọng về chất lượng trong vài năm qua, bất chấp sự phong phú của các sĩ quan kỳ cựu được sản xuất bởi thời đại quân phiệt. Nhiều người đã đạt được cấp bậc của họ thông qua chủ nghĩa gia đình trị, tham nhũng hoặc thiên vị, trong khi những người khác (ngay cả những người có thẩm quyền) khai thác sức mạnh của họ cho mục đích riêng của họ.\n\nNhững nỗ lực của chúng ta đã liên quan đến việc dọn dẹp các danh sách ma, ngăn chặn đào ngũ và loại bỏ sự bảo trợ - tăng trách nhiệm giải trình trong hàng ngũ của chúng ta. Một nhóm sĩ quan mới đã được đào tạo cho mục đích này, thấm nhuần tinh thần yêu nước và hy vọng ít bị ảnh hưởng bởi tham nhũng hơn so với các thế hệ trước."
 china_events.41.t.army_reform_finished: "Một ngày mới cho quân đội [ROOT.GetAdjective]"
 china_events.41.d.army_reform_finished: "$china_events.41.d.army_reform_ongoing$\n\nNhững sĩ quan này gia nhập một đội quân được cải cách triệt để từ trong ra ngoài, sẵn sàng giải phóng đất nước của họ. Thông qua những nỗ lực của chúng ta, họ đã trở thành một lực lượng chuyên nghiệp, có thể so sánh với châu Âu và Nhật Bản. Nguyện xin họ đảm bảo Trung Quốc sẽ không bao giờ bị chia rẽ hay nhục nhã nữa!"
 china_events.41.a: "Một thế hệ sĩ quan mới cho một Trung Quốc mới."

### Capital Event ###
 china_events.50.t: "Thủ đô mới"
 china_events.50.d: "Với sự thống nhất của Trung Quốc, cuối cùng đã đến lúc thiết lập vị trí thường trực của chính quyền trung ương mới. Bắc Kinh sẽ là sự lựa chọn tự nhiên, một thành phố cổ vốn là thủ đô của các chính phủ Trung Quốc trong nhiều thế kỷ qua dưới thời nhà Nguyên. Một đối thủ mạnh mẽ, nó sẽ đại diện cho một quá trình chuyển đổi tự nhiên, ổn định từ cái cũ. Tuy nhiên, điều này cũng chống lại nó, được liên kết mạnh mẽ với chế độ quân chủ và chính quyền Bắc Dương thất bại. Ở một mức độ thấp hơn, nó nhấn mạnh một sự thống trị chính trị nhất định ở phía bắc trong chính trị quốc gia.\n\nNam Kinh là một lựa chọn tiềm năng khác, nằm gần trung tâm của Trung Quốc, giữa sông Dương Tử và Hoàng Hà. Nam Kinh là thủ đô của triều đại nhà Minh, thủ đô lâm thời của Đệ nhất Cộng hòa trước khi Viên Thế Khải chiếm đoạt, và có giá trị đáng kể trong số những người theo chủ nghĩa dân tộc và cộng hòa.\n\nTương tự, Vũ Hán, nằm xa hơn trong đất liền, là địa điểm của cuộc nổi dậy Vũ Xương, tâm chấn của Cách mạng Tân Hợi lần đầu tiên lật đổ chế độ quân chủ nhà Thanh. Biểu tượng của nó đã làm cho nó trở thành một lựa chọn phổ biến cho những người cách mạng tìm kiếm sự phá vỡ vững chắc khỏi trật tự cũ.\n\nQuảng Châu, một lựa chọn gây tranh cãi, cũng đã được ném vào hỗn hợp. Trung tâm kinh tế của miền Nam và một thành phố cảng lớn, nó đã là lò sưởi truyền thống cho các phong trào cách mạng cộng hòa. Cả Quốc dân đảng và phong trào Liên bang đều bắt nguồn từ đây, và nhiều sĩ quan hàng đầu của họ lớn lên hoặc được đào tạo trong thành phố kể từ khi bắt đầu phong trào Bảo vệ Hiến pháp.\n\nCác thành phố khác đã được xem xét, tuy nhiên khi các cuộc thảo luận kết thúc, dường như danh sách đã nhanh chóng bị thu hẹp. Sau khi cân nhắc thêm, chính quyền [ROOT.GetAdjective] đã giải quyết ..."
 china_events.50.a: "[GetVictoryPointName_9843] ."
 china_events.50.b: "Nam Kinh."
 china_events.50.c: "Vũ Hán."
 china_events.50.e: "Quảng Châu."
 china_events.50.f: "Ở trong [ROOT.Capital.GetCapitalVictoryPointName]."

### Becomes Most Legitimate Tooltip
 china_events.51.t: "[ROOT.Capital.GetCapitalVictoryPointName] đang phát triển nổi tiếng"
 china_events.51.d: "Với sự sụp đổ gần đây của đối thủ mạnh nhất của chúng ta, hầu hết các nhà quan sát đã chuyển sự chú ý của họ đến [ROOT.GetLeader] và [ROOT.GetRulingParty] là ứng cử viên có khả năng nhất để đoàn kết Trung Quốc dưới ngọn cờ của họ. Đại sứ quán nước ngoài đã bắt đầu quá trình chuyển đổi công nhận từ người tiền nhiệm của chúng ta với chính phủ của chúng ta, và Bộ Ngoại giao của chúng ta tự tin rằng chúng ta sẽ sớm đạt được sự công nhận quốc tế rộng rãi. Trong nước, tính chính danh của chúng ta đã được nâng lên, mở ra con đường của chúng ta để thống nhất đất nước.\n\nĐây là một vị trí bấp bênh tất nhiên, như cánh cửa quay vòng của lãnh đạo Bắc Dương và Quảng Châu đã cho thấy. Là người mạnh nhất thường làm cho một mục tiêu, không chỉ từ các bè phái quân phiệt đối thủ mà còn cho các chủ nợ thường tìm cách thanh toán cho các khoản vay đến hạn trong quá khứ của chính phủ Trung Quốc trước đây. Nó cũng thu hút sự ghen tuông và tham vọng từ bên trong trại của chúng ta, khi lực lượng thống nhất của các mối đe dọa bên ngoài rút đi. [ROOT.GetLeader] sẽ được khuyên nên biết chiến thắng của chúng ta hầu như không được đảm bảo. Tuy nhiên, chiến thắng là tốt trong tầm tay của chúng ta, nếu chỉ có chúng ta sẽ mất nó. Sau đó đến phần khó khăn ..."
 china_events.51.a: "Giờ ai còn dám cản đường chúng ta?"

 china_events.52.t: "Một thủ đô lâm thời?"
 china_events.52.d: "Với quân đội của chúng ta đều đặn đạt được lợi ích, nhu cầu hậu cần và quan liêu để kiểm soát một phần ngày càng tăng của đất nước đã đưa ra các cuộc thảo luận về việc di chuyển cơ sở hoạt động chính của chúng ta từ [ROOT.Capital.GetCapitalVictoryPointName] . Vốn hiện tại của chúng ta, trong khi phục vụ một vai trò quan trọng trong quá khứ và cũng là trung tâm của cơ sở chính trị của chúng ta, được coi là có lẽ quá khu vực trong tự nhiên. Một vị trí trung tâm, phía bắc hơn trong quốc gia có thể mang lại cho chúng ta lợi thế chiến lược và chính trị.\n\nBắc Kinh là thủ đô truyền thống của quốc gia, đã phục vụ trong vai trò đó trong nhiều thiên niên kỷ. Đây là một đối thủ mạnh vì nó báo hiệu sự liên tục của chính phủ Trung Quốc, tuy nhiên nó cũng liên quan đến Cộng hòa Bắc Dương thất bại, đối thủ lâu năm của chính phủ Quảng Châu. Vị trí phía bắc của nó cũng làm cho nó dễ bị tấn công từ Mãn Châu, mặc dù nằm sau núi và sông, nó là một căn cứ đáng gờm.\n\nVũ Hán là nơi Cách mạng Tân Hợi bắt đầu. Được tạo thành từ ba thành phố nhỏ hơn (Wuchang, Hán Dương và Hán Khẩu), nó nằm trên một vị trí quan trọng ở sông Dương Tử ở trung tâm của quốc gia. Được bảo vệ bởi dòng sông hội tụ và tương đối sâu trong lãnh thổ Trung Quốc và có Quân xưởng Hán Dương, không có gì ngạc nhiên khi đây là căn cứ lâu năm của Ngô Bội Phu.\n\nNam Kinh là nơi Tiến sĩ Sun lần đầu tiên được bổ nhiệm làm Chủ tịch nước cộng hòa lâm thời (và là nơi ông chọn để chôn cất), người ta nói rằng đây là nơi ông đã chọn thủ đô của mình trong cuộc sống và trong cái chết. Tâm chấn của khu vực Giang Nam giàu có và nằm ở trung tâm bờ biển, nó đã phát triển một ngành công nghiệp tốt đẹp dưới sự cai trị của Tôn Truyền Phương và là một ứng cử viên mạnh mẽ khác cho một thủ đô tạm thời."
 china_events.52.a: "Bắc Kinh, thủ đô truyền thống."
 china_events.52.b: "Vũ Hán, cái nôi của cách mạng."
 china_events.52.c: "Nam Kinh, thành phố biển giàu có."
 china_events.52.e: "Chúng ta hãy ở lại [ROOT.Capital.GetCapitalVictoryPointName]."

### Demanding Cities ###
 china_events.60.t: "Chính phủ Trung ương đòi Bắc Kinh"
 china_events.60.d: "Chiến thắng của liên minh cách mạng của chúng ta đã lật đổ thành công các đối thủ của chúng ta trong khu vực. Đã tự hào phục vụ sự nghiệp quốc gia, các quản trị viên của chúng ta đã bắt đầu quá trình quan trọng để khôi phục trật tự ở Bắc Kinh. Thành phố, được dịch theo nghĩa đen \" Thủ đô phía Bắc \", đã đóng một vai trò then chốt trong lịch sử Trung Quốc. Nó từ lâu đã phục vụ như là thủ đô của đất nước và việc chiếm giữ nó đã mang lại một lượng đáng kể tính chính danh cho cả [FROM.GetNameDef] và [ROOT.GetLeader].\n\nCác đồng minh của chúng ta dường như đã nhận ra thực tế này và ngày càng nghi ngờ về ý định của chúng ta. Báo chí ở [FROM.capital.GetCapitalVictoryPointName] đã ngừng in đề cập đến [ROOT.GetLeader] hoặc [ROOT.GetRulingParty], một dấu hiệu sớm về sự không hài lòng của họ. Họ cũng đã cử một số đại diện của riêng mình trong một nỗ lực không quá tinh tế để giành quyền kiểm soát chính quyền khu vực từ lãnh đạo được chỉ định của chúng ta.\n\nĐẩy đang đến để xô đẩy, và cuối cùng chúng ta đã nhận được một cuộc gọi riêng từ [FROM.GetLeader] mình yêu cầu chúng ta bàn giao thẩm quyền của Bắc Kinh cho chính quyền trung ương của nước Cộng hòa để quản lý trực tiếp. Sự xâm lấn vào quyền tự chủ địa phương này là một mối đe dọa nghiêm trọng đối với chính quyền của chúng ta nhưng có vẻ như họ không có ý định lùi bước khỏi cuộc đối đầu này. Chấp nhận sẽ là hành động cao quý, mặc dù có lẽ sẽ khiến chúng ta phải phụ thuộc vĩnh viễn. Tuy nhiên, một tham vọng nhất định nhấp nháy trong mắt [ROOT.GetLeader]. Đây sẽ không phải là lần đầu tiên một liên minh cách mạng sụp đổ trên thành phố nổi tiếng."
 china_events.60.a: "Cho nên, chúng ta phải nhường bước."
 china_events.60.b: "Quyền tự chủ của chúng ta sẽ không bị xâm phạm!"

 china_events.61.t: "[FROM.GetNameDefCap] Năng suất Bắc Kinh"
 china_events.61.d: "Cúi đầu dưới áp lực của chính quyền trung ương ngày càng tăng, [FROM.GetLeader] và [FROM.GetName] đã đồng ý chuyển giao quyền tài phán của Bắc Kinh và các khu vực xung quanh cho chính quyền trung ương. Một phái đoàn lớn các quan chức đến sớm hôm nay tại ga Zhengyangmen để đảm nhận các vị trí của họ trong thành phố, mặc dù đây chủ yếu là một thủ tục. Trước họ là nhiều sĩ quan quân đội trung ương và các đại diện khác đã làm việc để đảm bảo bàn giao trơn tru và hòa bình. Với thủ đô cũ cuối cùng nằm dưới sự kiểm soát của chúng ta và một đối thủ tiềm năng khiêm tốn, cuối cùng chúng ta có thể bắt đầu chuẩn bị cho các bước tiếp theo của chúng ta trong thống nhất quốc gia."
 china_events.61.a: "Đúng như nó phải thế."

 china_events.62.t: "[FROM.GetLeader] thách thức tính chính danh của chúng ta"
 china_events.62.d: "Mặc dù chúng ta đã đạt được thành công việc nộp [FROM.GetLeader] và [FROM.GetRulingParty] của [FROM.GetName], có vẻ như những quân phiệt ngoan cố quá ngoan cố để vâng lời lâu dài. Điều này là không may dự kiến, với sự thống nhất ở Trung Quốc hay thay đổi và thoáng qua trong những thời điểm khủng khiếp này. Khi các đối thủ cạnh tranh cho lãnh đạo quốc gia vuông tắt, nhiều tỉnh tiếp tục được hưởng quyền tự chủ đáng kể chơi chúng với nhau.\n\n[FROM.GetLeader] đang chơi một trò chơi khác nhau tuy nhiên. Nếu các báo cáo là đúng, ông đang nỗ lực không chỉ để làm suy yếu sự kiểm soát của chính phủ trung ương trong [FROM.Capital.GetCapitalVictoryPointName] nhưng để làm suy yếu chính phủ trung ương hoàn toàn, công khai đặt câu hỏi về tính chính danh của chúng ta và nổi câu hỏi chết người về những gì một lựa chọn tốt hơn có thể được. Kết luận của cuộc điều tra này, tự nhiên, là [FROM.GetLeader] ."
 china_events.62.a: "Chúng ta sẽ được phục vụ tốt nếu không hạ thấp cảnh giác."

 china_events.63.t: "[FROM.GetLeader] gây áp lực cho chúng ta hành động!"
 china_events.63.d: "Câu hỏi thống nhất đã cản trở các nhà lãnh đạo Trung Quốc kể từ năm 1911, đặc biệt là khi đất nước phân cực thành các chính phủ miền Bắc và miền Nam và từ đó tách ra thành các phe phái quân phiệt đối thủ hơn nữa. Nỗ lực hòa giải các bên tham chiến thông qua đàm phán đã giảm nhiều lần, và có rất ít chỗ để thảo luận thêm. Cách duy nhất để chúng ta tiến lên là tập hợp chính phủ của chúng ta và đoàn kết đất nước bằng vũ lực.\n\nKhông phải tất cả những người theo dõi của chúng ta đều hài lòng với sự tiến bộ của chúng ta. Mặc dù [ROOT.GetLeader] và các quan chức cấp cao khác của chính phủ chúng ta đã cố gắng khôn ngoan khi chúng ta thực hiện các động thái của mình, nhiều nhà lãnh đạo địa phương đã phàn nàn rằng sự thống nhất dường như là một giấc mơ xa xôi. [FROM.GetLeader] đã khuấy động thêm tình trạng bất ổn, ám chỉ rằng chúng ta đã cố tình dành thời gian của mình để siết chặt thêm tiền từ các tỉnh. Giữa những người theo chủ nghĩa dân tộc yêu cầu Trung Quốc đoàn kết và những người theo chủ nghĩa khu vực coi thường sự chờ đợi hơn nữa, chúng ta đã chịu áp lực phải thực hiện các bước quyết định trong việc thống nhất đất nước."
 china_events.63.a: "Đến lúc rồi..."

 china_events.64.t: "[FROM.GetLeader] tăng thêm áp lực"
 china_events.64.d: "Dàn hợp xướng của những tiếng nói yêu cầu chúng ta thực hiện các bước để đoàn kết đất nước đã phát triển với việc bổ sung [FROM.GetLeader] và chính phủ [FROM.GetAdjective]. Cho dù vì một mong muốn thực sự để thấy quốc gia thống nhất hay một nỗ lực ích kỷ để làm suy yếu những nỗ lực của chúng ta, nó đe dọa gây thiệt hại đáng kể cho hình ảnh của chính quyền của chúng ta. Nó cũng có nghĩa là sự hỗn loạn này khó có thể tồn tại trong tương lai gần."
 china_events.64.a: "Chúng ta đang tới đó!"

###Flavor ####
 china_events.70.t: "Quốc khánh Trung Hoa Dân Quốc"
 china_events.70.d.zhili_monarchy: "Quốc gia của chúng ta đã tồn tại hàng ngàn năm. Trong hai thiên niên kỷ, Trung Quốc là trung tâm của châu Á, với các vương quốc nhỏ bám vào ánh sáng văn minh của nó. Tuy nhiên, Đế chế kéo dài mười nghìn năm đã chiến đấu trong tình trạng hỗn loạn lớn vào thế kỷ 19. Trong khi triều đại nhà Thanh đã mở rộng biên giới của Trung Quốc lên tầm cao mới, bệnh dịch đế quốc châu Âu đã đưa Đế chế xuống mức thấp vô hình. Tệ hơn nữa, người Nhật không khoan nhượng đã xử lý nhà Thanh một thất bại gây sốc trong Chiến tranh Trung-Nhật. Với triều đại trong tình trạng hỗn loạn, người dân Trung Quốc mất niềm tin vào hệ thống đế quốc.\n\nNgày 10 tháng 10 năm 1911 là ngày thay đổi Đế chế của chúng ta mãi mãi. Trong một hành động nổi dậy, những người cách mạng trong Quân đội Bắc Dương đóng quân ở Vũ Xương đã quay sang các quân phiệt Mãn Châu của họ, và bắt đầu Cách mạng Tân Hợi. Trong khi Cách mạng tràn vào miền Nam, miền Bắc vẫn dành cho nhà Thanh dưới sự bảo vệ của Nguyên soái Viên Thế Khải. Tuy nhiên, nhìn thấy thủy triều của số phận, Yuan đã đồng ý phế truất Hoàng đế Phổ Nghi để đổi lấy Tổng thống. Trong khi ban đầu buộc phải thỏa hiệp với phiến quân cách mạng, Yuan chuyên nghiệp đứng bên lề họ và mở rộng quyền lực Bắc Dương. Tuy nhiên, tham vọng quân chủ của ông đã phản tác dụng và kích hoạt Kỷ nguyên quân phiệt mới.\n\nThời kỳ chia rẽ này đã kết thúc sau thất bại của cuộc viễn chinh phương Bắc, khi các Nguyên soái Ngô Bội Phu, Cao Côn và Tôn Truyền Phương mang hòa bình đến Trung Quốc, và trong một hành động hào hiệp, đã đưa Hoàng đế trở lại để mở ra một kỷ nguyên hòa bình mới. Tuy nhiên, năm 1936 đã mang theo sự sụp đổ của trật tự Trực hệ và quay trở lại chiến tranh cấp tỉnh. Tuy nhiên, Nhà Thanh và Trực hệ vẫn kiên trì qua tất cả. Mặc dù một số người sẽ coi ngày 10 tháng 10 như một lời nhắc nhở về sự khởi đầu của chế độ quân phiệt, nhưng nó nhằm nhắc nhở Nguyên soái Ngọc và Hoàng đế Phổ Nghi về một sự kiện không thể thiếu trong lịch sử vĩnh cửu của chúng ta, và những bài học của Tân Hải tiếp tục hướng dẫn chúng ta vào thời đại hài hòa hiện đại đang chờ đợi chúng ta."
 china_events.70.d.other_monarchy: "Quốc gia của chúng ta đã tồn tại hàng ngàn năm. Trong hai thiên niên kỷ, Trung Quốc là trung tâm của châu Á, với các vương quốc nhỏ bám vào ánh sáng văn minh của nó. Tuy nhiên, Đế chế kéo dài mười nghìn năm đã chiến đấu trong tình trạng hỗn loạn lớn vào thế kỷ 19. Trong khi triều đại nhà Thanh đã mở rộng biên giới của Trung Quốc lên tầm cao mới, bệnh dịch đế quốc châu Âu đã đưa Đế chế xuống mức thấp vô hình. Tệ hơn nữa, người Nhật không khoan nhượng đã xử lý nhà Thanh một thất bại gây sốc trong Chiến tranh Trung-Nhật. Với triều đại trong tình trạng hỗn loạn, người dân Trung Quốc mất niềm tin vào hệ thống đế quốc.\n\nNgày 10 tháng 10 năm 1911 là ngày thay đổi Đế chế của chúng ta mãi mãi. Trong một hành động nổi dậy, những người cách mạng trong Quân đội Bắc Dương đóng quân ở Vũ Xương đã quay lưng lại với các quân phiệt Mãn Châu của họ, và bắt đầu Cách mạng Tân Hợi. Trong khi Cách mạng tràn vào miền Nam, miền Bắc vẫn dành cho nhà Thanh dưới sự bảo vệ của Nguyên soái Viên Thế Khải. Tuy nhiên, trong một hành động phản bội không lường trước được, Yuan đã đồng ý phế truất Hoàng đế Phổ Nghi để đổi lấy Tổng thống. Kể cả những kẻ cơ hội, Viên Thế Khải thậm chí còn thiết lập một chế độ quân chủ mới, với chính kẻ ngốc là Hoàng đế!\n\nHoàng đế giả mạo thấy người dân Trung Quốc không ủng hộ triều đại bất hợp pháp của mình, và lật đổ ông trước khi triều đại của ông có thể bắt đầu. Những hành động ích kỷ của Nguyên đã dẫn đến Thời đại quân phiệt, nơi những người Cộng hòa tranh giành quyền lực với nhau, trước khi Trực hệ mang lại một thập kỷ hòa bình. Hiểu được lực lượng ổn định của chế độ quân chủ, Tào Côn và Ngô Bội Phu đã khôi phục Hoàng đế Puyi hợp pháp lên Ngai Rồng. Tuy nhiên, vì những kẻ quân phiệt này chỉ tìm cách sử dụng Hoàng đế vì lợi ích riêng của họ, quyền bá chủ tự lừa dối của họ đã kết thúc sau một thập kỷ.\n\nVới những kẻ ngốc Trực Lệ bây giờ trong thùng rác của lịch sử, Đế chế tái sinh bắt đầu công việc của mình để sửa chữa một quốc gia ốm yếu từ căn bệnh của chủ nghĩa cộng hòa và chủ nghĩa đế quốc. Ngày 10 tháng 10 vẫn là một lời hứa sai lầm để chấm dứt những tai họa do bên ngoài gây ra, và dưới con đường vua chúa, kỷ nguyên thứ hai của nhà Thanh sẽ cạnh tranh với những vinh quang của triều đại Đông Hán!"
 china_events.70.d.kuomintang_republic: "Năm 1644, triều đại nhà Minh được ấp ủ đã phải chịu sự chiếm đóng bất công của những kẻ xâm lược Mãn Châu. Kẻ phản bội Wu Sangui cho phép người Mãn Châu vượt qua Vạn Lý Trường Thành, khiến người Hán phải chịu nhiều thế kỷ áp bức. Tuy nhiên, người dân Trung Quốc đã không quên thời đại tự do của nó. Trong suốt thập kỷ cuối cùng của thế kỷ 19 và thập kỷ đầu tiên của thế kỷ 20, những người yêu nước Trung Quốc vẫn mơ ước về một quốc gia thoát khỏi chế độ phong kiến Mãn Châu chuẩn bị \" Lật đổ nhà Thanh, Khôi phục nhà Minh. \"\n\nNgày 10 tháng 10 năm 1911 là ngày xiềng xích trên người Hán cuối cùng đã bị phá vỡ. Trong một hành động dũng cảm tuyệt vời, những người cách mạng trong Quân đội Bắc Dương đóng quân ở Vũ Xương đã quay lưng lại với các quân phiệt Mãn Châu của họ và bắt đầu Cách mạng Tân Hải. Trong khi Cách mạng mất một năm để thực hiện mục tiêu của mình, nhà Thanh đáng ghét đã bị lật đổ thông qua một hành động thống nhất giữa Nguyên soái Viên Thế Khải và Chủ tịch lâm thời Tôn Trung Sơn. Nhưng chúng ta là những kẻ ngốc khi tin tưởng Yuan. Năm 1913, ông đã ám sát đồng chí Song Jiaoren, và thậm chí cố gắng biến mình thành Hoàng đế Trung Quốc. Sau khi ông qua đời, Cộng hòa Bắc Dương tiếp tục chế giễu ký ức của Tân Hải.\n\nTừ vị trí cách mạng ở Quảng Châu, Tôn Trung Sơn và những người theo ông đáng tin cậy trong Quốc dân đảng biết rằng thí nghiệm Bắc Dương thất bại phải được dập tắt bằng nắm đấm sắt. Được thành lập vào năm 1926, Quốc dân đảng bắt đầu Cuộc viễn chinh phương Bắc để loại bỏ Chính phủ Bắc Dương một lần và mãi mãi. Trong một hành động tàn nhẫn lớn, Kền kền Đức đã hạ xuống từ tổ chuột của chúng và làm tê liệt Cách mạng Quốc gia của chúng ta và cứu Chính phủ Bắc Dương.\n\nMặc dù nhiều thập kỷ thất bại, giấc mơ Tân Hải vẫn không bị Đảng Quốc gia lãng quên. Không, chúng ta phấn đấu cho một nền Cộng hòa mới, làm sạch những điểm yếu phong kiến và phản động của người đầu tiên. Đất nước chúng ta sẽ không còn phải chịu sự bóc lột của nước ngoài, chúng ta sẽ không còn phải chịu sự áp bức của quân phiệt, chúng ta sẽ không còn phải chịu những thất bại tự do nữa! Ngày 10 tháng 10 không đại diện cho chế độ chuyên quyền Bắc Dương, mà là kỷ nguyên của Mặt trời trắng nhân danh và ký ức của Tiến sĩ Tôn Trung Sơn và Ba nguyên tắc của ông!"
 china_events.70.d.other_republic: "Năm 1644, triều đại nhà Minh ấp ủ đã phải chịu sự chiếm đóng bất công của những kẻ xâm lược Mãn Châu. Kẻ phản bội Wu Sangui đã cho phép người Mãn Châu vượt qua Vạn Lý Trường Thành, khiến người Hán phải chịu nhiều thế kỷ áp bức. Tuy nhiên, người dân Trung Quốc vẫn chưa quên thời đại tự do của nó. Trong suốt thập kỷ cuối cùng của thế kỷ 19 và thập kỷ đầu tiên của thế kỷ 20, những người yêu nước Trung Quốc vẫn mơ ước về một quốc gia thoát khỏi chế độ phong kiến Mãn Châu chuẩn bị \" Lật đổ nhà Thanh, Khôi phục nhà Minh \"\n\nNgày 10 tháng 10 năm 1911 là ngày xiềng xích trên người Hán cuối cùng đã bị phá vỡ. Trong một hành động dũng cảm tuyệt vời, các nhà cách mạng trong Quân đội Bắc Dương đóng quân ở Vũ Xương đã quay sang các quân phiệt Mãn Châu của họ, và bắt đầu Cách mạng Tân Hợi. Trong khi Cách mạng mất một năm để thực hiện mục tiêu của mình, triều đại nhà Thanh đáng ghét đã bị lật đổ thông qua một hành động thống nhất giữa Nguyên soái Viên Thế Khải và Tổng thống lâm thời Tôn Trung Sơn. Bi kịch thay, Cộng hòa của chúng ta đã bị tê liệt bởi sự chia rẽ từ khi bắt đầu. Không muốn theo dòng chảy của lịch sử, Viên Thế Khải đã ám sát người chiến thắng cuộc bầu cử hợp pháp Song Jiaoren, và biến Cộng hòa thành chế độ độc tài cá nhân của ông.\n\nNăm 1915, ông còn tiến xa hơn nữa, tuyên bố mình là Hoàng đế của Chế độ quân chủ Hongxian. Những người yêu nước cộng hòa do Thái Ngạc lãnh đạo ở Vân Nam đã hồi sinh Cách mạng trong Chiến tranh Hộ quốc và mang lại Cộng hòa của chúng ta. Sau cái chết của Yuan, Cộng hòa bị rạn nứt dọc theo đường Bắc và Nam, với các chính phủ đối thủ hoạt động ở Quảng Châu và Bắc Kinh. Sự phân chia này kết thúc sau sự sụp đổ của Chính phủ Quảng Châu trong Cuộc thám hiểm phía Bắc với sự thống nhất do Trực Lệ lãnh đạo, nhưng 1936 đã mang đến sự sụp đổ của một thập kỷ hòa bình và ngọn lửa chiến tranh bùng lên. Mặc dù Cộng hòa còn lâu mới hoàn hảo, Double Ten Day nhắc nhở chúng ta sống theo Giấc mơ của Tân Hải."
 china_events.70.a: "Trung Hoa Dân Quốc vạn tuế!"
 china_events.70.b: "Trung Hoa Dân Quốc vạn tuế..."
 china_events.70.c: "Hãy để ngày 10 tháng 10 phai nhạt khỏi ký ức!"

### Tibet/East Turkestan/Mongolia Interactions Events ###
 china_events.100.t: "[FROM.GetNameDefCap] Nhu cầu hội nhập của chúng ta"
 china_events.100.d.independent: "Sự sụp đổ của nhà Thanh trong cuộc Cách mạng Tân Hợi năm 1911 đã tạo ra khả năng độc lập cho quốc gia có chủ quyền của chúng ta. Trong khi chúng ta từng là đối tượng không muốn của tòa án Trung Quốc và lĩnh vực Trung Quốc, sự sụp đổ quyền lực của Trung Quốc trong khu vực đã cho chúng ta hy vọng rằng bản sắc dân tộc và văn hóa của chúng ta có thể trải nghiệm một sự tái sinh.\n\nThật không may, nỗi sợ hãi lớn nhất của chúng ta đã trở lại khi đối mặt với [FROM.GetNameDef] - người đã yêu cầu chúng ta đầu hàng ngay lập tức và chấp nhận sự sáp nhập của Trung Quốc vào đất đai của chúng ta. Dường như chúng ta đứng một mình; không có quyền lực nào sẵn sàng bảo vệ chúng ta và chúng ta sẽ đơn độc nếu chiến tranh nổ ra giữa chúng ta và [FROM.GetNameDef] . Trong khi những kẻ diều hâu trong chính phủ của chúng ta đã yêu cầu chúng ta cắn lại và chống lại đế quốc Trung Quốc, cũng đã có rất nhiều chính trị gia và trưởng lão cho rằng số phận của chúng ta sẽ được phục vụ tốt hơn nếu chúng ta sẵn sàng đầu hàng chính phủ Trung Quốc."

 china_events.100.d.is_puppet: "Sự sụp đổ của nhà Thanh trong cuộc Cách mạng Tân Hợi năm 1911 đã tạo ra khả năng độc lập cho quốc gia có chủ quyền của chúng ta. Trong khi chúng ta từng là đối tượng không muốn của tòa án Trung Quốc và lĩnh vực Trung Quốc, sự sụp đổ quyền lực của Trung Quốc trong khu vực đã cho chúng ta hy vọng rằng bản sắc dân tộc và văn hóa của chúng ta có thể trải nghiệm một sự tái sinh.\n\nThật không may, nỗi sợ hãi lớn nhất của chúng ta đã trở lại khi đối mặt với [FROM.GetNameDef] - người đã yêu cầu chúng ta đầu hàng ngay lập tức và chấp nhận việc Trung Quốc sáp nhập đất đai của chúng ta. Tuy nhiên, chúng ta không đứng một mình vì [THIS.overlord.GetNameDef] đã cam kết bảo vệ biên giới của chúng ta với hy vọng khiến Trung Quốc từ bỏ. Trong khi những kẻ diều hâu trong chính phủ của chúng ta đã yêu cầu chúng ta cắn lại và chống lại đế quốc Trung Quốc bằng cách yêu cầu [THIS.overlord.GetNameDef] can thiệp thay mặt chúng ta, cũng có rất nhiều chính trị gia và trưởng lão cho rằng số phận của chúng ta sẽ được phục vụ tốt hơn nếu chúng ta sẵn sàng đầu hàng chính phủ Trung Quốc."

 china_events.100.d.was_puppet: "Sự sụp đổ của nhà Thanh trong cuộc Cách mạng Tân Hợi năm 1911 đã tạo ra khả năng độc lập cho quốc gia có chủ quyền của chúng ta. Trong khi chúng ta từng là đối tượng không muốn của tòa án Trung Quốc và lĩnh vực Trung Quốc, sự sụp đổ quyền lực của Trung Quốc trong khu vực đã cho chúng ta hy vọng rằng bản sắc dân tộc và văn hóa của chúng ta có thể trải nghiệm một sự tái sinh.\n\nThật không may, nỗi sợ hãi lớn nhất của chúng ta đã trở lại khi đối mặt với [FROM.GetNameDef] - những người đã yêu cầu chúng ta đầu hàng ngay lập tức và chấp nhận sự sáp nhập của Trung Quốc vào đất đai của chúng ta. Chúng ta đã nghĩ rằng [THIS.overlord.GetNameDef] sẽ đến viện trợ cho chúng ta, nhưng dường như số phận của chúng ta thậm chí không nằm trong tay chúng ta, vì họ đã ban hành một tuyên bố trung lập. Trong khi những kẻ diều hâu trong chính phủ của chúng ta đã yêu cầu chúng ta cắn lại và chống lại đế quốc Trung Quốc, cũng có rất nhiều chính trị gia và trưởng lão cho rằng số phận của chúng ta được phục vụ tốt hơn nếu chúng ta sẵn sàng đầu hàng chính phủ Trung Quốc."

 china_events.100.d.is_in_faction: "Sự sụp đổ của nhà Thanh trong cuộc Cách mạng Tân Hợi năm 1911 đã tạo ra khả năng độc lập cho quốc gia có chủ quyền của chúng ta. Trong khi chúng ta từng là đối tượng không muốn của tòa án Trung Quốc và lĩnh vực Trung Quốc, sự sụp đổ quyền lực của Trung Quốc trong khu vực đã cho chúng ta hy vọng rằng bản sắc dân tộc và văn hóa của chúng ta có thể trải nghiệm một sự tái sinh.\n\nThật không may, nỗi sợ hãi lớn nhất của chúng ta đã trở lại khi đối mặt với [FROM.GetNameDef] - người đã yêu cầu chúng ta đầu hàng ngay lập tức và chấp nhận sự sáp nhập của Trung Quốc vào đất đai của chúng ta. Tuy nhiên, có hy vọng cho chúng ta vì [ROOT.FactionLeader.GetName] đã hứa với chúng ta sự hỗ trợ đầy đủ của họ khi đối mặt với một cuộc xâm lược của Trung Quốc. Chúng ta hãy kiến nghị và hy vọng rằng họ thấy lý do trong lời cầu xin của chúng ta và họ sẽ bảo vệ chúng ta khỏi mất độc lập một lần nữa."

 china_events.100.d.was_in_faction: "Sự sụp đổ của nhà Thanh trong cuộc Cách mạng Tân Hợi năm 1911 đã tạo ra khả năng độc lập cho quốc gia có chủ quyền của chúng ta. Trong khi chúng ta từng là đối tượng không muốn của triều đình Trung Quốc và lĩnh vực Trung Quốc, sự sụp đổ của chính quyền Trung Quốc trong khu vực đã cho chúng ta hy vọng rằng bản sắc dân tộc và văn hóa của chúng ta có thể trải nghiệm sự tái sinh. Thật không may, nỗi sợ hãi lớn nhất của chúng ta đã trở lại khi đối mặt với [FROM.GetNameDef] - người đã yêu cầu chúng ta đầu hàng ngay lập tức và chấp nhận sự sáp nhập của Trung Quốc vào đất đai của chúng ta. Để làm cho vấn đề tồi tệ hơn, [ROOT.FactionLeader.GetName] đã tuyên bố trung lập công khai trong cuộc xung đột sắp tới và đã từ chối hỗ trợ chúng ta trong cuộc chiến sinh tồn của chúng ta. Dường như chúng ta không còn lựa chọn nào khác ngoài chiến đấu cho đến cuối cùng."

 china_events.100.a: "Chúng ta phải đầu hàng ngay."
 china_events.100.b: "Đòi hỏi quyền tự chủ để đổi lấy."
 china_events.100.c: "Thỏa hiệp - cho họ đất của người Hán để giành độc lập."
 china_events.100.d: "Yêu cầu Nga can thiệp."
 china_events.100.e: "Yêu cầu Ấn Độ can thiệp."
 china_events.100.f: "Chúng ta sẽ không bao giờ đầu hàng!"
 china_events.100.g: "Yêu cầu [THIS.overlord.GetNameDef] can thiệp."
 china_events.100.h: "Yêu cầu [ROOT.FactionLeader.GetNameDef] can thiệp."

 china_events.101.t: "Sự đầu hàng của [FROM.GetNameDef]"
 china_events.101.d: "Đối mặt với tỷ lệ cược chính trị và quân sự áp đảo, [FROM.GetNameDef] đã thấy lý do và đã đồng ý tham dự các cuộc đàm phán. Không muốn mạo hiểm đổ máu và hủy diệt tiềm năng của họ, họ đã đồng ý đầu hàng vô điều kiện theo các điều khoản của chúng ta. Sau khi chúng ta quyết định tôn trọng các chính phủ dân sự và thường dân ở các vùng lãnh thổ bị mất, chính phủ của họ đã chính thức đầu hàng và chấp nhận việc sáp nhập đất đai của Trung Quốc trong một sự chuyển giao quyền lực hòa bình. Trên khắp đất nước chúng ta, công dân của chúng ta sẽ ăn mừng khi đất nước, từ lâu đã chia rẽ, sẽ đoàn kết một lần nữa."
 china_events.101.a: "Một chiến thắng thực sự cho Trung Quốc!"

 china_events.102.t: "[FROM.GetNameDefCap] Yêu cầu Tự chủ"
 china_events.102.d: "Đối mặt với tỷ lệ cược chính trị và quân sự áp đảo, [FROM.GetNameDef] đã thấy lý do và đã đồng ý tham dự các cuộc đàm phán. Không muốn mạo hiểm đổ máu và phá hủy tiềm năng của họ nhưng vẫn duy trì ý thức về phẩm giá và độc lập, họ đã đề nghị chúng ta đầu hàng để đổi lấy quyền tự chủ. Họ sẽ được phép hoạt động theo luật pháp bên ngoài đất nước chúng ta như một thực thể có chủ quyền nhưng sẽ bị ràng buộc độc quyền với thị trường và liên kết chính trị của chúng ta. Trong khi chúng ta chắc chắn xem những vùng đất này là không thể thiếu đối với quốc gia Trung Quốc, có lẽ chúng ta có thể thấy quan điểm của họ và tôn trọng quyền tự chủ của họ dưới ảnh hưởng của chúng ta. Những người theo chủ nghĩa dân tộc khác đã lập luận rằng vì chúng ta có bàn tay lớn hơn trong các cuộc đàm phán này, ít nhất chúng ta nên yêu cầu các khu vực có nhiều cư dân Hán nhất để chúng ta có thể khuyến khích giải quyết trên biên giới. Ngoài ra, những kẻ diều hâu trong chính phủ của chúng ta đã chỉ đơn giản yêu cầu chúng ta đi đến chiến tranh ngay lập tức vì [FROM.GetNameDef] có ít cơ hội chống lại sức mạnh quân sự của chúng ta."
 china_events.102.a: "Chúng ta chấp nhận mong muốn tự chủ của họ."
 china_events.102.b: "Yêu cầu họ trả lại những vùng đất mà họ đã cướp của chúng ta!"
 china_events.102.c: "Nó sẽ là chiến tranh."

 china_events.103.t: "[ROOT.GetNameDefCap] Trở thành một khu tự trị"
 china_events.103.d.default: "Dường như các cuộc đàm phán với [FROM.GetNameDef] đã diễn ra tốt đẹp. Có lẽ phải đối mặt với áp lực và chỉ trích quốc tế, chính phủ Trung Quốc đã đồng ý trao cho chúng ta quyền tự chủ hoàn toàn mà không cần nhượng bộ nào khác - miễn là chúng ta vẫn gắn bó về kinh tế và chính trị với lĩnh vực Trung Quốc. Đây là một chiến thắng vĩ đại cho đất nước chúng ta vì đã tránh được đổ máu, nhưng sự độc lập của chúng ta đã được công nhận và vinh danh."
 china_events.103.d.kept_lands: "Dường như các cuộc đàm phán với [FROM.GetNameDef] đã diễn ra tốt đẹp. Có lẽ phải đối mặt với áp lực và chỉ trích quốc tế, chính phủ Trung Quốc đã đồng ý cấp cho chúng ta quyền tự chủ hoàn toàn mà không cần nhượng bộ nào khác - miễn là chúng ta vẫn gắn bó về kinh tế và chính trị với lĩnh vực Trung Quốc. Trong khi người Trung Quốc ban đầu yêu cầu các khu vực mà họ coi là \" tỉnh Han \" , dường như họ cũng đã nhượng bộ trước yêu cầu này - có lẽ với hy vọng tìm thấy sự ưu ái tốt trong mắt chúng ta. Đây là một chiến thắng vĩ đại cho đất nước chúng ta vì đã tránh được đổ máu, nhưng nền độc lập của chúng ta đã được công nhận và vinh danh."
 china_events.103.a: "Khủng hoảng đã chấm dứt!"

 china_events.104.t: "[FROM.GetNameDefCap] Nhu cầu \" Vùng đất thiểu số Han \" Trả lại cho Tự trị"
 china_events.104.d: "Trong các cuộc đàm phán với [FROM.GetNameDef], chính phủ Trung Quốc đã đồng ý cung cấp cho chính phủ và quyền tự chủ quốc gia của chúng ta miễn là chúng ta nhượng lãnh thổ mà họ tuyên bố là do người Hán thống trị. Trong khi những khu vực này rõ ràng là của chúng ta, các thành viên hòa bình của chính phủ chúng ta đã kêu gọi lãnh đạo của chúng ta chấp nhận những yêu cầu này để tránh đổ máu. Ngay cả khi chúng ta mất đất cho Trung Quốc, ít nhất lãnh thổ cốt lõi và người dân của chúng ta sẽ được phép tận hưởng những lợi ích độc lập cách xa sự cai trị của Trung Quốc. Những người theo chủ nghĩa dân tộc trong chính phủ của chúng ta đã tố cáo ý tưởng này, tuyên bố rằng chúng ta nên được đối xử bình đẳng tại bàn đàm phán và rằng nhu cầu của Trung Quốc đối với một số lãnh thổ của chúng ta cuối cùng sẽ kết thúc với tất cả các lãnh thổ của chúng ta bị mất."
 china_events.104.a: "Chúng ta chấp nhận yêu cầu của họ."
 china_events.104.b: "Chúng ta sẽ không bao giờ nhượng lại đất đai cho bọn thực dân!"

 china_events.105.t: "[FROM.GetNameDefCap] trả lại đất Hán"
 china_events.105.d: "Các cuộc đàm phán của chúng ta đã diễn ra tốt đẹp với [FROM.GetNameDef], người đã gửi đại sứ đến thủ đô của chúng ta để thảo luận về các tranh chấp đất đai đang diễn ra. Có lẽ nhìn thấy sự vô vọng của vị trí của họ, họ đã đồng ý nhượng lại tất cả các vùng đất có người Hán sinh sống để đổi lấy quyền tự chủ của họ trong phạm vi của chúng ta. Chúng ta sẽ chấp nhận đề xuất và đầu hàng của họ, nhưng sự cố này đã cho thấy rằng chúng ta hiện hoàn toàn có khả năng thể hiện sức mạnh và sức mạnh của mình ở châu Á."
 china_events.105.a: "Chúng ta sẽ tôn trọng hiệp ước bất kể."

 china_events.106.t: "[FROM.GetNameDefCap] từ chối trả lại đất"
 china_events.106.d: "Các cuộc đàm phán của chúng ta đã diễn ra kém với [FROM.GetNameDef] và các đại sứ của họ vẫn thách thức trong nhiều yếu tố chính trong tranh chấp đất đai đang diễn ra của chúng ta. Bướng bỉnh từ chối nhượng lại bất kỳ lãnh thổ [FROM.GetAdjective] nào, ngay cả những người có đa số là người Hán, họ đã tuân thủ các điều khoản ban đầu mà họ đã đưa ra, đó là tự trị trong phạm vi ảnh hưởng của chúng ta. Đó sẽ là con đường ít kháng cự nhất, mặc dù có thể sẽ gây ra các vấn đề kéo dài trong quan hệ đối tác của chúng ta trong nhiều năm tới. Một số người chỉ có thể tự hỏi liệu họ có thực sự có đòn bẩy để yêu cầu các điều kiện như vậy hay không."
 china_events.106.a: "Hãy để họ giữ đất."
 china_events.106.b: "Ngừng đàm phán."

 china_events.107.t: "[FROM.GetNameDefCap] Cung cấp để trả lại đất"
 china_events.107.d: "Trong các cuộc đàm phán đang diễn ra của chúng ta với [FROM.GetNameDef], họ đã đồng ý nhượng lại những vùng đất mà chúng ta tuyên bố sở hữu một thiểu số người Hán đáng kể. Đổi lại, họ yêu cầu chúng ta sẽ từ bỏ tất cả các yêu sách trên lãnh thổ cốt lõi và tôn trọng và công nhận chủ quyền quốc gia của họ. Trong khi một số người ôn hòa đã ủng hộ cách tiếp cận này, những người theo chủ nghĩa dân tộc của đất nước chúng ta đã lập luận rằng những vùng lãnh thổ này là những vùng đất không thể tách rời của Trung Quốc và nếu bị mất, chúng có thể được sử dụng bởi các cường quốc nước ngoài chống lại chúng ta. Thay vào đó, họ đã kiến nghị chính phủ của chúng ta có lập trường tích cực hơn để giải quyết cuộc khủng hoảng."
 china_events.107.a: "Chúng ta đồng ý với đề xuất của họ"
 china_events.107.b: "Những vùng đất ấy thuộc Trung Quốc!"

 china_events.108.t: "[FROM.GetNameDefCap] chấp nhận đề nghị trả lại đất"
 china_events.108.d: "Trong các cuộc đàm phán đang diễn ra của chúng ta với [FROM.GetNameDef], họ đã đồng ý chấp nhận đề xuất hòa bình của chúng ta, trong đó chúng ta sẽ nhượng lại những vùng đất mà chúng ta tuyên bố sở hữu một thiểu số người Hán đáng kể. Đổi lại, họ đã đồng ý với tất cả các yêu sách trên lãnh thổ cốt lõi của họ và tôn trọng và công nhận chủ quyền quốc gia của họ. Trong khi những người theo chủ nghĩa hòa bình và ôn hòa đã hoan nghênh động thái này, cũng có những người trong chính phủ của chúng ta đã ủng hộ việc từ chối đề xuất này vì một nhu cầu về đất đai có thể dẫn đến một nhu cầu khác trong tương lai. Thay vào đó, họ lập luận rằng chúng ta nên chống lại và chiến đấu thay vì đầu hàng đế quốc Trung Quốc."
 china_events.108.a: "Hòa bình trong thời đại chúng ta."
 china_events.108.b: "Chúng ta quyết không nhượng một tấc đất!"

 china_events.109.t.from_russia: "Nga từ chối bảo vệ"
 china_events.109.d.from_russia: "Trải dài hai lục địa, chúng ta giáp với quốc gia hùng mạnh của Nga - cường quốc cổ đại được gọi là Gấu phương Đông. Trong khi họ bị người Nhật hạ bệ trong Chiến tranh 1904 và càng bị sỉ nhục bởi cách mạng và nội chiến sau Weltkrieg, sự hồi sinh của Nga trên sân khấu thế giới đã khiến họ trở thành người bảo vệ tiềm năng trong cuộc khủng hoảng đang diễn ra của chúng ta chống lại Chính phủ Trung Quốc.\n\nTuy nhiên, người Nga đã từ chối trả lời kêu gọi giúp đỡ của chúng ta. Có lẽ họ đã bí mật đàm phán số phận của chúng ta với Trung Quốc hoặc có lẽ họ có những lo ngại cấp bách hơn ở phương Tây.\n\n[china_offers_available_paragraph]\n\n[china_seek_protection_paragraph]"

 china_events.109.t.from_india: "Ấn Độ từ chối bảo vệ"
 china_events.109.d.from_india: "Quốc gia cổ xưa của Ấn Độ gần đây đã thống nhất, có thể gây ra một mối đe dọa đáng kể đối với tham vọng của Trung Quốc như là đối thủ tiềm năng của ngành công nghiệp và dân số và thậm chí có thể vượt xa quy mô của Trung Quốc. Trong nhu cầu tuyệt vọng về sự giúp đỡ, chúng ta đã gửi các nhà đàm phán để tìm ra một sự can thiệp có thể của Ấn Độ để ngăn chặn sự xâm lược và xâm lấn của Trung Quốc vào biên giới của chúng ta.\n\nTuy nhiên, người Ấn Độ đã từ chối trả lời lời kêu gọi giúp đỡ của chúng ta. Họ có thể đã bí mật đàm phán số phận của chúng ta với Trung Quốc, hoặc họ có thể có những lo ngại cấp bách hơn ở nơi khác. Cho dù đó có thể là, có vẻ như chúng ta đang ở một mình.\n\n[china_offers_available_paragraph]\n\n[china_seek_protection_paragraph]"

 china_events.109.t.from_china_refused_autonomy: "Trung Quốc từ chối tự trị"
 china_events.109.d.from_china_refused_autonomy: "Tin tức chán nản từ [FROM.GetNameDef] ngày hôm nay vì họ đã từ chối đề nghị tự chủ của chúng ta. Có lẽ nếu chúng ta đề nghị nhượng lại vùng đất mà họ yêu cầu, họ có thể sẵn sàng xem xét mong muốn của chúng ta để giữ độc lập. Cho dù câu trả lời của họ có thể là, chúng ta phải chuẩn bị cho điều tồi tệ nhất.\n\n[china_offers_available_paragraph]\n\n[china_seek_protection_paragraph]"

 china_events.109.t.from_china_refused_lands: "Trung Quốc từ chối đất đai"
 china_events.109.d.from_china_refused_lands: "Mặc dù chúng ta hào phóng đề nghị nhượng lại những vùng đất mà họ yêu cầu trên cơ sở có người thiểu số Hán, [FROM.GetNameDef] đã hoàn toàn từ chối lời đề nghị tự chủ của chúng ta để đổi lấy đất của chúng ta. Có vẻ như chúng ta không còn nhiều lựa chọn trên bàn ngoại trừ việc chống lại và chống lại cái cớ trắng trợn này để xâm phạm chủ quyền quốc gia của chúng ta.\n\n[china_offers_available_paragraph]\n\n[china_seek_protection_paragraph]"

 china_events.109.t.from_china_refused_both: "Trung Quốc đưa ra tối hậu thư"
 china_events.109.d.from_china_refused_both: "Chúng ta đã nhận được tin tức nghiêm trọng ngày hôm nay rằng [FROM.GetNameDef] đã từ chối đề nghị tự chủ của chúng ta và cũng đã từ chối đề nghị tự chủ của chúng ta để đổi lấy các lãnh thổ của chúng ta có thiểu số người Hán. Khi các cuộc đàm phán tan vỡ, đại sứ của họ đã trao cho chính phủ của chúng ta một ghi chú yêu cầu chúng ta ngay lập tức đầu hàng và từ bỏ tất cả các khái niệm về một chính phủ quốc gia để tuân thủ biên giới tiền Cộng hòa của quốc gia chúng ta là một phần của nhà nước Trung Quốc lớn hơn. Tại thời điểm này, chúng ta có thể chọn tránh đổ máu bằng cách đầu hàng hoặc quyết định chiến đấu và hy vọng chống lại đến cùng.\n\n[china_offers_available_paragraph]\n\n[china_seek_protection_paragraph]"

 china_offers_available_paragraph_autonomy_lands: "Khi Trung Quốc xâm lấn biên giới của chúng ta và yêu cầu chúng ta sáp nhập hoàn toàn vào lãnh thổ của họ, triển vọng độc lập của chúng ta trở nên mờ nhạt. Các yếu tố thực dụng trong chính phủ của chúng ta đã gợi ý rằng chúng ta nhượng lại các vùng lãnh thổ mà chúng ta sở hữu nhưng sở hữu một thiểu số người Hán đáng kể. Làm như vậy có thể xoa dịu Trung Quốc và tham vọng đế quốc của họ về chủ quyền của chúng ta, mặc dù việc nhượng lại lãnh thổ mà không sẵn sàng chiến đấu là một cú đánh vào uy tín quốc gia của chúng ta."
 china_offers_available_paragraph_autonomy_refused_lands: "Các cuộc đàm phán của chúng ta với [FROM.GetNameDef] sẽ không diễn ra theo kế hoạch. Mặc dù đề nghị hào phóng của chúng ta là nhượng lại các vùng lãnh thổ mà chúng ta sở hữu có chứa một thiểu số người Hán đáng kể cho Chính phủ Trung Quốc, các nhà đàm phán Trung Quốc đã thẳng thừng từ chối lời đề nghị của chúng ta - yêu cầu chúng ta hoàn toàn khuất phục sức mạnh đế quốc đang trỗi dậy của họ.\n\nNhững kẻ diều hâu ồn ào nhất trong chính phủ của chúng ta đang nói với lãnh đạo của chúng ta từ chối bất kỳ đề nghị nào của Trung Quốc và chuẩn bị cho cuộc chiến với [FROM.GetNameDef]. Tuy nhiên, những người theo chủ nghĩa hòa bình và các thành viên thực dụng của chính phủ chúng ta đang kiến nghị chính phủ của chúng ta cung cấp [FROM.GetNameDef] đệ trình của chúng ta để đổi lấy quyền tự chủ."

 china_offers_available_paragraph_autonomy: "Các cuộc đàm phán của chúng ta với [FROM.GetNameDef] sẽ không diễn ra theo kế hoạch. Rõ ràng là Trung Quốc sẽ yêu cầu sáp nhập toàn bộ hoặc đệ trình của chúng ta. Như một giải pháp thay thế để tránh một cuộc chiến tàn khốc đối với người dân của chúng ta và một cuộc chiến với tỷ lệ cược gần như không thể giành chiến thắng, lãnh đạo của chúng ta đã đề xuất rằng chúng ta đề nghị Chính phủ Trung Quốc có khả năng nhận được tư cách là một quốc gia tự trị trong phạm vi Trung Quốc."

 china_offers_available_paragraph_lands: "đàm phán của chúng ta với [FROM.GetNameDef] sẽ không theo kế hoạch. Rõ ràng là Trung Quốc sẽ yêu cầu hoặc sáp nhập tổng số của chúng ta hoặc trình của chúng ta. Như là một thay thế để tránh một cuộc chiến tranh tàn phá trên các dân tộc của chúng ta và một cuộc chiến tranh với tỷ lệ cược gần như không thể giành chiến thắng, lãnh đạo của chúng ta đã đề xuất rằng chúng ta cung cấp cho Chính phủ Trung Quốc những vùng đất mà họ hiện đang tuyên bố sở hữu một thiểu số Hán đáng kể. Trong khi điều này có vẻ là một mất mát của khuôn mặt đối với chúng ta, nó có thể đặt ra một lựa chọn tốt hơn so với thay thế."

 china_seek_protection_paragraph_intro: "Trong khi chúng ta từ lâu đã phải vật lộn với sự áp bức dưới thời các quân phiệt Trung Quốc, những thay đổi địa chính trị mới trên khắp thế giới hiện nay đang mang đến một cơ hội. Ở phía bắc xa xôi, quốc gia hồi sinh [RUS.GetNameDef] tìm cách tái khẳng định quyền bá chủ của mình đối với Á-Âu và chắc chắn sẽ là một đồng minh mạnh mẽ mà chúng ta có thể cố gắng kháng cáo. Ở bán cầu nam của lục địa châu Á nằm ở quốc gia Ấn Độ thống nhất gần đây - điều đó chắc chắn sẽ hy vọng tìm cách ngăn chặn chủ nghĩa bành trướng của Trung Quốc. Có lẽ với những quốc gia đang trỗi dậy lớn này, chúng ta có thể tìm thấy sự bảo vệ chống lại sự xâm lấn của Trung Quốc trên biên giới của chúng ta."

 china_seek_protection_paragraph_refused_both: "$china_seek_protection_paragraph_intro$\n\nThật không may cho chúng ta, cả hai cường quốc đã từ chối yêu cầu viện trợ của chúng ta. Có vẻ như chúng ta đang ở một mình."
 china_seek_protection_paragraph_refused_russia_socialist_india: "$china_seek_protection_paragraph_intro$\n\nThật không may cho chúng ta, người Nga đã từ chối lời đề nghị của chúng ta. Tuy nhiên, chúng ta có thể tiếp cận [HND.GetNameDef] để được trợ giúp mặc dù họ có thể yêu cầu chính phủ của chúng ta tuyên bố đầy đủ những lý tưởng của chủ nghĩa xã hội để nhận được sự bảo vệ và viện trợ. Những người bảo thủ trong chính phủ của chúng ta đã lên tiếng phản đối đề nghị này - nhưng chúng ta không có nhiều lựa chọn nếu chúng ta cần tìm kiếm một người ủng hộ."
 china_seek_protection_paragraph_refused_russia_default_india: "$china_seek_protection_paragraph_intro$\n\nThật không may cho chúng ta, người Nga đã bác bỏ kiến nghị của chúng ta nhưng Chính phủ Ấn Độ dường như cởi mở với đề nghị của chúng ta và lời cầu xin bảo vệ của chúng ta. Chúng ta hãy hy vọng họ thấy một số ý nghĩa và sẵn sàng bảo vệ quyền tự quyết quốc gia của chúng ta."
 china_seek_protection_paragraph_refused_india_socialist_russia: "$china_seek_protection_paragraph_intro$\n\nThật không may cho chúng ta, người Ấn Độ đã từ chối lời đề nghị của chúng ta. Tuy nhiên, chúng ta có thể tiếp cận [RUS.GetNameDef] để được viện trợ mặc dù chính phủ xã hội chủ nghĩa Nga có thể yêu cầu chính phủ của chúng ta tham gia hoàn toàn vào lĩnh vực của họ với tư cách là một đồng minh xã hội chủ nghĩa. Những người bảo thủ trong chính phủ của chúng ta đã lên tiếng phản đối đề nghị này - nhưng chúng ta không có nhiều lựa chọn nếu chúng ta cần tìm kiếm một người ủng hộ để bảo vệ."
 china_seek_protection_paragraph_refused_india_default_russia: "$china_seek_protection_paragraph_intro$\n\nThật không may cho chúng ta, người Ấn Độ đã bác bỏ kiến nghị của chúng ta nhưng dường như Chính phủ Nga có vẻ cởi mở với đề nghị của chúng ta. Chúng ta hãy hy vọng họ thấy một số ý nghĩa và sẵn sàng bảo vệ quyền tự quyết quốc gia của chúng ta."
 china_seek_protection_paragraph_socialist_russia_socialist_india: "$china_seek_protection_paragraph_intro$\n\nCác quốc gia xã hội chủ nghĩa [HND.GetNameDef] và [RUS.GetNameDef] đã bày tỏ sự quan tâm của họ trong việc bảo vệ quyền tự quyết quốc gia và quyền tồn tại của chúng ta. Tuy nhiên, họ có thể yêu cầu chính phủ của chúng ta chuyển sang một thay thế cánh tả hoặc xã hội chủ nghĩa để tham gia vào cuộc cách mạng chung của họ. Những người bảo thủ trong chính phủ của chúng ta đã lên tiếng phản đối đề nghị này - nhưng có lẽ điều này là cần thiết để cứu đất nước chúng ta khỏi bị hủy diệt."
 china_seek_protection_paragraph_default_russia_socialist_india: "$china_seek_protection_paragraph_intro$\n\nNgười Nga đã bày tỏ sự quan tâm đến việc bảo vệ biên giới và chủ quyền quốc gia của chúng ta nhưng [HND.GetNameDef] cũng đã gửi cho các đại sứ của chúng ta một lưu ý về thiện chí và một lời hứa tiềm năng cho tình hữu nghị. Tuy nhiên, nếu chúng ta liên kết với người Ấn Độ, họ có thể tìm cách yêu cầu chính phủ của chúng ta chia sẻ trong cuộc cách mạng của họ và thành lập một chính phủ cánh tả. Điều này có thể khơi dậy sự tức giận từ những người bảo thủ của chúng ta nhưng chúng ta có thể cần phải làm như vậy để bảo vệ đất nước chúng ta khỏi bị hủy diệt."
 china_seek_protection_paragraph_socialist_russia_default_india: "$china_seek_protection_paragraph_intro$\n\nNgười Ấn Độ đã bày tỏ sự quan tâm đến việc bảo vệ biên giới và chủ quyền quốc gia của chúng ta nhưng [RUS.GetNameDef] cũng đã gửi cho các đại sứ của chúng ta một lưu ý về thiện chí và một lời hứa tiềm năng cho tình hữu nghị. Tuy nhiên, nếu chúng ta liên kết với người Nga, họ có thể tìm cách yêu cầu chính phủ của chúng ta chia sẻ trong cuộc cách mạng của họ và thành lập một chính phủ cánh tả. Điều này có thể khơi dậy sự tức giận từ những người bảo thủ của chúng ta nhưng chúng ta có thể cần phải làm như vậy để bảo vệ đất nước chúng ta khỏi bị hủy diệt."
 china_seek_protection_paragraph_default_both: "$china_seek_protection_paragraph_intro$\n\nCả Chính phủ Nga và Chính phủ Ấn Độ đều bày tỏ quan tâm đến việc bảo vệ chủ quyền quốc gia của chúng ta trong mong muốn hạn chế sự bành trướng của Trung Quốc. Chúng ta hãy tham khảo ý kiến lãnh đạo để xác định con đường mà đất nước chúng ta nên đi nhưng chúng ta yên tâm rằng chúng ta có thể có một người ủng hộ mạnh mẽ để chống lại Trung Quốc chiếm giữ đất nước chúng ta."

 china_seek_protection_paragraph_russia_socialist: "Trong khi chúng ta từ lâu đã phải vật lộn với sự áp bức của chúng ta dưới chúa tể Trung Quốc của chúng ta, sự thay đổi địa chính trị mới trên toàn thế giới hiện nay là một cơ hội. Ở phía Bắc xa xôi, quốc gia hồi sinh của [RUS.GetNameDef] tìm cách tái khẳng định quyền bá chủ của mình đối với Á-Âu và chắc chắn sẽ là một đồng minh mạnh mẽ mà chúng ta có thể cố gắng kháng cáo. Tuy nhiên, nếu chúng ta liên kết với người Nga, họ có thể tìm cách yêu cầu chính phủ của chúng ta chia sẻ trong cuộc cách mạng của họ và thiết lập một chính phủ cánh tả. Điều này có thể khơi dậy sự tức giận từ những người bảo thủ của chúng ta nhưng chúng ta có thể cần phải làm như vậy để bảo vệ đất nước chúng ta khỏi bị hủy diệt."
 china_seek_protection_paragraph_russia_default: "Trong khi chúng ta từ lâu đã phải vật lộn với sự áp bức của chúng ta dưới thời các quân phiệt Trung Quốc, những thay đổi địa chính trị mới trên khắp thế giới hiện nay đang mang đến một cơ hội. Ở phía Bắc xa xôi, quốc gia hồi sinh [RUS.GetNameDef] tìm cách khẳng định lại quyền bá chủ của mình đối với Á-Âu và chắc chắn sẽ là một đồng minh mạnh mẽ mà chúng ta có thể cố gắng kháng cáo. Có lẽ với họ, chúng ta có thể tìm thấy sự bảo vệ chống lại sự xâm lấn của Trung Quốc trên biên giới của chúng ta."

 china_seek_protection_paragraph_india_socialist: "Trong khi chúng ta từ lâu đã phải vật lộn với sự áp bức của mình dưới thời các quân phiệt Trung Quốc, những thay đổi địa chính trị mới trên khắp thế giới hiện nay đang mang đến một cơ hội. Ở bán cầu nam của lục địa châu Á nằm ở quốc gia Ấn Độ thống nhất gần đây - chắc chắn sẽ hy vọng tìm cách kiềm chế chủ nghĩa bành trướng Trung Quốc. Tuy nhiên, nếu chúng ta liên kết với người Ấn Độ, họ có thể tìm cách yêu cầu chính phủ chúng ta chia sẻ cuộc cách mạng của họ và thành lập một chính phủ cánh tả. Điều này có thể khơi dậy sự tức giận từ những người bảo thủ của chúng ta nhưng chúng ta có thể cần phải làm như vậy để bảo vệ đất nước chúng ta khỏi bị hủy diệt."
 china_seek_protection_paragraph_india_default: "Trong khi chúng ta từ lâu đã đấu tranh với sự áp bức của chúng ta dưới thời các quân phiệt Trung Quốc, những thay đổi địa chính trị mới trên khắp thế giới hiện nay là một cơ hội. Ở bán cầu nam của lục địa châu Á nằm ở quốc gia Ấn Độ thống nhất gần đây - điều đó chắc chắn sẽ hy vọng tìm cách kiềm chế chủ nghĩa bành trướng Trung Quốc. Có lẽ với họ, chúng ta có thể tìm thấy sự bảo vệ chống lại sự xâm lấn của Trung Quốc trên biên giới của chúng ta."

 china_events.109.a: "Chúng ta phải đầu hàng ngay."
 china_events.109.b: "Đòi hỏi quyền tự chủ để đổi lấy."
 china_events.109.c:  "Thỏa hiệp - cho họ đất của người Hán để giành độc lập."
 china_events.109.d: "Chúng ta tìm kiếm sự giúp đỡ từ Chính phủ Nga."
 china_events.109.e: "Chúng ta sẽ tìm kiếm sự giúp đỡ từ chính phủ Ấn Độ."
 china_events.109.f: "Chúng ta sẽ không bao giờ đầu hàng!"

 china_events.110.intro: "Chúng ta đã nhận được một yêu cầu khẩn cấp từ [FROM.GetNameDef] yêu cầu chúng ta bảo vệ chống lại chủ nghĩa phục hồi và bành trướng Trung Quốc. Trong khi khu vực này trên danh nghĩa thuộc phạm vi của nhà Thanh, sau Cách mạng 1911, họ nổi lên với một chính phủ độc lập và nhiều người trong số họ không muốn thấy mình tái hòa nhập vào nhà nước Trung Quốc. Kết quả là, họ đã tiếp cận chính phủ của chúng ta với hy vọng rằng chúng ta đến để hỗ trợ họ trong giờ khắc thảm khốc của họ."
 china_events.110.t: "[FROM.GetNameDefCap] yêu cầu bảo vệ chống lại Trung Quốc"
 china_events.110.d.russia_already_guaranteed: "$china_events.110.intro$\n\nChúng ta hiện đang đảm bảo sự độc lập của [FROM.GetNameDef] và do đó có thể tự nhiên đến viện trợ của họ để chống lại chủ nghĩa bành trướng Trung Quốc. Tuy nhiên, cũng có những người trong chính phủ của chúng ta cho rằng một Trung Quốc thống nhất có thể chứng minh là quá mệt mỏi đối với chúng ta và chúng ta có thể bị khóa vào một cuộc chiến không kết thúc nhanh chóng. Người Trung Quốc chắc chắn sẽ không từ chối đứng xuống và đất nước chúng ta có thể có các mối đe dọa khác để đối phó."
 china_events.110.d.russia: "$china_events.110.intro$ Nếu chúng ta can thiệp thay mặt họ, họ đã tuyên bố rằng họ sẽ gia nhập liên minh của chúng ta với tư cách là một thành viên độc lập."
 china_events.110.d.india_already_guaranteed: "$china_events.110.intro$\n\nChúng ta hiện đang đảm bảo sự độc lập của [FROM.GetNameDef] và do đó có thể tự nhiên đến viện trợ của họ để chống lại chủ nghĩa bành trướng Trung Quốc. Tuy nhiên, cũng có những người trong chính phủ của chúng ta cho rằng một Trung Quốc thống nhất có thể chứng minh là quá mệt mỏi đối với chúng ta và chúng ta có thể bị khóa vào một cuộc chiến không kết thúc nhanh chóng. Người Trung Quốc chắc chắn sẽ không từ chối đứng xuống và đất nước chúng ta có thể có các mối đe dọa khác để đối phó."
 china_events.110.d.india: "$china_events.110.intro$ Nếu chúng ta can thiệp thay mặt họ, họ đã tuyên bố rằng họ sẽ gia nhập liên minh của chúng ta với tư cách là một thành viên độc lập."
 china_events.110.a: "Chúng ta sẽ đến giúp họ."
 china_events.110.b: "Yêu cầu họ thông qua một chính phủ xã hội chủ nghĩa cùng một lúc."
 china_events.110.c: "Họ phải tự lo lấy."

 china_events.111.t: "[FROM.GetNameDefCap] đã cung cấp cho chúng ta bảo vệ của họ!"
 china_events.111.d.russia: "Lời cầu xin giúp đỡ của chúng ta đã không được trả lời! Chính phủ Nga tuyên bố với chính phủ của chúng ta rằng họ thừa nhận chủ quyền quốc gia của chúng ta và sẽ tuyên bố với chính quyền Trung Quốc rằng họ phải rút tất cả quân đội của họ hoặc nếu không phải đối mặt với một cuộc chiến tranh chung. Chúng ta có thể yên tâm bây giờ mà Moscow bây giờ đã trở lại của chúng ta."
 china_events.111.d.india: "Lời cầu xin giúp đỡ của chúng ta đã không được trả lời! Chính phủ Ấn Độ tuyên bố với chính phủ của chúng ta rằng họ thừa nhận chủ quyền quốc gia của chúng ta và sẽ tuyên bố với chính phủ Trung Quốc rằng họ phải rút tất cả quân đội của họ hoặc nếu không sẽ phải đối mặt với một cuộc chiến tranh chung. Bây giờ chúng ta có thể yên tâm rằng cường quốc Nam Á có thể trở thành đồng minh của chúng ta chống lại đế quốc Trung Quốc!"
 china_events.111.a: "Người Trung Quốc sẽ không dám đến bây giờ..."

 china_events.112.t: "[From.From.GetNameDefCap] bảo vệ [FROM.GetNameDef]"
 china_events.112.d.russia: "Trong khi chúng ta coi [FROM.GetNameDef] là một phần không thể thiếu của đất nước và biên giới tự nhiên của chúng ta, có vẻ như những kẻ hèn nhát đã kêu gọi [FROM.FROM.GetNameDef] bảo vệ. Chính phủ Nga đã đưa ra tối hậu thư cho chúng ta để chấm dứt yêu sách và xâm lược của chúng ta chống lại [FROM.GetNameDef] hoặc nếu không phải đối mặt với chiến tranh. Trong khi những kẻ diều hâu của chúng ta đang kêu gọi chúng ta tận dụng lợi thế của quốc gia Nga suy yếu, những người ôn hòa và hòa bình đã tuyên bố rằng thay vào đó chúng ta tìm thấy một sự hòa giải hòa bình."
 china_events.112.d.india: "Trong khi chúng ta coi [FROM.GetNameDef] là một phần không thể thiếu của đất nước và biên giới tự nhiên của chúng ta, có vẻ như những kẻ hèn nhát đã kêu gọi [FROM.FROM.GetNameDef] bảo vệ. Chính phủ Ấn Độ đã đưa ra tối hậu thư cho chúng ta để chấm dứt yêu sách và xâm lược của chúng ta chống lại [FROM.GetNameDef] hoặc nếu không phải đối mặt với chiến tranh. Trong khi warhawks của chúng ta đang kêu gọi chúng ta tận dụng lợi thế của quốc gia Ấn Độ thống nhất gần đây, ôn hòa và hòa bình đã tuyên bố rằng thay vào đó chúng ta tìm thấy một hòa giải hòa bình."
 china_events.112.a: "Chúng ta không thể thắng cuộc chiến này, lùi lại!"
 china_events.112.b: "Chúng ta phải chống lại bọn đế quốc đó!"

 china_events.113.t: "Người Trung Quốc lùi lại"
 china_events.113.d: "Đối mặt với áp lực quốc tế, Trung Quốc đã quyết định rút lui và rút lực lượng quân sự của họ khỏi biên giới của chúng ta. Có vẻ như độc lập của chúng ta hiện được bảo đảm hoàn toàn từ chủ nghĩa bành trướng của họ."
 china_events.113.a: "Hòa bình trong thời đại chúng ta."

 china_events.114.t: "Trung Quốc huy động quân đội"
 china_events.114.d: "Bất chấp áp lực quốc tế, Trung Quốc vẫn quyết định huy động quân đội của họ và báo cáo về biên giới của chúng ta chỉ ra rằng quân đội của họ đang di chuyển. Dường như đất nước chúng ta hiện đang có chiến tranh với quốc gia Trung Quốc, chỉ có thời gian mới cho biết liệu chúng ta có nổi lên chiến thắng hay không."
 china_events.114.a: "Họ sẽ không thắng."

 china_events.115.t: "[FROM.GetNameDefCap] Yêu cầu chuyển sang chủ nghĩa xã hội"
 china_events.115.d.russia: "Để đáp lại lời cầu xin giúp đỡ của chúng ta, [RUS.GetNameDef] đã yêu cầu chính phủ của chúng ta áp dụng một mô hình xã hội chủ nghĩa và tích hợp bản thân vào lĩnh vực của họ. Trong khi làm như vậy sẽ đảm bảo sự bảo vệ của họ đối với đất đai của chúng ta, điều này về cơ bản sẽ làm giảm sự độc lập của chúng ta vì chúng ta sẽ không trở thành một con rối trong lĩnh vực xã hội chủ nghĩa của họ. Tuy nhiên, xem xét lựa chọn thay thế là sáp nhập và phá hủy từ Trung Quốc - có lẽ đây là khóa học tốt nhất để thực hiện."
 china_events.115.d.india: "Để đáp lại lời cầu xin giúp đỡ của chúng ta, [HND.GetNameDef] đã yêu cầu chính phủ của chúng ta áp dụng một mô hình xã hội chủ nghĩa và tích hợp bản thân vào lĩnh vực của họ. Trong khi làm như vậy sẽ đảm bảo sự bảo vệ của họ đối với đất đai của chúng ta, điều này về cơ bản sẽ làm giảm sự độc lập của chúng ta vì chúng ta sẽ không trở thành một con rối trong lĩnh vực xã hội chủ nghĩa của họ. Tuy nhiên, xem xét lựa chọn thay thế là sáp nhập và phá hủy từ Trung Quốc - có lẽ đây là khóa học tốt nhất để thực hiện."
 china_events.115.a: "Chúng ta biết ơn chấp nhận."
 china_events.115.b: "Chúng ta sẽ không từ bỏ nền độc lập của mình."

 china_events.116.t: "[FROM.GetNameDefCap] Đồng ý Chấp nhận Chủ nghĩa xã hội"
 china_events.116.d: "Chúng ta đã nhận được tin tuyệt vời. Là một phần của cuộc cách mạng quốc tế, [FROM.GetNameDef] đã đồng ý thay đổi chính phủ của họ thành một xã hội chủ nghĩa - tham gia tình huynh đệ của anh chị em xã hội chủ nghĩa. Bây giờ, chúng ta sẽ đoàn kết và thách thức chống lại đế quốc Trung Quốc và họ sẽ bị buộc phải lùi bước hoặc chịu hậu quả."
 china_events.116.a: "Quốc tế sẽ đoàn kết loài người!"

 china_events.117.t: "[FROM.GetNameDefCap] Từ chối chủ nghĩa xã hội"
 china_events.117.d: "Có lẽ do sự kiêu ngạo của chính họ, [FROM.GetNameDef] đã từ chối lời đề nghị hào phóng của chúng ta để thay đổi chính phủ của họ thành một xã hội chủ nghĩa. Xem xét rằng họ đã chọn duy trì chính phủ phản động và lạc hậu của họ, chúng ta sẽ không bảo vệ họ trong cuộc xung đột sắp tới với Trung Quốc."
 china_events.117.a: "Họ đã chọn số phận của họ."

 china_events.118.t: "[FROM.GetNameDefCap] đứng thách thức"
 china_events.118.d: "Các dân tộc kiêu ngạo và dốt nát của [FROM.GetNameDef] đã từ chối tất cả các yêu cầu hào phóng của chúng ta thay vào đó đã tuyên bố với các nhà đàm phán của chúng ta rằng giải pháp duy nhất cho cuộc khủng hoảng, là độc lập quốc gia của họ. Đương nhiên điều này là không thể chấp nhận được vì những khu vực này là một phần không thể thiếu của Trung Quốc đã bị mất trong Thế kỷ khinh miệt. Chúng ta sẽ không có lựa chọn nào khác ngoài việc sử dụng lực lượng quân sự để đoàn tụ các bộ phận còn lại của đất nước vĩ đại của chúng ta!"
 china_events.118.a: "Chúng đã định đoạt số phận của mình!"

 china_events.119.t: "Trung Quốc yêu cầu sáp nhập [FROM.GetNameDef]"
 china_events.119.intro: "Với sự thống nhất của Trung Quốc bây giờ được bảo đảm, Trung Quốc bây giờ quay mắt về phía biên giới [FROM.GetAdjective]. Một khi một phần xa xôi của Great Thanh, nhà nước Trung Quốc hiện đại tuyên bố gốc từ người tiền nhiệm Mãn Thanh của họ và do đó đã bắt đầu kích động cho sự trở lại của nó. Với quân đội tích lũy và hùng biện ngày càng thù địch, phải mất ít trí tưởng tượng để hiểu những gì đang bị đe dọa."
 china_events.119.compromise: "Một lựa chọn trung gian đã được đề xuất, mà một số hy vọng có thể giải quyết căng thẳng. [FROM.GetNameDefCap] hiện đang chiếm các lãnh thổ bao gồm đa số người Hán, trọng tâm chính của sự tức giận dân tộc. Trao đổi các lãnh thổ này để tiếp tục độc lập của [FROM.GetNameDef] có thể tránh chiến tranh giữa các cường quốc, ngay cả khi nó phản bội một số cam kết trước đây của chúng ta."
 china_events.119.faction_leader_text: "Điều này đã lên đến đỉnh điểm trong những ngày gần đây, vì [FROM.GetLeader] đã kiến nghị chúng ta can thiệp thay mặt họ, trích dẫn các nghĩa vụ quân sự hiện tại của chúng ta. Đúng là chúng ta có lợi ích trong khu vực và đây là những trường hợp chúng ta đã hứa rằng chúng ta sẽ bảo vệ họ khỏi. Câu hỏi sau đó vẫn còn, chúng ta có sẵn sàng đứng lên vì sự độc lập của [FROM.GetAdjective] không?"
 china_events.119.overlord: "Lợi ích của chúng ta trong [FROM.Capital.GetCapitalVictoryPointName] là khá rộng lớn, với chính phủ [FROM.GetRulingParty] có hiệu quả phục vụ cho chính sách đối ngoại của chúng ta. [FROM.GetLeader] tuy nhiên đã kiên trì trong lời cầu xin của mình, yêu cầu chúng ta tôn trọng nghĩa vụ của mình để bước vào và ngăn chặn cuộc xâm lược của Trung Quốc. Nếu không làm như vậy sẽ gây ra một sự bối rối lớn cho [ROOT.GetLeader], và làm suy yếu chính sách đối ngoại [ROOT.GetAdjective]."
 china_events.119.overlordinfaction: "$china_events.119.overlord$\n\nCác đồng minh của chúng ta trong [ROOT.GetFactionName] có thể cũng sẽ bị cuốn vào cuộc xung đột này, vì những gì bề ngoài có vẻ như một cuộc giao tranh biên giới rất có thể leo thang thành một cuộc xung đột khu vực rộng lớn hơn. Để nhấn vấn đề này, chúng ta có thể sẽ buộc phải tham khảo ý kiến lãnh đạo [ROOT.GetFactionName] là tốt."
 china_events.119.d.faction_leader_can_give_lands: "$china_events.119.intro$\n\n$china_events.119.faction_leader_text$\n\n$china_events.119.compromise$"
 china_events.119.d.faction_leader_default: "$china_events.119.intro$\n\n$china_events.119.faction_leader_text$"
 china_events.119.d.overlord_not_in_faction_can_give_lands: "$china_events.119.intro$\n\n$china_events.119.overlord$\n\n$china_events.119.compromise$"
 china_events.119.d.overlord_not_in_faction: "$china_events.119.intro$\n\n$china_events.119.overlord$"
 china_events.119.d.overlord_in_faction_can_give_lands: "$china_events.119.intro$\n\n$china_events.119.overlordinfaction$\n\n$china_events.119.compromise$"
 china_events.119.d.overlord_in_faction: "$china_events.119.intro$\n\n$china_events.119.overlordinfaction$"
 china_events.119.a: "Chúng ta di chuyển để bảo vệ [FROM.GetAdjective] độc lập!"
 china_events.119.b: "Kiến nghị [ROOT.GetFactionName] để được hỗ trợ!"
 china_events.119.c: "Tìm kiếm sự thỏa hiệp về các lãnh thổ tranh chấp."
 china_events.119.d: "Điều này không đáng, từ bỏ [FROM.GetNameDef] ."

 china_events.120.t: "[FROM.GetNameDefCap] bảo vệ chúng ta"
 china_events.120.intro: "Kiến nghị của chúng ta về viện trợ [FROM.GetAdjective] đã thành công! Nghe lời cầu xin của [ROOT.GetLeader], [FROM.Capital.GetCapitalVictoryPointName] đã đưa ra một cảnh báo nghiêm khắc cho Trung Quốc lùi lại khỏi lãnh thổ của chúng ta và sẵn sàng gửi quân đội vào khu vực để bảo vệ chúng ta khi cần thiết."
 china_events.120.d.default: "$china_events.120.intro$ Bây giờ chúng ta đang chờ đợi với hơi thở dốc để xem những gì Trung Quốc sẽ làm tiếp theo."
 china_events.120.d.refused_lands: "$china_events.120.intro$ Điều này không may là không phải không có lần đầu tiên cố gắng đàm phán với Trung Quốc để chỉ trao cho \" một số \" của vùng đất cốt lõi của chúng ta, một thỏa hiệp đã bị chính quyền Hán từ chối. Dường như chiến tranh là không thể tránh khỏi bây giờ, và chúng ta phải chuẩn bị cho phù hợp."
 china_events.120.a: "Thật tốt khi có đồng minh."

 china_events.121.t: "[FROM.FROM.GetNameDefCap] Bảo vệ [FROM.GetNameDef]"
 china_events.121.refusedlands: "Không giúp nguyên nhân của chúng ta có lẽ là sự từ chối trước đó của chúng ta để chấp nhận một thỏa hiệp trả lại đất đai đa số Han từ [FROM.GetAdjective] kiểm soát. Điều này đã để lại cho chúng ta một cách hiệu quả trong một góc - nếu chúng ta lừa gạt với hy vọng tránh chiến tranh và chiếm giữ các vùng lãnh thổ tranh chấp, thì bây giờ chúng ta buộc phải đi đến chiến tranh cho tất cả các khu vực hoặc trở lại trong sự xấu hổ."
 china_events.121.d.overlord: "Khi chúng ta tìm cách khôi phục lại sự toàn vẹn của Trung Quốc trên [FROM.Capital.GetCapitalVictoryPointName] , có vẻ như chỉ tự nhiên rằng puppetmasters hèn hạ của họ trong [FROM.FROM.GetNameDef] sẽ bước vào để ngăn chặn chúng ta. Những người theo chủ nghĩa dân tộc trong [ROOT.GetRulingParty] nhấn mạnh rằng chúng ta nhấn về phía trước, trích dẫn sự cần thiết phải kết thúc Thế kỷ sỉ nhục, thông qua vũ lực nếu cần thiết. Mặt khác, tuy nhiên, một cuộc chiến tranh như vậy có thể tàn phá đối với một đất nước vẫn đang phục hồi từ thời Warlord. Quyết định bây giờ thuộc về [ROOT.GetLeader] và các bộ trưởng của ông."
 china_events.121.d.overlord_refused_lands: "$china_events.121.d.overlord$\n\n$china_events.121.refusedlands$"
 china_events.121.d.overlord_abandoned_by_allies: "$china_events.121.d.overlord$\n\nDường như [FROM.FROM.GetNameDef] đã mất một lợi thế quan trọng khi các đồng minh cũ của họ phần lớn từ bỏ họ, không sẵn sàng tham gia vào một cuộc xung đột châu Á có khả năng ồ ạt. Điều này có nghĩa là họ đứng một mình, nhưng điều đó khó có nghĩa là họ bất lực."
 china_events.121.d.overlord_refused_lands_abandoned_by_allies: "$china_events.121.d.overlord_abandoned_by_allies$\n\n$china_events.121.refusedlands$"
 china_events.121.d.overlord_and_allies: "$china_events.121.d.overlord$\n\n[FROM.FROM.FROM.GetNameDefCap] đã quyết định bước vào cuộc xung đột, đe dọa sẽ đưa toàn bộ [FROM.FROM.FROM.GetFactionName] vào cuộc xung đột nên căng thẳng leo thang. Điều này làm phức tạp thêm cơn đau đầu mà cuộc khủng hoảng này đã tạo ra, làm suy yếu đáng kể vị thế của chúng ta."
 china_events.121.d.overlord_and_allies_refused_lands: "$china_events.121.d.overlord_and_allies$\n\n$china_events.121.refusedlands$"
 china_events.121.d.faction: "Trong vài năm qua khi [FROM.GetNameDef] đã tìm cách củng cố sự độc lập của họ, họ đã làm việc để xây dựng mối quan hệ với các cường quốc bên ngoài trong nỗ lực bảo vệ bản thân cho ngày thống nhất không thể tránh khỏi của chúng ta. Do đó, họ đã ném rất nhiều của họ với [FROM.GetFactionName] , những người đã đồng ý bảo vệ họ chống lại chúng ta. Mặc dù sức mạnh của một Trung Quốc thống nhất, chiến tranh luôn là một đề xuất rủi ro - một trong đó có thể bắt đầu như chúng ta hài lòng nhưng sẽ không nhất thiết phải kết thúc theo kế hoạch."
 china_events.121.d.faction_refused_lands: "$china_events.121.d.faction$\n\n$china_events.121.refusedlands$"
 china_events.121.a: "Chúng ta phải lùi lại."
 china_events.121.b: "Chiến tranh là sau đó."

 china_events.122.t: "Trung Quốc lùi bước"
 china_events.122.d: "Sau nhiều tuần căng thẳng ngày càng tăng, thế giới có thể thở phào nhẹ nhõm. Đối mặt với khả năng một cuộc chiến tranh mài mòn sẽ làm mất ổn định một quốc gia non trẻ, lãnh đạo Trung Quốc chớp mắt trước. Họ đã quyết định chấp nhận một thỏa thuận khác xa với yêu cầu cao cả của họ, đồng ý với một hiệp ước không xâm lược. Mặc dù khả năng giải trừ quân bị trong tương lai vẫn là một tham vọng xa vời, nhưng bây giờ ít nhất dường như sẽ có hòa bình ở châu Á."
 china_events.122.a: "Lý trí chiếm ưu thế."

 china_events.123.t: "Trung Quốc huy động cho chiến tranh"
 china_events.123.d: "Sau nhiều tuần căng thẳng gia tăng, có vẻ như mọi thứ sẽ sớm vượt ra khỏi tầm kiểm soát. Đối mặt với quyết tâm ngày càng tăng của chúng ta để chống lại tham vọng đế quốc của họ, lãnh đạo Trung Quốc đã bầu hai lần trong cuộc tìm kiếm quyền lực điên cuồng của họ. Với bất kỳ hy vọng nào về một giải pháp ngoại giao nhanh chóng bốc hơi, chúng ta có rất ít lựa chọn ngoài việc chuẩn bị cho một cuộc xung đột kéo dài."
 china_events.123.a: "Chúng ta sẽ thắng."

 china_events.124.t: "[FROM.GetNameDefCap] Yêu cầu hỗ trợ [ROOT.GetFactionName] chống lại Trung Quốc"
 china_events.124.d: "[FROM.GetAdjective] lợi ích trong biên giới tranh chấp của Trung Quốc từ lâu đã được biết đến với chúng ta, mặc dù với Trung Quốc từ lâu bị phân tâm bởi những cuộc cãi vã nhỏ nhặt của riêng họ, nó không đáng quan tâm. Ít nhất là cho đến gần đây. Từ chối sự độc lập (hoặc ít nhất là độc lập trên danh nghĩa) của các nhóm khác nhau đã cố gắng tách ra khỏi chính phủ do người Hán thống trị, người Trung Quốc đã bắt đầu huy động lực lượng trong một nỗ lực tái chiếm để khôi phục lại biên giới đế quốc nhà Thanh cũ.\n\nBây giờ, có một mối đe dọa ngày càng tăng rằng [ROOT.GetFactionName] sẽ được rút ra vào một cuộc xung đột châu Á, một cái gì đó chúng ta có thể không được chuẩn bị cho. Là nhà lãnh đạo thực tế của liên minh, nó được sử dụng để phối hợp một phản ứng với kháng cáo [FROM.GetAdjective] viện trợ chống lại sự xâm lược của Trung Quốc."
 china_events.124.a: "Chúng ta sẽ ném gánh nặng của mình sau lưng họ."
 china_events.124.b: "Những vấn đề này còn xa mới là mối quan tâm của chúng ta."

 china_events.125.t: "[FROM.GetNameDefCap] Hỗ trợ chúng ta"
 china_events.125.d: "Rất may, mối quan hệ chặt chẽ của chúng ta với [FROM.GetFactionName] đã được đền đáp. Để đáp lại lời kêu gọi hỗ trợ chống lại sự xâm lược của Trung Quốc, [FROM.GetLeader] đã đề nghị đến viện trợ của chúng ta trong trường hợp có một cuộc xâm lược. Ngoài việc tăng cường liên minh của chúng ta, chúng ta sẽ đảm bảo việc tiếp tục bảo vệ các đồng minh và lợi ích của chúng ta trong khu vực. Với bất kỳ may mắn nào, người Trung Quốc sẽ lùi bước khỏi sự xâm lược hơn nữa, vì sợ rằng họ có nguy cơ chiến tranh mở rộng."
 china_events.125.a: "Đó là mục đích của đồng minh."

 china_events.126.t: "[FROM.GetNameDefCap] Từ chối hỗ trợ chúng ta"
 china_events.126.d: "Mặc dù mối quan hệ hiện tại của chúng ta với [FROM.GetFactionName], họ tuyên bố rằng nó không mở rộng cho các đồng minh công ty con của chúng ta. Trong một chương trình to lớn về sự yếu đuối và trùng lặp, [FROM.GetLeader] đã thông báo cho chúng ta rằng chúng ta không thể mong đợi sự hỗ trợ của [FROM.GetFactionName] trong trường hợp có xung đột.\n\nĐiều này đặt chúng ta vào một vị trí suy yếu. Nếu chúng ta nhấn để tiếp tục bảo vệ các đồng minh của chúng ta, chúng ta sẽ buộc phải hy sinh mối quan hệ của chúng ta với [FROM.GetFactionName] , để lại cho chúng ta mình dễ bị tổn thương. Mặt khác, lùi lại bây giờ sẽ làm cho chúng ta trông yếu đuối, hy sinh lợi ích riêng của chúng ta ủng hộ liên minh rộng lớn hơn. Cuối cùng tuy nhiên, nó là lên đến [ROOT.GetLeader] để quyết định phải làm gì với lợi ích của chúng ta trong vùng đất Trung Quốc tuyên bố chủ quyền."
 china_events.126.a: "Bảo vệ họ bất kể!"
 china_events.126.b: "Đề nghị Trung Quốc một thỏa hiệp để giữ thể diện."
 china_events.126.c: "Hãy thả họ ra vì lợi ích của đồng minh [FROM.GetFactionName] của chúng ta."

 china_events.127.t: "[FROM.GetNameDefCap] rời khỏi [ROOT.GetFactionName]"
 china_events.127.d: "Tức giận về quyết định của chúng ta không bảo vệ lợi ích của họ trong các khu vực tranh chấp với Trung Quốc, [FROM.GetLeader] đã tuyên bố rút [FROM.GetNameDef] khỏi [ROOT.GetFactionName]. Đây là một cú đánh vào sự ổn định của liên minh của chúng ta, và quyết định đào gót chân của họ để chống lại Trung Quốc có thể sẽ dẫn đến một kết quả không thuận lợi cho tất cả. Tuy nhiên, chúng ta đã làm những gì chúng ta có thể để giữ gìn hòa bình và chúng ta sẽ chỉ đơn giản là phải tìm cách riêng của chúng ta mà không có [FROM.GetAdjective]."
 china_events.127.a: "Thất vọng."

 china_events.128.t: "Một vùng Trung Địa?"
 china_events.128.intro: "Sau một số thảo luận, [FROM.GetLeader] đã đưa ra một giải pháp để đề xuất với Trung Quốc, hy vọng ngăn chặn cuộc xâm lược. Các lãnh thổ đa số của người Hán hiện đang ở trong tay [ROOT.GetAdjective] sẽ được trả lại cho sự kiểm soát của Trung Quốc, đổi lại chúng ta sẽ có thể bảo vệ sự độc lập của mình và Trung Quốc sẽ rút tất cả các yêu sách đối với vùng đất cốt lõi của chúng ta."
 china_events.128.d.puppet: "$china_events.128.intro$\n\nVới sự phụ thuộc nặng nề vào [FROM.GetNameDef], lời nói của chúng ta không gì khác hơn là một dấu cao su trong quá trình này. Tuy nhiên, chúng ta vẫn có thể hy vọng rằng điều này sẽ tạo ra một nền hòa bình lâu dài."
 china_events.128.d.not_puppet: "$china_events.128.intro$\n\nCuối cùng, lựa chọn này là của riêng chúng ta. Một số người của chúng ta có thể thấy chấp nhận thỏa hiệp này là một sự phản bội, nhưng nếu nó sẽ dẫn đến hòa bình - thì chắc chắn ít nhất chúng ta phải thử?"
 china_events.128.a: "Chúng ta không có lựa chọn trong vấn đề này..."
 china_events.128.b: "Thế này chẳng khác nào đầu hàng!"
 china_events.128.c: "Một sự thỏa hiệp xứng đáng, nếu không may."

 china_events.129.t: "[FROM.GetNameDefCap] Đồng ý Thỏa thuận"
 china_events.129.d: "Với một cuộc chiến tranh có khả năng tàn phá trên đường chân trời, [FROM.GetLeader] đã quyết định thực hiện hành động hợp lý và đồng ý với đề xuất của chúng ta để phân chia đất [FROM.GetAdjective] tranh chấp giữa họ và Trung Quốc. Các tỉnh đa số người Hán sẽ được trả lại cho chính quyền Trung Quốc, trong khi chính phủ Trung Quốc sẽ công nhận sự độc lập liên tục của [FROM.GetNameDef]. Một dự thảo thỏa thuận bây giờ sẽ được gửi đến Trung Quốc để xem xét."
 china_events.129.a: "Hãy chờ câu trả lời của họ."

 china_events.130.t: "[FROM.GetNameDefCap] Từ chối thỏa thuận"
 china_events.130.d: "Mặc dù tiềm năng cho một cuộc chiến tranh tàn phá, [FROM.GetLeader] đã quyết định có một đường dây cứng, khẳng định rằng [FROM.GetNameDef] sẽ bảo vệ mọi inch đất [FROM.GetAdjective] hợp pháp cho đến khi cuối cùng. Họ đã phóng ngư lôi bất kỳ cơ hội thỏa hiệp, thề sẽ chiến đấu bất kể sự tham gia của chúng ta. Trong hoàn cảnh này, chúng ta bị mắc kẹt với hai lựa chọn khắc nghiệt - hoặc chúng ta đứng với các đồng minh của chúng ta trong [FROM.Capital.GetCapitalVictoryPointName] hoặc chúng ta gọi là lừa đảo của họ và từ bỏ họ để số phận của họ."
 china_events.130.a: "Chúng ta cũng sẽ bảo vệ họ."
 china_events.130.b: "Chúng sẽ tự diệt vong."

 china_events.131.t: "[FROM.GetNameDefCap] mang đến một thỏa hiệp tiềm năng"
 china_events.131.d.puppet: "Chúng ta đã nhận được tin tức từ [FROM.overlord.GetNameDef] , rằng như một phần của hòa giải chính thức của họ với đất nước chúng ta và thay mặt [FROM.GetNameDef] , [FROM.GetNameDef] sẽ nhượng lại những vùng đất mà họ sở hữu với một thiểu số Hán đáng kể. Đổi lại, họ yêu cầu chúng ta bỏ tất cả các yêu sách khác trên lãnh thổ của họ và tôn trọng sự độc lập của họ. Mặc dù đây chắc chắn là một đề nghị hấp dẫn, những người theo chủ nghĩa dân tộc warhawk đang kêu gọi chúng ta từ chối hiệp ước bất bình đẳng này và thay vào đó chuẩn bị cho chiến tranh với [FROM.overlord.GetNameDef] ."
 china_events.131.d.not_puppet: "Chúng ta đã nhận được tin tức từ [FROM.FactionLeader.GetNameDef] , rằng như một phần của hòa giải chính thức của họ với đất nước chúng ta và thay mặt [FROM.GetNameDef] , [FROM.GetNameDef] sẽ nhượng lại những vùng đất mà họ sở hữu với một thiểu số Hán đáng kể. Đổi lại, họ yêu cầu chúng ta bỏ tất cả các yêu sách khác trên lãnh thổ của họ và tôn trọng sự độc lập của họ. Mặc dù đây chắc chắn là một đề nghị hấp dẫn, những người theo chủ nghĩa dân tộc warhawk đang kêu gọi chúng ta từ chối hiệp ước bất bình đẳng này và thay vào đó chuẩn bị cho chiến tranh với [FROM.FactionLeader.GetNameDef] ."
 china_events.131.a: "Chúng ta chấp nhận đề nghị hòa bình này."
 china_events.131.b: "Chúng ta sẽ không ký hiệp ước bất bình đẳng này!"

 china_events.132.t: "Trung Quốc chấp nhận thỏa hiệp"
 china_events.132.d.target: "Chúng ta đã nhận được tin tức rằng Chính phủ Trung Quốc đã đồng ý chấp nhận các vùng đất mà họ tuyên bố sở hữu thiểu số Trung Quốc để đổi lấy việc từ bỏ tất cả các yêu sách của họ trên đất của chúng ta. Chúng ta sẽ chấp nhận đề xuất này trong khi điều này có nghĩa là đất của chúng ta bị tước đi."
 china_events.132.d.faction_leader_abandoned_ally: "Chúng ta đã nhận được tin tức từ [FROM.overlord.GetNameDef] rằng họ đã quyết định rút khỏi liên minh của chúng ta để bảo vệ [FROM.GetNameDef]. Tuy nhiên, có vẻ như đã tránh được đổ máu vì [FROM.overlord.GetNameDef] đã đàm phán thành công một thỏa hiệp với chính phủ Trung Quốc, rằng [FROM.GetNameDef] sẽ nhượng lại tất cả các vùng đất có chứa một thiểu số Hán đáng kể để đổi lấy độc lập."
 china_events.132.d.other_allies: "Chúng ta đã nhận được tin rằng [FROM.overlord.GetNameDef] đã đàm phán hòa bình với chính phủ Trung Quốc thay mặt cho [FROM.GetNameDef]. Đổi lại, để nhượng tất cả các vùng đất có chứa một thiểu số Hán đáng kể cho Chính phủ Trung Quốc, Trung Quốc sẽ từ bỏ tất cả các yêu sách khác mà họ có ở biên giới bên ngoài. Dường như sẽ không có chiến tranh chiến đấu với họ."
 china_events.132.a: "Thật không may, nó phải được thực hiện."
 china_events.132.b: "Hòa bình đã được đàm phán."
 china_events.132.c: "Chúng ta không còn lựa chọn nào khác."
 china_events.132.d: "Hòa bình trong thời đại chúng ta"

 china_events.133.t: "[FROM.GetNameDefCap] từ chối đề nghị của chúng ta để thỏa hiệp"
 china_events.133.d: "Bất chấp lời đề nghị hào phóng của chúng ta để nhượng lại đất Hán cho [FROM.GetNameDef], họ đã từ chối lời đề nghị của chúng ta để thỏa hiệp. Tại thời điểm này, lựa chọn duy nhất có thể là chiến tranh."
 china_events.133.a: "Những gì phải đến sẽ đến."

 china_events.134.t: "[FROM.GetNameDefCap] Từ chối thỏa thuận"
 china_events.134.d.overlord_in_faction: "Chúng ta đã nhận được tin tức nghiêm trọng rằng [FROM.GetNameDef] đã từ chối cung cấp hào phóng của chúng ta cho một sự thỏa hiệp. Vì có vẻ như lựa chọn khác duy nhất là chiến tranh, có lẽ chúng ta có thể cố gắng liên hệ với [ROOT.FactionLeader.GetNameDef] để được hỗ trợ trong một cuộc chiến tranh tiềm năng với Chính phủ Trung Quốc. Chúng ta có thể chọn từ bỏ việc bảo vệ chủ đề của mình hoặc tìm cách bảo vệ bất kể."
 china_events.134.d.overlord_refused_by_faction: "Chúng ta đã nhận được tin tức nghiêm trọng rằng [FROM.GetNameDef] đã từ chối cung cấp hào phóng của chúng ta cho một sự thỏa hiệp. Kể từ lần cuối cùng chúng ta đến [ROOT.FactionLeader.GetNameDef] để viện trợ trong cuộc khủng hoảng này và họ từ chối, không chắc rằng họ sẽ tìm thấy nó tiềm năng để can thiệp một lần nữa. Chúng ta có thể chọn từ bỏ bảo vệ đối tượng của chúng ta hoặc tìm cách bảo vệ bất kể."
 china_events.134.d.faction_leader: "Chúng ta đã nhận được tin tức rằng [FROM.GetNameDef] đã từ chối một lời đề nghị thỏa hiệp về yêu sách phục hồi lãnh thổ của họ. Điều này có thể có nghĩa là chiến tranh cho đất nước chúng ta, một cuộc chiến mà không nhiều công dân của chúng ta sẽ nghĩ là đáng chết. Tuy nhiên, chắc chắn có những người lập luận rằng chúng ta phải đứng lên chống lại chủ nghĩa bành trướng Trung Quốc và tuyên bố rằng chúng ta sẽ bảo vệ các đồng minh của mình."
 china_events.134.a: "Chúng ta hãy hy vọng [ROOT.FactionLeader.GetNameDef] đến để hỗ trợ chúng ta."
 china_events.134.b: "Bất chấp những khó khăn, chúng ta phải bảo vệ họ."
 china_events.134.c: "Đủ rồi, chúng ta sẽ bảo vệ họ."
 china_events.134.d: "Đây không phải cuộc chiến của chúng ta."

 china_events.135.t: "[FROM.GetNameDefCap] Từ chối thỏa thuận"
 china_events.135.d.abandoned_by_allies: "Tin tức thảm khốc và chán nản cho chúng ta hôm nay khi chúng ta nhận được tin rằng [FROM.FactionLeader.GetNameDef] đã loại bỏ chúng ta khỏi lĩnh vực của họ và đã bỏ rơi chúng ta cho Trung Quốc. Trích dẫn rằng họ không tin đây là cuộc xung đột của họ, họ đã rút đại sứ quán và lực lượng quân sự khỏi đất nước chúng ta - để lại cho chúng ta lòng thương xót của Trung Quốc. Chỉ có thời gian sẽ cho biết liệu chúng ta có sống sót sau cuộc tấn công dữ dội này hay không."
 china_events.135.d.abandoned_by_overlord_allies: "Tin tức thảm khốc và chán nản đối với chúng ta ngày hôm nay khi chúng ta nhận được tin rằng [FROM.overlord.GetNameDef] đã quyết định không can thiệp vào lợi ích của chúng ta và đã bỏ rơi chúng ta cho Trung Quốc. Trích dẫn rằng họ không nghĩ rằng họ có thể giành chiến thắng trong cuộc chiến này mà không cần sự giúp đỡ của [FROM.FactionLeader.GetNameDef], người đã tuyên bố rằng họ sẽ trung lập trong cuộc xung đột sắp tới, họ đã rút đại sứ quán và lực lượng quân sự khỏi đất nước chúng ta - để lại cho chúng ta sự thương xót của Trung Quốc. Chỉ có thời gian mới cho biết liệu chúng ta có sống sót sau cuộc tấn công dữ dội này hay không."
 china_events.135.d.abandoned_by_overlord: "Tin tức bi thảm và chán nản cho chúng ta ngày hôm nay vì chúng ta đã nhận được tin rằng [FROM.overlord.GetNameDef] đã quyết định không can thiệp vào lợi ích của chúng ta và đã bỏ rơi chúng ta cho Trung Quốc. Trích dẫn rằng họ không nghĩ rằng đây là một cuộc xung đột mà họ sẽ có thể giành chiến thắng, họ đã rút đại sứ quán và lực lượng quân sự khỏi đất nước chúng ta - để lại cho chúng ta sự thương xót của Trung Quốc. Chỉ có thời gian sẽ cho biết liệu chúng ta có sống sót sau cuộc tấn công dữ dội này hay không."
 china_events.135.a: "Họ là những kẻ hèn nhát."

 china_events.136.t: "[FROM.FROM.GetNameDefCap] Từ bỏ [FROM.GetNameDef]"
 china_events.136.d: "Chúng ta đã nhận được tin tuyệt vời rằng [FROM.FROM.GetNameDef] đã rút lại sự bảo vệ của họ về [FROM.GetNameDef] do đó giải quyết cuộc khủng hoảng mà không làm chìm lục địa châu Á vào chiến tranh. Chúng ta sẽ thấy rằng các biên giới được thiết lập một cách hợp pháp trong quốc gia của chúng ta và chiến thắng của chúng ta sẽ ngắn ngủi."
 china_events.136.a: "Một chiến thắng trước chủ nghĩa đế quốc!"

### Autonomous Region Events ###
 china_events.150.t: "Thiết lập chính quyền tại Mông Cổ"
 china_events.150.d: "Trong suốt thế kỷ 17 và 18, Mông Cổ dần dần bị Đại Thanh sáp nhập. Triều đại Mãn Châu này trước đây có mối quan hệ tốt với các gia tộc Mông Cổ và sử dụng các thần dân Mông Cổ của họ để có hiệu quả lớn như kỵ binh, tuy nhiên những nỗ lực của nhà Thanh nhằm chinh phục người Mông Cổ và thực hiện hệ thống biểu ngữ của họ đã gặp phải sự kháng cự. Thế kỷ 18 chứng kiến nạn đói và một cuộc di cư lớn của người Hán vào khu vực được gọi là \" Nội Mông \", sự suy giảm của chủ nghĩa du mục Mông Cổ và Hán hóa triều đình nhà Thanh. Sự cai trị của nhà Thanh đối với Mông Cổ dựa vào các thống đốc quân sự để theo dõi các Liên đoàn Mông Cổ khác nhau (sáu ở Nội Mông và bốn ở Ngoại Mông), với các Liên đoàn Mông Cổ được hưởng quyền tự trị lớn hơn.\n\nGiữa sự hỗn loạn của Cách mạng Tân Hợi năm 1911, Bogd Khan đã lên ngôi và lãnh đạo một cuộc nổi dậy trục xuất các quan chức Trung Quốc khỏi Ngoại Mông. Nước Cộng hòa mới tìm cách tái khẳng định quyền kiểm soát Mông Cổ cũng như Tây Tạng (đã ký hiệp ước công nhận lẫn nhau với Mông Cổ), triển khai các lực lượng có thể kiểm soát Urga (thủ đô và thành phố thường trú duy nhất của họ). Tuy nhiên, quân đội do Baron von Ungern-Sternberg lãnh đạo đã có thể đẩy quân đội Trung Quốc ra, cho phép người Mông Cổ đảm bảo độc lập trên thực tế ngay cả khi Trung Quốc tiếp tục yêu sách lãnh thổ.\n\nSau sự sụp đổ của Nam tước và trở về Mông Cổ, chúng ta thừa hưởng một Mông Cổ bị chia rẽ và tàn phá. Các nhà lãnh đạo địa phương đã kiến nghị quyền tự trị lớn hơn tương tự như các chính sách trước đây được thực hiện bởi các lực lượng quân phiệt ở Nội Mông. Họ lo ngại rằng việc di cư của người Hán, có xu hướng ủng hộ nông dân định cư, sẽ cạnh tranh với những người chăn nuôi Mông Cổ để lấy đất chăn thả và ảnh hưởng chính trị. Tuy nhiên, một số quan chức lập luận cho một chính quyền trực tiếp để nâng cao điều kiện kinh tế của tỉnh nghèo khó và dập tắt các nỗ lực ly khai."
 china_events.150.a: "Chỉ cho phép thành lập Khu tự trị Ngoại Mông."
 china_events.150.b: "Thành lập cả Khu tự trị Nội Mông và Ngoại Mông."
 china_events.150.c: "Mông Cổ sẽ được tổ chức lại thành các tỉnh thông thường."

 china_events.151.t: "Thiết lập chính quyền tại Tân Cương"
 china_events.151.d: "Tân Cương đã có một lịch sử lâu dài và hỗn loạn và sự hiện diện quân sự của Trung Quốc bắt đầu ở triều đại Hán với các đơn vị đồn trú được triển khai để bảo vệ lợi ích thương mại dọc theo Con đường Tơ lụa có giá trị. Kiểm soát khu vực thường xuyên thay đổi khi các triều đại kế tiếp có mức độ tài sản khác nhau giữ vùng đất xa xôi dưới sự kiểm soát của họ. Nhà Thanh đã giành quyền kiểm soát Tân Cương và Tây Tạng từ Zunghar trong suốt thế kỷ 17 và 18 trong một cuộc chiến tranh chinh phục tàn khốc. Họ cũng khuyến khích người Hán, Hồi và Mãn Châu di cư để bổ sung cho sự kiểm soát của họ cùng với đồn trú của họ, một chiến thuật được sử dụng trong các triều đại trước đó như nhà Đường. Tân Cương, sau đó được gọi là Turkestan Trung Quốc, đã được chuyển đổi thành một tỉnh và được đặt tên hiện tại, có nghĩa là Biên giới mới.\n\nCách mạng Tân Hợi năm 1911 đã chứng kiến sự sụp đổ của chính quyền nhà Thanh và giả định của Thống đốc Han Yang Zengxin lên nắm quyền. Một khu vực đa sắc tộc, Tân Cương đã bị cản trở bởi sự bất ổn và bất ổn, đặc biệt là bởi những người trung thành với Kumul Khanate ở phía bắc và những người ly khai Đông Turkestan ở phía nam. Khoảng cách đi lại từ Bắc Kinh đến Địch Hóa (thủ phủ tỉnh) được cho là mất nhiều thời gian hơn so với đi từ Moscow đến Vladivostok, điều này đã tạo ra một mức độ cô lập - càng trở nên tồi tệ hơn bởi xu hướng khu vực của các Thống đốc và sự gián đoạn của thời đại quân phiệt.\n\nTuy nhiên, chúng ta đã đưa thành công Tân Cương dưới gót chân của chúng ta, phát triển một kế hoạch quản trị lâu dài là điều bắt buộc nếu chúng ta muốn ổn định sự cai trị của mình. Tân Cương là quê hương của nhiều nhóm dân tộc, bao gồm Uyghur, Han, Kazakhs, Hui, Kirghiz và Mông Cổ và đã có lời kêu gọi của các nhà lãnh đạo địa phương để thiết lập một khu tự trị để đảm bảo quyền của các dân tộc thiểu số địa phương. Tuy nhiên, cũng đã có sự phản đối đáng kể đối với ý tưởng này - không giống như Tây Tạng hoặc Mông Cổ, Tân Cương đã được cai trị như một tỉnh trong nhiều thập kỷ nay."
 china_events.151.a: "Cho phép thành lập Khu tự trị Tân Cương."
 china_events.151.b: "Tân Cương vẫn là một tỉnh."

 china_events.152.t: "Thiết lập chính quyền tại Tây Tạng"
 china_events.152.d: "Lịch sử cai trị của Trung Quốc đối với Tây Tạng là một lịch sử dài và phức tạp. Nhà Thanh lần đầu tiên khẳng định quyền kiểm soát trực tiếp khu vực khi binh sĩ của họ hỗ trợ Đạt Lai Lạt Ma thứ 7 trục xuất Hãn quốc Zunghar, bổ nhiệm các quản trị viên riêng của họ được gọi là Ambans vào khu vực. Tây Tạng trở thành một \" Fanbu \" cho nhà Thanh, được dịch lỏng lẻo như một quốc gia chư hầu. Khi quyền lực của nhà Thanh suy yếu, khả năng kiểm soát trực tiếp Tây Tạng của họ đã bị thách thức bởi cả các nhà lãnh đạo Tây Tạng và người Anh hoạt động từ Ấn Độ. Sau cuộc xâm lược Tây Tạng của Anh, nhà Thanh đã nỗ lực tái khẳng định chủ quyền của họ đối với khu vực, gửi một đội quân để hội nhập Tây Tạng bằng vũ lực đồng thời đảm bảo sự công nhận của Anh về quyền bá chủ của Trung Quốc.\n\nCách mạng Tân Hợi năm 1911 chứng kiến sự sụp đổ của nhà Thanh và người Tây Tạng đã trả thù quân đồn trú Trung Quốc bằng cách giết chết chỉ huy của họ và buộc những người sống sót phải rút lui. Nước Cộng hòa mới duy trì yêu sách của mình đối với Tây Tạng và cố gắng đảm bảo sự quy phục của Đạt Lai Lạt Ma, tuy nhiên Đạt Lai Lạt Ma thứ 13 lập luận rằng sự cai trị trước đây của Trung Quốc không phải là sự phụ thuộc mà là mối quan hệ bảo trợ và linh mục. Chính phủ Lhasa tuyên bố độc lập cùng với Mông Cổ mới được giải phóng. Người Anh đã cố gắng môi giới một thỏa thuận tương tự như bên trong / bên ngoài Mông Cổ, với bên ngoài Tây Tạng nhận quyền tự trị dưới quyền bá chủ của Trung Quốc trong khi bên trong Tây Tạng sẽ bị chia cắt bởi chính quyền Trung Quốc và chính quyền tôn giáo Tây Tạng. Công ước này đã phá vỡ do tranh chấp về biên giới, phức tạp hơn nữa bởi tình trạng tranh chấp Tawang và cuộc cách mạng Ấn Độ.\n\nLực lượng của chúng ta đã xâm chiếm thành công Tây Tạng, một lần nữa tái khẳng định quyền kiểm soát của Trung Quốc đối với Lhasa. Cái chết của Đạt Lai Lạt Ma thứ 13 vào năm 1933 đã lật đổ đấu trường chính trị Tây Tạng, để lại một số phe phái cạnh tranh từ những người theo chủ nghĩa truyền thống trong các tu viện và tầng lớp quý tộc đến các nhà cách mạng Khamba đến các nhà cải cách tòa án. Trong chính phủ của chúng ta, đã có những lời kêu gọi quản lý trực tiếp Tây Tạng như một tỉnh để dập tắt chủ nghĩa ly khai, trong khi những người khác đã khuyên nên cung cấp quyền tự chủ để đảm bảo lòng trung thành của các đồng minh địa phương."
 china_events.152.a: "Cho phép thành lập Khu tự trị Tây Tạng \" Outer \"."
 china_events.152.b: "Khu tự trị Tây Tạng nên được mở rộng để bao gồm \" Nội Tây Tạng \"."
 china_events.152.c: "Tây Tạng sẽ được quản lý như một tỉnh."

 china_events.153.t: "[FROM.Capital.GetCapitalVictoryPointName] vẽ một Sinophile Coup"
 china_events.153.d: "Sau một số cuộc đàm phán khó khăn với chính phủ [FROM.GetAdjective], người dân đã vui mừng rằng chúng ta đã có thể đi đến một thỏa thuận hòa bình với Trung Quốc. Các điều khoản của thỏa thuận là chúng ta sẽ giữ quyền tự chủ trong nước và độc lập danh nghĩa trên sân khấu quốc tế với tư cách là người bảo hộ của Trung Quốc, ngay cả khi các vấn đề đối ngoại của chúng ta sẽ được xử lý trong [FROM.Capital.GetCapitalVictoryPointName] . Sự sắp xếp này, tương đương hiện đại với hệ thống bá chủ cũ của Trung Quốc, ngầm bao gồm việc duy trì sự lãnh đạo hiện tại của chúng ta trong [ROOT.GetRulingParty] .\n\nTuy nhiên, người Trung Quốc đã mất niềm tin vào chính phủ của [ROOT.GetLeader], hoặc có lẽ họ không bao giờ thực sự có ý định cho phép anh ta (hoặc ít nhất là các cố vấn hiện tại của anh ta) cai trị. Các cơ quan báo chí liên kết với Trung Quốc đã có một giọng điệu tối hơn về chính phủ cầm quyền và Đại sứ Trung Quốc \" \" đã được nhìn thấy gặp gỡ với nhiều nhân vật đối lập khác nhau. Điều đáng lo ngại hơn nữa là các bộ trưởng và tướng lĩnh lớn trong chính phủ của chúng ta đã tranh giành các vị trí trong chế độ sắp tới, cho thấy ngày của chúng ta có thể được đánh số.\n\nVới đòn bẩy của chúng ta đã biến mất một cách hiệu quả khi đã công khai tuyên bố đệ trình của chúng ta với thế giới và những người bảo trợ của chúng ta không muốn hoặc không thể giúp chúng ta, chúng ta có rất ít sự trông cậy. Chỉ là vấn đề thời gian trước khi Trung Quốc chính thức đệ trình yêu cầu thay đổi lãnh đạo của họ và trừ khi chúng ta có thể đảm nhận quyền bá chủ được khôi phục, điều duy nhất chúng ta có thể làm là hy vọng lịch sử nhớ đến sự phản bội này."
 china_events.153.a: "Chúng ta có thể làm rất ít nhưng chấp nhận điều không thể tránh khỏi."
 china_events.153.b: "Chúng ta sẽ chiến đấu đến hơi thở cuối cùng!"

 china_events.154.t: "Phiếu giảm giá Bloodless trong [FROM.Capital.GetCapitalVictoryPointName]"
 china_events.154.d: "Sau những cuộc đàm phán khó khăn với chính phủ [FROM.GetAdjective], người dân đã vui mừng rằng chúng ta đã có thể đi đến một thỏa thuận hòa bình để thống nhất đất nước. Các điều khoản của thỏa thuận là họ sẽ giữ lại một số quyền tự chủ trong nước và độc lập danh nghĩa trên sân khấu quốc tế với tư cách là người bảo hộ Trung Quốc, mặc dù các vấn đề đối ngoại của họ sẽ được xử lý trong [ROOT.Capital.GetCapitalVictoryPointName] . Sự sắp xếp này, tương đương hiện đại với hệ thống bá chủ cũ của Trung Quốc, cho phép duy trì ban đầu sự lãnh đạo của [FROM.GetRulingParty].\n\nCác hành động nổi loạn liên tục của họ và cho phép các bộ trưởng ly khai ở lại chính phủ của họ đã làm xáo trộn mối quan hệ, và rõ ràng là [FROM.GetLeader] , hoặc ít nhất là vụ cố vấn hiện tại của anh ta, sẽ không phù hợp với tương lai chung của chúng ta. Do đó, chúng ta đã thực thi quyền lực công bằng của mình với tư cách là người bá chủ để bắt đầu bàn giao quyền lực.\n\nSau khi gặp gỡ các chính trị gia địa phương, sĩ quan quân đội và các bên liên quan khác, Đại sứ của chúng ta đã tạo ra một chính phủ phù hợp hơn với lợi ích của chúng ta. Mặc dù một số người trong quá khứ đã tham gia vào các hoạt động ly khai, chế độ mới đủ thực dụng hoặc đủ ý thức hệ để củng cố sự nắm giữ của chúng ta đối với [FROM.Getname].\n\nTất nhiên, [FROM.GetLeader] và các bạn thân của ông đã khóc phản bội và rên rỉ về những lời hứa bị phá vỡ, nhưng với các đồng minh của họ không thể hoặc không muốn giúp đỡ, họ không có đòn bẩy thực sự đối với chúng ta. Cuối cùng họ đã đệ trình một cách hòa bình, đó là điều quan trọng. Bây giờ tất cả chúng ta có thể mong đợi tương lai tươi sáng và mối quan hệ đặc biệt \" \" bá quyền Trung Quốc mang lại."
 china_events.154.a: "Điều đó giải quyết vấn đề."

 china_events.155.t: "Sinophile Coup trong [FROM.Capital.GetCapitalVictoryPointName] sụp đổ"
 china_events.155.d: "Sau những cuộc đàm phán khó khăn với chính phủ [FROM.GetAdjective], người dân đã vui mừng rằng chúng ta đã có thể đi đến một thỏa thuận hòa bình để thống nhất đất nước. Các điều khoản của thỏa thuận là họ sẽ giữ lại một số quyền tự chủ trong nước và độc lập danh nghĩa trên sân khấu quốc tế với tư cách là người bảo hộ Trung Quốc, mặc dù các vấn đề đối ngoại của họ sẽ được xử lý trong [FROM.Capital.GetCapitalVictoryPointName] . Sự sắp xếp này, tương đương hiện đại với hệ thống bá chủ cũ của Trung Quốc, cho phép duy trì ban đầu sự lãnh đạo của [ROOT.GetRulingParty].\n\nCác hành động nổi loạn liên tục của họ và cho phép các bộ trưởng ly khai ở lại chính phủ của họ đã làm xáo trộn mối quan hệ, và rõ ràng là [ROOT.GetLeader] , hoặc ít nhất là vụ cố vấn hiện tại của anh ta, sẽ không phù hợp với tương lai chung của chúng ta. Do đó, chúng ta đã thực thi quyền lực công bằng của mình với tư cách là người bá chủ để bắt đầu bàn giao quyền lực.\n\nĐại sứ của chúng ta đã tìm cách giải quyết vấn đề bằng cách gặp gỡ các chính trị gia địa phương, sĩ quan quân đội và các bên liên quan khác để xây dựng một chính phủ phù hợp hơn với lợi ích của chúng ta. Tuy nhiên, với những người ly khai cố thủ nặng nề ở các vị trí quyền lực, những nỗ lực này đã trở thành vô nghĩa. [ROOT.GetLeader] và bạn bè của ông đã khóc phản bội và đã nổi dậy trong cuộc nổi dậy trong nỗ lực cuối cùng để bảo vệ sự độc lập của họ, nhưng với các đồng minh của họ không thể hoặc không muốn giúp đỡ điều này trớ trêu thay có lẽ sẽ hủy hoại quyền tự chủ đàm phán của họ."
 china_events.155.a: "Có vẻ như họ muốn là một tỉnh sau khi tất cả..."

### Concessions and Legation Cities interactions Events ###
 china_events.200.t: "[china.GetNameDefCap] Yêu cầu sự trở lại của nhượng bộ của chúng ta"
 china_events.200.desc: "Các cường quốc đã duy trì các nhượng bộ ở Trung Quốc kể từ Hiệp ước Nam Kinh, gần một thế kỷ trước. Bây giờ thống nhất dưới [china.GetLeader], chính Trung Quốc đang đứng trước ngưỡng cửa trở thành một cường quốc khác như vậy. Với quy mô thay đổi, chúng ta đã nhận được một thông cáo từ [china.Capital.GetCapitalVictoryPointName] một cách lịch sự, nhưng kiên quyết, yêu cầu 'sự trở lại' của các nhượng bộ của chúng ta.\n\nNếu một thông điệp như vậy được nhận chỉ vài năm trước đây, nó sẽ được đáp ứng bởi ít hơn so với vui chơi giải trí báo chí và jests trong thanh [ROOT.Capital.GetCapitalVictoryPointName]. Bây giờ vấn đề là nghiêm trọng chết người. Người Trung Quốc chỉ đơn giản có thể đi vào bất kỳ nhượng bộ của chúng ta hầu như không bị phản đối, để lại cho chúng ta với nhiệm vụ không thể phục hồi chúng, và sau đó chinh phục quốc gia Trung Quốc nói chung. Tuy nhiên, thế kỷ cuối cùng của truyền thống võ thuật của Trung Quốc là đốm tốt nhất, và quân đội của chúng ta không có nghi ngờ niềm tự hào của [ROOT.GetNameDef] ."
 china_events.200.a: "Chuyện này không đáng để gây chiến."
 china_events.200.b: "Yêu cầu bồi thường."
 china_events.200.c: "Phớt lờ lời đe dọa của họ."
 china_events.200.d: "Thông báo [THIS.overlord.GetNonIdeologyName] ngay lập tức!"

 china_events.201.t: "[FROM.GetNameDefCap] trả lại nhượng bộ của chúng ta"
 china_events.201.d: "Bất chấp sự mong đợi của chúng ta, [FROM.Capital.GetCapitalVictoryPointName] đã trả lại những nhượng bộ của mình mà không cần chiến đấu. Đây là một ngày vinh quang cho Trung Quốc, và một bước chiến thắng trên hành trình chấm dứt sự sỉ nhục quốc gia!"
 china_events.201.a: "Vạn tuế!"

 china_events.202.t: "[FROM.GetNameDefCap] muốn bồi thường cho nhượng bộ của nó"
 china_events.202.d: "Trong trường hợp chỉ một vài năm trước [FROM.Capital.GetCapitalVictoryPointName] sẽ bác bỏ yêu cầu của chúng ta ra khỏi tầm tay, các đại biểu [FROM.GetAdjective] đã đồng ý bàn giao nhượng bộ của họ trên nguyên tắc, nhưng với một điều kiện: bồi thường. Khái niệm rằng chúng ta nên phải bồi thường cho người nước ngoài đối với đất bị tịch thu dưới sự cưỡng bức là, tất nhiên, vô lý. Tuy nhiên, điều này có thể chứng minh một cách tương đối dễ dàng để tránh một cuộc chiến tranh tốn kém, cũng như bất kỳ nguy cơ ô nhục nào trong nước là lực lượng của chúng ta phải chịu thất bại."
 china_events.202.a: "Chúng ta sẽ trả tiền."
 china_events.202.b: "Hoàn toàn không."

 china_events.203.t: "[FROM.GetNameDefCap] đồng ý bồi thường cho nhượng bộ"
 china_events.203.d: "Thấy có lý, người Trung Quốc đã đồng ý bồi thường cho chúng ta vì những nhượng bộ của chúng ta. Miễn là họ trả tiền, và đầy đủ, đây sẽ là kết thúc của vấn đề."
 china_events.203.a: "Tốt lắm."

 china_events.204.t: "[FROM.GetNameDefCap] Từ chối bồi thường cho nhượng bộ"
 china_events.204.d: "Chống lại tất cả các ý nghĩa tốt, Trung Quốc đã từ chối đề nghị của chúng ta để chấp nhận bồi thường cho sự trở lại của nhượng bộ của chúng ta. Chúng ta phải chuẩn bị cho tình huống chiến tranh."
 china_events.204.a: "Mẹ kiếp lũ ngốc."

 china_events.205.t: "[FROM.GetNameDefCap] Từ chối trả lại nhượng bộ"
 china_events.205.d: "Đúng như mong đợi từ những đế quốc không hối hận như vậy, người nước ngoài [FROM.GetAdjective] đã từ chối trả lại nhượng bộ của họ. Bây giờ chúng ta sẽ cho họ thấy sức mạnh của một Trung Quốc thống nhất!"
 china_events.205.a: "Chúng ta chỉ cần nắm tay lại."

 china_events.210.t: "Trung Quốc cố gắng nắm bắt các tô giới!"
 china_events.210.d: "Chưa đầy một giờ trước, quân đội Trung Quốc đã cố gắng xâm nhập vào nhượng bộ của chúng ta, và mặc dù kháng cự dữ dội đứng để nắm bắt chúng hoàn toàn trước khi ngày được thực hiện. Chúng ta phải quyết định ở đây và bây giờ cho dù chúng ta sẽ đi thuyền đến giải cứu họ, và đặt xuống mối đe dọa Trung Quốc này một lần và cho tất cả!"
 china_events.210.a: "Triển khai hạm đội!"
 china_events.210.b: "Chúng không thể được bảo vệ."
 china_events.210.c: "Thông báo [THIS.overlord.GetNonIdeologyName] ngay lập tức!"

 china_events.211.t: "[FROM.GetNameDefCap] Từ bỏ nhượng bộ của nó"
 china_events.211.d: "Khiếp sợ bởi sức mạnh kết hợp của chúng ta và quyết tâm vững chắc, người nước ngoài đã từ bỏ tất cả các nhượng bộ của họ, để lại cho họ chín muồi để trở về Trung Quốc. Lực lượng của chúng ta đã sẵn sàng để nắm bắt chúng, và nâng cao lá cờ Trung Quốc trên đường phố của họ. Một bước đi vinh quang khác trên con đường kết thúc thế kỷ nhục nhã quốc gia của chúng ta!"
 china_events.211.a: "Vạn tuế!"

 china_events.212.t: "[FROM.GetNameDefCap] Đe dọa chiến tranh"
 china_events.212.d: "Động thái của chúng ta để nắm bắt các tô giới đã kích hoạt một phản ứng giận dữ từ [FROM.Capital.GetCapitalVictoryPointName], và đại sứ của họ trong [ROOT.Capital.GetCapitalVictoryPointName] đã chính thức đe dọa chiến tranh. Chúng ta có thực sự đủ khả năng để lùi lại bây giờ?"
 china_events.212.a: "Lùi lại."
 china_events.212.b: "Hãy để có chiến tranh."

 china_events.213.t: "Trung Quốc lùi bước trước những nhượng bộ"
 china_events.213.d: "Trước sự ngạc nhiên của hầu hết mọi người, Trung Quốc đã chùn bước khi đối mặt với chiến tranh và rút quân khỏi biên giới nhượng bộ của chúng ta. Các chi nhánh chính trị trong [FROM.Capital.GetCapitalVictoryPointName] chắc chắn sẽ có ý nghĩa, nhưng chúng ta có thể mong đợi không có mối đe dọa thực sự nào xuất hiện trong tương lai gần."
 china_events.213.a: "Tin tuyệt vời."

 china_events.214.t: "Trung Quốc thu hút sự nhượng bộ"
 china_events.214.d: "Bất chấp mối đe dọa chiến tranh của chúng ta, quân đội Trung Quốc đã chuyển sang nhượng bộ của chúng ta, vượt qua sự kháng cự nhỏ nhoi do các đơn vị đồn trú và lực lượng dân quân địa phương của chúng ta trình bày. Bây giờ chúng ta phải thực hiện tốt lời hứa của mình, và thời gian đã đến cho chiến tranh."
 china_events.214.a: "Và chiến tranh sẽ xảy ra!"

 china_events.220.t: "Hoàng hôn trên Bến Thượng Hải"
 china_events.220.d.puppet: "Các cường quốc đã duy trì nhượng bộ ở Trung Quốc kể từ Hiệp ước Nam Kinh, gần một thế kỷ trước. Bây giờ thống nhất dưới [FROM.GetLeader] , Trung Quốc chính nó đứng trên ngưỡng cửa trở thành một sức mạnh như vậy. Với quy mô như vậy-shifted, chúng ta đã nhận được một thông cáo từ [FROM.Capital.GetCapitalVictoryPointName] lịch sự, nhưng kiên quyết, yêu cầu 'sự trở lại' của các thành phố của chúng ta. Nếu một thông điệp như vậy đã được nhận chỉ vài năm trước đây, nó sẽ được đáp ứng bởi ít hơn vui chơi giải trí báo chí và jests trên quán bar khách sạn. Bây giờ nó không phải là vấn đề cười.\n\nMột mặt, Trung Quốc dường như gần như không thể ngăn cản. Nhiệm vụ quốc tế của chúng ta đã trở thành một lời nhắc nhở cuối cùng của cái gọi là 'Thế kỷ sỉ nhục' của họ. Mặt khác, tái hòa nhập đe dọa các ngôi nhà và sinh kế được xây dựng bởi vô số người dân ở Thượng Hải, Thiên Tân, và các nơi khác; một sự pha trộn độc đáo của nền văn hóa không tìm thấy nơi nào khác trên thế giới. May mắn thay, chúng ta có thể thoải mái trong việc bảo vệ [LEC.overlord.GetName] . Nếu chúng ta đang tìm kiếm sự cứu rỗi, nó sẽ nằm trong tay của họ."
 china_events.220.d.in_faction: "Các cường quốc đã duy trì nhượng bộ ở Trung Quốc kể từ Hiệp ước Nam Kinh, gần một thế kỷ trước. Bây giờ thống nhất dưới [FROM.GetLeader] , Trung Quốc chính nó đứng trên ngưỡng cửa trở thành một sức mạnh như vậy. Với quy mô như vậy-shifted, chúng ta đã nhận được một thông cáo từ [FROM.Capital.GetCapitalVictoryPointName] lịch sự, nhưng kiên quyết, yêu cầu 'sự trở lại' của các thành phố của chúng ta. Nếu một thông điệp như vậy đã được nhận chỉ vài năm trước đây, nó sẽ được đáp ứng bởi ít hơn vui chơi giải trí báo chí và jests trên quán bar khách sạn. Bây giờ nó không phải là vấn đề cười.\n\nMột mặt, Trung Quốc dường như gần như không thể ngăn cản. Nhiệm vụ quốc tế của chúng ta đã trở thành một lời nhắc nhở cuối cùng của cái gọi là 'Thế kỷ sỉ nhục' của họ. Mặt khác, tái hòa nhập đe dọa các ngôi nhà và sinh kế được xây dựng bởi vô số người dân ở Thượng Hải, Thiên Tân, và các nơi khác; một sự pha trộn độc đáo của nền văn hóa không tìm thấy nơi nào khác trên thế giới. May mắn thay, chúng ta có thể thoải mái trong việc bảo vệ [LEC.FactionLeader.GetName] và các đồng minh khác của chúng ta. Nếu chúng ta đang tìm kiếm sự cứu rỗi, nó sẽ nằm trong tay của họ."
 china_events.220.d.council: "Các cường quốc đã duy trì tô giới ở Trung Quốc kể từ Hiệp ước Nam Kinh, gần một thế kỷ trước. Bây giờ thống nhất dưới [FROM.GetLeader] , Trung Quốc chính nó đứng trên ngưỡng cửa trở thành một sức mạnh như vậy. Với quy mô như vậy-shifted, chúng ta đã nhận được một thông cáo từ [FROM.Capital.GetCapitalVictoryPointName] lịch sự, nhưng kiên quyết, yêu cầu 'sự trở lại' của các thành phố của chúng ta. Nếu một thông điệp như vậy đã được nhận chỉ vài năm trước đây, nó sẽ được đáp ứng bởi ít hơn vui chơi giải trí báo chí và jests trên quán bar khách sạn. Bây giờ nó không phải là vấn đề cười.\n\nMột mặt, Trung Quốc dường như gần như không thể ngăn cản. Nhiệm vụ quốc tế của chúng ta đã trở thành một lời nhắc nhở cuối cùng về cái gọi là 'Thế kỷ nhục nhã' của họ. Mặt khác, tái hòa nhập đe dọa nhà cửa và sinh kế được xây dựng bởi vô số người ở Thượng Hải, Thiên Tân, và các nơi khác; một sự pha trộn độc đáo của các nền văn hóa không tìm thấy ở bất cứ nơi nào khác trên thế giới. May mắn thay, chúng ta có thể thoải mái trong việc bảo vệ các thành viên của Hội đồng Công sứ quán, quyền lực lớn của riêng mình. Nếu họ có thể quyết định một quá trình hành động, và với bất kỳ sự vội vàng, sự cứu rỗi sẽ đến trong tay của họ."
 china_events.220.d.independent: "Các cường quốc đã duy trì nhượng bộ ở Trung Quốc kể từ Hiệp ước Nam Kinh, gần một thế kỷ trước. Bây giờ thống nhất dưới [FROM.GetLeader] , Trung Quốc chính nó đứng trên ngưỡng cửa trở thành một sức mạnh như vậy. Với quy mô như vậy-shifted, chúng ta đã nhận được một thông cáo từ [FROM.Capital.GetCapitalVictoryPointName] lịch sự, nhưng kiên quyết, yêu cầu 'sự trở lại' của các thành phố của chúng ta. Nếu một thông điệp như vậy đã được nhận chỉ vài năm trước đây, nó sẽ được đáp ứng bởi ít hơn vui chơi giải trí báo chí và jests trên quán bar khách sạn. Bây giờ nó không phải là vấn đề cười.\n\nMột mặt, Trung Quốc dường như gần như không thể ngăn cản. Nhiệm vụ quốc tế của chúng ta đã trở thành một lời nhắc nhở cuối cùng của cái gọi là 'Thế kỷ sỉ nhục' của họ. Mặt khác, tái hòa nhập đe dọa nhà cửa và sinh kế được xây dựng bởi vô số người dân ở Thượng Hải, Thiên Tân, và các nơi khác; một sự pha trộn độc đáo của nền văn hóa tìm thấy không nơi nào khác trên thế giới. Bây giờ là lúc để lựa chọn."
 china_events.220.a: "Chuyển tiếp nhu cầu của họ đến [ROOT.Overlord.Capital.GetCapitalVictoryPointName]."
 china_events.220.b: "Đề nghị [LEC.FactionLeader.Capital.GetCapitalVictoryPointName] giải tán Nhiệm vụ."
 china_events.220.c: "Đề nghị [LEC.FactionLeader.Capital.GetCapitalVictoryPointName] bảo vệ Nhiệm vụ."
 china_events.220.d: "Đề nghị Hội đồng Tư pháp tự giải tán."
 china_events.220.e: "Đề nghị Hội đồng Tư pháp tự bảo vệ mình."
 china_events.220.f: "Chúng ta phải chấp nhận điều không tránh khỏi."
 china_events.220.g: "Chúng ta sẽ chiến đấu!"

 china_events.221.t: "Chấm dứt Bách niên Quốc sỉ"
 china_events.221.d.puppet: "Chống lại sự mong đợi của chúng ta, [LEC.overlord.GetNameDef] đã đồng ý bàn giao các thành phố Legation qua cho chúng ta mà không cần một cuộc chiến. Mặc dù sẽ không có nghi ngờ holdouts và những người gây rối khác, kế hoạch đã được thực hiện cho một cuộc diễu hành chiến thắng xuống Bến Thượng Hải, và nâng cao một lá cờ Trung Quốc trên Thượng Hải lần đầu tiên trong một thế kỷ. Chúng ta hoàn toàn mong đợi vài tuần hỗn loạn một phần, kiểm duyệt bởi sự hợp tác giữa những người lính của chúng ta và những người của lực lượng nước ngoài chiếm đóng. Vì vậy, quá cũng sẽ có khả năng là một chuyến bay của hàng ngàn công dân nước ngoài và các cộng sự của họ. Họ sẽ nhận được thông qua an toàn ở nước ngoài theo các điều khoản thỏa thuận với [LEC.overlord.Capital.GetCapitalVictoryPointName] . Việc tái hòa nhập của các thành phố Legation sẽ mất thời gian và nỗ lực, nhưng cuối cùng, sau nhiều thập kỷ sỉ nhục, Trung Quốc có thể đứng cao và tự hào một lần nữa!"
 china_events.221.d.in_faction: "Chống lại sự mong đợi của chúng ta, [LEC.FactionLeader.GetName] đã đồng ý bàn giao các thành phố Legation qua cho chúng ta mà không cần một cuộc chiến. Điều này dường như đã bắt gặp những người nước ngoài ở Thượng Hải, Thiên Tân, và các thành phố khác bất ngờ, và động thái này đã được thực hiện như là một sự phản bội. Mặc dù kế hoạch đang được soạn thảo cho một cuộc diễu hành chiến thắng xuống Bến Thượng Hải, và nâng cao một lá cờ Trung Quốc trên Thượng Hải lần đầu tiên trong một thế kỷ, các sự kiện có thể sẽ diễn ra ít sạch sẽ. Các nhóm phòng thủ tình nguyện hiện tại của thành phố sẽ sớm thấy mình được củng cố bởi những người hy vọng sẽ bảo vệ ngôi nhà của họ, ngay cả khi quân đội [LEC.FactionLeader.GetAdjective] chuẩn bị rút lui. Hỗn loạn đã bắt đầu lấp đầy các đường phố của Thượng Hải như người nước ngoài đống lên tàu, lấy súng trường, hoặc rào chắn nhà của họ. Những tuần và tháng tiếp theo sẽ lộn xộn, nhưng đó là cái giá của chủ nghĩa đế quốc."
 china_events.221.d.independent: "Chống lại sự mong đợi của chúng ta, các thành phố Legation đã đồng ý giải tán chính mình, có hiệu quả bàn giao quyền lực cho chính phủ của chúng ta. Ít ngạc nhiên hơn, thỏa thuận đi kèm với một tập hợp dài các điều kiện, bao gồm cả các khoản thanh toán cho các chủ doanh nghiệp nước ngoài, đảm bảo an toàn thông qua, và trao đổi dần dần thẩm quyền. Cuối cùng, đây là một cái giá nhỏ phải trả. Kế hoạch đã được vẽ lên cho một cuộc diễu hành chiến thắng xuống Bến Thượng Hải, và việc nâng cao một lá cờ Trung Quốc trên Thượng Hải lần đầu tiên trong một thế kỷ. Mặc dù không có nghi ngờ sẽ có một số hoảng loạn, holdouts bạo lực, và những kẻ gây rối khác, cũng như vài tháng làm việc hướng tới tái hòa nhập, Trung Quốc có thể đứng cao và tự hào một lần nữa. Thế kỷ của sự sỉ nhục cuối cùng đã kết thúc!"
 china_events.221.a: "Cuối cùng nó cũng kết thúc!"

 china_events.222.t: "Từ chối"
 china_events.222.d: "Trích dẫn ”Láo cáo Chính phủ” khét tiếng đã kích hoạt Cuộc tranh giành Thượng Hải năm 1925, [LEC.GetLeader] thẳng thừng từ chối yêu cầu bàn giao các Thành phố Công sứ của chúng ta. Ông viết: ”Một lần nữa, ranh giới phải được vạch ra”. Tuy nhiên, lần này, không có tàu chiến Đức, Nhật Bản hay Mỹ nào có thể xông vào hỗ trợ ông ta, và thay vào đó, sức mạnh của một Trung Quốc thống nhất sẽ đè bẹp những tô giới nhỏ bé, bất thành văn của ông ta. Với kích thước nhỏ bé và thiếu sự bảo vệ, việc chiếm giữ các Thành phố Công sứ giống như đè bẹp một con côn trùng, nhưng cộng đồng quốc tế chắc chắn sẽ sơn chúng ta là kẻ phản diện. Đặc biệt với Thượng Hải đề nghị kháng cự, các thành phố sẽ nhanh chóng rơi vào hỗn loạn, khi người nước ngoài đổ xô lên tàu, những người khác rào chắn nhà của họ và đàn ông cầm vũ khí như một phần của các lực lượng tình nguyện khác nhau. Người nước ngoài sẽ bảo vệ nhà của họ, nhiều người cho đến người cuối cùng, và Thượng Hải, Paris của phương Đông, sẽ bị đốt cháy."
 china_events.222.a: "Hãy để họ giữ thành phố của mình."
 china_events.222.b: "Dũng cảm nhưng ngu ngốc."

 china_events.223.t: "Một thông điệp từ [china.Capital.GetCapitalVictoryPointName]"
 china_events.223.d.overlord: "Chúng ta đã nhận được tin từ Thượng Hải rằng Trung Quốc, lần đầu tiên thống nhất dưới một chính phủ duy nhất trong nhiều thập kỷ, muốn đàm phán lại tình trạng của các Thành phố Công sứ. Nói một cách rõ ràng, họ đang yêu cầu trả lại ngay lập tức tất cả các tô giới của chúng ta ở Trung Quốc. Nhiều trí thức sẽ lập luận rằng các Thành phố Công sứ là tiếng vang của một thời đại đã qua, nhưng có rất ít nơi trên thế giới có lợi nhuận như Thượng Hải, hoặc quan trọng về mặt chiến lược. Các tướng lĩnh của chúng ta chỉ ra những khó khăn trong việc giữ một tập hợp lãnh thổ nhỏ như vậy chống lại một quốc gia lớn như Trung Quốc, với nguồn nhân lực dồi dào, nhưng ngoại giao pháo hạm vẫn chưa đáp ứng được trận đấu của nó.\n\nCác thành phố tòa án có thể cố gắng tự vệ, bằng cách này hay cách khác, nhưng nếu chúng ta quyết định hành động, chúng ta phải chuẩn bị để làm như vậy đến cùng."
 china_events.223.d.independent_suggests_disbanding: "Chúng ta đã nhận được tin từ Thượng Hải rằng Trung Quốc, lần đầu tiên trong nhiều thập kỷ nay thống nhất dưới một chính phủ duy nhất, muốn đàm phán lại tình trạng của các Thành phố Công sứ. Nói một cách đơn giản, họ đang yêu cầu trả lại ngay lập tức tất cả các tô giới của chúng ta ở Trung Quốc. Đáng ngạc nhiên, Hội đồng thành phố Thượng Hải, người thiết lập xu hướng cho toàn bộ các thành phố, đã đề nghị giải tán chính nó và tô giới các yêu cầu của Trung Quốc. Quyết định của họ có thể được đưa ra với hy vọng đảm bảo sơ tán an toàn cho hàng chục nghìn người không phải là người Trung Quốc, và có lẽ là khoản bồi thường cho các chủ doanh nghiệp bị mất mọi thứ trong cuộc tiếp quản. Tuy nhiên, chúng ta không cần phải chú ý đến khuyến nghị của họ. Có rất ít nơi trên thế giới có lợi nhuận như Thượng Hải, hoặc quan trọng về mặt chiến lược. Các tướng lĩnh của chúng ta chỉ ra những khó khăn trong việc giữ một tập hợp lãnh thổ nhỏ như vậy chống lại một quốc gia lớn như Trung Quốc, với nguồn nhân lực dồi dào, nhưng ngoại giao pháo hạm vẫn chưa đáp ứng được đối thủ của nó.\n\nNếu chúng ta chọn bảo vệ Thượng Hải và các thành phố khác, chúng ta phải chuẩn bị để làm như vậy đến cùng."
 china_events.223.d.independent_suggests_keeping: "Chúng ta đã nhận được tin từ Thượng Hải rằng Trung Quốc, lần đầu tiên thống nhất dưới một chính phủ duy nhất trong nhiều thập kỷ, muốn đàm phán lại tình trạng của các Thành phố Công sứ. Nói một cách rõ ràng, họ đang yêu cầu trả lại ngay lập tức tất cả các tô giới của chúng ta ở Trung Quốc. Không có gì đáng ngạc nhiên, Hội đồng thành phố Thượng Hải, người thiết lập xu hướng cho toàn bộ các thành phố, đã khuyến nghị không nên tô giới trước các yêu cầu của Trung Quốc. Nhiều trí thức sẽ lập luận rằng các Thành phố Công sứ là tiếng vang của một thời đại đã qua, nhưng có rất ít nơi trên thế giới có lợi nhuận như Thượng Hải, hoặc quan trọng về mặt chiến lược. Các tướng lĩnh của chúng ta chỉ ra những khó khăn trong việc giữ một tập hợp lãnh thổ nhỏ như vậy chống lại một quốc gia lớn như Trung Quốc, với nguồn nhân lực dồi dào, nhưng ngoại giao pháo hạm vẫn chưa đáp ứng được đối thủ của nó.\n\nCác thành phố tòa án có thể sẽ cố gắng tự vệ, bằng cách này hay cách khác, nhưng nếu chúng ta quyết định hành động, chúng ta phải chuẩn bị để làm như vậy đến cùng."
 china_events.223.a: "Chúng ta sẽ thương lượng rút quân có trật tự."
 china_events.223.b: "Chúng ta sẽ bảo vệ thành phố Legation."

 china_events.224.t: "Kết thúc một thời đại"
 china_events.224.d: "Quyết định đã được truyền lại từ [FROM.Capital.GetCapitalVictoryPointName]: Các thành phố công sứ sẽ giải tán sau khi sơ tán tất cả những người muốn rời đi và rút lui có trật tự những lực lượng đồn trú còn lại. Các chủ doanh nghiệp sẽ được chính phủ Trung Quốc bồi thường theo cổ phần và lợi nhuận ngoại suy của họ. Thực tế ở Thượng Hải, Thiên Tân và các thành phố khác có thể sẽ giống với các điều khoản đã thỏa thuận, nhưng sẽ có những người từ chối sống theo luật pháp Trung Quốc. Việc sơ tán cũng có thể sẽ kém trật tự hơn dự kiến và khoản bồi thường đã hứa có thể mất thời gian để hiện thực hóa, nếu có.\n\nTuy nhiên, không thiếu chiến thắng trong doanh trại của Trung Quốc. Kế hoạch có thể đã được rút ra cho một cuộc diễu hành hào hoa xuống Bến Thượng Hải, và treo cờ Trung Quốc trên Thượng Hải lần đầu tiên sau một thế kỷ. Bây giờ không còn gì để làm ngoài việc đóng gói hành lý, nói lời tạm biệt và đi thuyền vào hoàng hôn."
 china_events.224.a: "Và rồi bức màn rơi xuống."

 china_events.225.t: "Lý lẽ cuối cùng của các đế quốc"
 china_events.225.d: "Quyết định của [FROM.GetLeader] đã đến từ [FROM.Capital.GetCapitalVictoryPointName] : Các thành phố của Quân đoàn sẽ được bảo vệ. Ngay cả bây giờ, các tàu chiến [FROM.GetAdjective] nên đi thuyền đến viện trợ của chúng ta, để tham gia lực lượng với các đơn vị đồn trú [FROM.GetAdjective] và quân đoàn tình nguyện của chúng ta, tất cả để tránh cuộc xâm lược của Trung Quốc bị đe dọa. Mặc dù tin tức này chắc chắn sẽ được đáp ứng bằng những tiếng reo hò trên Bến Thượng Hải, một trận chiến cho Thượng Hải, chứ đừng nói đến các thành phố khác, có thể chứng minh thảm họa. Ngay cả khi chúng ta có thể được bảo vệ, chúng ta sẽ phải chịu sự bắn phá và bao vây. Thương mại, huyết mạch của các thành phố công bằng của chúng ta, có thể bị cắt đứt trong nhiều tuần, nhiều tháng hoặc thậm chí nhiều năm.\n\nHy vọng lớn nhất của chúng ta bây giờ là Trung Quốc lùi bước, và để cho chúng ta tự quyết định số phận của mình."
 china_events.225.a: "Nó có thể được quyết định bởi thanh kiếm."

 china_events.226.t: "Các thành phố Legation sẽ được bảo vệ"
 china_events.226.d.same_faction: "Cách đây không lâu, chúng ta và [FROM.FROM.GetNameDef] đã đồng ý hỗ trợ nhau trong các vấn đề chiến tranh và hòa bình, thành lập một liên minh được cho là đứng trước thử thách của thời gian. Bây giờ [FROM.FROM.GetNameDef] đã ném lợi ích của chúng ta ra ngoài cửa sổ bằng cách phản đối kế hoạch cải tạo các Thành phố Công sứ của chúng ta. Bây giờ chúng ta buộc phải lựa chọn giữa các đồng minh của chúng ta và lợi ích quốc gia cốt lõi - một nhiệm vụ thiêng liêng bắt đầu với sự sỉ nhục và chia rẽ Trung Quốc trong tay các cường quốc nước ngoài gần một thế kỷ trước. Nếu chúng ta quyết định công nhận lợi ích của đồng minh so với lợi ích của chính mình, chúng ta chắc chắn sẽ kéo dài thế kỷ sỉ nhục đã kéo dài, nhưng đôi khi nhu cầu phải ra lệnh cho mong muốn của chúng ta. Để mất [FROM.FROM.GetNameDef] như một đồng minh, và sau đó chiến đấu với họ trên chiến trường, có thể là dại dột bất kể hậu quả chính trị."
 china_events.226.d.not_same_faction: "Dường như lặp lại các sự kiện của năm 1925, khi một liên minh quốc tế đến để bảo vệ các tô giới của Anh đang chững lại ở Trung Quốc, [FROM.FROM.GetNameDef] đã tuyên bố ý định bảo vệ các thành phố Legation. Nhưng, Trung Quốc mạnh mẽ hơn và đoàn kết hơn nhiều so với trước đây. Với đủ quyết tâm, các bảng có thể được quay trở lại, và người nước ngoài có thể được thực hiện để trả một cái giá nặng nề cho sự ngạo mạn của họ. Tuy nhiên, chúng ta phải tìm kiếm sự thật từ các sự kiện. Không có vấn đề làm thế nào xa chúng ta đã đi, chúng ta phải đánh giá sức mạnh của kẻ thù của chúng ta chống lại chính chúng ta. Chiến đấu [FROM.FROM.GetName] và bất cứ đồng minh nào nó rút ra có thể chứng minh sự ngu ngốc không có vấn đề hậu quả chính trị."
 china_events.226.a: "Thời điểm không thích hợp."
 china_events.226.b: "Chúng ta phải rút lui, nhưng liên minh của chúng ta đã tan vỡ."
 china_events.226.c: "Điều này không thay đổi gì cả."

 china_events.227.t: "Một thông điệp từ [china.Capital.GetCapitalVictoryPointName]"
 china_events.227.d: "Chúng ta đã nhận được tin từ Thượng Hải rằng Trung Quốc, lần đầu tiên được thống nhất dưới một chính phủ duy nhất trong nhiều thập kỷ, muốn đàm phán lại tình trạng của các Thành phố Di chúc. Nói một cách rõ ràng, họ đang yêu cầu trả lại ngay lập tức tất cả các tô giới ở Trung Quốc. Vấn đề đã được chuyển đến Hội đồng Di chúc, và bất cứ lựa chọn nào mà hội đồng cuối cùng đưa ra sẽ bị ràng buộc.\n\nNhiều trí thức sẽ lập luận rằng các Thành phố Công sứ là tiếng vang của một thời đại đã qua, nhưng có rất ít nơi trên thế giới có lợi nhuận như Thượng Hải, hoặc quan trọng về mặt chiến lược. Các tướng lĩnh của chúng ta chỉ ra sự khó khăn trong việc giữ một tập hợp lãnh thổ nhỏ như vậy chống lại một quốc gia lớn như Trung Quốc, với nguồn nhân lực dồi dào, nhưng ngoại giao pháo hạm vẫn chưa đáp ứng được đối thủ của nó.\n\nCác thành phố Legation có thể cố gắng tự bảo vệ mình, bằng cách này hay cách khác, nhưng nếu hội đồng bỏ phiếu để bảo vệ nhiệm vụ, chúng ta phải chuẩn bị làm như vậy đến cùng. Thất bại quân sự bởi một cường quốc hạng hai như Trung Quốc sẽ không thể chấp nhận được. Với một số may mắn, người Trung Quốc sẽ lùi bước khi đối mặt với lực lượng áp đảo, nhưng mặt khác chiến tranh dường như không thể tránh khỏi.\n\nĐại sứ của chúng ta tại [china.Capital.GetCapitalVictoryPointName] đang chờ quyết định của chính phủ."
 china_events.227.a: "Bỏ phiếu để từ bỏ Nhiệm vụ."
 china_events.227.b: "Bỏ phiếu để bảo vệ Ủy."

 china_events.228.t: "Đã có kết quả bỏ phiếu"
 china_events.228.d.disband: "Nó đã được quyết định: với tất cả các phiếu bầu, Hội đồng Công sứ sẽ tự giải tán và trả lại cả lãnh thổ và quyền lực của mình cho chính phủ Trung Quốc. Sẽ có một cuộc sơ tán có trật tự của tất cả những người muốn rời đi, sau đó là rút quân đồn trú. Các chủ doanh nghiệp sẽ được chính phủ Trung Quốc bồi thường theo cổ phần và lợi nhuận ngoại suy của họ. Thực tế ở Thượng Hải, Thiên Tân và các thành phố khác có thể sẽ giống với các điều khoản đã thỏa thuận, nhưng sẽ có những người từ chối sống theo luật pháp Trung Quốc. Việc sơ tán cũng có thể sẽ kém trật tự hơn dự kiến và khoản bồi thường đã hứa có thể mất thời gian để hiện thực hóa, nếu có.\n\nTuy nhiên, không thiếu chiến thắng trong doanh trại Trung Quốc. Các kế hoạch có thể đã được vạch ra cho một cuộc hành quân hào hoa xuống Bến Thượng Hải và lần đầu tiên treo cờ Trung Quốc trên Thượng Hải sau một thế kỷ. Không có sự can thiệp của nước ngoài nào được thiết lập để thay đổi số phận của chúng ta, bây giờ chẳng có gì để làm ngoài việc xem xét chuyển giao quyền lực có trật tự, trong chừng mực người ta có thể sắp xếp. Sau đó, chúng ta phải đóng gói hành lý, nói lời tạm biệt và đi thuyền vào hoàng hôn."
 china_events.228.d.keep: "Nó đã được quyết định: với tất cả các phiếu bầu, Hội đồng Công sứ sẽ loại bỏ dứt khoát tối hậu thư của Trung Quốc và xem xét việc bảo vệ Ủy thác quốc tế bằng mọi cách cần thiết. Bây giờ, với bất kỳ may mắn nào, chúng ta sẽ thấy một sự lặp lại của năm 1925, khi một liên minh quốc tế đến để bảo vệ các tô giới thất bại của Anh. Ngay cả bây giờ, các hạm đội nước ngoài nên tập hợp để phòng thủ của chúng ta, nhưng cho đến khi họ đến, nó sẽ phụ thuộc vào chính quyền thành phố, lực lượng tình nguyện và đồn trú nước ngoài của chúng ta, để giữ phòng tuyến. Có lẽ người Trung Quốc sẽ không bao giờ đến - người ta từng nói rằng quân đội của họ chỉ có ý nghĩa hơn là phô trương và thổi phồng - nhưng các cuộc chiến tranh trong những năm gần đây sẽ cho thấy rằng họ sẽ đến, về số lượng và với quyết tâm lớn."
 china_events.228.a: "Kết thúc một thời đại."
 china_events.228.b: "Đường thẳng phải được vẽ ở đây."

 china_events.229.t: "Hội đồng Tòa án: Các phiếu bầu đang Trong"
 china_events.229.d.voted_for: "Nó đã được quyết định: mặc dù có một số phiếu bất đồng, Hội đồng Công sứ sẽ tự giải tán và trả lại cả lãnh thổ và thẩm quyền cho chính phủ Trung Quốc. Sẽ có một cuộc sơ tán có trật tự của tất cả những người muốn rời đi, sau đó là rút lực lượng đồn trú. Các chủ doanh nghiệp sẽ được chính phủ Trung Quốc bồi thường theo cổ phần và lợi nhuận ngoại suy của họ. Thực tế ở Thượng Hải, Thiên Tân và các thành phố khác có thể sẽ giống với các điều khoản đã thỏa thuận, nhưng sẽ có những người từ chối sống theo luật pháp Trung Quốc. Việc sơ tán cũng có thể sẽ kém trật tự hơn dự kiến và khoản bồi thường đã hứa có thể mất thời gian để hiện thực hóa, nếu có. Tuy nhiên, có khả năng sẽ không thiếu chiến thắng trong [china.Capital.GetCapitalVictoryPointName] . Các kế hoạch có thể đã được vẽ cho một cuộc diễu hành hào hoa xuống Bến Thượng Hải và lần đầu tiên nâng cờ Trung Quốc lên Thượng Hải trong một thế kỷ.\n\nGiờ thì chẳng còn gì để làm ngoài việc ra lệnh cho các đơn vị đồn trú của chúng ta quản lý quá trình chuyển đổi, đảm bảo an toàn cho công dân của chúng ta, và sau đó giong buồm về nhà lần cuối cùng."
 china_events.229.d.voted_against: "Nó đã được quyết định: bất chấp lá phiếu bất đồng của chúng ta, Hội đồng Tư pháp sẽ tự giải tán, và trả lại cả lãnh thổ và thẩm quyền của mình cho chính phủ Trung Quốc. Bề ngoài có vẻ như sẽ có một cuộc sơ tán có trật tự tất cả những người muốn rời đi, sau đó là rút các lực lượng đồn trú. Các chủ doanh nghiệp, rõ ràng, sẽ được chính phủ Trung Quốc bồi thường theo ”sở hữu” và ”lợi nhuận ngoại suy” của họ. Trong thực tế, công dân của chúng ta sẽ bị tước bỏ các quyền và tự do được trao theo hiệp ước ở Trung Quốc - được tổ tiên chiến đấu và bảo vệ một cách dũng cảm trong nhiều thập kỷ qua. Màn trình diễn ngây thơ vô lý này sẽ chỉ kết thúc trong hỗn loạn và đổ máu. Bây giờ chúng ta phải chọn có nên tách khỏi phần còn lại của hội đồng và bảo vệ các Thành phố Tư pháp theo cách riêng của chúng ta hay đơn giản là cố gắng hết sức để bảo vệ những gì còn lại của cuộc sống và tài sản của công dân chúng ta khỏi sai lầm hoành tráng này."
 china_events.229.a: "Đó là sự kết thúc của một kỷ nguyên."
 china_events.229.b: "Đúng như chúng ta hy vọng."
 china_events.229.c: "Cái này sẽ không đứng vững!"

 china_events.230.t: "Một nền hòa bình mong manh"
 china_events.230.d.will_be_attacked: "Nó đã được quyết định: mặc dù có một số phiếu bất đồng, Hội đồng Công sứ sẽ tự giải tán và trả lại cả lãnh thổ và thẩm quyền cho chính phủ Trung Quốc. Sẽ có một cuộc sơ tán có trật tự của tất cả những người muốn rời đi, sau đó là rút lực lượng đồn trú. Chủ doanh nghiệp sẽ được chính phủ Trung Quốc bồi thường theo cổ phần và lợi nhuận ngoại suy của họ. Thực tế ở Thượng Hải, Thiên Tân và các thành phố khác có thể sẽ giống với các điều khoản đã thỏa thuận, nhưng sẽ có những người từ chối sống theo luật pháp Trung Quốc. Việc sơ tán cũng có thể sẽ kém trật tự hơn dự kiến và khoản bồi thường đã hứa có thể mất thời gian để hiện thực hóa, nếu có. Tuy nhiên, có khả năng sẽ không thiếu chiến thắng trong [china.Capital.GetCapitalVictoryPointName] .\n\nTuy nhiên, không ai có thể đủ khả năng để bỏ qua các phiếu nổi bật trên Hội đồng Legation. Tin đồn xoáy rằng một hoặc nhiều quyền hạn sẽ từ chối thừa nhận kết quả, và đã có thể có kế hoạch rút ra cho chiến tranh với Trung Quốc, với các thành phố của chúng ta bị bắt giữa. Một số công dân của chúng ta sẽ không có nghi ngờ chào đón một kết quả như vậy, mặc dù sự hủy diệt hứa hẹn. Tuy nhiên, những vấn đề như vậy có khả năng vượt quá mối quan tâm của chúng ta, như Nhiệm vụ của chúng ta sẽ sớm kết thúc. Có rất ít còn lại để làm nhưng đóng gói túi xách của chúng ta, nói lời tạm biệt của chúng ta, và đi thuyền vào hoàng hôn ..."
 china_events.230.d.peaceful_reunification: "Nó đã được nhất trí quyết định: Hội đồng Công sứ sẽ tự giải tán và trả lại cả lãnh thổ và thẩm quyền của mình cho chính phủ Trung Quốc. Sẽ có một cuộc sơ tán có trật tự của tất cả những người muốn rời đi, sau đó là rút lực lượng đồn trú. Chủ doanh nghiệp sẽ được chính phủ Trung Quốc bồi thường theo cổ phần và lợi nhuận ngoại suy của họ. Thực tế ở Thượng Hải, Thiên Tân và các thành phố khác có thể sẽ giống với các điều khoản đã thỏa thuận, nhưng sẽ có những người từ chối sống theo luật pháp Trung Quốc. Việc sơ tán cũng có thể sẽ kém trật tự hơn dự kiến và khoản bồi thường đã hứa có thể mất thời gian để hiện thực hóa, nếu có. Tuy nhiên, có khả năng sẽ không thiếu chiến thắng trong [china.Capital.GetCapitalVictoryPointName] . Bây giờ có rất ít việc phải làm ngoài việc đóng gói túi xách của chúng ta, nói lời tạm biệt và đi thuyền vào hoàng hôn."
 china_events.230.a: "Kết thúc một thời đại."

 china_events.231.t: "Các Thành phố Công sứ chấm dứt tồn tại"
 china_events.231.d.will_be_attacked: "Sau một cuộc tranh luận kéo dài, Hội đồng Công sứ quán đã bỏ phiếu vào đêm qua. Kết quả để lại đa số ủng hộ việc giải tán Ủy thác Quốc tế, một quá trình sẽ bắt đầu dưới sự giám sát của chúng ta. Sẽ có một cuộc sơ tán có trật tự tất cả những người muốn rời đi, tiếp theo là rút quân đồn trú nước ngoài. Các chủ doanh nghiệp sẽ được bồi thường theo cổ phần và lợi nhuận ngoại suy của họ, mặc dù tất cả các yêu sách sẽ cần phải được xác minh kỹ lưỡng. Một cuộc diễu hành chiến thắng sẽ đi qua Bến Thượng Hải, tiếp theo là việc treo cờ Trung Quốc ở đó lần đầu tiên trong hơn một thế kỷ. Hơn một trăm năm sỉ nhục cuối cùng cũng kết thúc. Hay là họ?\n\nChúng ta không thể bỏ qua rằng không phải mọi quyền lực trong Hội đồng Di chúc đều bỏ phiếu giải tán. Ngay cả khi chúng ta ăn mừng, chúng ta phải sẵn sàng cho một cuộc xung đột khác, mặc dù nó có thể không chắc chắn. Không thể chấm dứt cảnh giác quốc gia của chúng ta, và từ bây giờ, những người tìm cách làm nhục Trung Quốc luôn phải trả một cái giá đắt."
 china_events.231.d.peaceful_reunification: "Sau một cuộc tranh luận lớn, Hội đồng Công sứ quán đã bỏ phiếu vào đêm qua. Đáng ngạc nhiên, mọi thành viên đều bỏ phiếu giải tán Ủy thác Quốc tế, một quá trình mà bây giờ sẽ bắt đầu dưới sự giám sát công bằng của chúng ta. Sẽ có một cuộc sơ tán có trật tự tất cả những người muốn rời đi, sau đó là rút quân đồn trú nước ngoài. Các chủ doanh nghiệp sẽ được bồi thường theo cổ phần và lợi nhuận ngoại suy của họ, mặc dù tất cả các yêu sách sẽ cần phải được xác minh kỹ lưỡng. Một cuộc diễu hành chiến thắng sẽ đi qua Bến Thượng Hải, tiếp theo là việc treo cờ Trung Quốc ở đó lần đầu tiên trong hơn một thế kỷ. Từ này đã lan rộng: hơn một trăm năm sỉ nhục cuối cùng cũng kết thúc."
 china_events.231.a: "Nó vẫn chưa kết thúc."
 china_events.231.b: "Vạn tuế!"

 china_events.232.t: "Hội đồng Tòa án: Các phiếu bầu đang Trong"
 china_events.232.d.voted_for: "Nó đã được quyết định: mặc dù có một số phiếu bất đồng, Hội đồng Công sứ sẽ tự giải tán và trả lại cả lãnh thổ và quyền lực cho chính phủ Trung Quốc. Sẽ có một cuộc sơ tán có trật tự của tất cả những người muốn rời đi, sau đó là rút quân đồn trú. Các chủ doanh nghiệp sẽ được chính phủ Trung Quốc bồi thường theo cổ phần và lợi nhuận ngoại suy của họ. Thực tế ở Thượng Hải, Thiên Tân và các thành phố khác có thể sẽ giống với các điều khoản đã thỏa thuận, nhưng sẽ có những người từ chối sống theo luật pháp Trung Quốc. Việc sơ tán cũng có thể sẽ kém trật tự hơn dự kiến và khoản bồi thường đã hứa có thể mất thời gian để hiện thực hóa, nếu có.\n\nTuy nhiên, có một mối quan tâm lớn hơn kéo dài trên tất cả mọi thứ như một đám mây đen, phiếu bất đồng của hội đồng. Bề ngoài các quyết định của hội đồng là ràng buộc, nhưng quan hệ quốc tế không bao giờ đơn giản như vậy. Tin đồn xoáy rằng quân đội nước ngoài sẽ diễu hành trên đất Trung Quốc một lần nữa. Tuy nhiên, bỏ phiếu của chúng ta để giải tán các thành phố Legation và kết thúc ủy thác quốc tế miễn trừ chúng ta về tất cả trách nhiệm hơn nữa. Một khi lá cờ Trung Quốc tăng lên trên Bund, nó sẽ là mối quan tâm của chúng ta không còn."
 china_events.232.d.voted_against: "Nó đã được quyết định: bất chấp lá phiếu bất đồng của chúng ta, Hội đồng Di chúc sẽ tự giải tán, và trả lại cả lãnh thổ và thẩm quyền cho chính phủ Trung Quốc. Bề ngoài là sẽ có một cuộc sơ tán có trật tự của tất cả những người muốn rời đi, sau đó là rút quân đồn trú. Chủ doanh nghiệp, rõ ràng, sẽ được chính phủ Trung Quốc bồi thường theo ”sở hữu” và ”lợi nhuận ngoại suy” của họ. Trong thực tế, công dân của chúng ta sẽ bị tước bỏ các quyền và tự do được trao theo hiệp ước ở Trung Quốc - được tổ tiên chiến đấu và bảo vệ một cách dũng cảm trong nhiều thập kỷ qua. Màn trình diễn ngây thơ vô lý này sẽ chỉ kết thúc trong hỗn loạn và đổ máu.\n\nTuy nhiên, đa số là đa số. Điều chúng ta có thể làm nhất là cố gắng bảo vệ tính mạng và tài sản còn lại của công dân chúng ta, và đảm bảo sơ tán có trật tự nhất có thể. Sau đó, chúng ta sẽ xóa sạch bàn tay của mình về vấn đề cam chịu này và tất cả các mối quan hệ không cần thiết với Trung Quốc."
 china_events.232.a: "Kết thúc một kỷ nguyên."
 china_events.232.b: "Đồ ngốc."

 china_events.233.t: "Hội đồng Tòa án: Tối hậu thư bị bỏ qua"
 china_events.233.d: "Đã có thông báo từ Thượng Hải rằng Hội đồng Di sản đã bỏ phiếu phớt lờ tối hậu thư của chúng ta, và sẽ không tự nguyện đầu hàng các Thành phố Di sản. Mặc dù chiếm giữ các Di sản sẽ chỉ là chuyện vặt vãnh đối với quân đội của chúng ta, chúng ta phải xem xét cẩn thận hậu quả nếu các thành viên hội đồng chọn tham gia. Mặc dù chiến thắng cuối cùng của chúng ta là chắc chắn, một cuộc chiến kéo dài có thể can thiệp vào các mục tiêu khác của chúng ta. Đã đến lúc đưa ra cảnh báo cuối cùng cho những người nước ngoài kiêu ngạo này chưa?"
 china_events.233.a: "Đe dọa chiến tranh."
 china_events.233.b: "Lùi lại."

 china_events.234.t: "Cảnh cáo cuối cùng của Trung Quốc"
 china_events.234.d: "Trong những gì đã được mô tả như là một 'Cảnh báo cuối cùng', Trung Quốc đã rõ ràng tuyên bố ý định của mình để nắm bắt các thành phố Legation bằng vũ lực. Như trong quá khứ, các lực lượng Trung Quốc có thể chiếm Thượng Hải, Thiên Tân, và các tô giới khác một cách tương đối dễ dàng, với công việc đòi lại chúng được để lại cho các hạm đội trả đũa và quân đội gửi từ nước ngoài. Bây giờ chưa được trả lời là liệu chúng ta, và các cường quốc hiệp ước khác, sẽ bước vào để thực hiện phòng thủ của thành phố.\n\nVẫn còn một cơ hội Trung Quốc sẽ rút lui khi đối mặt với lực lượng đủ mạnh, nhưng nếu họ không làm vậy chúng ta có thể thấy mình đang ở trong tình trạng chiến tranh."
 china_events.234.a: "Từ bỏ Nhiệm vụ."
 china_events.234.b: "Chuẩn bị cho chiến tranh."

 china_events.235.t: "Chiến tranh đang đến gần"
 china_events.235.d: "Trong những gì đã được mô tả như là một ”Cảnh báo cuối cùng”, Trung Quốc đã rõ ràng tuyên bố ý định chiếm giữ các thành phố của chúng ta bằng vũ lực. Mặc dù những người bảo vệ của chúng ta trong Hội đồng Di chúc có thể thuyết phục Trung Quốc lùi bước, chúng ta phải thực hiện tất cả các biện pháp phòng ngừa hợp lý và chuẩn bị cho chiến tranh. Nếu điều đó xảy ra, chúng ta có thể hy vọng dựa vào các đơn vị đồn trú nước ngoài đóng quân ở Thượng Hải và Thiên Tân, quân đoàn tình nguyện và một số đơn vị dân quân tự phát do dân thường tổ chức. Với một nửa lực lượng cảnh sát là người Trung Quốc, câu hỏi đã được đặt ra liên quan đến lòng trung thành của họ, cùng với đa số dân thường Trung Quốc ở mọi thành phố trong Ủy trị. Các nhà hoạch định đã đề nghị rút tất cả các lực lượng và dân thường nước ngoài về biên giới tô giới cũ.\n\nVới những biện pháp này được thực hiện, điều tốt nhất chúng ta có thể làm là hy vọng Trung Quốc lùi bước, hoặc rằng chúng ta có thể chiến đấu đủ lâu để được giải cứu bởi các đồng minh quốc tế của chúng ta."
 china_events.235.a: "Chúng ta phải hy vọng hòa bình..."

 china_events.236.t: "Các thành phố Legation sẽ được bảo vệ"
 china_events.236.d: "Cảnh báo cuối cùng của chúng ta rõ ràng đã rơi vào tai người điếc. Ít nhất một thành viên của Hội đồng Công sứ quán đã thề sẽ bảo vệ Ủy thác Quốc tế, có nghĩa là bất kỳ động thái nào chúng ta thực hiện để chiếm các thành phố đều có thể biến thành một cuộc chiến tranh dài và nguy hiểm. Mặc dù chúng ta có thể chọn lùi lại, nhưng hậu quả chính trị sẽ tàn phá chế độ của chúng ta. Lựa chọn tốt nhất còn lại của chúng ta có thể là chiếm các Thành phố của Công sứ quán càng nhanh càng tốt và hy vọng người nước ngoài mệt mỏi trong nỗ lực chiếm lại các thành phố. Với số thương vong đủ và vật liệu chiến tranh bị mất, chắc chắn họ sẽ mất hứng thú vào thời điểm thích hợp."
 china_events.236.a: "Chúng ta không thể chống lại chúng."
 china_events.236.b: "Đến lúc kết thúc trò chơi rồi."

 china_events.237.t: "Màn cuối"
 china_events.237.d: "Cuối cùng, có vẻ như những lời hứa của Hội đồng Di chúc chẳng là gì ngoài sự phẫn nộ. Khi thời điểm quyết định đến, không ai đứng ra bảo vệ chúng ta. Nếu không có bất kỳ thỏa thuận chuyển tiếp chính thức nào, quân đội Trung Quốc có thể được dự kiến sẽ sớm càn quét vào các thành phố của chúng ta và cố gắng thiết lập ý thức về trật tự của riêng họ. Cho đến lúc đó, chắc chắn chúng ta sẽ phải đối mặt với hoảng loạn, cướp bóc và người nước ngoài tranh giành trốn thoát trên bất kỳ con tàu nào được định sẵn để trở thành ”con thuyền cuối cùng rời Thượng Hải”. Cho dù chúng ta chọn gặp lực lượng chiếm đóng Trung Quốc trên Bến Thượng Hải hay trốn thoát giữa hỗn loạn, câu chuyện về Ủy thác Quốc tế sắp kết thúc."
 china_events.237.a: "Vậy là nó kết thúc."

 china_events.238.t: "Chiến thắng vinh quang"
 china_events.238.d: "Chủ nghĩa đế quốc nước ngoài cuối cùng đã gặp phải trận đấu của nó. Bất chấp những mối đe dọa và quân đội áp đặt của họ, cái gọi là 'người bảo vệ' của các thành phố công sứ đã bị tan biến theo gió, và tất cả đều từ bỏ 'Ủy thác quốc tế' của họ trong quá trình này! Bây giờ chúng ta chỉ cần ra lệnh, và quân đội của chúng ta sẽ tiến vào Thượng Hải, Thiên Tân và các thành phố khác hầu như không gặp trở ngại. Vâng, sẽ có sự kháng cự, nhưng bây giờ không có câu hỏi liệu nó có vô ích hay không. Đây là một ngày vinh quang cho Trung Quốc, và một kết thúc chiến thắng cho thế kỷ sỉ nhục quốc gia!"
 china_events.238.a: "Ra lệnh đi!"

 china_events.239.t: "Một bước ngoặt bất ngờ"
 china_events.239.d: "Chống lại những gì dường như là tỷ lệ cược không thể, Trung Quốc đã lùi lại khi đối mặt với một phản ứng kiên quyết từ người bảo lãnh của chúng ta trên Hội đồng Tòa công sứ. Đây là tin tức tốt nhất có thể, và khi nó phá vỡ, lễ kỷ niệm chắc chắn sẽ vang dội khắp các thành phố trong nhiều ngày và đêm. Tất nhiên, mối đe dọa của Trung Quốc vẫn còn rất nhiều nguyên vẹn, và về thể chất không xa hơn trước đây, nhưng sự phân nhánh chính trị của một thất bại như vậy sẽ có hậu quả thảm khốc cho chính phủ Trung Quốc hiện tại. Bất kỳ quan chức tương lai nào cũng sẽ phải giải thích cho sai lầm ngớ ngẩn của họ, và có thể sẽ ít có xu hướng chấp nhận rủi ro bừa bãi như vậy. Chúng ta không thể tin tưởng vào các mối đe dọa nữa trong ít nhất một vài năm tới."
 china_events.239.a: "Hoan hô! Hoan hô!"

 china_events.240.t: "Trung Quốc lùi bước"
 china_events.240.d: "Chống lại hầu hết các kỳ vọng, Trung Quốc đã lùi lại khi đối mặt với phản ứng kiên quyết của hội đồng. Khi tin tức phá vỡ, lễ kỷ niệm chắc chắn sẽ vang vọng trên khắp các thành phố Legation trong nhiều ngày và đêm kết thúc. Tất nhiên, mối đe dọa của Trung Quốc đối với sự độc lập của họ vẫn còn rất nhiều nguyên vẹn, và về thể chất không xa hơn so với trước đây. Tuy nhiên, các chi nhánh chính trị của thất bại này sẽ có hậu quả nghiêm trọng cho chính phủ Trung Quốc hiện tại. Bất kỳ quan chức tương lai sẽ phải giải thích cho sai lầm ngớ ngẩn của họ, và có khả năng sẽ ít có xu hướng chấp nhận rủi ro bừa bãi như vậy. Chúng ta có thể tin tưởng vào không có mối đe dọa nào nữa đối với nhiệm vụ trong ít nhất một vài năm tới."
 china_events.240.a: "Tin tuyệt vời."

### Chinese Unifier News Events ###
 china_events.300.t: "Đại Thanh trở lại"
 china_events.300.d: "Đối với các nhà quan sát bên ngoài, Cách mạng Tân Hợi năm 1911 đánh vần sự kết thúc của triều đại nhà Thanh trị vì hàng thế kỷ của Trung Quốc. Đối mặt với thất bại sau khi thất bại, Thiên mệnh, đã cai trị người dân Trung Quốc quá lâu, dường như rút ra hệ thống đế quốc đến một kết thúc cuối cùng.\n\nKể từ khi kết thúc Weltkrieg, tình hình chính trị ở Trung Quốc đã thay đổi đáng kể với sự phục hồi Xuantong. Mặc dù được liên minh với Trực Lệ Clique, hoàng gia Trung Quốc đã thành công đưa nhà Thanh đến một sự phục hồi hoàn toàn trong những năm qua. Bây giờ từ [FROM.Capital.GetCapitalVictoryPointName], Hoàng đế [ROOT.GetLeader] đã chính thức tuyên bố rằng với sự thống nhất gần đây của Trung Quốc, Great Thanh sẽ tìm cách tái khẳng định ưu thế văn hóa và chính trị của Trung Quốc ở Đông Á."
 china_events.300.a: "Đúng là một bước ngoặt!"

 china_events.301.t: "Chiến thắng của tập đoàn Trực Lệ"
 china_events.301.d: "Mặc dù có sự cai trị và kiểm soát của họ đối với Trung Quốc đầy đủ thách thức trong cuộc viễn chinh phương Bắc, nhưng sự phục hồi Xuân Thông sau đó đã khôi phục lại triều đại nhà Thanh và chứng kiến sự kiểm soát miền Bắc được củng cố bởi Ngô Bội Phu, Cao Kun và Trực Lệ Clique.\n\nMặc dù tình trạng bất ổn trong những năm qua với sự sụp đổ kinh tế của Thứ Hai Đen và Chiến tranh Liên minh, tuy nhiên, Trực Lệ đã giữ vững qua cơn bão. Trong khi các quân phiệt khác cố gắng tách khỏi sự kiểm soát của Trực Lệ, Trực Lệ vẫn đã đánh bại tất cả các chính phủ cạnh tranh, do đó thống nhất Trung Quốc một lần nữa. Trong một bài phát biểu vinh quang tại [FROM.Capital.GetCapitalVictoryPointName], Cao Kun đã tuyên bố rằng Trực Lệ sẽ tìm cách hiện đại hóa Trung Quốc và khẳng định ảnh hưởng của mình trên thế giới một lần nữa."
 china_events.301.a: "Phương Bắc lại thống trị một lần nữa."

 china_events.302.t: "Trực Lệ thống nhất Trung Hoa Dân Quốc"
 china_events.302.d: "Bất chấp thành công của Cách mạng Tân Hợi, giấc mơ về một Trung Quốc Cộng hòa dường như tan rã với sự phục hồi Xuân Đồng. Tuy nhiên, sau một cuộc đảo chính thất bại của những người trung thành với Mãn Châu trong thời kỳ Liên minh sụp đổ, giới lãnh đạo Trực Lệ tuyên bố sự trở lại của Cộng hòa Bắc Dương.\n\nVới việc thông qua lại Hiến pháp Cộng hòa và cuộc bầu cử Tổng thống [ROOT.GetLeader] gần đây, Cộng hòa do Trực Lệ lãnh đạo tìm cách tiếp tục di sản của Cách mạng Tân Hải. Chỉ có thời gian mới cho biết liệu Trực Lệ có tiếp tục chuyển đổi thành công từ một bè phái quân phiệt sang một nước Cộng hòa chính thức hay không - nhưng sự thống nhất đất nước của họ cho thấy họ có lẽ là người có khả năng làm như vậy nhất."
 china_events.302.a: "Một kỷ nguyên mới cho Trực Lệ Clique."

 china_events.303.t: "Chiến thắng của Chính phủ Phụng Thiên"
 china_events.303.d: "Trong khi gần như bị đánh bại trong các cuộc chiến tranh Zhi-Feng lần thứ ba và thứ tư, sự nắm giữ của bè phái Phụng Thiên ở Mãn Châu trong hơn một thập kỷ đã được chứng minh là thành công. Với chiến thắng gần đây của họ trong Chiến tranh Zhi-Feng lần thứ năm và Chiến tranh Trung-Nhật lần thứ hai sau đó, Nguyên soái [ROOT.GetLeader] đã chính thức tuyên bố tuyên bố về một nước Cộng hòa Trung Hoa thống nhất.\n\nMặc dù thành công trên chiến trường, những trận chiến tiếp theo mà Chính phủ Phụng Thiên phải đối phó không thể chỉ bằng lưỡi lê. Đối với nhiều người, Nguyên soái [ROOT.GetLeader] vẫn là một quân phiệt, và chỉ có thời gian mới cho biết liệu Chính phủ Phụng Thiên có xứng đáng là người kế thừa Cách mạng Tân Hải hay không."
 china_events.303.a: "[FNG.GetLeader] cuối cùng đã làm được."

 china_events.304.t: "Tuyên bố thành lập Trung Hoa Dân Quốc cải tổ"
 china_events.304.d: "Tin tức đáng kinh ngạc từ Trung Quốc ngày hôm nay khi chế độ bù nhìn do Nhật Bản cài đặt đã chính thức tuyên bố mình là 'Cộng hòa cải cách Trung Quốc'. Đại diện từ [JAP.GetNameDef] và những người trung thành với chế độ mới của Trung Quốc đã tham dự bài phát biểu của Chủ tịch [ROOT.GetLeader] , trong đó ông hoan nghênh sự thống nhất của Trung Quốc và mối quan hệ của Trung Quốc với Nhật Bản.\n\nLà một phần trong kế hoạch của [JAP.GetNameDef] cho một khối chống đế quốc Pan-Asian, Cộng hòa Cải cách Trung Quốc là một thử nghiệm táo bạo để biến Trung Quốc thành một đồng minh trong cái gọi là nhiệm vụ giải phóng châu Á khỏi chủ nghĩa đế quốc của Nhật Bản. Trong khi lãnh đạo chính phủ mới của Trung Quốc bao gồm các quan chức Trung Quốc, không có nghi ngờ rằng chính phủ chỉ trả lời Tokyo."
 china_events.304.a: "Mặt trời mọc ở Trung Quốc..."

 china_events.305.t: "Diêm Tích Sơn tuyên bố thống nhất Trung Quốc"
 china_events.305.d: "Trong nhiều năm, Thống đốc [ROOT.GetLeader] đã cai trị tỉnh Sơn Tây cô lập và nghèo nàn với tư cách là quân phiệt của nó - trong khi vẫn duy trì lập trường trung lập trên đấu trường chính trị Trung Quốc.Những phát triển gần đây ở Trung Quốc đã chứng kiến Hội Sơn Tây thoát khỏi sự trung lập của mình và nổi lên để đánh bại các yêu sách của chính phủ đối thủ thành công.\n\nBây giờ là Chủ tịch đầu tiên của Trung Hoa Dân Quốc hồi sinh, [ROOT.GetLeader] hy vọng cuối cùng sẽ kết hợp hệ tư tưởng độc đáo của mình trong nước vào Cộng hòa Trung Quốc mới - hy vọng mang lại trật tự cho quốc gia hỗn loạn Trung Quốc. Chủ tịch mới đã tuyên bố mong muốn duy trì hòa bình, ổn định và trung lập ở châu Á đồng thời khẳng định sức mạnh và chủ quyền của Trung Quốc với thế giới một lần nữa."
 china_events.305.a: "Tổng thống Diêm Tích Sơn thực sự là người đàn ông của thời đại."

 china_events.306.t: "Quốc dân quân thống nhất đất nước"
 china_events.306.d: "Sau thất bại của cả Phượng Tộc và Trực Lệ, nhà cách mạng bị tan vỡ Quốc dân đảng rút lui về tỉnh Sơn Tây vào cuối những năm 1920.Ở đó, họ đấu thầu thời gian của họ, và sau một cuộc đấu tranh quyền lực với thống đốc tỉnh Diêm Tích Sơn, họ nổi lên từ tỉnh để thống nhất thành công quốc gia Trung Quốc dưới ý thức hệ cách mạng ngây ngất [ROOT.GetLeader] của.\n\nBây giờ là Tổng thống đầu tiên tại Cộng hòa Trung Hoa hồi sinh, Chủ tịch [ROOT.GetLeader] đã tuyên bố rằng Cộng hòa mới sẽ đóng vai trò là người đi đầu của một cuộc cách mạng mới ở Trung Quốc. Được dẫn dắt bởi cựu Quốc dân quân, chính phủ mới của Trung Quốc đã thông báo rằng nó sẽ là đội tiên phong của một cuộc cách mạng mới về giải phóng chống đế quốc, chắc chắn làm rung chuyển trật tự cũ của châu Á một cách quyết liệt."
 china_events.306.a: "Cách mạng Quốc dân quân đã đến Trung Quốc."

 china_events.307.t: "Trung Quốc dưới sự cai trị của Nhất Quán Đạo"
 china_events.307.d: "Một sự phát triển mạnh mẽ đã xảy ra ở Trung Quốc với việc tuyên bố thống nhất quốc gia dưới sự lãnh đạo tôn giáo [ROOT.GetLeader] và giáo phái Nhất Quán Đạo của những người dân túy thiên niên kỷ. Sau khi đánh bại tất cả các chính phủ cạnh tranh trên chiến trường, nhà lãnh đạo tối cao mới của Trung Quốc đã dành riêng sự thống nhất của mình trong bài phát biểu của mình cho 'Mẹ Thiêng Liêng' cho một đám đông lớn ở [FROM.Capital.GetCapitalVictoryPointName] .\n\nChế độ mới đã tuyên bố sự cô lập của Trung Quốc với các vấn đề thế giới, và nhiều người (cả người nước ngoài và Trung Quốc) dự kiến sẽ rời khỏi đất nước sớm trong sợ hãi. Tương lai gần của quốc gia Trung Quốc trông ảm đạm khi giáo phái bắt đầu quá trình chuyển đổi dân tộc Trung Quốc sang hệ tư tưởng bí truyền của nó."
 china_events.307.a: "Một kỷ nguyên mới cho Trung Quốc đã bắt đầu."

 china_events.308.t: "Tuyên bố của [FROM.GetNameDef]"
 china_events.308.d.KMT: "Với những vùng rộng lớn của Trung Quốc hiện nằm dưới sự kiểm soát của Quân đội Cách mạng Quốc gia, Chủ tịch [ROOT.GetLeader] đã chính thức tuyên bố thành lập Cộng hòa Dân tộc thứ hai của Trung Quốc. Tuyên bố của ông, được thực hiện ngay bên trong Tòa nhà chính của Dinh Tổng thống Nam Kinh, đầy biểu tượng - đó là nơi Tiến sĩ Tôn Trung Sơn được tuyên bố là chủ tịch lâm thời của Cộng hòa Trung Quốc đầu tiên vào năm 1912.\n\nMặc dù những người theo chủ nghĩa dân tộc từ lâu đã có chỗ đứng trong khu vực, nhưng họ đã bị loại bỏ như một cuộc nổi dậy thoáng qua. Chiến thắng cuối cùng của họ trước các đối thủ cạnh tranh đã đảm bảo sự công nhận quốc tế khi cánh tả của Quốc dân đảng nhằm thiết lập một nhà nước xã hội chủ nghĩa độc đảng sẽ loại bỏ sự hỗn loạn và cho phép một xã hội dân sự công bằng và dân chủ hình thành một cách an toàn dưới sự giám hộ của họ."
 china_events.308.d.LCS: "Với những vùng rộng lớn của Trung Quốc hiện đang nằm dưới sự kiểm soát của Hồng quân, sự cai trị xã hội chủ nghĩa đối với Trung Quốc dường như là không thể tránh khỏi. Phần lớn được hỗ trợ bởi các cường quốc xã hội chủ nghĩa nước ngoài, chính phủ [FROM.GetLeader] ban đầu bị bác bỏ vì không thể đứng vững, bị bao vây bởi sự chia rẽ liên tục trong phong trào công đoàn chủ nghĩa nhỏ của Trung Quốc.\n\nBất chấp những thách thức này, họ đã thống nhất thành công hầu hết các quốc gia dưới ngọn cờ của họ, đảm bảo sự công nhận không khoan nhượng của các cường quốc thế giới. Xây dựng trên đống đổ nát âm ỉ của cuộc cách mạng xã hội chủ nghĩa Quốc dân đảng cũ, chính phủ Công đoàn chủ nghĩa này nhằm mục đích xây dựng một trật tự mới ở Trung Quốc trong đống tro tàn của cái cũ, vượt ra ngoài sự tàn phá của thời đại quân phiệt."
 china_events.308.a: "Giấc mơ của Tiến sĩ Tôn cho một Trung Quốc cách mạng vẫn tiếp tục!"
 china_events.308.b: "Cách mạng Trung Quốc đã đến."
 china_events.308.c: "Chúng ta phải ngăn chặn mối đe dọa của Quốc dân đảng!"

 china_events.309.t: "Tuyên bố thành lập Trung Hoa Dân Quốc"
 china_events.309.d: "Tin tức từ Trung Quốc gần đây đã hỗn loạn, vì chiến tranh nhanh chóng để kiểm soát Trung Quốc dường như sắp kết thúc. Cánh hữu của Quốc dân đảng dưới [FROM.GetLeader] đã đạt được uy quyền trên khắp Trung Quốc, và đã tuyên bố thống nhất Cộng hòa Trung Hoa dưới lá cờ của Bầu trời xanh, Mặt trời trắng và Trái đất đỏ hoàn toàn.\n\nTheo lý tưởng của Tiến sĩ Tôn Trung Sơn, Tổng Tư lệnh [FROM.GetLeader] đã hứa với người dân Trung Quốc và thế giới rằng đây là một kỷ nguyên mới đối với Trung Quốc, hứa hẹn sẽ đảo ngược sự sỉ nhục của các cường quốc châu Âu và hướng dẫn đất nước trở nên vĩ đại. Chỉ có thời gian mới cho biết những gì Quốc dân đảng sẽ đạt được."
 china_events.309.a: "Cuối cùng Quốc dân đảng cũng làm được."

 china_events.310.t: "Tuyên bố thành lập Liên tỉnh Trung Hoa"
 china_events.310.d: "Với Trung Quốc phần lớn nằm dưới sự kiểm soát của Quân đội Quốc phòng [FROM.GetLeader], một nước Cộng hòa mới đã được tuyên bố ở Bắc Kinh khi quân đội Liên bang diễu hành qua Quảng trường Thiên An Môn. Các tỉnh thống nhất của Trung Quốc, như thường được gọi ở phương Tây, đã thay thế hoàn toàn chính phủ Trung Quốc được quốc tế công nhận trước đó và với quyền lực của họ được bảo đảm, chỉ còn là vấn đề thời gian trước khi cộng đồng quốc tế công nhận nó.\n\nChính phủ Liên bang dự định tổ chức một Hội nghị Quốc gia \" \" bao gồm các đại biểu từ tất cả các tỉnh được giải phóng để soạn thảo hiến pháp mới và thành lập một chính phủ lâm thời chính thức cho đến khi cuộc bầu cử quốc gia có thể được triệu tập sớm nhất."
 china_events.310.a: "Trần và nước Cộng hòa muôn năm!"
 china_events.310.b: "Họ sẽ thực sự mang lại dân chủ ở Trung Quốc?"

 china_events.311.t: "Trực Lệ vượt mọi trở ngại để thống nhất Trung Quốc"
 china_events.311.d: "Kể từ cuộc viễn chinh phương Bắc, không có cuộc khủng hoảng nào lớn hơn cho Trực hệ so với cuộc đảo chính thành công của những người trung thành Mãn Châu - đã chứng kiến cái chết của Tào Côn và Ngô Bội Phu. Bị đuổi ra khỏi tỉnh Trực hệ sau cuộc đảo chính, tàn dư của Trực hệ chạy trốn đến tỉnh Tứ Xuyên liên kết của họ - nơi họ tuyên bố một chính phủ đối thủ với Chính phủ Mãn Châu.\n\nXuất hiện từ tỉnh đói kém, Trực Lệ đã đánh bại tất cả các chính phủ quốc gia cạnh tranh và trở về quê hương của họ bằng chiến thắng vũ khí. Với mối đe dọa Mãn Châu cuối cùng đã bị đánh bại, [ROOT.GetLeader] đã tuyên bố rằng dưới trướng Trực Lệ Clique, Cộng hòa Trung Quốc sau đây sẽ được hồi sinh. Chỉ có thời gian mới cho biết liệu Trực Lệ sẽ thành công trong trận chiến mới của họ để giành được trái tim của quần chúng hay không."
 china_events.311.a: "Người Trực Lệ đã chỉ ra rằng họ không thể bị đánh bại."

 china_events.313.t: "Tướng Lưu Tương tuyên bố thống nhất đất nước"
 china_events.313.d: "Tỉnh Tứ Xuyên nghèo ở phía tây được biết đến với các phe phái và bè phái quân phiệt cạnh tranh, xé tỉnh ra trong một cuộc nội chiến trước khi nạn đói chết người tàn phá nó. Trong thời kỳ hỗn loạn của chính trị Tứ Xuyên này, tướng Lưu Tường của Cục Tăng tốc đã xoay sở để vượt qua các đối thủ của mình và thống nhất tỉnh của mình dưới sự lãnh đạo của ông.\n\nTuyên bố sự lãnh đạo của Chính phủ Trung ương, Tướng quân đã đưa tỉnh Tứ Xuyên vào con đường chiến tranh, với quân đội tỉnh tiến hành chiến tranh và đánh bại các chính phủ cạnh tranh đối thủ. Với những chiến thắng gần đây và nghiền nát những người bất đồng chính kiến, ông đã tuyên bố mình là Chủ tịch của một nước Cộng hòa Trung Hoa hồi sinh. Chỉ có thời gian mới cho biết chế độ và di sản của Tướng quân sẽ kéo dài hay không."
 china_events.313.a: "Hội Tứ Xuyên đã đáp lời kêu gọi thống nhất!"

 china_events.314.t: "[FROM.GetOldName] hoàn thành Thống nhất Trung Quốc"
 china_events.314.d: "Trong thời đại chiến tranh và xung đột liên tục trong bối cảnh chính trị luôn thay đổi, không có gì đáng ngạc nhiên khi thấy các nhóm nhỏ hơn và các tỉnh vượt ra ngoài biên giới của họ để tìm kiếm quyền lực và vinh quang. Đáng ngạc nhiên cho nhiều người, [FROM.GetOldNameDef] đã nổi lên khỏi tỉnh của họ để đánh bại các chính phủ cạnh tranh đối thủ và đã tuyên bố Cộng hòa Trung Quốc từ thủ đô [FROM.Capital.GetCapitalVictoryPointName] của họ.\n\nĐất nước Trung Quốc từ lâu bị chia rẽ, cuối cùng đã được thống nhất một lần nữa dưới sự lãnh đạo của [FROM.GetLeader]. Chỉ có thời gian mới cho biết liệu Trung Quốc sẽ bắt kịp với phần còn lại của thế giới hay không, nhưng hiện tại, người dân Trung Quốc cuối cùng cũng có thể nghỉ ngơi, biết rằng Thời kỳ quân phiệt hỗn loạn đã kết thúc."
 china_events.314.a: "Người Trung Quốc cuối cùng đã đứng lên!"

 china_events.315.t: "Thống nhất dưới quyền Nguyên soái Liên tỉnh"
 china_events.315.d: "Ai có thể nghĩ được rằng vết nhơ đạo tặc của Liên minh Tám tỉnh sẽ vượt qua được cơn bão? Với sự sụp đổ của Liên minh năm 1936 đã tàn phá cấu trúc mục nát của nó không thể phủ nhận chỉ bằng một cú nhào lộn, rất ít người tin rằng nó sẽ lại đạt đến đỉnh cao quyền lực mà nó đã đạt được vào năm 1929. Thế nhưng ở đây nó đã vượt xa Liên minh cũ, vượt xa những kỳ vọng.\n\nNó sẽ không được Tôn Truyền Phương rằng sẽ đoàn kết các quốc gia dưới Trực Lệ Clique Nam, nhưng của Qi Xieyuan. Một cấp dưới đáng ghét của Smiling Tiger, ông gây tranh cãi mất triều đại sau sự bất lực của cựu. Theo đuổi một chính sách mở cửa, nó sẽ xuất hiện rằng người Đức đã kiếm được một đồng minh trước đây ở phương Đông. Mặc dù nhiều người sợ một sự sụp đổ League trong tương lai."
 china_events.315.a: "Triều đại của một tên khốn, xuất khẩu khắp cả nước."

 china_events.316.t: "Chiến thắng của tập đoàn Trực Lệ"
 china_events.316.d: "Mặc dù có sự cai trị và kiểm soát của họ đối với Trung Quốc đầy đủ thách thức trong cuộc viễn chinh phương Bắc, nhưng sự phục hồi Xuân Thông sau đó đã khôi phục lại triều đại nhà Thanh và chứng kiến sự kiểm soát miền Bắc được củng cố bởi Ngô Bội Phu, Cao Kun và Trực Lệ Clique.\n\nMặc dù tình trạng bất ổn trong những năm qua với sự sụp đổ kinh tế của Thứ Hai Đen và Chiến tranh Liên minh, tuy nhiên, Trực Lệ đã giữ vững qua cơn bão. Trong khi các quân phiệt khác cố gắng tách khỏi sự kiểm soát của Trực Lệ, tuy nhiên họ đã đánh bại tất cả các chính phủ cạnh tranh và thống nhất đất nước một lần nữa. Trong một bài phát biểu vinh quang tại [FROM.Capital.GetCapitalVictoryPointName], Ngô Bội Phu đã tuyên bố rằng Trực Lệ sẽ tìm cách hiện đại hóa Trung Quốc và khẳng định ảnh hưởng của mình trên thế giới, không bị nước ngoài thống trị."
 china_events.316.a: "Ngô Bội Phu đã vượt qua chính mình!"

 china_events.340.t: "Chủ tịch Uông giữ vững quyền lực"
 china_events.340.d: "Mặc dù lãnh đạo Quốc dân đảng từ lưu vong và gần như hủy diệt đến những thành công vang dội của quốc gia với việc hoàn thành Cuộc viễn chinh phương Bắc thứ hai, sự cai trị của Chủ tịch [CHI.GetLeader] dường như tan vỡ với sự phản đối ngày càng tăng của phe phái từ Ủy ban Hành động Lâm thời của Quốc dân đảng. Mặc dù bị tấn công từ mọi phía, tuy nhiên, dường như Chủ tịch đã thực sự củng cố quyền kiểm soát và cai trị Đảng của mình, nghiền nát phe đối lập một cách hiệu quả.\n\nBây giờ, lần đầu tiên trong nhiều thập kỷ, hòa bình cuối cùng đã trở lại Trung Quốc và Chủ tịch Wang sẽ tìm cách hiện đại hóa và hồi sinh đất nước Trung Quốc để thực hiện các nguyên tắc được vạch ra bởi cố vấn của ông, cố Tiến sĩ Tôn Trung Sơn, trong nhiều năm tới."
 china_events.340.a: "Uông Tinh Vệ thực sự là người thừa kế cuộc cách mạng của Tiến sĩ Sun."

 china_events.341.t: "Ủy ban Hành động Lâm thời của Tống nắm quyền lãnh đạo Quốc dân đảng"
 china_events.341.d: "Trong khi Quốc dân đảng được lãnh đạo trên danh nghĩa bởi Vương Tinh Vệ trong thời gian lưu vong của đảng sau Cuộc viễn chinh phương Bắc, những người ở lại Trung Quốc đã tự tổ chức thành chính phủ Khủng hoảng MinGan tự trị.Đây là nền tảng mà Ủy ban Hành động Lâm thời (PAC) của Quốc dân đảng được thành lập, và trong Tuyên bố năm 1932 của họ với Nhân dân Cách mạng ở Trung Quốc và Thế giới, họ tuyên bố một nền tảng dân túy, xã hội chủ nghĩa dường như gần gũi hơn với nhân dân.\n\nNhiều năm sau, Chủ tịch [CHI.GetLeader] đã tuyên bố chuyển đổi PAC thành một Ủy ban Cách mạng mới để lãnh đạo quần chúng hướng tới xóa bỏ giai cấp và hướng tới một tương lai cách mạng mới cho nông dân và công nhân Trung Quốc."
 china_events.341.a: "Nhân dân đã đứng lên!"

 china_events.342.t: "Phái Cải tổ nắm quyền trong Quốc dân đảng"
 china_events.342.d: "Trong khi Quốc dân đảng thành công trong việc thống nhất đất nước dưới lá cờ đảng của họ, Đảng rơi vào nội chiến sau vụ ám sát và cái chết của cựu Chủ tịch, Uông Tinh Vệ. Đảng sau đó tan rã thành nhiều phe phái khi đất nước một lần nữa sụp đổ vào một cuộc nội chiến lớn khác.\n\nDường như từ chính phủ của ông ở Bắc Bình, Chủ tịch Zeng Zhongming và Thủ tướng Chen Gongbo, cùng với Hiệp hội đồng chí tái tổ chức, đã tuyên bố chiến thắng chống lại tất cả các phe phái khác. Bây giờ Phe Tái tổ chức duy trì toàn quyền kiểm soát cả đất nước và Đảng, các nhà quan sát nước ngoài tin rằng Trung Quốc sẽ hướng tới một tương lai xã hội chủ nghĩa độc tài, được thúc đẩy bởi một số nhà xã hội chủ nghĩa cấp tiến nhất của Trung Quốc."
 china_events.342.a: "Một Trung Quốc mới đã ra đời..."

 china_events.343.t: "Trung Hoa Phục Hưng xã tuyên bố chiến thắng"
 china_events.343.d: "Trong khi Quốc dân đảng đã thành công trong việc thống nhất đất nước dưới lá cờ đảng của họ, Đảng rơi vào nội chiến sau vụ ám sát và cái chết của cựu Chủ tịch, Uông Tinh Vệ. Khi các lực lượng phe phái tranh chấp bắt đầu chiến đấu với nhau, Hội Hồi sinh Trung Quốc cấp tiến đã tìm cách chiếm quyền lực và bảo vệ đất nước trong tình trạng khẩn cấp.\n\nTrong một bài phát biểu lớn từ [FROM.Capital.GetCapitalVictoryPointName] , Tổng tư lệnh Hu Zongnan đã tuyên bố rằng tất cả kẻ thù của Trung Quốc, cả trong và ngoài nước, sẽ bị nghiền nát dưới một hướng đi mới của cuộc cách mạng quốc gia. CRS' nói về một cuộc cách mạng toàn trị lấy cảm hứng từ những người như Savinkov, Mussolini, và Mosley chắc chắn sẽ làm mờ một ánh sáng trên bất kỳ cơ hội dân chủ ở Trung Quốc."
 china_events.343.a: "Bóng tối đã bao trùm cuộc Cách mạng Quốc dân."

 china_events.344.t: "Thủ tướng Hồ Hán Dân vượt qua sóng gió"
 china_events.344.d: "Sau khi lãnh đạo Ủy ban Chấp hành Trung ương Quốc dân đảng lưu vong của mình tại Moscow, cơ hội [GXC.GetLeader] trở về đất Trung Quốc là mỏng. Tuy nhiên, Mặt trời Trắng trên bầu trời chiếu sáng rực rỡ trên đệ tử hiếu học nhất của Tiến sĩ Sun, vì nhà cách mạng đã lãnh đạo đảng lưu vong trước đó đã đạt được những thành công rực rỡ trong Cuộc thám hiểm phương Bắc thứ hai, và vượt qua những nỗ lực của Tân Quảng Tây phù phiếm để loại bỏ anh ta khỏi lãnh đạo quốc gia, đảm bảo sự thống trị của Hội trưởng lão trong đảng.\n\nBây giờ, với chương trình nghị sự cụ thể của mình trong sáu năm Tutelage, Thủ tướng và ông \" Old Right \" tìm cách làm theo ba nguyên tắc của người dân trong giải thích chính thống nhất của họ, để đảm bảo rằng giấc mơ của Tiến sĩ Tôn Trung Sơn trở thành sự thật."
 china_events.344.a: "Đường lối chính thống đã chiến thắng!"

 china_events.345.t: "Chế độ đồng trị cách mạng mới tại Quảng Đông"
 china_events.345.d: "Trong khi Thủ tướng [GXC.GetLeader] dường như kiên quyết và an toàn trong vị trí của mình như là người quản lý của cuộc Cách mạng Quốc gia, nó sẽ xuất hiện ông không phải là không thể sai lầm như các nhà quan sát bên ngoài sẽ có cổ phần. Sau một thời gian ngắn bị lật đổ bởi Tân Quảng Tây Clique Lý Tông Nhân trong một nắm bắt quyền lực trắng trợn, đệ tử của Tiến sĩ Sun đã được trả lại cho lãnh đạo quốc gia sau những nỗ lực của người ủng hộ kiên quyết của ông, Thống đốc Quảng Đông Chen Jitang.\n\nVới một chế độ quân phiệt cách mạng mới không thoải mái được thiết lập giữa Thủ tướng nguyên tắc và Quân phiệt chuyên chế, tất cả sự phản đối kẻ thù của Tân Quan Đông chắc chắn sẽ bị đánh bại, với Cách mạng Quốc gia chuyển sang chế độ độc tài triệt để hơn khi phong trào cách mạng một thời gầm rú biến thành than hồng."
 china_events.345.a: "Cách mạng Quốc gia gặp khó khăn."

 china_events.346.t: "Tân Quế hệ chấn hưng Trung Quốc"
 china_events.346.d: "Tỉnh Quảng Tây từ lâu đã bị các phóng viên Trung Quốc và bên ngoài bác bỏ là một vùng đất lạc hậu nghèo khó, cướp bóc ngay cả theo tiêu chuẩn của Trung Quốc thời quân phiệt. Vì vậy, nó đã gây ngạc nhiên lớn cho nhiều người rằng người chiến thắng cuối cùng trong các cuộc chiến thống nhất của Trung Quốc không ai khác hơn tướng Lý Tông Nhân, người đã đánh bại các đối thủ trong và ngoài Quốc dân đảng để tìm đường lên nắm quyền.\n\nTướng ngồi ở vị trí lãnh đạo của một tỉnh quân sự nặng nề, những người theo ông tự hào gọi là Cái nôi cách mạng \" \" , và sử dụng quân đội công dân mạnh mẽ và có kỷ luật tốt, ông đã đánh bại tất cả những ai phản đối ông. Bây giờ, đứng giữa sự phân chia giữa chế độ chuyên quyền, chủ nghĩa tự do và Ba nguyên tắc, Tổng thống Li định hình tương lai của Trung Quốc."
 china_events.346.a: "Tái thiết Quảng Tây, hồi sinh Trung Quốc."

 china_events.347.t: "Phái Tây Sơn tái xuất"
 china_events.347.d: "Một phe ít được biết đến trong cánh hữu của Quốc dân đảng, ít ai mong đợi cựu chiến binh \" Old Right \" thành viên của Phái Tây Sơn đã bước vào giai đoạn nổi bật quốc gia. Đã hình thành hoàn toàn để phản đối và phản đối các khía cạnh xã hội chủ nghĩa của Tái tổ chức 1924 theo đuổi của Tiến sĩ Tôn Trung Sơn, các nhà lãnh đạo của bè phái đã là thành viên của Quốc dân đảng kể từ thời Song Jiaoren, do nhiều mối quan hệ cá nhân với nhân vật Quốc dân đảng quá cố.\n\nSau khi nắm lấy cơ hội của mình trong cuộc biến động sau khi kết thúc Cuộc viễn chinh phương Bắc lần thứ hai, Hội Tây Sơn tìm cách xóa bỏ thiệt hại do sự thay đổi xã hội chủ nghĩa của Quốc dân đảng, tìm kiếm một Trung Quốc thực sự lập hiến."
 china_events.347.a: "Những cựu binh lại bước lên vũ đài."

 china_events.348.t: "Phái Tái thiết giải phóng Trung Quốc"
 china_events.348.d: "Tiến sĩ Tôn Trung Sơn đã để lại một di sản được ký séc, một nhà lãnh đạo cộng hòa đáng chú ý trong Cách mạng Tân Hợi năm 1911 và là người sáng lập Quốc dân đảng lớn nhưng gây tranh cãi, người đã chết vì ung thư gan vào năm 1925 trong bối cảnh các cuộc đàm phán thống nhất thất bại giữa chính phủ miền Nam của ông ở Quảng Châu và các nhân vật miền Bắc ở Bắc Kinh. Đôi khi được gọi là Cha đẻ của Cộng hòa, ông đã để lại một con trai, Sun Fo, người ban đầu bị vắt kiệt quyền lực từ đảng của cha mình.\n\nVận mệnh thay đổi đã chứng kiến Sun trẻ trở lại ảnh hưởng với sự trợ giúp của một liên minh các nhà kỹ trị ở nước ngoài và giáo dục phương Tây, những người đã giúp ông giành chiến thắng trong một cuộc bầu cử nội bộ lớn chạy trên nền tảng tự do. Là Tổng thống mới nhậm chức, ông tìm cách hoàn thành di sản của cha mình."
 china_events.348.a: "Đúng là cha nào con nấy."

 china_events.349.t: "Cuộc đảo chính của Quân đoàn 4 tại Trung Quốc"
 china_events.349.d: "Thường được xem với sự khinh miệt và nghi ngờ trong Quốc dân đảng, Chen Mingshu đã gây sốc cho toàn bộ quốc gia Trung Quốc và các nhà quan sát nước ngoài bằng cách nổi lên chiến thắng bằng cách lật đổ chính phủ xã hội chủ nghĩa cũ có trụ sở tại Nam Kinh. Chen Mingshu và bè lũ cấp dưới của ông từ Quân đội 4 của NRA tiếp tục tuyên bố là hậu duệ của Quốc dân đảng, cam kết thành lập một chính phủ cách mạng của những người sản xuất và đạt được sự thịnh vượng chung cho tất cả công dân của mình. Mặc dù được coi là ban đầu liên kết với cánh tả của Quốc dân đảng, nhiều người tự hỏi liệu PPP sẽ đi theo di sản của Wang và Song hay đi theo con đường riêng của họ. Chỉ Chen Mingshu sẽ biết tương lai đòi hỏi gì."
 china_events.349.a: "Quốc dân đảng tiến hóa."

 china_events.350.t: "Phe nông dân Trung Quốc lật đổ Quốc dân đảng"
 china_events.350.d: "Trong một màn hình gây sốc của các sự kiện, phong trào chủ yếu dựa trên nông thôn của nông dân Trung Quốc đã lật đổ chính phủ Quốc dân đảng ở Nam Kinh, và bây giờ đã tuyên bố một chính phủ cách mạng mới - dành riêng cho việc xóa bỏ các yếu tố phong kiến trong xã hội Trung Quốc. Như hàng ngàn người ở Trung Quốc, đặc biệt là chủ nhà và những người giàu có dự kiến sẽ chạy trốn khỏi đất nước; chỉ có một người sẽ nói những gì sẽ đến với sự đi lên của nhà lãnh đạo cách mạng mới của Trung Quốc: Peng Pai; nhiều người trong số họ coi là một vị thần gần gũi trong cuộc đấu tranh vì sự bình đẳng cho quần chúng Trung Quốc."
 china_events.350.a: "Cuộc Cách mạng Nhân dân cuối cùng đã đến."

 china_events.3500.t: "Cuộc cách mạng Trung Quốc mới"
 china_events.3500.d: "Rất ít người tin rằng Cách mạng Quốc dân đảng không chỉ quay trở lại mà còn chiến thắng ở Trung Quốc; thậm chí còn ít người tin rằng nó sẽ lên đến đỉnh điểm trong sự hủy diệt được phê chuẩn của Ủy ban Trung ương của chính nó. Từ tro tàn, một cuộc cách mạng mới đã được tái sinh; tất cả dưới sự lãnh đạo cách mạng quốc gia táo bạo nhất gần đây của Trung Quốc: Chủ tịch Đàm Bình Sơn.\n\nMột thành viên sáng lập của Ủy ban hành động tạm thời, và là một thành viên đầu tiên của Đảng Công đoàn Trung Quốc, đường lối xã hội chủ nghĩa trong nước của ông Tân đã tự thấy mình trên vách đá của rào cản lớn nhất của nó: \" cuộc cách mạng xã hội chủ nghĩa bản địa của Trung Quốc sẽ theo đuổi hình thức nào? \""
 china_events.3500.a: "Cuộc cách mạng sẽ diễn ra ở đâu?"

 china_events.351.t: "Phe Hoàng Phố trở lại"
 china_events.351.d: "Với cái chết của Tổng Tư lệnh Tưởng Giới Thạch vào lúc chạng vạng của cuộc viễn chinh phương Bắc, nhiều người tin rằng \" Hoàng Phố Clique \" của ông, những người có nguồn gốc từ gia sư của ông tại Học viện Quân sự, sẽ tham gia cùng ông trong giá treo cổ hoặc chạy trốn đến nơi khác đến các phe phái khác của Quốc dân đảng. Tuy nhiên, không rõ ràng mang chiếc áo choàng của di sản của mình, Hoàng Phố Clique của Tổng Tư lệnh He Yingqin đã thống trị cả Quân đội Cách mạng Quốc gia và quốc gia.\n\nĐoàn tụ đất nước thay mặt cho Quốc dân đảng, Tổng Tư lệnh Ông báo trước một kỷ nguyên mới của \" New Right \" của Đảng. Đè bẹp một liên minh khó sử dụng từ những người cấp tiến đến các nhà kỹ trị, Tổng Tư lệnh có nhiều lựa chọn để theo đuổi trong việc chỉ đạo Quốc gia Trung Quốc."
 china_events.351.a: "Mọi con mắt đều đổ dồn vào Tổng tư lệnh."

 china_events.352.t: "Sự trỗi dậy của phe Thổ Mộc"
 china_events.352.d_rkt: "Nhiều nhân vật trong lịch sử Trung Quốc gần đây đã cố gắng mô phỏng tiềm năng của cố Tổng Tư lệnh Tưởng Giới Thạch. Với giáo phái của ông về Quân đội Cách mạng Quốc gia còn sống và tốt, có vẻ như vai trò của họ trong việc thống nhất đất nước dưới thời Quốc dân đảng vẫn chưa kết thúc. Được quản lý bởi Tổng Tư lệnh He Yingqin, có vẻ như sự phụ thuộc ngày càng tăng của ông vào \" Little Tổng tư lệnh \" Chen Cheng đã dẫn đến sự lắng đọng tương đối yên tĩnh của chính ông.\n\nBị phản đối bởi người tổ chức lại theo định hướng nông dân và firebrand trẻ, tương lai của quốc gia Trung Quốc chắc chắn sẽ là một nền dân chủ nhân từ, tập trung và cách mạng. Một quản trị viên xuất sắc, Chen Cheng tìm cách xóa bỏ hàng thiên niên kỷ của chu kỳ chiến tranh và hòa bình của Trung Quốc."
 china_events.352.d_lkt: "Trong số các hội trường chiết trung của tình hình chính trị bao giờ xoắn ốc của Quốc dân đảng, ít ai tin rằng Ủy ban Trung ương sẽ thấy mình bị lật đổ. Ít người vẫn tin rằng nó sẽ được thực hiện bởi một người ngoài cuộc thực tế của công việc riêng của mình. Thủ tướng được bảo trợ nhiều nhất của Napoléon Đặng Diêm Đan, \" Little Tổng tư lệnh \" Chen Cheng đã không chỉ lật đổ Ủy ban Trung ương Đảng, mà còn thiết lập Chế độ Quốc dân đảng của riêng mình.\n\nLà một người trẻ tuổi có tinh thần hiếu chiến và theo định hướng nông dân, tái tổ chức trung ương, trong một mạch tương tự như cố vấn của mình, Chen Cheng tìm cách xóa bỏ hàng thiên niên kỷ của chu kỳ chiến tranh và hòa bình của Trung Quốc."
 china_events.352.a: "Găng tay nhung của Hoàng Phố."

 china_events.353.t: "Cuộc cách mạng Áo Lam"
 china_events.353.d: "Là một giáo phái thường bị bỏ qua và không thể gạt bỏ của Hội Hoàng Phố của Quân đội Cách mạng Quốc gia, có vẻ như những nghi ngại như vậy là do đánh giá kém về khả năng của Hội Áo Xanh. Bí mật, cấp tiến và nguy hiểm, Hội Áo Xanh đã trở nên cực kỳ phổ biến để đáp lại sự thất bại của Quốc dân đảng trong Thế kỷ 20. Tham mưu của Teng Jie và Liu Jianqun, mối quan hệ chặt chẽ của họ với Tổng tư lệnh He cuối cùng đã mở ra sự hủy hoại của ông.\n\nBây giờ ở phần đầu của cuộc Cách mạng Quốc gia Trung Quốc, các báo cáo đã nổi lên rằng một cuộc thanh trừng hàng loạt của \" đảng cũ \" đã diễn ra. Đã có nhiều người nhìn vào [FROM.Capital.GetCapitalVictoryPointName] với nỗi sợ hãi, khi Đảng Quốc dân đảng bị đẩy xuống một con đường tối tăm và đẫm máu."
 china_events.353.a: "Mặt trời trắng đã lụi tắt."

 china_events.354.t: "Các nhà cách mạng Chiết Giang chiến thắng"
 china_events.354.d: "Một kỳ quặc tò mò nhất đã xuất hiện từ Cách mạng Quốc gia của Quốc dân đảng và tư tưởng Ba Nguyên tắc Nhân dân sẽ là của một Dai Jitao. Một nhà văn chiết trung và bí truyền, ông được nhiều người coi là Tông đồ \" rất riêng của Trung Quốc của Cách mạng Văn hóa \" . Tìm kiếm sự trẻ hóa quốc gia, ông là tổ tiên của xương sống ý thức hệ chính của \" New Right \" của Quốc dân đảng.\n\nTham gia lực lượng với Hội Câu lạc bộ Trung ương do anh em nhà Trần vô đạo đức, Lý Phú và Quách Phúc, Đới Kiêu và Hội CC đã thành công trong việc khẳng định sự thống trị dân sự đối với quân phiệt Quốc dân đảng.Bây giờ đứng đầu quốc gia, nhóm chiết trung các nhà kỹ trị và lý tưởng này dường như đã có sự dè dặt với nhau, vì Trần Lý Phú đã bỏ rơi theo lý thuyết của Đới."
 china_events.354.a: "Sự cứu rỗi thông qua Tái sinh Tinh thần."

 china_events.355.t: "Cuộc Duy tân Minh Trị của Trung Quốc"
 china_events.355.d: "Trong một sự ngạc nhiên tàn khốc đối với nhiều người, đặc biệt là những người trong nội bộ Quốc dân đảng, một phe bị ruồng bỏ nhỏ nhạo báng của Đảng đã tìm cách bảo đảm chiến thắng từ nanh vuốt của cơ sở! Zhang Qun, tập hợp thành công cánh của ông về Tân Hữu được gọi là Khoa học Chính trị Clique, đã tìm cách đoàn kết dân tộc thay mặt cho Quốc dân đảng. Gián điệp \" Tư tưởng \" Dân chủ mới trong Nhà nước Đảng có vẻ độc tài, dường như chính nền tảng của chế độ Tổng thống là một trong những tranh cãi trong Đảng.\n\nRất ít người biết nơi Chủ tịch Zhang Qun sẽ chỉ đạo đất nước. Được bao quanh bởi một nhóm cấp trên của những người tự do, doanh nhân và người nổi tiếng, tất cả mọi con mắt đều hướng về \" Trung Quốc Genrō \" mới được đặt tên."
 china_events.355.a: "Một quốc gia được xây dựng trên những cái bắt tay."

 china_events.356.t: "Người chiến sĩ trung thành nhất của cách mạng cầm quyền"
 china_events.356.d: "Tin tức đáng ngạc nhiên đã nổi lên từ Trung Quốc như gần đây sau khi thống nhất đất nước. Trong khi nhiều người sẽ không tin rằng Quốc dân đảng thậm chí đã thống nhất đất nước ở nơi đầu tiên, ít người tin rằng Tướng Zhu Peide sẽ là người thực hiện lời hứa đó. Một người lính cách mạng xuyên suốt, sự nghiệp lịch sử của Chu đã chứng kiến nhiều thăng trầm. Tập hợp hỗn hợp của ông gồm những người bảo trợ cánh hữu cũ, cấp dưới cánh hữu mới và cánh tả, Chủ tịch Zhu và Thủ tướng Li Genyuan có một thời gian khó khăn phía trước của mình.\n\nNhững người trong nội bộ thậm chí còn báo cáo rằng Thủ tướng đầy tham vọng và cấp cao đã bắt đầu lên kế hoạch và âm mưu chống lại Tổng thống, tập hợp Hội Khoa học Chính trị để đưa di sản của Bắc Dương về phía trước."
 china_events.356.a: "Không phải anh hùng, chỉ là một người lính bình thường."

 china_events.357.t: "Một Thermidor tại Vân Nam?"
 china_events.357.d: "Với cánh Tả của Quốc dân đảng bị chi phối bởi mưu đồ của Vương Tinh Vệ, Tống Khánh Lĩnh và Đặng Diên Đà, nhiều cán bộ xã hội chủ nghĩa ngoại vi có rất ít không gian để điều động trong chiến trường chính trị.Bị ép buộc vào Hội đồng chí cách mạng, Đảng Công đảng Trung Quốc hoặc Ủy ban hành động tạm thời, nhiều người trở nên phẫn nộ với Ủy ban Trung ương.\n\nTuy nhiên nó sẽ xuất hiện rằng Nguyên soái Zhu De đã đặt ra để chứng minh Đảng sai! Hợp tác với những người như Trương Bojun, cuộc cách mạng Trung Quốc đã trở thành một không còn bị chi phối bởi careerists và quan chức, nhưng được xây dựng dựa trên các nguyên tắc dân chủ và xã hội chủ nghĩa, bất cứ hình thức nào họ có thể mất."
 china_events.357.a: "Một đất nước của nông dân và công nhân!"

 china_events.358.t: "Phe liên bang Quảng Đông thống nhất Trung Quốc"
 china_events.358.d: "Bị vứt vào thùng rác của lịch sử, rất ít người tin rằng phong trào Liên bang Tây Nam sẽ thống nhất đất nước Trung Quốc sau tình trạng khó khăn của họ trong những năm 1920. Tuy nhiên, chống lại tất cả các quy ước, những người theo chủ nghĩa liên bang dưới thời Trần Quýnh Minh đã thành công trong mục tiêu của họ. Đỉnh cao cuối cùng của hệ tư tưởng trí tuệ liên bang thập niên 1920, đó không phải là đàm phán, mà là sự khuất phục đã giáng đòn cuối cùng.\n\nGiữ gìn thể chế hiến pháp cấp tỉnh, giải ngũ các lực lượng quân sự rộng lớn và với hy vọng hồi sinh thí nghiệm dân chủ Trung Quốc, nhiều con mắt hướng về Tổng thống [UPC.GetLeader] để hoàn thành sứ mệnh lịch sử này."
 china_events.358.a: "Xin chúc mừng Tổng thống!"

 china_events.359.t: "Trần Quýnh Minh thống nhất Trung Quốc"
 china_events.359.d: "Bị vứt vào thùng rác của lịch sử, rất ít người tin rằng phong trào Liên bang Tây Nam sẽ thống nhất đất nước Trung Quốc sau tình trạng khó khăn của họ trong những năm 1920. Tuy nhiên, chống lại tất cả các quy ước, những người theo chủ nghĩa liên bang dưới thời Trần Quýnh Minh đã thành công trong mục tiêu của họ. Đỉnh cao cuối cùng của hệ tư tưởng trí tuệ liên bang thập niên 1920, đó không phải là đàm phán, mà là sự khuất phục đã giáng đòn cuối cùng.\n\nMặc dù căng thẳng đã bắt đầu tăng lên trong chính phủ trẻ. Người dân đã phát triển một cảm giác bất ổn chính trị, phe đối lập đã bắt đầu chiến dịch của họ để yêu cầu dân chủ hóa, và quân đội ngày càng nổi loạn khi có dấu hiệu bất đồng chính kiến. Rõ ràng, Chen phải làm việc nhanh chóng để cứu vãn phong trào."
 china_events.359.a: "Mọi con mắt đều đổ dồn vào Chen."

 china_events.360.t: "Phe liên bang Vân Nam thống nhất Trung Quốc"
 china_events.360.d: "Nhiều thập kỷ trước, Vân Nam là tâm chấn của Chiến tranh Hộ quốc và đã tham gia vào những tham vọng độc tài của Viên Thế Khải và Chính phủ Bắc Dương tham nhũng của ông. Mặc dù bị đánh bại và buộc phải cô lập bằng các sự kiện chính trị tiếp theo, những người Cộng hòa của Vân Nam đã lật ngược tình thế và cuối cùng đã thống nhất Trung Quốc dưới một hệ thống liên bang.\n\nNhững ngày tới dự kiến sẽ là một thách thức đối với [YUN.GetLeader] và các đồng minh của ông, khi họ tìm cách thực hiện dân chủ liên bang ở Trung Quốc. Các câu hỏi xoay quanh các quy định của hiến pháp mới và liệu chính phủ mới có tôn trọng nó hay không. Nhưng bây giờ, Trung Quốc thống nhất và quốc gia kỷ niệm ngày kết thúc chiến đấu."
 china_events.360.a: "Từ Côn Minh đến Bắc Kinh"

 china_events.361.t: "Quân phiệt Quảng Tây thống nhất Trung Quốc"
 china_events.361.d: "Từ lâu đã được coi là thứ yếu so với tỉnh Quảng Đông, và với ý định dường như vẫn nằm trong túi khu vực Tây Nam của họ, rất ít người tin rằng những người thống nhất Trung Quốc sẽ là của phe Quảng Tây cũ. Một khi được lãnh đạo bởi vị Phó vương khét tiếng của Liêu Giang, Lu Rongting, phe này đã cố gắng tiến xa hơn các tỉnh nhà của họ, tấn công sâu vào trung tâm của miền Bắc.\n\nVới các cuộc tranh luận không ngừng của chính phủ liên quan đến chủ nghĩa hợp hiến, hiện đại hóa và tương lai của Trung Quốc, nhiều người tin rằng phe cánh quân phiệt Quảng Tây chỉ còn một trận đấu cuối cùng trong các lá bài, được giải quyết bằng hòa bình hoặc bằng vũ lực."
 china_events.361.a: "Nền tảng của họ đã bắt đầu sụp đổ."

 china_events.3610.t: "Quân phiệt Quảng Tây thân Đức thống nhất Trung Quốc"
 china_events.3610.d: "Từ lâu đã được coi là thứ yếu so với tỉnh Quảng Đông chị em của nó, và với ý định dường như vẫn nằm trong túi khu vực Tây Nam của họ, rất ít người tin rằng những người thống nhất Trung Quốc sẽ là của Quân đội Quảng Tây cũ. Một khi được lãnh đạo bởi Lu Rongting, quân đội đã cố gắng tiến xa hơn các tỉnh nhà của họ, tấn công sâu vào trung tâm của miền Bắc.\n\nKết hợp thành công người kế nhiệm được lựa chọn cẩn thận của Lỗ, Thẩm Hồng Ưng cuối cùng đã đạt được sự thăng tiến lên tầm cao lớn nhất của quốc gia; mặc dù đã già và suy yếu, nhiều người tin rằng thời gian của Nguyên soái Thẩm còn hạn chế, và các đồng minh của ông đang chuẩn bị để tự mình chiếm lấy văn phòng cao cấp."
 china_events.3610.a: "Sức khỏe yếu ớt của Cảnh sát trưởng Shen không làm dấy lên sự tự tin"

 china_events.362.t: "Giới thương nhân Quảng Đông thống nhất Trung Quốc"
 china_events.362.d: "Trong tất cả những gì đã nổi lên từ cuộc nổi dậy của Quân đoàn Thương mại Quảng Châu năm 1924, rất ít người có thể mong đợi rằng một trong những người hưởng lợi lớn nhất của nó sẽ là kẻ thua cuộc lớn nhất, Chen Lianbo. Từng chỉ là người đứng đầu Quân đoàn Thương mại Quảng Châu, cùng với việc là một trong những người giàu nhất trong cả nước, Chen đã tăng vọt lên Thị trưởng Quảng Châu vào năm 1927, và sau đó vươn lên tầm cao hơn: thống nhất đất nước.\n\nTuy nhiên, tham vọng bao giờ cao cả của Chen cho một nước Cộng hòa Trung Quốc thương mại thống trị không phải là hoàn toàn không tranh cãi. Thậm chí bây giờ, các lực lượng khác nhau báo hiệu sự trở lại nền dân chủ thực sự đã tăng lên đối lập với các thương gia Plutocrats, dẫn đầu phần lớn bởi Clique Khoa học Chính trị."
 china_events.362.a: "Và ông nghĩ mình giống như \" Washington \"?"

 china_events.363.t: "Quân phiệt Vân Nam thống nhất Trung Quốc"
 china_events.363.d: "Một lần nữa thực hiện một trò chơi lớn cho quyền lực, ít ai mong đợi nỗ lực thống nhất gần đây nhất của Vân Nam sẽ mang lại kết quả rõ ràng, vì những nỗ lực trước đó thường dừng lại ngay cả khi đến Quảng Đông, thủ đô phía Nam khu vực. Tuy nhiên, trước sự ngạc nhiên của mọi người, các quân phiệt Vân Nam đã vượt qua cả Bắc Kinh.\n\nĐuôi với một quốc gia bị thương bị tước đoạt nhiều nguồn lực, Tổng thống-Marshal [YUN.GetLeader] đã hồi phục về khái niệm cô lập tỉnh, làm chệch hướng cấp trên của mình và thống nhất quốc gia bằng chính tay mình. Và bây giờ, nhiệm vụ khó khăn của việc tái thiết nằm trong tay Tổng thống mới và bè phái của ông."
 china_events.363.a: "Họ đã làm những gì Thái Ngạc và Đường Kế Nghiêu không thể..."

 china_events.364.t: "Phe dân chủ Tứ Xuyên thống nhất Trung Quốc"
 china_events.364.d: "Trong khi nhiều người tin rằng Phong trào Liên bang đã tan rã vào cuối năm 1936, dường như phán quyết đó là quá sớm. Từ tỉnh Tứ Xuyên phía tây nam, Tổng thống Trương Lan và các đồng minh của ông đã có thể không chỉ chiếm lại Vân Nam và Quảng Đông, mà còn giành được quyền bá chủ trên Đồng bằng Trung tâm và Đông Bắc.\n\nPhát biểu trước một đám đông lớn ở Quảng trường Thiên An Môn, Zhang Lan đã tuyên bố rằng Cộng hòa Liên bang mới sẽ chấm dứt Thế kỷ sỉ nhục và thiết lập sự cai trị dân chủ trên khắp Vương quốc Trung tâm. Mặc dù bị tàn phá từ cuộc chiến chống Nhật Bản và nhiều thập kỷ mất đoàn kết, dường như triển vọng của Trung Quốc cuối cùng cũng đang nhìn lên."
 china_events.364.a: "Những người theo chủ nghĩa liên bang đã làm được."

# Faction Joining Events
 china_events.401.t: "Trung Quốc xin gia nhập Quốc tế"
 china_events.401.d: "Mối quan hệ của chúng ta với Quốc dân đảng Trung Quốc quay trở lại Tái tổ chức đảng của họ năm 1924 khi chúng ta tiếp cận cố Tiến sĩ Tôn Dật Tiên để làm việc với Quốc dân đảng, vì chúng ta thấy phong trào Quốc dân đảng là phong trào duy nhất mà một nước Trung Quốc xã hội chủ nghĩa có thể xuất hiện. Chúng ta đã giúp đào tạo quân đội cách mạng của họ tại Hoàng Phố và trên hết, chúng ta đã tiếp nhận những người lưu vong của Quốc dân đảng như Uông Tinh Vệ sau sự sụp đổ của Cuộc viễn chinh phương Bắc đầu tiên.\n\nBây giờ nhiều năm sau, đầu tư của chúng ta vào Quốc dân đảng đã mang lại kết quả khi Quốc dân đảng đã thành công trong việc thống nhất Trung Quốc theo tín ngưỡng xã hội chủ nghĩa và hiện đã tiếp cận chúng ta để tham gia Quốc tế. Trích dẫn cam kết của họ để giúp đỡ những người khác bảo đảm giải phóng trong cuộc cách mạng thế giới cũng như mong muốn của họ để giúp chúng ta giám sát sự hủy diệt của trật tự thế giới Đức, họ đã yêu cầu chính thức được mời đến Quốc tế thứ ba. Trong khi chúng ta rất vui khi chấp nhận hợp tác với các đồng chí Trung Quốc của chúng ta, một thiểu số trong chính phủ của chúng ta nghi ngờ lý tưởng \" Đảng Nhà nước \" của Quốc dân đảng và đã cảnh báo chống lại làm việc với họ."
 china_events.401.a: "Cùng nhau, chúng ta sẽ giải phóng thế giới!"
 china_events.401.b: "Chúng quá không chính thống so với khẩu vị của chúng ta."

 china_events.402.t: "Trung Quốc gia nhập Quốc tế!"
 china_events.402.d: "Ứng dụng của chúng ta để tham gia Quốc tế đã được chứng minh là một thành công! Trong nhiều năm, chúng ta đã nợ Quốc tế thứ ba rất nhiều vì sự hỗ trợ, công nhận và viện trợ của họ trong việc giúp tổ chức và tài trợ cho Quốc dân đảng để chúng ta có thể giải phóng Trung Quốc khỏi các quân phiệt và đế quốc áp bức đất nước thân yêu của chúng ta. Với cuộc cách mạng cuối cùng của chúng ta thành công, đã đến lúc chúng ta trả lại nhiều năm hỗ trợ cho Quốc tế và viện trợ trong cuộc cách mạng thế giới chống lại trật tự thế giới tư bản và đế quốc của [GER.GetNameDef] . Cùng nhau, Quốc tế sẽ đoàn kết loài người và chúng ta sẽ phấn đấu vì sự tiến bộ xã hội chủ nghĩa của nhân loại mãi mãi!"
 china_events.402.a: "Cùng nhau hoàn thành cách mạng thế giới!"

 china_events.403.t: "Đơn xin gia nhập bị từ chối."
 china_events.403.d: "Bất chấp mong muốn hợp tác của chúng ta với Quốc tế thứ ba, thật không may - họ đã từ chối đơn xin gia nhập cuộc cách mạng toàn cầu của họ. Trích dẫn những khác biệt về ý thức hệ của chúng ta từ chủ nghĩa liên đới chính thống trong số những khác biệt khác, Quốc tế đã chính thức từ chối đơn xin gia nhập của chúng ta. Mặc dù điều này chắc chắn gây bực bội cho mối quan hệ thân thiết một thời của chúng ta với Quốc tế thứ ba, nhưng nó chứng minh với nhiều người trong chúng ta rằng bất kể ý thức hệ nào - phương Tây chỉ tìm cách làm việc với Trung Quốc vì lợi ích riêng của mình và không thực sự tìm cách thiết lập một mối quan hệ bình đẳng. Cho dù là tư bản hay xã hội chủ nghĩa, chúng ta khá rõ ràng rằng phương Tây vẫn được hướng dẫn bởi tư duy của chủ nghĩa đế quốc."
 china_events.403.a: "Bản chất đế quốc không bao giờ thay đổi."

 china_events.404.t: "Trung Quốc xin gia nhập Reichspakt"
 china_events.404.d: "Kể từ khi chúng ta can thiệp có lợi cho Chính phủ Bắc Kinh trong Cuộc viễn chinh phương Bắc cam chịu của Quốc dân đảng, chúng ta đã giữ mối quan hệ chặt chẽ với Trung Quốc cả về ngoại giao và kinh tế. Mặc dù đôi khi mong manh, đặc biệt là trong cuộc nổi dậy chống nhượng bộ gần như phá hủy sự cai trị của đồng minh chúng ta đối với Trung Quốc, nhưng nhờ sự giúp đỡ của chúng ta, họ đã vượt qua cuộc đấu tranh này và thống nhất Trung Quốc vì lợi ích chung.\n\nBây giờ, tìm kiếm sự hợp tác sâu sắc hơn, đại sứ Trung Quốc đã yêu cầu Trung Quốc chính thức gia nhập liên minh quân sự của chúng ta. Mặc dù nó có thể chứng minh lợi ích cho cả hai bên, chúng ta nhận thức được mối quan hệ chặt chẽ hơn như vậy có thể gây nguy hiểm cho an ninh của các khoản đầu tư của chúng ta vì Trung Quốc sẽ bị kéo vào bất kỳ cuộc chiến nào mà Đức tham gia. Tuy nhiên, đồng thời nó có thể cho chúng ta cơ hội bảo vệ tốt hơn lợi ích của chúng ta trong trường hợp có một cuộc tấn công bên ngoài chống lại Trung Quốc."
 china_events.404.a: "Một liên minh quân sự sẽ đảm bảo các khoản đầu tư của chúng ta."
 china_events.404.b: "Chúng ta không thể hủy hoại các khoản đầu tư của mình bằng cách liên minh với họ."

 china_events.405.t: "Trung Quốc gia nhập Reichspakt!"
 china_events.405.d: "Hôm nay, đại sứ [ROOT.getAdjective] tại Berlin đã gửi điện phản hồi của Đức về việc [ROOT.getNameDef] tham gia Reichspakt. Nhiều năm hợp tác quân sự và nhượng bộ kinh tế với người Đức đã mang lại kết quả - Trung Quốc cuối cùng đã chính thức được chấp nhận vào một liên minh quân sự với Đức.\n\nĐối với chính phủ trong [ROOT.Capital.GetCapitalVictoryPointName] ngày nay đánh dấu một bước ngoặt trong lịch sử. Liên minh quân sự là một bước tiến lớn đối với các cường quốc phương Tây chấp nhận Trung Quốc là một đối tác bình đẳng và do đó là một bước tiến lớn hướng tới kết thúc Thế kỷ khinh miệt."
 china_events.405.a: "Lính Đức và Trung Quốc hành quân bên cạnh nhau."

 china_events.406.t: "Đơn xin gia nhập bị từ chối."
 china_events.406.d: "Mặc dù đã thỏa hiệp và thừa nhận với người Đức trong nhiều năm, chính phủ ở Berlin hôm nay đã từ chối yêu cầu [ROOT.GetAdjective] tham gia Reichspakt. Họ trích dẫn những lo ngại về sự an toàn của các khoản đầu tư của Đức và ưu tiên mối quan hệ an ninh mơ hồ.\n\nĐáp lại, chính phủ chúng ta đã lên án Đức vì thái độ đế quốc đối với Trung Quốc nói rằng đó là một cú đánh lớn đối với người dân và chính phủ Trung Quốc. Tuy nhiên, trong một tuyên bố riêng biệt, họ khẳng định sẽ tiếp tục mối quan hệ mạnh mẽ với Đức bất chấp những sự kiện gần đây."
 china_events.406.a: "Bao năm rồi mà họ vẫn coi ta là những quân cờ!"

 china_events.407.t: "Trung Quốc xin gia nhập Hiệp ước Moskva"
 china_events.407.d: "Những thập kỷ gần đây chứng kiến Trung Quốc lao vào cuộc nội chiến bất tận, với phần lớn là của chính phủ nhà Thanh ở Bắc Kinh và Phượng Tộc được Nhật Bản hậu thuẫn đang nắm giữ trong pháo đài Mãn Châu của họ. Trong thời gian này, ảnh hưởng của chúng ta đã bị rớt xuống hoàn toàn ở ngoại ô Trung Quốc, chỉ có một số lực lượng có thể phục tùng ở Mông Cổ và Tân Cương sẵn sàng chống lại sự thống trị của đế quốc Đức và Nhật Bản trong khu vực. May mắn thay, khi quyền bá chủ của nhà Thanh sụp đổ, một chính phủ thân thiện đã có thể thiết lập quyền kiểm soát hoàn toàn đối với Trung Quốc. Với tình hình nội bộ của họ ổn định, chính phủ mới của Trung Quốc hy vọng sẽ bảo vệ mình khỏi Nhật Bản trỗi dậy hoặc tái xâm lược Đức thông qua việc chính thức tham gia liên minh quân sự của chúng ta. Mặc dù đây sẽ là một thỏa thuận cùng có lợi, nhưng có một số người coi liên minh Trung-Nga là mâu thuẫn với lợi ích Viễn Đông của chúng ta, và Trung Quốc có thể chứng minh là một gánh nặng."
 china_events.407.a: "Nga và Trung Quốc, những người bạn tốt!"
 china_events.407.b: "Số phận của Á - Âu chỉ thuộc về Nga và một mình Nga."

 china_events.408.t: "Trung Quốc gia nhập Hiệp ước Moskva!"
 china_events.408.d: "Người Nga đã trả lời đại sứ của chúng ta tại Moscow, chào đón chúng ta chính thức vào Hiệp định Moscow. Đây là một chiến thắng vĩ đại cho quốc gia Trung Quốc, vì một trong những cường quốc lớn của thế giới đã công nhận chúng ta trên cơ sở bình đẳng, và có lẽ Thế kỷ Khinh miệt cuối cùng đã ở phía sau chúng ta. Tất nhiên, vẫn còn những cường quốc khác sẽ không ngần ngại đưa chúng ta trở lại trạng thái tê liệt mà chúng ta đã ở chỉ vài năm trước, và chúng ta phải tiếp tục tiến lên và chiếm vị trí xứng đáng của chúng ta với tư cách là cường quốc Đông Á, và từ chối sự xâm lược tiếp tục của Đức và Nhật Bản chống lại chúng ta và phần còn lại của châu Á."
 china_events.408.a: "Nga và Trung Quốc thống nhất chống lại chủ nghĩa đế quốc!"

 china_events.409.t: "Đơn xin gia nhập bị từ chối"
 china_events.409.d: "Người Nga đã trả lời đại sứ của chúng ta tại Moscow, từ chối đơn chính thức của chúng ta với lý do lợi ích xung đột. Trong khi người Nga từ chối đơn của chúng ta, họ vẫn khẳng định việc tiếp tục mối quan hệ tốt đẹp giữa hai quốc gia của chúng ta. Bất kể, đây là một đòn lớn đối với nguyện vọng của chúng ta để đàm phán với các cường quốc trên thế giới trên cơ sở bình đẳng. Tuy nhiên, chúng ta phải tiếp tục phấn đấu cho một mối quan hệ bình đẳng với các cường quốc khác bất kể, vì số phận của chúng ta là trở thành cường quốc Đông Á, có hoặc không có sự thừa nhận của họ."
 china_events.409.a: "Bao năm rồi mà họ vẫn coi ta là những quân cờ!"

 china_events.410.t: "Trung Quốc xin gia nhập Khối Thịnh vượng chung"
 china_events.410.d: "Trong thời đại quân phiệt của Trung Quốc, chúng ta ủng hộ Phong Tộc như là chính phủ hợp pháp của toàn bộ Trung Quốc. Chính phủ của chúng ta thậm chí đã trực tiếp can thiệp vào Nội chiến Trung Quốc để hỗ trợ bạn bè của chúng ta trên đất liền. Tuy nhiên, tình hình chiến tranh không phát triển theo lợi thế của Nhật Bản, và chúng ta đã bị đẩy ra khỏi Trung Quốc, vì lợi ích mà chúng ta nghĩ. Tuy nhiên, thời gian hòa bình với chính phủ Trung Quốc cũng đã phát triển một tình huống độc đáo để hòa giải.\n\nTrước khi những hoàn cảnh đáng tiếc gây ra Chiến tranh Trung-Nhật, nhiều người ở cả Trung Quốc và Nhật Bản đã thúc đẩy hai quốc gia của chúng ta đoàn kết trong sự nghiệp của chủ nghĩa liên châu Á, nơi chúng ta sẽ làm việc cùng nhau để đẩy lùi các đế quốc châu Âu và giải phóng anh em châu Á bị áp bức của chúng ta. Các nhà tư tưởng chính trị như Ikki Kita hoan nghênh cuộc cách mạng Trung Quốc năm 1912, và nhiều sĩ quan quân đội cao cấp của Trung Quốc đã được giáo dục tại Nhật Bản.\n\nChính phủ Trung Quốc đã nhìn thấy sự khôn ngoan của một sáng kiến như vậy, và hôm nay đại sứ Trung Quốc đã gửi chính phủ của chúng ta cho một ứng dụng chính thức vào Sphere đồng thịnh vượng. Rõ ràng là từ giai điệu của họ tuy nhiên, rằng họ mong đợi được đối xử như một đối tác bình đẳng, và Nhật Bản không phải là người anh lớn của mối quan hệ này, như trường hợp giữa chúng ta và Thẩm Dương trong những năm 30. Một khẳng định như vậy sẽ là buồn cười trong quá khứ, nhưng Trung Quốc nổi lên như một sức mạnh thống nhất mới mà chúng ta không nên xem nhẹ."
 china_events.410.a: "Châu Á của người châu Á!"
 china_events.410.b: "Người Trung Quốc không ngang hàng với ta, và sẽ không bao giờ!"

 china_events.411.t: "Trung Quốc gia nhập Khối Thịnh vượng chung"
 china_events.411.d: "Người Nhật đã liên lạc với đại sứ của chúng ta, chính thức chào đón chúng ta vào Khối Thịnh vượng chung. Nhiều người sẽ thấy liên minh của chúng ta với người Nhật là không thể tưởng tượng được, vì chỉ một thời gian ngắn trước đây, họ là cường quốc đế quốc chính đang cố gắng ngăn chặn sự trỗi dậy của chúng ta. Tuy nhiên, họ quên đi lịch sử lâu dài của mối quan hệ giữa Trung Quốc và Nhật Bản. Chủ tịch Đoàn Kỳ Thụy và Hội An Huy của ông đã có một mối quan hệ hiệu quả với Tokyo, không mở rộng đến cấp độ chó săn của mối quan hệ Thẩm Dương-Tokyo trong những năm 30, và chúng ta sẽ đảm bảo rằng mối quan hệ mới của chúng ta với Tokyo sẽ không như trong thế kỷ 20 trước đó. Thay vào đó, hai quốc gia của chúng ta sẽ theo đuổi một mối quan hệ bình đẳng dựa trên lợi ích và hợp tác lẫn nhau. Cùng nhau, chúng ta sẽ trục xuất những đế quốc châu Âu một lần và mãi mãi! Châu Á cho người châu Á!"
 china_events.411.a: "Nhật Bản và Trung Quốc thống nhất chống lại chủ nghĩa đế quốc!"

 china_events.412.t: "Đơn xin gia nhập bị từ chối"
 china_events.412.d: "Người Nhật đã liên lạc với đại sứ của chúng ta, từ chối ứng dụng của chúng ta vào Sphere đồng thịnh vượng trên cơ sở lợi ích mâu thuẫn. Tokyo nhấn mạnh rằng họ vẫn muốn theo đuổi mối quan hệ tốt đẹp với chúng ta, và giải phóng Pan-Asian là một mục tiêu đáng khen ngợi. Chính phủ chúng ta đã tố cáo Tokyo cho rõ ràng giữ hận thù chống lại Trung Quốc để mất Chiến tranh Trung-Nhật và để đưa giải phóng Pan-Asian thứ hai trong ưu tiên cho nhỏ bé của họ. Rõ ràng từ sự tương tác này mà Nhật Bản vẫn quan tâm đến uy quyền trên châu Á, và họ vẫn bám tuyệt vọng vào dòng suy nghĩ ảo tưởng này. Cuối cùng, đó là điểm yếu của họ trên màn hình đầy đủ và Trung Quốc di chuyển trên từ sự cố này tất cả các mạnh hơn cho nó."
 china_events.412.a: "Lẽ ra chúng ta phải biết không nên tin người Nhật."

 china_events.413.t: "Trung Quốc xin gia nhập Entente"
 china_events.413.d: "Người Anh và người Pháp rất cần thiết để mở cửa Trung Quốc cho thương mại nước ngoài sau nhiều năm suy tàn và cô lập, mặc dù quá trình này không tốt đẹp: Thuốc phiện, Mũi tên và Chiến tranh Nghĩa Hòa Đoàn là tất cả các cuộc xung đột bạo lực giữa các quốc gia châu Âu và chính phủ Trung Quốc ốm yếu. Do hệ thống thương mại Quảng Châu cũ, ảnh hưởng của Pháp-Anh tập trung nhiều ở phía nam, đặc biệt là xung quanh Hồng Kông mặc dù ở đỉnh cao quyền lực của họ, Entente cũ đã có thể thực hiện ảnh hưởng trong Chính phủ Bắc Dương ở phía bắc và cũng thông qua kho trung chuyển lớn của Thượng Hải.\n\nTuy nhiên, các cuộc cách mạng trong năm 1920 đã buộc chúng ta phải ngồi lại ủng hộ người Đức, Nhật Bản và Mỹ. Trong khi đó, sự thống nhất của Trung Quốc đã chấm dứt ảnh hưởng trực tiếp còn lại của chúng ta trong khu vực. Nhưng may mắn thay, chính phủ mới của Trung Quốc (nhiều người được rút ra từ những người trung gian Quảng Đông cũ) đã chứng tỏ sẵn sàng đàm phán với chúng ta trong bối cảnh xung đột lớn này mà cả hai chúng ta thấy mình đang ở, giúp chúng ta khôi phục quan hệ tích cực mặc dù họ nhấn mạnh lần này nó phải được trên các điều khoản bình đẳng."
 china_events.413.a: "Thương mại sẽ lại tiếp tục chảy về phía Đông!"
 china_events.413.b: "Người Trung Quốc sẽ phải trả giá cho việc từ bỏ lời hứa của họ!"

 china_events.414.t: "Trung Quốc gia nhập Entente"
 china_events.414.d: "Mối quan hệ của Trung Quốc với Entente đã đá - Anh và Pháp được công chúng coi là đế quốc tối thượng và Chiến tranh Nha phiến bắt đầu một thế kỷ suy tàn bạo lực. Nhưng thương mại có một cách ràng buộc mọi người lại với nhau, và đặc biệt là ở Quảng Đông, một tầng lớp trung lưu thương gia giàu có mới không chỉ tìm thấy sự giàu có lớn mà còn cả quyền lực chính trị trong tình hình chính trị hậu Tân Hải và họ là những người cuối cùng đã thống nhất Trung Quốc. Đã phục hồi những tổn thất lãnh thổ tồi tệ nhất, cánh cửa dẫn đến một chương mới trong quan hệ của chúng ta chỉ mở ra một chút.\n\nMối quan tâm thực tế về các cuộc chiến tranh lẫn nhau của chúng ta với các cường quốc đã buộc cả hai bên phải nắm lấy cơ hội này, và do đó chúng ta đã được thông báo ngày hôm nay rằng Trung Quốc sẽ được nhận vào Cordial Entente. Nhấn mạnh rằng lần này chúng ta được đối xử bình đẳng, chúng ta hy vọng cho tình bạn lâu dài ngay cả khi điều đó có nghĩa là mạo hiểm cho phép ảnh hưởng của châu Âu trở lại. Hy vọng rằng trong việc liên kết với các cường quốc cũ, chúng ta sẽ có thể tạo ra một kỷ nguyên mới với Entente ở trung tâm của nó!"
 china_events.414.a: "Chúng ta trở lại hàng ngũ các cường quốc!"

 china_events.415.t: "Đơn xin gia nhập bị từ chối"
 china_events.415.d: "Các đại diện Entente đã liên lạc với đại sứ của chúng ta, từ chối ứng dụng của chúng ta vào [FROM.GetFactionName] trên cơ sở lợi ích mâu thuẫn. Họ nhấn mạnh rằng họ vẫn muốn theo đuổi mối quan hệ tốt đẹp với chúng ta và đảm bảo sự thịnh vượng lẫn nhau thông qua thương mại. Nhưng rõ ràng họ không coi chúng ta là bình đẳng, mà thay vào đó chỉ là một quốc gia khác bị bắt nạt và thống trị như họ đã làm trong một thế kỷ. Một khi các cuộc chiến tranh lẫn nhau của chúng ta kết thúc, họ có thể sẽ quay trở lại cố gắng khai thác chúng ta vì sự giàu có của chúng ta. Tuy nhiên, chúng ta phải tiếp tục phấn đấu cho một mối quan hệ bình đẳng với các cường quốc khác bất kể, vì số phận của chúng ta là trở thành cường quốc Đông Á, có hoặc không có sự thừa nhận của họ."
 china_events.415.a: "Bao năm rồi mà họ vẫn coi ta là những quân cờ!"

 china_events.416.t: "Trung Quốc tìm cách tham gia [ROOT.GetFactionName]"
 china_events.416.d: "Ảnh hưởng của Mỹ ở Trung Quốc bắt đầu ngay sau khi quốc gia chúng ta thành lập, với các lãnh sự được triển khai đến Quảng Châu vào đầu năm 1784. Quan hệ song phương chính thức bắt đầu với Hiệp ước Wangxia năm 1844 và thương mại giữa hai quốc gia nở rộ. Điều đó không có nghĩa là quan hệ luôn tích cực - Hoa Kỳ đã thúc ép các điều khoản thương mại thuận lợi và đặc quyền ngoại giao sau sự yếu kém của Trung Quốc trong Chiến tranh Nha phiến. Sự ủng hộ của Mỹ đối với Chính sách Mở cửa, cuối cùng phát triển thành việc tạo ra các Thành phố Công sứ trong những năm 1920 càng làm xấu đi mối quan hệ.\n\nTuy nhiên, sự sẵn sàng của Mỹ để đối trọng với các lĩnh vực ảnh hưởng của châu Âu và Nhật Bản luôn khiến chúng ta trở thành một đối tác hữu ích, và đến lượt một Trung Quốc mạnh mẽ, đồng minh với một đội quân trên bộ lớn để bổ sung (và không thể thách thức) sự thống trị hải quân của chúng ta được coi là điều cần thiết để tạo ra cơ sở hạ tầng an ninh ổn định ở Thái Bình Dương. Nhiều trí thức Trung Quốc đã học ở Mỹ nhờ vào Bồi thường Boxer, mang lại cho chúng ta một ảnh hưởng vượt trội trong chính phủ mới của họ. Vì chúng ta hiện đang liên minh trong một cuộc chiến tranh lớn, nên tự nhiên chúng ta sẽ làm sâu sắc thêm mối quan hệ của mình trong thời gian dài nhân danh dân chủ!"
 china_events.416.a: "Rồng và đại bàng mang hòa bình đến Thái Bình Dương!"
 china_events.416.b: "Về lâu dài, Trung Quốc là mối đe dọa cho lợi ích của chúng ta!"

 china_events.417.t: "Trung Quốc gia nhập [FROM.GetFactionName]"
 china_events.417.d: "Quan hệ Trung-Mỹ không phải lúc nào cũng tích cực - với người Mỹ lợi dụng sự yếu kém của Trung Quốc trong Thế kỷ khinh miệt để yêu cầu các điều khoản thương mại tống tiền, ngoại quyền và thúc đẩy Chính sách mở cửa - cuối cùng phát triển thành việc tạo ra các Thành phố Công sứ. Nhưng nó cũng có những khía cạnh tích cực, mối quan hệ của chúng ta bắt đầu gần như ngay lập tức sau khi thành lập nước Mỹ khi một Lãnh sự được triển khai đến Quảng Châu, thương mại lẫn nhau đã mang lại sự thịnh vượng, Bồi thường Boxer cho phép nhiều học giả của chúng ta học tập tại Hoa Kỳ và người Mỹ là một tấm séc có giá trị đối với ảnh hưởng của châu Âu và Nhật Bản trong khu vực.\n\nVì lợi ích giữ gìn hòa bình ở Thái Bình Dương, điều tự nhiên là chúng ta đồng minh nhân danh dân chủ. Với quân đội và hạm đội Mỹ của chúng ta, chúng ta sẽ giành chiến thắng trong cuộc chiến này và cùng nhau cảnh sát Thái Bình Dương với tư cách là đồng minh."
 china_events.417.a: "Rồng và đại bàng cùng tiến tới chiến thắng!"

 china_events.418.t: "Đơn xin gia nhập bị từ chối"
 china_events.418.d: "Người Mỹ đã liên lạc với đại sứ của chúng ta, từ chối ứng dụng của chúng ta vào [FROM.GetFactionName] trên cơ sở lợi ích mâu thuẫn. Washington nhấn mạnh rằng họ vẫn muốn theo đuổi mối quan hệ tốt đẹp với chúng ta, và đảm bảo sự thịnh vượng lẫn nhau thông qua thương mại. Nhưng rõ ràng họ không thấy chúng ta bình đẳng, mà thay vào đó chỉ là một quốc gia khác bị bắt nạt và thống trị như họ đã làm trong một thế kỷ. Một khi cuộc chiến tranh lẫn nhau của chúng ta kết thúc, họ có thể sẽ quay trở lại cố gắng khai thác chúng ta vì sự giàu có của chúng ta. Tuy nhiên, chúng ta phải tiếp tục phấn đấu cho một mối quan hệ bình đẳng với các cường quốc khác bất kể, vì số phận của chúng ta là trở thành cường quốc Đông Á, có hoặc không có sự thừa nhận của họ."
 china_events.418.a: "Bao năm rồi mà họ vẫn coi ta là những quân cờ!"

