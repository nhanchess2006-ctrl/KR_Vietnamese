 china_faction_alignment_desc: "Lãnh đạo: §Y [?global.china_alignment_leaders^alignment_i.GetName] §!\nCác nhóm liên kết với §Y [?global.china_alignment_leaders^alignment_i.GetName] §! :"
 china_no_faction_desc: "Các nhóm sau đây là độc lập. Di chuột qua các lá cờ để xem tình trạng liên kết của họ với chúng ta."
