 #Land Reform
 china_land_reform_decisions: "Cải cách ruộng đất toàn quốc"
 #Generic Description, use scripted loc for tag specific descs
 china_land_reform_decisions_desc: "Mặc dù chính phủ của chúng ta đã làm công việc đáng kể trong việc cải thiện hoàn cảnh của người dân Trung Quốc, thực tế là thời đại Warlord đã gây thiệt hại đáng kể cho nhiều bộ phận của đất nước và tăng trưởng còi cọc ở những người khác. Một số khu vực bị ảnh hưởng tồi tệ nhất là nông thôn trong tự nhiên, đã thấy rất ít lợi ích của quá trình công nghiệp hóa Trung Quốc đã trải qua một cách đau đớn trong vài thập kỷ qua. Sau nhiều năm rối loạn trong nước và bỏ bê chính phủ, nhiều người tiếp tục phải chịu đựng dưới ách luật thuê nhà không công bằng, thiết bị không đầy đủ, kỹ thuật lỗi thời, các thực thể săn mồi khác nhau và thiên tai.\n\nVới những chiến thắng trên chiến trường của chúng ta bây giờ đã giành được, tùy thuộc vào chúng ta để đối mặt với mặt trận tiếp theo trong tái thiết Trung Quốc và làm cho những chiến thắng đó có giá trị. Đã đến lúc chúng ta ghi dấu ấn ở vùng nông thôn Trung Quốc và giảm bớt sự đau khổ của người dân chúng ta."

 china_generic_land_reform_decision: "Thực hiện cải cách đất đai trong [FROM.GetName]"
 #Generic Description, use scripted loc for tag specific descs
 china_generic_land_reform_decision_desc: "Đã có nhiều nhà tư tưởng và lý thuyết gia đã đưa ra các giải pháp tiềm năng cho các vấn đề kéo dài hàng thập kỷ ở vùng nông thôn Trung Quốc. Sau khi thống nhất đất nước thành công dưới một biểu ngữ, chúng ta có đủ nguồn lực và sự ổn định để thực hiện một kế hoạch toàn diện để giải quyết những vấn đề này. Tất cả những gì cần thiết bây giờ là ý chí chính trị để thực hiện một nỗ lực như vậy trên quy mô lớn."

### Ideas ###
 unequal_treaties: "Các hiệp ước bất bình đẳng"
 CHN_calls_for_a_united_front_idea: "Lời kêu gọi thành lập Mặt trận Thống nhất"
 CHN_calls_for_a_united_front_idea_desc: "Sự bùng nổ của chiến tranh giữa một chính phủ Trung Quốc và các mối đe dọa nước ngoài đã dẫn đến một sự tuôn ra của tình cảm yêu nước trên toàn quốc. Có những lời kêu gọi rộng rãi cho các chính phủ Trung Quốc chiến tranh khác nhau để đặt sang một bên sự khác biệt của họ và hình thành một mặt trận thống nhất Trung Quốc trong tên của quốc phòng. Đối với bất kỳ phe phái nào được tìm thấy bên ngoài liên minh này, hậu quả chính trị có thể là thảm khốc.\n\n§R Chiến đấu chống lại Mặt trận Thống nhất sẽ dẫn đến hình phạt này còn lại trong suốt thời gian chiến tranh. §!"
 unite_china_justification_idea: "Trung Quốc thống nhất!"
 unite_china_justification_idea_desc: "Bây giờ chúng ta đã chiếm được thủ đô và thành lập một chính phủ Trung Quốc mới, chúng ta phải chinh phục các quân phiệt còn lại."
 league_collapse_idea_1: "Nhiệt huyết cách mạng"
 league_collapse_idea_1_desc: "Bây giờ Liên Minh đã tan vỡ và chiến tranh mở đã bắt đầu, các lực lượng của Nam Kinh đang hỗn loạn và buộc phải chiến đấu trên nhiều mặt trận chống lại kẻ thù của họ. Bây giờ là thời gian để chúng ta tấn công và đặt yêu sách đối với những gì đúng là của chúng ta!"
 league_collapse_idea_2: "Nam Kinh được tái tổ chức"
 league_collapse_idea_2_desc: "Những kẻ phản bội đã thất bại trong việc phá vỡ chúng ta bất chấp những điểm yếu của chúng ta, bây giờ là lúc để chúng ta tấn công trở lại và đòi lại những gì là của chúng ta!"
 china_foreign_support: "Hỗ trợ từ nước ngoài"
 china_foreign_support_desc: "Do thành công của chúng ta trong chiến tranh, một phái đoàn nước ngoài đã được gửi đến để giúp chúng ta nhìn thấu chiến thắng của mình."
 china_desertions_common: "Đào ngũ tràn lan"
 china_desertions_common_desc: "Một chuỗi thất bại đã dẫn đến ngày càng nhiều người đàn ông từ chối chiến đấu, đôi khi gia nhập quân đội để nhận quần áo mới và bán chúng ở chợ gần nhất."
