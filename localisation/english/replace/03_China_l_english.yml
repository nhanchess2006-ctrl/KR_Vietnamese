 china_mio_arsenal_integration_decision_category: "Xây dựng ngành công nghiệp quốc phòng nội địa Trung Quốc"
 china_mio_arsenal_integration_decision_category_desc: "Một trong số ít những tia hy vọng của nhiều thập kỷ nội chiến là chi tiêu quân sự nặng nề đã xây dựng một nền tảng vững chắc cho một tổ hợp công nghiệp quân sự hiện đại. Tuy nhiên, nhiều rào cản vẫn còn. Bên cạnh những nghi phạm tham nhũng, thiếu kinh nghiệm và gián đoạn thời chiến thông thường, binh lính Trung Quốc trong lịch sử đã được trang bị các thiết kế nước ngoài, nếu không phải là nhập khẩu hoàn toàn từ nước ngoài, kìm hãm sự phát triển của ngành công nghiệp vũ khí trong nước. Hơn nữa, hầu hết các kho vũ khí rộng lớn của Trung Quốc đều bị phân cấp mạnh và tích hợp kém, một sản phẩm của chủ nghĩa khu vực quân phiệt. Khi chúng ta tiến tới thống nhất, chúng ta phải làm việc để nắm bắt và đồng bộ hóa các trung tâm sản xuất quân sự này, giải phóng toàn bộ tiềm năng của gã khổng lồ công nghiệp Trung Quốc!"

