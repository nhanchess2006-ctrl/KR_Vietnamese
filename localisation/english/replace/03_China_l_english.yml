 china_anti_stalemate_idea_2: "Tinh thần suy sụp"
 china_anti_stalemate_idea_2_desc: "[THIS.GetLeader] 's thất bại trong việc mang lại một kết thúc quyết định cho chiến tranh đã dẫn đến sự sụp đổ hoàn toàn và hoàn toàn của tinh thần giữa các cấp bậc. Ngày qua ngày, những người lính đặt vũ khí xuống hoặc chuyển sang cướp bóc, để nguyên nhân của chúng ta cho số phận của nó."
 china_motivated_soldiers: "Binh sĩ đầy quyết tâm"
 defend_nanjing_ANQ: "Phòng thủ Nam Kinh"
 defend_nanjing_ANQ_desc: "\" Găng tay \" của kẻ ngốc dường như đã được đền đáp! Sau khi chiếm được Thủ đô phía Nam, chỉ còn là vấn đề thời gian trước khi Trần đảm bảo tham vọng của mình với tư cách là Nguyên soái Liên minh mới. Người dân sẽ không bị ảnh hưởng bởi lợi ích nước ngoài nữa, cũng như Qi Xieyuan sẽ tiếp tục cắm răng vào Liên minh.\nMiễn là Nam Kinh nằm trong tầm tay của [ROOT.GetLeader], chúng ta sẽ giữ lại những ảnh hưởng của tinh thần này trong suốt thời gian Chiến tranh Liên minh. §R Tuy nhiên, Nam Kinh sẽ rơi khỏi tay chúng ta, chúng ta sẽ mất tinh thần này! §!\n\nTuy nhiên, chúng ta vẫn chiếm thế thượng phong."
 defend_nanjing_CHI: "Phòng thủ Nam Kinh"
 defend_nanjing_CHI_desc: "Đó là một ngày vinh quang cho dân tộc Trung Quốc! Không chỉ có Mặt trời trắng quản lý để tiến xa hơn khu vực nổi dậy MinGan, Quân đội Cách mạng Quốc gia tự hào đã bảo đảm thành công thủ đô được chọn của Guofu, Tiến sĩ Sun. Với Thủ đô phía Nam được bảo đảm, quốc gia chắc chắn sẽ theo sau.\nMiễn là Nam Kinh nằm trong tầm tay của [ROOT.GetLeader], chúng ta sẽ giữ lại những ảnh hưởng của tinh thần này trong suốt thời gian Chiến tranh Liên minh. §R Tuy nhiên, Nam Kinh sẽ rơi khỏi tay chúng ta, chúng ta sẽ mất tinh thần này! §!\n\nTuy nhiên, chúng ta vẫn chiếm thế thượng phong."
 defend_nanjing_LEP: "Phòng thủ Nam Kinh"
 defend_nanjing_LEP_desc: "Bị bao vây từ mọi phía và bị kẻ thù bao vây cả bên trong lẫn bên ngoài, Liên minh vẫn giữ được hai thế mạnh: kiểm soát Thủ đô phía Nam, và Wusheng Lianjun dũng cảm, hiện đại và kiểu mẫu. Thống chế Liên minh không thể cho phép những kẻ nhạo báng ngớ ngẩn như vậy cùng nhau chọn áo choàng hợp pháp của mình!\nMiễn là Nam Kinh nằm trong tầm tay của [ROOT.GetLeader], chúng ta sẽ giữ lại những ảnh hưởng của tinh thần này trong suốt thời gian Chiến tranh Liên minh. §R Tuy nhiên, Nam Kinh sẽ rơi khỏi tay chúng ta, chúng ta sẽ mất tinh thần này! §!\n\nTuy nhiên, chúng ta vẫn chiếm thế thượng phong."
 defend_nanjing_SHD: "Phòng thủ Nam Kinh"
 defend_nanjing_SHD_desc: "Trong một biến cố gây tò mò nhất, có vẻ như đó không phải là Chen Tiaoyuan, Thống chế Liên minh cũng như những kẻ cấp tiến Quốc dân đảng hèn hạ đã tìm cách bảo vệ Thủ đô phía Nam. Thay vào đó là [ROOT.GetLeader] và các cán bộ trung thành của ông! Dưới sự giám sát của ông, một Chính trị phương Đông mới sẽ trỗi dậy ...\nMiễn là Nam Kinh nằm trong tầm tay của [ROOT.GetLeader], chúng ta sẽ giữ lại những ảnh hưởng của tinh thần này trong suốt thời gian Chiến tranh Liên minh. §R Tuy nhiên, Nam Kinh sẽ rơi khỏi tay chúng ta, chúng ta sẽ mất tinh thần này! §!\n\nTuy nhiên, chúng ta vẫn chiếm thế thượng phong."

