### Ideas ###
 india_reconstruction: "Tái thiết Ấn Độ"
 india_reconstruction_desc: "Lần thứ hai trong thế kỷ này, Ấn Độ lại thấy mình bị tàn phá bởi sự kinh hoàng của nội chiến, với các thành phố và thị trấn lớn giờ đây không hơn gì một cái vỏ của chính mình trong quá khứ. Tuy nhiên, không giống như lần trước, Ấn Độ đã thấy mình thống nhất một lần nữa, và người ta hy vọng rằng với đủ thời gian và nỗ lực, cuối cùng nó có thể phục hồi sau sự tàn phá này."
 india_reconstruction_resistance: "Kháng cự Thống nhất"
 india_reconstruction_resistance_desc: "Ngay cả khi quốc gia giờ đây đã thống nhất, vẫn có nhiều người trong Ấn Độ từ chối công nhận quyền lực của chính phủ mới, kháng cự mọi nỗ lực khôi phục trật tự bằng bất kỳ cách nào họ có thể. Mặc dù không có khả năng gây ra một mối đe dọa có tổ chức chống lại sự cai trị của họ, việc dập tắt sự bất mãn này phải được [ROOT.GetNameDef] đặt làm ưu tiên hàng đầu, cho dù thông qua hòa giải hay đàn áp."

### Tooltips ###
 india_will_seize_ceylon_if_germany_at_war: "Ceylon sẽ bị đánh chiếm nếu tiêu điểm này được chọn trong khi Đức đang sa lầy vào một cuộc chiến tranh lớn."
 india_activate_integration_decisions_tooltip: "§YCác quyết định bổ sung sẽ được mở khóa để đẩy nhanh việc tích hợp các bang được thu hồi.§!"
 india_demobilisation_tt: "Quốc gia của chúng ta sẽ bắt đầu giải ngũ, trở lại §YNền kinh tế Dân sự§! và §YChỉ Tuyển quân Tự nguyện§!."

### Shared Decisions ###

 india_invade_tawang_decision: "Yêu cầu [858.GetName]"
 india_invade_tawang_decision_desc: "Trong sự hỗn loạn ban đầu dẫn đến sự sụp đổ của quyền thống trị của Anh đối với Ấn Độ, lãnh thổ biên giới [858.GetName] đã rơi vào sự chiếm đóng của các nhà cai trị địa phương. Giờ đây khi tiểu lục địa một lần nữa được thống nhất, đã đến lúc tìm kiếm sự khôi phục các biên giới thích hợp của quốc gia."
 india_invade_aksai_chin_decision: "Yêu cầu [897.GetName]"
 india_invade_aksai_chin_decision_desc: "Toàn bộ Kashmir là một phần của Ấn Độ, bất chấp bất kỳ yêu sách nào của Trung Quốc ngược lại, và điều này đương nhiên mở rộng đến phần phía bắc nhất của khu vực vốn đã không may rơi vào sự chiếm đóng của nước ngoài. Do đó, một yêu cầu nên được gửi đến [FROM.GetName] để yêu cầu họ rút khỏi khu vực để cuối cùng nó có thể hoàn toàn nằm dưới sự quản lý của [ROOT.GetAdjective]."
 india_tackle_resistance_decision: "Giải quyết Sự kháng cự"
 india_tackle_resistance_decision_desc: "Ngay cả khi Ấn Độ thống nhất, vẫn có vô số người cay đắng về thất bại của họ, sẵn sàng đẩy quốc gia trở lại sự hỗn loạn nếu họ có cơ hội làm điều đó. Chúng ta phải dành các nguồn lực đáng kể để đảm bảo rằng những người bất đồng chính kiến này được giải quyết, sử dụng cả củ cà rốt và cây gậy khi cần thiết."
 india_increase_integration_efforts_in_state_decision: "Tăng cường Nỗ lực Tích hợp tại [FROM.GetName]"
 india_increase_integration_efforts_in_state_decision_desc: "Mặc dù với đủ thời gian, những người cựu binh của chúng ta trên mặt đất sẽ đảm bảo rằng [FROM.GetName] được tích hợp đúng cách vào quốc gia được khôi phục, nhưng có thể là khôn ngoan khi gửi thêm sự trợ giúp cho họ để đẩy nhanh các nỗ lực tích hợp này, đặc biệt là ở các khu vực quan trọng hơn của đất nước."

 india_reintegration_category: "Thống nhất lại Ấn Độ"

### Shared Events ###

 india_events.1.t: "Lựa chọn Thủ đô cho [ROOT.GetNameDef]"
 india_events.1.d.RAJ: "Với việc Ấn Độ cuối cùng đã thống nhất, đã đến lúc tái thiết và quyết định xem chúng ta muốn thủ đô của đất nước ở đâu. Trong khi Lahore đã phục vụ tốt cho chúng ta, có thể là khôn ngoan khi chuyển đến Delhi, nơi công việc vĩ đại đã diễn ra trước cuộc cách mạng để biến nó thành một thủ đô phù hợp cho quốc gia. Ngoài ra, chúng ta có thể trở lại Calcutta, thủ đô cũ của Ấn Độ thuộc Anh, nơi thời kỳ phát triển công nghiệp dưới thời Cộng hòa Nhân dân Bharatiya và sự gần gũi với bờ biển có thể là một tài sản hữu ích cho thương mại của Ấn Độ với phần còn lại của thế giới. Trong khi đó, Bombay luôn là một trong những thành phố công nghiệp nhất trên tiểu lục địa, và không giống như Delhi hay Calcutta, sự thiếu hụt thay đổi cách mạng dưới thời các hoàng thân có thể dẫn đến sự khôi phục suôn sẻ hơn nhiều của bộ máy chính quyền cũ nếu được chọn làm thủ đô.\n\nTuy nhiên, chúng ta có thể đơn giản chọn ở lại Lahore, nơi vẫn là thủ đô tạm thời của chúng ta, trong khi chúng ta từ từ tích hợp phần còn lại của đất nước và loại bỏ các yếu tố phản động và cực đoan."
 india_events.1.d.HND: "Với việc Ấn Độ cuối cùng đã thống nhất, đã đến lúc tái thiết và quyết định xem chúng ta muốn thủ đô của đất nước ở đâu. Chúng ta có thể chọn Delhi, nơi mặc dù nỗ lực bất thành nhằm biến nó thành trái tim mới của chính quyền thuộc địa, thành phố vẫn là một trung tâm hậu cần tuyệt vời cho khu vực. Trong khi đó, Bombay luôn là một trong những thành phố công nghiệp nhất trên tiểu lục địa, và là nơi mà chủ nghĩa xã hội có thể dễ dàng bén rễ.\n\nMặc dù chuyển đến một trong những địa điểm này có thể giúp dấy lên sự ủng hộ từ nhân dân, nhưng họ vẫn chưa hiểu hết lợi ích của chủ nghĩa xã hội dưới thời lãnh đạo của chúng ta, [ROOT.GetLeader]. Ở lại Calcutta, quê hương của cuộc cách mạng, cũng sẽ mang tính biểu tượng cho các thế hệ mai sau."
 india_events.1.d.PRF: "Với việc Ấn Độ cuối cùng đã thống nhất, đã đến lúc tái thiết và quyết định xem chúng ta muốn thủ đô của đất nước ở đâu. Chúng ta có thể chọn Delhi, tên gọi trùng với quốc gia Hồi giáo từng cai trị phần lớn Ấn Độ, một di sản được tiếp nối bởi Đế quốc Mughal; giờ đây, đến lượt chúng ta khẳng định yêu sách đó. Ngoài ra, chúng ta có thể chọn Lahore, nơi từng là thủ đô tạm thời của Ấn Độ thuộc Anh và nắm giữ vị thế tương đương trong các di sản vĩ đại của các thời đại đã qua.\n\nỞ lại Hyderabad cũng có thể là một lựa chọn phù hợp, nơi hàng thập kỷ đầu tư đã mang lại các dịch vụ công mới, các tổ chức giáo dục và tài chính bên cạnh cơ sở hạ tầng hiện đại cần thiết cho một thủ đô hiện đại. Sự kháng cự tiềm ẩn có thể phải đối mặt ở Lahore hoặc Delhi bởi những người vẫn từ chối tương lai của tiểu lục địa cũng làm cho Hyderabad trở thành một lựa chọn phù hợp, mặc dù cuối cùng theo thời gian sự kháng cự đó không có khả năng kéo dài."
 india_events.1.a: "Thủ đô cũ, Delhi."
 india_events.1.b: "Hãy trở lại thủ đô Bengal cũ."
 india_events.1.c: "Đã đến lúc Bombay tỏa sáng."
 india_events.1.e: "Thành phố vĩ đại Lahore sẽ phục vụ tốt cho chúng ta."
 india_events.1.d: "Hãy ở lại nơi chúng ta đang ở hiện tại."

 india_events.8.t: "Kẻ Xâm lược Nước ngoài Chiếm đóng Ấn Độ"
 india_events.8.d: "Thảm họa đã ập đến, khi có vẻ như cuộc nội chiến đã cho phép những kẻ cơ hội nhảy vào và chiếm đóng lãnh thổ hợp pháp của Ấn Độ. Chúng ta không còn lựa chọn nào khác ngoài việc đánh đuổi chúng bằng vũ lực, và quân đội đang được chuẩn bị để thực hiện cuộc tiến công này."
 india_events.8.a: "Chúng ta phải trục xuất kẻ xâm lược!"
 india_events.8.b: "Chúng ta phải nhượng đất cho chúng."

 india_events.10.t: "Sự Tàn phá Ấn Độ"
 india_events.10.d: "Cuối cùng, cuộc chiến bắt đầu từ hơn một thập kỷ trước cuối cùng đã đi đến hồi kết, nhưng chiến thắng này không hề vinh quang. Quốc gia giờ đây nằm trong đống đổ nát, với hàng ngàn người chết, nhà cửa biến thành gạch vụn, và những gì còn lại của nền kinh tế Ấn Độ nằm trong cảnh xơ xác. Tồi tệ hơn, cuộc chiến chưa thực sự kết thúc, khi nhiều người vẫn trung thành với các chính phủ giả tạo từ chối buông khí giới và chấp nhận trạng thái nguyên trạng mới. Mặc dù một cuộc đấu tranh vĩ đại giờ đây đã ở phía sau chúng ta, rõ ràng là một cuộc đấu tranh vĩ đại mới để phục hồi sau xung đột này giờ đây đã bắt đầu."
 india_events.10.a: "Ít nhất quốc gia đã nguyên vẹn trở lại, những gì còn lại của nó dù sao đi nữa."

 india_events.50.t: "Giải quyết Vấn đề Nepal"
 india_events.50.d.claimless: "Sau sự sụp đổ của Raj, [NEP.GetNameDef] đã gửi quân vào nhiều khu vực biên giới để ủng hộ các đồng minh Anh của họ, ngăn không cho chúng rơi vào tay Cộng hòa. Mặc dù họ không còn kiểm soát các lãnh thổ bị chiếm giữ này, nhưng các hành động thù địch rõ ràng của họ khi chiếm chúng ngay từ đầu đã khiến nhiều người lo lắng họ có thể thực hiện các hành động xâm phạm xa hơn chống lại chúng ta trong tương lai nếu có cơ hội. Do đó, có đề xuất rằng chúng ta gửi cho họ một thông điệp, gây áp lực đòi kiểm soát hoàn toàn các công việc của Nepal, đồng thời lịch sự thông báo cho họ điều gì có thể xảy ra nếu họ từ chối yêu cầu hòa bình và hợp lý của chúng ta."
 india_events.50.d.claims: "Sau sự sụp đổ của Raj, [NEP.GetNameDef] đã gửi quân vào nhiều khu vực biên giới để ủng hộ các đồng minh Anh của họ, ngăn không cho chúng rơi vào tay Cộng hòa. Ngay cả bây giờ, khi Ấn Độ thống nhất trở lại, họ vẫn giữ lấy các lãnh thổ này, từ chối trả lại cho chủ sở hữu hợp pháp. Có vẻ như Nepal sẽ cần phải được \"thúc đẩy\" để thực sự trả lại đất đai, và do đó đã có đề xuất gửi ngay cho họ một thông điệp làm rõ điều gì sẽ xảy ra, cũng như có khả năng đi xa hơn và yêu cầu kiểm soát hoàn toàn các công việc của Nepal để ngăn chặn bất kỳ sự cố lặp lại nào xảy ra."
 india_events.50.a: "Yêu cầu trả lại các quận bị chiếm đóng!"
 india_events.50.b: "Đòi các quận và thúc ép một chính phủ thân thiện!"
 india_events.50.c: "Thúc ép một chính phủ thân thiện!"
 india_events.50.e: "Cho phép các biên giới hiện tại tiếp tục đổi lấy một liên minh."
 india_events.50.f: "Nepal không đáng để bỏ nỗ lực."

 india_events.51.t: "Những Yêu cầu của [From.GetNameDef]"
 india_events.51.d.return: "Một thông điệp đã được nhận hôm nay từ [FROM.GetNameDef], với mối đe dọa rõ ràng được ám chỉ xuyên suốt. Họ đã yêu cầu chúng ta nhượng lại cho họ tất cả các lãnh thổ mà họ tuyên bố là của Ấn Độ, và có vẻ như họ sẽ không chấp nhận câu trả lời không. Có vẻ như chúng ta được để lại với một lựa chọn khó khăn."
 india_events.51.d.govt: "Một thông điệp đã được nhận hôm nay từ [FROM.GetNameDef], với mối đe dọa rõ ràng được ám chỉ xuyên suốt. Đưa ra tuyên bố sai lầm rằng nền độc lập của Nepal đặt ra mối đe dọa cho quốc gia Ấn Độ, họ đã yêu cầu kiểm soát hoàn toàn các công việc của chính phủ chúng ta, và sự công nhận chính thức của biên giới giữa chúng ta rất có lợi cho họ. Họ rõ ràng không có ý định chấp nhận câu trả lời không, và do đó chúng ta được để lại với một lựa chọn khó khăn về cách phản ứng với mối đe dọa này."
 india_events.51.a: "Chúng ta không có lựa chọn nào khác ngoài tuân thủ."
 india_events.51.b: "Nepal sẽ bảo vệ chủ quyền của mình!"

 india_events.52.t: "Nepal Quy phục"
 india_events.52.d.return: "Không còn nhiều lựa chọn, chính phủ [From.GetAdjective] đã trả lại lãnh thổ của chúng ta về quyền kiểm soát của chúng ta."
 india_events.52.d.govt: "Không còn nhiều lựa chọn, chính phủ [From.GetAdjective] đã hoàn toàn phục tùng quyền lực của chúng ta, dập tắt mọi mối đe dọa tiếp theo mà họ đặt ra cho chúng ta."
 india_events.52.a: "Còn nghi ngờ gì nữa sao?"

 india_events.53.t: "Nepal Từ chối!"
 india_events.53.d: "Đáng kinh ngạc, Nepal đã từ chối yêu cầu của chúng ta, nói rằng nếu chúng ta muốn \"phá hủy chủ quyền của Nepal\" thì chúng ta sẽ phải làm điều đó bằng vũ lực!"
 india_events.53.a: "Vậy thì chiến tranh!"
 india_events.53.b: "Có lẽ để lúc khác..."

 india_events.54.t: "Một Liên minh với Ấn Độ?"
 india_events.54.d: "Trong khi nhiều người mong đợi thông điệp nhận được hôm nay từ [FROM.GetNameDef] là một mối đe dọa chiến tranh hoặc yêu cầu khuất phục, thay vào đó họ đã gửi một lời đề nghị cho chúng ta, yêu cầu một liên minh giữa hai quốc gia chúng ta để đổi lấy việc hoạch định ranh giới chính thức giữa chúng ta để phù hợp với trạng thái nguyên trạng hiện tại. Mặc dù trước đó chúng ta đã tuyên bố trung lập về vấn đề Ấn Độ trước những nỗ lực ảnh hưởng đến chúng ta của họ, [FROM.GetNameDef] không dính dáng đến sự bất ổn mà chúng ta từng đối mặt trước đây, và do đó chúng ta có thể xem xét đồng ý với yêu cầu này; nó chắc chắn tốt hơn các giải pháp thay thế mà họ có thể theo đuổi."
 india_events.54.a: "Lời đề nghị của họ là hợp lý, hãy chấp nhận nó."
 india_events.54.b: "Trung lập có nghĩa là trung lập!"

 india_events.55.t: "Nepal Đồng ý Liên minh"
 india_events.55.d: "Nhận ra lý lẽ trong yêu cầu của chúng ta, quốc vương Nepal đã đến [ROOT.Capital.GetCapitalVictoryPointName] hôm nay để ký kết chính thức một hiệp ước giữa hai quốc gia chúng ta. Hãy hy vọng đây là sự khởi đầu cho một sự hợp tác có thành quả."
 india_events.55.a: "Nâng cốc chúc mừng những người bạn Nepal của chúng ta."

 india_events.56.t: "Nepal Từ chối Liên minh"
 india_events.56.d: "Bất chấp lời đề nghị trước đó của chúng ta có lợi cho họ đến mức nào, chính phủ Nepal đã từ chối mọi yêu cầu về một liên minh, tuyên bố sự cam kết hoàn toàn của họ đối với sự trung lập. Với các vấn đề giữa hai quốc gia chúng ta vẫn chưa được giải quyết, và người Nepal rõ ràng không sẵn lòng giải quyết chúng theo cách dễ dàng, chúng ta có thể muốn xem xét một phương pháp khác để giải quyết chúng... "
 #Options shared with india_events.50

 india_events.60.t: "[From.GetNameDefCap] Tước đoạt Lãnh thổ Ấn Độ!"
 india_events.60.d: "Trong khi chúng ta đang bận rộn với cuộc chiến của mình, các binh lính [From.GetAdjective] đã tràn vào các lãnh thổ của chúng ta ở Ấn Độ Dương và nắm quyền kiểm soát các lực lượng địa phương của chúng ta gần như trước khi họ kịp nhấc một ngón tay. [From.GetNameDefCap] tuyên bố các lãnh thổ này là hợp pháp của họ, và vào lúc này có vẻ như có rất ít điều chúng ta có thể làm về nó... ngoại trừ việc tuyên chiến trắng trợn."
 india_events.60.a: "Sự xúc phạm này sẽ không không được đáp trả!"
 india_events.60.b: "Điều này có nghĩa là chiến tranh!"

 india_events.61.t: "[From.GetNameDefCap] và Sự trả lại các Thuộc địa Ấn Độ của chúng ta"
 india_events.61.d: "Chính phủ [From.GetAdjective] vừa đề xuất một thỏa thuận chuyển giao một số lãnh thổ mà chúng ta cướp được sau sự sụp đổ của Raj thuộc Anh trở lại cho [From.GetNameDef]. Đây có thể là một cách tốt để cải thiện quan hệ với chính phủ quốc gia, nhưng cũng có thể tạo ra một tiền lệ nguy hiểm ở các thuộc địa khác của chúng ta."
 india_events.61.a: "Bàn giao các quần đảo cho người Ấn Độ."
 india_events.61.b: "Không, các căn cứ hải quân này rất quan trọng đối với Hải quân Đế quốc Đức."

 india_events.62.t: "Sự Chuyển giao các Thuộc địa Đức"
 india_events.62.d: "Chúng ta đã thuyết phục thành công người Đức trả lại một số thuộc địa bị Đế chế chiếm giữ sau khi Raj sụp đổ. Đây vừa là một dấu hiệu vĩ đại của tình hữu nghị Ấn-Đức, nhưng cũng là bằng chứng cho thấy chúng ta thực sự đã thu được sự ủy quyền với tư cách là người kế thừa hợp pháp của người Anh. Vinh quang cho Ấn Độ!"
 india_events.62.a: "Sáp nhập các quần đảo vào quốc gia chúng ta!"
 india_events.62.b: "Trao cho Ceylon quyền tự trị nội bộ rộng rãi và sáp nhập các đảo san hô."

 india_events.63.t: "[From.GetNameDefCap] Đã Từ chối"
 india_events.63.d: "Đại diện từ chính phủ [From.GetAdjective] đã thông báo cho chúng ta rằng việc trả lại các lãnh thổ Ấn Độ Dương đơn giản là không thể, vì chúng rất quan trọng đối với Hải quân Đế quốc Đức."
 india_events.63.a: "Tôi hiểu rồi..."

 india_events.65.t: "[From.GetNameDefCap] Chiếm giữ [seized_state.GetName]!"
 india_events.65.d: "Các binh lính [From.GetAdjective] đã tràn vào [seized_state.GetName] sáng nay và nắm quyền kiểm soát các lực lượng địa phương của chúng ta gần như trước khi họ kịp nhấc một ngón tay. [From.GetNameDefCap] tuyên bố [seized_state.GetName] là lãnh thổ hợp pháp của Ấn Độ, và vào lúc này có vẻ như có rất ít điều chúng ta có thể làm về nó."
 india_events.65.a: "Những kẻ cơ hội này!"
 india_events.65.b: "Sự xúc phạm này sẽ không không được đáp trả!"

 india_events.70.t: "[FROM.GetNameDefCap] Yêu cầu [858.GetName]"
 india_events.70.d: "Với tiểu lục địa Ấn Độ giờ đây một lần nữa được thống nhất bởi [FROM.GetNameDef], họ đã bắt đầu tìm kiếm sự khôi phục hoàn toàn các biên giới cũ của mình, và đã yêu cầu lãnh thổ biên giới [858.GetName] phải được chuyển giao cho họ. Mặc dù một tuyên bố như vậy hoàn toàn sai kịch bản, có vẻ như một cường quốc trỗi dậy như vậy sẽ không đơn giản bỏ qua vấn đề nếu bị từ chối, và có thể sẽ tìm cách thực thi yêu sách của họ thông qua chiến tranh; phải quyết định xem quốc gia có được chuẩn bị cho một khả năng như vậy hay không."
 india_events.70.a: "Chúng ta không có lựa chọn nào khác ngoài tuân thủ"
 india_events.70.b: "Chúng ta sẽ không nhượng lại bất cứ điều gì cho những kẻ bạo chúa này!"

 india_events.71.t: "[FROM.GetNameDefCap] Đồng ý Trả lại [858.GetName]"
 india_events.71.d: "Một phản hồi đã được nhận từ [FROM.GetName], và họ đã thông minh quyết định tuân thủ hòa bình và đã đồng ý trả lại lãnh thổ bị chiếm đóng [858.GetName] cho sự cai trị của [ROOT.GetAdjective]."
 india_events.71.a: "Thật tốt khi họ đã nhận ra lý lẽ."

 india_events.72.t: "[FROM.GetNameDefCap] Từ chối Trả lại [858.GetName]"
 india_events.72.d: "Vi phạm chủ quyền của [ROOT.GetAdjective] đối với khu vực, [FROM.GetName] đã từ chối trả lại [858.GetName] và đã làm rõ ý định duy trì sự chiếm đóng của họ đối với nó. Có vẻ như giờ đây đã đến lúc hỗ trợ lời nói của chúng ta bằng vũ lực, hoặc đầu hàng khu vực cho sự chiếm đóng vĩnh viễn của họ."
 india_events.72.a: "Có vẻ như vũ lực là lựa chọn duy nhất còn lại."
 india_events.72.b: "Không đáng để đánh một cuộc chiến vì một tranh chấp nhỏ như vậy."

 india_events.75.t: "[FROM.GetNameDefCap] Yêu cầu [897.GetName]"
 india_events.75.d: "Với tiểu lục địa Ấn Độ giờ đây một lần nữa được thống nhất bởi [FROM.GetNameDef], họ đã bắt đầu tìm kiếm sự khôi phục hoàn toàn các biên giới cũ của mình, và đã yêu cầu lãnh thổ biên giới [897.GetName] phải được chuyển giao cho họ. Mặc dù một tuyên bố như vậy là sai kịch bản, có vẻ như một cường quốc trỗi dậy sẽ không đơn giản bỏ qua vấn đề nếu bị từ chối; nó có thể sẽ tìm cách thực thi yêu sách của họ thông qua chiến tranh, và phải quyết định xem quốc gia có được chuẩn bị cho một khả năng như vậy hay không."
 india_events.75.a: "Chúng ta không có lựa chọn nào khác ngoài tuân thủ"
 india_events.75.b: "Chúng ta sẽ không nhượng lại bất cứ điều gì cho những kẻ bạo chúa này!"

 india_events.76.t: "[FROM.GetNameDefCap] Đồng ý Trả lại [897.GetName]"
 india_events.76.d: "Một phản hồi đã được nhận từ [FROM.GetName], và họ đã thông minh quyết định tuân thủ hòa bình và đã đồng ý trả lại lãnh thổ bị chiếm đóng [897.GetName] cho sự cai trị của [ROOT.GetAdjective]."
 india_events.76.a: "Thật tốt khi họ đã nhận ra lý lẽ."

 india_events.77.t: "[FROM.GetNameDefCap] Từ chối Trả lại [897.GetName]"
 india_events.77.d: "Vi phạm chủ quyền của [ROOT.GetAdjective] đối với khu vực, [FROM.GetName] đã từ chối trả lại [897.GetName] và đã làm rõ ý định duy trì sự chiếm đóng của họ đối với nó. Có vẻ như giờ đây đã đến lúc hỗ trợ lời nói của chúng ta bằng vũ lực, hoặc đầu hàng khu vực cho sự chiếm đóng vĩnh viễn của họ."
 india_events.77.a: "Có vẻ như vũ lực là lựa chọn duy nhất còn lại."
 india_events.77.b: "Không đáng để đánh một cuộc chiến vì một tranh chấp nhỏ như vậy."

 india_events.80.t: "[From.GetNameDefCap] Yêu cầu các Quận Miến Điện của Chúng ta"
 india_events.80.d: "Chính phủ [From.GetAdjective] đáng nguyền rủa đang yêu cầu trả lại lãnh thổ Miến Điện mà chúng ta đã 'xoa dịu' trong sự sụp đổ của Raj. Đây là một sự thể hiện hành vi tồi tệ đáng hổ thẹn!"
 india_events.80.a: "Chẳng ích gì khi chiến đấu vì các tỉnh vô dụng này."
 india_events.80.b: "Chúng tôi không biết về các quận 'Miến Điện' nào; đây là Xiêm - một và không thể chia cắt!"
 india_events.80.c: "Tập hợp các đồng minh của chúng ta để phòng thủ!"
 india_events.80.e: "Tập hợp thiên chủ của chúng ta để phòng thủ!"

 india_events.81.t: "[From.GetNameDefCap] Quy phục"
 india_events.81.d: "Chính phủ [From.GetAdjective] đã khôn ngoan nhượng bộ các yêu cầu của chúng ta và trả lại toàn bộ lãnh thổ Miến Điện bị chiếm đóng."
 india_events.81.a: "Một động thái khôn ngoan."

 india_events.82.t: "Những Yêu cầu của Chúng ta về Miến Điện của [From.GetAdjective] bị Từ chối"
 india_events.82.d: "Những yêu cầu rất hợp lý được trình bày bởi đặc sứ của chúng ta tới chính phủ [From.GetAdjective] đã bị bác bỏ hoàn toàn! Giờ đây chúng ta phải lựa chọn liệu có ép buộc các yêu sách của mình bằng sức mạnh quân sự hay chịu thất bại ngoại giao, cả trong nước và quốc tế. Ánh mắt của toàn bộ đất nước đang hướng về nội các của chúng ta!"
 india_events.82.a: "Vậy thì chúng ta sẽ giải phóng Bán đảo Mã Lai bằng vũ lực!"
 india_events.82.b: "Nuốt sự tự tôn của chúng ta và từ bỏ các yêu sách của mình."

 india_events.83.t: "[demand_country.GetNameDefCap] Đe dọa [From.GetNameDef]"
 india_events.83.d: "Chính phủ [demand_country.GetAdjective] trỗi dậy đang thúc đẩy sửa đổi biên giới giữa các tỉnh Miến Điện của họ và các tỉnh của đồng minh [From.GetAdjective] của chúng ta. Đây là một tình huống khó khăn xét đến thực tế là các khu vực do [From.GetNameDef] chiếm giữ đã bị lấy bằng vũ lực, nhưng sẽ không thể bỏ rơi các đồng minh của chúng ta ở Đông Dương..."
 india_events.83.a: "Tuyên bố sự đoàn kết của chúng ta với các đồng minh ở Băng Cốc!"
 india_events.83.b: "Gây áp lực buộc người Xiêm nhượng lại các quận tranh chấp."

 india_events.84.t: "[From.GetNameDefCap] Bảo vệ [SIA.GetNameDef]"
 india_events.84.d: "Đáng nguyền rủa! Những kẻ Xiêm hèn nhát đã trốn dưới váy của các đồng minh [From.GetAdjective] của họ. Những gì chúng ta nghĩ đã là một sự sửa đổi đơn giản của một sự chiếm đóng bất hợp pháp đã biến thành một xung đột quốc tế! Điều này có thể hơi quá so với những gì chúng ta đã yêu cầu, nhưng hậu quả của việc từ bỏ các yêu sách của chúng ta cũng sẽ rất thảm hại."
 india_events.84.a: "Vậy thì chúng ta sẽ giải phóng Bán đảo Mã Lai bằng vũ lực!"
 india_events.84.b: "Một cuộc chiến như vậy sẽ chỉ mang lại sự hỗn loạn cho toàn bộ Châu Á..."

 india_events.85.t: "[From.GetNameDefCap] Đã Phản bội Chúng ta!"
 india_events.85.d: "Chính phủ [From.GetAdjective] đã gửi một thông điệp nói rằng họ không có ý định bảo vệ chúng ta khỏi các yêu cầu của [demand_country.GetNameDef], xét đến việc chúng ta đã có được lãnh thổ bằng vũ lực ngay từ đầu. Họ nghiêm khắc gợi ý chúng ta trả lại các vùng đất Miến Điện theo yêu cầu."
 india_events.85.a: "Vậy thì chúng ta sẽ tự mình chiến đấu với những kẻ xâm lược này!"
 india_events.85.b: "Nhượng lại các lãnh thổ tranh chấp."

 india_events.86.t: "Đòi lại Tỉnh Biên giới Tây Bắc"
 india_events.86.d: "Chiến tranh Anh-Afghan lần thứ tư được nhiều người coi là một vết hoen ố đối với quốc gia, khi người Afghan xảo quyệt tấn công Ấn Độ vào lúc yếu nhất và giật lãnh thổ khỏi nó. Với quốc gia một lần nữa phần lớn nguyên vẹn, vấn đề lãnh thổ do Afghan chiếm đóng giờ đây là vấn đề chúng ta phải xem xét. Đòi lại Tỉnh Biên giới Tây Bắc sẽ tương đối dễ dàng thông qua sự can thiệp quân sự, và có lẽ họ thậm chí có thể hàng mà không cần chiến đấu, tuy nhiên khu vực này khó có thể chào đón sự chinh phục lại của chúng ta với vòng tay mở rộng. Có thể đơn giản là đáng để họ giữ nó, thay vì cố gắng tích hợp lại lãnh thổ thù địch với chúng ta."
 india_events.86.a: "Biên giới phải được trả lại ngay lập tức!"
 india_events.86.b: "Lãnh thổ đó vô giá trị, hãy để họ giữ lấy."

 india_events.87.t: "Ấn Độ Yêu cầu Biên giới"
 india_events.87.d: "Như nhiều người đã lo sợ, sự thống nhất của Ấn Độ cuối cùng đã dẫn đến việc người Ấn Độ bắt đầu trở nên nóng nảy về chiến thắng của chúng ta đối với họ trong Chiến tranh Anh-Afghan lần thứ tư. Họ đã gửi một tập hợp các yêu cầu, chủ yếu thúc đẩy chúng ta từ bỏ sự \"chiếm đóng\" của chúng ta đối với Biên giới, và cho phép sự chinh phục của nó bởi những kẻ xâm lược Ấn Độ."
 india_events.87.a: "Chúng ta sẽ không nhượng lại một inch đất nào của người Pashtun."
 india_events.87.b: "Chúng ta có lựa chọn nào khác ngoài việc đầu hàng?"

 india_events.88.t: "Afghanistan Thách thức"
 india_events.88.d: "Đúng như dự đoán, [AFG.Capital.GetCapitalVictoryPointName] vẫn thách thức, và từ chối chấm dứt sự chiếm đóng của họ đối với Tỉnh Biên giới. Có vẻ như nếu chúng ta muốn hoàn toàn thống nhất lại, xâm lược sẽ là lựa chọn duy nhất của chúng ta."
 india_events.88.a: "Sự tự tôn của họ sẽ là sự sụp đổ của họ."
 india_events.88.b: "Bạn biết đấy, điều này không đáng để bỏ nỗ lực."

 india_events.89.t: "Afghanistan Trả lại Biên giới"
 india_events.89.d: "Đáng kinh ngạc, thay vì đưa ra một cuộc chiến, chính phủ ở [AFG.Capital.GetCapitalVictoryPointName] đã đầu hàng và bỏ trống Tỉnh Biên giới. Binh lính của chúng ta đã nhanh chóng bắt đầu tiến vào, bắt đầu con đường dài để khôi phục trật tự trong khu vực."
 india_events.89.a: "Ồ, giờ đây không dũng cảm như vậy khi đó là một cuộc chiến công bằng phải không?"

### News Events ###
 india_events.100.RAJ_title: "Chiến thắng của Lãnh địa"
 india_events.100.PRF_title: "Chiến thắng của Liên bang"
 india_events.100.HND_title: "Chiến thắng của Cộng hòa Nhân dân Bharatiya"
 india_events.100.Bombay_title: "[PRF.GetNameDefCap] Gia nhập Lãnh địa"
 india_events.100.RAJ_desc: "Kể từ khi Thế chiến kết thúc, tiểu lục địa Ấn Độ đã bị chia thành ba phe: tàn dư trung thành của Raj thuộc Anh, những người xã hội chủ nghĩa của Đại hội Dân tộc Ấn Độ, và các hoàng thân Ấn Độ phản động từ chối cả hai bên.\n\nVới việc bụi cuối cùng đã lắng xuống, những người trung thành đã chứng tỏ sự thắng lợi và Lãnh địa Ấn Độ giờ đây cai trị không ai phản đối trên khu vực, tự thiết lập để trở thành một cường quốc thế giới nổi bật một khi phục hồi sau sự tàn phá của cuộc nội chiến."
 india_events.100.PRF_desc: "Kể từ khi Thế chiến kết thúc, tiểu lục địa Ấn Độ đã bị chia thành ba phe: tàn dư trung thành của Raj thuộc Anh, những người xã hội chủ nghĩa của Đại hội Dân tộc Ấn Độ, và các hoàng thân Ấn Độ phản động từ chối cả hai bên.\n\nVới việc bụi cuối cùng đã lắng xuống, những người phản động đã chứng tỏ sự thắng lợi và Liên bang Toàn Ấn Độ giờ đây cai trị không ai phản đối trên khu vực, thiết lập quốc gia trở thành một cường quốc thế giới nổi bật một khi phục hồi sau sự tàn phá của cuộc nội chiến."
 india_events.100.HND_desc: "Kể từ khi Thế chiến kết thúc, tiểu lục địa Ấn Độ đã bị chia thành ba phe: tàn dư trung thành của Raj thuộc Anh, những người xã hội chủ nghĩa của Đại hội Dân tộc Ấn Độ, và các hoàng thân Ấn Độ phản động từ chối cả hai bên.\n\nVới việc bụi cuối cùng đã lắng xuống, những người xã hội chủ nghĩa đã chứng tỏ sự thắng lợi và Cộng hòa Nhân dân Bharatiya giờ đây cai trị không ai phản đối trên khu vực, tự thiết lập để trở thành một cường quốc thế giới nổi bật một khi phục hồi sau sự tàn phá của cuộc nội chiến."
 india_events.100.Bombay_desc: "Kể từ khi Thế chiến kết thúc, tiểu lục địa Ấn Độ đã bị chia thành ba phe: tàn dư trung thành của Raj thuộc Anh, những người xã hội chủ nghĩa của Đại hội Dân tộc Ấn Độ, và các hoàng thân Ấn Độ phản động từ chối cả hai bên.\n\nVới sự sụp đổ của Cộng hòa xã hội chủ nghĩa, nhiều người mong đợi xung đột xa hơn sẽ nổ ra giữa hai bên ký kết liên minh \"Hiệp ước Bombay\" về tương lai của tiểu lục địa. Mặc dù vậy, trong một sự chuyển biến bất ngờ của các sự kiện, [PRF.GetNameDef] đã đồng ý hòa bình gia nhập Lãnh địa, kết thúc một thập kỷ xung đột bằng lời nói thay vì đạn dược. Lãnh địa Ấn Độ giờ đây cai trị không ai phản đối trên khu vực, tự thiết lập để trở thành một cường quốc thế giới nổi bật một khi phục hồi sau sự tàn phá của cuộc nội chiến."
 india_events.100.RAJ_option: "Raj lại bắt đầu nữa sao?"
 india_events.100.PRF_option: "Sự cai trị của các hoàng thân sẽ không bao giờ kết thúc."
 india_events.100.HND_option: "Một sự giải phóng từ bên dưới."
 india_events.100.Bombay_option: "Nội chiến và diễn ngôn dân sự, Ấn Độ có tất cả."

 india_events.101.t: "Kaisar-i-Hind"
 india_events.101.d: "Nizam cai trị của Liên bang Toàn Ấn Độ, Osman Ali Khan, hôm nay đã tự tuyên bố mình là người kế thừa hợp pháp chiếc áo khoác của Kaisar-i-Hind - một tước hiệu trước đây chỉ được mang bởi các hoàng đế Mughal và Anh của tiểu lục địa.\n\nSau lễ đăng quang của mình tại một đại lễ ở Delhi, tân hoàng đế đã tuyên bố đầy chiến thắng rằng quốc gia cuối cùng đã đòi lại vị thế đúng đắn của mình trên thế giới, và rằng ông sẽ hướng dẫn nó đến một tương lai vĩ đại mới. Trong khi được cổ vũ bởi những người ủng hộ, nhiều người coi đây là không hơn gì một hành động phô trương của Osman để củng cố thêm cái tôi của chính mình."
 india_events.101.a: "Thật phô trương!"

 india_events.102.chairman: "[HND.GetLeader] Được Bầu làm Chủ tịch Bharatiya"
 india_events.102.chairwoman: "[HND.GetLeader] Được Bầu làm Nữ Chủ tịch Bharatiya"
 india_events.102.intro: "Sau sự tái thống nhất, Chủ tịch Bharatiya Abul Kasem Fazlul Huq đã tuyên bố nghỉ hưu khỏi vị trí này, hy vọng phó của ông là Jawaharlal Nehru kế vị ông. Ngay sau đó, hàng năm trời làm chính trị phe phái trong Đại hội Dân tộc Ấn Độ cuối cùng đã đạt đến đỉnh điểm, với các lãnh đạo của hai phe phái chính khác trong đảng thách thức sự ứng cử của Nehru."
 india_events.102.bose: "$india_events.102.intro$\n\nSau nhiều tuần chiến dịch bầu cử nóng hổi, các thành viên của INC đã từ chối sự ứng cử của Nehru, và thay vào đó đã chọn lãnh đạo Maximist Subhas Chandra Bose làm chủ tịch mới của họ. Cuộc bầu cử của Bose đã được giải thích như một tín hiệu rõ ràng rằng ngay cả khi quốc gia giờ đây đã thống nhất, INC không có ý định kiềm chế chủ nghĩa quân phiệt chính trị của mình, với chính phủ mới dự kiến sẽ mở rộng đáng kể dựa trên nó."
 india_events.102.nehru: "$india_events.102.intro$\n\nSau nhiều tuần chiến dịch bầu cử nóng hổi, Nehru đã thành công trong việc đánh bại những kẻ thách thức của mình, với việc đảng chọn ông làm Chủ tịch mới của họ. Cuộc bầu cử của Nehru đã được giải thích như một tín hiệu rõ ràng rằng Cộng hòa sẽ khẳng định lại sự cam kết của mình đối với sự nghiệp xã hội chủ nghĩa toàn cầu, và tiếp tục đi theo hướng công đoàn chính thống."
 india_events.102.naidu: "$india_events.102.intro$\n\nSau nhiều tuần chiến dịch bầu cử nóng hổi, các thành viên của INC đã từ chối sự ứng cử của Nehru, và thay vào đó đã chọn lãnh đạo Nông nghiệp Sarojini Naidu làm nữ chủ tịch mới của họ. Cuộc bầu cử của Naidu đã được giải thích như một tín hiệu rõ ràng về mong muốn của INC trở lại với tư tưởng Gandhian và các niềm tin tư tưởng tự trồng, hòa hợp cùng nhau với các lý tưởng xã hội chủ nghĩa."
 india_events.102.a: "Thú vị đấy."

 india_events.103.t: "Nội chiến Ấn Độ Bắt đầu lại"
 india_events.103.d: "Nội chiến Ấn Độ, nổ ra vào năm 1925 khi Đế quốc Anh tan rã, đã đỉnh điểm trong một lệnh ngừng bắn vào năm 1927 bế tắc tiểu lục địa. Giờ đây, có vẻ như lệnh ngừng bắn cuối cùng đã bị phá vỡ, với các hành động thù địch bắt đầu lại giữa Cộng hòa Nhân dân Bharatiya xã hội chủ nghĩa, và các bên ký kết chống xã hội chủ nghĩa của Hiệp ước Bombay, Lãnh địa Ấn Độ và [PRF.GetName].\n\nXung đột bao gồm hàng trăm triệu người của Ấn Độ, với mỗi bên chiến đấu đều có những người hỗ trợ nước ngoài. Bất kể kết quả của nó ra sao, chắc chắn rằng xung đột tái bùng phát này sẽ là một trong những cuộc chiến đẫm máu nhất của thế kỷ hai mươi."
 india_events.103.a: "Lại một cuộc nội chiến nữa sao?" #General
 india_events.103.b: "Chúng ta phải hỗ trợ Lãnh địa!" #Entente
 india_events.103.c: "Đây sẽ là một đòn tử hình đối với chủ nghĩa thực dân!" #Socialist