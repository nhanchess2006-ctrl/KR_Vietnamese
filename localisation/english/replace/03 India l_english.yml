 SKM_tashi_namgyal: "Tashi Namgyal"
 SKM_tashi_namgyal_advisor_desc: "§YSinh ngày:§! §L26 tháng 10, 1893, tại Tây Tạng, Đại Thanh§!\n§YTiểu sử:§! §L$SKM_tashi_namgyal_bio$ cựu Chogyal đã sinh sống tại Bhutan cùng phần lớn tài sản của mình, hy vọng rằng vào thời điểm thích hợp ông sẽ có thể khôi phục lại vương quốc của mình.§!"
 SKM_tashi_namgyal_leader_desc: "§YSinh ngày:§! §L26 tháng 10, 1893, tại Tây Tạng, Đại Thanh§!\n§YTiểu sử:§! §L$SKM_tashi_namgyal_bio$ Chogyal đã tị nạn tại Bhutan, chờ đợi thời cơ để quay trở lại vương quốc của mình.\n\nSau khi được phục vị Chogyal, Tashi Namgyal dự định sẽ cai trị hòa bình, chỉ đơn thuần hạ mình hướng tới việc tăng cường khả năng tiếp cận giáo dục và chăm sóc sức khỏe cho người Sikkim.§!"
 SKM_tashi_namgyal_bio: "Được giáo dục tại Trường St. Pauls ở Darjeeling và sau đó là Trường Cao đẳng Mayo danh tiếng ở Ajmer, Tashi Namgyal đã kế vị người anh cùng cha khác mẹ của mình vào tháng 12 năm 1914. Ông được Đạt Lai Lạt Ma thứ 13 đăng quang và cai trị hòa bình Vương quốc Sikkim nhỏ bé trong hơn một thập kỷ sau đó. Bị người Nepal trục xuất khỏi quê hương vào năm 1926, vị"
